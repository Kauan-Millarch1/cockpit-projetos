<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit de Projetos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#F7F9FB; --line:#DCE2E9; --line-soft:#E8EDF2;
    --ink:#121821; --ink-2:#47546A; --muted:#7B8798;
    --accent:#B4700E; --accent-dim:#EFE0C6;
    --ok:#2C7F53; --ok-bg:#DFF0E7; --warn:#A9740B; --warn-bg:#F6E9CE;
    --risk:#B14A26; --risk-bg:#F7E1D8; --cold:#64707F; --cold-bg:#E5E9EE;
    --radius:10px;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0D1218; --surface:#151C25; --surface-2:#1B242F; --line:#26313E; --line-soft:#1F2833;
      --ink:#E7ECF3; --ink-2:#A6B2C2; --muted:#6E7C8D;
      --accent:#EDAB4B; --accent-dim:#3A2E18;
      --ok:#56C18A; --ok-bg:#16301F; --warn:#E4B155; --warn-bg:#322611;
      --risk:#E9805A; --risk-bg:#341C13; --cold:#7E8DA0; --cold-bg:#1E262F;
    }
  }
  :root[data-theme="dark"]{--bg:#0D1218;--surface:#151C25;--surface-2:#1B242F;--line:#26313E;--line-soft:#1F2833;--ink:#E7ECF3;--ink-2:#A6B2C2;--muted:#6E7C8D;--accent:#EDAB4B;--accent-dim:#3A2E18;--ok:#56C18A;--ok-bg:#16301F;--warn:#E4B155;--warn-bg:#322611;--risk:#E9805A;--risk-bg:#341C13;--cold:#7E8DA0;--cold-bg:#1E262F;}
  :root[data-theme="light"]{--bg:#F1F3F6;--surface:#FFFFFF;--surface-2:#F7F9FB;--line:#DCE2E9;--line-soft:#E8EDF2;--ink:#121821;--ink-2:#47546A;--muted:#7B8798;--accent:#B4700E;--accent-dim:#EFE0C6;--ok:#2C7F53;--ok-bg:#DFF0E7;--warn:#A9740B;--warn-bg:#F6E9CE;--risk:#B14A26;--risk-bg:#F7E1D8;--cold:#64707F;--cold-bg:#E5E9EE;}

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  .num { font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  h1,h2,h3 { text-wrap:balance; }

  .shell { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
  .rail { border-right:1px solid var(--line); background:var(--surface); padding:20px 14px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand { display:flex; align-items:baseline; gap:8px; padding:0 8px; }
  .brand b { font-size:17px; letter-spacing:-0.02em; }
  .brand span { font-size:11px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
  .navgroup { display:flex; flex-direction:column; gap:2px; }
  .navgroup h4 { margin:0 0 6px 8px; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 9px; border-radius:7px; border:0; width:100%; background:transparent; color:var(--ink-2); font:inherit; font-size:14px; text-align:left; cursor:pointer; }
  .nav:hover { background:var(--surface-2); color:var(--ink); }
  .nav[aria-current="true"] { background:var(--accent-dim); color:var(--ink); font-weight:600; }
  .nav .count { font-family:var(--font-num); font-size:12px; color:var(--muted); }
  .railfoot { margin-top:auto; padding:0 8px; font-size:11.5px; color:var(--muted); line-height:1.6; }

  .btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .btn:hover { background:var(--surface-2); }
  .btn.primary { border-color:var(--accent); color:var(--accent); font-weight:600; }

  .main { padding:22px 26px 60px; min-width:0; }
  .head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .head h1 { margin:0; font-size:22px; letter-spacing:-0.02em; }
  .head p { margin:3px 0 0; color:var(--muted); font-size:13px; }
  .stamp { display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-2); border:1px solid var(--line); background:var(--surface); padding:5px 10px; border-radius:999px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }

  .strip { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px 12px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .kpi .label { font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .kpi .value { font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:30px; line-height:1.1; letter-spacing:-0.03em; }
  .kpi .sub { font-size:12px; color:var(--ink-2); }
  .kpi.is-warn .value { color:var(--warn); }
  .kpi.is-risk .value { color:var(--risk); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px 15px; margin-bottom:16px; }
  .panel > h3 { margin:0 0 2px; font-size:13px; }
  .panel > .cap { margin:0 0 11px; font-size:12px; color:var(--muted); }

  .bar { display:flex; gap:2px; height:26px; }
  .bar > button { border:0; padding:0; cursor:pointer; border-radius:3px; min-width:3px; font:inherit; font-size:11px; font-family:var(--font-num); color:#fff; display:flex; align-items:center; justify-content:center; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:11px; font-size:12px; color:var(--ink-2); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width:9px; height:9px; border-radius:2px; flex:none; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .search { flex:1 1 220px; min-width:0; padding:8px 11px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; }
  select { padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px 14px; display:flex; flex-direction:column; gap:10px; border-top:3px solid var(--edge,var(--cold)); text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card h3 { margin:0; font-size:15px; letter-spacing:-0.01em; overflow-wrap:anywhere; }
  .pill { flex:none; font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .metrics { display:flex; gap:18px; flex-wrap:wrap; }
  .metric { display:flex; flex-direction:column; }
  .metric b { font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:19px; font-weight:500; letter-spacing:-0.02em; }
  .metric small { font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); }
  .track { height:5px; border-radius:3px; background:var(--line-soft); overflow:hidden; }
  .track > i { display:block; height:100%; border-radius:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { font-size:11px; padding:2.5px 7px; border-radius:5px; border:1px solid var(--line); color:var(--ink-2); background:var(--surface-2); }
  .chip.off { color:var(--muted); opacity:0.55; text-decoration:line-through; }
  .note { font-size:12px; color:var(--ink-2); margin:0; }

  .empty, .loading, .failed { grid-column:1/-1; text-align:center; padding:44px 20px; border:1px dashed var(--line); border-radius:var(--radius); color:var(--muted); }
  .empty b, .loading b, .failed b { display:block; color:var(--ink-2); font-size:15px; margin-bottom:4px; }
  .failed { border-color:var(--risk); color:var(--risk); }
  .failed code { display:block; margin-top:8px; font-size:12px; color:var(--ink-2); }

  /* ---- detail ---- */
  .crumb { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .path { font-family:var(--font-num); font-size:11.5px; color:var(--muted); overflow-wrap:anywhere; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

  .checks { display:flex; flex-direction:column; gap:8px; }
  .check { display:grid; grid-template-columns:auto 1fr; gap:10px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); }
  .check i { width:3px; border-radius:2px; background:var(--cold); }
  .check b { display:block; font-size:13.5px; font-weight:600; }
  .check span { font-size:12.5px; color:var(--ink-2); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:0 8px 6px 0; }
  td { padding:5px 8px 5px 0; border-top:1px solid var(--line-soft); vertical-align:top; overflow-wrap:anywhere; }
  .scroll { overflow-x:auto; }

  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; font-family:var(--font-num); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }

  .compbar { display:flex; align-items:center; gap:10px; font-size:12.5px; margin-bottom:6px; }
  .compbar .lbl { flex:0 0 34%; overflow-wrap:anywhere; }
  .compbar .rail2 { flex:1; height:8px; border-radius:4px; background:var(--line-soft); overflow:hidden; }
  .compbar .rail2 > i { display:block; height:100%; background:var(--accent); border-radius:4px; }
  .compbar .n { flex:none; color:var(--muted); }

  details > summary { cursor:pointer; font-size:13px; color:var(--ink-2); }
  pre { background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:11px 12px; overflow-x:auto; font-family:var(--font-num); font-size:12px; line-height:1.5; margin:9px 0 0; white-space:pre-wrap; }

  @media (max-width:1100px) { .strip { grid-template-columns:repeat(3,1fr); } .cols { grid-template-columns:1fr; } }
  @media (max-width:820px) {
    .shell { grid-template-columns:1fr; }
    .rail { position:static; height:auto; flex-direction:row; align-items:center; gap:10px; overflow-x:auto; padding:12px 14px; border-right:0; border-bottom:1px solid var(--line); }
    .rail .navgroup { flex-direction:row; gap:6px; }
    .rail .navgroup h4, .railfoot { display:none; }
    .nav { width:auto; white-space:nowrap; border:1px solid var(--line); padding:7px 11px; min-height:40px; }
    .main { padding:16px 14px 48px; }
    .strip { grid-template-columns:repeat(2,1fr); gap:8px; }
    .kpi .value { font-size:26px; }
    .grid { grid-template-columns:1fr; }
    .head h1 { font-size:19px; }
    .compbar .lbl { flex:0 0 44%; }
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="rail">
    <div class="brand"><b>Cockpit</b><span>projetos</span></div>
    <div class="navgroup" id="nav-status"><h4>Saúde</h4></div>
    <div class="navgroup">
      <h4>Varredura</h4>
      <button class="btn" id="refresh">Atualizar varredura</button>
    </div>
    <div class="railfoot" id="railfoot"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================================
   MODELO DE SAÚDE — toda a opinião do cockpit mora neste bloco.
   O servidor entrega fatos; nada além daqui julga um projeto.
   ========================================================================= */

const BANDS = [
  { key:"ativo",   label:"Ativo",   maxDays:14,       color:"var(--ok)",   bg:"var(--ok-bg)",   fg:"var(--ok)" },
  { key:"atencao", label:"Atenção", maxDays:45,       color:"var(--warn)", bg:"var(--warn-bg)", fg:"var(--warn)" },
  { key:"parado",  label:"Parado",  maxDays:120,      color:"var(--risk)", bg:"var(--risk-bg)", fg:"var(--risk)" },
  { key:"frio",    label:"Frio",    maxDays:Infinity, color:"var(--cold)", bg:"var(--cold-bg)", fg:"var(--cold)" }
];

const WEIGHTS = { momentum:60, documented:25, versioned:15 };

// Arquivos que a máquina escreve sozinha. Não contam como sinal de trabalho humano.
const GENERATED = /(^|\/)(logs?|cache|tmp|\.cache|graphify-out|dist|build)\//i;
const GENERATED_EXT = /\.(log|lock|tmp|bak)$/i;
const isGenerated = p => GENERATED.test(p) || GENERATED_EXT.test(p);

function daysBetween(a, b) {
  return Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000);
}

function computeHealth(p, today) {
  const days = p.lastTouch ? daysBetween(today, p.lastTouch) : null;
  const empty = p.files === 0;

  const momentum   = days === null ? 0 : Math.max(0, 100 - (days / 180) * 100);
  const documented = (p.claudeMd || p.readme) ? 100 : 0;
  const versioned  = p.git ? 100 : 0;

  let score = (momentum * WEIGHTS.momentum + documented * WEIGHTS.documented + versioned * WEIGHTS.versioned) / 100;
  if (empty) score = 0;

  const band = empty ? BANDS[3] : BANDS.find(b => days <= b.maxDays);
  return { days, empty, score: Math.round(score), band };
}

function diagnose(p, h) {
  if (h.empty) return "Pasta vazia. Arquivar ou começar de fato.";
  if (h.days > 120) return "Sem toque há " + h.days + " dias. Decidir: retomar ou arquivar.";
  if (!p.claudeMd && !p.readme) return "Sem CLAUDE.md nem README — um agente abre isto sem contexto nenhum.";
  if (!p.git) return "Fora do git. Nenhuma alteração é reversível.";
  if (h.days > 45) return "Parado há " + h.days + " dias, mas documentado. Retomada é barata.";
  if (h.days > 14) return "Esfriando. " + h.days + " dias desde o último toque.";
  return "Em movimento.";
}

/* Pontos a verificar dentro do projeto. Derivados dos fatos do servidor. */
function buildChecks(d, today) {
  const c = [];
  const add = (level, title, detail) => c.push({ level, title, detail });
  const days = d.lastTouch ? daysBetween(today, d.lastTouch) : null;

  if (d.files === 0) add("risk", "Pasta vazia", "Nenhum arquivo. Arquivar ou começar de fato.");

  // Atividade real vs ruído de máquina
  const humano = d.recent.find(f => !isGenerated(f.path));
  const gerado = d.recent[0] && isGenerated(d.recent[0].path);
  if (gerado && humano) {
    add("warn", "Atividade recente é de arquivo gerado",
      "O arquivo mais novo é " + d.recent[0].path + ". Último toque humano: " +
      humano.mtime.slice(0,10) + " (" + daysBetween(today, humano.mtime.slice(0,10)) + " dias) em " + humano.path + ".");
  }

  if (!d.docs.claudeMd && !d.docs.readmeName)
    add("risk", "Sem contexto para agente", "Não existe CLAUDE.md nem README. Qualquer agente que abrir esta pasta começa do zero.");
  else if (!d.docs.claudeMd)
    add("info", "Sem CLAUDE.md", "Existe " + d.docs.readmeName + ", mas nenhuma instrução dedicada a agente.");

  if (!d.git.isRepo) {
    add(d.files > 50 ? "risk" : "warn", "Fora do git",
      d.files + " arquivos sem versionamento. Nenhuma alteração é reversível e não há histórico.");
  } else {
    if (d.git.uncommitted > 0)
      add(d.git.uncommitted > 30 ? "risk" : "warn", d.git.uncommitted + " arquivos sem commit",
        "Trabalho fora do histórico. Último commit: " + (d.git.commits[0]?.date || "desconhecido") + ".");
    if (!d.git.remote)
      add("warn", "Repositório só nesta máquina", "Sem remote configurado. Perder o disco perde o projeto.");
  }

  if (d.flags.envFile && !d.flags.gitignoreCoversEnv)
    add("risk", "Arquivo .env fora do .gitignore", "Segredos podem ir para o histórico do git. Verificar antes do próximo commit.");

  if (d.pkg && !d.pkg.error && !d.pkg.lockfile)
    add("info", "package.json sem lockfile", "Instalações não são reproduzíveis entre máquinas.");

  if (d.todos.hits.length >= 15)
    add("info", d.todos.hits.length + " marcações TODO/FIXME", "Dívida declarada no próprio código." + (d.todos.capped ? " Contagem truncada." : ""));

  if (days !== null && days > 120)
    add("warn", "Parado há " + days + " dias", "Decidir explicitamente: retomar ou arquivar.");

  if (d.truncated)
    add("info", "Varredura truncada", "Projeto passou do limite de arquivos varridos. Números são piso, não total.");

  if (!c.length) add("ok", "Nenhum ponto aberto", "Versionado, documentado e em movimento.");
  return c;
}

const LEVEL_COLOR = { ok:"var(--ok)", info:"var(--cold)", warn:"var(--warn)", risk:"var(--risk)" };

/* =========================================================================
   ESTADO / DADOS
   ========================================================================= */
const state = { band:"todos", q:"", sort:"health", data:null, error:null, loading:true };
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const today = () => new Date().toISOString().slice(0,10);

async function load(refresh) {
  state.loading = true; state.error = null; render();
  try {
    const r = await fetch("/api/projects" + (refresh ? "?refresh=1" : ""));
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.data = await r.json();
  } catch (e) {
    state.error = e.message + " — o servidor está rodando? (node server.js)";
  }
  state.loading = false;
  render();
}

function rows() {
  if (!state.data) return [];
  const t = today();
  return state.data.projects.map(p => ({ ...p, h: computeHealth(p, t) }));
}
const countIn = key => key === "todos" ? rows().length : rows().filter(r => r.h.band.key === key).length;

/* =========================================================================
   RENDER — lista
   ========================================================================= */
function renderRail() {
  const box = el("nav-status");
  box.querySelectorAll(".nav").forEach(n => n.remove());
  if (!state.data) return;
  [{ key:"todos", label:"Todos" }].concat(BANDS.map(b => ({ key:b.key, label:b.label }))).forEach(it => {
    const b = document.createElement("button");
    b.className = "nav";
    b.setAttribute("aria-current", state.band === it.key ? "true" : "false");
    b.innerHTML = "<span>" + it.label + '</span><span class="count">' + countIn(it.key) + "</span>";
    b.onclick = () => { state.band = it.key; location.hash = ""; render(); };
    box.appendChild(b);
  });
  el("railfoot").innerHTML = state.data
    ? "Raiz: <b>" + esc(state.data.root) + "</b><br>O cockpit só lê. Nunca altera projeto, nunca publica."
    : "";
}

function listView() {
  const rs = rows();
  const t = today();
  const semContexto = rs.filter(r => !r.claudeMd && !r.readme).length;
  const parados = countIn("parado") + countIn("frio");
  const kpis = [
    { label:"Portfólio", value:rs.length, sub:"projetos rastreados" },
    { label:"Ativos", value:countIn("ativo"), sub:"tocados em 14 dias" },
    { label:"Atenção", value:countIn("atencao"), sub:"15–45 dias parados", tone:"is-warn" },
    { label:"Parados ou frios", value:parados, sub:"mais de 45 dias", tone:"is-risk" },
    { label:"Prontos p/ agente", value:(rs.length - semContexto) + "/" + rs.length, sub:"têm CLAUDE.md ou README" }
  ];

  let list = rs.filter(r =>
    (state.band === "todos" || r.h.band.key === state.band) &&
    r.name.toLowerCase().includes(state.q.toLowerCase()));

  const sorters = {
    health:(a,b) => a.h.score - b.h.score,
    recent:(a,b) => (a.h.days ?? 9e9) - (b.h.days ?? 9e9),
    stale: (a,b) => (b.h.days ?? -1) - (a.h.days ?? -1),
    name:  (a,b) => a.name.localeCompare(b.name, "pt-BR"),
    size:  (a,b) => b.sizeMB - a.sizeMB
  };
  list.sort(sorters[state.sort]);

  const bars = BANDS.map(b => ({ b, n: countIn(b.key) })).filter(x => x.n);

  return '' +
  '<div class="head"><div><h1>Saúde do portfólio</h1><p>' + rs.length + " projetos · " + countIn("ativo") +
    ' tocados nos últimos 14 dias</p></div>' +
    '<span class="stamp"><i class="dot"></i><span class="num">varredura ' + esc(state.data.scannedAt.slice(0,16).replace("T"," ")) + "</span></span></div>" +

  '<section class="strip">' + kpis.map(k =>
    '<div class="kpi ' + (k.tone||"") + '"><span class="label">' + k.label + '</span><span class="value">' +
    k.value + '</span><span class="sub">' + k.sub + "</span></div>").join("") + "</section>" +

  '<section class="panel"><h3>Distribuição por momento</h3><p class="cap">Clique num bloco para filtrar.</p>' +
    '<div class="bar">' + bars.map(x =>
      '<button style="flex:' + x.n + ";background:" + x.b.color + '" data-band="' + x.b.key +
      '" aria-label="' + x.n + " projetos em " + x.b.label + '">' + x.n + "</button>").join("") + "</div>" +
    '<div class="legend">' + bars.map(x =>
      '<span><i class="swatch" style="background:' + x.b.color + '"></i>' + x.b.label + ' · <b class="num">' + x.n + "</b></span>").join("") +
    "</div></section>" +

  '<div class="controls">' +
    '<input class="search" id="q" type="search" placeholder="Buscar projeto…" aria-label="Buscar projeto" value="' + esc(state.q) + '">' +
    '<select id="sort" aria-label="Ordenar por">' +
      ['<option value="health">Ordenar: saúde (pior primeiro)</option>',
       '<option value="recent">Ordenar: tocado recentemente</option>',
       '<option value="stale">Ordenar: parado há mais tempo</option>',
       '<option value="name">Ordenar: nome</option>',
       '<option value="size">Ordenar: tamanho</option>'].map(o =>
        o.replace('value="' + state.sort + '"', 'value="' + state.sort + '" selected')).join("") +
    "</select></div>" +

  '<section class="grid">' + (list.length ? list.map(p => {
    const h = p.h;
    const chips = [
      { on:p.git, label:"git" }, { on:p.claudeMd, label:"CLAUDE.md" },
      { on:p.pkg, label:"node" }, { on:p.vault, label:"vault obsidian" }
    ].filter(c => c.on || c.label === "git" || c.label === "CLAUDE.md");
    return '<button class="card" data-open="' + esc(p.name) + '" style="--edge:' + h.band.color + '">' +
      "<header><h3>" + esc(p.name) + '</h3><span class="pill" style="background:' + h.band.bg + ";color:" + h.band.fg + '">' + h.band.label + "</span></header>" +
      '<div class="metrics">' +
        "<span class=\"metric\"><b>" + (h.days === null ? "—" : h.days) + "</b><small>dias parado</small></span>" +
        "<span class=\"metric\"><b>" + h.score + "</b><small>saúde</small></span>" +
        "<span class=\"metric\"><b>" + p.files + "</b><small>arquivos</small></span>" +
        "<span class=\"metric\"><b>" + p.sizeMB + "</b><small>MB</small></span>" +
      "</div>" +
      '<div class="track"><i style="width:' + Math.max(h.score,2) + "%;background:" + h.band.color + '"></i></div>' +
      '<p class="note">' + esc(diagnose(p, h)) + "</p>" +
      '<div class="chips">' + chips.map(c => '<span class="chip' + (c.on?"":" off") + '">' + c.label + "</span>").join("") + "</div>" +
    "</button>";
  }).join("") : '<div class="empty"><b>Nenhum projeto neste filtro</b>Limpe a busca ou escolha outra faixa.</div>') + "</section>";
}

/* =========================================================================
   RENDER — detalhe do projeto
   ========================================================================= */
const detailCache = new Map();

async function detailView(name) {
  el("main").innerHTML = '<div class="loading"><b>Abrindo ' + esc(name) + "</b>Varrendo a pasta…</div>";
  let d = detailCache.get(name);
  if (!d) {
    try {
      const r = await fetch("/api/project/" + encodeURIComponent(name));
      if (!r.ok) throw new Error("HTTP " + r.status);
      d = await r.json();
      detailCache.set(name, d);
    } catch (e) {
      el("main").innerHTML = '<div class="failed"><b>Não consegui ler o projeto</b><code>' + esc(e.message) + "</code></div>";
      return;
    }
  }

  const t = today();
  const h = computeHealth({ ...d, claudeMd:d.docs.claudeMd, readme:!!d.docs.readmeName, git:d.git.isRepo }, t);
  const checks = buildChecks(d, t);
  const maxComp = Math.max(...d.composition.map(c => c.files), 1);
  const humano = d.recent.find(f => !isGenerated(f.path));

  el("main").innerHTML = '' +
  '<div class="crumb"><button class="btn" id="back">← Portfólio</button>' +
    '<button class="btn" id="reveal">Abrir pasta</button>' +
    '<span class="path">' + esc(d.dir) + "</span></div>" +

  '<div class="head"><div><h1>' + esc(d.name) + '</h1><p>' + esc(diagnose(
      { ...d, claudeMd:d.docs.claudeMd, readme:!!d.docs.readmeName, git:d.git.isRepo }, h)) + "</p></div>" +
    '<span class="pill" style="background:' + h.band.bg + ";color:" + h.band.fg + '">' + h.band.label + "</span></div>" +

  '<section class="strip">' + [
      { label:"Saúde", value:h.score, sub:"de 100" },
      { label:"Último toque", value:(h.days ?? "—"), sub:"dias atrás" },
      { label:"Toque humano", value:humano ? daysBetween(t, humano.mtime.slice(0,10)) : "—", sub:"dias, ignorando gerados" },
      { label:"Arquivos", value:d.files, sub:d.sizeMB + " MB" },
      { label:"Pendências", value:checks.filter(c => c.level !== "ok").length, sub:"pontos a verificar",
        tone: checks.some(c => c.level === "risk") ? "is-risk" : checks.some(c => c.level === "warn") ? "is-warn" : "" }
    ].map(k => '<div class="kpi ' + (k.tone||"") + '"><span class="label">' + k.label + '</span><span class="value">' +
       k.value + '</span><span class="sub">' + k.sub + "</span></div>").join("") + "</section>" +

  '<section class="panel"><h3>Pontos a verificar</h3><p class="cap">Derivados dos fatos da varredura, não digitados.</p>' +
    '<div class="checks">' + checks.map(c =>
      '<div class="check"><i style="background:' + LEVEL_COLOR[c.level] + '"></i><div><b>' +
      esc(c.title) + "</b><span>" + esc(c.detail) + "</span></div></div>").join("") + "</div></section>" +

  '<div class="cols">' +
    '<section class="panel"><h3>Git</h3>' + (d.git.isRepo ? '' +
      '<dl class="kv"><dt>branch</dt><dd>' + esc(d.git.branch || "—") + "</dd>" +
        "<dt>commits</dt><dd>" + (d.git.commitCount ?? "—") + "</dd>" +
        "<dt>sem commit</dt><dd>" + d.git.uncommitted + "</dd>" +
        "<dt>remote</dt><dd>" + esc(d.git.remote || "nenhum") + "</dd></dl>" +
      '<div class="scroll"><table><thead><tr><th>data</th><th>commit</th></tr></thead><tbody>' +
        d.git.commits.map(c => "<tr><td class=\"num\">" + esc(c.date) + "</td><td>" + esc(c.subject) + "</td></tr>").join("") +
      "</tbody></table></div>"
      : '<p class="note">Não é repositório git.</p>') + "</section>" +

    '<section class="panel"><h3>Composição</h3><p class="cap">Onde está o peso do projeto.</p>' +
      d.composition.map(c =>
        '<div class="compbar"><span class="lbl">' + esc(c.name) + '</span>' +
        '<span class="rail2"><i style="width:' + Math.round(c.files / maxComp * 100) + '%"></i></span>' +
        '<span class="n num">' + c.files + "</span></div>").join("") +
      '<p class="note" style="margin-top:10px">Tipos: ' +
        d.fileTypes.slice(0,6).map(f => esc(f.ext) + " " + f.n).join(" · ") + "</p></section>" +

    '<section class="panel"><h3>Arquivos recentes</h3>' +
      '<div class="scroll"><table><thead><tr><th>data</th><th>arquivo</th></tr></thead><tbody>' +
      d.recent.slice(0,12).map(f => '<tr><td class="num">' + f.mtime.slice(0,10) + "</td><td>" +
        (isGenerated(f.path) ? '<span style="color:var(--muted)">' + esc(f.path) + " (gerado)</span>" : esc(f.path)) +
        "</td></tr>").join("") + "</tbody></table></div></section>" +

    '<section class="panel"><h3>Documentação e stack</h3>' +
      (d.pkg && !d.pkg.error
        ? '<dl class="kv"><dt>scripts</dt><dd>' + (d.pkg.scripts.join(", ") || "—") + "</dd>" +
          "<dt>deps</dt><dd>" + d.pkg.deps + " + " + d.pkg.devDeps + " dev</dd>" +
          "<dt>lockfile</dt><dd>" + esc(d.pkg.lockfile || "nenhum") + "</dd></dl>"
        : '<p class="note">Sem package.json.</p>') +
      (d.docs.claudeMdText
        ? "<details><summary>CLAUDE.md</summary><pre>" + esc(d.docs.claudeMdText.slice(0,2500)) + "</pre></details>"
        : "") +
      (d.docs.readmeText
        ? "<details><summary>" + esc(d.docs.readmeName) + "</summary><pre>" + esc(d.docs.readmeText.slice(0,2500)) + "</pre></details>"
        : "") +
    "</section>" +

    (d.todos.hits.length ? '<section class="panel"><h3>TODO / FIXME</h3><p class="cap">' +
      d.todos.hits.length + " marcações em " + d.todos.scanned + " arquivos varridos.</p>" +
      '<div class="scroll"><table><thead><tr><th>tipo</th><th>onde</th><th>o quê</th></tr></thead><tbody>' +
      d.todos.hits.slice(0,25).map(x => "<tr><td>" + esc(x.kind) + '</td><td class="num">' + esc(x.file) + ":" + x.line +
        "</td><td>" + esc(x.text) + "</td></tr>").join("") + "</tbody></table></div></section>" : "") +
  "</div>";

  el("back").onclick = () => { location.hash = ""; };
  el("reveal").onclick = async (e) => {
    e.target.disabled = true;
    try {
      await fetch("/api/reveal", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ name }) });
      e.target.textContent = "Pasta aberta";
    } catch { e.target.textContent = "Falhou"; }
    setTimeout(() => { e.target.disabled = false; e.target.textContent = "Abrir pasta"; }, 2500);
  };
}

/* =========================================================================
   ROTEAMENTO
   ========================================================================= */
function render() {
  renderRail();
  const main = el("main");

  if (state.loading) { main.innerHTML = '<div class="loading"><b>Varrendo Desktop\\Projects</b>Primeira varredura lê todos os projetos — leva alguns segundos.</div>'; return; }
  if (state.error)   { main.innerHTML = '<div class="failed"><b>Sem conexão com o servidor</b><code>' + esc(state.error) + "</code></div>"; return; }

  const hash = decodeURIComponent(location.hash.replace(/^#\/p\//, ""));
  if (location.hash.startsWith("#/p/") && hash) { detailView(hash); return; }

  main.innerHTML = listView();
  main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { location.hash = "#/p/" + encodeURIComponent(b.dataset.open); });
  main.querySelectorAll("[data-band]").forEach(b => b.onclick = () => {
    state.band = state.band === b.dataset.band ? "todos" : b.dataset.band; render();
  });
  const q = el("q");
  if (q) { q.oninput = e => { state.q = e.target.value; render(); q.focus(); }; }
  const s = el("sort");
  if (s) s.onchange = e => { state.sort = e.target.value; render(); };
}

window.addEventListener("hashchange", render);
el("refresh").onclick = () => { detailCache.clear(); load(true); };
load(false);
</script>
</body>
</html>
