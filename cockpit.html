<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit de Projetos</title>
<!-- O favicon é DESENHADO por `/aba.js` (um fluxo: um nó, dois ramos, duas
     arestas) e animado quando o Tester termina. Nasce vazio de propósito: um
     `.ico` no disco seria um segundo desenho para manter em sincronia com este,
     e o desenho já existe em código. -->
<link rel="icon" href="data:,">
<script src="/aba.js" defer></script>
<style>
  /* Tokens: os MESMOS do flows.html e do tester.html — as três páginas são um
     produto, e esta era a única com paleta própria (âmbar sobre azul-marinho,
     da v1). Os nomes antigos (--ink, --muted, --accent-dim, --ok-bg…) viram
     ALIASES apontando para os tokens novos, então todo o CSS e o JS abaixo
     continuam válidos sem reescrever seletor por seletor. Escrever regra nova?
     Use os nomes novos; os aliases existem para o legado, não para crescer. */
  :root {
    color-scheme: light dark;
    --bg:#FAFAF9; --bg-deep:#F4F4F2; --surface:#FFFFFF; --surface-2:#00000005; --raised:#FFFFFF;
    --line:rgba(10,10,20,.11); --line-soft:rgba(10,10,20,.06);
    --txt:#14151C; --txt-dim:#3F424D; --txt-faint:#666973;
    --accent:#3B48E0; --accent-soft:#3B48E014; --accent-line:#3B48E055; --accent-txt:#3B48E0;
    --brand:#FF5A1F; --brand-txt:#D04919;
    --ok:#0E9F6E; --warn:#B7791F; --risk:#DC2B3A; --cold:#8B90A0;
    --ok-soft:#0E9F6E14; --warn-soft:#B7791F14; --risk-soft:#DC2B3A14; --cold-soft:#8B90A014;
    --ok-txt:#0B8159; --warn-txt:#9A661A; --risk-txt:#D02937; --cold-txt:#6D717E;
    --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
    --font-num:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,monospace;
    --radius:10px;
    /* aliases da v1 -> tokens do sistema */
    --ink:var(--txt); --ink-2:var(--txt-dim); --muted:var(--txt-faint);
    --accent-dim:var(--accent-soft);
    --ok-bg:var(--ok-soft); --warn-bg:var(--warn-soft); --risk-bg:var(--risk-soft); --cold-bg:var(--cold-soft);
    --font-ui:var(--font);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#06060B; --bg-deep:#040408; --surface:#0E0F1A; --surface-2:#14162454; --raised:#171A2B;
      --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
      --txt:#E9EBF5; --txt-dim:#AAAFC2; --txt-faint:#777D92;
      --accent:#5865F5; --accent-soft:#5865F51f; --accent-line:#5865F55c; --accent-txt:#606CF5;
      --brand:#FF5A1F; --brand-txt:#FF5A1F;
      --ok:#2FD48F; --warn:#F5A524; --risk:#FF4F5E; --cold:#59617D;
      --ok-soft:#2FD48F1a; --warn-soft:#F5A5241a; --risk-soft:#FF4F5E1a; --cold-soft:#59617D1a;
      --ok-txt:#2FD48F; --warn-txt:#F5A524; --risk-txt:#FF4F5E; --cold-txt:#798096;
    }
  }
  :root[data-theme="dark"]{
    --bg:#06060B; --bg-deep:#040408; --surface:#0E0F1A; --surface-2:#14162454; --raised:#171A2B;
    --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
    --txt:#E9EBF5; --txt-dim:#AAAFC2; --txt-faint:#777D92;
    --accent:#5865F5; --accent-soft:#5865F51f; --accent-line:#5865F55c; --accent-txt:#606CF5;
    --brand:#FF5A1F; --brand-txt:#FF5A1F;
    --ok:#2FD48F; --warn:#F5A524; --risk:#FF4F5E; --cold:#59617D;
    --ok-soft:#2FD48F1a; --warn-soft:#F5A5241a; --risk-soft:#FF4F5E1a; --cold-soft:#59617D1a;
    --ok-txt:#2FD48F; --warn-txt:#F5A524; --risk-txt:#FF4F5E; --cold-txt:#798096;
  }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  .num { font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  h1,h2,h3 { text-wrap:balance; }

  /* Topbar copiado do flows.html, seletor a seletor — mudança lá repete aqui
     até o dia em que isto virar arquivo compartilhado. */
  .topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px;
    padding:0 22px; height:58px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:-.02em; }
  .brand .flame { color:var(--brand); display:grid; place-items:center; }
  .brand .wm { font-size:15px; margin:0; font-weight:700; line-height:1.45; }
  .brand .wm b { color:var(--txt); }
  .brand .wm span { color:var(--txt-faint); font-weight:500; }
/* ═══════════════════════════════════════════════════════ NAV — as três portas
   BLOCO COMPARTILHADO. Este CSS é IDÊNTICO em flows.html, tester.html e
   cockpit.html — gerado por preview/aplicar-nav.js e travado por
   nav-sync-test.js. Ao mudar, rode o gerador de novo; NÃO edite uma página só,
   e nunca insira um segundo bloco (foi assim que o rabo de um bloco antigo
   ficou pendurado no flows.html e a página morreu com "Illegal return
   statement").

   A cápsula é ícone-primeiro: o rótulo existe na porta ativa, sob o cursor e no
   foco de teclado. O fundo do ativo NÃO é pintado por cada porta — é UM
   elemento que viaja, a .lente, movida por mola no JS. Enquanto cada porta
   pintava o próprio fundo não havia o que animar entre elas: o estado aparecia
   e desaparecia.

   Cor: corpo e aro da lente são --accent, que neste painel significa MOVIMENTO.
   Status (ok/warn/risk/cold) continua reservado e não entra na navegação. */
.nvd{position:relative;display:flex;align-items:center;gap:3px;padding:3px;
  border-radius:999px;flex:0 0 auto;background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line-soft)}
.nvd a{position:relative;z-index:1;display:flex;align-items:center;height:30px;
  padding:0 9px;border-radius:999px;color:var(--txt-faint);text-decoration:none;
  transition:color .22s ease}
.nvd a:hover{color:var(--txt-dim)}
.nvd a[aria-current="page"]{color:var(--txt)}
.nvd a[aria-current="page"] .ic{color:var(--accent-txt)}
.nvd a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nvd .ic{display:grid;transition:transform .3s cubic-bezier(.2,.9,.15,1)}
.nvd a[aria-current="page"] .ic{transform:translateY(-.5px)}
/* O rótulo abre por CSS e a lente NÃO é sincronizada com esta transição: ela
   persegue a geometria da porta ativa quadro a quadro, então o alvo se move
   enquanto o rótulo abre e a chegada fica arrastada. É de onde vem a sensação
   de líquido — não há keyframe de viagem em nenhum lugar.
   Abre também no foco de teclado: navegando por Tab, um ícone sozinho não diz
   para onde se vai. */
.nvd .lb{display:flex;align-items:center;gap:7px;max-width:0;overflow:hidden;
  opacity:0;white-space:nowrap;font-size:12.5px;font-weight:500;
  transition:max-width .34s cubic-bezier(.2,.9,.15,1),opacity .24s ease,
    margin-left .34s cubic-bezier(.2,.9,.15,1)}
.nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
  max-width:130px;opacity:1;margin-left:7px}
/* O atalho é anunciado no lugar onde é usado. O chip só se paga porque o atalho
   EXISTE (alt+1/2/3 navega): um rótulo prometendo tecla que não faz nada é pior
   que nenhum rótulo. */
.nvd kbd{font-family:var(--font-num);font-size:9px;letter-spacing:.02em;
  color:color-mix(in srgb,var(--txt-faint) 58%,var(--txt));
  padding:1px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);
  line-height:1.5}
/* ─────────────────────────────────────────────────────────── a lente de vidro
   Cinco camadas, cada uma respondendo por uma coisa que vidro faz:
     1. corpo tingido translúcido;
     2. backdrop-filter — o que está ATRÁS aparece desfocado. Por isso a lente
        fica ABAIXO das portas (z-index 0): acima, desfocaria o próprio ícone e
        o rótulo, que é o contrário do que vidro faz com o objeto que carrega;
     3. realce especular no topo, que dá volume;
     4. o aro: linha clara em cima, escura embaixo. Sombra externa NEUTRA — a
        regra da casa não abre exceção de halo colorido para vidro;
     5. refração de borda (::before): um anel de 3px onde o backdrop é mais
        desfocado, recortado com a mesma máscara xor que o .beam já usa aqui.
   --x/--w/--sx/--sy vêm da mola. A largura é animada como LARGURA mesmo: a
   lente é out-of-flow, então mudar a largura dela não reflui nada, e fazer isso
   com scaleX transformaria a cápsula numa elipse (o raio de 999px viraria oval).
   A afinação do tema claro é a base e a do escuro sobrescreve: atrás do claro o
   fundo é quase branco e chapado, onde blur não produz efeito e brightness
   pioraria — ali o vidro se lê por contrast, aro nítido e sombra interna. */
.nvd .lente{position:absolute;top:3px;left:0;height:30px;width:var(--w,30px);
  transform:translateX(var(--x,0)) scale(var(--sx,1),var(--sy,1));
  transform-origin:var(--org,center);
  border-radius:999px;pointer-events:none;z-index:0;
  background:
    radial-gradient(130% 170% at 28% -12%,
      color-mix(in srgb,#fff 62%,transparent), transparent 58%),
    color-mix(in srgb,var(--accent) 12%,transparent);
  backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  -webkit-backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),
    inset 0 1.5px 0 color-mix(in srgb,#fff 90%,transparent),
    inset 0 -3px 5px -2px rgba(10,10,20,.13),
    0 3px 10px -7px rgba(10,10,20,.40)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .nvd .lente{
    background:
      radial-gradient(130% 170% at 28% -10%,
        color-mix(in srgb,#fff 17%,transparent), transparent 62%),
      color-mix(in srgb,var(--accent) 22%,transparent);
    backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    box-shadow:
      inset 0 0 0 1px var(--accent-line),
      inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
      inset 0 -2px 3px -1px rgba(0,0,0,.22),
      0 2px 9px -6px rgba(0,0,0,.55)}
}
:root[data-theme="dark"] .nvd .lente{
  background:
    radial-gradient(130% 170% at 28% -10%,
      color-mix(in srgb,#fff 17%,transparent), transparent 62%),
    color-mix(in srgb,var(--accent) 22%,transparent);
  backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  box-shadow:
    inset 0 0 0 1px var(--accent-line),
    inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
    inset 0 -2px 3px -1px rgba(0,0,0,.22),
    0 2px 9px -6px rgba(0,0,0,.55)}
.nvd .lente::before{content:"";position:absolute;inset:0;border-radius:inherit;
  padding:3px;pointer-events:none;
  backdrop-filter:blur(2px) saturate(2.4);
  -webkit-backdrop-filter:blur(2px) saturate(2.4);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* O brilho que corre na chegada. Nasce em opacity 0 e é disparado por classe:
   um realce varrendo sozinho seria movimento sem informação atrás. */
.nvd .lente::after{content:"";position:absolute;inset:0;border-radius:inherit;
  opacity:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 34%,
    color-mix(in srgb,#fff 55%,transparent) 47%,transparent 60%)}
.nvd .lente.varre::after{animation:navvarrer .62s cubic-bezier(.2,.75,.2,1) 1}
@keyframes navvarrer{
  0%{opacity:0;transform:translateX(-40%)}
  22%{opacity:.9}
  100%{opacity:0;transform:translateX(40%)}}
/* Em tela estreita o rótulo sai de cena, inclusive o do ativo: o sufixo do
   wordmark ao lado já diz em que tela você está, e três rótulos abertos
   estouravam a barra em 390px. */
@media (max-width:620px){
  .nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
    max-width:0;opacity:0;margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  /* O estado fica e o vidro fica — blur parado não é movimento. Somem a viagem,
     o esticão e a varredura. A mola é desligada no JS pela mesma consulta. */
  .nvd .lb,.nvd .ic,.nvd a{transition:none}
  .nvd .lente.varre::after{animation:none}
}
  .topbar .sep { width:1px; height:20px; background:var(--line); }
  .spacer { flex:1; }
  .iconbtn { background:none; border:1px solid var(--line); border-radius:8px; padding:4px 9px;
    font-size:11px; color:var(--txt-faint); cursor:pointer; flex:0 0 auto; }
  .iconbtn:hover { background:var(--surface-2); color:var(--txt-dim); }

  /* O botão de aviso do sistema, criado por `aba.js`. Ele já se veste com a
     classe do botão de tema desta página; aqui fica só o que é dele. Copiado
     seletor a seletor nas três páginas, como o resto do chrome — mexeu aqui,
     repete lá. `gap` em vez de espaço no texto, e glifo de largura fixa: senão
     a caixa muda de tamanho ao alternar ○/◉/⊘, e um botão que pula ao ser
     clicado lê como defeito. Ligado ganha acento porque `○` e `◉` a 11px são
     quase a mesma mancha — e essa mancha é a única informação que ele carrega. */
  .avisarbtn { display:inline-flex; align-items:center; gap:5px; }
  .avisarbtn .dot { width:1em; text-align:center; flex:0 0 auto; }
  /* `--accent-txt` puro sobre `--accent-soft` mede 4,38 no escuro: falha AA a
     11px. Mesmo número que os avisos já pagaram, mesmo remédio. O glifo fica com
     o acento inteiro — ele é forma, não texto corrido. */
  .avisarbtn.on { color:color-mix(in srgb,var(--accent-txt) 72%,var(--txt));
    border-color:var(--accent-line); background:var(--accent-soft); }
  .avisarbtn.on .dot { color:var(--accent-txt); }
  .avisarbtn.bloq { opacity:.55; }

  /* ----------------------------------------------------- modo gravação (REC)
     Copiado do flows.html, seletor a seletor, como o resto do chrome. Nesta
     tela nada carrega `sens` — nome de pasta não é dado de cliente — mas o
     botão e o estado são do produto inteiro. */
  .rec .dot { display:inline-block; }
  [data-rec="1"] .rec { color:var(--accent-txt); border-color:var(--accent-line); background:var(--accent-soft); }
  [data-rec="1"] .rec .dot { animation:recpulse 1.6s ease-in-out infinite; }
  @keyframes recpulse { 0%, 100% { opacity:1; } 50% { opacity:.3; } }
  .sens { transition:filter .45s ease; }
  [data-rec="1"] .sens { filter:blur(7px); user-select:none; }
  .rec-wave { position:fixed; inset:0; z-index:400; pointer-events:none;
    background:color-mix(in srgb, var(--accent) 16%, transparent); }
  @media (prefers-reduced-motion: reduce) {
    [data-rec="1"] .rec .dot { animation:none; }
    .sens { transition:none; }
  }

/* ================================================================== AVISOS
   UM vocabulário para toda mensagem do sistema, nas três páginas.

   Antes havia quatro: `.avisobar` na abertura, `alertaInline()` na corrida,
   `.anxerro` nos anexos e o `confirm()` nativo (já removido). Quatro jeitos de
   dizer a mesma coisa é o que faz um painel parecer montado por quatro pessoas —
   e o aviso é justamente o momento em que ele precisa ser mais confiável.

   Dois MODOS, um só desenho:
     `.aviso`         — ancorado, fica onde o problema está (campo, seção, caixa).
     `.avisos > .aviso` — evento: o CONTAINER e que faz flutuar, sai sozinho.
   E quatro TIPOS, que só trocam a cor e o glifo: erro, alerta, ok, info.

   O tipo decide o comportamento, não só a cor: erro e alerta NÃO somem sozinhos
   (quem precisa ler não pode perder a frase), ok e info somem em 4,5s com a
   barra mostrando o tempo — uma coisa que vai desaparecer tem que dizer isso.

   Cor de status aqui é uso canônico: `--*-txt` no texto e `-soft` no fundo, que
   é a mesma divisão fill-vs-text que o resto do produto já segue. */
.aviso{display:flex;gap:9px;align-items:flex-start;text-align:left;
  font-size:12px;line-height:1.6;border-radius:10px;padding:10px 12px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--txt-dim)}
.aviso .ai{flex:0 0 auto;font-size:11px;line-height:1.55;opacity:.95}
.aviso .ac{flex:1 1 auto;min-width:0}
.aviso .at{display:block;font-weight:650;color:var(--txt);margin-bottom:2px}
.aviso .ax{flex:0 0 auto;border:none;background:none;cursor:pointer;padding:1px 4px;
  border-radius:5px;color:inherit;opacity:.55;font-size:13px;line-height:1}
.aviso .ax:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
/* A borda sai da PRÓPRIA cor do tipo (`currentColor`), não de um token por
   variante: `--risk-line` e `--ok-line` não existem neste produto, e inventar
   quatro tokens novos para uma borda seria quatro lugares para dessincronizar.
   Assim os quatro tipos têm exatamente o mesmo peso de contorno. */
.aviso.erro,.aviso.alerta,.aviso.ok,.aviso.info{border-color:color-mix(in srgb,currentColor 30%,transparent)}
/* A cor é PUXADA para o texto base. Medido no DOM vivo, com o `-soft` composto
   sobre o fundo da página: `--risk-txt` puro dava 4,41 no claro, `--warn-txt`
   4,30, `--ok-txt` 4,29 e `--accent-txt` 4,38 no escuro — quatro reprovações de
   AA (4,5) em texto de 12px. É a armadilha que este projeto já documentou: token
   calibrado como preenchimento não é token de texto, e `-txt` sozinho foi
   calibrado contra `--surface`, não contra o próprio `-soft`.
   A mistura mantém a cor reconhecível (o vermelho continua vermelho) e sobe o
   contraste com folga. Mexeu em token de status? Re-meça — não confie na captura. */
.aviso.erro{background:var(--risk-soft);color:color-mix(in srgb,var(--risk-txt) 72%,var(--txt))}
.aviso.alerta{background:var(--warn-soft);color:color-mix(in srgb,var(--warn-txt) 72%,var(--txt))}
.aviso.ok{background:var(--ok-soft);color:color-mix(in srgb,var(--ok-txt) 72%,var(--txt))}
.aviso.info{background:var(--accent-soft);color:color-mix(in srgb,var(--accent-txt) 72%,var(--txt))}
/* O glifo fica na cor CHEIA: ele é forma, não texto corrido, e é o que mantém a
   identidade do tipo legível de longe. */
.aviso.erro .ai{color:var(--risk-txt)}
.aviso.alerta .ai{color:var(--warn-txt)}
.aviso.ok .ai{color:var(--ok-txt)}
.aviso.info .ai{color:var(--accent-txt)}
.aviso.bloco{max-width:700px;margin:16px auto 0}

/* A pilha. `fixed` no alto à direita, abaixo do topbar: não cobre o compositor
   (embaixo), não cobre o cabeçalho (em cima), e é para onde o olho vai depois de
   clicar num botão do cabeçalho. Empilha para baixo; o mais novo entra por cima.
   `pointer-events` só nos cartões — a pilha inteira não pode roubar clique da
   página atrás dela. */
.avisos{position:fixed;top:70px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px;
  width:min(380px,calc(100vw - 36px));pointer-events:none}
.avisos .aviso{pointer-events:auto;box-shadow:var(--shadow);backdrop-filter:blur(8px);
  animation:avin .26s cubic-bezier(.2,.9,.3,1) both}
.aviso.saindo{animation:avout .18s ease-in both}
@keyframes avin{from{opacity:0;transform:translateX(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes avout{from{opacity:1}to{opacity:0;transform:translateX(10px)}}
/* A barra do tempo restante. Só existe onde há auto-dismiss — desenhar uma barra
   parada num aviso que não sai seria prometer que ele vai sumir. */
.aviso .abar{position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:currentColor;opacity:.35;transform-origin:left;animation:avbar linear both}
@keyframes avbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.avisos .aviso{position:relative;overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .avisos .aviso,.aviso.saindo{animation-duration:1ms;animation-delay:0s}
  /* A barra continua encurtando: ela é INFORMAÇÃO (quanto falta), não enfeite.
     O que sai é o deslize de entrada, que é decoração. */
  .aviso .abar{animation-duration:inherit}
}
@media (max-width:520px){ .avisos{top:auto;bottom:14px;right:12px;left:12px;width:auto} }

  .shell { display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 58px); }
  .rail { border-right:1px solid var(--line); background:var(--surface); padding:20px 14px; display:flex; flex-direction:column; gap:20px; position:sticky; top:58px; height:calc(100vh - 58px); overflow-y:auto; }

</style>
<script>
/* O tema é UM para o produto inteiro — mesma chave e mesma ordem das outras
   páginas (`?theme=` vence, depois `cockpit-theme`, depois o sistema). No
   <head> de propósito: depois do primeiro paint seria um flash a cada troca. */
(() => {
  const q = new URLSearchParams(location.search).get("theme");
  const t = (q === "light" || q === "dark") ? q : localStorage.getItem("cockpit-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  // Modo gravação: estado do produto, como o tema. Nesta tela nada carrega
  // `sens` (nome de pasta não é dado de cliente), mas o botão vive no chrome
  // das três páginas e o estado tem que acompanhar.
  if (localStorage.getItem("cockpit-rec") === "1") document.documentElement.setAttribute("data-rec", "1");
})();
</script>

<div class="shell">
  <nav class="rail">
    <div class="navgroup" id="nav-status"><h4>Saúde</h4></div>
    <div class="navgroup">
      <h4>Varredura</h4>

<script>
/* =========================================================================
   MODELO DE SAÚDE — toda a opinião do cockpit mora neste bloco.
   O servidor entrega fatos; nada além daqui julga um projeto.
   ========================================================================= */

/* `fg` (texto em pill) usa os tokens `-txt`, calibrados para AA sobre o fundo
 * soft; `color` (preenchimento de barra) segue no token base — a regra do
 * flows.html: cor de status como fill e como texto são dois tokens. */
const BANDS = [
  { key:"ativo",   label:"Ativo",   maxDays:14,       color:"var(--ok)",   bg:"var(--ok-bg)",   fg:"var(--ok-txt)" },
  { key:"atencao", label:"Atenção", maxDays:45,       color:"var(--warn)", bg:"var(--warn-bg)", fg:"var(--warn-txt)" },
  { key:"parado",  label:"Parado",  maxDays:120,      color:"var(--risk)", bg:"var(--risk-bg)", fg:"var(--risk-txt)" },
  { key:"frio",    label:"Frio",    maxDays:Infinity, color:"var(--cold)", bg:"var(--cold-bg)", fg:"var(--cold-txt)" }
];

const WEIGHTS = { momentum:60, documented:25, versioned:15 };

// Arquivos que a máquina escreve sozinha. Não contam como sinal de trabalho humano.
const GENERATED = /(^|\/)(logs?|cache|tmp|\.cache|graphify-out|dist|build)\//i;
const GENERATED_EXT = /\.(log|lock|tmp|bak)$/i;
const isGenerated = p => GENERATED.test(p) || GENERATED_EXT.test(p);

function daysBetween(a, b) {
  return Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000);
}

function computeHealth(p, today) {
  const days = p.lastTouch ? daysBetween(today, p.lastTouch) : null;
  const empty = p.files === 0;

  const momentum   = days === null ? 0 : Math.max(0, 100 - (days / 180) * 100);
  const documented = (p.claudeMd || p.readme) ? 100 : 0;
  const versioned  = p.git ? 100 : 0;

  let score = (momentum * WEIGHTS.momentum + documented * WEIGHTS.documented + versioned * WEIGHTS.versioned) / 100;
  if (empty) score = 0;

  const band = empty ? BANDS[3] : BANDS.find(b => days <= b.maxDays);
  return { days, empty, score: Math.round(score), band };
}

function diagnose(p, h) {
  if (h.empty) return "Pasta vazia. Arquivar ou começar de fato.";
  if (h.days > 120) return "Sem toque há " + h.days + " dias. Decidir: retomar ou arquivar.";
  if (!p.claudeMd && !p.readme) return "Sem CLAUDE.md nem README — um agente abre isto sem contexto nenhum.";
  if (!p.git) return "Fora do git. Nenhuma alteração é reversível.";
  if (h.days > 45) return "Parado há " + h.days + " dias, mas documentado. Retomada é barata.";
  if (h.days > 14) return "Esfriando. " + h.days + " dias desde o último toque.";
  return "Em movimento.";
}

/* Pontos a verificar dentro do projeto. Derivados dos fatos do servidor. */
function buildChecks(d, today) {
  const c = [];
  const add = (level, title, detail) => c.push({ level, title, detail });
  const days = d.lastTouch ? daysBetween(today, d.lastTouch) : null;

  if (d.files === 0) add("risk", "Pasta vazia", "Nenhum arquivo. Arquivar ou começar de fato.");

  // Atividade real vs ruído de máquina
  const humano = d.recent.find(f => !isGenerated(f.path));
  const gerado = d.recent[0] && isGenerated(d.recent[0].path);
  if (gerado && humano) {
    add("warn", "Atividade recente é de arquivo gerado",
      "O arquivo mais novo é " + d.recent[0].path + ". Último toque humano: " +
      humano.mtime.slice(0,10) + " (" + daysBetween(today, humano.mtime.slice(0,10)) + " dias) em " + humano.path + ".");
  }

  if (!d.docs.claudeMd && !d.docs.readmeName)
    add("risk", "Sem contexto para agente", "Não existe CLAUDE.md nem README. Qualquer agente que abrir esta pasta começa do zero.");
  else if (!d.docs.claudeMd)
    add("info", "Sem CLAUDE.md", "Existe " + d.docs.readmeName + ", mas nenhuma instrução dedicada a agente.");

  if (!d.git.isRepo) {
    add(d.files > 50 ? "risk" : "warn", "Fora do git",
      d.files + " arquivos sem versionamento. Nenhuma alteração é reversível e não há histórico.");
  } else {
    if (d.git.uncommitted > 0)
      add(d.git.uncommitted > 30 ? "risk" : "warn", d.git.uncommitted + " arquivos sem commit",
        "Trabalho fora do histórico. Último commit: " + (d.git.commits[0]?.date || "desconhecido") + ".");
    if (!d.git.remote)
      add("warn", "Repositório só nesta máquina", "Sem remote configurado. Perder o disco perde o projeto.");
  }

  if (d.flags.envFile && !d.flags.gitignoreCoversEnv)
    add("risk", "Arquivo .env fora do .gitignore", "Segredos podem ir para o histórico do git. Verificar antes do próximo commit.");

  if (d.pkg && !d.pkg.error && !d.pkg.lockfile)
    add("info", "package.json sem lockfile", "Instalações não são reproduzíveis entre máquinas.");

  if (d.todos.hits.length >= 15)
    add("info", d.todos.hits.length + " marcações TODO/FIXME", "Dívida declarada no próprio código." + (d.todos.capped ? " Contagem truncada." : ""));

  if (days !== null && days > 120)
    add("warn", "Parado há " + days + " dias", "Decidir explicitamente: retomar ou arquivar.");

  if (d.truncated)
    add("info", "Varredura truncada", "Projeto passou do limite de arquivos varridos. Números são piso, não total.");

  if (!c.length) add("ok", "Nenhum ponto aberto", "Versionado, documentado e em movimento.");
  return c;
}

const LEVEL_COLOR = { ok:"var(--ok)", info:"var(--cold)", warn:"var(--warn)", risk:"var(--risk)" };

/* =========================================================================
   ESTADO / DADOS
   ========================================================================= */
const state = { band:"todos", q:"", sort:"health", data:null, error:null, loading:true };
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const today = () => new Date().toISOString().slice(0,10);

async function load(refresh) {
  state.loading = true; state.error = null; render();
  try {
    const r = await fetch("/api/projects" + (refresh ? "?refresh=1" : ""));
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.data = await r.json();
  } catch (e) {
    state.error = e.message + " — o servidor está rodando? (node server.js)";
  }
  state.loading = false;
  render();
}

function rows() {
  if (!state.data) return [];
  const t = today();
  return state.data.projects.map(p => ({ ...p, h: computeHealth(p, t) }));
}
const countIn = key => key === "todos" ? rows().length : rows().filter(r => r.h.band.key === key).length;

/* =========================================================================
   RENDER — lista
   ========================================================================= */
function renderRail() {
  const box = el("nav-status");
  box.querySelectorAll(".nav").forEach(n => n.remove());
  if (!state.data) return;
  [{ key:"todos", label:"Todos" }].concat(BANDS.map(b => ({ key:b.key, label:b.label }))).forEach(it => {
    const b = document.createElement("button");
    b.className = "nav";
    b.setAttribute("aria-current", state.band === it.key ? "true" : "false");
    b.innerHTML = "<span>" + it.label + '</span><span class="count">' + countIn(it.key) + "</span>";
    b.onclick = () => { state.band = it.key; location.hash = ""; render(); };
    box.appendChild(b);
  });
  el("railfoot").innerHTML = state.data
    ? "Raiz: <b>" + esc(state.data.root) + "</b><br>O cockpit só lê. Nunca altera projeto, nunca publica."
    : "";
}

function listView() {
  const rs = rows();
  const t = today();
  const semContexto = rs.filter(r => !r.claudeMd && !r.readme).length;
  const parados = countIn("parado") + countIn("frio");
  const kpis = [
    { label:"Portfólio", value:rs.length, sub:"projetos rastreados" },
    { label:"Ativos", value:countIn("ativo"), sub:"tocados em 14 dias" },
    { label:"Atenção", value:countIn("atencao"), sub:"15–45 dias parados", tone:"is-warn" },
    { label:"Parados ou frios", value:parados, sub:"mais de 45 dias", tone:"is-risk" },
    { label:"Prontos p/ agente", value:(rs.length - semContexto) + "/" + rs.length, sub:"têm CLAUDE.md ou README" }
  ];

  let list = rs.filter(r =>
    (state.band === "todos" || r.h.band.key === state.band) &&
    r.name.toLowerCase().includes(state.q.toLowerCase()));

  const sorters = {
    health:(a,b) => a.h.score - b.h.score,
    recent:(a,b) => (a.h.days ?? 9e9) - (b.h.days ?? 9e9),
    stale: (a,b) => (b.h.days ?? -1) - (a.h.days ?? -1),
    name:  (a,b) => a.name.localeCompare(b.name, "pt-BR"),
    size:  (a,b) => b.sizeMB - a.sizeMB
  };
  list.sort(sorters[state.sort]);

  const bars = BANDS.map(b => ({ b, n: countIn(b.key) })).filter(x => x.n);

  return '' +
  '<div class="head"><div><h1>Saúde do portfólio</h1><p>' + rs.length + " projetos · " + countIn("ativo") +
    ' tocados nos últimos 14 dias</p></div>' +
    '<span class="stamp"><i class="dot"></i><span class="num">varredura ' + esc(state.data.scannedAt.slice(0,16).replace("T"," ")) + "</span></span></div>" +

  '<section class="strip">' + kpis.map(k =>
    '<div class="kpi ' + (k.tone||"") + '"><span class="label">' + k.label + '</span><span class="value">' +
    k.value + '</span><span class="sub">' + k.sub + "</span></div>").join("") + "</section>" +

  '<section class="panel"><h3>Distribuição por momento</h3><p class="cap">Clique num bloco para filtrar.</p>' +
    '<div class="bar">' + bars.map(x =>
      '<button style="flex:' + x.n + ";background:" + x.b.color + '" data-band="' + x.b.key +
      '" aria-label="' + x.n + " projetos em " + x.b.label + '">' + x.n + "</button>").join("") + "</div>" +
    '<div class="legend">' + bars.map(x =>
      '<span><i class="swatch" style="background:' + x.b.color + '"></i>' + x.b.label + ' · <b class="num">' + x.n + "</b></span>").join("") +
    "</div></section>" +

  '<div class="controls">' +
    '<input class="search" id="q" type="search" placeholder="Buscar projeto…" aria-label="Buscar projeto" value="' + esc(state.q) + '">' +
    '<select id="sort" aria-label="Ordenar por">' +
      ['<option value="health">Ordenar: saúde (pior primeiro)</option>',
       '<option value="recent">Ordenar: tocado recentemente</option>',
       '<option value="stale">Ordenar: parado há mais tempo</option>',
       '<option value="name">Ordenar: nome</option>',
       '<option value="size">Ordenar: tamanho</option>'].map(o =>
        o.replace('value="' + state.sort + '"', 'value="' + state.sort + '" selected')).join("") +
    "</select></div>" +

  '<section class="grid">' + (list.length ? list.map(p => {
    const h = p.h;
    const chips = [
      { on:p.git, label:"git" }, { on:p.claudeMd, label:"CLAUDE.md" },
      { on:p.pkg, label:"node" }, { on:p.vault, label:"vault obsidian" }
    ].filter(c => c.on || c.label === "git" || c.label === "CLAUDE.md");
    return '<button class="card" data-open="' + esc(p.name) + '" style="--edge:' + h.band.color + '">' +
      "<header><h3>" + esc(p.name) + '</h3><span class="pill" style="background:' + h.band.bg + ";color:" + h.band.fg + '">' + h.band.label + "</span></header>" +
      '<div class="metrics">' +
        "<span class=\"metric\"><b>" + (h.days === null ? "—" : h.days) + "</b><small>dias parado</small></span>" +
        "<span class=\"metric\"><b>" + h.score + "</b><small>saúde</small></span>" +
        "<span class=\"metric\"><b>" + p.files + "</b><small>arquivos</small></span>" +
        "<span class=\"metric\"><b>" + p.sizeMB + "</b><small>MB</small></span>" +
      "</div>" +
      '<div class="track"><i style="width:' + Math.max(h.score,2) + "%;background:" + h.band.color + '"></i></div>' +
      '<p class="note">' + esc(diagnose(p, h)) + "</p>" +
      '<div class="chips">' + chips.map(c => '<span class="chip' + (c.on?"":" off") + '">' + c.label + "</span>").join("") + "</div>" +
    "</button>";
  }).join("") : '<div class="empty"><b>Nenhum projeto neste filtro</b>Limpe a busca ou escolha outra faixa.</div>') + "</section>";
}

const detailCache = new Map();

async function detailView(name) {

  let d = detailCache.get(name);
  if (!d) {
    try {
      const r = await fetch("/api/project/" + encodeURIComponent(name));
      if (!r.ok) throw new Error("HTTP " + r.status);
      d = await r.json();
      detailCache.set(name, d);
    } catch (e) {
      el("main").innerHTML = '<div class="failed"><b>Não consegui ler o projeto</b><code>' + esc(e.message) + "</code></div>";
      return;
    }
  }

  const t = today();
  const h = computeHealth({ ...d, claudeMd:d.docs.claudeMd, readme:!!d.docs.readmeName, git:d.git.isRepo }, t);
  const checks = buildChecks(d, t);
  const maxComp = Math.max(...d.composition.map(c => c.files), 1);
  const humano = d.recent.find(f => !isGenerated(f.path));

  el("main").innerHTML = '' +
  '<div class="crumb"><button class="btn" id="back">← Portfólio</button>' +

  '<div class="head"><div><h1>' + esc(d.name) + '</h1><p>' + esc(diagnose(
      { ...d, claudeMd:d.docs.claudeMd, readme:!!d.docs.readmeName, git:d.git.isRepo }, h)) + "</p></div>" +
    '<span class="pill" style="background:' + h.band.bg + ";color:" + h.band.fg + '">' + h.band.label + "</span></div>" +

  '<section class="strip">' + [
      { label:"Saúde", value:h.score, sub:"de 100" },
      { label:"Último toque", value:(h.days ?? "—"), sub:"dias atrás" },
      { label:"Toque humano", value:humano ? daysBetween(t, humano.mtime.slice(0,10)) : "—", sub:"dias, ignorando gerados" },
      { label:"Arquivos", value:d.files, sub:d.sizeMB + " MB" },
      { label:"Pendências", value:checks.filter(c => c.level !== "ok").length, sub:"pontos a verificar",
        tone: checks.some(c => c.level === "risk") ? "is-risk" : checks.some(c => c.level === "warn") ? "is-warn" : "" }
    ].map(k => '<div class="kpi ' + (k.tone||"") + '"><span class="label">' + k.label + '</span><span class="value">' +
       k.value + '</span><span class="sub">' + k.sub + "</span></div>").join("") + "</section>" +

  '<section class="panel"><h3>Pontos a verificar</h3><p class="cap">Derivados dos fatos da varredura, não digitados.</p>' +
    '<div class="checks">' + checks.map(c =>
      '<div class="check"><i style="background:' + LEVEL_COLOR[c.level] + '"></i><div><b>' +
      esc(c.title) + "</b><span>" + esc(c.detail) + "</span></div></div>").join("") + "</div></section>" +

  '<div class="cols">' +
    '<section class="panel"><h3>Git</h3>' + (d.git.isRepo ? '' +
      '<dl class="kv"><dt>branch</dt><dd>' + esc(d.git.branch || "—") + "</dd>" +
        "<dt>commits</dt><dd>" + (d.git.commitCount ?? "—") + "</dd>" +
        "<dt>sem commit</dt><dd>" + d.git.uncommitted + "</dd>" +
        "<dt>remote</dt><dd>" + esc(d.git.remote || "nenhum") + "</dd></dl>" +
      '<div class="scroll"><table><thead><tr><th>data</th><th>commit</th></tr></thead><tbody>' +
        d.git.commits.map(c => "<tr><td class=\"num\">" + esc(c.date) + "</td><td>" + esc(c.subject) + "</td></tr>").join("") +
      "</tbody></table></div>"
      : '<p class="note">Não é repositório git.</p>') + "</section>" +

    '<section class="panel"><h3>Composição</h3><p class="cap">Onde está o peso do projeto.</p>' +
      d.composition.map(c =>
        '<div class="compbar"><span class="lbl">' + esc(c.name) + '</span>' +
        '<span class="rail2"><i style="width:' + Math.round(c.files / maxComp * 100) + '%"></i></span>' +
        '<span class="n num">' + c.files + "</span></div>").join("") +
      '<p class="note" style="margin-top:10px">Tipos: ' +
        d.fileTypes.slice(0,6).map(f => esc(f.ext) + " " + f.n).join(" · ") + "</p></section>" +

    '<section class="panel"><h3>Arquivos recentes</h3>' +

      d.recent.slice(0,12).map(f => '<tr><td class="num">' + f.mtime.slice(0,10) + "</td><td>" +
        (isGenerated(f.path) ? '<span style="color:var(--muted)">' + esc(f.path) + " (gerado)</span>" : esc(f.path)) +
        "</td></tr>").join("") + "</tbody></table></div></section>" +

    '<section class="panel"><h3>Documentação e stack</h3>' +
      (d.pkg && !d.pkg.error
        ? '<dl class="kv"><dt>scripts</dt><dd>' + (d.pkg.scripts.join(", ") || "—") + "</dd>" +
          "<dt>deps</dt><dd>" + d.pkg.deps + " + " + d.pkg.devDeps + " dev</dd>" +
          "<dt>lockfile</dt><dd>" + esc(d.pkg.lockfile || "nenhum") + "</dd></dl>"

      (d.docs.claudeMdText
        ? "<details><summary>CLAUDE.md</summary><pre>" + esc(d.docs.claudeMdText.slice(0,2500)) + "</pre></details>"

      (d.docs.readmeText
        ? "<details><summary>" + esc(d.docs.readmeName) + "</summary><pre>" + esc(d.docs.readmeText.slice(0,2500)) + "</pre></details>"
        : "") +
    "</section>" +

    (d.todos.hits.length ? '<section class="panel"><h3>TODO / FIXME</h3><p class="cap">' +
      d.todos.hits.length + " marcações em " + d.todos.scanned + " arquivos varridos.</p>" +
      '<div class="scroll"><table><thead><tr><th>tipo</th><th>onde</th><th>o quê</th></tr></thead><tbody>' +
      d.todos.hits.slice(0,25).map(x => "<tr><td>" + esc(x.kind) + '</td><td class="num">' + esc(x.file) + ":" + x.line +
        "</td><td>" + esc(x.text) + "</td></tr>").join("") + "</tbody></table></div></section>" : "") +
  "</div>";

  el("back").onclick = () => { location.hash = ""; };
  el("reveal").onclick = async (e) => {
    e.target.disabled = true;
    try {
      await fetch("/api/reveal", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ name }) });
      e.target.textContent = "Pasta aberta";
    } catch { e.target.textContent = "Falhou"; }
    setTimeout(() => { e.target.disabled = false; e.target.textContent = "Abrir pasta"; }, 2500);
  };
}

function render() {
  renderRail();
  const main = el("main");

  if (state.loading) { main.innerHTML = '<div class="loading"><b>Varrendo Desktop\\Projects</b>Primeira varredura lê todos os projetos — leva alguns segundos.</div>'; return; }
  if (state.error)   { main.innerHTML = '<div class="failed"><b>Sem conexão com o servidor</b><code>' + esc(state.error) + "</code></div>"; return; }

  const hash = decodeURIComponent(location.hash.replace(/^#\/p\//, ""));
  if (location.hash.startsWith("#/p/") && hash) { detailView(hash); return; }

  main.innerHTML = listView();
  main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { location.hash = "#/p/" + encodeURIComponent(b.dataset.open); });
  main.querySelectorAll("[data-band]").forEach(b => b.onclick = () => {
    state.band = state.band === b.dataset.band ? "todos" : b.dataset.band; render();
  });
  const q = el("q");
  if (q) { q.oninput = e => { state.q = e.target.value; render(); q.focus(); }; }
  const s = el("sort");
  if (s) s.onchange = e => { state.sort = e.target.value; render(); };
}

/* ========================================================== avisar / aviso
   COPIADO do tester.html, bloco a bloco, como o resto do chrome compartilhado.
   Uma mudanca la tem que ser repetida aqui ate o dia em que isto virar arquivo
   proprio. `preview/gen-avisos-preview.js` desenha os quatro tipos nos dois
   modos, e e ele que prova que as tres paginas dizem a mesma coisa do mesmo
   jeito. Ver o bloco AVISOS no CSS para o porque de cada decisao. */
const AVISO_GLIFO = { erro: "✕", alerta: "!", ok: "✓", info: "i" };
const AVISO_VIDA = { ok: 4500, info: 6000 };   // erro e alerta não somem sozinhos
// Quanto a pausa por hover pode esticar a vida, no máximo. Ver `avisar()`.
const VIDA_MAX_PAUSA = 20000;

function avisoHtml(msg, tipo, titulo) {
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  return '<div class="aviso ' + t + '" role="' + (t === "erro" ? "alert" : "status") + '">' +
    '<span class="ai" aria-hidden="true">' + AVISO_GLIFO[t] + "</span>" +
    '<span class="ac">' + (titulo ? '<span class="at">' + esc(titulo) + "</span>" : "") + esc(msg) + "</span>" +
    "</div>";
}

function pilhaAvisos() {
  let p = document.querySelector(".avisos");
  if (p) return p;
  p = document.createElement("div");
  p.className = "avisos";
  document.body.appendChild(p);
  return p;
}

function avisar(msg, tipo, titulo) {
  if (!msg) return null;
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  const vida = AVISO_VIDA[t] || 0;
  const pilha = pilhaAvisos();

  /* Montado por DOM, nunca por `innerHTML`. Duas razões: a mensagem vem de erro
     de servidor e de nome de arquivo, ou seja de fora, e `textContent` fecha essa
     porta sem depender de ninguém lembrar de escapar; e assim este bloco é
     idêntico nas três páginas — o `flows.html` não tem `esc()`. */
  const cartao = document.createElement("div");
  cartao.className = "aviso " + t;
  cartao.setAttribute("role", t === "erro" ? "alert" : "status");
  cartao.setAttribute("aria-live", t === "erro" ? "assertive" : "polite");

  const gl = document.createElement("span");
  gl.className = "ai"; gl.setAttribute("aria-hidden", "true"); gl.textContent = AVISO_GLIFO[t];
  const corpo = document.createElement("span");
  corpo.className = "ac";
  if (titulo) {
    const tt = document.createElement("span");
    tt.className = "at"; tt.textContent = titulo;
    corpo.appendChild(tt);
  }
  corpo.appendChild(document.createTextNode(msg));
  const fechar = document.createElement("button");
  fechar.type = "button"; fechar.className = "ax";
  fechar.setAttribute("aria-label", "fechar aviso"); fechar.textContent = "×";
  cartao.append(gl, corpo, fechar);
  if (vida) {
    const barra = document.createElement("span");
    barra.className = "abar"; barra.setAttribute("aria-hidden", "true");
    barra.style.animationDuration = vida + "ms";
    cartao.appendChild(barra);
  }

  const sair = () => {
    if (!cartao.isConnected) return;
    cartao.classList.add("saindo");
    // Espera a animação de saída, mas nunca depende dela: `setTimeout` remove de
    // qualquer forma, senão um `prefers-reduced-motion` que zera a duração
    // deixaria o cartão pendurado para sempre.
    setTimeout(() => cartao.remove(), 200);
  };
  fechar.addEventListener("click", sair);
  if (vida) {
    let timer = setTimeout(sair, vida);
    // O mouse em cima pausa a contagem: ler uma frase de 12 palavras leva mais
    // que 4,5s, e ver o aviso fugir debaixo do cursor é o pior defeito de toast.
    cartao.addEventListener("mouseenter", () => {
      clearTimeout(timer);
      const b = cartao.querySelector(".abar");
      if (b) b.style.animationPlayState = "paused";
    });
    cartao.addEventListener("mouseleave", () => {
      timer = setTimeout(sair, 1200);
      const b = cartao.querySelector(".abar");
      if (b) b.style.animationPlayState = "running";
    });
  }

  pilha.appendChild(cartao);
  // Teto de 4 na tela. Sem ele, uma pasta com oito arquivos recusados vira uma
  // coluna de avisos que cobre a página inteira — e o oitavo esconde o primeiro.
  const todos = [...pilha.querySelectorAll(".aviso")];
  if (todos.length > 4) todos.slice(0, todos.length - 4).forEach(x => x.remove());
  return cartao;
}

/* Modo gravação — copiado do flows.html, como o resto do chrome. Mesma chave
   (`cockpit-rec`): ligar aqui liga nos fluxos e no tester. */
const REC_KEY = "cockpit-rec";
function recPaint() {
  const on = document.documentElement.getAttribute("data-rec") === "1";
  const b = el("rec");
  b.querySelector(".lbl").textContent = on ? "REC" : "Gravar";
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.title = on
    ? "modo gravação ligado — clique para desligar"
    : "modo gravação — borra dados sensíveis para filmar a tela";
}
function recWave(btn) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const w = document.createElement("div");
  w.className = "rec-wave";
  document.body.append(w);
  w.animate(
    [{ clipPath: `circle(0px at ${x}px ${y}px)`, opacity: .95 },
     { clipPath: `circle(${raio}px at ${x}px ${y}px)`, opacity: 0 }],
    { duration: 700, easing: "cubic-bezier(.22,.61,.36,1)" }
  ).onfinish = () => w.remove();
}
el("rec").onclick = () => {
  const on = document.documentElement.getAttribute("data-rec") !== "1";
  if (on) document.documentElement.setAttribute("data-rec", "1");
  else document.documentElement.removeAttribute("data-rec");
  try { on ? localStorage.setItem(REC_KEY, "1") : localStorage.removeItem(REC_KEY); } catch { /* modo privado */ }
  recWave(el("rec"));
  recPaint();
};
addEventListener("storage", e => {
  if (e.key !== REC_KEY) return;
  if (e.newValue === "1") document.documentElement.setAttribute("data-rec", "1");
  else document.documentElement.removeAttribute("data-rec");
  recPaint();
});
recPaint();
load(false);
</script>
<script>
/* ═══════════════════════════════════════════════════ NAV — a lente de vidro
   BLOCO COMPARTILHADO. Idêntico em flows.html, tester.html e cockpit.html,
   gerado por preview/aplicar-nav.js e travado por nav-sync-test.js.

   As três portas são navegação DE VERDADE: clicar recarrega a página. Então a
   lente nunca seria vista viajando — cada página nasceria com ela parada no
   lugar. Ela parte da porta DE ONDE VOCÊ VEIO, guardada em sessionStorage, e
   voa até a atual no carregamento. Mesma disciplina do resto do painel: só
   anima quando há informação nova atrás (você trocou de tela); F5 na mesma
   porta não anima nada, e uma aba nova também não, porque ali você não veio de
   lugar algum.

   Nada aqui julga: a navegação não tem estado de saúde, não lê fato nenhum e
   não faz uma única chamada. */
(function () {
  "use strict";
  var nav = document.querySelector(".nvd");
  if (!nav) return;
  var lente = nav.querySelector(".lente");
  if (!lente) return;

  var CHAVE = "cockpit.nav.v1";
  var reduzir = function () {
    return matchMedia("(prefers-reduced-motion: reduce)").matches;
  };

  /* Mesmo integrador do springNumber() — passo fixo de 16ms, porque com a aba em
     segundo plano o dt real explode e a mola diverge em vez de assentar. A
     afinação é OUTRA de propósito: lá a razão de amortecimento é ~0,97, porque
     um contador que passa do valor e volta lê como dado errado; aqui é ~0,54,
     porque passar e voltar é o que faz parecer líquido. */
  var K = 170, C = 14, M = 1;
  /* Quanto a velocidade vira deformação. Medido: em 0,055 o esticão grudava no
     teto e deformação constante lê como escala fixa, não como física. */
  var ESTICA = 0.022, TETO = 0.16;

  var x = 0, vx = 0, w = 30, vw = 0, vivo = false;

  function alvo() {
    var a = nav.querySelector('[aria-current="page"]');
    if (!a) return null;
    /* Lido A CADA QUADRO: o rótulo abre por CSS, então o destino se move. */
    var ax = a.offsetLeft, aw = a.offsetWidth;
    /* Ímã: com o cursor sobre uma porta inativa a lente se inclina para ela.
       4px lê como intenção e é pouco para não parecer erro. */
    var h = nav.querySelector("a:hover");
    if (h && h !== a) ax += (h.offsetLeft > a.offsetLeft ? 1 : -1) * 4;
    return { x: ax, w: aw };
  }

  /* A deformação SAI da velocidade da própria mola: estica no eixo do movimento
     e comprime no outro, volume preservado. É o que separa vidro líquido de
     pastilha com easing. A origem segue o sentido do movimento — com origem no
     centro a lente esticava para os dois lados e vazava para fora do leito. */
  function pintar(v) {
    var d = Math.min(TETO, Math.abs(v) * ESTICA / 100);
    lente.style.setProperty("--x", x.toFixed(2) + "px");
    lente.style.setProperty("--w", w.toFixed(2) + "px");
    lente.style.setProperty("--sx", (1 + d).toFixed(3));
    lente.style.setProperty("--sy", (1 - d * 0.72).toFixed(3));
    if (Math.abs(v) > 12) {
      lente.style.setProperty("--org", v > 0 ? "left center" : "right center");
    }
  }

  function assentar() {
    var t = alvo();
    if (!t) return;
    x = t.x; w = t.w; vx = 0; vw = 0;
    lente.style.setProperty("--org", "center");
    pintar(0);
  }

  function passo() {
    var t = alvo();
    if (!t) { vivo = false; return; }
    if (reduzir()) { assentar(); vivo = false; return; }
    var i, dt = 0.016;
    for (i = 0; i < 2; i++) {
      vx += ((-K * (x - t.x) - C * vx) / M) * dt; x += vx * dt;
      vw += ((-K * (w - t.w) - C * vw) / M) * dt; w += vw * dt;
    }
    pintar(vx);
    if (Math.abs(t.x - x) < 0.35 && Math.abs(vx) < 3 &&
        Math.abs(t.w - w) < 0.35 && Math.abs(vw) < 3) {
      x = t.x; w = t.w; vx = 0; vw = 0; pintar(0); vivo = false; return;
    }
    requestAnimationFrame(passo);
  }

  function acordar() { if (!vivo) { vivo = true; requestAnimationFrame(passo); } }

  var aqui = (nav.querySelector('[aria-current="page"]') || {}).dataset;
  aqui = aqui ? aqui.porta : null;

  /* A partida. Se a porta anterior desta aba não é esta, a lente nasce lá e voa
     para cá. Só então a varredura de brilho se paga: ela marca uma chegada. */
  var de = null;
  try { de = sessionStorage.getItem(CHAVE); } catch (e) { de = null; }
  var origem = de && de !== aqui ? nav.querySelector('[data-porta="' + de + '"]') : null;

  if (origem && !reduzir()) {
    x = origem.offsetLeft; w = origem.offsetWidth; vx = 0; vw = 0;
    pintar(0);
    lente.classList.add("varre");
    acordar();
  } else {
    assentar();
  }
  try { if (aqui) sessionStorage.setItem(CHAVE, aqui); } catch (e) {}

  nav.addEventListener("pointerover", acordar);
  nav.addEventListener("pointerout", acordar);
  addEventListener("resize", assentar);

  /* O atalho que o chip promete. Navega de verdade; alt+dígito não digita nada
     em campo de texto, então não precisa de guarda contra o compositor. */
  addEventListener("keydown", function (ev) {
    if (!ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var i = "123".indexOf(ev.key);
    if (i < 0) return;
    var a = nav.querySelectorAll("a")[i];
    if (!a || a.getAttribute("aria-current") === "page") return;
    ev.preventDefault();
    location.href = a.getAttribute("href");
  });
}());
</script>
</body>
</html>
