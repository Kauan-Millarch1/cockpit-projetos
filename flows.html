  // O que você já fez nessa falha antes — nota própria vale mais que qualquer
  // sugestão, então vem primeiro e sempre.
  for (const h of pastFixes(g.key)) {
    const same = h.key === g.key;
    const hw = S.workflows.get(h.key.split("|")[0]);
    const onde = same ? "" : " no fluxo " + (hw ? shortName(hw.name) : h.key.split("|")[0]);
    e.append(el("div", "note past",
      (h.undoneAt ? "↺ Já tentei isso" : "✎ Da última vez") + onde
      + " (há " + agoShort(Date.now() - new Date(h.markedAt).getTime()) + ")"
      + (h.undoneAt ? " e não resolveu" : "") + ": " + h.note));
  }

  // Sugestão heurística, e rotulada como tal.
  const tip = suggestFor(g.d);
  if (tip) e.append(el("div", "tip", "💡 Sugestão (heurística, não diagnóstico): " + tip));

  // A assinatura crua, no formato do superflow — é por ela que se casa este
  // grupo com um FL do vault.
  const sig = el("div", "when");
  sig.style.opacity = ".75";
  sig.textContent = g.key;
  e.append(sig);

  const acts = el("div", "acts");
  const b1 = el("button", "btn", "▶ Ver falha no fluxo");
  b1.onclick = () => selectWorkflow(g.d.workflowId, g.samples[0].id);
  acts.append(b1);
  if (wf) {
    const b2 = el("button", "btn ghost", "Abrir no n8n ↗");
    b2.onclick = () => window.open(S.instance + "/workflow/" + wf.id + "/executions/" + g.samples[0].id, "_blank");
    acts.append(b2);
  }
  // Atalho para onde o defeito realmente está. Sem ele o "Abrir no n8n" leva ao
  // fluxo onde o nó não existe, que é a viagem perdida que este cartão causava.
  if (origin.state === "subflow") {
    const b2b = el("button", "btn ghost", "Abrir sub-fluxo ↗");
    b2b.title = "Abre " + origin.childName + ", onde o nó " + origin.node + " realmente está";
    b2b.onclick = () => window.open(S.instance + "/workflow/" + origin.childId, "_blank");
    acts.append(b2b);
  }
  if (g.fixSt === "resolved") {
    const b3 = el("button", "btn ghost", "↩ Reabrir");
    b3.title = "Desmarca a correção e devolve a assinatura para o quadro";
    b3.onclick = () => markFix(g, { undo: true, btn: b3, card: e });
    acts.append(b3);
  } else {
    const b3 = el("button", "btn ok", "✓ Correção feita");
    b3.title = g.fixSt === "reopened"
      ? "Remarcar: some do quadro até falhar de novo depois da execução " + newestSampleId(g)
      : "Marca como corrigido. Volta sozinho ao quadro se a falha reincidir depois da execução " + newestSampleId(g);
    b3.onclick = () => openFixForm(g, e, b3);
    acts.append(b3);
    const b4 = el("button", "btn beam", "⧉ Mandar pro Claude");
    b4.title = "Roda o Claude Code nesta máquina em cima deste fluxo, valida a proposta e te mostra o diff para aprovar. Nada é escrito no n8n sem o seu clique.";
    b4.onclick = () => openHandoff(g, b4);
    acts.append(b4);
  }
  e.append(acts);
  return e;
}

// O que fazer aparece ANTES de salvar: a nota é o valor da feature, e pedir
// depois (num toast, num prompt) é pedir num momento em que ele já saiu do
// contexto. Salvar sem nota é permitido — atrito obrigatório mata o hábito.
function openFixForm(g, card, btn) {
  if (card.querySelector(".fixform")) return card.querySelector("textarea").focus();
  btn.disabled = true;

  const f = el("div", "fixform");
  f.append(el("label", null, "O que você ajustou no n8n para resolver? (fica gravado para a próxima vez)"));
  const ta = el("textarea");
  ta.placeholder = "ex: reautorizei a credencial do Slack; o token tinha sido revogado";
  ta.maxLength = 600;
  f.append(ta);

  const row = el("div", "acts");
  const save = el("button", "btn ok", "✓ Salvar correção");
  save.onclick = () => markFix(g, { btn: save, card, note: ta.value, form: f });
  const skip = el("button", "btn ghost", "Salvar sem descrever");
  skip.onclick = () => markFix(g, { btn: skip, card, form: f });
  const cancel = el("button", "btn ghost", "Cancelar");
  cancel.onclick = () => { f.remove(); btn.disabled = false; renderErrors({ force: true }); };  // pega o que o poll deixou passar
  row.append(save, skip, cancel);
  f.append(row);
  card.append(f);
  ta.focus();

  // Ctrl+Enter salva — o caminho rápido para quem já está digitando.
  ta.onkeydown = ev => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) save.click(); };
}

// `force` = redesenho pedido por uma ação do Kauan. Sem ele, um poll no meio da
// digitação apagaria o formulário aberto junto com a descrição meio escrita — e
// esse texto é justamente o que a feature existe para capturar. Quadro
// momentaneamente velho vale menos que a nota perdida.
// `null` até a primeira pintura, para que ela anime; depois guarda o conjunto de
// assinaturas já mostradas, e só o que entra depois disso é que se anima.
let seenErrKeys = null, seenCardIds = null;

function renderErrors({ force = false } = {}) {
  if (!force && $("#errs").querySelector(".fixform")) {
    const hint = $("#err-hint");
    if (!hint.querySelector(".paused")) {
      const p = el("span", "filterchip paused", "⏸ quadro pausado enquanto você descreve");
      hint.prepend(p);
    }
    return;
  }

  const all = errorGroups().filter(g => {
    // Filtro por fluxo vence o de projeto: é a escolha mais específica.
    if (S.errFilterWf) return g.d.workflowId === S.errFilterWf;
    if (!S.selectedProject) return true;
    const wf = S.workflows.get(g.d.workflowId);
    return !wf || projectOf(wf.name) === S.selectedProject;
  });

  const open = [], done = [];
  for (const g of all) {
    g.fix = S.fixes.get(g.key) || null;
    g.fixSt = fixState(g, g.fix);
    ensureLocate(g);          // onde o nó vive: fato, buscado uma vez por assinatura
    (g.fixSt === "resolved" ? done : open).push(g);
  }

  // O chip é o que diz que o quadro está filtrado — não o contorno do cartão lá
  // embaixo, que também acende quando o palco muda por outro caminho.
  const hint = $("#err-hint"); hint.innerHTML = "";
  if (S.errFilterWf) {
    const wf = S.workflows.get(S.errFilterWf);
    const chip = el("span", "filterchip");
    chip.append(el("span", null, "só " + (wf ? shortName(wf.name) : S.errFilterWf)));
    const x = el("button", null, "✕ ver todos");
    x.onclick = ev => { ev.stopPropagation(); filterErrorsByWorkflow(null); };
    chip.append(x);
    hint.append(chip);
  }
  if (all.length) {
    hint.append(document.createTextNode(
      (S.errFilterWf ? "· " : "")
      + open.length + " aberta" + (open.length === 1 ? "" : "s") + " · " + open.reduce((s, g) => s + g.count, 0) + " falhas"
      + (done.length ? " · " + done.length + " corrigida" + (done.length === 1 ? "" : "s") : "")));
  }

  const box = $("#errs"); box.innerHTML = "";

  // Sem as marcas, o quadro não sabe o que já foi resolvido. Dizer isso primeiro,
  // antes de qualquer contagem — todas elas ficam suspeitas enquanto o GET falha.
  if (S.fixesError) {
    const n = el("div", "fixerr");
    n.style.margin = "0 0 8px";
    n.textContent = "⚠ Não consegui ler as correções marcadas (" + S.fixesError
      + "). O quadro pode estar mostrando como aberta uma falha que você já resolveu, "
      + "e marcar uma nova correção vai falhar.";
    box.append(n);
  }

  // Nunca apresentar uma lista capada como completa.
  if (S.errorsTruncated) {
    const n = el("div", "when");
    n.style.padding = "2px 2px 4px";
    n.textContent = "⚠ Detalhe carregado só das " + S.errorsDetailed + " falhas mais recentes de "
      + S.errorsTotal + ". As assinaturas abaixo são um piso, não o total.";
    box.append(n);
  }

  // Uma marca cuja assinatura não aparece na janela normalmente é boa notícia —
  // a correção pegou e a falha parou. Mas se o detalhe veio capado, a ausência
  // não prova nada, e aí o número de marcas na tela é um piso.
  if (S.errorsTruncated) {
    const seen = new Set(all.map(g => g.key));
    const orphans = [...S.fixes.keys()].filter(k => {
      if (seen.has(k)) return false;
      if (!S.selectedProject) return true;
      const wf = S.workflows.get(k.split("|")[0]);
      return !wf || projectOf(wf.name) === S.selectedProject;
    });
    if (orphans.length) {
      const n = el("div", "when");
      n.style.padding = "0 2px 4px";
      n.textContent = "⚠ " + orphans.length + " marca" + (orphans.length === 1 ? "" : "s")
        + " de correção sem assinatura nesta janela. Com o detalhe capado não dá para dizer se pararam de falhar.";
      box.append(n);
    }
  }

  if (!open.length) {
    const wf = S.errFilterWf ? S.workflows.get(S.errFilterWf) : null;
    box.append(el("div", "empty",
      S.errFilterWf
        ? (done.length
            ? "Nenhuma falha aberta em " + (wf ? shortName(wf.name) : S.errFilterWf) + " — só corrigidas."
            : "Nenhuma falha em " + (wf ? shortName(wf.name) : S.errFilterWf) + " nas últimas " + WINDOW_H + "h. 🟢")
        : done.length
          ? "Nenhuma falha aberta. " + done.length + " assinatura" + (done.length === 1 ? "" : "s")
            + " marcada" + (done.length === 1 ? "" : "s") + " como corrigida abaixo."
          : "Nenhuma falha nas últimas " + WINDOW_H + " horas. 🟢"));
  }
  // Entrada escalonada só no que é novo. O SSE redesenha este quadro a cada
  // poll; animar tudo de novo faria a tela piscar a cada 15s sem nenhuma
  // informação nova por trás do movimento.
  // Entrada escalonada na primeira pintura e depois só no que é novo. O SSE
  // redesenha este quadro a cada poll; reanimar tudo faria a tela piscar de 15
  // em 15 segundos sem nenhuma informação nova por trás do movimento.
  open.forEach((g, i) => {
    const c = errorCard(g);
    if (!seenErrKeys || !seenErrKeys.has(g.key)) { c.classList.add("rise"); c.style.setProperty("--i", i); }
    box.append(c);
  });
  seenErrKeys = new Set(all.map(g => g.key));

  // Corrigido não é deletado: ganha seção própria, colapsada. Esconder de vez
  // seria perder a única prova de que a falha aconteceu e foi tratada — e é
  // nessa lista que a descrição do que foi ajustado fica guardada.
  const d = $("#fixed"), eb = $("#fixed-eyebrow");
  d.innerHTML = "";
  if (!done.length) { d.style.display = "none"; eb.style.display = "none"; return; }
  d.style.display = ""; eb.style.display = "";
  $("#fixed-hint").textContent = done.length + " assinatura" + (done.length === 1 ? "" : "s")
    + (S.errorsTruncated ? " · recorrência não verificável (detalhe capado)" : " · reaparecem sozinhas se reincidirem");
  d.append(el("summary", null, "▸ ver as " + done.length + " corrigida" + (done.length === 1 ? "" : "s")
    + (done.filter(g => g.fix?.note).length ? " (" + done.filter(g => g.fix?.note).length + " com descrição do ajuste)" : "")));
  const list = el("div", "errs");
  list.style.marginTop = "8px";
  for (const g of done) list.append(errorCard(g));
  d.append(list);
}

// Clicar num cartão de fluxo filtra o quadro de erros. Só o cartão faz isso:
// "Ver falha no fluxo" e a linha do Ao vivo mudam o palco sem mexer no filtro,
// senão inspecionar uma falha colapsaria o quadro que ele estava lendo.
function filterErrorsByWorkflow(wfId) {
  S.errFilterWf = wfId;
  renderErrors({ force: true });
  // Redesenha os cartões na hora para o contorno do filtro acompanhar. Esperar
  // o selectWorkflow deixaria o cartão sem marca enquanto o grafo carrega.
  renderCards(flowsWithActivity());
}

/* O maior id de execução desta assinatura NO INSTANTE do clique.
 *
 * Ler só `g.samples` era um bug de tempo: o grupo é montado no render, o SSE
 * segue trazendo falhas enquanto a tela fica aberta (e uma correção do Claude
 * leva minutos), e o objeto `g` que a tela do handoff carrega é o de quando o
 * cartão foi desenhado. Marcar com o id velho e comparar com o novo faz
 * `fixState` devolver "reopened" na hora — a marca é gravada, o cartão não sai
 * do quadro, e parece que "não salvou". Foi exatamente o sintoma relatado.
 *
 * `S.details` é o estado corrente, então o piso vem do cartão e o teto do que
 * já chegou desde então. Marcar significa "considero resolvido tudo que
 * aconteceu até agora" — o que vier com id maior reabre, como sempre. */
function newestSampleId(g) {
  let best = g.samples.reduce((m, s) => (execIdNum(s.id) > execIdNum(m) ? s.id : m), g.samples[0].id);
  for (const d of S.details.values()) {
    if (d.status !== "error" || errorKey(d) !== g.key) continue;
    if (execIdNum(d.id) > execIdNum(best)) best = d.id;
  }
  return String(best);
}

// Relido a cada poll, não só no boot: com duas abas abertas, uma marcação feita
// na aba A deixaria a aba B mostrando a falha como aberta — e um segundo clique
// em "Correção feita" sobrescreveria o maxExecIdAtFix com um id mais novo,
// engolindo em silêncio a reincidência que já tinha reaberto a assinatura.
// Falha aqui NÃO pode ser silenciosa. `fixes.json` é a única memória de quais
// falhas já foram resolvidas; se o GET quebra, `S.fixes` fica vazio e o quadro
// vira indistinguível de "nenhuma correção marcada" — uma falha que você já
// consertou reaparece como aberta e não tem como perceber. O erro é guardado e
// dito no quadro, porque um número em que não se pode confiar é pior que
// nenhum número.
async function loadFixes() {
  try {
    const res = await fetch("/api/fixes");
    if (!res.ok) throw new Error("HTTP " + res.status
      + (res.status === 404 ? " — servidor antigo ainda rodando; reinicie pelo start-cockpit.cmd" : ""));
    const fx = await res.json();
    if (fx.error) throw new Error(fx.error);
    S.fixes = new Map((fx.fixes || []).map(f => [f.key, f]));
    S.history = fx.history || [];
    S.fixesError = null;
  } catch (err) {
    // Mantém o mapa anterior: num poll que falhou, o dado velho vale mais que
    // um mapa vazio. Mas o aviso fica de pé até um GET dar certo.
    S.fixesError = err.message || String(err);
  }
}

// Histórico relevante para esta assinatura: nota exata primeiro, depois o mesmo
// nó+tipo em outro fluxo. Só entradas COM nota — "corrigi e não escrevi nada"
// não ensina nada. Duas por cartão: mais que isso é parede de texto.
function pastFixes(key) {
  const cur = S.fixes.get(key);
  const sim = similarKey(key);
  return S.history
    .filter(h => h.note && similarKey(h.key) === sim)
    .filter(h => !(cur && h.key === key && h.markedAt === cur.markedAt))   // não repetir a marca atual
    .sort((a, b) => String(b.markedAt).localeCompare(String(a.markedAt)))
    .slice(0, 2);
}

/* Devolve `{ok, error}` porque agora existe um chamador que precisa da resposta:
   a tela de conclusão do handoff, que marca sozinha depois de aplicar. Lá o
   erro não pode virar um aviso dentro de um cartão que está atrás do modal — daí
   `silent`, que suprime o feedback no cartão sem suprimir o registro do erro em
   `S.fixesError`, que continua sendo dito no topo do quadro. */
async function markFix(g, { undo = false, btn, card, note, form, silent = false } = {}) {
  const label = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  card?.querySelector(".fixerr")?.remove();
  try {
    const res = await fetch("/api/fixes", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(undo
        ? { key: g.key, undo: true }
        : { key: g.key, maxExecId: newestSampleId(g), note: note || null })
    });
    const out = await res.json();
    if (!res.ok || out.error) throw new Error(out.error || ("HTTP " + res.status
      + (res.status === 404 ? " — servidor antigo ainda rodando; reinicie pelo start-cockpit.cmd" : "")));
    S.fixes = new Map((out.fixes || []).map(f => [f.key, f]));
    S.history = out.history || S.history;
    S.fixesError = null;      // gravou: o aviso do quadro não faz mais sentido

    // Anima primeiro, redesenha depois — e só depois da resposta do servidor.
    // Verde antes de salvar seria mentira se o POST falhasse.
    if (card && !undo) {
      form?.remove();
      card.classList.add("settling");
      await new Promise(r => setTimeout(r, 560));
    }
    renderErrors({ force: true });
    // A nota volta junto para a tela mostrar exatamente o texto que foi gravado.
    return { ok: true, note: undo ? null : (note || null) };
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    // Erro dentro do cartão, não na linha de status do palco: lá ele fica
    // truncado num painel que o Kauan não está olhando — foi por isso que o
    // botão pareceu não funcionar.
    const msg = "✕ Não salvou: " + (err.message || err);
    // O aviso no topo do quadro passa a valer também aqui: se o POST falhou, as
    // marcas na tela não refletem o disco. Ele aparece no próximo render.
    S.fixesError = err.message || String(err);
    if (card && !silent) {
      const n = el("div", "fixerr", msg);
      (form || card).append(n);
    }
    if (!silent) setStep(msg);
    // O quadro precisa redesenhar mesmo no erro: é ele que passa a exibir o
    // aviso de que as marcas na tela não refletem o disco.
    if (silent) renderErrors({ force: true });
    return { ok: false, error: err.message || String(err), note: undo ? null : (note || null) };
  }
}

/* Briefing para o Claude. Montado só com o que já está em S.details — a
 * whitelist do n8n.js não é alargada para "enriquecer o prompt". O handoff para
 * aqui: o cockpit observa, e mutação de workflow exige autorização por ação com
 * diff na mão, então o botão entrega o contexto, não aplica a correção. */
function briefingFor(g) {
  const wf = S.workflows.get(g.d.workflowId);
  const url = S.instance + "/workflow/" + g.d.workflowId;
  const L = [];
  L.push("Falha recorrente no n8n. Quero diagnóstico e proposta de correção.");
  L.push("");
  L.push("Assinatura (formato superflow): " + g.key);
  L.push("Fluxo: " + (wf ? wf.name : "(desconhecido)") + " — id " + g.d.workflowId);
  L.push("Editor: " + url);
  L.push("Nó: " + errorNodeOf(g.d) + (g.d.error?.nodeName ? "" : "  (inferido do último nó executado — o n8n não informou error.node)"));
  L.push("Tipo: " + errorTypeOf(g.d));
  // Com o detalhe capado, `g.count` conta só as execuções cujo detalhe foi
  // buscado — é um piso. Mandar o número seco faria o Claude raciocinar sobre um
  // total que não existe.
  L.push("Ocorrências: " + g.count + "× nas últimas " + WINDOW_H + "h"
    + (S.errorsTruncated ? " (PISO — o detalhe das falhas veio capado nesta janela, pode ter mais)" : "")
    + " · primeira há " + agoShort(Date.now() - new Date(g.first).getTime())
    + " · última há " + agoShort(Date.now() - new Date(g.last).getTime()));
  if (g.d.lastNode) L.push("Último nó executado: " + g.d.lastNode);

  // Onde o nó vive, dito antes de qualquer outra coisa: sem isto o Claude gasta
  // uma rodada descobrindo que o nó não está no arquivo que recebeu.
  const org = nodeOrigin(g);
  if (org.state === "subflow") {
    L.push("");
    L.push("ATENÇÃO: o nó `" + org.node + "` NÃO existe no fluxo acima. Ele vive no sub-fluxo `"
      + org.childName + "` (id " + org.childId + "), chamado pelo nó `" + org.viaNode + "`. "
      + "O n8n reporta a falha do filho no pai. O conserto é no sub-fluxo.");
    if (org.ambiguous) {
      L.push("Ressalva: " + org.ambiguous.length + " sub-fluxos deste pai têm um nó com esse nome ("
        + org.ambiguous.join(", ") + ") e a execução não disse qual chamou. Confirme pelo contexto antes de propor.");
    }
  } else if (org.state === "elsewhere") {
    L.push("");
    L.push("ATENÇÃO: o nó `" + org.node + "` não foi encontrado neste fluxo nem nos sub-fluxos chamados "
      + "diretamente por ele. Pode estar mais fundo na cadeia de chamadas.");
  }

  // O caminho que a execução percorreu antes de quebrar. É o que separa
  // "o nó X falhou" de "o nó X falhou DEPOIS de Y e Z, nesta ordem, com estes
  // tempos" — e é onde costuma aparecer o nó que produziu o dado ruim.
  const runs = g.d.nodeRuns || [];
  if (runs.length) {
    L.push("");
    L.push("Caminho executado até a falha (" + runs.length + " nós, últimos " + Math.min(10, runs.length) + "):");
    for (const r of runs.slice(-10)) {
      L.push("- " + r.name + (r.ms != null ? " · " + dur(r.ms) : "")
        + (r.status && r.status !== "success" ? " · " + r.status : ""));
    }
  }
  L.push("");
  L.push("Mensagem" + (g.msgs.size > 1 ? "s (mesma assinatura, causas possivelmente distintas)" : "") + ":");
  for (const m of g.msgs.size ? [...g.msgs] : ["(sem mensagem)"]) L.push("- " + m);
  if (g.d.error?.description) L.push("Descrição: " + g.d.error.description);
  L.push("");
  L.push("Execuções de exemplo:");
  for (const s of g.samples.slice(0, 5)) L.push("- " + s.id + " — " + url + "/executions/" + s.id);
  if (g.fix) L.push("", "Já foi marcada como corrigida em " + g.fix.markedAt + " e reincidiu — a correção anterior não resolveu.");
  L.push("");
  L.push("O que eu quero:");
  L.push("1. Ler o workflow na instância e achar a causa raiz deste nó.");
  L.push("2. Propor a correção mínima e me mostrar o diff ANTES de aplicar.");
  L.push("3. Não aplicar nada sem eu autorizar essa ação específica. Nunca apagar nó — só adicionar, modificar ou desconectar.");
  L.push("");
  L.push("Instância: " + S.instance + " (MCP n8n é read-only; mutação só pela REST API, e só depois do meu ok).");
  L.push("Se ajudar, a skill `superflow` cobre esse ciclo de falha em fluxo n8n.");
  return L.join("\n");
}

/* ==========================================================================
   HANDOFF — a tela do "Mandar pro Claude"

   Oito etapas, roteiro em `HANDOFF` no bloco de juízo. Duas delas batem na API
   do n8n pelas MESMAS rotas whitelistadas que o palco usa; três só mostram o
   que o painel já tem em memória; as três últimas rodam o Claude Code local,
   as portas de validação e a revisão do diff. Nada aqui é temporizador
   fingindo trabalho.

   A tela para no diff. Aprovar é o único caminho de escrita no n8n em todo o
   cockpit, e ele exige um clique em cima do diff que já está na tela. Se o CLI
   do Claude não existir nesta máquina, tudo isto degrada para o handoff antigo
   por clipboard — dizendo o motivo, nunca fingindo que a sessão rodou.
   ========================================================================== */

/* Toda chamada às rotas novas passa por aqui, e a razão é específica.
 *
 * Quando o servidor não conhece a rota ele responde 404 com o corpo `404` em
 * texto puro — e `Response.json()` em cima de "404" NÃO dá erro: devolve o
 * NÚMERO 404, que é JSON válido. O painel então tratava esse número como o
 * objeto de status, lia `capab.claudeBin` como `undefined` e acusava na tela
 * "Claude Code CLI não encontrado em undefined". Ou seja: culpava o CLI do
 * Kauan por um problema que era de processo velho servindo rota que não existe.
 *
 * Node não recarrega `server.js`. Depois de editar o arquivo, o processo antigo
 * continua respondendo as rotas antigas e o único sintoma é 404 no que é novo —
 * exatamente o modo de falha que o resto deste painel já documenta. Então aqui
 * o 404 é nomeado pelo que ele é, e qualquer corpo que não seja objeto vira
 * erro em vez de virar dado. */
const STALE_HINT = "esta rota não existe no servidor que está rodando — ele subiu antes desta versão do "
  + "server.js. O Node não recarrega o arquivo sozinho: feche a janela do cockpit e abra de novo.";

async function callApi(path, opt) {
  let res;
  try { res = await fetch(path, opt); }
  catch (err) { return { ok: false, error: "não consegui falar com o servidor do cockpit: " + (err.message || err) }; }

  let body = null;
  try { body = await res.json(); } catch { body = null; }
  if (!body || typeof body !== "object" || Array.isArray(body)) {
    return { ok: false, status: res.status,
      error: res.status === 404 ? STALE_HINT : "resposta inesperada de " + path + " (HTTP " + res.status + ")" };
  }
  if (!res.ok) return { ok: false, status: res.status, body, error: body.error || ("HTTP " + res.status) };
  return { ok: true, status: res.status, body };
}

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Com movimento reduzido as etapas ainda rodam e o briefing ainda é copiado;
// só a pausa entre linhas some. Nenhuma informação depende da animação.
const nap = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));

let handoffLive = null;

async function openHandoff(g, btn) {
  if (handoffLive) return;
  const tok = {};                       // cancelamento: fechar durante a corrida
  handoffLive = tok;
  const alive = () => handoffLive === tok;
  const wf = S.workflows.get(g.d.workflowId);

  /* ---------------------------------------------------------------- chrome */
  const scrim = el("div", "hoff-scrim");
  // Diálogo de verdade, não uma div sobreposta: sem `role`/`aria-modal` o leitor
  // de tela continua lendo a página atrás como se nada tivesse acontecido.
  const panel = el("div", "hoff beam on");
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-modal", "true");
  panel.setAttribute("aria-labelledby", "hoff-title");
  scrim.append(panel);

  const hd = el("div", "hoff-hd");
  const title = el("h2", null, "Mandando pro Claude");
  title.id = "hoff-title";
  hd.append(el("span", "idx", "[ HANDOFF ]"), title);
  const sigLbl = el("span", "sig", g.key); sigLbl.title = g.key;
  hd.append(sigLbl, el("div", "spacer"));
  const closeBtn = el("button", "btn ghost", "✕ Fechar");
  hd.append(closeBtn);

  const body = el("div", "hoff-body");
  const stepsBox = el("div", "hoff-steps");
  const main = el("div", "hoff-main");
  const mini = el("div", "hoff-mini");
  const corner = el("span", "corner", "[ AGUARDANDO GRAFO ]");
  const idle = el("div", "idle", "o desenho do fluxo entra aqui");
  mini.append(corner, idle);
  /* A faixa de atividade: um fato por vez, grande, mais a barra de tempo.
     Ela é o antídoto para "ficar no escuro" enquanto o Claude trabalha — o
     terminal continua embaixo com o histórico completo, mas quem está olhando
     de longe lê daqui. Some do DOM quando a corrida termina, porque a partir
     daí a informação é o diff, não o andamento. */
  const actBox = el("div", "hoff-act");
  const actLine = el("div", "act-line");
  const actStage = el("span", "act-stage", "[ INICIANDO ]");
  const actTxt = el("div", "act-txt", "preparando a sessão…");
  const actRound = el("span", "act-round", "rodada —");
  actLine.append(el("span", "dot"), actStage, actTxt, actRound);
  const pbar = el("div", "pbar unknown");
  pbar.setAttribute("role", "progressbar");
  pbar.setAttribute("aria-label", "Andamento da correção");
  const pfill = el("div", "pfill");
  pbar.append(pfill);
  const actFoot = el("div", "act-foot");
  actBox.append(actLine, pbar, actFoot);
  // Um leitor de tela não deve ouvir cada troca de ferramenta — são dezenas por
  // rodada. O log já é `aria-live`; aqui a atualização é silenciosa e o valor
  // atual fica legível quando o usuário navega até ele.
  actBox.setAttribute("aria-live", "off");

  const term = el("div", "hoff-term");
  // O log ganha linha por linha ao longo de vários segundos. Sem live region o
  // leitor de tela não anuncia nada e a tela inteira fica muda.
  term.setAttribute("role", "log");
  term.setAttribute("aria-live", "polite");
  term.setAttribute("aria-label", "Andamento do handoff");
  main.append(mini, actBox, term);

  /* Estado da faixa. `eta` só existe depois que o servidor responde com o
     histórico; até lá a barra fica no modo listrado, que afirma movimento sem
     afirmar duração. */
  const prog = {
    t0: Date.now(), eta: null, tools: {}, finished: false,
    setStage(txt) { actStage.textContent = "[ " + String(txt).toUpperCase() + " ]"; },
    setRound(r, max) { actRound.textContent = r ? "rodada " + r + "/" + (max || 4) : "rodada —"; },
    setActivity(a, tools) {
      if (tools) this.tools = tools;
      if (a && a.label) actTxt.textContent = a.label;
      this.paintFoot();
    },
    setEta(eta) { if (eta && eta.samples >= 3 && eta.medianMs) this.eta = eta; this.tick(); },
    paintFoot() {
      const t = this.tools || {};
      const partes = [
        t.Read ? "<b>" + t.Read + "</b> leituras" : null,
        t.Grep ? "<b>" + t.Grep + "</b> buscas" : null,
        t.Glob ? "<b>" + t.Glob + "</b> varreduras" : null,
        (t.Write || t.Edit) ? "<b>" + ((t.Write || 0) + (t.Edit || 0)) + "</b> escritas" : null
      ].filter(Boolean);
      actFoot.innerHTML = (this.timeLabel() + (partes.length ? " · " + partes.join(" · ") : ""));
    },
    timeLabel() {
      const el_ = Date.now() - this.t0;
      const s = dur(el_);
      if (this.finished) return "concluído em <b>" + s + "</b>";
      if (!this.eta) return "<b>" + s + "</b> · sem histórico suficiente para estimar quanto falta";
      if (el_ > this.eta.medianMs) {
        return "<b>" + s + "</b> · passou da mediana de " + dur(this.eta.medianMs)
          + " (" + this.eta.samples + " execuções) — ainda rodando";
      }
      return "<b>" + s + "</b> de ~" + dur(this.eta.medianMs)
        + " · estimativa pela mediana de " + this.eta.samples + " execuções anteriores";
    },
    tick() {
      if (this.finished) return;
      const el_ = Date.now() - this.t0;
      if (!this.eta) {
        pbar.classList.add("unknown"); pbar.classList.remove("over");
        pbar.removeAttribute("aria-valuenow");
      } else {
        pbar.classList.remove("unknown");
        // Teto em 97%: a barra nunca "enche" antes de a proposta existir, porque
        // barra cheia com tela parada é a forma mais rápida de perder confiança.
        const frac = Math.min(0.97, el_ / this.eta.medianMs);
        pfill.style.transform = "scaleX(" + frac.toFixed(3) + ")";
        pbar.classList.toggle("over", el_ > this.eta.medianMs);
        pbar.setAttribute("aria-valuenow", Math.round(frac * 100));
      }
      this.paintFoot();
    },
    done(ok) {
      this.finished = true;
      pbar.classList.remove("unknown", "over");
      pfill.style.transform = "scaleX(1)";
      actStage.textContent = ok ? "[ PRONTO ]" : "[ ENCERRADO ]";
      this.paintFoot();
    }
  };
  const progTimer = setInterval(() => prog.tick(), 1000);
  prog.tick();
  body.append(stepsBox, main);

  const ft = el("div", "hoff-ft");
  panel.append(hd, body, ft);

  const rows = new Map();
  stepsBox.setAttribute("role", "list");
  stepsBox.setAttribute("aria-label", "Etapas do handoff");
  HANDOFF.forEach((s, i) => {
    const r = el("div", "hoff-step");
    r.setAttribute("role", "listitem");
    const txt = el("div");
    txt.append(el("div", "nm", s.nm), el("div", "sub", s.sub));
    const mark = el("div", "mark", String(i + 1));
    mark.setAttribute("aria-hidden", "true");   // o número é ornamento do rótulo
    r.append(mark, txt);
    rows.set(s.id, r);
    stepsBox.append(r);
  });

  // `inert` desliga foco, clique e leitura do que está atrás do scrim. Medido: 17
  // elementos da página continuavam tabuláveis com o diálogo aberto, então o Tab
  // saía do modal e ia para botões invisíveis sob o desfoque.
  const behind = [...document.body.children];
  // O botão que abriu, não `document.activeElement`: um clique de mouse não
  // move o foco em todos os casos, e um clique programático nunca move — aí
  // `activeElement` é o `<body>`, e devolver o foco ao body é o mesmo que não
  // devolver nada.
  const restoreFocusTo = btn || null;
  // A sessão do Claude fala por SSE. Fechar a tela precisa fechar a conexão:
  // sem isso o EventSource sobrevive ao diálogo, continua recebendo e tenta
  // escrever num terminal que já saiu do DOM. O run no servidor não é abortado
  // de propósito — ele termina e a proposta continua consultável.
  const closers = [];
  // O relógio da barra é um intervalo de 1s: fechar a tela sem pará-lo deixaria
  // um timer escrevendo em nós que já saíram do DOM.
  closers.push(() => clearInterval(progTimer));
  const shut = () => {
    if (handoffLive !== tok) return;
    handoffLive = null;
    for (const c of closers) { try { c(); } catch { /* já fechado */ } }
    document.removeEventListener("keydown", onKey);
    for (const n of behind) n.inert = false;
    scrim.remove();
    // Devolve o foco a quem abriu. O botão original costuma NÃO existir mais: o
    // SSE redesenha o quadro enquanto a tela está aberta, e aí `restoreFocusTo`
    // aponta para um nó descartado — medido, o foco caía no body e o Tab
    // recomeçava do topo da página. Então reencontra o botão pela assinatura, e
    // só desiste para a própria seção de erros.
    const back = (restoreFocusTo && document.contains(restoreFocusTo) && restoreFocusTo)
      || document.querySelector('.err[data-key="' + cssEsc(g.key) + '"] .btn.beam')
      || $("#errs");
    if (back) { if (!back.tabIndex || back.tabIndex < 0) back.tabIndex = -1; back.focus(); }
  };
  const onKey = ev => { if (ev.key === "Escape") shut(); };
  closeBtn.onclick = shut;
  scrim.onclick = ev => { if (ev.target === scrim) shut(); };
  document.addEventListener("keydown", onKey);

  for (const n of behind) n.inert = true;
  document.body.append(scrim);
  closeBtn.focus();

  // Morph a partir do botão (dynamic-island/expandable-screen do cult-ui): o
  // painel nasce do retângulo do próprio botão em vez de aparecer do nada, para
  // ficar claro de onde a tela veio.
  if (!REDUCED && btn) {
    const b = btn.getBoundingClientRect(), p = panel.getBoundingClientRect();
    if (p.width && p.height) {
      panel.animate([
        { transform: `translate(${b.left - p.left}px, ${b.top - p.top}px) scale(${b.width / p.width}, ${b.height / p.height})`,
          opacity: .25, borderRadius: "8px" },
        { transform: "none", opacity: 1, borderRadius: "16px" }
      ], { duration: 430, easing: "cubic-bezier(.2,.85,.25,1)" });
    }
  }

  /* ------------------------------------------------------------- primitivas */
  const say = async (txt, cls, gut) => {
    if (!alive()) return null;
    const ln = el("div", "ln" + (cls ? " " + cls : ""));
    ln.append(el("span", "g", gut || "·"), el("span", "tx", txt));
    term.append(ln);
    term.scrollTop = term.scrollHeight;
    await nap(85);
    return ln;
  };
  let cur = null;
  const stepTo = async id => {
    if (!alive()) return;
    if (cur) { rows.get(cur).classList.remove("on"); rows.get(cur).classList.add("done"); }
    cur = id;
    rows.get(id).classList.add("on");
    // Oito etapas não cabem na coluna quando a faixa de revisão entra e come
    // altura do corpo — medido: as três últimas ficavam fora da vista bem na
    // hora em que são as que estão acontecendo.
    rows.get(id).scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
    const step = HANDOFF.find(s => s.id === id);
    // A faixa de atividade acompanha desde a primeira etapa, não só a partir da
    // sessão do Claude: as cinco primeiras são rápidas, mas são justamente onde
    // "por onde ele está passando" começa.
    prog.setStage(step.nm);
    prog.setActivity({ label: step.sub || step.nm });
    await say(step.nm.toUpperCase(), "hd", "▸");
  };
  const flag = id => rows.get(id).classList.add("warnst");
  const seal = () => { if (cur) { rows.get(cur).classList.remove("on"); rows.get(cur).classList.add("done"); cur = null; } };

  /* ------------------------------------------------------- grafo em miniatura
   * Renderizador próprio, mas com as MESMAS classes do palco (.nd/.edge e os
   * estados ran/failed/hot/flowing) — o vocabulário visual é um só. O que ele
   * não compartilha é a câmera: `S.view` é singleton do palco, e mexer nela
   * aqui moveria o painel atrás do scrim. */
  const NS = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
  let cam = null, camRaf = 0, camGen = 0;

  const miniAspect = () => { const r = mini.getBoundingClientRect(); return (r.width && r.height) ? r.width / r.height : 16 / 9; };

  function miniBox(names, padU = 120) {
    if (!cam) return null;
    const set = names && names.length ? new Set(names) : null;
    const pts = cam.graph.nodes.filter(n => !set || set.has(n.name)).map(n => cam.L.pos(n));
    if (!pts.length) return cam.box;
    const minX = Math.min(...pts.map(p => p.x)), maxX = Math.max(...pts.map(p => p.x));
    const minY = Math.min(...pts.map(p => p.y)), maxY = Math.max(...pts.map(p => p.y));
    const a = miniAspect();
    // Piso de largura para o zoom não estourar num nó só; sem ele, focar um nó
    // isolado daria uma caixa de ~130 unidades e o rótulo viraria borrão.
    // Mesma regra do palco: o rótulo do nó fica fora da caixa, então a altura
    // útil do nó é maior que `NODE_H`.
    const LBL = LABEL_GAP + 14;
    let w = Math.max(560, (maxX - minX) + NODE_W + padU * 2);
    let h = Math.max((maxY - minY) + NODE_H + LBL + padU * 2, 1);
    if (w / h < a) w = h * a; else h = w / a;
    return { x: (minX + maxX + NODE_W) / 2 - w / 2, y: (minY + maxY + NODE_H + LBL) / 2 - h / 2, w, h };
  }

  function camTo(box, ms = 560) {
    if (!cam || !box) return;
    const gen = ++camGen;
    cancelAnimationFrame(camRaf);
    const put = b => cam.svg.setAttribute("viewBox", b.x + " " + b.y + " " + b.w + " " + b.h);
    if (ms <= 0 || REDUCED) { cam.box = box; put(box); return; }
    const from = { ...cam.box }, t0 = performance.now();
    const step = now => {
      if (gen !== camGen || !alive()) return;
      const t = Math.min(1, (now - t0) / ms), k = 1 - Math.pow(1 - t, 3);
      cam.box = { x: from.x + (box.x - from.x) * k, y: from.y + (box.y - from.y) * k,
                  w: from.w + (box.w - from.w) * k, h: from.h + (box.h - from.h) * k };
      put(cam.box);
      if (t < 1) camRaf = requestAnimationFrame(step);
    };
    camRaf = requestAnimationFrame(step);
    // Aba em segundo plano estrangula o rAF; garante o estado final mesmo assim.
    setTimeout(() => { if (gen === camGen && cam) { cam.box = box; put(box); } }, ms + 40);
  }

  function drawMini(graph) {
    idle.remove();
    const L = layout(graph);
    if (!L) return;
    // O desenho é ilustração do que o texto do log já diz; um leitor de tela
    // precisa do resumo, não de 178 rótulos de nó.
    const svg = mk("svg", { role: "img", "aria-label":
      "Desenho do fluxo: " + graph.nodes.length + " nós e " + graph.edges.length + " conexões" });
    const byName = new Map(graph.nodes.map(n => [n.name, n]));
    const gE = mk("g", {}), gN = mk("g", {});
    svg.append(gE, gN);

    // As notas do editor entram aqui também: são elas que dizem em que etapa do
    // fluxo o nó quebrado vive, e essa é a primeira pergunta de quem abre o
    // handoff. Continuam fora do bounding box da câmera.
    const gS = mk("g", {});
    svg.insertBefore(gS, gE);
    for (const s of (graph.stickies || [])) {
      const el = paintSticky(mk, s), p = L.pos(s);
      el.setAttribute("transform", `translate(${p.x},${p.y})`);
      gS.append(el);
    }

    const temIn = new Set(), temOut = new Set();
    for (const e of graph.edges) if (e.port === "main") { temIn.add(e.to); temOut.add(e.from); }

    graph.edges.forEach(e => {
      const a = byName.get(e.from), b = byName.get(e.to);
      if (!a || !b) return;
      const { p, tip } = edgePath(mk, L.pos(a), L.pos(b), e.port !== "main");
      p.dataset.from = e.from; p.dataset.to = e.to;
      gE.append(p);
      if (tip) { tip.dataset.to = e.to; tip.dataset.from = e.from; gE.append(tip); }
    });

    graph.nodes.forEach((n, i) => {
      const p = L.pos(n);
      const box = paintNode(mk, n, { hasIn: temIn.has(n.name), hasOut: temOut.has(n.name) });
      box.setAttribute("transform", `translate(${p.x},${p.y})`);
      gN.append(box);
      if (!REDUCED) box.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: Math.min(760, i * 9), fill: "backwards" });
    });

    mini.append(svg);
    cam = { L, graph, svg, box: { x: 0, y: 0, w: L.w, h: L.h } };
    camTo(miniBox(null), 0);
  }
  const miniNode = name => cam && cam.svg.querySelector('.nd[data-name="' + cssEsc(name) + '"]');

  /* --------------------------------------------------------------- 01 · sig */
  await stepTo("sig");
  await say("fluxo: " + (wf ? wf.name : "id " + g.d.workflowId), null, " ");
  await say("assinatura: " + g.key, null, " ");
  await say(g.count + "× em " + WINDOW_H + "h · última há " + agoShort(Date.now() - new Date(g.last).getTime())
    + (g.count > 1 ? " · primeira há " + agoShort(Date.now() - new Date(g.first).getTime()) : ""), null, " ");
  // Mesma regra do quadro de erros: sob detalhe capado essa contagem é um piso, e
  // apresentá-la como total aqui contaminaria o briefing inteiro.
  if (S.errorsTruncated) {
    flag("sig");
    await say("a contagem é um PISO — o detalhe só foi buscado das " + S.errorsDetailed
      + " falhas mais recentes de " + S.errorsTotal + " nesta janela", "warn", "!");
  }
  // `sens`: a mesma mensagem crua do cartão de erro, agora no terminal do
  // handoff — o modo gravação tem que alcançá-la aqui também.
  for (const m of g.msgs.size ? [...g.msgs] : ["(sem mensagem)"]) await say(m, "bad sens", "✕");
  if (g.msgs.size > 1) await say(g.msgs.size + " mensagens distintas no mesmo nó e tipo — pode ser mais de uma causa", "warn", "!");

  /* ------------------------------------------------------------- 02 · grafo */
  if (!alive()) return;
  await stepTo("graph");
  let graph = null;
  try {
    if (S.graph && S.graph.id === g.d.workflowId) {
      graph = S.graph;
      await say("grafo já estava em cache nesta sessão — sem nova chamada", null, "·");
    } else {
      await say("GET /api/n8n/graph/" + g.d.workflowId, null, "→");
      const j = await (await fetch("/api/n8n/graph/" + encodeURIComponent(g.d.workflowId))).json();
      if (j.error) throw new Error(j.error);
      // Sticky note é anotação do editor, não etapa: fora do layout e do
      // bounding box — mas guardada, porque o desenho a pinta ao fundo.
      j.stickies = j.nodes.filter(n => isAnnotation(n.type) && n.sticky);
      j.nodes = j.nodes.filter(n => !isAnnotation(n.type));
      const keep = new Set(j.nodes.map(n => n.name));
      j.edges = j.edges.filter(e => keep.has(e.from) && keep.has(e.to));
      graph = j;
    }
    if (!alive()) return;
    await say(graph.nodes.length + " nós executáveis · " + graph.edges.length + " conexões · "
      + (graph.active ? "ativo" : "inativo"), "good", "✓");
    corner.textContent = "[ " + graph.nodes.length + " NÓS · " + graph.edges.length + " CONEXÕES ]";
    drawMini(graph);
    await nap(520);
  } catch (err) {
    flag("graph");
    await say("não consegui ler o grafo: " + (err.message || err), "bad", "✕");
    await say("o briefing continua — ele não depende do desenho", null, "·");
  }

  /* ---------------------------------------------------------------- 03 · nó */
  if (!alive()) return;
  await stepTo("node");
  const nodeName = errorNodeOf(g.d);
  if (!g.d.error?.nodeName) {
    flag("node");
    await say("o n8n não preencheu error.node — caindo para lastNodeExecuted", "warn", "!");
  }
  if (graph) {
    const own = miniNode(nodeName);
    if (own) {
      camTo(miniBox([nodeName], 170));
      own.classList.remove("pending"); own.classList.add("failed");
      await say("nó " + nodeName + " localizado no desenho", "good", "✓");
    } else {
      // Falha de sub-workflow chega na execução do PAI: o nó que quebrou pode
      // não existir neste grafo. Dizer isso é melhor que apontar para o errado.
      flag("node");
      await say("o nó " + nodeName + " não existe neste grafo", "warn", "!");
      await say("é falha propagada de sub-workflow — o n8n reporta no pai", "warn", "!");
      const caller = g.d.lastNode && miniNode(g.d.lastNode);
      if (caller) {
        camTo(miniBox([g.d.lastNode], 170));
        caller.classList.remove("pending"); caller.classList.add("failed");
        await say("quem chamou foi " + g.d.lastNode + " — é o que dá para apontar aqui", null, "·");
      }
    }
    await nap(420);
  }

  /* --------------------------------------------------------- 04 · execução */
  if (!alive()) return;
  await stepTo("exec");
  const sampleId = newestSampleId(g);
  let detail = null;
  try {
    detail = S.details.get(String(sampleId));
    if (detail) await say("execução " + sampleId + " já detalhada nesta sessão", null, "·");
    else {
      await say("GET /api/n8n/execution/" + sampleId, null, "→");
      detail = await (await fetch("/api/n8n/execution/" + encodeURIComponent(sampleId))).json();
      if (detail.error && !detail.nodeRuns) throw new Error(detail.error);
      S.details.set(String(detail.id), detail);
    }
    if (!alive()) return;
    const runs = detail.nodeRuns || [];
    if (!runs.length) {
      flag("exec");
      await say("sem dados de nó — o n8n pode ter descartado o histórico desta execução", "warn", "!");
    } else {
      await say(runs.length + " nós rodaram em " + dur(detail.ms) + " antes de parar", null, "·");
      // Repinta o caminho real no grafo em miniatura. A ordem é executionIndex
      // de verdade, não uma animação inventada por cima do desenho.
      if (cam) {
        const failed = detail.error?.nodeName || null;
        for (const r of runs) {
          const n = miniNode(r.name);
          if (!n) continue;
          n.classList.remove("pending");
          n.classList.add(r.name === failed || r.status === "error" ? "failed" : "ran");
          cam.svg.querySelectorAll('.edge[data-to="' + cssEsc(r.name) + '"]').forEach(p => p.classList.add("flowing"));
          await nap(28);
        }
      }
      const last = runs[runs.length - 1];
      await say("parou no passo " + runs.length + "/" + runs.length + " · " + last.name + " · " + dur(last.ms), "bad", "✕");
      const slow = runs.filter(r => (r.ms || 0) > BANDS.slowMs);
      if (slow.length) await say(slow.length + " nó(s) acima de " + dur(BANDS.slowMs) + " no caminho", "warn", "!");
    }
  } catch (err) {
    flag("exec");
    await say("não consegui reler a execução: " + (err.message || err), "bad", "✕");
  }

  /* ------------------------------------------------------- 05 · diagnóstico */
  if (!alive()) return;
  await stepTo("diag");
  if (g.fix) {
    await say(g.fixSt === "reopened"
      ? "marcada como corrigida e reincidiu depois disso — a correção anterior não pegou"
      : "está marcada como corrigida e não reincidiu até agora", g.fixSt === "reopened" ? "warn" : "good",
      g.fixSt === "reopened" ? "!" : "✓");
  }
  const past = pastFixes(g.key);
  for (const h of past) {
    const hw = S.workflows.get(h.key.split("|")[0]);
    await say((h.undoneAt ? "já tentei isso e não resolveu" : "da última vez")
      + (h.key === g.key ? "" : " (no fluxo " + (hw ? shortName(hw.name) : h.key.split("|")[0]) + ")")
      + ", há " + agoShort(Date.now() - new Date(h.markedAt).getTime()) + ": " + h.note,
      h.undoneAt ? "warn" : null, "✎");
  }
  if (!past.length && !g.fix) await say("nenhuma nota sua nesta assinatura — é a primeira vez que ela vai pro Claude", null, "·");
  const tip = suggestFor(g.d);
  // Sem padrão casado NÃO tem sugestão. Palpite vago aqui custaria exatamente a
  // confiança que faz o briefing valer alguma coisa.
  if (tip) await say("heurística (não é diagnóstico): " + tip, "warn", "?");
  else await say("nenhum padrão conhecido casou — sem sugestão heurística", null, "?");

  /* ------------------------------------------- 06 · Claude corrigindo mesmo */
  const text = briefingFor(g);

  // Linha imediata, sem a pausa dramática do `say`. O log do Claude chega em
  // rajada e enfileirar 85ms por linha deixaria a tela minutos atrás do que já
  // aconteceu — a animação não pode atrasar o fato.
  const sayNow = (txt, cls, gut) => {
    if (!alive()) return;
    const ln = el("div", "ln" + (cls ? " " + cls : ""));
    ln.append(el("span", "g", gut || "·"), el("span", "tx", txt));
    term.append(ln);
    term.scrollTop = term.scrollHeight;
  };

  // Caminho degradado: sem CLI do Claude ou sem n8n configurado, a tela volta a
  // ser o handoff por clipboard — e diz por quê, em vez de fingir que rodou.
  const fallback = async (motivo) => {
    if (!alive()) return;
    flag("claude");
    await say(motivo, "warn", "!");
    await say("voltando ao handoff manual: o briefing vai para a área de transferência", null, "·");
    seal();
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; await say("briefing copiado — cole numa sessão do Claude Code", "good", "✓"); }
    catch { await say("clipboard bloqueado — o texto está abaixo, já selecionado", "warn", "!"); }

    const ta = el("textarea", "hoff-brief");
    ta.value = text; ta.spellcheck = false;
    ta.setAttribute("aria-label", "Briefing desta falha, pronto para colar numa sessão do Claude Code");
    panel.insertBefore(ta, ft);
    if (!copied) { ta.focus(); ta.select(); }

    ft.append(el("div", "truth", "O cockpit não conseguiu rodar o Claude aqui, então parou no briefing. "
      + "Nada foi tocado no n8n."));
    const again = el("button", "btn", copied ? "⧉ Copiar de novo" : "⧉ Copiar");
    again.onclick = async () => {
      try { await navigator.clipboard.writeText(text); again.textContent = "✓ Copiado"; }
      catch { ta.focus(); ta.select(); again.textContent = "⚠ Selecione acima"; }
      setTimeout(() => { again.textContent = "⧉ Copiar de novo"; }, 2400);
    };
    ft.append(again, closeFooterBtn(), stageFooterBtn());
    requestAnimationFrame(() => { term.scrollTop = term.scrollHeight; });
    setStep("Briefing de " + g.key + " entregue — o Claude não pôde rodar daqui.");
  };
  const stageFooterBtn = () => {
    const b = el("button", "btn ghost", "▶ Ver no palco");
    b.onclick = () => { shut(); selectWorkflow(g.d.workflowId, sampleId); };
    return b;
  };
  const closeFooterBtn = () => { const b = el("button", "btn ghost", "Fechar"); b.onclick = shut; return b; };

  if (!alive()) return;
  await stepTo("claude");

  const st = await callApi("/api/claude/status");
  if (!st.ok) return fallback(st.error);
  const capab = st.body;
  if (!capab.available) {
    return fallback(!capab.claudeFound
      ? "Claude Code CLI não encontrado em " + (capab.claudeBin || "(o servidor não informou o caminho)")
      : "n8n não configurado neste servidor");
  }

  await say("Claude Code local encontrado — abrindo sessão headless sem rede e sem a chave do n8n", null, "·");
  await say("ele recebe o workflow inteiro, o briefing e as regras; quem fala com a instância é o cockpit", null, "·");

  const started = await callApi("/api/claude/fix", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({
      key: g.key, wfId: g.d.workflowId, wfName: wf ? wf.name : null,
      // Os dois nós separados: o da assinatura pode não existir neste grafo
      // (falha de sub-workflow reportada no pai) e aí o alvo é o último
      // executado. Quem decide isso é o servidor, que tem o grafo em mãos.
      node: errorNodeOf(g.d), lastNode: g.d.lastNode || null,
      briefing: text
    })
  });
  if (!started.ok) return fallback("não consegui iniciar a sessão: " + started.error);
  const runId = started.body.runId;
  await say("sessão " + runId + " aberta", null, "·");

  /* ----------------------------------------- 07 · portas · o loop de verdade
   * O SSE traz o que o Claude está lendo e escrevendo, o veredito de cada porta
   * e a rodada seguinte quando alguma reprova. É esse laço que o Kauan pediu:
   * ele tenta, apanha do validador, e tenta de novo. */
  const LOG_STYLE = {
    step:   ["hd", "▸"], claude: [null, "◆"], tool: [null, "·"],
    good:   ["good", "✓"], bad: ["bad", "✕"], warn: ["warn", "!"]
  };

  const snap = await new Promise(resolve => {
    let es;
    try { es = new EventSource("/api/claude/run/" + runId + "/stream"); }
    catch (err) { return resolve({ status: "failed", error: String(err.message || err) }); }

    let last = null;
    let done = false;
    // O EventSource reconecta sozinho quando a conexão cai, e o servidor manda o
    // snapshot inteiro em toda conexão. Sem contar o que já foi pintado, uma
    // reconexão repetiria o log inteiro na tela — e um log duplicado num painel
    // que existe para ser confiável é pior que um log faltando.
    let painted = 0;
    const finish = v => { if (done) return; done = true; try { es.close(); } catch { /* já fechado */ } resolve(v); };
    closers.push(() => { try { es.close(); } catch { /* já fechado */ } });

    const stageName = id => (HANDOFF.find(h => h.id === id) || {}).nm || id;

    const paint = ev => {
      if (ev.t === "log") {
        const [cls, gut] = LOG_STYLE[ev.level] || [null, "·"];
        sayNow(ev.text, cls, gut);
      } else if (ev.t === "stage") {
        const id = STAGE_MAP[ev.stage];
        if (id && id !== cur) stepTo(id);
        if (id) prog.setStage(stageName(id));
      } else if (ev.t === "activity") {
        // O fato mais recente sobre o que ele está fazendo. Sobrescreve — não
        // acumula: acumular é o que o terminal já faz logo abaixo.
        prog.setActivity(ev.activity, ev.tools);
      } else if (ev.t === "round") {
        prog.setRound(ev.round, ev.maxRounds);
      } else if (ev.t === "ready") {
        last = ev.snapshot;
      }
    };

    es.addEventListener("snapshot", m => {
      const s = JSON.parse(m.data);
      last = s;
      const log = s.log || [];
      for (const l of log.slice(painted)) paint(l);
      painted = log.length;
      const st = STAGE_MAP[s.stage];
      if (st) { stepTo(st); prog.setStage(stageName(st)); }
      // Reconexão: a barra volta a saber onde estava sem recontar do zero.
      prog.setEta(s.eta);
      if (s.round) prog.setRound(s.round, s.maxRounds);
      if (s.activity || s.tools) prog.setActivity(s.activity, s.tools);
      if (s.startedAt) prog.t0 = new Date(s.startedAt).getTime();
      if (s.status !== "running") finish(s);
    });

    es.addEventListener("ev", m => {
      const ev = JSON.parse(m.data);
      if (ev.t === "log") painted++;
      paint(ev);
      if (ev.t === "ready") finish(ev.snapshot);
      if (ev.t === "state" && ev.status !== "running") {
        // `state` chega sem o snapshot completo; busca a versão final.
        fetch("/api/claude/run/" + runId).then(r => r.json()).then(finish).catch(() => finish(last || { status: ev.status }));
      }
    });

    es.onerror = () => { if (!done) fetch("/api/claude/run/" + runId).then(r => r.json()).then(s => { if (s.status !== "running") finish(s); }).catch(() => {}); };
  });

  if (!alive()) return;

  // A corrida acabou: a barra para de correr e a faixa sai do caminho. A partir
  // daqui a informação da tela é o diff, não o andamento — manter uma barra
  // cheia parada em cima dele só ocuparia a altura que a revisão precisa.
  prog.done(snap && snap.status === "ready");
  clearInterval(progTimer);
  actBox.remove();

  if (!snap || snap.status !== "ready") {
    flag(snap && snap.status === "rejected" ? "review" : "gates");
    seal();
    await say(snap && snap.error ? snap.error : "a proposta não passou nas portas", "bad", "✕");
    await say("nada foi aplicado no n8n — nada foi tocado", null, "·");
    const band = el("div", "hoff-pr");
    band.append(gatesBand(snap || {}));
    band.append(el("div", "applied bad", "Sem proposta aprovável depois de "
      + ((snap && snap.round) || "?") + " rodada(s). O briefing continua disponível abaixo para você levar a mão."));
    panel.insertBefore(band, ft);
    panel.classList.add("reviewing");
    ft.append(el("div", "truth", "O Claude tentou e as portas reprovaram. Isso é o sistema funcionando: "
      + "uma proposta que não passa não chega a virar botão de aprovar."));
    const copyBrief = el("button", "btn", "⧉ Copiar briefing");
    copyBrief.onclick = async () => {
      try { await navigator.clipboard.writeText(text); copyBrief.textContent = "✓ Copiado"; }
      catch { copyBrief.textContent = "⚠ Falhou"; }
      setTimeout(() => { copyBrief.textContent = "⧉ Copiar briefing"; }, 2400);
    };
    ft.append(copyBrief, stageFooterBtn(), closeFooterBtn());
    setStep("Claude tentou corrigir " + g.key + " e as portas reprovaram — nada aplicado.");
    return;
  }

  /* ------------------------------------------------------- 08 · a revisão */
  // O SSE já pode ter posto a etapa em "review" pelo evento de estágio; chamar
  // de novo imprimiria o cabeçalho duas vezes no terminal.
  if (cur !== "review") await stepTo("review");
  seal();
  // O servidor já anunciou o resumo no log; repetir aqui seria a mesma frase
  // duas vezes com números iguais, que é ruído se passar e suspeita se divergir.
  await say("revise o diff abaixo; aprovar é o que escreve no n8n", "hd", "▸");

  const band = buildReview(snap, { g, wf, sampleId, text, term, panel, ft, shut, sayNow });
  panel.insertBefore(band, ft);
  panel.classList.add("reviewing");
  // A faixa de revisão rouba altura do corpo, então a rolagem que já tinha sido
  // feita na coluna de etapas e no terminal fica desatualizada no mesmo quadro
  // em que a tela muda de tamanho. Reposicionar depois do layout novo.
  requestAnimationFrame(() => {
    term.scrollTop = term.scrollHeight;
    const r = rows.get("review");
    if (r) r.scrollIntoView({ block: "nearest" });
  });
  setStep("Proposta do Claude para " + g.key + " esperando sua aprovação. Nada foi aplicado ainda.");
}

/* ==========================================================================
   REVISÃO — o diff da proposta, e o único botão do cockpit que escreve no n8n.
   Tudo aqui é render: o veredito de cada porta vem do servidor como fato, o
   diff já vem redigido (credencial nenhuma atravessa), e o juízo — aprovar ou
   não — é do Kauan.
   ========================================================================== */

// Markdown mínimo, sem innerHTML: o report é texto escrito por um modelo e não
// tem por que virar HTML executável dentro do painel.
function renderReport(md) {
  const box = el("div", "report");
  const inline = (node, s) => {
    for (const part of String(s).split(/(`[^`]+`|\*\*[^*]+\*\*)/g)) {
      if (!part) continue;
      if (part.startsWith("`") && part.endsWith("`")) node.append(el("code", null, part.slice(1, -1)));
      else if (part.startsWith("**") && part.endsWith("**")) node.append(el("b", null, part.slice(2, -2)));
      else node.append(document.createTextNode(part));
    }
  };
  for (const raw of String(md).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const h = line.match(/^#{1,6}\s+(.*)$/) || line.match(/^\*\*(.+?)\*\*:?\s*$/);
    if (h) { box.append(el("h4", null, h[1].replace(/\*\*/g, "").replace(/:$/, ""))); continue; }
    const li = line.match(/^[-*]\s+(.*)$/);
    const node = el(li ? "li" : "p");
    inline(node, li ? li[1] : line);
    box.append(node);
  }
  return box;
}

function gatesBand(snap) {
  const box = el("div", "gates");
  for (const gt of snap.gates || []) {
    box.append(el("span", "gate " + (gt.ok ? "ok" : "bad"),
      (gt.ok ? "✓ " : "✕ ") + gt.label + (gt.ok || !gt.detail ? "" : " — " + gt.detail)));
  }
  // O teste na instância é o único que prova que o n8n aceita o JSON. Quando
  // está desligado a tela diz isso, em vez de deixar a ausência parecer sucesso.
  if (snap.sandboxEnabled) {
    if (snap.sandbox && snap.sandbox.ok) box.append(el("span", "gate ok", "✓ o n8n aceitou o JSON numa cópia inativa"));
    else if (snap.sandbox && snap.sandbox.ok === false) box.append(el("span", "gate bad", "✕ o n8n recusou o JSON — " + (snap.sandbox.error || "")));
  } else {
    box.append(el("span", "gate skip", "○ teste na instância desligado — só validação local (COCKPIT_SANDBOX_TEST)"));
  }
  return box;
}

const shortType = t => String(t || "").replace(/^n8n-nodes-base\./, "").replace(/^@n8n\/n8n-nodes-langchain\./, "lc.");

function renderDiff(diff) {
  const frag = document.createDocumentFragment();
  (diff.nodes || []).forEach((n, i) => {
    const d = el("details", "dnode");
    if (i === 0) d.open = true;                 // o primeiro já aberto: quase sempre é o nó da falha
    const s = el("summary");
    s.append(el("span", "tag " + n.kind, n.kind === "added" ? "NOVO" : n.kind === "removed" ? "REMOVIDO" : "ALTERADO"));
    s.append(el("span", "nm", n.name));
    const ty = el("span", "ty", shortType(n.type)); ty.title = n.type;
    s.append(ty);
    d.append(s);
    const body = el("div", "body");
    for (const l of n.lines || []) {
      const cls = l.t === "+" ? "add" : l.t === "-" ? "del" : l.t === "~" ? "skip" : "";
      body.append(el("span", "dl" + (cls ? " " + cls : ""), l.t === "~" ? "   ⋯ " + l.s : l.t + " " + l.s));
    }
    d.append(body);
    frag.append(d);
  });

  const c = diff.connections || { added: [], removed: [] };
  if (c.added.length || c.removed.length) {
    const box = el("div", "edgelist");
    for (const e of c.added) box.append(el("div", "add", "+ " + e));
    for (const e of c.removed) box.append(el("div", "del", "− " + e));
    frag.append(el("div", null, "Conexões"), box);
  }
  return frag;
}

/* A chamada que reexecuta. Sai daqui e não do `onclick` porque os dois caminhos
   — o clique único do caso limpo e o botão do caso ambíguo — precisam falhar
   exatamente igual. O servidor já devolve a frase certa quando a resposta se
   perde ("confira no n8n antes de tentar de novo"), então ela é repassada como
   veio em vez de ser reescrita aqui. */
async function reexecutar(runId, execId) {
  const r = await callApi("/api/claude/run/" + runId + "/retry", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ execId: String(execId) })
  });
  /* `podeTentar` sai do CÓDIGO, não do texto: 502 é o n8n tendo respondido e
     recusado (nada rodou, tentar de novo é limpo); 409 é estado indefinido —
     resposta perdida ou tentativa em voo —, e aí a tela não pode oferecer um
     botão que talvez mande a mensagem uma segunda vez. */
  if (!r.ok) return { ok: false, error: r.error, newExecId: null, podeTentar: r.status === 502 };
  const last = ((r.body && r.body.retries) || []).filter(x => String(x.execId) === String(execId)).pop();
  return { ok: true, error: null, newExecId: last ? last.newExecId : null, podeTentar: false };
}

function buildReview(snap, ctx) {
  const band = el("div", "hoff-pr");
  band.setAttribute("role", "region");
  band.setAttribute("aria-label", "Proposta de correção do Claude, para revisão");

  const s = snap.diff ? snap.diff.summary : {};
  const hd = el("div", "prhd");
  hd.append(el("span", "idx", "[ REVISÃO ]"), el("h3", null, "Proposta do Claude"));
  hd.append(el("span", "sum", [
    (s.modified || 0) + " alterado(s)",
    (s.added || 0) + " novo(s)",
    (s.edgesAdded || 0) + "↗ / " + (s.edgesRemoved || 0) + "↘ conexões",
    snap.round + " rodada(s)",
    snap.cost ? "US$ " + snap.cost.toFixed(2) : null
  ].filter(Boolean).join(" · ")));
  if (snap.diff && (snap.diff.nodes || []).length) {
    const jump = el("button", "gate jump", "↓ ir para o diff");
    jump.onclick = () => band.querySelector(".dnode").scrollIntoView({ block: "start", behavior: "smooth" });
    hd.append(jump);
  }
  band.append(hd);

  // O cartão clicado é de um fluxo e o diff pode ser de outro: o n8n reporta a
  // falha do sub-fluxo no pai, e o cockpit segue até onde o nó realmente vive.
  // Aprovar sem saber disso seria escrever num fluxo que ele não escolheu.
  if (snap.redirected) {
    const r = snap.redirected;
    const box = el("div", "applied warn");
    box.append(el("div", null, "⤷ O nó " + r.node + " não existe em " + r.fromName
      + ". O n8n reporta a falha do sub-fluxo no pai — o cockpit seguiu por " + r.viaNode + "."));
    box.append(el("div", null, "O diff abaixo é do fluxo " + r.toName + " (" + r.toId + "), que é onde o nó vive. "
      + "Aprovar escreve nele, não em " + r.fromName + "."));
    // Ambiguidade real: mais de um filho pode ter um nó com o mesmo nome. Se a
    // execução não desempatou, isso tem que estar na tela ANTES do botão.
    if (r.certain === false) {
      box.append(el("div", null, "⚠ Outros sub-fluxos deste pai também têm um nó com esse nome"
        + (r.others && r.others.length ? " (" + r.others.join(", ") + ")" : "")
        + " e a execução não informou qual chamou. Confirme que " + r.toName + " é o certo antes de aprovar."));
    }
    band.append(box);
  }

  const status = el("div", "applied warn", "Nada disto está no n8n ainda. Aprovar aplica exatamente o diff abaixo.");
  band.append(status);
  band.append(gatesBand(snap));
  if (snap.report) band.append(renderReport(snap.report));
  band.append(renderDiff(snap.diff || {}));

  /* --------------------------------------------------------------- rodapé */
  const ft = ctx.ft;
  const truth = el("div", "truth", HANDOFF_TRUTH);
  ft.append(truth);

  /* Aplicar conserta o fluxo dali para a frente; o lead desta execução continua
     esperando. Quando o erro é da classe limpa (o nó recusou antes de mandar
     nada), reexecutar entra no MESMO clique — e o rótulo do botão diz isso
     antes de ser clicado, que é o que o torna uma autorização e não um
     auto-apply escondido. Quando é ambíguo, o botão não muda e reexecutar fica
     separado, com o motivo escrito ao lado. */
  const rx = reexecClasse(ctx.g && ctx.g.d);
  const juntos = rx.classe === "limpo";

  const approve = el("button", "btn ok beam", juntos ? "✓ Aprovar, aplicar e responder o lead" : "✓ Aprovar e aplicar");
  approve.title = juntos
    ? "Escreve os nós alterados no fluxo real e, em seguida, reexecuta a execução "
      + ctx.sampleId + " com o fluxo já corrigido. " + REEXEC_LIMPO_TXT
    : "Escreve os nós alterados no fluxo real. O estado anterior fica guardado para desfazer.";
  const reject = el("button", "btn ghost", "✕ Rejeitar");
  const copyBrief = el("button", "btn ghost", "⧉ Briefing");
  copyBrief.title = "Copia o briefing original, caso você prefira conduzir a correção à mão";
  copyBrief.onclick = async () => {
    try { await navigator.clipboard.writeText(ctx.text); copyBrief.textContent = "✓ Copiado"; }
    catch { copyBrief.textContent = "⚠ Falhou"; }
    setTimeout(() => { copyBrief.textContent = "⧉ Briefing"; }, 2400);
  };

  const openN8n = el("button", "btn ghost", "Abrir no n8n ↗");
  openN8n.onclick = () => window.open(S.instance + "/workflow/" + snap.wfId, "_blank");

  const close = el("button", "btn ghost", "Fechar");
  close.onclick = ctx.shut;

  /* Depois de aplicar, a banda de revisão deixa de ser uma proposta: vira o
     recibo. O diff continua ali embaixo, fechado — auditoria não pode sumir só
     porque a decisão foi tomada —, mas o que ocupa o topo é o que aconteceu, o
     que o Claude diz que mudou e o que o cockpit registrou no quadro. */
  function renderDone(j, mark, rx, rxres, sampleId, runId) {
    band.innerHTML = "";
    band.setAttribute("aria-label", "Alteração aplicada no n8n");

    const dh = el("div", "prhd");
    dh.append(el("span", "idx", "[ CONCLUÍDO ]"), el("h3", "done-title", APPLY_DONE_TITLE));
    dh.append(el("span", "sum", hhmm(j.appliedAt || new Date().toISOString()) + " · " + (snap.wfName || snap.wfId)));
    band.append(dh);

    const ok = el("div", "applied");
    ok.append(el("div", null, "O diff aprovado foi escrito no fluxo " + (snap.wfName || snap.wfId) + "."));
    ok.append(el("div", null, APPLY_TRUTH));
    band.append(ok);

    // A explicação é do Claude, não do cockpit — e é a mesma frase que foi
    // gravada no quadro. Mostrar aqui o que foi registrado lá é o que impede as
    // duas telas de contarem histórias diferentes do mesmo conserto.
    if (mark.note) {
      const note = el("div", "notecard");
      // O rótulo fala do texto, não do registro: se o POST falhou, quem diz isso
      // é a caixa de estado logo abaixo. Duas afirmações, uma verdade cada.
      note.append(el("div", "nhd", snap.fixNote ? "O que o Claude ajustou" : "Resumo do cockpit"));
      note.append(el("div", "ntx", mark.note));
      band.append(note);
    }

    band.append(el("div", "applied " + (mark.ok ? "" : "bad"),
      mark.ok ? APPLY_MARK_OK : APPLY_MARK_FAIL + mark.error));
    band.append(el("div", "applied warn", APPLY_CAVEAT));

    band.append(reexecBloco(rx, rxres, sampleId, runId));

    if (snap.diff && (snap.diff.nodes || []).length) {
      const det = el("details", "donediff");
      det.append(el("summary", null, "ver o diff que foi aplicado"));
      det.append(renderDiff(snap.diff));
      band.append(det);
    }
    return band;
  }

  /* O bloco que fecha o buraco entre "consertei o fluxo" e "o lead foi
     respondido". Três estados, e eles não podem ler igual: já reexecutou,
     falhou ao reexecutar, ou está esperando um clique. */
  function reexecBloco(rx, rxres, sampleId, runId) {
    const box = el("div", "applied");
    if (!rx || !sampleId) return box;

    if (rxres && rxres.ok) {
      box.className = "applied";
      box.append(el("div", null, "A execução " + sampleId + " foi reexecutada com o fluxo já corrigido"
        + (rxres.newExecId ? ", e virou a execução " + rxres.newExecId : "") + "."));
      // O que prova que deu certo é a execução nova terminar sem erro, e quem
      // sabe isso é o quadro — não esta tela, que só sabe que disparou.
      box.append(el("div", null, "Ela retoma do nó que falhou, então o que já tinha rodado não repetiu. "
        + "Se falhar de novo, a assinatura reabre sozinha no quadro."));
      box.append(el("div", null, REEXEC_ESCOPO));
      return box;
    }

    /* Falhou. Sem saída daqui, o lead fica sem resposta e a tela não diz o que
       fazer — foi o que o preview mostrou e os testes não pegaram. Mas o botão
       de tentar de novo só aparece quando o n8n RESPONDEU e recusou (`podeTentar`,
       vindo do código HTTP e não do texto): se a resposta se perdeu, a execução
       pode ter começado, e um segundo clique manda a mensagem duas vezes. */
    if (rxres && !rxres.ok) {
      box.className = "applied bad";
      box.append(el("div", null, "A correção foi aplicada, mas não confirmei a reexecução: " + rxres.error));
      if (rxres.podeTentar) {
        const bt = el("button", "btn", "▷ Tentar reexecutar de novo");
        bt.title = "O n8n recusou o pedido, então nada rodou. Tentar de novo não repete envio nenhum.";
        bt.onclick = async () => {
          bt.disabled = true;
          bt.textContent = "reexecutando…";
          const rr = await reexecutar(runId, sampleId);
          const novo = reexecBloco(rx, rr, sampleId, runId);
          box.className = novo.className;
          box.innerHTML = "";
          box.append(...novo.childNodes);
        };
        box.append(bt);
      } else {
        box.append(el("div", null, "Confira a execução " + sampleId + " no n8n antes de mandar outra: "
          + "resposta perdida não prova que ela não começou."));
      }
      return box;
    }

    // Ambíguo: o motivo aparece ANTES do clique, porque é ele que decide.
    box.className = "applied warn";
    box.append(el("div", null, REEXEC_AMBIGUO_TXT + (rx.por || "não sei dizer se algo chegou a sair") + "."));
    box.append(el("div", null, REEXEC_SEM_DESFAZER + " " + REEXEC_ESCOPO));

    const b = el("button", "btn", "▷ Reexecutar a execução " + sampleId);
    b.title = "Reexecuta com o fluxo já corrigido, retomando do nó que falhou. Não tem desfazer.";
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = "reexecutando…";
      const rr = await reexecutar(runId, sampleId);
      // A classe vem do bloco novo, não derivada aqui: o ramo de erro tem duas
      // formas (com e sem botão de tentar de novo) e derivar perderia isso.
      const novo = reexecBloco(rx, rr, sampleId, runId);
      box.className = novo.className;
      box.innerHTML = "";
      box.append(...novo.childNodes);
    };
    box.append(b);
    return box;
  }

  approve.onclick = async () => {
    approve.disabled = reject.disabled = true;
    approve.textContent = "aplicando…";
    ctx.sayNow("aplicando no fluxo " + snap.wfId + "…", "hd", "▸");
    {
      const r = await callApi("/api/claude/run/" + snap.runId + "/approve", { method: "POST" });
      if (!r.ok) {
        approve.disabled = reject.disabled = false;
        approve.textContent = juntos ? "✓ Aprovar, aplicar e responder o lead" : "✓ Aprovar e aplicar";
        status.className = "applied bad";
        status.textContent = "Não apliquei: " + r.error;
        ctx.sayNow("✕ não apliquei: " + r.error, "bad", "✕");
        return;
      }
      const j = r.body;
      ctx.sayNow("✓ aplicado — backup do estado anterior guardado", "good", "✓");

      // Marcar é uma SEGUNDA escrita, e ela pode falhar sozinha. Por isso o
      // resultado dela é carregado até a tela: aplicado-e-marcado e
      // aplicado-mas-não-marcado são estados diferentes do quadro de erros, e
      // confundi-los faria uma falha resolvida voltar como aberta sem aviso.
      // `fixNote` é escrita pelo Claude e vem pronta do servidor. Se ela faltar
      // (servidor de uma versão anterior a este recurso), a marca ainda é feita
      // — com o que o cockpit sabe de fato, o resumo do diff, e dizendo que a
      // explicação não veio. Marcar sem nota nenhuma seria perder o registro.
      const s2 = (snap.diff && snap.diff.summary) || {};
      const nota = snap.fixNote || ("Aplicado pelo cockpit sem explicação do Claude — "
        + (s2.modified || 0) + " nó(s) alterado(s), " + (s2.added || 0) + " novo(s)");
      const mark = await markFix(ctx.g, { note: nota, silent: true });
      ctx.sayNow(mark.ok
        ? "✓ assinatura marcada como corrigida, com a explicação do Claude"
        : "⚠ aplicado, mas não marquei a assinatura: " + mark.error, mark.ok ? "good" : "warn", mark.ok ? "✓" : "!");

      /* A reexecução é a TERCEIRA escrita deste clique, e a única sem desfazer.
         Vem depois de marcar de propósito: se ela falhar, o que já deu certo
         (aplicar, marcar) continua registrado e dito na tela. */
      let rxres = null;
      if (juntos) {
        approve.textContent = "reexecutando…";
        ctx.sayNow("reexecutando a execução " + ctx.sampleId + " com o fluxo já corrigido…", "hd", "▸");
        const rr = await reexecutar(snap.runId, ctx.sampleId);
        rxres = rr;
        ctx.sayNow(rr.ok
          ? "✓ reexecução disparada" + (rr.newExecId ? " — virou a execução " + rr.newExecId : "")
          : "✕ não confirmei a reexecução: " + rr.error, rr.ok ? "good" : "bad", rr.ok ? "✓" : "✕");
      }

      truth.textContent = APPLY_TRUTH;
      renderDone(j, mark, rx, rxres, ctx.sampleId, snap.runId);

      approve.remove(); reject.remove();
      const undo = el("button", "btn", "↺ Desfazer");
      undo.title = "Escreve de volta o estado exato de antes da aplicação e desfaz a marcação";
      undo.onclick = async () => {
        undo.disabled = true; undo.textContent = "desfazendo…";
        const rr = await callApi("/api/claude/run/" + snap.runId + "/revert", { method: "POST" });
        if (!rr.ok) {
          undo.disabled = false; undo.textContent = "↺ Desfazer";
          band.prepend(el("div", "applied bad", "Não consegui desfazer: " + rr.error));
          return;
        }
        // Desfazer a escrita sem desfazer a marca deixaria a assinatura fora do
        // quadro com o fluxo no estado velho — a falha continua acontecendo e
        // ninguém é avisado. As duas coisas andam juntas.
        const um = await markFix(ctx.g, { undo: true, silent: true });
        band.innerHTML = "";
        band.append(el("div", "applied warn", "Desfeito. O fluxo voltou ao estado anterior à aplicação."
          + (um.ok ? " A assinatura voltou para o quadro como aberta."
                   : " Mas não consegui desmarcar a assinatura: " + um.error)));
        ctx.sayNow("↺ desfeito — o fluxo voltou ao estado anterior", "warn", "↺");
        undo.remove();
        setStep("Aplicação desfeita em " + (snap.wfName || snap.wfId) + ". O fluxo está como estava antes.");
      };
      ft.insertBefore(undo, copyBrief);
      setStep(mark.ok
        ? "Correção do Claude aplicada em " + (snap.wfName || snap.wfId) + " e marcada como feita. Reabre sozinha se reincidir."
        : "Correção aplicada em " + (snap.wfName || snap.wfId) + ", mas a marcação no quadro não foi salva.");
    }
  };

  reject.onclick = async () => {
    reject.disabled = approve.disabled = true;
    // Rejeitar é local: se o registro falhar, nada foi aplicado do mesmo jeito.
    // A tela diz que o registro não foi gravado em vez de omitir.
    const r = await callApi("/api/claude/run/" + snap.runId + "/reject",
      { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    status.className = "applied warn";
    status.textContent = r.ok
      ? "Rejeitada. Nada foi escrito no n8n."
      : "Rejeitada. Nada foi escrito no n8n — mas não consegui registrar a rejeição: " + r.error;
    ctx.sayNow("proposta rejeitada — nada foi escrito", "warn", "!");
    approve.remove(); reject.remove();
    setStep("Proposta do Claude rejeitada. O fluxo continua como estava.");
  };

  ft.append(approve, reject, copyBrief, openN8n, close);
  return band;
}

/* A faixa de filtro e a de situação. Redesenhadas a cada poll junto com a
 * lista, como todo o resto do painel — nenhum estado mora no DOM. */
function renderFeedFiltro(base) {
  const c = contagensFeed(base);
  const faixa = $("#feed-filtro");
  faixa.innerHTML = "";

  const chipStatus = (rot, val, cor, qtd) => {
    const lig = S.feedFilter.status === val;
    const b = el("button", "fchip" + (lig ? " on" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", lig ? "true" : "false");
    const d = el("span", "dotst"); d.style.background = cor;
    b.append(d, document.createTextNode(rot), el("b", null, String(qtd)));
    b.onclick = () => { S.feedFilter.status = lig ? null : val; renderFeed(); };
    return b;
  };
  faixa.append(chipStatus("deu certo", "ok", "var(--ok)", c.ok));
  faixa.append(chipStatus("deu erro", "error", "var(--risk)", c.erro));

  const wf = S.feedFilter.wf ? S.workflows.get(S.feedFilter.wf) : null;
  const bf = el("button", "fchip fluxo" + (S.feedFilter.wf ? " on" : ""));
  bf.type = "button";
  bf.setAttribute("aria-haspopup", "dialog");
  bf.append(
    el("span", "nm", S.feedFilter.wf ? (wf ? shortName(wf.name) : "fluxo " + S.feedFilter.wf) : "todos os fluxos"),
    el("span", "cv", "▾"));
  bf.onclick = () => abrirFiltroFluxo(bf, base);
  faixa.append(bf);

  const cxSit = $("#feed-sit");
  cxSit.innerHTML = "";
  if (!filtroAtivo()) return;

  const s = el("div", "fsit");
  const partes = [];
  if (S.feedFilter.status === "error") partes.push("deu erro");
  if (S.feedFilter.status === "ok") partes.push("deu certo");
  if (S.feedFilter.wf) partes.push(wf ? shortName(wf.name) : S.feedFilter.wf);
  s.append(document.createTextNode("filtrando por "), el("b", null, partes.join(" · ")));

  // Falha escondida pelo filtro tem que aparecer, e é clicável: quem vê "2
  // falhas fora deste filtro" quer ir até elas, não anotar o número.
  const ocultas = falhasEscondidas(base);
  if (ocultas) {
    const o = el("button", "oculto");
    o.type = "button";
    o.textContent = ocultas + " falha" + (ocultas > 1 ? "s" : "") + " fora deste filtro";
    o.title = "Mostrar essas falhas — limpa o filtro de fluxo e deixa só as que deram erro.";
    o.onclick = () => { S.feedFilter = { status: "error", wf: null }; renderFeed(); };
    s.append(o);
  }

  const lmp = el("button", "lmp", "limpar");
  lmp.type = "button";
  lmp.onclick = () => { S.feedFilter = { status: null, wf: null }; renderFeed(); };
  s.append(lmp);
  cxSit.append(s);
}

/* A telinha de escolher o fluxo.
 *
 * Só lista fluxo que executou na janela: um fluxo sem execução não tem o que
 * filtrar, e escolhê-lo devolveria uma lista vazia sem explicação. As contagens
 * são um retrato do momento em que abriu — o SSE continua entrando por trás, e
 * repintar a lista sob o cursor moveria o item que está prestes a ser clicado. */
