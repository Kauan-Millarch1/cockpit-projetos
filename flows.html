function abrirFiltroFluxo(btn, base) {
  const porFluxo = new Map();
  for (const e of base) {
    const p = porFluxo.get(e.workflowId) || { total: 0, erros: 0 };
    p.total++;
    if (e.status === "error") p.erros++;
    porFluxo.set(e.workflowId, p);
  }
  const fluxos = [...porFluxo.entries()]
    .map(([id, p]) => {
      const w = S.workflows.get(id);
      return { id, nome: w ? w.name : "fluxo " + id, total: p.total, erros: p.erros };
    })
    .sort((a, b) => b.total - a.total);

  const scrim = el("div", "fmod-scrim");
  const cx = el("div", "fmod");
  cx.setAttribute("role", "dialog");
  cx.setAttribute("aria-modal", "true");
  cx.setAttribute("aria-labelledby", "fmod-tit");

  const hd = el("div", "fmod-hd");
  const h3 = el("h3", null, "Filtrar por fluxo"); h3.id = "fmod-tit";
  const x = el("button", "x", "✕");
  x.type = "button"; x.setAttribute("aria-label", "Fechar");
  hd.append(el("span", "idx", "[ FLUXO ]"), h3, x);

  const cxBusca = el("div", "fmod-busca");
  const bs = el("span", "fbusca");
  const inp = el("input");
  inp.type = "text";
  inp.placeholder = "nome do fluxo ou projeto…";
  inp.setAttribute("aria-label", "Buscar fluxo");
  bs.append(lupaSvg(), inp, el("span", "kbd", "ESC"));
  cxBusca.append(bs);

  const lista = el("div", "fmod-lista");
  lista.setAttribute("role", "listbox");
  const ft = el("div", "fmod-ft");

  let cur = 0, itens = [];

  // Redesenha ANTES de fechar. Na ordem inversa, `shut()` devolve o foco ao
  // botão que abriu e o `renderFeed()` seguinte destrói esse botão — o foco cai
  // no body e o Tab recomeça do topo da página. Medido.
  const escolher = id => { S.feedFilter.wf = id; renderFeed(); shut(); };

  function pinta() {
    const q = inp.value.trim().toLowerCase();
    const vis = fluxos.filter(f => !q || f.nome.toLowerCase().includes(q));
    lista.innerHTML = "";
    itens = [];

    // "Todos os fluxos" é sempre o primeiro: tirar o filtro tem que custar o
    // mesmo que pô-lo, senão o fluxo escolhido vira uma prisão.
    const todos = el("button", "fitem todos" + (S.feedFilter.wf ? "" : " on"));
    todos.type = "button";
    const dt = el("span", "dotst"); dt.style.background = "var(--cold)";
    const nt = el("span", "nm");
    nt.append(el("span", "n1", "Todos os fluxos"), el("span", "n2", "sem filtro"));
    const qt = el("span", "num");
    qt.append(el("span", "ex", String(base.length)));
    todos.append(dt, nt, qt);
    todos.onclick = () => escolher(null);
    lista.append(todos);
    itens.push(todos);

    for (const f of vis) {
      const b = el("button", "fitem" + (S.feedFilter.wf === f.id ? " on" : ""));
      b.type = "button";
      const d = el("span", "dotst");
      // Ponto = saúde do fluxo na janela, o mesmo vocabulário do feed. Se aqui
      // significasse "estado da última execução", dois pontos vermelhos na
      // mesma tela quereriam dizer coisas diferentes.
      d.style.background = f.erros ? "var(--risk)" : "var(--ok)";
      const n = el("span", "nm");
      n.append(el("span", "n1", shortName(f.nome)));
      // "SEM PREFIXO" é o que `projectOf` devolve quando não há convenção de
      // nome, e escrever isso em quatro linhas seguidas é ruído no lugar onde
      // se procura um nome. Sem prefixo, o nome já é a identidade inteira.
      const proj = projectOf(f.nome);
      if (proj !== "SEM PREFIXO") n.append(el("span", "n2", proj));
      const num = el("span", "num");
      num.append(el("span", "ex", String(f.total)));
      num.append(el("span", "er" + (f.erros ? "" : " zero"),
        f.erros ? f.erros + " falha" + (f.erros > 1 ? "s" : "") : "sem falha"));
      b.append(d, n, num);
      b.onclick = () => escolher(f.id);
      lista.append(b);
      itens.push(b);
    }
    if (!vis.length) lista.append(el("div", "fmod-vazio", "Nenhum fluxo com esse nome executou na janela."));

    ft.innerHTML = "";
    ft.append(el("span", "kbd", "↑↓"), document.createTextNode("andar"),
      el("span", "kbd", "ENTER"), document.createTextNode("escolher"),
      el("span", "kbd", "ESC"), document.createTextNode("fechar"),
      el("span", "tot", vis.length + " de " + fluxos.length + " fluxos"));

    cur = Math.min(cur, itens.length - 1);
    marca();
  }
  function marca() {
    itens.forEach((v, i) => v.classList.toggle("cur", i === cur));
    if (itens[cur]) itens[cur].scrollIntoView({ block: "nearest" });
  }

  const behind = [...document.body.children];
  const shut = () => {
    document.removeEventListener("keydown", onKey);
    for (const n of behind) n.inert = false;
    scrim.remove();
    // O botão que abriu costuma NÃO existir mais: o SSE redesenha a faixa
    // enquanto a telinha está aberta. Mesma lição do handoff — reencontra pela
    // posição, senão o foco cai no body e o Tab recomeça do topo da página.
    const back = (btn && document.contains(btn) && btn) || $("#feed-filtro .fchip.fluxo") || $("#feed");
    if (back) { if (!back.tabIndex || back.tabIndex < 0) back.tabIndex = -1; back.focus(); }
  };
  const onKey = ev => {
    if (ev.key === "Escape") { ev.preventDefault(); shut(); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); cur = Math.min(cur + 1, itens.length - 1); marca(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); cur = Math.max(cur - 1, 0); marca(); }
    else if (ev.key === "Enter" && itens[cur]) { ev.preventDefault(); itens[cur].click(); }
  };
  x.onclick = shut;
  scrim.onclick = ev => { if (ev.target === scrim) shut(); };
  inp.oninput = () => { cur = 0; pinta(); };
  // No documento, não no `cx`: com o foco na busca as setas ainda têm que andar
  // na lista, e um handler preso ao container perde a tecla assim que o foco
  // está num input que é filho dele em outro ramo.
  document.addEventListener("keydown", onKey);

  cx.append(hd, cxBusca, lista, ft);
  scrim.append(cx);
  for (const n of behind) n.inert = true;
  document.body.append(scrim);
  pinta();
  inp.focus();
}

function renderFeed() {
  const floor = windowFloor();
  let rows = [...S.execs.values()]
    .filter(e => e.startedAt && new Date(e.startedAt).getTime() >= floor)
    .sort((a, b) => Number(b.id) - Number(a.id));

  if (S.selectedProject) {
    rows = rows.filter(e => { const w = S.workflows.get(e.workflowId); return w && projectOf(w.name) === S.selectedProject; });
  }
  // `base` é o universo que a lista promete: a janela, já recortada pelo
  // projeto do trilho. É dele que saem as contagens dos chips — e não do
  // resultado, que zeraria todo chip não selecionado.
  const base = rows;
  renderFeedFiltro(base);
  rows = base.filter(passaFiltro);
  $("#feed-hint").textContent = filtroAtivo()
    ? rows.length + " de " + base.length + " execuções"
    : rows.length + " execuções";

  const box = $("#feed");
  const known = new Set([...box.children].map(c => c.dataset.id));
  box.innerHTML = "";
  if (!rows.length) {
    // "Nada executou" é uma frase sobre o n8n; "o filtro escondeu tudo" é uma
    // frase sobre esta tela. Dizer a primeira quando a verdade é a segunda faz
    // procurar defeito na instância.
    const vazio = el("div", "empty");
    if (filtroAtivo()) {
      vazio.append(el("div", null, "Nenhuma execução passa por este filtro."));
      const p = el("div", null, base.length + " execuções da janela estão escondidas.");
      p.style.cssText = "font-size:11.5px;color:var(--txt-faint);margin-top:6px";
      vazio.append(p);
    } else {
      vazio.append(el("div", null, "Nada executou na janela."));
    }
    box.append(vazio);
    return;
  }

  for (const e of rows.slice(0, 200)) {
    const wf = S.workflows.get(e.workflowId);
    const isErr = e.status === "error";
    const r = el("div", "feed-row" + (isErr ? " err" : "") + (known.size && !known.has(e.id) ? " new" : ""));
    r.dataset.id = e.id;
    r.append(el("span", "t", hhmm(e.startedAt)));
    const n = el("span", "n");
    const dot = el("span", "dotst");
    dot.style.background = isErr ? "var(--risk)" : e.status === "success" ? "var(--ok)" : e.status === "running" || e.status === "waiting" ? "var(--accent)" : "var(--cold)";
    n.append(dot, document.createTextNode(wf ? shortName(wf.name) : "fluxo " + e.workflowId));
    r.append(n);
    r.append(el("span", "d", dur(e.ms)));
    r.title = (wf ? wf.name : e.workflowId) + " · " + e.status + " · " + e.mode + " · exec " + e.id;
    clickable(r, hhmm(e.startedAt) + " " + (wf ? shortName(wf.name) : "fluxo " + e.workflowId)
      + " — " + e.status + ", " + dur(e.ms), () => selectWorkflow(e.workflowId, e.id));
    box.append(r);
  }
  // A lista é redesenhada a cada poll; a marca da execução aberta tem que ser
  // reaplicada aqui, senão ela pisca e some a cada 20 segundos.
  markSelectedExec();
}

function renderStamp() {
  const parts = [];
  if (S.lastPoll) parts.push("n8n lido " + hhmm(S.lastPoll));
  else if (S.fetchedAt) parts.push("carregado " + hhmm(S.fetchedAt));
  parts.push("janela " + WINDOW_H + "h");
  $("#stamp").innerHTML = "<b>" + parts.join("</b> · <b>") + "</b>";
  $("#instance").textContent = (S.instance || "").replace(/^https?:\/\//, "");
}

function renderAll() {
  const flows = flowsWithActivity();
  renderKpis(flows);
  renderRail(flows);
  renderCards(flows);
  renderErrors();
  renderFeed();
  renderStamp();
}

/* ------------------------------------------------------------- flow canvas */

/* O nó é quadrado, como no editor do n8n. Era 132×38 (retângulo com texto
   dentro) e virou 84×84 com o rótulo POR FORA, embaixo — o que muda não é só a
   aparência: o texto sai da caixa, então o tamanho do nó deixa de depender do
   comprimento do nome, e o desenho passa a bater com o espaçamento real do
   editor (que trabalha em grade de 16 com nós de ~96). */
const NODE = 84;
const NODE_W = NODE, NODE_H = NODE;   // nomes antigos: a câmera e o bbox usam
const LABEL_GAP = 13;

/* ==========================================================================
   ÍCONES DOS NÓS — desenhados, nunca emoji, nunca logo de terceiro.
   Um glifo por família, todos no mesmo viewBox de 24 e na mesma espessura, para
   a fileira de nós ler como um sistema e não como uma colagem. A cor é a
   identidade do serviço e vive AQUI; o estado (ok/falha/atual) mora na borda da
   caixa, no badge e no fio. Os dois nunca ocupam o mesmo lugar, então a reserva
   da cor de status continua valendo onde ela importa.
   ========================================================================== */
const ICONS = {
  code:     { c: "#B9BDD1", d: ["M9 8 5 12l4 4", "M15 8l4 4-4 4"] },
  if:       { c: "#F5A524", d: ["M5 12h4", "M9 12l4-5h6", "M9 12l4 5h6", "M17 5l2 2-2 2", "M17 15l2 2-2 2"] },
  switch:   { c: "#F5A524", d: ["M4 8h5l3 4", "M4 16h5l3-4", "M12 12h8", "M17 9l3 3-3 3"] },
  merge:    { c: "#6FD1FF", d: ["M4 7h5l4 5h7", "M4 17h5l4-5", "M17 9l3 3-3 3"] },
  set:      { c: "#FF7BC4", d: ["M4 20l1-4 10-10 3 3-10 10-4 1z", "M14 7l3 3"] },
  http:     { c: "#8E7CFF", d: ["M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", "M3 12h18", "M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"] },
  webhook:  { c: "#FF9F43", d: ["M8.5 12.5a3.5 3.5 0 1 1 5 3.2", "M5 17h7", "M12 8V5", "M15.5 17H19"] },
  trigger:  { c: "#FF9F43", d: ["M13 3 5 14h6l-1 7 8-11h-6l1-7z"] },
  redis:    { c: "#FF6B5E", d: ["M4 7c0-1.2 3.6-2.2 8-2.2s8 1 8 2.2-3.6 2.2-8 2.2S4 8.2 4 7z", "M4 12c0 1.2 3.6 2.2 8 2.2s8-1 8-2.2", "M4 7v10c0 1.2 3.6 2.2 8 2.2s8-1 8-2.2V7"] },
  supabase: { c: "#3ECF8E", d: ["M13 3 5 13h6l-1 8 8-10h-6l1-8z"] },
  wait:     { c: "#B9A0FF", d: ["M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z", "M12 8v4.5l3 1.8"] },
  noop:     { c: "#7B819A", d: ["M6 12h12"] },
  agent:    { c: "#A78BFA", d: ["M12 4v3", "M7.5 7h9a2.5 2.5 0 0 1 2.5 2.5v6A2.5 2.5 0 0 1 16.5 18h-9A2.5 2.5 0 0 1 5 15.5v-6A2.5 2.5 0 0 1 7.5 7z", "M9.5 11.5v1.5", "M14.5 11.5v1.5", "M3 11v3", "M21 11v3"] },
  llm:      { c: "#74E0C0", d: ["M12 4.5a3 3 0 0 0-3 3 3 3 0 0 0-1.5 5.6A3 3 0 0 0 10 19a3 3 0 0 0 2-1", "M12 4.5a3 3 0 0 1 3 3 3 3 0 0 1 1.5 5.6A3 3 0 0 1 14 19a3 3 0 0 1-2-1", "M12 4.5V19"] },
  memory:   { c: "#9EA7FF", d: ["M7 7h10v10H7z", "M10 4v3", "M14 4v3", "M10 17v3", "M14 17v3", "M4 10h3", "M4 14h3", "M17 10h3", "M17 14h3"] },
  tool:     { c: "#7DD3FC", d: ["M14.5 4.5a4 4 0 0 0-5 5L4 15v5h5l5.5-5.5a4 4 0 0 0 5-5l-3 3-2-2 3-3z"] },
  parser:   { c: "#7DD3FC", d: ["M8 5H6a2 2 0 0 0-2 2v3l-2 2 2 2v3a2 2 0 0 0 2 2h2", "M16 5h2a2 2 0 0 1 2 2v3l2 2-2 2v3a2 2 0 0 1-2 2h-2"] },
  whatsapp: { c: "#25D366", d: ["M12 3.8A8.2 8.2 0 0 0 4.9 16L4 20.2l4.3-.9A8.2 8.2 0 1 0 12 3.8z", "M9.2 9c.3 1.6 1.4 3.2 2.9 4.2 1 .7 1.8.9 2.3.6"] },
  slack:    { c: "#E8557E", d: ["M9 4v8", "M15 12v8", "M4 15h8", "M12 9h8"] },
  sheets:   { c: "#5FBF7B", d: ["M6 4h8l4 4v12H6z", "M14 4v4h4", "M9 12h6", "M9 15.5h6", "M12 12v6"] },
  audio:    { c: "#D6D9E6", d: ["M4 11v2", "M8 8v8", "M12 5v14", "M16 8v8", "M20 11v2"] },
  subflow:  { c: "#FF9F43", d: ["M4 6h6v4H4z", "M14 14h6v4h-6z", "M7 10v4a2 2 0 0 0 2 2h5", "M12 5.5h8", "M17 3l3 2.5-3 2.5"] }
};

// Tipo do n8n → glifo. Mapa de leitura, não catálogo completo: o que não casa
// cai num traço neutro em vez de ganhar um ícone errado, que seria pior.
function iconFor(type) {
  const base = String(type || "")
    .replace(/^@n8n\/n8n-nodes-langchain\./, "lc.")
    .replace(/^n8n-nodes-base\./, "")
    .replace(/^@[^/]+\/n8n-nodes-[^.]+\./, "x.");
  const map = [
    [/^lc\.agent/, "agent"], [/^lc\.lmChat|^lc\.openAi/, "llm"], [/^lc\.memory/, "memory"],
    [/^lc\.tool/, "tool"], [/^lc\.outputParser/, "parser"],
    [/^executeWorkflow/, "subflow"],
    [/trigger$|^cron|^schedule/i, "trigger"], [/^webhook|^respondToWebhook/, "webhook"],
    [/^code$|^function/, "code"], [/^if$|^filter/, "if"], [/^switch/, "switch"], [/^merge/, "merge"],
    [/^set$|^editFields/, "set"], [/^httpRequest/, "http"], [/^redis/, "redis"],
    [/^supabase|^postgres/, "supabase"], [/^wait/, "wait"], [/^noOp/, "noop"],
    [/^whatsApp/, "whatsapp"], [/^slack/, "slack"], [/^googleSheets/, "sheets"], [/elevenlabs/i, "audio"]
  ];
  for (const [re, k] of map) if (re.test(base)) return ICONS[k];
  return { c: "#8A90A6", d: ["M7 12h10"] };
}

// Cor da sticky note: o n8n guarda um índice de 1 a 7.
const STICKY_COLOR = { 1: "#F5A524", 2: "#FF6B5E", 3: "#3ECF8E", 4: "#6FD1FF", 5: "#A78BFA", 6: "#FF7BC4", 7: "#7B819A" };

function nodeKindLabel(type) {
  return String(type).replace(/^@n8n\/n8n-nodes-langchain\./, "AI·").replace(/^n8n-nodes-base\./, "").slice(0, 22);
}
const isTrigger = t => /trigger|webhook|cron|schedule/i.test(t);

/* Desenha UM nó, e é o mesmo desenho no palco e no mini-grafo do handoff.
   Antes eram dois trechos parecidos em lugares distintos; qualquer ajuste
   precisava ser feito duas vezes e uma delas era esquecida. */
function paintNode(mk, n, opts = {}) {
  const trg = isTrigger(n.type);
  const ic = iconFor(n.type);
  const g = mk("g", { class: "nd pending" + (trg ? " trg" : "") + (n.disabled ? " disabled" : "") });
  g.dataset.name = n.name;

  // O gatilho tem o lado esquerdo em meia-lua: é a única pista de "por onde
  // isto começa" que se lê antes de qualquer texto.
  const r = 10, R = NODE / 2;
  g.append(mk("path", {
    class: "face",
    d: trg
      ? `M${R},0 H${NODE - r} a${r},${r} 0 0 1 ${r},${r} V${NODE - r} a${r},${r} 0 0 1 -${r},${r} H${R} A${R},${R} 0 0 1 ${R},0 Z`
      : `M${r},0 H${NODE - r} a${r},${r} 0 0 1 ${r},${r} V${NODE - r} a${r},${r} 0 0 1 -${r},${r} H${r} a${r},${r} 0 0 1 -${r},-${r} V${r} a${r},${r} 0 0 1 ${r},-${r} Z`
  }));

  const k = 34 / 24, ox = (NODE - 34) / 2 + (trg ? 6 : 0), oy = (NODE - 34) / 2;
  const gi = mk("g", { transform: `translate(${ox},${oy}) scale(${k})`, stroke: ic.c });
  for (const d of ic.d) gi.append(mk("path", { class: "glyph", d }));
  g.append(gi);

  // Porta só onde existe ligação: desenhar as duas sempre encheria o palco de
  // pontos que não levam a lugar nenhum.
  if (opts.hasIn && !trg) g.append(mk("circle", { class: "port", cx: 0, cy: NODE / 2, r: 3.4 }));
  if (opts.hasOut) g.append(mk("circle", { class: "port", cx: NODE, cy: NODE / 2, r: 3.4 }));

  const badge = mk("g", { class: "badge", transform: `translate(${NODE - 14},${NODE - 14})` });
  badge.append(mk("circle", { r: 8 }), mk("path", { d: "M-3.4,0 L-1,2.6 L3.6,-2.6" }));
  const bad = mk("g", { class: "badge-bad", transform: `translate(${NODE - 14},${NODE - 14})` });
  bad.append(mk("circle", { r: 8 }), mk("path", { d: "M0,-4 V1" }), mk("path", { d: "M0,3.4 V3.6" }));
  g.append(badge, bad);

  const nm = mk("text", { class: "nm", x: NODE / 2, y: NODE + LABEL_GAP });
  nm.textContent = n.name.length > 20 ? n.name.slice(0, 19) + "…" : n.name;
  // O editor escreve a OPERAÇÃO embaixo do nome ("update: row"), não o tipo — e
  // é a operação que diz o que o passo faz. Sem ela, o tipo é o que sobra de
  // verdadeiro.
  const ty = mk("text", { class: "ty", x: NODE / 2, y: NODE + LABEL_GAP + 11 });
  ty.textContent = n.sub || nodeKindLabel(n.type);
  const ms = mk("text", { class: "ms", x: NODE / 2, y: -7 });
  g.append(nm, ty, ms);

  const t = mk("title");
  t.textContent = n.name + "\n" + n.type + (n.disabled ? "\n(desativado)" : "");
  g.append(t);
  return g;
}

// O tempo medido do nó só é escrito quando existe medição — nó pendente não
// ganha número, e um número velho nunca sobrevive a um replay novo.
function paintNodeTime(g, ms) {
  const t = g && g.querySelector("text.ms");
  if (!t) return;
  t.textContent = ms == null ? "" : (ms >= 1000 ? (ms / 1000).toFixed(1).replace(".", ",") + "s" : ms + "ms");
}

/* Sticky note: fundo da cena, nunca no bounding box da câmera. */
function paintSticky(mk, n) {
  const s = n.sticky || {};
  const g = mk("g", { class: "sticky" });
  g.style.setProperty("--sticky", STICKY_COLOR[s.color] || STICKY_COLOR[7]);
  g.append(mk("rect", { class: "bg", x: 0, y: 0, width: s.w || 240, height: s.h || 160, rx: 8 }));
  const linhas = String(s.content || "").split("\n").filter(l => l.trim());
  const titulo = (linhas[0] || "").replace(/^#+\s*/, "").slice(0, 42);
  const corpo = (linhas.slice(1).join(" ") || "").replace(/[#*`]/g, "").slice(0, 74);
  if (titulo) { const t = mk("text", { class: "ttl", x: 12, y: 22 }); t.textContent = titulo.toUpperCase(); g.append(t); }
  if (corpo) { const b = mk("text", { class: "bdy", x: 12, y: 38 }); b.textContent = corpo; g.append(b); }
  return g;
}

/* Uma aresta e a sua seta. Devolve os dois para quem desenha decidir a camada. */
function edgePath(mk, pa, pb, aux, i) {
  const x1 = aux ? pa.x + NODE / 2 : pa.x + NODE, y1 = aux ? pa.y + NODE : pa.y + NODE / 2;
  const x2 = aux ? pb.x + NODE / 2 : pb.x,        y2 = aux ? pb.y + NODE : pb.y + NODE / 2;
  const dx = Math.max(30, Math.abs(x2 - x1) * 0.45);
  const d = aux
    ? `M${x1},${y1} C${x1},${y1 + 42} ${x2},${y2 + 42} ${x2},${y2}`
    : `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  const p = mk("path", Object.assign({ d, class: "edge" + (aux ? " aux" : "") }, i != null ? { id: "e" + i } : {}));
  const tip = aux ? null : mk("path", { class: "tip", d: `M${x2 - 7},${y2 - 4} L${x2 - 1},${y2} L${x2 - 7},${y2 + 4} Z` });
  return { p, tip };
}

function layout(graph) {
  const ns = graph.nodes;
  if (!ns.length) return null;
  // Coordenadas do n8n podem estar em qualquer lugar (visto: x = -14480).
  // Nada de assumir origem: normaliza pelo bounding box real.
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 70;
  return {
    minX, minY,
    w: (maxX - minX) + NODE_W + pad * 2,
    // O rótulo agora vive FORA da caixa, embaixo: sem esta folga a última
    // fileira de nomes fica cortada na borda do palco.
    h: (maxY - minY) + NODE_H + LABEL_GAP + 14 + pad * 2,
    pad,
    pos: n => ({ x: n.x - minX + pad, y: n.y - minY + pad })
  };
}

const MIN_BOX_W = 1500;   // ~11 nós de largura; abaixo disso o rótulo não se lê

function stageAspect() {
  const r = $("#stage").getBoundingClientRect();
  return (r.width && r.height) ? r.width / r.height : 16 / 9;
}

// Teto de zoom-out: um nó nunca deve ficar menor que ~66px na tela. O n8n
// espalha os nós por dezenas de milhares de unidades, então "caber tudo" vira
// um punhado de traços ilegíveis — foi exatamente o que a primeira captura deu.
function maxBoxW() {
  const px = $("#stage").getBoundingClientRect().width || 1000;
  // O nó agora é quadrado e menor em unidades (84 contra 132), então o mesmo
  // teto de zoom-out em unidades deixaria o desenho menor na tela do que antes.
  // A conta é sobre o tamanho ALVO em pixels: um nó nunca abaixo de ~62px.
  return Math.max(MIN_BOX_W, px * (NODE / 62));
}

// Caixa de visão com o MESMO aspecto do palco. Sem isso o preserveAspectRatio
// letterboxa e a conta de pan/zoom passa a mentir sobre onde está o cursor.
function boxFor(bb, padU = 90, wide = false) {
  const a = stageAspect();
  // O nome e a operação vivem abaixo da caixa: o conteúdo do nó é mais alto do
  // que o nó. Enquadrar por `NODE_H` puro cortava os rótulos da última fileira
  // rente à borda do palco, que foi o que a primeira captura mostrou.
  const LBL = LABEL_GAP + 14;
  let w = Math.max(MIN_BOX_W, (bb.maxX - bb.minX) + NODE_W + padU * 2);
  if (!wide) w = Math.min(w, maxBoxW());
  let h = Math.max((bb.maxY - bb.minY) + NODE_H + LBL + padU * 2, 1);
  if (!wide) h = Math.min(h, maxBoxW() / a);
  if (w / h < a) w = h * a; else h = w / a;
  const cx = (bb.minX + bb.maxX + NODE_W) / 2, cy = (bb.minY + bb.maxY + NODE_H + LBL) / 2;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}

function bboxOf(names) {
  if (!S.view?.L || !S.graph) return null;
  const set = names && names.length ? new Set(names) : null;
  const pts = S.graph.nodes.filter(n => !set || set.has(n.name)).map(n => S.view.L.pos(n));
  if (!pts.length) return null;
  return {
    minX: Math.min(...pts.map(p => p.x)), maxX: Math.max(...pts.map(p => p.x)),
    minY: Math.min(...pts.map(p => p.y)), maxY: Math.max(...pts.map(p => p.y))
  };
}

let camAnim = null, camGen = 0;
function animateTo(box, ms = 420) {
  if (!S.view) return;
  const gen = ++camGen;
  cancelAnimationFrame(camAnim);
  if (ms <= 0) { S.view.box = box; applyView(); return; }
  const from = { ...S.view.box }, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    if (gen !== camGen) return;
    const t = Math.min(1, (now - t0) / ms), k = ease(t);
    S.view.box = {
      x: from.x + (box.x - from.x) * k, y: from.y + (box.y - from.y) * k,
      w: from.w + (box.w - from.w) * k, h: from.h + (box.h - from.h) * k
    };
    applyView();
    if (t < 1) camAnim = requestAnimationFrame(step);
  };
  camAnim = requestAnimationFrame(step);
  // Garante o estado final mesmo se o rAF não rodar até o fim: aba em segundo
  // plano estrangula rAF e o painel ficaria com a câmera parada no meio.
  setTimeout(() => { if (gen === camGen) { S.view.box = box; applyView(); } }, ms + 40);
}

function drawGraph(graph) {
  const svg = $("#svg");
  svg.innerHTML = "";
  const L = layout(graph);
  if (!L) { setStep("Fluxo sem nós."); return; }
  S.view = { L, box: { x: 0, y: 0, w: L.w, h: L.h } };

  const NS = "http://www.w3.org/2000/svg";
  const mk = (t, attrs) => { const n = document.createElementNS(NS, t); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const byName = new Map(graph.nodes.map(n => [n.name, n]));

  // Três camadas: as notas ao fundo, os fios no meio, os nós por cima. A ordem
  // importa — uma nota desenhada depois cobriria o fluxo que ela descreve.
  const gSticky = mk("g", { id: "stickies" });
  const gEdges = mk("g", { id: "edges" });
  const gNodes = mk("g", { id: "nodes" });
  svg.append(gSticky, gEdges, gNodes);

  // A nota usa o MESMO referencial dos nós (`L.pos`), e é só isso que ela
  // partilha com eles: continua fora do cálculo do bounding box, que é o que
  // impedia a câmera de enquadrar uma legenda gigante em vez do fluxo.
  for (const n of (graph.stickies || [])) {
    const g = paintSticky(mk, n);
    const p = L.pos(n);
    g.setAttribute("transform", `translate(${p.x},${p.y})`);
    gSticky.append(g);
  }

  const temIn = new Set(), temOut = new Set();
  for (const e of graph.edges) if (e.port === "main") { temIn.add(e.to); temOut.add(e.from); }

  graph.edges.forEach((e, i) => {
    const a = byName.get(e.from), b = byName.get(e.to);
    if (!a || !b) return;
    // Portas auxiliares (ai_memory, ai_languageModel…) penduram por baixo do nó,
    // como no editor.
    const { p, tip } = edgePath(mk, L.pos(a), L.pos(b), e.port !== "main", i);
    p.dataset.from = e.from; p.dataset.to = e.to;
    gEdges.append(p);
    if (tip) { tip.dataset.to = e.to; tip.dataset.from = e.from; gEdges.append(tip); }
  });

  for (const n of graph.nodes) {
    const p = L.pos(n);
    const g = paintNode(mk, n, { hasIn: temIn.has(n.name), hasOut: temOut.has(n.name) });
    g.setAttribute("transform", `translate(${p.x},${p.y})`);
    gNodes.append(g);
  }

  $("#corner-tl").textContent = "[ " + graph.nodes.length + " NÓS · " + graph.edges.length + " CONEXÕES ]";
  $("#corner-br").textContent = "[ " + (graph.active ? "ATIVO" : "INATIVO") + " ]";

  // Enquadramento inicial: num fluxo largo, começar pelos gatilhos em vez de
  // caber tudo — caber tudo num grafo de 23 mil unidades não mostra nada.
  const trg = graph.nodes.filter(n => isTrigger(n.type)).map(n => n.name);
  const wide = L.w > MIN_BOX_W * 2;
  const bb = bboxOf(wide && trg.length ? trg : null) || { minX: 0, maxX: L.w, minY: 0, maxY: L.h };
  animateTo(boxFor(bb), 0);
}

function applyView() {
  const b = S.view?.box; if (!b) return;
  $("#svg").setAttribute("viewBox", `${b.x} ${b.y} ${b.w} ${b.h}`);
}

function fitView(names, ms = 420, wide = false) {
  const bb = bboxOf(names && names.length ? names : null);
  if (bb) animateTo(boxFor(bb, 90, wide), ms);
}

// A câmera segue a execução. Só recentra quando o nó ativo sai da faixa
// central, para não tremer a cada passo.
function follow(name, w) {
  if (!S.view || !S.graph) return;
  const n = S.graph.nodes.find(x => x.name === name);
  if (!n) return;
  const p = S.view.L.pos(n), b = S.view.box, m = .22;
  const LBL = LABEL_GAP + 14;   // o rótulo do nó conta como parte dele
  const inX = p.x > b.x + b.w * m && p.x + NODE_W < b.x + b.w * (1 - m);
  const inY = p.y > b.y + b.h * m && p.y + NODE_H + LBL < b.y + b.h * (1 - m);
  const bw = w || b.w, bh = (w ? w / stageAspect() : b.h);
  if (inX && inY && !w) return;
  animateTo({ x: p.x + NODE_W / 2 - bw / 2, y: p.y + (NODE_H + LBL) / 2 - bh / 2, w: bw, h: bh }, 320);
}

let replayTimers = [];
function stopReplay() { replayTimers.forEach(clearTimeout); replayTimers = []; }

// Reexecução visual: percorre os nós na ordem real de executionIndex, com o
// tempo de cada nó vindo de runData. Não é decoração — é o que aconteceu.
function replay(detail) {
  stopReplay();
  const svg = $("#svg");
  svg.querySelectorAll(".nd").forEach(n => {
    n.className.baseVal = n.className.baseVal.replace(/\s*(ran|failed|hot)\b/g, "");
    // O tempo é do replay anterior: limpar aqui é o que impede um número velho
    // de sobreviver a uma execução nova, que seria a pior mentira deste palco.
    paintNodeTime(n, null);
  });
  svg.querySelectorAll(".edge").forEach(e => e.classList.remove("lit", "flowing", "ran"));
  svg.querySelectorAll(".tip").forEach(e => e.classList.remove("lit", "ran"));
  svg.querySelectorAll(".pulse").forEach(p => p.remove());

  const runs = detail.nodeRuns || [];
  if (!runs.length) {
    setStep("Execução " + detail.id + " sem dados de nó (n8n pode ter descartado o histórico).");
    return;
  }

  const failedNode = detail.error?.nodeName || null;
  const total = runs.reduce((s, r) => s + (r.ms || 0), 0);
  // Comprime a linha do tempo real para o orçamento, mantendo a proporção…
  const scale = total > 0 ? Math.min(1, REPLAY.budgetMs / Math.max(total, 1)) : 0;
  // …e depois impõe um piso por nó, que é o que torna a fita legível. Em fluxos
  // longos o piso cede até `stepFloorMs` para a reexecução não virar um filme.
  let floor = REPLAY.stepMinMs;
  const comprimido = runs.length * floor > REPLAY.totalCapMs;
  if (comprimido) floor = Math.max(REPLAY.stepFloorMs, REPLAY.totalCapMs / runs.length);
  let t = 0;

  const dot = $("#stage-dot");
  dot.style.background = "var(--accent)";

  // Começa legível e centrado no primeiro nó executado, não no grafo inteiro.
  if (runs[0]) follow(runs[0].name, MIN_BOX_W);

  runs.forEach((r, i) => {
    const step = Math.min(REPLAY.stepMaxMs, Math.max(floor, (r.ms || 0) * scale));
    const at = t; t += step;
    replayTimers.push(setTimeout(() => {
      const g = svg.querySelector('.nd[data-name="' + cssEsc(r.name) + '"]');
      if (g) {
        g.classList.remove("pending");
        g.classList.add("hot");
        // O tempo medido daquele nó nesta execução. Escrito no momento em que
        // ele acende, junto com o estado — dado e desenho na mesma batida.
        paintNodeTime(g, r.ms);
        follow(r.name);
        setTimeout(() => {
          g.classList.remove("hot");
          g.classList.add(r.name === failedNode || r.status === "error" ? "failed" : "ran");
        }, Math.min(REPLAY.holdMs, step + 220));
      }
      // acende as arestas que chegam neste nó, e a seta com elas
      // Os três tempos da aresta acompanham o passo do nó: acender, escorrer,
      // assentar. Fixá-los fazia a linha assentar antes do nó em fluxos lentos e
      // depois do nó seguinte em fluxos rápidos.
      const escorre = Math.min(900, step * 0.55);
      const assenta = Math.min(2200, step + 700);
      svg.querySelectorAll('.edge[data-to="' + cssEsc(r.name) + '"]').forEach(p => {
        p.classList.add("lit");
        setTimeout(() => { p.classList.remove("lit"); p.classList.add("flowing"); }, escorre);
        // O caminho percorrido fica verde e assim permanece: no fim do replay é
        // ele que mostra por onde a execução passou de verdade.
        setTimeout(() => { p.classList.remove("flowing"); p.classList.add("ran"); }, assenta);
        travel(p, step);
      });
      svg.querySelectorAll('.tip[data-to="' + cssEsc(r.name) + '"]').forEach(p => {
        setTimeout(() => p.classList.add("ran"), assenta);
      });
      setStep("[" + String(i + 1).padStart(2, "0") + "/" + runs.length + "] " + r.name
        + " · " + dur(r.ms) + (r.status && r.status !== "success" ? " · " + r.status : "")
        // Quando o piso teve que ceder, a fita está mais rápida do que o ritmo
        // calibrado — dizer isso é mais honesto que deixar parecer o normal.
        + (comprimido ? " · ritmo comprimido (" + runs.length + " nós)" : ""));
    }, at));
  });

  replayTimers.push(setTimeout(() => {
    const bad = detail.status === "error";
    dot.style.background = bad ? "var(--risk)" : "var(--ok)";

    if (!bad) {
      setStep("✓ " + runs.length + " nós executados em " + dur(detail.ms) + " · execução " + detail.id);
      fitView(runs.map(r => r.name), 600);               // mostra o caminho inteiro
      return;
    }

    const msg = detail.error?.message || "sem mensagem";
    const own = failedNode ? svg.querySelector('.nd[data-name="' + cssEsc(failedNode) + '"]') : null;
    if (own) {
      own.classList.remove("pending", "ran", "hot"); own.classList.add("failed");
      setStep("✕ Falhou em " + failedNode + " — ", msg);
      follow(failedNode, MIN_BOX_W);
      return;
    }

    // O n8n propaga o erro do sub-workflow para a execução do pai, então o nó
    // que quebrou pode não existir neste grafo. Dizer isso é melhor que apontar
    // para o lugar errado — e o nó que chamou o filho é o que dá para mostrar.
    const caller = detail.lastNode && svg.querySelector('.nd[data-name="' + cssEsc(detail.lastNode) + '"]');
    if (caller) { caller.classList.remove("pending", "ran", "hot"); caller.classList.add("failed"); }
    setStep("✕ Falhou em " + (failedNode || "?") + " — nó de sub-workflow, chamado por "
      + (detail.lastNode || "?") + " — ", msg);
    if (detail.lastNode) follow(detail.lastNode, MIN_BOX_W);
  }, t + 400));
}

const cssEsc = s => String(s).replace(/["\\]/g, "\\$&");

function travel(path, stepMs) {
  const NS = "http://www.w3.org/2000/svg";
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("r", "3.4"); c.setAttribute("class", "pulse");
  const m = document.createElementNS(NS, "animateMotion");
  // O pulso atravessa a aresta no compasso do passo: mais rápido que ele e o
  // ponto chega antes do nó acender; mais lento e dois pulsos se cruzam.
  const dur = Math.min(1.2, Math.max(0.42, (stepMs || 620) / 1000 * 0.9));
  m.setAttribute("dur", dur.toFixed(2) + "s"); m.setAttribute("repeatCount", "1"); m.setAttribute("fill", "remove");
  const mp = document.createElementNS(NS, "mpath");
  mp.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#" + path.id);
  m.append(mp); c.append(m);
  $("#svg").append(c);
  setTimeout(() => c.remove(), 700);
}

async function selectWorkflow(wfId, execId) {
  if (!wfId) return;
  S.selectedWf = wfId;
  const wf = S.workflows.get(wfId);
  $("#stage-title").textContent = wf ? shortName(wf.name) : "fluxo " + wfId;
  $("#stage-hint").textContent = wf ? projectOf(wf.name) + " · " + (wf.nodeCount ?? "?") + " nós" : "";
  setStep("Carregando desenho do fluxo…");
  document.querySelectorAll(".card").forEach(c => c.classList.remove("sel"));

  try {
    if (!S.graph || S.graph.id !== wfId) {
      const g = await (await fetch("/api/n8n/graph/" + encodeURIComponent(wfId))).json();
      if (g.error) throw new Error(g.error);
      // As notas saem da lista de nós — elas não executam, não aparecem em
      // `runData` e não podem entrar no bounding box da câmera — mas passam a
      // ser guardadas à parte para o desenho poder pintá-las ao fundo.
      g.stickies = g.nodes.filter(n => isAnnotation(n.type) && n.sticky);
      g.nodes = g.nodes.filter(n => !isAnnotation(n.type));
      const keep = new Set(g.nodes.map(n => n.name));
      g.edges = g.edges.filter(e => keep.has(e.from) && keep.has(e.to));
      S.graph = g;
    }
    drawGraph(S.graph);
    // contagem do grafo, não do workflow: a lista do n8n conta sticky notes
    $("#stage-hint").textContent = (wf ? projectOf(wf.name) + " · " : "") + S.graph.nodes.length + " nós executáveis";
  } catch (err) {
    setStep("Falha ao desenhar o fluxo: " + err.message);
    return;
  }

  if (execId) await loadExec(execId);
  else {
    // Trocar de fluxo sem escolher execução: o resumo da execução anterior
    // descreveria outro fluxo, então some junto com a marca na lista.
    S.selectedExec = null; markSelectedExec();
    $("#happened").hidden = true; $("#happened").innerHTML = "";
    setStep("Fluxo desenhado. Clique numa execução para ver rodando.");
  }
  renderCards(flowsWithActivity());
}

async function loadExec(execId) {
  try {
    setStep("Carregando execução " + execId + "…");
    const d = S.details.get(String(execId)) || await (await fetch("/api/n8n/execution/" + execId)).json();
    if (d.error && !d.nodeRuns) throw new Error(d.error);
    S.details.set(String(d.id), d);
    S.loadedExec = d;
    // Marca qual execução está na tela: sem isso a lista do Ao vivo não diz
    // qual das 200 linhas produziu o desenho que está sendo visto.
    S.selectedExec = String(d.id);
    markSelectedExec();
    replay(d);
    renderHappened(d);
  } catch (err) {
    setStep("Falha ao carregar execução: " + err.message);
  }
}

// A marca é aplicada fora do render do feed também, porque o SSE redesenha a
// lista a cada poll e a seleção precisa sobreviver a isso.
let lastMarked = null;
function markSelectedExec() {
  let alvo = null;
  document.querySelectorAll("#feed .feed-row").forEach(r => {
    const on = S.selectedExec && r.dataset.id === S.selectedExec;
    r.classList.toggle("sel", !!on);
    if (on) { r.setAttribute("aria-current", "true"); alvo = r; } else r.removeAttribute("aria-current");
  });
  // Rola até a linha marcada SÓ quando a seleção muda. Fazer isso a cada poll
  // roubaria a rolagem de quem está lendo a lista mais abaixo — a marca é para
  // orientar, não para arrastar.
  if (alvo && S.selectedExec !== lastMarked) alvo.scrollIntoView({ block: "nearest" });
  lastMarked = S.selectedExec;

  /* A faixa acima da lista. Existe porque a lista corta em 200 linhas e a janela
     em 24h: numa instância que faz ~700 execuções por dia, a execução aberta
     sai da lista em poucas horas. Sem isso, "qual estou vendo?" ficava sem
     resposta exatamente nos casos antigos — que são os que se investiga. */
  const faixa = $("#feed-sel");
  if (!S.selectedExec) { faixa.hidden = true; faixa.innerHTML = ""; return; }
  const e = S.execs.get(S.selectedExec) || S.details.get(S.selectedExec) || null;
  const wf = e && S.workflows.get(e.workflowId);
  faixa.hidden = false;
  faixa.innerHTML = "";
  const bad = e && e.status === "error";
  faixa.className = "feed-sel" + (bad ? " err" : "");
  faixa.append(el("span", "lbl", "NO PALCO"));
  faixa.append(el("span", "who", (e ? hhmm(e.startedAt) + " · " : "")
    + (wf ? shortName(wf.name) : (e && e.workflowId) || "fluxo") + " · #" + S.selectedExec));
  if (!alvo) faixa.append(el("span", "off", "fora das " + $("#feed").children.length + " linhas listadas"));
}

/* O QUE ACONTECEU — a lista de efeitos da execução carregada.
 *
 * A frase vem de `effectOf` (bloco de juízo) e os números vêm do servidor. O que
 * sai do sistema aparece primeiro: é o que já não dá para desfazer. Os campos
 * listados são NOMES de campo; o conteúdo do payload não atravessa o servidor e
 * não existe nesta página. */
const HAPPENED_CAP = 7;

function renderHappened(detail) {
  const box = $("#happened");
  box.innerHTML = "";
  const runs = (detail && detail.nodeRuns) || [];
  if (!runs.length) { box.hidden = true; return; }
  box.hidden = false;

  const byName = new Map(((S.graph && S.graph.nodes) || []).map(n => [n.name, n]));
  const falhou = detail.error?.nodeName || null;
  const linhas = runs.map(r => {
    const node = byName.get(r.name) || null;
    return { r, node, ef: effectOf(node, r), bad: r.name === falhou || r.status === "error" };
  });
  const externas = linhas.filter(l => l.ef && l.ef.external);

  const hd = el("div", "hd");
  hd.append(el("b", null, "O que aconteceu"));
  hd.append(document.createTextNode(runs.length + " NÓS · " + dur(detail.ms)
    + " · " + (externas.length ? externas.length + " EFEITO(S) EXTERNO(S)" : "NENHUM EFEITO EXTERNO")));
  box.append(hd);

  /* ---------------------------------------------------------- a prosa */
  const res = resumoExecucao(detail, byName);
  const prosa = el("div", "prosa");

  if (res.nome || res.quem) {
    const quem = el("div", "linha quem");
    // "contato", não "lead": nem todo fluxo é de venda. No fluxo de agendamento
    // este campo traz "Google Meet · i****@ecommercepuro.com.br", que é
    // verdadeiro como contato da execução e seria mentira como lead.
    quem.append(el("span", "rot", "contato"));
    // `sens`: nome e contato do lead são exatamente o que o modo gravação borra.
    quem.append(el("span", "val sens", [res.nome, res.quem].filter(Boolean).join(" · ")));
    prosa.append(quem);
  }

  for (const b of res.blocos) {
    const linha = el("div", "linha");
    if (b.tipo === "in") {
      linha.append(el("span", "rot", "recebeu"));
      if (b.arquivo) linha.append(el("span", "val", "um arquivo (áudio, imagem ou documento) em " + b.nó
        + " — sem texto no corpo da mensagem"));
      else linha.append(el("q", "fala sens", b.texto));
    } else if (b.tipo === "out") {
      linha.append(el("span", "rot out", "enviou"));
      if (b.texto) linha.append(el("q", "fala sens", b.texto));
      else if (b.entrada) {
        // Distinção explícita: isto é o que ENTROU no nó de envio, não o que a
        // API devolveu. Sem esse rótulo, um texto vizinho passaria por texto
        // enviado — e essa é a diferença entre relatar e supor.
        linha.append(el("q", "fala sens", b.entrada));
        linha.append(el("span", "para", "(o item que entrou em " + (b.entradaNó || b.nó) + ")"));
      } else {
        linha.append(el("span", "val", (b.itens != null ? b.itens + " mensagem(ns)" : "mensagem")
          + " pelo nó " + b.nó + " — o conteúdo não veio nos campos conhecidos"));
      }
      if (b.quem) linha.append(el("span", "para sens", "para " + b.quem));
    } else if (b.tipo === "mudou") {
      linha.append(el("span", "rot", "mudou"));
      linha.append(el("span", "val", b.partes.join(" · ")));
    }
    prosa.append(linha);
  }

  if (!prosa.children.length) {
    prosa.append(el("div", "none", detail.status === "error"
      ? "Esta execução falhou antes de produzir qualquer efeito externo."
      : "Nenhum efeito externo e nenhum conteúdo reconhecível — foi só processamento interno."));
  }
  const fim = el("div", "linha");
  fim.append(el("span", "rot", "fim"));
  fim.append(el("span", "val", detail.status === "error"
    ? "falhou" + (falhou ? " em " + falhou : "")
    : "concluiu em " + dur(detail.ms)));
  prosa.append(fim);
  box.append(prosa);

  /* ------------------------------------------------ o detalhe, fechado */
  const det = el("details", "nodelist");
  const sum = el("summary");
  sum.textContent = "ver os " + runs.length + " nós desta execução";
  det.append(sum);

  const lista = el("div", "listabox");
  for (const l of linhas) {
    const row = el("div", "row" + (l.ef && l.ef.external ? " ext" : "") + (l.bad ? " bad" : ""));
    const ic = el("span", "ic");
    ic.innerHTML = glyphHtml(l.node ? l.node.type : "", 15);
    row.append(ic);

    const meio = el("div");
    const quanto = l.r.items != null
      ? (l.r.items === 0 ? " — nenhum item" : " — " + l.r.items + " item" + (l.r.items > 1 ? "s" : ""))
      : "";
    // Sem regra que case, o nó aparece só com o que ele é (o tipo), sem verbo
    // inventado e sem "executou" repetido — a lista já é a lista de quem rodou.
    const verbo = l.ef ? l.ef.verbo : (l.node ? nodeKindLabel(l.node.type) : "—");
    meio.append(el("span", "nm", l.r.name), el("span", "vb", " · " + verbo + quanto
      + (l.r.binary ? " (com binário)" : "")));
    if (l.r.sample && l.r.sample.texto) meio.append(el("span", "fields sens", "“" + l.r.sample.texto.slice(0, 90) + "”"));
    else if (l.r.keys && l.r.keys.length) meio.append(el("span", "fields", "campos: " + l.r.keys.join(", ")));
    row.append(meio, el("span", "ms", dur(l.r.ms)));
    lista.append(row);
  }
  det.append(lista);
  box.append(det);
}

// O mesmo glifo do palco, em HTML, para a lista poder usá-lo sem duplicar o
// desenho. 24 é o viewBox de todos os ícones.
function glyphHtml(type, size) {
  const ic = iconFor(type);
  const paths = ic.d.map(d => '<path d="' + d + '" fill="none" stroke="' + ic.c
    + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>').join("");
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' + paths + '</svg>';
}

/* ------------------------------------------------------------------- pan/zoom */
(function pan() {
  const stage = $("#stage");
  let drag = null;
  stage.addEventListener("pointerdown", ev => {
    if (!S.view) return;
    drag = { x: ev.clientX, y: ev.clientY, box: { ...S.view.box } };
    stage.classList.add("dragging"); stage.setPointerCapture(ev.pointerId);
  });
  stage.addEventListener("pointermove", ev => {
    if (!drag || !S.view) return;
    const r = stage.getBoundingClientRect();
    S.view.box.x = drag.box.x - (ev.clientX - drag.x) * (drag.box.w / r.width);
    S.view.box.y = drag.box.y - (ev.clientY - drag.y) * (drag.box.h / r.height);
    applyView();
  });
  stage.addEventListener("pointerup", ev => { drag = null; stage.classList.remove("dragging"); stage.releasePointerCapture(ev.pointerId); });
  stage.addEventListener("wheel", ev => {
    if (!S.view) return;
    ev.preventDefault();
    const r = stage.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
    const k = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
    const b = S.view.box;
    const nw = Math.min(S.view.L.w * 4, Math.max(S.view.L.w * 0.08, b.w * k));
    const nh = nw * (b.h / b.w);
    b.x += (b.w - nw) * fx; b.y += (b.h - nh) * fy; b.w = nw; b.h = nh;
    applyView();
  }, { passive: false });
})();

/* ------------------------------------------------------------------ loading */

function setLive(state, label) {
  const l = $("#live");
  l.className = "livedot " + state;
  l.querySelector("span").textContent = label;
}

function showLoading() {
  $("#kpis").innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const k = el("div", "kpi");
    k.append(el("div", "lbl", "———"), el("div", "val", "··"), el("div", "sub", "carregando"));
    $("#kpis").append(k);
  }
  $("#errs").innerHTML = '<div class="loading"><div class="bars"><i></i><i></i><i></i></div>Lendo execuções do n8n…</div>';
}

function showFailure(msg) {
  setLive("off", "sem conexão");
  $("#errs").innerHTML = "";
  $("#errs").append(el("div", "failure", "✕ " + msg));
  // Sem dados novos, a lista de corrigidos não pode ser conferida — esconde em
  // vez de deixar um resultado velho na tela.
  $("#fixed").innerHTML = ""; $("#fixed").style.display = "none";
}

/* Grafo de chamada. Falha de leitura NÃO é silenciosa: sem ele os sub-fluxos de
   produção voltam a ficar escondidos, e a lista colapsada mentiria dizendo que
   eles não têm atividade. Mesma razão do `S.fixesError`. */
async function loadCallers() {
  try {
    const r = await fetch("/api/n8n/callers");
    const txt = await r.text();
    let body = null;
    try { body = JSON.parse(txt); } catch { /* não é JSON */ }
    if (!r.ok || !body || typeof body !== "object" || Array.isArray(body) || !body.porFilho) {
      throw new Error(r.status === 404
        ? "esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js"
        : "o servidor respondeu " + r.status);
    }
    S.callers = body;
    S.callersErro = body.falhas > 0
      ? body.falhas + " fluxo(s) não deram para ler: a lista de sub-fluxos pode estar incompleta"
      : null;
  } catch (e) {
    S.callers = null;
    S.callersErro = String(e && e.message || e);
  }
}

async function boot() {
  showLoading();
  setLive("", "conectando");
  try {
    // As correções marcadas vêm junto: sem elas o primeiro desenho mostraria
    // como aberta uma falha que o Kauan já tratou.
    const [res] = await Promise.all([fetch("/api/n8n/overview"), loadFixes()]);
    const o = await res.json();
    if (o.error) throw new Error(o.error);
    if (!o.configured) throw new Error("n8n não configurado no servidor (.env)");

    S.instance = o.instance;
    S.fetchedAt = o.fetchedAt; S.lastPoll = o.lastPoll; S.lastError = o.lastError;
    S.errorsTotal = o.errorsTotal; S.errorsDetailed = o.errorsDetailed; S.errorsTruncated = !!o.errorsTruncated;
    S.workflows = new Map(o.workflows.map(w => [w.id, w]));
    S.execs = new Map(o.executions.map(e => [e.id, e]));
    S.details = new Map(o.errors.map(d => [d.id, d]));

    renderAll();
    setLive("on", "ao vivo");

    // Link direto para uma execução: ?exec=173196 (com ?wf= opcional). Serve
    // para voltar a um caso específico sem caçá-lo na lista — e é como as
    // capturas de verificação são feitas, sem depender de clique.
    const q = new URLSearchParams(location.search);
    const wantExec = (q.get("exec") || "").replace(/\D/g, "");
    const wantWf = q.get("wf") || (wantExec && (S.execs.get(wantExec) || {}).workflowId) || null;
    if (wantExec && wantWf) {
      selectWorkflow(wantWf, wantExec);
    } else {
      // primeiro desenho: o fluxo com mais falhas, senão o mais movimentado
      const flows = flowsWithActivity().filter(f => f.total > 0);
      const pick = flows.sort((a, b) => b.errors - a.errors || b.total - a.total)[0];
      if (pick) {
        const errRun = pick.runs.find(r => r.status === "error");
        selectWorkflow(pick.id, (errRun || pick.runs[0])?.id || null);
      }
    }
    // O grafo de chamada vem DEPOIS do primeiro desenho, de propósito: são 68
    // leituras de workflow, ~20s na primeira vez (cache de 15 min no servidor).
    // Bloquear o boot com isso trocaria "o painel abre em 1s" por "o painel abre
    // em 21s" para acrescentar 3 cartões. Em modo estático ele é aguardado,
    // senão a captura headless congela antes de os sub-fluxos aparecerem.
    if (STATIC_MODE) { await loadCallers(); renderAll(); }
    else loadCallers().then(() => renderAll());

    // ?static=1 congela o painel numa leitura só. O SSE mantém uma conexão
    // aberta indefinidamente, o que impede captura headless e embed simples.
    if (STATIC_MODE) setLive("", "modo estático");
    else stream();
  } catch (err) {
    showFailure(String(err.message || err));
  }
}

function stream() {
  const es = new EventSource("/api/n8n/stream");
  es.addEventListener("delta", async ev => {
    const d = JSON.parse(ev.data);
    S.lastPoll = d.fetchedAt;
    await loadFixes();   // leitura de um arquivo local, mais barata que o poll que a disparou
    for (const e of d.executions || []) S.execs.set(e.id, e);
    for (const x of d.errors || []) S.details.set(x.id, x);
    // limpa fora da janela para o painel não inflar com o tempo
    for (const [id, e] of S.execs) if (e.startedAt && new Date(e.startedAt).getTime() < windowFloor()) S.execs.delete(id);
    renderAll();
    setLive("on", "ao vivo");

    // se o fluxo aberto acabou de rodar, mostra rodando de verdade
    const mine = (d.executions || []).filter(e => e.workflowId === S.selectedWf && e.status !== "running");
    if (mine.length) loadExec(mine[0].id);
  });
  es.addEventListener("failure", ev => {
    const f = JSON.parse(ev.data);
    setLive("off", "erro no poll");
    S.lastError = f.error; renderStamp();
  });
  es.onerror = () => setLive("off", "reconectando");
  es.onopen = () => setLive("on", "ao vivo");
}

/* -------------------------------------------------------------------- chrome */
$("#reload").onclick = () => boot();
$("#fitrun").onclick = () => fitView((S.loadedExec?.nodeRuns || []).map(r => r.name));
$("#fitall").onclick = () => fitView(null, 420, true);   // só aqui vale ficar ilegível
$("#replay").onclick = () => { if (S.loadedExec) replay(S.loadedExec); };
// A caixa de visão carrega o aspecto do palco; se o palco muda, reenquadra.
addEventListener("resize", () => { if (S.view) fitView((S.loadedExec?.nodeRuns || []).map(r => r.name), 0); });
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  localStorage.setItem("cockpit-theme", document.documentElement.dataset.theme);
};
// ?theme=light|dark força o tema (kiosk, captura, embed) e vence o localStorage.
const wantTheme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("cockpit-theme");
if (wantTheme === "light" || wantTheme === "dark") document.documentElement.dataset.theme = wantTheme;

/* ========================================================== avisar / aviso
   COPIADO do tester.html, bloco a bloco, como o resto do chrome compartilhado.
   Uma mudanca la tem que ser repetida aqui ate o dia em que isto virar arquivo
   proprio. `preview/gen-avisos-preview.js` desenha os quatro tipos nos dois
   modos, e e ele que prova que as tres paginas dizem a mesma coisa do mesmo
   jeito. Ver o bloco AVISOS no CSS para o porque de cada decisao. */
const AVISO_GLIFO = { erro: "✕", alerta: "!", ok: "✓", info: "i" };
const AVISO_VIDA = { ok: 4500, info: 6000 };   // erro e alerta não somem sozinhos
// Quanto a pausa por hover pode esticar a vida, no máximo. Ver `avisar()`.
const VIDA_MAX_PAUSA = 20000;

function avisoHtml(msg, tipo, titulo) {
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  return '<div class="aviso ' + t + '" role="' + (t === "erro" ? "alert" : "status") + '">' +
    '<span class="ai" aria-hidden="true">' + AVISO_GLIFO[t] + "</span>" +
    '<span class="ac">' + (titulo ? '<span class="at">' + esc(titulo) + "</span>" : "") + esc(msg) + "</span>" +
    "</div>";
}

function pilhaAvisos() {
  let p = document.querySelector(".avisos");
  if (p) return p;
  p = document.createElement("div");
  p.className = "avisos";
  document.body.appendChild(p);
  return p;
}

function avisar(msg, tipo, titulo) {
  if (!msg) return null;
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  const vida = AVISO_VIDA[t] || 0;
  const pilha = pilhaAvisos();

  /* Montado por DOM, nunca por `innerHTML`. Duas razões: a mensagem vem de erro
     de servidor e de nome de arquivo, ou seja de fora, e `textContent` fecha essa
     porta sem depender de ninguém lembrar de escapar; e assim este bloco é
     idêntico nas três páginas — o `flows.html` não tem `esc()`. */
  const cartao = document.createElement("div");
  cartao.className = "aviso " + t;
  cartao.setAttribute("role", t === "erro" ? "alert" : "status");
  cartao.setAttribute("aria-live", t === "erro" ? "assertive" : "polite");

  const gl = document.createElement("span");
  gl.className = "ai"; gl.setAttribute("aria-hidden", "true"); gl.textContent = AVISO_GLIFO[t];
  const corpo = document.createElement("span");
  corpo.className = "ac";
  if (titulo) {
    const tt = document.createElement("span");
    tt.className = "at"; tt.textContent = titulo;
    corpo.appendChild(tt);
  }
  corpo.appendChild(document.createTextNode(msg));
  const fechar = document.createElement("button");
  fechar.type = "button"; fechar.className = "ax";
  fechar.setAttribute("aria-label", "fechar aviso"); fechar.textContent = "×";
  cartao.append(gl, corpo, fechar);
  if (vida) {
    const barra = document.createElement("span");
    barra.className = "abar"; barra.setAttribute("aria-hidden", "true");
    barra.style.animationDuration = vida + "ms";
    cartao.appendChild(barra);
  }

  const sair = () => {
    if (!cartao.isConnected) return;
    cartao.classList.add("saindo");
    // Espera a animação de saída, mas nunca depende dela: `setTimeout` remove de
    // qualquer forma, senão um `prefers-reduced-motion` que zera a duração
    // deixaria o cartão pendurado para sempre.
    setTimeout(() => cartao.remove(), 200);
  };
  fechar.addEventListener("click", sair);
  if (vida) {
    let timer = setTimeout(sair, vida);
    // O mouse em cima pausa a contagem: ler uma frase de 12 palavras leva mais
    // que 4,5s, e ver o aviso fugir debaixo do cursor é o pior defeito de toast.
    cartao.addEventListener("mouseenter", () => {
      clearTimeout(timer);
      const b = cartao.querySelector(".abar");
      if (b) b.style.animationPlayState = "paused";
    });
    cartao.addEventListener("mouseleave", () => {
      timer = setTimeout(sair, 1200);
      const b = cartao.querySelector(".abar");
      if (b) b.style.animationPlayState = "running";
    });
  }

  pilha.appendChild(cartao);
  // Teto de 4 na tela. Sem ele, uma pasta com oito arquivos recusados vira uma
  // coluna de avisos que cobre a página inteira — e o oitavo esconde o primeiro.
  const todos = [...pilha.querySelectorAll(".aviso")];
  if (todos.length > 4) todos.slice(0, todos.length - 4).forEach(x => x.remove());
  return cartao;
}

/* Modo gravação. O clique troca o estado, persiste na chave do produto e
   dispara a onda — WAAPI a partir do retângulo do botão, o mesmo truque do
   morph do handoff. A onda é só a cerimônia; a informação é o borrão nos
   elementos `.sens`, que entra por transição de CSS. Com movimento reduzido a
   onda não roda e o estado troca do mesmo jeito. */
const REC_KEY = "cockpit-rec";
function recPaint() {
  const on = document.documentElement.dataset.rec === "1";
  const b = $("#rec");
  b.querySelector(".lbl").textContent = on ? "REC" : "Gravar";
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.title = on
    ? "modo gravação ligado — dados de clientes borrados; clique para desligar"
    : "modo gravação — borra dados de clientes para filmar a tela";
}
function recWave(btn) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const w = document.createElement("div");
  w.className = "rec-wave";
  document.body.append(w);
  w.animate(
    [{ clipPath: `circle(0px at ${x}px ${y}px)`, opacity: .95 },
     { clipPath: `circle(${raio}px at ${x}px ${y}px)`, opacity: 0 }],
    { duration: 700, easing: "cubic-bezier(.22,.61,.36,1)" }
  ).onfinish = () => w.remove();
}
$("#rec").onclick = () => {
  const on = document.documentElement.dataset.rec !== "1";
  if (on) document.documentElement.dataset.rec = "1";
  else delete document.documentElement.dataset.rec;
  try { on ? localStorage.setItem(REC_KEY, "1") : localStorage.removeItem(REC_KEY); } catch { /* modo privado */ }
  recWave($("#rec"));
  recPaint();
};
// Fluxos e tester abertos lado a lado: a outra aba acompanha, sem onda.
addEventListener("storage", e => {
  if (e.key !== REC_KEY) return;
  if (e.newValue === "1") document.documentElement.dataset.rec = "1";
  else delete document.documentElement.dataset.rec;
  recPaint();
});
recPaint();

// Sparkles nos cruzamentos da grade — identidade Firecrawl, custo zero.
for (const [x, y] of [[14, 20], [72, 20], [32, 64], [88, 52]]) {
  const s = el("div", "spark");
  s.setAttribute("aria-hidden", "true");   // ornamento puro: nada para anunciar
  s.style.left = x + "vw"; s.style.top = y + "vh";
  s.innerHTML = '<svg viewBox="0 0 12 12" width="11" height="11" fill="#FF5A1F" opacity=".55"><path d="M6 0 7 5l5 1-5 1-1 5-1-5-5-1 5-1z"/></svg>';
  document.body.append(s);
}

// O relógio relativo ("há 40s") pode andar sozinho porque deriva de um evento
// real. O selo de frescor NUNCA usa new Date() — só o timestamp do payload.
setInterval(() => { if (S.workflows.size) renderKpis(flowsWithActivity()); }, 10000);

boot();
</script>
<script>
/* ═══════════════════════════════════════════════════ NAV — a lente de vidro
   BLOCO COMPARTILHADO. Idêntico em flows.html, tester.html e cockpit.html,
   gerado por preview/aplicar-nav.js e travado por nav-sync-test.js.

   As três portas são navegação DE VERDADE: clicar recarrega a página. Então a
   lente nunca seria vista viajando — cada página nasceria com ela parada no
   lugar. Ela parte da porta DE ONDE VOCÊ VEIO, guardada em sessionStorage, e
   voa até a atual no carregamento. Mesma disciplina do resto do painel: só
   anima quando há informação nova atrás (você trocou de tela); F5 na mesma
   porta não anima nada, e uma aba nova também não, porque ali você não veio de
   lugar algum.

   Nada aqui julga: a navegação não tem estado de saúde, não lê fato nenhum e
   não faz uma única chamada. */
(function () {
  "use strict";
  var nav = document.querySelector(".nvd");
  if (!nav) return;
  var lente = nav.querySelector(".lente");
  if (!lente) return;

  var CHAVE = "cockpit.nav.v1";
  var reduzir = function () {
    return matchMedia("(prefers-reduced-motion: reduce)").matches;
  };

  /* Mesmo integrador do springNumber() — passo fixo de 16ms, porque com a aba em
     segundo plano o dt real explode e a mola diverge em vez de assentar. A
     afinação é OUTRA de propósito: lá a razão de amortecimento é ~0,97, porque
     um contador que passa do valor e volta lê como dado errado; aqui é ~0,54,
     porque passar e voltar é o que faz parecer líquido. */
  var K = 170, C = 14, M = 1;
  /* Quanto a velocidade vira deformação. Medido: em 0,055 o esticão grudava no
     teto e deformação constante lê como escala fixa, não como física. */
  var ESTICA = 0.022, TETO = 0.16;

  var x = 0, vx = 0, w = 30, vw = 0, vivo = false;

  function alvo() {
    var a = nav.querySelector('[aria-current="page"]');
    if (!a) return null;
    /* Lido A CADA QUADRO: o rótulo abre por CSS, então o destino se move. */
    var ax = a.offsetLeft, aw = a.offsetWidth;
    /* Ímã: com o cursor sobre uma porta inativa a lente se inclina para ela.
       4px lê como intenção e é pouco para não parecer erro. */
    var h = nav.querySelector("a:hover");
    if (h && h !== a) ax += (h.offsetLeft > a.offsetLeft ? 1 : -1) * 4;
    return { x: ax, w: aw };
  }

  /* A deformação SAI da velocidade da própria mola: estica no eixo do movimento
     e comprime no outro, volume preservado. É o que separa vidro líquido de
     pastilha com easing. A origem segue o sentido do movimento — com origem no
     centro a lente esticava para os dois lados e vazava para fora do leito. */
  function pintar(v) {
    var d = Math.min(TETO, Math.abs(v) * ESTICA / 100);
    lente.style.setProperty("--x", x.toFixed(2) + "px");
    lente.style.setProperty("--w", w.toFixed(2) + "px");
    lente.style.setProperty("--sx", (1 + d).toFixed(3));
    lente.style.setProperty("--sy", (1 - d * 0.72).toFixed(3));
    if (Math.abs(v) > 12) {
      lente.style.setProperty("--org", v > 0 ? "left center" : "right center");
    }
  }

  function assentar() {
    var t = alvo();
    if (!t) return;
    x = t.x; w = t.w; vx = 0; vw = 0;
    lente.style.setProperty("--org", "center");
    pintar(0);
  }

  function passo() {
    var t = alvo();
    if (!t) { vivo = false; return; }
    if (reduzir()) { assentar(); vivo = false; return; }
    var i, dt = 0.016;
    for (i = 0; i < 2; i++) {
      vx += ((-K * (x - t.x) - C * vx) / M) * dt; x += vx * dt;
      vw += ((-K * (w - t.w) - C * vw) / M) * dt; w += vw * dt;
    }
    pintar(vx);
    if (Math.abs(t.x - x) < 0.35 && Math.abs(vx) < 3 &&
        Math.abs(t.w - w) < 0.35 && Math.abs(vw) < 3) {
      x = t.x; w = t.w; vx = 0; vw = 0; pintar(0); vivo = false; return;
    }
    requestAnimationFrame(passo);
  }

  function acordar() { if (!vivo) { vivo = true; requestAnimationFrame(passo); } }

  var aqui = (nav.querySelector('[aria-current="page"]') || {}).dataset;
  aqui = aqui ? aqui.porta : null;

  /* A partida. Se a porta anterior desta aba não é esta, a lente nasce lá e voa
     para cá. Só então a varredura de brilho se paga: ela marca uma chegada. */
  var de = null;
  try { de = sessionStorage.getItem(CHAVE); } catch (e) { de = null; }
  var origem = de && de !== aqui ? nav.querySelector('[data-porta="' + de + '"]') : null;

  if (origem && !reduzir()) {
    x = origem.offsetLeft; w = origem.offsetWidth; vx = 0; vw = 0;
    pintar(0);
    lente.classList.add("varre");
    acordar();
  } else {
    assentar();
  }
  try { if (aqui) sessionStorage.setItem(CHAVE, aqui); } catch (e) {}

  nav.addEventListener("pointerover", acordar);
  nav.addEventListener("pointerout", acordar);
  addEventListener("resize", assentar);

  /* O atalho que o chip promete. Navega de verdade; alt+dígito não digita nada
     em campo de texto, então não precisa de guarda contra o compositor. */
  addEventListener("keydown", function (ev) {
    if (!ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var i = "123".indexOf(ev.key);
    if (i < 0) return;
    var a = nav.querySelectorAll("a")[i];
    if (!a || a.getAttribute("aria-current") === "page") return;
    ev.preventDefault();
    location.href = a.getAttribute("href");
  });
}());
</script>
</body>
