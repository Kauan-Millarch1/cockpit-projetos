<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit — Fluxos n8n</title>
<!-- O favicon é DESENHADO por `/aba.js` (um fluxo: um nó, dois ramos, duas
     arestas) e animado quando o Tester termina. Nasce vazio de propósito: um
     `.ico` no disco seria um segundo desenho para manter em sincronia com este,
     e o desenho já existe em código. -->
<link rel="icon" href="data:,">
<script src="/aba.js" defer></script>
<style>
/* ==========================================================================
   TOKENS
   Dark is the house style (Panda Video: near-black navy, electric indigo).
   Light is the same instrument rendered as a blueprint (Firecrawl: paper white,
   hairline grid, mono annotations). Both are first-class; the toggle wins in
   either direction because :root[data-theme] is declared after the media query.
   ========================================================================== */
:root {
  --bg:        #06060B;
  --bg-deep:   #040408;
  --surface:   #0E0F1A;
  --surface-2: #14162454;
  --raised:    #171A2B;
  --line:      rgba(255,255,255,.09);
  --line-soft: rgba(255,255,255,.05);
  --grid:      rgba(255,255,255,.028);
  --grid-bold: rgba(255,255,255,.055);

  /* Escada de três degraus, e os três precisam ser degraus de verdade.
     Levar `--txt-faint` até o AA aproximou os dois tons de baixo: `.nd text.ty`
     (o tipo do nó) usa faint e `.nd text.nm` (o nome) usa dim, e no tema claro os
     dois ficaram a 10 pontos de canal um do outro — o desenho passou a separar os
     rótulos só pelo tamanho da fonte. Por isso o degrau de cima também se move:
     dim vai a ~9:1 (escurece no claro, clareia no escuro), o que reabre a
     distância E melhora a legibilidade dele. Mexer só no faint obrigaria a
     escolher entre AA e hierarquia. */
  --txt:       #E9EBF5;
  --txt-dim:   #AAAFC2;
  --txt-faint: #777D92;   /* 4.5:1 no PIOR fundo, não no mais fácil */

  --accent:      #5865F5;
  --accent-soft: #5865F51f;
  --accent-line: #5865F55c;
  --brand:       #FF5A1F;   /* identity only: wordmark, section index, sparkles */

  /* RESERVED. Status only — never a chart series, never a node-kind tint. */
  --ok:    #2FD48F;
  --warn:  #F5A524;
  --risk:  #FF4F5E;
  --cold:  #59617D;
  --ok-soft:   #2FD48F1a;
  --warn-soft: #F5A5241a;
  --risk-soft: #FF4F5E1a;
  --cold-soft: #59617D1a;

  /* ---------------------------------------------------------- texto colorido
     Segundo conjunto, SÓ para cor de texto. As cores acima foram calibradas
     como preenchimento, borda e barra de status — onde não existe requisito de
     contraste — e reusá-las em texto pequeno reprova o AA: medido, o tema claro
     reprovava --ok (3,39), --warn (3,64), --risk na pill (4,20), --cold (3,18) e
     --brand (3,12), e o escuro reprovava --cold (3,11) e --accent (4,17).
     Separar os dois usos é o que deixa a barra vermelha com o vermelho exato que
     o Kauan calibrou E o rótulo legível — mexer no token único obrigaria a
     escolher um dos dois. Onde a cor original já passava, o par é o mesmo valor. */
  --ok-txt:     #2FD48F;
  --warn-txt:   #F5A524;
  --risk-txt:   #FF4F5E;
  --cold-txt:   #798096;
  --accent-txt: #606CF5;
  --brand-txt:  #FF5A1F;

  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);

  --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  --font-num: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, monospace;
  --r: 12px;

  /* ------------------------------------------------------------- o palco
     A caixa do nó, a porta e o fio têm tokens próprios porque são superfície
     de desenho, não de interface: `--raised` é calibrado para cartão sobre
     `--surface`, e o palco tem outro fundo. A cor do ícone NÃO mora aqui —
     ela é do serviço e vive no mapa `ICONS`, junto do desenho. */
  --node-face: #1B1D2E;
  --node-edge: rgba(255,255,255,.14);
  --port:      #6E7590;
  --wire:      #6A7089;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #FAFAF9; --bg-deep: #F4F4F2; --surface: #FFFFFF; --surface-2: #00000005;
    --raised: #FFFFFF;
    --line: rgba(10,10,20,.11); --line-soft: rgba(10,10,20,.06);
    --grid: rgba(10,10,20,.045); --grid-bold: rgba(10,10,20,.08);
    --txt: #14151C; --txt-dim: #3F424D; --txt-faint: #666973;
    --accent: #3B48E0; --accent-soft: #3B48E014; --accent-line: #3B48E055;
    --ok: #0E9F6E; --warn: #B7791F; --risk: #DC2B3A; --cold: #8B90A0;
    --ok-soft: #0E9F6E14; --warn-soft: #B7791F14; --risk-soft: #DC2B3A14; --cold-soft: #8B90A014;
    --ok-txt: #0B8159; --warn-txt: #9A661A; --risk-txt: #D02937; --cold-txt: #6D717E;
    --accent-txt: #3B48E0; --brand-txt: #D04919;
    --shadow: 0 1px 2px rgba(10,10,20,.04), 0 12px 28px -22px rgba(10,10,20,.28);
    --node-face: #FFFFFF; --node-edge: rgba(10,10,20,.16); --port: #9AA0B4; --wire: #A8AEC0;
  }
}
:root[data-theme="dark"] {
  --bg: #06060B; --bg-deep: #040408; --surface: #0E0F1A; --surface-2: #14162454; --raised: #171A2B;
  --line: rgba(255,255,255,.09); --line-soft: rgba(255,255,255,.05);
  --grid: rgba(255,255,255,.028); --grid-bold: rgba(255,255,255,.055);
  --txt: #E9EBF5; --txt-dim: #AAAFC2; --txt-faint: #777D92;
  --accent: #5865F5; --accent-soft: #5865F51f; --accent-line: #5865F55c;
  --ok: #2FD48F; --warn: #F5A524; --risk: #FF4F5E; --cold: #59617D;
  --ok-soft: #2FD48F1a; --warn-soft: #F5A5241a; --risk-soft: #FF4F5E1a; --cold-soft: #59617D1a;
  --ok-txt: #2FD48F; --warn-txt: #F5A524; --risk-txt: #FF4F5E; --cold-txt: #798096;
  --accent-txt: #606CF5; --brand-txt: #FF5A1F;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);
  --node-face: #1B1D2E; --node-edge: rgba(255,255,255,.14); --port: #6E7590; --wire: #6A7089;
}
:root[data-theme="light"] {
  --bg: #FAFAF9; --bg-deep: #F4F4F2; --surface: #FFFFFF; --surface-2: #00000005; --raised: #FFFFFF;
  --line: rgba(10,10,20,.11); --line-soft: rgba(10,10,20,.06);
  --grid: rgba(10,10,20,.045); --grid-bold: rgba(10,10,20,.08);
  --txt: #14151C; --txt-dim: #3F424D; --txt-faint: #666973;
  --accent: #3B48E0; --accent-soft: #3B48E014; --accent-line: #3B48E055;
  --ok: #0E9F6E; --warn: #B7791F; --risk: #DC2B3A; --cold: #8B90A0;
  --ok-soft: #0E9F6E14; --warn-soft: #B7791F14; --risk-soft: #DC2B3A14; --cold-soft: #8B90A014;
  --ok-txt: #0B8159; --warn-txt: #9A661A; --risk-txt: #D02937; --cold-txt: #6D717E;
  --accent-txt: #3B48E0; --brand-txt: #D04919;
  --shadow: 0 1px 2px rgba(10,10,20,.04), 0 12px 28px -22px rgba(10,10,20,.28);
  --node-face: #FFFFFF; --node-edge: rgba(10,10,20,.16); --port: #9AA0B4; --wire: #A8AEC0;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--txt); font-family: var(--font);
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
button { font-family: inherit; }

/* ------------------------------------------------------- blueprint backdrop */
/* `overflow: hidden` porque o feixe da malha viaja para fora da caixa e a
   camada é `position: fixed` — que o `overflow-x: hidden` do body não recorta.
   Sem isso a decoração do fundo cria rolagem horizontal na página. */
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.backdrop::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 30%, transparent 78%);
}
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 45% at 50% -12%, var(--accent-soft), transparent 70%);
}
.spark { position: fixed; width: 11px; height: 11px; z-index: 0; pointer-events: none; opacity: .8; }
.spark svg { display: block; }

/* ------------------------------------------------------------------- topbar */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 0 22px; height: 58px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.02em; }
.brand .flame { color: var(--brand); display: grid; place-items: center; }
.brand .wm { font-size: 15px; margin: 0; font-weight: 700; line-height: 1.45; }
.brand .wm b { color: var(--txt); }
.brand .wm span { color: var(--txt-faint); font-weight: 500; }

/* As três portas de entrada. Antes disto cada tela só era alcançável digitando
   a URL, então quem abria o painel de fluxos não tinha como saber que o Tester
   existia. Nunca encolhe: o nome do fluxo selecionado ao lado é longo e um flex
   comum espremeria a navegação até quebrar. */
/* ═══════════════════════════════════════════════════════ NAV — as três portas
   BLOCO COMPARTILHADO. Este CSS é IDÊNTICO em flows.html, tester.html e
   cockpit.html — gerado por preview/aplicar-nav.js e travado por
   nav-sync-test.js. Ao mudar, rode o gerador de novo; NÃO edite uma página só,
   e nunca insira um segundo bloco (foi assim que o rabo de um bloco antigo
   ficou pendurado no flows.html e a página morreu com "Illegal return
   statement").

   A cápsula é ícone-primeiro: o rótulo existe na porta ativa, sob o cursor e no
   foco de teclado. O fundo do ativo NÃO é pintado por cada porta — é UM
   elemento que viaja, a .lente, movida por mola no JS. Enquanto cada porta
   pintava o próprio fundo não havia o que animar entre elas: o estado aparecia
   e desaparecia.

   Cor: corpo e aro da lente são --accent, que neste painel significa MOVIMENTO.
   Status (ok/warn/risk/cold) continua reservado e não entra na navegação. */
.nvd{position:relative;display:flex;align-items:center;gap:3px;padding:3px;
  border-radius:999px;flex:0 0 auto;background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line-soft)}
.nvd a{position:relative;z-index:1;display:flex;align-items:center;height:30px;
  padding:0 9px;border-radius:999px;color:var(--txt-faint);text-decoration:none;
  transition:color .22s ease}
.nvd a:hover{color:var(--txt-dim)}
.nvd a[aria-current="page"]{color:var(--txt)}
.nvd a[aria-current="page"] .ic{color:var(--accent-txt)}
.nvd a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nvd .ic{display:grid;transition:transform .3s cubic-bezier(.2,.9,.15,1)}
.nvd a[aria-current="page"] .ic{transform:translateY(-.5px)}
/* O rótulo abre por CSS e a lente NÃO é sincronizada com esta transição: ela
   persegue a geometria da porta ativa quadro a quadro, então o alvo se move
   enquanto o rótulo abre e a chegada fica arrastada. É de onde vem a sensação
   de líquido — não há keyframe de viagem em nenhum lugar.
   Abre também no foco de teclado: navegando por Tab, um ícone sozinho não diz
   para onde se vai. */
.nvd .lb{display:flex;align-items:center;gap:7px;max-width:0;overflow:hidden;
  opacity:0;white-space:nowrap;font-size:12.5px;font-weight:500;
  transition:max-width .34s cubic-bezier(.2,.9,.15,1),opacity .24s ease,
    margin-left .34s cubic-bezier(.2,.9,.15,1)}
.nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
  max-width:130px;opacity:1;margin-left:7px}
/* O atalho é anunciado no lugar onde é usado. O chip só se paga porque o atalho
   EXISTE (alt+1/2/3 navega): um rótulo prometendo tecla que não faz nada é pior
   que nenhum rótulo. */
.nvd kbd{font-family:var(--font-num);font-size:9px;letter-spacing:.02em;
  color:color-mix(in srgb,var(--txt-faint) 58%,var(--txt));
  padding:1px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);
  line-height:1.5}
/* ─────────────────────────────────────────────────────────── a lente de vidro
   Cinco camadas, cada uma respondendo por uma coisa que vidro faz:
     1. corpo tingido translúcido;
     2. backdrop-filter — o que está ATRÁS aparece desfocado. Por isso a lente
        fica ABAIXO das portas (z-index 0): acima, desfocaria o próprio ícone e
        o rótulo, que é o contrário do que vidro faz com o objeto que carrega;
     3. realce especular no topo, que dá volume;
     4. o aro: linha clara em cima, escura embaixo. Sombra externa NEUTRA — a
        regra da casa não abre exceção de halo colorido para vidro;
     5. refração de borda (::before): um anel de 3px onde o backdrop é mais
        desfocado, recortado com a mesma máscara xor que o .beam já usa aqui.
   --x/--w/--sx/--sy vêm da mola. A largura é animada como LARGURA mesmo: a
   lente é out-of-flow, então mudar a largura dela não reflui nada, e fazer isso
   com scaleX transformaria a cápsula numa elipse (o raio de 999px viraria oval).
   A afinação do tema claro é a base e a do escuro sobrescreve: atrás do claro o
   fundo é quase branco e chapado, onde blur não produz efeito e brightness
   pioraria — ali o vidro se lê por contrast, aro nítido e sombra interna. */
.nvd .lente{position:absolute;top:3px;left:0;height:30px;width:var(--w,30px);
  transform:translateX(var(--x,0)) scale(var(--sx,1),var(--sy,1));
  transform-origin:var(--org,center);
  border-radius:999px;pointer-events:none;z-index:0;
  background:
    radial-gradient(130% 170% at 28% -12%,
      color-mix(in srgb,#fff 62%,transparent), transparent 58%),
    color-mix(in srgb,var(--accent) 12%,transparent);
  backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  -webkit-backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),
    inset 0 1.5px 0 color-mix(in srgb,#fff 90%,transparent),
    inset 0 -3px 5px -2px rgba(10,10,20,.13),
    0 3px 10px -7px rgba(10,10,20,.40)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .nvd .lente{
    background:
      radial-gradient(130% 170% at 28% -10%,
        color-mix(in srgb,#fff 17%,transparent), transparent 62%),
      color-mix(in srgb,var(--accent) 22%,transparent);
    backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    box-shadow:
      inset 0 0 0 1px var(--accent-line),
      inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
      inset 0 -2px 3px -1px rgba(0,0,0,.22),
      0 2px 9px -6px rgba(0,0,0,.55)}
}
:root[data-theme="dark"] .nvd .lente{
  background:
    radial-gradient(130% 170% at 28% -10%,
      color-mix(in srgb,#fff 17%,transparent), transparent 62%),
    color-mix(in srgb,var(--accent) 22%,transparent);
  backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  box-shadow:
    inset 0 0 0 1px var(--accent-line),
    inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
    inset 0 -2px 3px -1px rgba(0,0,0,.22),
    0 2px 9px -6px rgba(0,0,0,.55)}
.nvd .lente::before{content:"";position:absolute;inset:0;border-radius:inherit;
  padding:3px;pointer-events:none;
  backdrop-filter:blur(2px) saturate(2.4);
  -webkit-backdrop-filter:blur(2px) saturate(2.4);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* O brilho que corre na chegada. Nasce em opacity 0 e é disparado por classe:
   um realce varrendo sozinho seria movimento sem informação atrás. */
.nvd .lente::after{content:"";position:absolute;inset:0;border-radius:inherit;
  opacity:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 34%,
    color-mix(in srgb,#fff 55%,transparent) 47%,transparent 60%)}
.nvd .lente.varre::after{animation:navvarrer .62s cubic-bezier(.2,.75,.2,1) 1}
@keyframes navvarrer{
  0%{opacity:0;transform:translateX(-40%)}
  22%{opacity:.9}
  100%{opacity:0;transform:translateX(40%)}}
/* Em tela estreita o rótulo sai de cena, inclusive o do ativo: o sufixo do
   wordmark ao lado já diz em que tela você está, e três rótulos abertos
   estouravam a barra em 390px. */
@media (max-width:620px){
  .nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
    max-width:0;opacity:0;margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  /* O estado fica e o vidro fica — blur parado não é movimento. Somem a viagem,
     o esticão e a varredura. A mola é desligada no JS pela mesma consulta. */
  .nvd .lb,.nvd .ic,.nvd a{transition:none}
  .nvd .lente.varre::after{animation:none}
}
.topbar .sep { width: 1px; height: 20px; background: var(--line); }

/* ------------------------------------------------------- modo gravação (REC)
   Borra o que não pode aparecer numa filmagem: a fatia de dado de cliente que o
   painel mostra de propósito (nome, contato mascarado, texto de mensagem) e as
   mensagens de erro, que podem embutir telefone. Tudo isso carrega a classe
   `sens` no render. O estado mora em localStorage com chave única do produto
   (`cockpit-rec`) — ligar aqui liga no /tester e no /disco. O borrão NUNCA abre
   no hover: a tela pode estar sendo filmada neste exato momento. O pulso do ⏺
   é informação (a página está em modo gravação), então reduced-motion tira a
   animação e mantém o estado visível. */
.rec .dot { display: inline-block; }
[data-rec="1"] .rec { color: var(--accent-txt); border-color: var(--accent-line); background: var(--accent-soft); }
[data-rec="1"] .rec .dot { animation: recpulse 1.6s ease-in-out infinite; }
@keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.sens { transition: filter .45s ease; }
[data-rec="1"] .sens { filter: blur(7px); user-select: none; }
.rec-wave { position: fixed; inset: 0; z-index: 400; pointer-events: none;
  background: color-mix(in srgb, var(--accent) 16%, transparent); }
@media (prefers-reduced-motion: reduce) {
  [data-rec="1"] .rec .dot { animation: none; }
  .sens { transition: none; }
}
.meta { font-family: var(--font-num); font-size: 11.5px; color: var(--txt-faint); letter-spacing: .02em; }
.meta b { color: var(--txt-dim); font-weight: 500; }
.spacer { flex: 1; }
.livedot { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-num); font-size: 11.5px; color: var(--txt-dim); }
.livedot i { width: 7px; height: 7px; border-radius: 50%; background: var(--cold); }
.livedot.on i { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: beat 2.4s infinite; }
.livedot.off i { background: var(--risk); }
@keyframes beat { 0%{box-shadow:0 0 0 0 var(--ok-soft)} 70%{box-shadow:0 0 0 8px transparent} 100%{box-shadow:0 0 0 0 transparent} }

.btn {
  height: 32px; padding: 0 13px; border-radius: 8px; cursor: pointer;
  background: var(--raised); color: var(--txt); border: 1px solid var(--line);
  font-size: 13px; display: inline-flex; align-items: center; gap: 7px;
  transition: border-color .16s, background .16s, transform .08s;
}
.btn:hover { border-color: var(--accent-line); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; }
/* Verde só como affordance de ação, nunca como status de fluxo — cor de status
   fica reservada para ok/warn/risk/cold nos cartões. */
.btn.ok { color: var(--ok-txt); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-soft); }
.btn.ok:hover { border-color: var(--ok); }
.btn[disabled] { opacity: .55; cursor: default; }

/* -------------------------------------------------------------------- shell */
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 250px minmax(0,1fr); align-items: start; }
.rail {
  position: sticky; top: 58px; height: calc(100vh - 58px); overflow-y: auto;
  border-right: 1px solid var(--line); padding: 18px 14px 40px;
}
main { padding: 22px 26px 90px; min-width: 0; }

.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--txt-faint); margin: 0 0 12px;
}
.eyebrow .idx { color: var(--brand-txt); }
.eyebrow .rule { flex: 1; height: 1px; background: var(--line-soft); }

/* ---------------------------------------------------------------- kpi strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; margin-bottom: 26px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 13px 15px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.kpi .lbl { font-family: var(--font-num); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--txt-faint); }
.kpi .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-top: 5px; line-height: 1.05; }
.kpi .sub { font-size: 11.5px; color: var(--txt-dim); margin-top: 3px; }
.kpi.is-ok   .val { color: var(--ok-txt); }
.kpi.is-warn .val { color: var(--warn-txt); }
.kpi.is-risk .val { color: var(--risk-txt); }
.kpi.is-cold .val { color: var(--cold-txt); }

/* -------------------------------------------------------------------- panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.panel-hd { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--line-soft); }
/* Nome de fluxo é longo (visto: "Agente Iago Comercial" em painel de 740px) e
   o flex encolhia os botões até o rótulo quebrar debaixo do ícone. Quem cede
   espaço é o texto, com reticências; o controle nunca se deforma. */
.panel-hd h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-hd .hint { font-family: var(--font-num); font-size: 11px; color: var(--txt-faint);
  flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-hd .btn { flex: 0 0 auto; white-space: nowrap; }
.panel-hd .eyebrow { flex: 0 0 auto; }
.eyebrow .idx { white-space: nowrap; }

.split { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 14px; margin-bottom: 30px; align-items: start; }
@media (max-width: 1180px) { .split { grid-template-columns: minmax(0,1fr); } }

/* --------------------------------------------------------------- flow stage */
/* O palco fala o vocabulário do editor do n8n: malha de pontos em vez de
   quadriculado, porque é o fundo que o Kauan tem na cabeça quando abre o n8n —
   e porque um grid de linhas compete com os fios, que são a informação. */
.stage { position: relative; height: 460px;
  background:
    linear-gradient(var(--surface-2), var(--surface-2)),
    radial-gradient(circle at 1px 1px, var(--grid-bold) 1px, transparent 0);
  background-size: auto, 22px 22px;
  border-radius: 0 0 var(--r) var(--r); overflow: hidden; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.stage svg { display: block; width: 100%; height: 100%; }
.stage .corner { position: absolute; font-family: var(--font-num); font-size: 9.5px; letter-spacing: .12em; color: var(--txt-faint); opacity: .65; }
.stage .corner.tl { top: 9px; left: 11px; } .stage .corner.br { bottom: 9px; right: 11px; }

/* ---------------------------------------------------------------- os fios
   Bézier horizontal com seta no destino. A seta não é enfeite: num grafo de
   188 nós, sem ela não dá para saber quem chama quem. */
.edge { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-linecap: round; }
.edge.aux { stroke-dasharray: 4 4; opacity: .7; }
.edge.ran { stroke: var(--ok); }
.edge.flowing { stroke: var(--accent); stroke-dasharray: 7 8; animation: drift 1.1s linear infinite; }
.edge.lit { stroke: var(--accent); stroke-width: 2.4; }
@keyframes drift { to { stroke-dashoffset: -30; } }
.tip { fill: var(--wire); }
.tip.ran { fill: var(--ok); }
.tip.lit { fill: var(--accent); }

/* ------------------------------------------------------------------- os nós
   Quadrado com ícone e rótulo embaixo, como no editor. A cor do GLIFO é do
   serviço (identidade); a cor da BORDA é do estado. Elas nunca ocupam o mesmo
   lugar, então a reserva da cor de status continua valendo onde importa. */
.nd .face { fill: var(--node-face); stroke: var(--node-edge); stroke-width: 1.2; }
.nd .glyph { stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.nd .nm { fill: var(--txt); font-family: var(--font); font-size: 9.5px; font-weight: 600; text-anchor: middle; }
.nd .ty { fill: var(--txt-faint); font-family: var(--font-num); font-size: 7.5px; text-anchor: middle; }
.nd .port { fill: var(--node-face); stroke: var(--port); stroke-width: 1.3; }
/* Tempo medido do nó. Só existe quando o nó rodou de fato — é o que separa
   desenho de telemetria, e por isso nunca aparece em nó pendente. */
.nd .ms { fill: var(--txt-faint); font-family: var(--font-num); font-size: 7.5px; text-anchor: middle; opacity: 0; }
.nd.ran .ms, .nd.failed .ms, .nd.hot .ms { opacity: 1; }
.nd.ran .ms { fill: var(--ok-txt); }
.nd.failed .ms { fill: var(--risk-txt); }

.nd.pending { opacity: .5; }
.nd.disabled .face { stroke-dasharray: 4 3; }
.nd.disabled .nm { fill: var(--txt-faint); }
.nd.ran .face { stroke: var(--ok); stroke-width: 1.6; }
.nd.ran .badge { opacity: 1; }
.nd.failed .face { stroke: var(--risk); stroke-width: 2.2; fill: color-mix(in srgb, var(--risk) 12%, var(--node-face)); }
.nd.failed .badge-bad { opacity: 1; }
.nd.failed { animation: alarm 1.6s ease-in-out infinite; }
@keyframes alarm { 50% { filter: drop-shadow(0 0 7px var(--risk)); } }
.nd.hot .face { stroke: var(--accent); stroke-width: 2.4; filter: drop-shadow(0 0 8px var(--accent)); }
.nd .badge, .nd .badge-bad { opacity: 0; transition: opacity .2s; }
.nd .badge circle { fill: var(--ok); }
.nd .badge-bad circle { fill: var(--risk); }
.nd .badge path, .nd .badge-bad path { stroke: var(--bg-deep); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.pulse { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }

/* ---------------------------------------------------------- sticky notes
   São conteúdo do fluxo: é onde está escrito o nome da etapa. Entram atrás de
   tudo e continuam FORA do bounding box da câmera (`isAnnotation`) — só
   deixaram de ser invisíveis. O título mistura a cor da nota com `--txt`
   porque o amarelo puro sobre o bege do tema claro fica em ~2,5:1. */
.sticky .bg { fill: var(--sticky, #F5A524); fill-opacity: .10; stroke: var(--sticky, #F5A524); stroke-opacity: .38; stroke-width: 1; }
.sticky .ttl { fill: color-mix(in srgb, var(--sticky, #F5A524) 62%, var(--txt)); font-family: var(--font); font-weight: 700; font-size: 11px; letter-spacing: .04em; }
.sticky .bdy { fill: var(--txt-faint); font-family: var(--font); font-size: 8.5px; }

/* ------------------------------------------------- O QUE ACONTECEU
   A resposta para "rodou, mas fez o quê". Uma linha por efeito, e o que sai do
   sistema (mensagem enviada, linha gravada, API chamada) vem primeiro e
   marcado, porque é o que não dá para desfazer. Os campos são NOMES de campo,
   nunca valores — o conteúdo do payload não atravessa o servidor. */
.happened { border-top: 1px solid var(--line-soft); padding: 10px 15px 12px; }
.happened .hd {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 8px;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .14em; color: var(--txt-faint);
}
.happened .hd b { color: var(--txt-dim); font-weight: 600; letter-spacing: 0; font-family: var(--font); font-size: 12px; }
.happened .row {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px;
}
.happened .row:last-child { border-bottom: 0; }
.happened .row .ic { align-self: center; }
.happened .row .ic svg { display: block; }
.happened .row .nm { color: var(--txt); }
.happened .row .vb { color: var(--txt-dim); }
.happened .row .fields {
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint);
  display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.happened .row .ms { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); }
.happened .row.ext .nm { font-weight: 600; }
.happened .row.bad .nm, .happened .row.bad .vb { color: var(--risk-txt); }
.happened .none { font-size: 12.5px; color: var(--txt-faint); }

/* A prosa: o que a execução fez, em frases. Vem antes da lista porque é a
   resposta; a lista é a prova, e prova fica guardada até ser pedida. */
.happened .prosa { display: grid; gap: 6px; margin-bottom: 10px; }
.happened .linha { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.happened .linha .rot {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--txt-faint); flex: 0 0 auto; min-width: 54px;
}
.happened .linha .rot.out { color: var(--ok-txt); }
.happened .linha.quem .val { color: var(--txt); font-weight: 600; }
.happened .linha .val { color: var(--txt-dim); min-width: 0; }
.happened .linha .para { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); }
/* O que foi dito aparece como citação, não como dado: é conteúdo de alguém, e a
   tipografia tem que lembrar disso. Contato já vem mascarado do servidor. */
.happened .fala {
  quotes: "“" "”"; color: var(--txt); background: var(--surface-2);
  border: 1px solid var(--line-soft); border-radius: 8px; padding: 3px 9px;
  font-size: 12.5px; line-height: 1.5; min-width: 0;
}
.happened .nodelist { margin-top: 4px; }
.happened .nodelist > summary {
  cursor: pointer; list-style: none; font-family: var(--font-num); font-size: 10.5px;
  color: var(--txt-faint); padding: 4px 0;
}
.happened .nodelist > summary::-webkit-details-marker { display: none; }
.happened .nodelist > summary::before { content: "▸ "; }
.happened .nodelist[open] > summary::before { content: "▾ "; }
.happened .nodelist > summary:hover { color: var(--accent-txt); }
.happened .nodelist > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
/* A lista longa rola dentro de si: 105 nós empurrariam o quadro de erros para
   fora da tela toda vez que alguém abrisse o detalhe. */
.happened .listabox { max-height: 320px; overflow-y: auto; }

.stage-bar { display: flex; align-items: center; gap: 10px; padding: 9px 15px; border-top: 1px solid var(--line-soft); flex-wrap: nowrap; }
.stage-bar .step { flex: 1; font-family: var(--font-num); font-size: 11px; color: var(--txt-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------- live feed */
.feed { max-height: 528px; overflow-y: auto; }
.feed-row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 9px; align-items: center;
  padding: 8px 14px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
  font-size: 12.5px;
}
.feed-row:hover { background: var(--accent-soft); }
.feed-row .t { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); font-variant-numeric: tabular-nums; }
.feed-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--txt-dim); }
.feed-row .d { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); font-variant-numeric: tabular-nums; }
/* Faixa "no palco": mesma linguagem do item selecionado (barra à esquerda em
   accent), acima da lista e fora da rolagem, para continuar respondendo "qual
   estou vendo" mesmo quando a linha correspondente já saiu das 200. */
.feed-sel {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  padding: 7px 14px; border-bottom: 1px solid var(--line-soft);
  background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent);
  font-size: 12px;
}
.feed-sel.err { background: var(--risk-soft); box-shadow: inset 3px 0 0 var(--risk); }
.feed-sel .lbl { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .14em; color: var(--accent-txt); }
.feed-sel.err .lbl { color: var(--risk-txt); }
.feed-sel .who { color: var(--txt); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-sel .off { font-family: var(--font-num); font-size: 10px; color: var(--txt-faint); }

.feed-row.new { animation: land .5s ease-out; }
/* A execução que está no palco. A lista tem 200 linhas e o desenho vem de uma
   delas: sem marca, não dá para saber de qual. A barra à esquerda é o mesmo
   vocabulário do item selecionado na trilha de projetos. */
.feed-row.sel {
  background: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}
.feed-row.sel .n { color: var(--txt); font-weight: 600; }
.feed-row.sel.err { background: color-mix(in srgb, var(--risk) 14%, transparent); box-shadow: inset 3px 0 0 var(--risk); }
@keyframes land { from { background: var(--accent-soft); transform: translateY(-6px); opacity: 0; } }
.feed-row.err { background: var(--risk-soft); }
.dotst { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }

/* ------------------------------------------------------- filtro do Ao vivo
   Três filtros e só três — DEU CERTO, DEU ERRO e FLUXO. Não há "rodando"
   porque esta instância vive com 0 (execuções terminam em 60–600ms) e não há
   "lento" porque BANDS.slowMs é 30s: o chip mostraria 0 quase sempre, e um
   filtro que nunca acende ensina a ignorar a faixa inteira.

   A escolha do fluxo é uma TELINHA, não um menu que cai por cima da lista: são
   68 fluxos, e um popover sobre as execuções esconde justamente o que se está
   tentando ler para escolher. */
.filtro {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-bottom: 1px solid var(--line-soft);
  background: color-mix(in srgb, var(--surface-2) 55%, transparent);
  flex-wrap: wrap;
}
.fchip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--txt-faint);
  padding: 4px 9px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--line); background: transparent;
  transition: color .14s, border-color .14s, background .14s;
}
.fchip:hover { color: var(--txt-dim); border-color: var(--accent-line); }
.fchip b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--txt-dim); font-size: 10.5px; }
/* Ligado é --accent porque é movimento (o que VOCÊ está fazendo agora), nunca
   cor de status: o ponto dentro do chip já carrega --ok ou --risk, e gastar o
   verde/vermelho no fundo diria que o filtro é um estado do n8n. */
.fchip.on { color: var(--accent-txt); border-color: var(--accent-line); background: var(--accent-soft); }
.fchip.on b { color: var(--accent-txt); }
.fchip .dotst { margin-right: 0; vertical-align: 0; width: 6px; height: 6px; flex: 0 0 auto; }
/* O botão do fluxo ocupa a sobra: é o único cujo rótulo é um nome de tamanho
   imprevisível, e cortar no meio da palavra é pior que usar o espaço vazio. */
.fchip.fluxo { flex: 1 1 130px; justify-content: space-between; min-width: 0; text-align: left; }
.fchip.fluxo .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip.fluxo .cv { flex: 0 0 auto; opacity: .7; }

/* O que o filtro está escondendo. Sem esta faixa, uma lista vazia por filtro é
   indistinguível de "nada executou na janela" — uma é frase sobre o n8n, a
   outra sobre a tela. */
.fsit {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 12px; font-size: 11.5px; color: var(--txt-dim);
  background: var(--accent-soft); border-bottom: 1px solid var(--line-soft);
}
.fsit b { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--accent-txt); }
.fsit .lmp {
  margin-left: auto; border: 0; background: transparent; cursor: pointer;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent-txt); padding: 2px 4px;
}
.fsit .lmp:hover { text-decoration: underline; }
/* Falha que o filtro está escondendo. É --risk porque é uma falha, e é o único
   lugar da faixa onde cor de status é o assunto e não o filtro. */
.fsit .oculto {
  display: inline-flex; align-items: center; gap: 5px; border: 0; cursor: pointer;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--risk-txt); background: var(--risk-soft);
  border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent);
  border-radius: 20px; padding: 3px 8px;
}
.fsit .oculto:hover { border-color: var(--risk); }

/* --------------------------------------------- a telinha de escolher fluxo
   Mesmo vocabulário do .hoff-scrim: --bg-deep a 72% com blur de 9px. Um segundo
   jeito de escurecer a página seria um segundo jeito de dizer "isto está na
   frente", e esta casa já tem um. */
.fmod-scrim {
  position: fixed; inset: 0; z-index: 92; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1);
  -webkit-backdrop-filter: blur(9px) saturate(1.1);
  animation: fmodin .22s ease-out both;
}
@keyframes fmodin { from { opacity: 0; } }
.fmod {
  position: relative; width: min(520px, 100%); max-height: min(76vh, 640px);
  display: grid; grid-template-rows: auto auto minmax(0,1fr) auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow), 0 50px 110px -50px rgba(0,0,0,.85);
  overflow: hidden;
  animation: fmodup .26s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes fmodup { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.fmod-hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.fmod-hd .idx { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em; color: var(--brand-txt); }
.fmod-hd h3 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.fmod-hd .x {
  margin-left: auto; border: 1px solid var(--line); background: transparent; cursor: pointer;
  width: 26px; height: 26px; border-radius: 8px; color: var(--txt-faint); font-size: 13px; line-height: 1;
}
.fmod-hd .x:hover { color: var(--txt); border-color: var(--accent-line); background: var(--accent-soft); }
.fmod-busca { padding: 0 16px 12px; }
.fbusca {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; background: var(--surface-2);
}
.fbusca:focus-within { border-color: var(--accent-line); background: var(--accent-soft); }
.fbusca input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font-family: var(--font); font-size: 13px; color: var(--txt); padding: 1px 0;
}
.fbusca input::placeholder { color: var(--txt-faint); }
.fbusca .kbd, .fmod-ft .kbd {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; color: var(--txt-faint);
  border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px; flex: 0 0 auto;
}
.fmod-lista { overflow-y: auto; padding: 0 10px 10px; }
.fmod-ft {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--line-soft); background: var(--surface-2);
  font-size: 11.5px; color: var(--txt-faint);
}
.fmod-ft .tot { margin-left: auto; }
.fmod-vazio { padding: 26px 16px; text-align: center; color: var(--txt-dim); font-size: 13px; }
.fitem {
  display: grid; grid-template-columns: 8px minmax(0,1fr) auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 9px 10px; border-radius: 10px; color: var(--txt-dim); font-family: var(--font);
}
.fitem:hover, .fitem.cur { background: var(--accent-soft); color: var(--txt); }
.fitem.on { background: var(--accent-soft); }
.fitem .dotst { width: 8px; height: 8px; margin: 0; vertical-align: 0; }
/* Altura fixa mesmo sem a segunda linha: sem isso a lista fica com degraus,
   porque só parte dos fluxos segue a convenção `[PROJETO] Nome`. */
.fitem .nm { min-width: 0; min-height: 32px; display: flex; flex-direction: column; justify-content: center; }
.fitem .n1 { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fitem .n2 {
  display: block; font-family: var(--font-num); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--txt-faint); margin-top: 2px;
}
.fitem .num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.fitem .num .ex { display: block; font-size: 12px; color: var(--txt-dim); }
.fitem .num .er { display: block; font-size: 10px; color: var(--risk-txt); margin-top: 2px; }
.fitem .num .er.zero { color: var(--txt-faint); }
.fitem.todos { border-bottom: 1px solid var(--line-soft); border-radius: 10px 10px 0 0; margin-bottom: 4px; }

/* --------------------------------------------------------------- flow cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 15px 13px; box-shadow: var(--shadow); cursor: pointer; position: relative;
  transition: border-color .16s, transform .12s;
}
.card:hover { border-color: var(--accent-line); transform: translateY(-2px); }
.card.sel { border-color: var(--accent); }
.card::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 2px; border-radius: 2px; background: var(--cold); }
.card.s-ok::before   { background: var(--ok); }
.card.s-warn::before { background: var(--warn); }
.card.s-risk::before { background: var(--risk); }
.card.s-cold::before { background: var(--cold); }
.card h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.card .proj { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--txt-faint); }
.card .diag { font-size: 12.5px; color: var(--txt-dim); margin: 8px 0 10px; min-height: 34px; }
.card .stats { display: flex; gap: 14px; font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); font-variant-numeric: tabular-nums; }
.card .stats b { color: var(--txt); font-weight: 600; }
.spark-row { display: flex; gap: 2px; align-items: flex-end; height: 20px; margin: 9px 0 2px; }
.spark-row i { flex: 1; min-width: 2px; border-radius: 1px; background: var(--ok); opacity: .75; }
.spark-row i.e { background: var(--risk); opacity: 1; }
.spark-row i.z { background: var(--line); }

/* -------------------------------------------------------------- error board */
.errs { display: grid; gap: 10px; }
.err {
  border: 1px solid var(--line); border-left: 2px solid var(--risk); border-radius: 10px;
  background: var(--surface); padding: 12px 14px; display: grid; gap: 6px;
}
.err .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.err .cnt { font-family: var(--font-num); font-size: 12px; font-weight: 700; color: var(--risk-txt); background: var(--risk-soft); border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent); border-radius: 6px; padding: 1px 7px; }
.err .wf { font-size: 13px; font-weight: 600; }
.err .node { font-family: var(--font-num); font-size: 11px; color: var(--txt); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.err .proj { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--txt-faint); }
/* Falha de sub-workflow. O n8n reporta o erro do filho NO PAI, então o nome do
   nó ao lado do nome do fluxo afirmava uma coisa falsa: o nó não está lá. O
   chip do fluxo filho entra entre os dois, e o nó ganha contorno de "não é
   daqui" — a linha explicativa embaixo termina de contar. */
.err .sub {
  font-family: var(--font-num); font-size: 10.5px; color: var(--accent-txt);
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  border-radius: 5px; padding: 1px 6px; max-width: 260px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.err .node.foreign { border-style: dashed; color: var(--txt-dim); }
.err .when.origin { color: var(--accent-txt); }
.err .msg { font-family: var(--font-num); font-size: 11.5px; color: var(--txt-dim); line-height: 1.5; word-break: break-word; }
.err .when { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); }
.err .acts { display: flex; gap: 8px; flex-wrap: wrap; }
/* Corrigido continua visível, só perde o peso visual da barra vermelha. */
.err.fixed { border-left-color: var(--ok); opacity: .72; }
.err.fixed:hover { opacity: 1; }
.err.reopened { border-left-color: var(--warn); }
/* Nota do Kauan e sugestão heurística: barra à esquerda para separar do texto
   cru do n8n. Nota usa o accent (é dele), sugestão fica em tom apagado — para
   não competir com a mensagem real do erro. */
.err .note, .err .tip {
  font-size: 12px; line-height: 1.5; padding: 6px 10px; border-radius: 7px;
  border-left: 2px solid var(--accent-line); background: var(--surface-2); color: var(--txt-dim);
}
.err .note { color: var(--txt); border-left-color: var(--accent); }
.err .note.past { color: var(--txt-dim); border-left-color: var(--line); font-family: var(--font-num); font-size: 11.5px; }
.err .tip { border-left-color: color-mix(in srgb, var(--warn) 45%, transparent); }

.err .fixform { display: grid; gap: 8px; margin-top: 4px; padding: 10px; border: 1px dashed var(--line); border-radius: 9px; background: var(--surface-2); }
.err .fixform label { font-family: var(--font-num); font-size: 11px; color: var(--txt-dim); }
.err .fixform textarea {
  min-height: 66px; resize: vertical; padding: 8px 10px; font: inherit; font-size: 12.5px;
  color: var(--txt); background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
}
.err .fixform textarea:focus { outline: none; border-color: var(--accent); }
/* Sem escopo em `.err`: o mesmo aviso serve dentro do cartão (POST falhou) e no
   topo do quadro inteiro (GET das marcas falhou). */
.fixerr { font-family: var(--font-num); font-size: 11.5px; line-height: 1.5; color: var(--risk-txt); background: var(--risk-soft); border-radius: 6px; padding: 6px 9px; }

/* Confirmação de que salvou: verde e assenta. Roda só DEPOIS da resposta do
   servidor — verde antes de gravar seria mentira quando o POST falha. */
.err.settling { animation: settle .55s ease-out forwards; }
@keyframes settle {
  0%   { border-left-color: var(--risk); background: var(--surface); }
  35%  { border-left-color: var(--ok); background: var(--ok-soft); transform: none; }
  100% { border-left-color: var(--ok); background: var(--ok-soft); transform: scale(.985); opacity: .35; }
}
@media (prefers-reduced-motion: reduce) {
  .err.settling { animation: none; border-left-color: var(--ok); background: var(--ok-soft); }
}

.filterchip {
  display: inline-flex; align-items: center; gap: 7px; margin-right: 10px;
  font-family: var(--font-num); font-size: 10.5px; text-transform: none; letter-spacing: 0;
  color: var(--txt); background: var(--accent-soft);
  border: 1px solid var(--accent-line); border-radius: 20px; padding: 2px 4px 2px 9px;
}
.filterchip button { font: inherit; cursor: pointer; color: var(--txt-dim); background: transparent; border: 0; padding: 2px 6px; border-radius: 14px; }
.filterchip button:hover { color: var(--txt); background: var(--surface-2); }
.filterchip.paused { color: var(--warn-txt); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); padding: 2px 9px; }
.card.filt { box-shadow: inset 0 0 0 1px var(--accent); }

/* Estrela e remover, no canto do card. Escondidos até o hover/foco para não
   virar 36 ícones repetidos numa grade de 18 cards — MENOS a estrela ativa,
   que é informação (diz por que o card está em primeiro) e fica sempre.
   A estrela cheia é --accent: estado de UI, nunca cor de status. */
.card-acts { position: absolute; top: 9px; right: 9px; display: flex; gap: 4px; z-index: 2; }
.cact { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; cursor: pointer;
  background: var(--raised); border: 1px solid var(--line); border-radius: 7px;
  color: var(--txt-faint); opacity: 0; transition: opacity .12s, color .12s, border-color .12s; }
.cact svg { width: 14px; height: 14px; }
.card:hover .cact, .card:focus-within .cact, .cact.on { opacity: 1; }
.cact:hover { color: var(--txt); border-color: var(--accent-line); }
.cact.fav.on { color: var(--accent-txt); border-color: var(--accent-line); background: var(--accent-soft); }
/* Sem hover não existe "aparecer no hover": no toque os botões ficam visíveis
   e com alvo de 40px, que é o piso deste projeto para toque. */
@media (hover: none) {
  .cact { opacity: 1; width: 38px; height: 38px; }
}

.hidden-row { display: flex; align-items: baseline; gap: 10px; }
.linkbtn { background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-num);
  font-size: 10.5px; color: var(--accent-txt); text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:hover { color: var(--txt); }

/* --------------------------------------------------------------------- rail
   O item tem duas linhas: nome + contagem em cima, "N fluxos · N exec" embaixo.
   A segunda linha é o que faz o trilho responder "qual projeto trabalha mais"
   sem hover — antes essa resposta vivia só no title. A falha vira uma PÍLULA
   (`3 falhas`), não um "3✕" solto: número vermelho sem moldura lê como ruído
   de renderização, com moldura lê como aviso. A barra de status continua sendo
   a âncora de cor, agora com a altura das duas linhas. */
.rail h4 { font-family: var(--font-num); font-size: 10px; letter-spacing: .1em; margin: 0 0 10px 6px; }
.rail h4 .idx { color: var(--brand-txt); }
.rail-item {
  display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 4px 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; margin-bottom: 3px;
  border: 1px solid transparent;
}
.rail-item:hover { background: var(--surface-2); border-color: var(--line-soft); }
.rail-item.sel { background: var(--accent-soft); border-color: var(--accent-line); }
.rail-item.sel .nm { color: var(--txt); font-weight: 600; }
.rail-item i.bar { grid-row: 1 / span 2; width: 4px; align-self: stretch; border-radius: 2px; background: var(--cold); }
/* Item sem meta (o "Todos") volta a uma linha: a barra não estica o vazio. */
.rail-item.only i.bar { grid-row: 1; height: 15px; align-self: center; }
.rail-item.s-ok i.bar{background:var(--ok)} .rail-item.s-warn i.bar{background:var(--warn)}
.rail-item.s-risk i.bar{background:var(--risk)} .rail-item.s-cold i.bar{background:var(--cold)}
.rail-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--txt-dim); }
.rail-item .ct { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); font-variant-numeric: tabular-nums; }
.rail-item .meta { grid-column: 2 / span 2; font-family: var(--font-num); font-size: 9.5px;
  color: var(--txt-faint); font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item .ct.bad { font-size: 9px; letter-spacing: .04em; color: var(--risk-txt); font-weight: 700;
  background: var(--risk-soft); border: 1px solid color-mix(in srgb, var(--risk) 30%, transparent);
  border-radius: 999px; padding: 2px 7px; }

.pill { font-family: var(--font-num); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; border: 1px solid; }
.pill.ok{color:var(--ok-txt);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.warn{color:var(--warn-txt);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pill.risk{color:var(--risk-txt);background:var(--risk-soft);border-color:color-mix(in srgb,var(--risk) 35%,transparent)}
.pill.cold{color:var(--cold-txt);background:var(--cold-soft);border-color:color-mix(in srgb,var(--cold) 35%,transparent)}

.empty, .loading, .failure { padding: 30px 18px; text-align: center; color: var(--txt-dim); font-size: 13px; }
.failure { color: var(--risk-txt); font-family: var(--font-num); font-size: 12px; }
.loading .bars { display: grid; gap: 8px; max-width: 420px; margin: 0 auto 14px; }
.loading .bars i { height: 9px; border-radius: 5px; background: linear-gradient(90deg, var(--line-soft), var(--line), var(--line-soft)); background-size: 200% 100%; animation: shim 1.3s linear infinite; }
@keyframes shim { to { background-position: -200% 0; } }

details.dormant { margin-top: 14px; }
details.dormant summary { cursor: pointer; font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); letter-spacing: .06em; padding: 8px 0; }
details.dormant .dlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 6px; margin-top: 8px; }
details.dormant .dlist div { font-size: 12px; color: var(--txt-faint); padding: 6px 9px; border: 1px solid var(--line-soft); border-radius: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ================================================================== AVISOS
   UM vocabulário para toda mensagem do sistema, nas três páginas.

   Antes havia quatro: `.avisobar` na abertura, `alertaInline()` na corrida,
   `.anxerro` nos anexos e o `confirm()` nativo (já removido). Quatro jeitos de
   dizer a mesma coisa é o que faz um painel parecer montado por quatro pessoas —
   e o aviso é justamente o momento em que ele precisa ser mais confiável.

   Dois MODOS, um só desenho:
     `.aviso`         — ancorado, fica onde o problema está (campo, seção, caixa).
     `.avisos > .aviso` — evento: o CONTAINER e que faz flutuar, sai sozinho.
   E quatro TIPOS, que só trocam a cor e o glifo: erro, alerta, ok, info.

   O tipo decide o comportamento, não só a cor: erro e alerta NÃO somem sozinhos
   (quem precisa ler não pode perder a frase), ok e info somem em 4,5s com a
   barra mostrando o tempo — uma coisa que vai desaparecer tem que dizer isso.

   Cor de status aqui é uso canônico: `--*-txt` no texto e `-soft` no fundo, que
   é a mesma divisão fill-vs-text que o resto do produto já segue. */
.aviso{display:flex;gap:9px;align-items:flex-start;text-align:left;
  font-size:12px;line-height:1.6;border-radius:10px;padding:10px 12px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--txt-dim)}
.aviso .ai{flex:0 0 auto;font-size:11px;line-height:1.55;opacity:.95}
.aviso .ac{flex:1 1 auto;min-width:0}
.aviso .at{display:block;font-weight:650;color:var(--txt);margin-bottom:2px}
.aviso .ax{flex:0 0 auto;border:none;background:none;cursor:pointer;padding:1px 4px;
  border-radius:5px;color:inherit;opacity:.55;font-size:13px;line-height:1}
.aviso .ax:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
/* A borda sai da PRÓPRIA cor do tipo (`currentColor`), não de um token por
   variante: `--risk-line` e `--ok-line` não existem neste produto, e inventar
   quatro tokens novos para uma borda seria quatro lugares para dessincronizar.
   Assim os quatro tipos têm exatamente o mesmo peso de contorno. */
.aviso.erro,.aviso.alerta,.aviso.ok,.aviso.info{border-color:color-mix(in srgb,currentColor 30%,transparent)}
/* A cor é PUXADA para o texto base. Medido no DOM vivo, com o `-soft` composto
   sobre o fundo da página: `--risk-txt` puro dava 4,41 no claro, `--warn-txt`
   4,30, `--ok-txt` 4,29 e `--accent-txt` 4,38 no escuro — quatro reprovações de
   AA (4,5) em texto de 12px. É a armadilha que este projeto já documentou: token
   calibrado como preenchimento não é token de texto, e `-txt` sozinho foi
   calibrado contra `--surface`, não contra o próprio `-soft`.
   A mistura mantém a cor reconhecível (o vermelho continua vermelho) e sobe o
   contraste com folga. Mexeu em token de status? Re-meça — não confie na captura. */
.aviso.erro{background:var(--risk-soft);color:color-mix(in srgb,var(--risk-txt) 72%,var(--txt))}
.aviso.alerta{background:var(--warn-soft);color:color-mix(in srgb,var(--warn-txt) 72%,var(--txt))}
.aviso.ok{background:var(--ok-soft);color:color-mix(in srgb,var(--ok-txt) 72%,var(--txt))}
.aviso.info{background:var(--accent-soft);color:color-mix(in srgb,var(--accent-txt) 72%,var(--txt))}
/* O glifo fica na cor CHEIA: ele é forma, não texto corrido, e é o que mantém a
   identidade do tipo legível de longe. */
.aviso.erro .ai{color:var(--risk-txt)}
.aviso.alerta .ai{color:var(--warn-txt)}
.aviso.ok .ai{color:var(--ok-txt)}
.aviso.info .ai{color:var(--accent-txt)}
.aviso.bloco{max-width:700px;margin:16px auto 0}

/* A pilha. `fixed` no alto à direita, abaixo do topbar: não cobre o compositor
   (embaixo), não cobre o cabeçalho (em cima), e é para onde o olho vai depois de
   clicar num botão do cabeçalho. Empilha para baixo; o mais novo entra por cima.
   `pointer-events` só nos cartões — a pilha inteira não pode roubar clique da
   página atrás dela. */
.avisos{position:fixed;top:70px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px;
  width:min(380px,calc(100vw - 36px));pointer-events:none}
.avisos .aviso{pointer-events:auto;box-shadow:var(--shadow);backdrop-filter:blur(8px);
  animation:avin .26s cubic-bezier(.2,.9,.3,1) both}
.aviso.saindo{animation:avout .18s ease-in both}
@keyframes avin{from{opacity:0;transform:translateX(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes avout{from{opacity:1}to{opacity:0;transform:translateX(10px)}}
/* A barra do tempo restante. Só existe onde há auto-dismiss — desenhar uma barra
   parada num aviso que não sai seria prometer que ele vai sumir. */
.aviso .abar{position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:currentColor;opacity:.35;transform-origin:left;animation:avbar linear both}
@keyframes avbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.avisos .aviso{position:relative;overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .avisos .aviso,.aviso.saindo{animation-duration:1ms;animation-delay:0s}
  /* A barra continua encurtando: ela é INFORMAÇÃO (quanto falta), não enfeite.
     O que sai é o deslize de entrada, que é decoração. */
  .aviso .abar{animation-duration:inherit}
}
@media (max-width:520px){ .avisos{top:auto;bottom:14px;right:12px;left:12px;width:auto} }

/* ==========================================================================
   CAMADA DE MOVIMENTO — receitas portadas do cult-ui (nolly-studio/cult-ui)
   O repositório é React + Tailwind + framer-motion e se instala por copy-paste
   de componente. Colar de lá exigiria npm, build e React num painel que hoje é
   um HTML só, sem dependência nenhuma — então o que veio foi a RECEITA visual,
   reescrita em CSS/WAAPI puro:
     border-beam-button  -> .beam        (feixe cônico girando na borda)
     texture-button      -> .btn         (bevel de duas camadas + brilho interno)
     texture-card        -> .kpi/.card   (sheen diagonal + realce superior)
     glow-button         -> .card        (brilho que segue o cursor, --mx/--my)
     animated-number     -> springNumber (mola, no JS)
     grid-beam           -> .backdrop    (feixe viajando sobre a malha)
     terminal-animation  -> .hoff-term   (linhas mono aparecendo em sequência)
   A cor do movimento é SEMPRE --accent. Status (ok/warn/risk/cold) continua
   reservado e --brand segue sendo identidade, nunca decoração de estado.
   ========================================================================== */
@property --beam-a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

/* Feixe de borda: o gradiente cônico gira e um mask de duas camadas recorta só
   a moldura de 1px. Sem o mask o gradiente vazaria por cima do conteúdo. */
.beam { position: relative; }
.beam::after {
  content: ""; position: absolute; inset: -1px; border-radius: inherit;
  padding: 1px; pointer-events: none; opacity: 0;
  background: conic-gradient(from var(--beam-a),
    transparent 0deg, transparent 300deg,
    color-mix(in srgb, var(--accent) 25%, transparent) 330deg,
    var(--accent) 352deg, #fff 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  transition: opacity .22s;
}
.beam.on::after, .beam:hover::after { opacity: 1; animation: beamspin 2.6s linear infinite; }
@keyframes beamspin { to { --beam-a: 360deg; } }
/* O painel do handoff precisa de `overflow: hidden` para os cantos das faixas
   internas — e isso recorta o próprio ::after, que em `inset: -1px` fica
   inteiramente fora do clip: o feixe simplesmente não aparecia. Em `inset: 0`
   ele desenha na borda interna, dentro do recorte. Verificado por captura. */
.hoff.beam::after { inset: 0; }

/* Bevel do texture-button: moldura em gradiente + preenchimento em gradiente +
   linha de luz no topo. O :active afunda 1px e apaga a luz — o botão responde
   ao toque em vez de só trocar de cor. */
.btn {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--txt) 4%, var(--raised)), var(--raised)) padding-box,
    linear-gradient(180deg, color-mix(in srgb, var(--txt) 14%, transparent), var(--line)) border-box;
  border: 1px solid transparent;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--txt) 7%, transparent), 0 1px 2px rgba(0,0,0,.18);
  transition: background .16s, box-shadow .18s, transform .09s, color .16s;
}
.btn:hover {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--raised)), var(--raised)) padding-box,
    linear-gradient(180deg, var(--accent-line), var(--line)) border-box;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--txt) 10%, transparent), 0 2px 6px rgba(0,0,0,.22);
}
.btn:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,.22); }
.btn.ghost { background: transparent padding-box, linear-gradient(180deg, var(--line), var(--line-soft)) border-box; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft) padding-box, linear-gradient(180deg, var(--accent-line), var(--line)) border-box; }

/* O botão de aviso do sistema, criado por `aba.js`. Ele já se veste com a classe
   do botão de tema desta página — que aqui é `.btn.ghost`, e NÃO `iconbtn` como
   nas outras duas; era exatamente por isso que ele saía com o estilo padrão do
   navegador nesta página.

   As duas primeiras regras são idênticas às do tester e do disco. A terceira NÃO
   é, e não pode ser: aqui a borda é uma segunda camada de `background`
   (`padding-box` + `border-box`), então `border-color` não alcança nada. O
   ligado repete a forma do `:hover` do ghost e acrescenta a cor do rótulo. */
.avisarbtn { display: inline-flex; align-items: center; gap: 5px; }
.avisarbtn .dot { width: 1em; text-align: center; flex: 0 0 auto; }
/* `--accent-txt` puro sobre `--accent-soft` mede 4,38 no escuro nas outras duas
   páginas: falha AA a 11px, o mesmo número que os avisos já pagaram. O remédio é
   o mesmo, e vale aqui por coerência mesmo com o fundo desta barra sendo mais
   escuro. O glifo fica com o acento inteiro — é forma, não texto corrido. */
.avisarbtn.on { color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt));
  background: var(--accent-soft) padding-box, linear-gradient(180deg, var(--accent-line), var(--line)) border-box; }
.avisarbtn.on .dot { color: var(--accent-txt); }
.avisarbtn.bloq { opacity: .55; }
.btn.ok {
  color: var(--ok-txt);   /* o preenchimento usa --ok; só o rótulo precisa do 4.5 */
  background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 16%, var(--raised)), var(--ok-soft)) padding-box,
              linear-gradient(180deg, color-mix(in srgb, var(--ok) 55%, transparent), color-mix(in srgb, var(--ok) 25%, transparent)) border-box;
}
.btn.ok:hover { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ok) 22%, transparent), 0 2px 6px rgba(0,0,0,.22); }
.btn[disabled] { opacity: .55; cursor: default; transform: none; }
/* O painel não declarava foco em lugar nenhum: o outline padrão do Chrome caía
   sobre a borda em gradiente do botão e praticamente desaparecia. Anel explícito,
   com offset, para o foco ser visível em cima de qualquer variante. */
.btn:focus-visible,
.rail-item:focus-visible, .card:focus-visible, .feed-row:focus-visible,
summary:focus-visible, .filterchip button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 8px;
}
/* Foco de teclado nunca deve depender só de cor: o anel vem acompanhado do
   mesmo realce que o hover dá. */
.rail-item:focus-visible, .feed-row:focus-visible { background: var(--accent-soft); }

/* Sheen do texture-card: uma faixa diagonal fixa, quase invisível, que dá
   volume ao cartão sem virar gradiente colorido (cor de status é reservada). */
.kpi::after, .panel::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(147deg, color-mix(in srgb, var(--txt) 5%, transparent) 0%, transparent 42%);
}
.panel { position: relative; }
.kpi { transition: border-color .2s, transform .2s, box-shadow .2s; }
.kpi:hover { border-color: var(--accent-line); transform: translateY(-2px); box-shadow: var(--shadow), 0 10px 24px -18px rgba(0,0,0,.55); }
.kpi .val { transition: color .3s; }

/* Brilho que segue o cursor (glow-button). --mx/--my são escritos no pointermove;
   sem hover o raio fica em opacity 0 e não custa nada. */
.card { --mx: 50%; --my: 50%; overflow: hidden; }
.card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  opacity: 0; transition: opacity .25s;
  background: radial-gradient(220px circle at var(--mx) var(--my), var(--accent-soft), transparent 65%);
}
.card:hover::after { opacity: 1; }
.card:hover { box-shadow: var(--shadow), 0 14px 30px -20px rgba(0,0,0,.55); }

/* grid-beam: um feixe horizontal atravessa a malha do fundo devagar. É o único
   movimento ambiente da página, por isso é lento e de baixa opacidade. */
.backdrop .gbeam {
  position: absolute; left: -30%; width: 60%; height: 1px; top: 22%;
  background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
  filter: blur(.4px); opacity: .55;
  animation: gbeam 13s cubic-bezier(.4,0,.25,1) infinite;
}
.backdrop .gbeam.b2 { top: 61%; animation-duration: 19s; animation-delay: 5s; opacity: .35; }
@keyframes gbeam { 0% { transform: translateX(0); } 100% { transform: translateX(250%); } }

/* Aparição escalonada dos cartões: --i é o índice, definido no render. */
.rise { animation: rise .42s cubic-bezier(.2,.8,.25,1) both; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }

/* ==========================================================================
   HANDOFF — a tela do "Mandar pro Claude"
   Oito etapas, cada uma correspondendo a trabalho que acontece de verdade:
   assinatura em memória, GET do grafo, localização do nó, GET da execução,
   diagnóstico heurístico, sessão headless do Claude Code, portas de validação
   determinísticas e a revisão do diff. A tela termina num diff esperando
   aprovação, e diz em voz alta que nada foi escrito no n8n até o clique. Uma
   tela que animasse "corrigido" com o nó intacto na instância seria a mesma
   mentira do relógio vivo sobre dado velho — e essa é a linha que este painel
   não cruza.
   ========================================================================== */
.hoff-scrim {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1);
  animation: scrimin .28s ease-out both;
}
@keyframes scrimin { from { opacity: 0; } }
.hoff {
  position: relative; width: min(1080px, 100%); max-height: min(88vh, 860px);
  /* Quatro faixas: cabeçalho, corpo, briefing, rodapé. O briefing só é inserido
     no fim, mas a faixa precisa existir desde já — com três faixas ele caía numa
     linha implícita e passava por cima do terminal. */
  display: grid; grid-template-rows: auto minmax(0,1fr) auto auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow), 0 50px 110px -50px rgba(0,0,0,.85);
  overflow: hidden; transform-origin: top left;
}
.hoff-hd { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.hoff-hd .idx { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em; color: var(--brand-txt); }
.hoff-hd h2 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.hoff-hd .sig { font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hoff-hd .spacer { flex: 1; }

.hoff-body { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 0; min-height: 0; }
.hoff-steps { border-right: 1px solid var(--line-soft); padding: 16px 14px; overflow-y: auto; background: var(--surface-2); }
.hoff-step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 6px; border-radius: 8px; opacity: .38; transition: opacity .3s, background .3s; }
.hoff-step .mark {
  width: 18px; height: 18px; border-radius: 50%; margin-top: 2px;
  border: 1px solid var(--line); display: grid; place-items: center;
  font-family: var(--font-num); font-size: 9px; color: var(--txt-faint);
}
.hoff-step .nm { font-size: 12.5px; color: var(--txt-dim); line-height: 1.35; }
.hoff-step .sub { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); margin-top: 2px; }
.hoff-step.on { opacity: 1; background: var(--accent-soft); }
.hoff-step.on .mark { border-color: var(--accent); color: var(--accent-txt); animation: markspin 1s linear infinite; }
.hoff-step.on .nm { color: var(--txt); font-weight: 600; }
@keyframes markspin { to { transform: rotate(360deg); } }
.hoff-step.done { opacity: 1; }
.hoff-step.done .mark { border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: var(--ok-soft); color: var(--ok-txt); animation: none; }
.hoff-step.warnst .mark { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-soft); color: var(--warn-txt); animation: none; }

/* Três faixas fixas por posição explícita, não por ordem de inserção: a faixa
   de atividade é REMOVIDA do DOM quando a corrida acaba, e com auto-placement o
   terminal subiria para a linha `auto` e encolheria para a altura do texto. */
.hoff-main { display: grid; grid-template-rows: 244px auto minmax(0,1fr); min-height: 0; }
.hoff-mini { grid-row: 1; }
.hoff-act  { grid-row: 2; }
.hoff-term { grid-row: 3; }

/* ------------------------------------------------- ATIVIDADE (o que ele faz)
   O terminal mostra tudo, e é justamente por isso que "o que está acontecendo
   agora" se perdia nele: 40 linhas rolando enterram a única que importa. Esta
   faixa carrega um fato por vez, sobrescrito, em tamanho legível de longe —
   mais a barra, que é a resposta para "quanto falta".

   A barra mede TEMPO contra a mediana das corridas anteriores, não etapas
   concluídas: das oito etapas, sete levam milissegundos e uma leva três
   minutos, então uma barra por etapa saltaria para 60% e ficaria parada. */
.hoff-act {
  border-bottom: 1px solid var(--line-soft); background: var(--surface-2);
  padding: 11px 18px 12px; display: grid; gap: 8px;
}
.hoff-act .act-line { display: flex; align-items: center; gap: 9px; min-width: 0; }
.hoff-act .dot {
  width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
  background: var(--accent); box-shadow: 0 0 0 0 var(--accent-line);
  animation: actpulse 1.9s ease-out infinite;
}
@keyframes actpulse {
  0% { box-shadow: 0 0 0 0 var(--accent-line); }
  70%, 100% { box-shadow: 0 0 0 7px transparent; }
}
.hoff-act .act-txt {
  font-size: 13.5px; color: var(--txt); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hoff-act .act-stage { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .1em; color: var(--accent-txt); flex: 0 0 auto; }
.hoff-act .act-round {
  margin-left: auto; flex: 0 0 auto;
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
}
.pbar { height: 5px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
/* Cresce por `transform`, não por `width`: a barra atualiza a cada segundo
   durante minutos, e animar largura recalcula layout a cada quadro. */
.pfill {
  height: 100%; width: 100%; border-radius: inherit;
  transform: scaleX(0); transform-origin: left center;
  background: linear-gradient(90deg, var(--accent-line), var(--accent));
  transition: transform .9s linear;
}
/* Sem histórico não existe denominador, e uma barra parada em 30% seria uma
   afirmação falsa. A listra em movimento diz "andando, duração desconhecida" —
   que é exatamente o que se sabe. */
.pbar.unknown .pfill {
  transform: scaleX(1);
  background: repeating-linear-gradient(115deg,
    var(--accent-line) 0 10px, transparent 10px 22px);
  animation: pslide 1.1s linear infinite;
}
@keyframes pslide { to { background-position: 44px 0; } }
.pbar.over .pfill { background: linear-gradient(90deg, var(--warn), var(--warn)); }
.hoff-act .act-foot {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint);
}
.hoff-act .act-foot b { color: var(--txt-dim); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
  .hoff-act .dot { animation: none; }
  .pbar.unknown .pfill { animation: none; }
  .pfill { transition: none; }
  /* A telinha do filtro chega sem subir e sem escala; o blur fica, porque um
     desfoque parado não é movimento. Nenhuma informação mora na entrada. */
  .fmod-scrim, .fmod { animation: none; }
}
.hoff-mini {
  position: relative; border-bottom: 1px solid var(--line-soft);
  background:
    linear-gradient(var(--surface-2), var(--surface-2)),
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 24px);
  overflow: hidden;
}
.hoff-mini svg { display: block; width: 100%; height: 100%; }
/* Chip em vez de texto solto: num grafo de 188 nós o rótulo cai atrás de um nó
   e some. O fundo o mantém legível sem precisar reservar espaço no layout. */
.hoff-mini .corner {
  position: absolute; top: 8px; left: 10px; z-index: 1;
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .12em; color: var(--txt-dim);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px 7px;
}
.hoff-mini .idle { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); }

/* terminal-animation: linhas mono entrando uma a uma, com cursor de bloco. */
.hoff-term { overflow-y: auto; padding: 14px 18px 18px; font-family: var(--font-num); font-size: 11.5px; line-height: 1.72; }
.hoff-term .ln { display: flex; gap: 9px; color: var(--txt-dim); animation: lnin .3s ease-out both; }
@keyframes lnin { from { opacity: 0; transform: translateY(4px); } }
.hoff-term .ln .g { color: var(--txt-faint); flex: 0 0 auto; }
.hoff-term .ln.hd { color: var(--accent-txt); margin-top: 10px; }
.hoff-term .ln.hd:first-child { margin-top: 0; }
.hoff-term .ln.bad { color: var(--risk-txt); }
.hoff-term .ln.warn { color: var(--warn-txt); }
.hoff-term .ln.good { color: var(--ok-txt); }
.hoff-term .ln .tx { min-width: 0; word-break: break-word; }
.hoff-term .caret { display: inline-block; width: 7px; height: 13px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.hoff-ft { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.hoff-ft .truth { flex: 1; min-width: 260px; font-size: 12px; color: var(--txt-dim); line-height: 1.45; }
.hoff-ft .truth b { color: var(--txt); font-weight: 600; }
.hoff-brief {
  width: calc(100% - 36px); height: 108px; min-height: 68px; max-height: 40vh; resize: vertical;
  margin: 0 18px 12px;
  font-family: var(--font-num); font-size: 11px; line-height: 1.55;
  color: var(--txt); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
}
.hoff-brief:focus { outline: none; border-color: var(--accent); }

/* --------------------------------------------------------------------------
   REVISÃO — a tela de pull request da proposta do Claude.
   Ela ocupa a mesma faixa onde o briefing ficava, porque substitui exatamente
   aquilo: antes o cockpit entregava texto para colar, agora entrega um diff
   para aprovar. Rola sozinha e tem teto de altura — um nó de agente tem 15k
   caracteres de prompt e sem teto o rodapé com os botões sai da tela, que é
   justamente onde a decisão acontece.
   -------------------------------------------------------------------------- */
.hoff.reviewing { max-height: min(93vh, 940px); }
.hoff.reviewing .hoff-main { grid-template-rows: 132px auto minmax(0,1fr); }
.hoff-pr {
  border-top: 1px solid var(--line-soft); background: var(--surface-2);
  overflow-y: auto; max-height: 48vh; padding: 14px 18px 16px;
}
.hoff-pr .prhd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.hoff-pr .prhd .idx { font-family: var(--font-num); font-size: 10px; letter-spacing: .16em; color: var(--brand-txt); }
.hoff-pr .prhd h3 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.hoff-pr .prhd .sum { font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); }

.gates { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.gate {
  font-family: var(--font-num); font-size: 10.5px; line-height: 1.4;
  padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--txt-dim);
}
.gate.ok   { color: var(--ok-txt);   border-color: color-mix(in srgb, var(--ok) 38%, transparent);   background: var(--ok-soft); }
.gate.bad  { color: var(--risk-txt); border-color: color-mix(in srgb, var(--risk) 42%, transparent); background: var(--risk-soft); }
.gate.skip { color: var(--cold-txt); border-color: var(--line); background: var(--cold-soft); }
/* O report do Claude é longo por bom motivo, e empurra o diff para fora da
   vista logo onde a decisão acontece. O atalho custa uma linha e evita a
   rolagem às cegas. */
button.gate { font-family: var(--font-num); cursor: pointer; }
.gate.jump { color: var(--accent-txt); border-color: var(--accent-line); background: var(--accent-soft); }
.gate.jump:hover { border-color: var(--accent); }
.gate.jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.report {
  font-size: 12.5px; line-height: 1.62; color: var(--txt-dim);
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 12px;
}
.report h4 { margin: 12px 0 4px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--txt); }
.report h4:first-child { margin-top: 0; }
.report p { margin: 0 0 7px; }
.report li { margin-left: 16px; }
