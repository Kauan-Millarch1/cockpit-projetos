.report code { font-family: var(--font-num); font-size: 11.5px; background: var(--surface-2); border-radius: 4px; padding: 1px 4px; }

.dnode { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); margin-bottom: 8px; overflow: hidden; }
.dnode > summary {
  cursor: pointer; list-style: none; padding: 9px 12px;
  display: flex; gap: 9px; align-items: center; font-size: 12.5px; color: var(--txt);
}
.dnode > summary::-webkit-details-marker { display: none; }
.dnode > summary:hover { background: var(--accent-soft); }
.dnode > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dnode .tag { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; padding: 2px 6px; border-radius: 5px; flex: 0 0 auto; }
.dnode .tag.added    { color: var(--ok-txt);   background: var(--ok-soft);   border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.dnode .tag.modified { color: var(--warn-txt); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.dnode .tag.removed  { color: var(--risk-txt); background: var(--risk-soft); border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent); }
.dnode .ty { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dnode .body { border-top: 1px solid var(--line-soft); overflow-x: auto; }
.dl { display: block; white-space: pre; font-family: var(--font-num); font-size: 11px; line-height: 1.6; padding: 0 12px; color: var(--txt-dim); }
.dl.add  { background: color-mix(in srgb, var(--ok) 12%, transparent);   color: var(--ok-txt); }
.dl.del  { background: color-mix(in srgb, var(--risk) 12%, transparent); color: var(--risk-txt); }
.dl.skip { color: var(--txt-faint); font-style: italic; background: var(--surface-2); }

.edgelist { font-family: var(--font-num); font-size: 11px; line-height: 1.7; color: var(--txt-dim); margin-bottom: 10px; }
.edgelist .add { color: var(--ok-txt); }
.edgelist .del { color: var(--risk-txt); }

/* O resultado de aplicar. Fica dentro da faixa de revisão, acima do diff, para
   que a próxima coisa lida depois do clique seja o que de fato aconteceu. */
.applied {
  font-size: 12.5px; line-height: 1.55; border-radius: 10px; padding: 11px 13px; margin-bottom: 12px;
  border: 1px solid color-mix(in srgb, var(--ok) 38%, transparent); background: var(--ok-soft); color: var(--ok-txt);
}
.applied.bad { border-color: color-mix(in srgb, var(--risk) 42%, transparent); background: var(--risk-soft); color: var(--risk-txt); }
.applied.warn { border-color: color-mix(in srgb, var(--warn) 42%, transparent); background: var(--warn-soft); color: var(--warn-txt); }

/* --------------------------------------------------------------- CONCLUÍDO
   O recibo. Depois de aplicar, a faixa de revisão troca de papel: o topo passa
   a ser o que aconteceu, e o diff desce para um `details` fechado — auditoria
   continua ao alcance sem competir com a informação nova. O título sobe um
   degrau de tamanho porque é o fim de um fluxo de decisão, não mais um bloco
   entre outros; nenhuma cor nova entra, o verde é o mesmo `--ok` de sempre. */
.hoff-pr .prhd h3.done-title { font-size: 16.5px; letter-spacing: -.015em; }
.notecard {
  border: 1px solid var(--accent-line); border-radius: 10px; background: var(--accent-soft);
  padding: 11px 13px; margin-bottom: 12px;
}
.notecard .nhd {
  font-family: var(--font-num); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent-txt); margin-bottom: 5px;
}
.notecard .ntx { font-size: 13px; line-height: 1.55; color: var(--txt); }
.donediff > summary {
  cursor: pointer; list-style: none; font-family: var(--font-num); font-size: 11px;
  color: var(--txt-faint); padding: 6px 0;
}
.donediff > summary::-webkit-details-marker { display: none; }
.donediff > summary::before { content: "▸ "; }
.donediff[open] > summary::before { content: "▾ "; }
.donediff > summary:hover { color: var(--txt-dim); }
.donediff > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Movimento reduzido: a tela ainda roda todas as etapas e ainda copia — só que
   sem morph, sem giro e sem entrada escalonada. Nenhuma informação se perde. */
@media (prefers-reduced-motion: reduce) {
  .beam.on::after, .beam:hover::after { animation: none; }
  .backdrop .gbeam { display: none; }
  .rise { animation: none; }
  .hoff-scrim, .hoff-term .ln { animation: none; }
  .hoff-step.on .mark { animation: none; }
  .card::after { display: none; }
}

@media (max-width: 900px) {
  .hoff-scrim { padding: 10px; }
  .hoff { max-height: 94vh; }
  /* O `.spacer` com `flex: 1` empurrava o Fechar para uma terceira linha só
     dele. Sem ele, `margin-left: auto` encosta o botão na direita do título. */
  .hoff-hd { flex-wrap: wrap; row-gap: 4px; }
  .hoff-hd .spacer { display: none; }
  .hoff-hd .btn:last-of-type { margin-left: auto; }
  .hoff-hd .sig { flex-basis: 100%; order: 9; }
  .hoff-body { grid-template-columns: minmax(0,1fr); }
  .hoff-steps { border-right: 0; border-bottom: 1px solid var(--line-soft); max-height: 148px; }
  .hoff-main { grid-template-rows: 150px minmax(0,1fr); }
  .hoff-brief { width: calc(100% - 20px); margin: 0 10px 10px; height: 84px; }
  /* Em 390px o desenho do fluxo e a revisão não cabem juntos, e entre os dois
     quem decide é a revisão — o grafo já foi visto durante as etapas. */
  .hoff.reviewing .hoff-mini { display: none; }
  .hoff.reviewing .hoff-main { grid-template-rows: minmax(0,1fr); }
  /* Em 390px a faixa de revisão come o corpo inteiro. Medido: a trilha do grid
     ficou em 26px enquanto o corpo continuava com 132px, e o terminal foi
     pintado por cima do cabeçalho da revisão.
     `min-height` no ITEM não cria espaço — o item passa a estourar a trilha, e
     como `.hoff-body` não tem overflow próprio o excesso vaza para a linha
     seguinte. O piso tem que estar na TRILHA (`minmax`), e a faixa de revisão
     tem que ter teto para sobrar altura para ela. As etapas somem: são
     histórico, e o que decide já chegou. */
  .hoff.reviewing .hoff-steps { display: none; }
  .hoff.reviewing { grid-template-rows: auto minmax(110px, 1fr) auto auto; }
  .hoff-pr { max-height: 40vh; padding: 12px; }
  .dnode > summary { flex-wrap: wrap; }
  .dnode .ty { margin-left: 0; flex-basis: 100%; }
  .hoff-term { padding: 12px 12px 14px; }
  /* Alvo de toque: o botão do cabeçalho ficava em 32px, abaixo do piso de 40. */
  .hoff-ft .btn, .hoff-hd .btn { min-height: 40px; }
  /* A topbar é uma linha flex sem quebra: em 390px o conteúdo soma ~660px e
     empurrava a página inteira para a rolagem horizontal. Ela vira duas faixas,
     com a URL da instância descendo para a segunda — nada é escondido, só
     reordenado, porque em tela pequena o orçamento é outro, não menor. */
  .topbar { height: auto; min-height: 56px; flex-wrap: wrap; row-gap: 6px; padding: 8px 14px; }
  .topbar .sep { display: none; }
  .topbar .btn { flex: 0 0 auto; min-height: 40px; }
  .topbar .spacer { flex: 1 1 auto; }
  #instance { order: 9; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* No desktop os controles do painel não encolhem (senão o rótulo quebra sob o
     ícone). Em 390px isso vira estouro horizontal, então aqui quem quebra é a
     linha inteira — o controle continua íntegro, só desce. */
  .panel-hd { flex-wrap: wrap; row-gap: 8px; }
  .panel-hd .btn { min-height: 40px; }

  .shell { grid-template-columns: minmax(0,1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; }
  .rail h4 { display: none; }
  /* No trilho horizontal os chips voltam a uma linha: a meta dobraria a altura
     da faixa inteira por causa do chip mais largo. */
  .rail-item { min-height: 40px; flex: 0 0 auto; }
  .rail-item .meta { display: none; }
  .rail-item i.bar { grid-row: 1; height: 15px; align-self: center; }
  main { padding: 16px 14px 70px; }
  .kpi .val { font-size: 26px; }
  .stage { height: 340px; }
}

/* ==========================================================================
   SUPERFÍCIES DO NAVEGADOR — a parte do painel que não foi desenhada
   A barra de rolagem nativa do Windows (trilho branco, setas nas pontas, canto
   quadrado) é o único pedaço da tela que não pertence a nenhum tema: aparecia
   como uma faixa clara dentro do modal escuro do handoff. Aqui ela vira um
   pill flutuante tirado da mesma escada de texto do resto — trilho invisível,
   polegar em `--txt`, hover em `--accent` (movimento e realce são de accent;
   cor de status continua reservada).

   `background-clip: content-box` sobre uma borda transparente é o que dá a
   folga lateral: a calha continua com 12px de alvo de clique, mas o polegar
   desenha 6px. Estreitar a calha em vez disso deixaria a barra bonita e difícil
   de pegar com o mouse.

   Chromium ignora os pseudo-elementos `::-webkit-scrollbar` assim que
   `scrollbar-color` está declarado no mesmo elemento — por isso a via padrão
   (Firefox) fica dentro de `@supports not selector(...)`, e não lado a lado.
   ========================================================================== */
::-webkit-scrollbar { width: 12px; height: 12px; background: transparent; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: color-mix(in srgb, var(--txt) 20%, transparent);
  background-clip: content-box;
  border: 3px solid transparent;
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--accent) 58%, transparent); }
::-webkit-scrollbar-thumb:active { background-color: var(--accent); }
/* As setas das pontas são o traço mais datado da barra nativa e não levam a
   lugar nenhum que a roda do mouse não leve. */
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
::-webkit-scrollbar-corner { background: transparent; }

@supports not selector(::-webkit-scrollbar) {
  html, body, .rail, .feed, .hoff-steps, .hoff-term, .hoff-pr, .dnode .body, textarea {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--txt) 24%, transparent) transparent;
  }
}

/* O terminal e a faixa de revisão crescem enquanto a sessão roda: sem calha
   reservada, a linha que faz o conteúdo passar da altura empurra tudo 12px
   para a esquerda no meio da leitura. */
.hoff-term, .hoff-pr, .hoff-steps { scrollbar-gutter: stable; }

::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--txt); }
textarea, input { caret-color: var(--accent); }
</style>
<script>
/* O tema escolhido em qualquer página vale aqui ANTES do primeiro paint. A
   leitura já existia no fim do body, mas aí a página pintava no `data-theme`
   fixo do <html> e trocava depois — um flash do tema errado a cada navegação
   para quem escolheu o claro. `?theme=` continua vencendo (kiosk/captura). */
(() => {
  const q = new URLSearchParams(location.search).get("theme");
  const t = (q === "light" || q === "dark") ? q : localStorage.getItem("cockpit-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  // Modo gravação: mesma razão de rodar no <head> — o borrão tem que existir
  // ANTES do primeiro paint, senão cada navegação pisca o dado de cliente que
  // o modo existe para esconder da filmagem.
  if (localStorage.getItem("cockpit-rec") === "1") document.documentElement.setAttribute("data-rec", "1");
})();
</script>

<script>
/* ==========================================================================
   JUDGEMENT BLOCK — the only place in the codebase that decides anything.
   server.js and n8n.js emit facts; every threshold, band, grouping rule and
   diagnosis sentence lives here so tuning never needs a restart.
   ========================================================================== */

const BANDS = {
  errRateRisk: 0.20,   // >20% das execuções na janela falhando = risco
  errRateWarn: 0.05,   // >5% = atenção
  errCountRisk: 3,     // ou 3+ falhas absolutas na janela, independente da taxa
  staleMin: 90,        // fluxo ativo sem rodar há mais de 90 min = frio
  slowMs: 30000         // execução acima disso conta como lenta
};

/* Ritmo da reexecução visual.
 *
 * A animação existe para ser LIDA: acompanhar o caminho, ver em que nó a coisa
 * demorou, perceber onde quebrou. Na primeira versão o piso era de 45ms por nó
 * e a fita inteira passava em segundos — o olho não acompanha um salto a cada
 * 45ms, então a tela mostrava tudo e não comunicava nada.
 *
 * A proporção do tempo real é preservada (um nó de 12s continua durando mais na
 * tela que um de 12ms), mas dentro de uma janela: `stepMin` é o que dá para
 * enxergar, `stepMax` impede que um único nó lento trave a animação, e
 * `budgetMs` é o alvo para a parte proporcional. Em fluxos longos, `totalCapMs`
 * encolhe o piso até `stepFloorMs` em vez de deixar a reexecução durar minutos
 * — e a barra de status diz quando isso acontece.
 *
 * Calibragem do Kauan: mexer aqui é mexer em quão devagar o fluxo corre. */
const REPLAY = {
  stepMinMs: 300,      // piso por nó — abaixo disso não dá para acompanhar
  stepMaxMs: 1500,     // teto por nó — um nó de 30s não pode parar a tela
  budgetMs: 16000,     // alvo da parte proporcional ao tempo real
  totalCapMs: 42000,   // teto da reexecução inteira
  stepFloorMs: 170,    // piso do piso, quando o fluxo é longo demais
  holdMs: 620          // quanto o nó fica aceso antes de assentar em verde
};

/* O QUE ACONTECEU numa execução.
 *
 * "Rodou e deu certo" não responde a pergunta que se faz olhando o painel:
 * mandou mensagem pra quem? gravou o quê? chamou qual API? O n8n responde isso
 * mostrando o payload de cada nó — que aqui é conversa real de lead e NÃO
 * atravessa a fronteira do `n8n.js`.
 *
 * O que atravessa é a forma: quantos itens saíram do nó, os NOMES dos campos, e
 * se havia binário. Combinada com o tipo e a operação do nó, ela sustenta uma
 * frase factual — "gravou 1 linha com id, telefone, status", "produziu 1 áudio",
 * "chamou HTTP e recebeu 1 resposta" — sem mostrar um caractere do conteúdo.
 *
 * `external: true` marca o que sai do sistema: mensagem enviada, linha gravada,
 * chamada de API. É a distinção que importa quando algo deu errado, porque é o
 * que já não dá para desfazer. Nó de transformação (code, set, if) é degrau, não
 * efeito, e fica fora da lista curta por padrão.
 *
 * Sem regra que case, NÃO se inventa frase: o nó aparece como "executou", que é
 * o único fato disponível. */
const EFFECTS = [
  { re: /whatsApp|twilio|telegram|messageBird/i,      external: true,  verbo: "enviou mensagem" },
  { re: /slack/i,                                     external: true,  verbo: "postou no Slack" },
  { re: /gmail|sendEmail|emailSend/i,                 external: true,  verbo: "enviou e-mail" },
  { re: /elevenlabs/i,                                external: true,  verbo: "gerou áudio" },
  { re: /googleCalendar/i,                            external: true,  verbo: "mexeu na agenda" },
  { re: /googleSheets/i,                              external: true,  verbo: "escreveu na planilha" },
  { re: /clickUp|trello|notion|jira/i,                external: true,  verbo: "mexeu no CRM" },
  /* Nestes dois o verbo vem da OPERAÇÃO (create/get/update…), que é o que
     diferencia gravar de ler. `fb` é o que sobra quando o nó não declara
     operação nenhuma: sem ele a frase caía em "executou", que é justamente a
     palavra que não diz nada. */
  { re: /supabase|postgres|mysql|mongoDb|airtable/i,  external: true,  verbo: null, fb: "mexeu no banco" },
  { re: /redis/i,                                     external: true,  verbo: null, fb: "mexeu no Redis" },
  /* Ordem importa: `find` para na primeira que casar, e três tipos diferentes
     terminam em "webhook". Medido nesta instância: `respondToWebhook` caía na
     regra do httpRequest e virava "chamou uma API" — quando na verdade ele
     RESPONDE uma chamada. E o nó de gatilho `n8n-nodes-base.webhook` não é
     efeito nenhum: é a porta de entrada, e listá-lo como efeito externo
     inflaria a conta do que a execução causou lá fora. */
  { re: /respondToWebhook/i,                          external: true,  verbo: "respondeu a chamada" },
  { re: /\.webhook$|webhookTrigger/i,                 external: false, verbo: "recebeu uma chamada" },
  { re: /httpRequest/i,                               external: true,  verbo: "chamou uma API" },
  { re: /executeWorkflow|toolWorkflow/i,              external: false, verbo: "chamou um sub-fluxo" },
  { re: /lc\.agent|langchain\.agent/i,                external: false, verbo: "o agente pensou e respondeu" },
  { re: /openAi|lmChat/i,                             external: false, verbo: "chamou o modelo" },
  { re: /memoryBufferWindow|memoryRedisChat/i,        external: false, verbo: "leu a memória da conversa" },
  { re: /splitInBatches/i,                            external: false, verbo: "dividiu em lotes" },
  /* `stopAndError` é o único nó cujo sucesso É uma parada: sem regra própria ele
     cairia em "executou", que esconde que o fluxo foi interrompido de propósito. */
  { re: /stopAndError/i,                              external: false, verbo: "parou o fluxo de propósito" },
  { re: /wait/i,                                      external: false, verbo: "esperou" }
];

// A operação diz o verbo melhor que o tipo em banco de dados: create/get/update
// são coisas bem diferentes de contar depois que algo quebrou.
const OP_VERB = {
  create: "gravou", insert: "gravou", append: "acrescentou",
  update: "atualizou", upsert: "gravou/atualizou", delete: "apagou",
  get: "leu", getAll: "leu", search: "consultou", set: "gravou",
  send: "enviou", sendAndWait: "enviou e esperou", transcribe: "transcreveu áudio", analyze: "analisou imagem",
  // operações de Redis que aparecem de verdade nesta instância — sem elas o nó
  // caía em "executou", que não distingue empilhar de ler.
  push: "empilhou", pop: "desempilhou", incr: "incrementou", publish: "publicou"
};

/* O RESUMO EM PROSA — "o fluxo recebeu X, respondeu Y, gravou Z".
 *
 * A lista nó a nó responde "o que cada passo fez"; ela não responde "o que
 * aconteceu nesta execução", que é a pergunta de quem está passando o olho. Uma
 * fileira de "executou" é a pior versão disso: ocupa a tela inteira e não diz
 * nada. Aqui a execução vira uma frase, montada de fatos:
 *
 *   - o que ENTROU: o texto que chegou no gatilho, e de quem (contato já
 *     mascarado pelo servidor);
 *   - o que SAIU: o texto da mensagem enviada, quando houve envio;
 *   - o que MUDOU: os efeitos externos agrupados por verbo, com contagem.
 *
 * Nada é inferido além disso. Sem texto no gatilho não se escreve "recebeu";
 * sem nó de envio não se escreve "enviou". O silêncio é preferível ao palpite —
 * este painel existe para ser confiável, não para parecer inteligente. */
const RESUMO_TXT_CAP = 150;

function resumoExecucao(detail, byName) {
  const runs = (detail && detail.nodeRuns) || [];
  const blocos = [];
  const info = r => ({ r, node: byName.get(r.name) || null, ef: effectOf(byName.get(r.name) || null, r) });
  const linhas = runs.map(info);

  /* ENTRADA: o texto que chegou.
   *
   * Nem sempre está no gatilho. Medido no Iago: o webhook entrega
   * `message.text.body`, mas quando a mensagem é áudio esse campo vem vazio e o
   * texto só existe depois da transcrição, alguns nós adiante. Por isso a busca
   * é pelo PRIMEIRO texto que aparece antes de qualquer envio — o que chegou,
   * em oposição ao que saiu. Sem texto nenhum, não se escreve "recebeu". */
  const envio = /whatsApp|twilio|telegram|slack|gmail|sendEmail|messageBird/i;
  const idxEnvio = linhas.findIndex(l => l.node && envio.test(l.node.type));
  const antes = idxEnvio >= 0 ? linhas.slice(0, idxEnvio) : linhas;
  const chegou = antes.find(l => l.r.sample && l.r.sample.texto);
  if (chegou) {
    blocos.push({ tipo: "in", texto: chegou.r.sample.texto, quem: chegou.r.sample.quem || null });
  } else {
    // Sem texto, mas com binário: é áudio, imagem ou documento. Dizer isso é
    // melhor que ficar mudo — foi o caso da execução que o Kauan abriu, onde a
    // mensagem do lead era áudio e a tela não explicava o silêncio.
    const arquivo = antes.find(l => l.r.binary);
    if (arquivo) blocos.push({ tipo: "in", arquivo: true, nó: arquivo.r.name });
  }

  /* SAÍDA: nós de mensagem que rodaram.
   *
   * A saída de um nó de envio é a RESPOSTA da API (ts, channel, id), não o
   * texto. Há três origens possíveis, em ordem decrescente de confiança, e a
   * tela DIZ qual delas está mostrando:
   *
   *   `param`   — o servidor resolveu a expressão do parâmetro de texto do
   *               próprio nó contra o item que entrou nele. Isso é a mensagem,
   *               por construção; não precisa de ressalva.
   *   `saida`   — o texto veio na saída do nó (alguns serviços devolvem).
   *   `entrada` — nada disso existia, mas o item que ENTROU trazia texto. É
   *               fato verificável, não é a mensagem, e a linha diz isso.
   *
   * O alimentador vem de `src` (a aresta gravada pelo n8n), nunca do vizinho na
   * ordem de execução — num laço com `Wait` os dois são nós diferentes. */
  linhas.forEach(l => {
    if (!l.node || !envio.test(l.node.type)) return;
    const s = l.r.sample || {};
    const ali = alimentador(l.r, linhas);
    const aliS = (ali && ali.r.sample) || {};
    const direto = l.r.enviado || s.texto || null;
    blocos.push({
      tipo: "out", nó: l.r.name,
      texto: direto,
      origem: l.r.enviado ? "param" : (s.texto ? "saida" : null),
      entrada: direto ? null : (aliS.texto || null),
      entradaNó: ali ? ali.r.name : null,
      quem: s.quem || aliS.quem || null,
      itens: l.r.items
    });
  });

  // MUDANÇAS: efeitos externos agrupados por verbo, para virarem contagem em vez
  // de uma linha por nó.
  const contagem = new Map();
  for (const l of linhas) {
    if (!l.ef || !l.ef.external) continue;
    if (l.node && envio.test(l.node.type)) continue;      // já contado como saída
    contagem.set(l.ef.verbo, (contagem.get(l.ef.verbo) || 0) + 1);
  }
  if (contagem.size) {
    blocos.push({
      tipo: "mudou",
      partes: [...contagem.entries()].sort((a, b) => b[1] - a[1]).map(([v, n]) => n + "× " + v)
    });
  }

  // Quem é o lead. Nome e contato vêm nomeados do servidor — a versão anterior
  // adivinhava o nome com um regex sobre o texto da mensagem, o que acertava por
  // sorte e errava em silêncio.
  const quem = linhas.map(l => l.r.sample && l.r.sample.quem).find(Boolean) || null;
  /* O nome do lead: primeiro os campos que só existem para pessoa, e entre eles
     o mais completo — o WhatsApp entrega o apelido do perfil ("Ana") e o CRM
     entrega o cadastro ("Ana Carolina Ribeiro Souza"). Só se não houver
     nenhum é que entra o `name` genérico, que na prática costuma ser o nome do
     evento ou do produto e por isso vem separado do servidor. */
  const fortes = linhas.map(l => l.r.sample && l.r.sample.nome).filter(Boolean).sort((a, b) => b.length - a.length);
  const nome = fortes[0] || linhas.map(l => l.r.sample && l.r.sample.nomeFraco).find(Boolean) || null;

  return { blocos, quem, nome, cortado: linhas.length };
}

/* Quem alimentou esta run. `src` vem do n8n (`task.source`) e nomeia nó, run e
 * porta — é a aresta. A versão anterior usava `linhas[i - 1]`, o vizinho na
 * ORDEM DE EXECUÇÃO, que num laço com `Wait` é outro nó: medido, a run 1 do nó
 * `msg` é alimentada pela run 1 do `tipo_envio`, que na ordem está longe dali.
 *
 * Sem `src` — detalhe vindo de um cache anterior a esta versão — volta ao
 * vizinho. Continua sendo o palpite antigo, mas só nesse caso e só até o cache
 * virar; inventar silêncio no lugar seria perder informação que já funcionava
 * nos fluxos lineares. */
function alimentador(run, linhas) {
  const s = run.src;
  if (!s) {
    const i = linhas.findIndex(l => l.r === run);
    return i > 0 ? linhas[i - 1] : null;
  }
  const runsDoNo = linhas.filter(l => l.r.name === s.no);
  return runsDoNo[s.run] || runsDoNo[0] || null;
}

function effectOf(node, run) {
  const tipo = String((node && node.type) || "");
  const op = String((node && node.sub) || "").split(":")[0].trim();
  const regra = EFFECTS.find(r => r.re.test(tipo));
  const verboOp = OP_VERB[op] || null;
  if (!regra && !verboOp) return null;
  // Ordem: verbo fixo da regra, senão o da operação, senão o de reserva da
  // regra. "Executou" não é opção — um verbo que serve para tudo não informa
  // nada, e era exatamente o que enchia a tela.
  const verbo = (regra && regra.verbo) || verboOp || (regra && regra.fb) || null;
  if (!verbo) return null;
  return {
    external: regra ? regra.external : true,
    verbo,
    // Quantidade só entra na frase quando é fato (o n8n não reporta itens de
    // todo nó) e quando muda o sentido: "gravou 3 linhas" é diferente de
    // "gravou 1 linha", e "0 itens" é o caso que costuma explicar o bug.
    quanto: run && run.items != null ? run.items : null,
    campos: (run && run.keys) || [],
    binario: !!(run && run.binary)
  };
}

/* Nomes que são rascunho, não operação.
 *
 * Isto ROTULA a lista colapsada e, desde 2026-08-10, também FILTRA a porta de
 * entrada — mas só o que nunca rodou (ver `naPorta`). Uma cópia de teste parada
 * e ativa é ruído; uma cópia de teste que rodou e quebrou é informação, e
 * esconder falha por causa do nome seria a pior troca possível.
 *
 * `\(tester\)` entrou porque `[ROBERTO] Agent — Iago Comercial (TESTER)` estava
 * na porta de entrada com 0 execuções, só por estar `active`. Medido na
 * instância: o regex novo pega 25 fluxos (7 a mais que o antigo) e NENHUM deles
 * tem execução na janela — em particular ele não pega `Agente Iago Comercial`,
 * o fluxo de verdade, com 87. Ao mexer aqui, refaça essa contagem: um falso
 * positivo aqui apaga um fluxo de produção da tela. */
const SCRATCH = /^(my workflow|my sub-workflow|teste|sandbox)|\((?:descartavel|apagar|tester|teste|test)\)|^\[sf-test\]|^\[test-runner\]|^\[sandbox|^\{branch\}/i;

/* QUEM APARECE NA PORTA DE ENTRADA.
 *
 * A regra era "executou na janela OU está ativo". Ela tem um furo estrutural: um
 * sub-fluxo chamado por `executeWorkflow` NUNCA pode estar `active` no n8n —
 * quem acorda é o pai. Então `Agente eContrate`, 108 nós, produção, ficava na
 * lista colapsada por estar quieto nas últimas 24h, enquanto o pai que o chama
 * (`WhatsApp API Oficial`, 645 execuções) estava no topo do quadro.
 *
 * O terceiro critério conserta isso sem lista fixa de ids: **é chamado por um
 * fluxo vivo**. Vivo = ativo ou com execução na janela. Medido: entram 3 fluxos
 * (eContrate e dois Tools do Iago), não 40.
 *
 * `f.calledByLive` chega vazio até `/api/n8n/callers` responder — 20s na
 * primeira vez, cache de 15 min depois. Enquanto isso a tela mostra o que já
 * sabe e diz que ainda está lendo, em vez de afirmar uma lista completa. */
function naPorta(f) {
  const rodou = f.total > 0;
  if (SCRATCH.test(f.name) && !rodou) return false;
  return rodou || f.active || (f.calledByLive && f.calledByLive.length > 0);
}

/* ---------------------------------------------------- favorito e removido
 *
 * Preferência de VISÃO, não fato: qual card fica fixo em cima (estrela) e qual
 * sai do quadro (remover). Por isso mora aqui no bloco de julgamento e persiste
 * no localStorage do browser — o servidor continua emitindo só fatos, e uma
 * preferência de tela não tem por que virar rota.
 *
 * A regra do removido é a MESMA disciplina do fixState: o discriminador é o id
 * de execução, monotônico e vindo da instância, comparado como BigInt — nunca o
 * relógio. Ao remover, guarda-se o maior id que aquele fluxo tinha; quando um
 * id MAIOR aparecer, o card volta sozinho e a marca é apagada. Um fluxo com
 * zero execuções guarda "0", então a primeira execução da vida dele também o
 * traz de volta. Remover não é arquivar: é "me chama quando isto acordar".
 *
 * Favorito e removido são mutuamente exclusivos — estrelar tira da lista de
 * removidos e remover apaga a estrela. Os dois ao mesmo tempo não significam
 * nada, e um card fixo que não aparece seria o pior estado possível. */
const PREFS_KEY = "cockpit.flows.prefs.v1";

function loadPrefs() {
  try {
    const j = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
    return j && typeof j === "object" && !Array.isArray(j) ? j : {};
  } catch { return {}; }
}
function savePrefs(p) {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch { /* modo privado */ }
}

function newestExecIdOf(f) {
  let max = null;
  for (const r of f.runs || []) {
    try { const v = BigInt(r.id); if (max == null || v > max) max = v; } catch { /* id não numérico */ }
  }
  return max;
}

/* Lê a preferência E resolve o retorno automático num lugar só. Devolve
 * { fav, hidden } já com a marca vencida apagada — quem chama nunca vê um
 * removido que deveria ter voltado. */
function cardPref(f) {
  const p = S.prefs[f.id];
  if (!p) return { fav: false, hidden: false };
  if (p.hideAfter != null) {
    const newest = newestExecIdOf(f);
    let voltou = false;
    try { voltou = newest != null && newest > BigInt(p.hideAfter); } catch { voltou = true; }
    if (voltou) { delete S.prefs[f.id]; savePrefs(S.prefs); return { fav: false, hidden: false }; }
  }
  return { fav: p.fav === true, hidden: p.hideAfter != null };
}

function toggleFav(f) {
  const era = S.prefs[f.id] && S.prefs[f.id].fav === true;
  if (era) delete S.prefs[f.id];
  else S.prefs[f.id] = { fav: true };            // apaga hideAfter junto, de propósito
  savePrefs(S.prefs);
  renderAll();
}
function hideCard(f) {
  const newest = newestExecIdOf(f);
  S.prefs[f.id] = { hideAfter: newest == null ? "0" : String(newest) };
  savePrefs(S.prefs);
  renderAll();
}
function unhideCard(id) {
  delete S.prefs[id];
  savePrefs(S.prefs);
  renderAll();
}

/* FILTRO DO AO VIVO — julgamento, não fato.
 *
 * Três filtros e só três: deu certo, deu erro, e um fluxo. Deliberadamente sem
 * "rodando" (esta instância vive com 0 — execuções terminam em 60–600ms) e sem
 * "lento" (`BANDS.slowMs` é 30s, então o chip mostraria 0 quase sempre, e um
 * filtro que nunca acende ensina a ignorar a faixa inteira).
 *
 * NÃO persiste. `cardPref` mora em localStorage porque "removi este cartão" é
 * uma decisão sobre um fluxo; "estou olhando só as falhas" é o que se está
 * fazendo agora. Guardado, um `só deu erro` de ontem esconderia calado o resto
 * do painel amanhã — e o custo de refazer é um clique. */
function passaFiltro(e) {
  const f = S.feedFilter;
  if (f.status === "error" && e.status !== "error") return false;
  if (f.status === "ok" && e.status !== "success") return false;
  if (f.wf && e.workflowId !== f.wf) return false;
  return true;
}
const filtroAtivo = () => (S.feedFilter.status ? 1 : 0) + (S.feedFilter.wf ? 1 : 0);

/* As contagens dos chips são de FACETA, sobre a janela inteira — nunca sobre o
 * resultado já filtrado. Contando o resultado, todo chip não selecionado
 * mostraria 0 e o número perderia a única função que tem, que é avisar antes do
 * clique que existe falha ali. `base` são as execuções da janela depois do
 * filtro de PROJETO (o trilho), porque esse é o universo que a lista promete. */
function contagensFeed(base) {
  const c = { total: base.length, ok: 0, erro: 0 };
  for (const e of base) {
    if (e.status === "error") c.erro++;
    else if (e.status === "success") c.ok++;
  }
  return c;
}

/* Falha que o filtro está escondendo AGORA. Filtrar por um fluxo é pedir foco,
 * não é pedir para ficar cego: com `Agente Iago` selecionado, uma falha do
 * `WhatsApp API Oficial` sumiria sem deixar rastro, e o painel estaria
 * escondendo exatamente o que ele existe para mostrar. É um fato do presente
 * (quantas falhas da janela estão fora do filtro), não um contador de novidade:
 * o SSE redesenha a faixa toda hora e um "+2 novas" precisaria de estado que
 * sobrevivesse ao repaint para não mentir. */
function falhasEscondidas(base) {
  if (!filtroAtivo()) return 0;
  return base.filter(e => e.status === "error" && !passaFiltro(e)).length;
}

/* Por que este fluxo está no quadro, quando não é por atividade própria. */
function motivoPorta(f) {
  if (f.total > 0 || f.active) return null;
  const p = (f.calledByLive || [])[0];
  return p ? "chamado por " + p.name : null;
}

// Convenção de nome do n8n: "[PROJETO] Tipo — Descrição".
function projectOf(name) {
  const m = String(name).match(/^\s*[\[\{]([^\]\}]+)[\]\}]/);
  if (m) return m[1].trim().toUpperCase();
  return "SEM PREFIXO";
}
function shortName(name) {
  return String(name).replace(/^\s*[\[\{][^\]\}]+[\]\}]\s*/, "").trim() || String(name);
}

function classify(f) {
  if (f.total === 0) return f.active ? "cold" : "cold";
  if (f.errors >= BANDS.errCountRisk || f.errRate > BANDS.errRateRisk) return "risk";
  if (f.errors > 0 || f.errRate > BANDS.errRateWarn) return "warn";
  if (f.active && f.minsSinceLast != null && f.minsSinceLast > BANDS.staleMin) return "cold";
  return "ok";
}

/* "falharam no nó X" é falso quando X pertence a um sub-fluxo: o cartão do pai
 * dizia "6 de 410 falharam no nó Convert text to speech" e esse nó não existe
 * naquele fluxo. Quem for procurar não acha. O rótulo carrega a origem. */
function errNodeLabel(f, prefix, parens) {
  if (!f.topErrorNode) return "";
  const o = f.topErrorOrigin;
  const home = o && o.state === "subflow" ? ", do sub-fluxo " + shortName(o.childName) : "";
  return parens ? " (nó " + f.topErrorNode + home + ")" : prefix + f.topErrorNode + home;
}

// Uma frase que diz o que fazer, não só que algo está errado.
function diagnose(f) {
  const n = v => v.toLocaleString("pt-BR");
  if (f.total === 0) {
    // Sub-fluxo não tem gatilho próprio para estar mudo: ele roda quando o pai
    // manda. "Gatilho pode estar mudo" aqui mandaria investigar o lugar errado.
    const pai = (f.calledByLive || [])[0];
    if (pai && !f.active) {
      return "Sub-fluxo de " + pai.name + ". Não foi chamado nas últimas " + WINDOW_H +
        "h — quem dispara é o fluxo que chama, então olhe lá primeiro.";
    }
    return f.active
      ? "Ativo, mas nenhuma execução nas últimas " + WINDOW_H + "h. Gatilho pode estar mudo."
      : "Desativado e sem execuções na janela.";
  }
  if (f.errors >= BANDS.errCountRisk || f.errRate > BANDS.errRateRisk) {
    const node = errNodeLabel(f, " no nó ");
    return n(f.errors) + " de " + n(f.total) + " execuções falharam" + node + " — " + pct(f.errRate) + " de erro. Investigar agora.";
  }
  if (f.errors > 0) {
    const node = errNodeLabel(f, " no nó ", true);
    return n(f.errors) + " falha" + (f.errors > 1 ? "s" : "") + " em " + n(f.total) + " execuções" + node + ". Ainda tolerável, mas olhar.";
  }
  if (f.active && f.minsSinceLast != null && f.minsSinceLast > BANDS.staleMin) {
    return "Sem falhas, mas parado há " + agoShort(f.minsSinceLast * 60000) + ". Confirmar se deveria estar rodando.";
  }
  if (f.p95 != null && f.p95 > BANDS.slowMs) {
    return n(f.total) + " execuções, zero falhas. p95 de " + dur(f.p95) + " — lento, mas saudável.";
  }
  return n(f.total) + " execuções, zero falhas. Rodando limpo.";
}

// Sticky notes são anotação do editor, não etapa executável: nunca aparecem em
// runData e esticam o bounding box para o nada.
const isAnnotation = t => /stickyNote/i.test(String(t));

// Assinatura de erro no MESMO formato do superflow — `workflowId|node|errorType`
// — para o dedup dos dois lados casar sem tradução.
//
// O n8n NÃO preenche `error.node` em todo erro: ExpressionError e erro
// propagado de sub-workflow vêm sem nó. Nesses casos o nó certo é
// `lastNodeExecuted`. Sem esse fallback a assinatura sai "wf||", não agrupa
// nada, e um caso real some do quadro — foi como `criar_vacuo1` passou batido.
const errorNodeOf = e => e.error?.nodeName || e.lastNode || "?";
const errorTypeOf = e => e.error?.type || "Error";
function errorKey(e) {
  return [e.workflowId, errorNodeOf(e), errorTypeOf(e)].join("|");
}

// "Correção feita" NUNCA apaga uma assinatura — ela vale só até a falha
// reincidir. O discriminador é o id de execução, não o relógio: ids do n8n são
// monotônicos, enquanto `markedAt` sai do relógio desta máquina. Comparar
// timestamps de fontes diferentes esconderia uma falha nova por skew, ou
// reabriria uma correção boa sem motivo.
const execIdNum = v => { const s = String(v == null ? "" : v).replace(/\D/g, ""); return s ? BigInt(s) : 0n; };
function fixState(g, fix) {
  if (!fix) return null;
  const marked = execIdNum(fix.maxExecIdAtFix);
  const newest = g.samples.reduce((m, s) => { const n = execIdNum(s.id); return n > m ? n : m; }, 0n);
  return newest > marked ? "reopened" : "resolved";
}

/* De quem é o nó da assinatura.
 *
 * O n8n reporta a falha de um sub-workflow NO PAI. O quadro mostrava
 * "WhatsApp API Oficial · Convert text to speech" como se um pertencesse ao
 * outro — e aquele nó não existe naquele fluxo. Quem abre o editor procurando
 * por ele não acha, e a partir daí o painel inteiro perde a confiança.
 *
 * A localização em si é fato e vem do servidor (`/api/n8n/locate`). O que se
 * decide aqui é o que fazer com ela — e a decisão é: enquanto não souber, não
 * afirmar nada. `unknown` renderiza igual ao caso local, sem inventar ressalva
 * que talvez não exista. */
function nodeOrigin(g) {
  return originOf(g.d.workflowId, errorNodeOf(g.d), g.d.lastNode);
}

function originOf(wfId, node, lastNode) {
  const loc = S.locate.get(locKey(wfId, node));
  if (!loc) return { state: "unknown", node };
  if (loc.inWorkflow) return { state: "local", node };
  const hits = (loc.subflows || []).filter(s => s.hasNode);
  if (!hits.length) return { state: "elsewhere", node, scanned: (loc.subflows || []).length };

  // Desempate por evidência, não por ordem. Medido nesta instância: o nó
  // `Convert text to speech` existe em DOIS filhos — `Agente Iago Comercial` e
  // `Agente eContrate`. Pegar o primeiro da lista apontaria para o fluxo errado
  // metade das vezes, que é a mesma classe de erro que este trabalho veio
  // consertar. O `lastNodeExecuted` é quem estava chamando quando quebrou:
  // é evidência, não palpite. Sem ele, o cartão admite a dúvida.
  const byEvidence = hits.find(s => s.viaNode === lastNode);
  const pick = byEvidence || hits[0];
  return {
    state: "subflow", node,
    childId: pick.childId, childName: pick.childName || pick.childId, viaNode: pick.viaNode,
    certain: !!byEvidence || hits.length === 1,
    ambiguous: !byEvidence && hits.length > 1 ? hits.map(s => s.childName || s.childId) : null
  };
}

// Assinatura SEM o fluxo: `node|type`. É por ela que "algo parecido" casa entre
// fluxos diferentes. Não é frouxidão — o n8n reporta a falha de um sub-fluxo no
// pai E no filho com o mesmo nó e mensagem, então `memoria_redis_roberto` em
// dois fluxos é literalmente o mesmo defeito, e a nota de um serve para o outro.
const similarKey = k => String(k).split("|").slice(1).join("|");

// Sugestão HEURÍSTICA por padrão de mensagem — não é diagnóstico. Semeada com os
// erros que esta instância realmente produz; o primeiro padrão que casa ganha.
// Sem padrão casado NÃO tem sugestão: um palpite vago custaria a confiança que é
// o ponto inteiro deste painel. Nota do Kauan sempre vence a sugestão daqui.
const SUGGESTIONS = [
  { re: /you must specify an input key or pass only 1 key as input/i,
    tip: "O nó Redis recebeu um item com mais de um campo e não sabe qual gravar. Fixe o campo em Key/Value ou reduza o item a uma chave só (Set antes do Redis)." },
  { re: /invalid_auth/i,
    tip: "Token do Slack inválido ou revogado — é credencial, não nó. Reautorize a credencial no n8n; mexer no nó não resolve." },
  { re: /required.+JSON field 'text'|missing\s*:\s*'body'/i,
    tip: "A mensagem saiu sem corpo. A Cloud API exige `text.body` não vazio, então provavelmente o agente devolveu string vazia ou null. Trate resposta vazia antes do envio." },
  { re: /convert text to speech|elevenlabs|text-to-speech/i,
    tip: "TTS recusou os parâmetros. Confira primeiro se o texto de entrada chegou vazio — é a causa mais comum; depois voice id e limite de caracteres." },
  { re: /quota|rate.?limit|too many requests|status code 429/i,
    tip: "Estouro de limite do provedor. Precisa de retry com espera (backoff) ou espaçar as chamadas — repetir na hora vai falhar igual." },
  { re: /status code 401|status code 403|unauthorized|forbidden|invalid.?token|expired/i,
    tip: "Credencial recusada (401/403). Reautorize a credencial deste nó e confira o escopo; não é bug de lógica." },
  { re: /ECONNREFUSED|ETIMEDOUT|socket hang up|network|timeout/i,
    tip: "O serviço não respondeu. Confirme se está de pé e adicione retry no nó — falha de rede volta sozinha, falha de host não." },
  { re: /Cannot read propert|is not defined|undefined.+expression|ExpressionError/i,
    tip: "A expressão aponta para um campo que não veio. Veja a saída do nó anterior e proteja o acesso (`?.` / valor padrão) em vez de assumir que o campo existe." },
  { re: /google.?calendar|gcal/i,
    tip: "Chamada ao Google Calendar recusada. Confira id do calendário e se a credencial OAuth ainda tem o escopo de calendário." }
];
function suggestFor(d) {
  const hay = [d.error?.message, d.error?.description, d.error?.type, d.error?.nodeName, d.lastNode].filter(Boolean).join(" \n ");
  return (SUGGESTIONS.find(s => s.re.test(hay)) || {}).tip || null;
}

/* HANDOFF — o roteiro da tela do "Mandar pro Claude".
 *
 * Cada etapa corresponde a trabalho que de fato acontece. As duas primeiras do
 * meio disparam GET reais em `/api/n8n/graph/:id` e `/api/n8n/execution/:id`
 * (as mesmas rotas whitelistadas do palco — o `n8n.js` NÃO é alargado para
 * enriquecer esta tela). As três últimas rodam o Claude Code local de verdade:
 * `POST /api/claude/fix` cria a sessão headless, o SSE mostra o que ele está
 * lendo e escrevendo linha por linha, e as portas de validação são código
 * determinístico, não opinião de modelo. Nenhuma etapa é temporizador.
 *
 * A etapa que NÃO existe continua não existindo: não há "Claude aplicou a
 * correção". Ele propõe, o cockpit valida, e a escrita no n8n só acontece no
 * clique de aprovar em cima do diff. Animar uma aplicação que ainda não
 * aconteceu deixaria o Kauan abrir o n8n e achar o nó intacto — a mesma classe
 * de mentira do relógio vivo sobre dado velho. */
const HANDOFF = [
  { id: "sig",    nm: "Assinatura da falha",            sub: "do que já está em memória" },
  { id: "graph",  nm: "Lendo o desenho do fluxo",       sub: "GET /api/n8n/graph" },
  { id: "node",   nm: "Localizando o nó que quebrou",   sub: "error.node · lastNodeExecuted" },
  { id: "exec",   nm: "Relendo a execução que falhou",  sub: "GET /api/n8n/execution" },
  { id: "diag",   nm: "Montando o diagnóstico",         sub: "histórico + heurística" },
  { id: "claude", nm: "Claude corrigindo o workflow",   sub: "Claude Code local, sem rede" },
  { id: "gates",  nm: "Rodando as portas de validação", sub: "reprovou, volta pro Claude" },
  { id: "review", nm: "Proposta pronta para revisão",   sub: "diff · aprovar ou rejeitar" }
];

// O servidor tem os seus próprios nomes de etapa (ele conhece rodada e sandbox,
// que aqui viram a mesma linha). A tradução mora no bloco de juízo porque é
// decisão de apresentação, não de protocolo.
const STAGE_MAP = { fetch: "claude", claude: "claude", retry: "claude", gates: "gates", sandbox: "gates", review: "review" };

// As frases que fecham a tela. Ficam aqui, no bloco de juízo, porque são decisão
// de produto — não copy de render.
const HANDOFF_TRUTH = "O Claude propõe, você aplica. O cockpit rodou o Claude Code nesta máquina, "
  + "validou a proposta em portas determinísticas e parou aqui: nenhum nó foi tocado no n8n. "
  + "Aprovar escreve o diff acima no fluxo real, e só ele.";

const APPLY_TRUTH = "Aplicado. O estado anterior está guardado — Desfazer devolve o fluxo exatamente "
  + "como estava. O n8n não recarrega execução em andamento, então a próxima execução é a primeira "
  + "que roda com a correção.";

// Aplicar não prova que a falha sumiu. Prova que o fluxo mudou.
// A marca de "correção feita" passou a ser automática no aplicar (decisão do
// Kauan, 2026-08-06), e isso NÃO enfraquece a frase: `fixState()` reabre a
// assinatura sozinha assim que aparece uma execução errada com id maior que o
// gravado. Marcar cedo é seguro exatamente por causa desse mecanismo — o que
// seria mentira é a tela dizer "resolvido", e ela não diz.
const APPLY_CAVEAT = "Isto não é prova de que a falha acabou — é uma mudança aplicada. "
  + "A assinatura fica marcada como corrigida e volta sozinha para o quadro se falhar de novo.";

const APPLY_DONE_TITLE = "Alteração concluída";
const APPLY_MARK_OK = "Assinatura marcada como \"correção feita\", com a explicação do Claude anexada. "
  + "Se a mesma falha acontecer outra vez, ela reabre sozinha no quadro.";
const APPLY_MARK_FAIL = "A alteração foi aplicada no n8n, mas não consegui marcar a assinatura como corrigida: ";

/* REEXECUÇÃO — corrigir o nó não responde o lead que ficou esperando.
 *
 * Aplicar muda o fluxo dali para a frente; a execução que travou continua
 * travada, e o lead dela continua sem resposta. Reexecutar é o que fecha isso.
 *
 * FATO, lido no `execution.service.ts` do n8n e não medido na instância (medir
 * custaria uma mensagem real): o retry RETOMA do nó que falhou. O n8n preserva
 * o `nodeExecutionStack` e o `runData` anterior e só descarta o do nó que
 * quebrou. Então o que já rodou não roda de novo — as bolhas que já foram não
 * repetem — e o que faltava roda pela primeira vez.
 *
 * O QUE SOBRA, e é o que esta seção decide: o nó que falhou reexecuta. Se ele
 * falhou DEPOIS de já ter causado efeito, aquele efeito duplica. Um `text.body`
 * vazio é recusado antes de sair, então nada saiu; um timeout é a resposta que
 * não voltou, e a mensagem pode ter saído.
 *
 * A diferença entre os dois não é estilo de tela — ela decide se reexecutar
 * entra junto no clique de aprovar ou fica num botão separado com aviso. */
const REEXEC_AMBIGUO = [
  { re: /ECONNREFUSED|ETIMEDOUT|socket hang up|timeout|network/i,
    por: "a conexão caiu esperando a resposta — o pedido pode ter chegado do outro lado" },
  { re: /quota|rate.?limit|too many requests|status code 429/i,
    por: "o provedor limitou, e parte do lote pode ter passado antes do corte" },
  { re: /status code 5\d\d|internal server error|bad gateway|service unavailable/i,
    por: "erro do lado do servidor depois do pedido sair — ele pode ter sido processado" }
];

/* ┌─ CALIBRAÇÃO DO KAUAN ────────────────────────────────────────────────────┐
   │ Esta lista é o que eu consigo afirmar com segurança: erro de DADO, onde o │
   │ nó recusa antes de qualquer coisa sair. Quem sabe quais outros erros      │
   │ desta instância são "saiu-mas-não-respondeu" é você, não eu.              │
   │                                                                          │
   │ Acrescente aqui os padrões que você já viu e sabe que não chegaram a      │
   │ mandar nada. Cada entrada que você adicionar move um caso de "botão       │
   │ separado com aviso" para "roda junto com o aprovar", ou seja, move o lead │
   │ de esperar você chegar no computador para ser respondido na hora.         │
   │                                                                          │
   │ O custo de errar para cada lado NÃO é simétrico, e é por isso que o       │
   │ default é ambíguo: um erro aqui manda mensagem repetida para um cliente,  │
   │ um erro para o outro lado só faz você clicar mais uma vez.                │
   └──────────────────────────────────────────────────────────────────────────┘ */
const REEXEC_LIMPO = [
  /required.+JSON field 'text'|missing\s*:\s*'body'/i,   // Cloud API recusa corpo vazio antes de enviar
  /Cannot read propert|is not defined|ExpressionError/i, // expressão quebrou montando o payload
  /you must specify an input key/i                       // Redis recusou o item, nada gravado
  // TODO Kauan: os seus. Ex.: /voice id/i, /invalid character/i …
];

/* Fail-closed de propósito: só é "limpo" o que casa explicitamente em
   REEXEC_LIMPO. Sem padrão casado a resposta é `ambiguo`, nunca `limpo` — a
   mesma regra que `suggestFor` já segue ao não chutar sugestão. */
function reexecClasse(d) {
  const hay = [d?.error?.message, d?.error?.description, d?.error?.type, d?.error?.nodeName, d?.lastNode]
    .filter(Boolean).join(" \n ");
  const sujo = REEXEC_AMBIGUO.find(s => s.re.test(hay));
  if (sujo) return { classe: "ambiguo", por: sujo.por };
  if (REEXEC_LIMPO.some(re => re.test(hay))) return { classe: "limpo", por: null };
  return { classe: "ambiguo", por: "não reconheci este erro, e não sei dizer se algo chegou a sair" };
}

const REEXEC_LIMPO_TXT = "O nó recusou antes de mandar qualquer coisa, então reexecutar não repete "
  + "nada — retoma do nó que falhou e segue daí. É o que responde o lead que ficou esperando.";
const REEXEC_AMBIGUO_TXT = "Reexecutar pode repetir o envio deste nó: ";
const REEXEC_ESCOPO = "Reexecuta só esta execução. Se a mesma falha pegou vários leads, cada "
  + "execução é um lead e as outras continuam paradas.";
const REEXEC_SEM_DESFAZER = "Não tem desfazer: o que sair, saiu.";

/* ================================================= fim do bloco de juízo === */

const WINDOW_H = 24;
const STATIC_MODE = new URLSearchParams(location.search).has("static");
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const pct = r => (r * 100).toFixed(r < 0.1 && r > 0 ? 1 : 0).replace(".", ",") + "%";

/* A lupa é DESENHADA, nunca um glifo. Medido na captura: `⌕` (U+2315) sai como
 * uma bolinha vazia nesta fonte, do mesmo jeito que `📎` e `🗀` saíram como
 * caixa no Tester. Mesmo dialeto dos ícones da nav e do palco: viewBox 24,
 * stroke 1.9, ponta arredondada, `currentColor`. */
function lupaSvg(tam) {
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", tam || 14); s.setAttribute("height", tam || 14);
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.9"); s.setAttribute("stroke-linecap", "round");
  s.setAttribute("aria-hidden", "true");
  s.style.flex = "0 0 auto"; s.style.color = "var(--txt-faint)";
  const c = document.createElementNS(ns, "circle");
  c.setAttribute("cx", "10.5"); c.setAttribute("cy", "10.5"); c.setAttribute("r", "6.5");
  const l = document.createElementNS(ns, "line");
  l.setAttribute("x1", "15.4"); l.setAttribute("y1", "15.4"); l.setAttribute("x2", "20"); l.setAttribute("y2", "20");
  s.append(c, l);
  return s;
}
const dur = ms => ms == null ? "—" : ms < 1000 ? ms + "ms" : ms < 60000 ? (ms / 1000).toFixed(1).replace(".", ",") + "s" : Math.round(ms / 60000) + "min";
function agoShort(ms) {
  if (ms == null) return "—";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.round(s / 60); if (m < 60) return m + "min";
  const h = Math.round(m / 60); if (h < 48) return h + "h";
  return Math.round(h / 24) + "d";
}
/* Chave composta a prova de concatenacao. A primeira versao montava
 *  na mao em dois lugares, e um dos dois acabou com um
 * byte de controle invisivel no lugar do separador: as chaves nunca batiam, o
 *  devolvia undefined e o cartao seguia atribuindo o no ao fluxo errado
 * sem erro nenhum no console. JSON.stringify de um par nao tem esse problema e
 * ainda e imune a nome de no que contenha o separador. */
const locKey = (wfId, node) => JSON.stringify([String(wfId), String(node)]);

const hhmm = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
// A linha de status trunca com ellipsis; o title preserva o texto inteiro.
/* A cauda sensível é separada de propósito: a mensagem de erro crua do n8n
   pode embutir telefone ou e-mail do lead, então no modo gravação ela é
   borrada — e ela fica FORA do `title`, porque tooltip abre no hover e um
   borrão que abre no hover não protege filmagem nenhuma. */
const setStep = (txt, sensTail) => {
  const n = $("#stage-step");
  if (sensTail == null) { n.textContent = txt; n.title = txt; return; }
  n.textContent = "";
  n.append(txt, el("span", "sens", sensTail));
  n.title = txt + "…";
};

/* Cartões, itens do trilho e linhas do feed são `div` com `onclick` — medido:
 * 0 de 14 cartões, 0 de 5 itens do trilho e 0 de 200 linhas alcançáveis por
 * teclado, ou seja o painel inteiro só funcionava com mouse. Isto dá a eles o
 * papel, a ordem de tabulação e o Enter/Espaço que um `<button>` traria de
 * graça, sem reescrever a marcação nem perder o layout em grid. */
function clickable(node, label, onActivate) {
  node.tabIndex = 0;
  node.setAttribute("role", "button");
  if (label) node.setAttribute("aria-label", label);
  node.onclick = onActivate;
  node.onkeydown = ev => {
    if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
    ev.preventDefault();        // Espaço rolaria a página
    onActivate(ev);
  };
}

const S = {
  workflows: new Map(),
  execs: new Map(),
  details: new Map(),
  fixes: new Map(),
  history: [],
  locate: new Map(),      // locKey(wfId, no) -> resposta de /api/n8n/locate (fato: onde o no vive)
  callers: null,          // /api/n8n/callers — grafo de chamada (fato). null = ainda não lido
  callersErro: null,      // por que não deu para ler — nunca silencioso
  fixesError: null,      // por que a leitura das marcas falhou — nunca silenciosa
  errFilterWf: null,      // filtro do quadro de erros — separado do fluxo no palco
  // Filtro do Ao vivo. Fora de localStorage de propósito — ver passaFiltro().
  feedFilter: { status: null, wf: null },
  fetchedAt: null, lastPoll: null, instance: "", lastError: null,
  selectedProject: null, selectedWf: null, loadedExec: null,
  selectedExec: null,     // id da execução que está no palco — marca a linha no Ao vivo
  prefs: loadPrefs(),     // favorito/removido por fluxo — julgamento de tela, ver cardPref()
  graph: null, view: null
};

/* ------------------------------------------------------------------- derive */

function windowFloor() { return Date.now() - WINDOW_H * 3600 * 1000; }

function flowsWithActivity() {
  const floor = windowFloor();
  const byWf = new Map();
  for (const e of S.execs.values()) {
    if (!e.workflowId || !e.startedAt) continue;
    if (new Date(e.startedAt).getTime() < floor) continue;
    if (!byWf.has(e.workflowId)) byWf.set(e.workflowId, []);
    byWf.get(e.workflowId).push(e);
  }

  const out = [];
  for (const wf of S.workflows.values()) {
    const runs = (byWf.get(wf.id) || []).sort((a, b) => Number(b.id) - Number(a.id));
    const errs = runs.filter(r => r.status === "error");
    const durs = runs.map(r => r.ms).filter(v => typeof v === "number").sort((a, b) => a - b);
    const last = runs[0] || null;

    // nó que mais falha neste fluxo, vindo do detalhe real da execução
    const nodeTally = new Map();
    for (const r of errs) {
      const d = S.details.get(r.id);
      const nn = d?.error?.nodeName;
      if (nn) nodeTally.set(nn, (nodeTally.get(nn) || 0) + 1);
    }
    const topErrorNode = [...nodeTally.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || null;
    // De onde esse nó é. O último nó executado da falha mais recente desempata
    // quando dois sub-fluxos têm um nó de mesmo nome.
    const topErrLast = topErrorNode
      ? (errs.map(r => S.details.get(r.id)).find(d => d?.error?.nodeName === topErrorNode) || {}).lastNode
      : null;
    const topErrorOrigin = topErrorNode ? originOf(wf.id, topErrorNode, topErrLast) : null;

    /* Chamadores VIVOS deste fluxo. O servidor manda o grafo de chamada cru
     * (fato); "vivo" é juízo e mora aqui.
     *
     * Duas coisas medidas na tela e corrigidas:
     *   - Cópia de teste ATIVA não conta como chamador vivo. `[ROBERTO] Agent —
     *     Iago Comercial (TESTER)` está `active` e com 0 execuções, e por isso
     *     estava levando o crédito de dois Tools que o agente DE VERDADE chama —
     *     a tela dizia "sub-fluxo de ... (TESTER)". Pior: um Tool chamado só
     *     pela cópia de teste entraria no quadro pela força dela.
     *   - A ordem é por execução, decrescente. Quem tem execução é evidência;
     *     quem só está ativo é possibilidade. O rótulo do cartão usa o primeiro,
     *     então o primeiro tem que ser o que tem prova atrás. */
    const chamadores = (S.callers && S.callers.porFilho && S.callers.porFilho[wf.id]) || [];
    const calledByLive = chamadores
      .map(c => ({ c, pai: S.workflows.get(c.id), execs: (byWf.get(c.id) || []).length }))
      .filter(({ c, pai, execs }) => pai && (execs > 0 || (pai.active && !SCRATCH.test(c.name))))
      .sort((a, b) => b.execs - a.execs)
      .map(({ c }) => c);

    const f = {
      ...wf,
      project: projectOf(wf.name),
      short: shortName(wf.name),
      scratch: SCRATCH.test(wf.name),
      calledBy: chamadores,
      calledByLive,
      total: runs.length,
      errors: errs.length,
      errRate: runs.length ? errs.length / runs.length : 0,
      p95: durs.length ? durs[Math.floor(0.95 * (durs.length - 1))] : null,
      median: durs.length ? durs[Math.floor(durs.length / 2)] : null,
      lastRun: last,
      minsSinceLast: last?.startedAt ? (Date.now() - new Date(last.startedAt).getTime()) / 60000 : null,
      topErrorNode,
      topErrorOrigin,
      runs
    };
    f.status = classify(f);
    f.diag = diagnose(f);
    out.push(f);
  }
  return out;
}

function errorGroups() {
  const g = new Map();
  for (const d of S.details.values()) {
    if (d.status !== "error") continue;
    if (!d.startedAt || new Date(d.startedAt).getTime() < windowFloor()) continue;
    const k = errorKey(d);
    if (!g.has(k)) g.set(k, { key: k, count: 0, samples: [], msgs: new Set(), first: d.startedAt, last: d.startedAt, d });
    const row = g.get(k);
    row.count++;
    row.samples.push(d);
    // A chave agora é nó+tipo (compatível com superflow), então mensagens
    // distintas cabem no mesmo grupo — e divergência aí é sinal, não ruído.
    if (d.error?.message) row.msgs.add(d.error.message);
    if (d.startedAt < row.first) row.first = d.startedAt;
    if (d.startedAt > row.last) row.last = d.startedAt;
  }
  return [...g.values()].sort((a, b) => b.count - a.count || b.last.localeCompare(a.last));
}

/* ------------------------------------------------------------------- render */

function renderKpis(flows) {
  const floor = windowFloor();
  const win = [...S.execs.values()].filter(e => e.startedAt && new Date(e.startedAt).getTime() >= floor);
  const errs = win.filter(e => e.status === "error");
  const running = win.filter(e => e.status === "running" || e.status === "waiting");
  const durs = win.map(e => e.ms).filter(v => typeof v === "number").sort((a, b) => a - b);
  const p95 = durs.length ? durs[Math.floor(0.95 * (durs.length - 1))] : null;
  const rate = win.length ? 1 - errs.length / win.length : null;
  const newest = win.reduce((a, e) => (!a || e.startedAt > a ? e.startedAt : a), null);
  const activeFlows = flows.filter(f => f.active).length;
  const movingFlows = flows.filter(f => f.total > 0).length;

  // `raw` + `fmt` alimentam a mola do contador; quem não tem número cru (durações,
  // "há Xmin") simplesmente troca de texto, sem animação inventada.
  const cards = [
    { lbl: "Execuções " + WINDOW_H + "h", val: win.length.toLocaleString("pt-BR"), raw: win.length,
      sub: movingFlows + " fluxos em movimento", cls: "" },
    { lbl: "Taxa de sucesso", val: rate == null ? "—" : pct(rate), sub: errs.length + " falha" + (errs.length === 1 ? "" : "s"),
      raw: rate == null ? undefined : rate, fmt: v => pct(v),
      cls: rate == null ? "is-cold" : rate >= 0.99 ? "is-ok" : rate >= 0.95 ? "is-warn" : "is-risk" },
    { lbl: "Falhas " + WINDOW_H + "h", val: errs.length.toLocaleString("pt-BR"), raw: errs.length,
      sub: errs.length ? errorGroups().length + " assinatura" + (errorGroups().length === 1 ? "" : "s") + " distinta" + (errorGroups().length === 1 ? "" : "s") : "nenhuma",
      cls: errs.length === 0 ? "is-ok" : errs.length >= BANDS.errCountRisk ? "is-risk" : "is-warn" },
    { lbl: "Fluxos ativos", val: String(activeFlows), raw: activeFlows, sub: "de " + S.workflows.size + " no total", cls: "" },
    // "Rodando agora" ficaria pregado em zero: estas execuções duram 60–600ms e
    // a API quase nunca captura o instante. Liveness honesta = última execução.
    running.length
      ? { lbl: "Rodando agora", val: String(running.length), sub: "execuções em voo", cls: "is-ok" }
      : { lbl: "Última execução", val: newest ? agoShort(Date.now() - new Date(newest).getTime()) : "—",
          sub: newest ? "às " + hhmm(newest) : "nada na janela",
          cls: !newest ? "is-cold" : (Date.now() - new Date(newest).getTime()) > BANDS.staleMin * 60000 ? "is-warn" : "is-ok" },
    { lbl: "Duração p95", val: p95 == null ? "—" : dur(p95), sub: durs.length ? "mediana " + dur(durs[Math.floor(durs.length / 2)]) : "sem dados",
      cls: p95 == null ? "is-cold" : p95 > BANDS.slowMs ? "is-warn" : "" }
  ];

  const box = $("#kpis");
  // Guarda o valor anterior por rótulo ANTES de limpar: a mola precisa saber de
  // onde sair. Sem isso todo poll animaria de zero e o número piscaria a cada
  // 15s — movimento sem informação, que é exatamente o que o painel evita.
  const prev = new Map([...box.children].map(k => [
    k.querySelector(".lbl")?.textContent, Number(k.dataset.raw)
  ]));
  const firstPaint = !box.children.length;
  box.innerHTML = "";
  cards.forEach((c, i) => {
    // A tira só entra escalonada na primeira pintura; depois quem se move é o
    // número, e só quando ele muda de fato.
    const k = el("div", "kpi " + (firstPaint ? "rise " : "") + c.cls);
    if (firstPaint) k.style.setProperty("--i", i);
    const val = el("div", "val", c.val);
    k.append(el("div", "lbl", c.lbl), val, el("div", "sub", c.sub));
    if (typeof c.raw === "number") {
      k.dataset.raw = c.raw;
      const from = prev.get(c.lbl);
      if (from != null && !Number.isNaN(from) && from !== c.raw) springNumber(val, from, c.raw, c.fmt);
    }
    box.append(k);
  });
}

/* Contador com mola (animated-number do cult-ui). Lá é `useSpring` do framer;
 * aqui é a mesma integração de mola num rAF, sem dependência. Só roda quando o
 * valor MUDOU — número que se anima sozinho a cada poll vira ruído. */
function springNumber(node, from, to, fmt = v => Math.round(v).toLocaleString("pt-BR")) {
  if (REDUCED) { node.textContent = fmt(to); return; }
  const stiffness = 75, damping = 15, mass = 0.8;
  // Tolerância relativa: a taxa de sucesso é 0..1, então um epsilon fixo de 0,5
  // encerraria a mola no primeiro quadro e o cartão nunca animaria.
  const eps = Math.max(Math.abs(to), Math.abs(from), 1) * 0.0015;
  let x = from, v = 0, last = performance.now();
  const tick = now => {
    // Passo fixo de 16ms: com aba em segundo plano o dt real explode e a mola
    // diverge em vez de assentar.
    const steps = Math.min(6, Math.max(1, Math.round((now - last) / 16)));
    last = now;
    for (let i = 0; i < steps; i++) {
      const a = (-stiffness * (x - to) - damping * v) / mass;
      v += a * 0.016; x += v * 0.016;
    }
    if (Math.abs(to - x) < eps && Math.abs(v) < eps) { node.textContent = fmt(to); return; }
    node.textContent = fmt(x);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderRail(flows) {
  const groups = new Map();
  for (const f of flows) {
    // MESMA regra dos cartões, chamada — não recopiada. Enquanto era uma cópia
    // (`f.total === 0 && !f.active`), o trilho contava 14 e o quadro mostrava
    // 17, e o contador do trilho é onde se confere se algo está faltando.
    if (!naPorta(f)) continue;
    if (!groups.has(f.project)) groups.set(f.project, { name: f.project, flows: 0, execs: 0, errors: 0 });
    const g = groups.get(f.project);
    g.flows++; g.execs += f.total; g.errors += f.errors;
  }
  const list = [...groups.values()].sort((a, b) => b.execs - a.execs || a.name.localeCompare(b.name));

  const box = $("#rail"); box.innerHTML = "";
  const all = el("div", "rail-item only" + (S.selectedProject == null ? " sel" : ""));
  all.append(el("i", "bar"), el("span", "nm", "Todos"), el("span", "ct", String(list.reduce((s, g) => s + g.flows, 0))));
  // O fluxo escolhido no Ao vivo cai junto: ele pertence ao projeto que estava
  // selecionado, e mantê-lo deixaria a lista vazia sem dizer por quê. O "deu
  // certo / deu erro" fica — é uma pergunta sobre qualquer projeto.
  clickable(all, "Ver todos os projetos", () => { S.selectedProject = null; S.errFilterWf = null; S.feedFilter.wf = null; renderAll(); });
  box.append(all);

  for (const g of list) {
    const st = g.errors >= BANDS.errCountRisk ? "risk" : g.errors > 0 ? "warn" : g.execs > 0 ? "ok" : "cold";
    const it = el("div", "rail-item s-" + st + (S.selectedProject === g.name ? " sel" : ""));
    // Falha em pílula com a palavra; sem falha, a contagem de fluxos de sempre.
    const ct = el("span", "ct" + (g.errors ? " bad" : ""),
      g.errors ? g.errors + (g.errors === 1 ? " falha" : " falhas") : String(g.flows));
    it.append(el("i", "bar"), el("span", "nm", g.name), ct);
    // A segunda linha responde "quem trabalha mais" sem hover. Zero execução é
    // dito por extenso — "0 exec" numa lista inteira delas parece erro de dado.
    it.append(el("span", "meta",
      g.flows + (g.flows === 1 ? " fluxo" : " fluxos") + " · " +
      (g.execs ? g.execs.toLocaleString("pt-BR") + " exec 24h" : "sem execução 24h")));
    it.title = g.name + " — " + g.flows + " fluxos, " + g.execs + " execuções, " + g.errors + " falhas";
    // Trocar de projeto zera o filtro por fluxo: senão o quadro fica vazio
    // mostrando um filtro de fluxo que nem pertence ao projeto escolhido.
    clickable(it, "Projeto " + g.name + ", " + g.flows + " fluxos, " + g.errors + " falhas",
      () => { S.selectedProject = S.selectedProject === g.name ? null : g.name; S.errFilterWf = null; S.feedFilter.wf = null; renderAll(); });
    box.append(it);
  }
}

function renderCards(flows) {
  const noProjeto = flows.filter(f => naPorta(f) && (!S.selectedProject || f.project === S.selectedProject));
  const dormant = flows.filter(f => !naPorta(f) && (!S.selectedProject || f.project === S.selectedProject));
  // cardPref resolve o retorno automático: um removido cujo fluxo executou de
  // novo já volta desta chamada com a marca apagada.
  const shown = [], hidden = [];
  for (const f of noProjeto) (cardPref(f).hidden ? hidden : shown).push(f);
  shown.sort((a, b) => {
    // Estrela vence status: fixo é fixo. Dentro de cada grupo, a ordem de
    // sempre — pior primeiro, depois volume.
    const fav = (cardPref(b).fav ? 1 : 0) - (cardPref(a).fav ? 1 : 0);
    if (fav) return fav;
    const rank = { risk: 0, warn: 1, cold: 2, ok: 3 };
    return rank[a.status] - rank[b.status] || b.total - a.total;
  });

  $("#cards-hint").textContent = shown.length + " de " + flows.length +
    (hidden.length ? " · " + hidden.length + " removido(s) por você" : "");
  const box = $("#cards"); box.innerHTML = "";

  if (!shown.length) {
    box.append(el("div", "empty", "Nenhum fluxo com atividade nesta seleção."));
  }

  shown.forEach((f, idx) => {
    const c = el("div", "card s-" + f.status + (S.selectedWf === f.id ? " sel" : "") + (S.errFilterWf === f.id ? " filt" : ""));
    // Só anima na primeira pintura e quando um fluxo entra na lista — este
    // render roda a cada poll do SSE e a cada troca de projeto no trilho.
    if (!seenCardIds || !seenCardIds.has(f.id)) { c.classList.add("rise"); c.style.setProperty("--i", idx); }
    // Brilho que segue o cursor (glow-button do cult-ui): o gradiente radial já
    // está no ::after, aqui só se atualiza onde ele fica. É pointermove no
    // próprio cartão, não no documento — o custo morre junto com o hover.
    c.addEventListener("pointermove", ev => {
      const r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (ev.clientX - r.left) + "px");
      c.style.setProperty("--my", (ev.clientY - r.top) + "px");
    });
    // Sub-fluxo não tem estado próprio de "ativo": dizer "inativo" num fluxo que
    // roda o dia inteiro pela mão do pai é a leitura errada. Quando ele está no
    // quadro por causa do chamador, o rótulo diz isso.
    const motivo = motivoPorta(f);
    c.append(el("div", "proj", f.project + (motivo ? " · " + motivo : (f.active ? " · ativo" : " · inativo"))));
    c.append(el("h3", null, f.short));

    /* Estrela e remover. Botões de verdade (não área do card clicável), com o
       clique parado antes de chegar ao card — senão fixar um fluxo também o
       colocaria no palco e filtraria o quadro de erros, três efeitos por um
       clique. Glifos desenhados no mesmo traço dos ícones do palco; a estrela
       cheia usa --accent (movimento/estado de UI), nunca cor de status. */
    const pref = cardPref(f);
    const acts = el("div", "card-acts");
    const bFav = el("button", "cact fav" + (pref.fav ? " on" : ""));
    bFav.type = "button";
    bFav.setAttribute("aria-pressed", String(pref.fav));
    bFav.setAttribute("aria-label", (pref.fav ? "Tirar dos favoritos: " : "Fixar no topo: ") + f.short);
    bFav.title = pref.fav ? "Tirar dos favoritos" : "Fixar no topo";
    bFav.innerHTML = '<svg viewBox="0 0 24 24" fill="' + (pref.fav ? "currentColor" : "none") +
      '" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M12 3.6l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6-5.1-2.8-5.1 2.8 1.1-5.6L3.8 9.5l5.7-.7z"/></svg>';
    bFav.addEventListener("click", ev => { ev.stopPropagation(); toggleFav(f); });

    const bHide = el("button", "cact");
    bHide.type = "button";
    bHide.setAttribute("aria-label", "Remover do quadro: " + f.short + " — volta sozinho na próxima execução");
    bHide.title = "Remover do quadro — volta sozinho na próxima execução";
    bHide.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    bHide.addEventListener("click", ev => { ev.stopPropagation(); hideCard(f); });

    acts.append(bFav, bHide);
    c.append(acts);
    c.append(el("div", "diag", f.diag));

    // 24 baldes de 1h: a forma da barra diz quando o fluxo trabalha
    const spark = el("div", "spark-row");
    const buckets = Array.from({ length: 24 }, () => ({ n: 0, e: 0 }));
    const now = Date.now();
    for (const r of f.runs) {
      const h = Math.floor((now - new Date(r.startedAt).getTime()) / 3600000);
      if (h < 0 || h > 23) continue;
      const b = buckets[23 - h]; b.n++; if (r.status === "error") b.e++;
    }
    const max = Math.max(1, ...buckets.map(b => b.n));
    for (const b of buckets) {
      const i = el("i", b.n === 0 ? "z" : b.e ? "e" : "");
      i.style.height = b.n === 0 ? "2px" : Math.max(3, Math.round(20 * b.n / max)) + "px";
      i.title = b.n + " execuções" + (b.e ? ", " + b.e + " falhas" : "");
      spark.append(i);
    }
    c.append(spark);

    const st = el("div", "stats");
    st.innerHTML = "<span><b>" + f.total + "</b> exec</span>"
      + "<span><b>" + f.errors + "</b> falhas</span>"
      + "<span>p95 <b>" + dur(f.p95) + "</b></span>"
      + "<span>" + (f.lastRun ? "há <b>" + agoShort(Date.now() - new Date(f.lastRun.startedAt).getTime()) + "</b>" : "—") + "</span>";
    c.append(st);
    // Clique no cartão faz as duas coisas: põe o fluxo no palco e filtra o
    // quadro de erros. Clicar de novo no mesmo cartão desfaz o filtro.
    clickable(c, f.short + " — " + f.diag, () => {
      const on = S.errFilterWf !== f.id;
      filterErrorsByWorkflow(on ? f.id : null);
      if (on) $("#err-hint").closest(".eyebrow").scrollIntoView({ behavior: "smooth", block: "start" });
      selectWorkflow(f.id, f.lastRun?.id || null);
    });
    c.title = (S.errFilterWf === f.id ? "Clique para ver os erros de todos os fluxos" : "Clique para ver só os erros deste fluxo");
    box.append(c);
  });
  seenCardIds = new Set(shown.map(f => f.id));

  /* Os removidos têm porta de volta À VISTA — mesma razão da lixeira do Tester:
     uma lista que some sem endereço é um card que ninguém sabe como recuperar.
     E a linha diz a regra de retorno, porque "removido" aqui não é arquivado:
     é "me chama quando isto acordar". */
  const hbox = $("#hiddenflows"); hbox.innerHTML = "";
  hbox.style.display = hidden.length ? "" : "none";
  if (hidden.length) {
    hbox.append(el("summary", null, "▸ " + hidden.length + " removido(s) do quadro por você — voltam sozinhos na próxima execução"));
    const list = el("div", "dlist");
    for (const f of hidden.sort((a, b) => a.name.localeCompare(b.name))) {
      const row = el("div", "hidden-row");
      row.append(el("span", null, f.name));
      const back = el("button", "linkbtn", "trazer de volta");
      back.type = "button";
      back.setAttribute("aria-label", "Trazer " + f.short + " de volta ao quadro");
      back.addEventListener("click", () => unhideCard(f.id));
      row.append(back);
      list.append(row);
    }
    hbox.append(list);
  }

  const d = $("#dormant"); d.innerHTML = "";
  if (dormant.length) {
    const nScratch = dormant.filter(f => f.scratch).length;
    // Enquanto o grafo de chamada não chega, esta lista pode estar guardando um
    // sub-fluxo de produção — e ela não pode passar por completa antes disso.
    const cav = S.callersErro
      ? " · não li quem chama quem (" + S.callersErro + "), pode haver sub-fluxo ativo aqui"
      : (S.callers ? "" : " · ainda lendo quem chama quem…");
    d.append(el("summary", null, "▸ " + dormant.length + " fluxos sem atividade e desativados"
      + (nScratch ? " (" + nScratch + " são rascunho/teste)" : "") + cav));
    const list = el("div", "dlist");
    for (const f of dormant.sort((a, b) => a.name.localeCompare(b.name))) {
      const row = el("div", null, f.name);
      row.title = f.name + " — " + (f.nodeCount ?? "?") + " nós, atualizado " + (f.updatedAt || "").slice(0, 10);
      list.append(row);
    }
    d.append(list);
  }
}

/* Busca onde o nó vive, uma vez por assinatura. Uma requisição por assinatura
 * distinta (são duas nesta instância), respondida de cache no servidor por 10
 * min. Não usa `force` no redesenho: se o Kauan estiver digitando uma nota, o
 * quadro fica pausado e a atribuição entra no próximo ciclo — a nota vale mais
 * que a pressa. */
const locateInFlight = new Set();
function ensureLocate(g) {
  const node = errorNodeOf(g.d);
  if (!node || node === "?") return;
  const key = locKey(g.d.workflowId, node);
  if (S.locate.has(key) || locateInFlight.has(key)) return;
  locateInFlight.add(key);
  callApi("/api/n8n/locate/" + encodeURIComponent(g.d.workflowId) + "?node=" + encodeURIComponent(node))
    // Redesenha os dois: o quadro de erros e os cartões de fluxo diziam a mesma
    // coisa errada ("falharam no nó X") e a correção vale para os dois.
    .then(r => { if (r.ok) { S.locate.set(key, r.body); renderErrors(); renderCards(flowsWithActivity()); } })
    .finally(() => locateInFlight.delete(key));
}

function errorCard(g) {
  const wf = S.workflows.get(g.d.workflowId);
  const origin = nodeOrigin(g);
  const e = el("div", "err" + (g.fixSt === "resolved" ? " fixed" : g.fixSt === "reopened" ? " reopened" : ""));
  // A assinatura no DOM é o que permite reencontrar este cartão depois de um
  // redesenho — é assim que o handoff devolve o foco ao botão certo ao fechar.
  e.dataset.key = g.key;
  const top = el("div", "top");
  top.append(el("span", "cnt", g.count + "×"));
  top.append(el("span", "wf", wf ? shortName(wf.name) : "fluxo " + g.d.workflowId));
  if (wf) top.append(el("span", "proj", projectOf(wf.name)));
  if (origin.state === "subflow") {
    const chip = el("span", "sub", "⤷ " + shortName(origin.childName));
    chip.title = "O nó " + origin.node + " não existe em " + (wf ? wf.name : g.d.workflowId)
      + ". Ele vive no sub-fluxo " + origin.childName + " (" + origin.childId + "), chamado por " + origin.viaNode + ".";
    top.append(chip);
  }
  const nodeLbl = el("span", "node" + (origin.state === "subflow" ? " foreign" : ""), origin.node);
  // Deixa explícito quando o nó veio do lastNodeExecuted em vez de error.node.
  if (!g.d.error?.nodeName && g.d.lastNode) nodeLbl.title = "nó inferido do último nó executado (o n8n não informou error.node)";
  if (origin.state === "subflow") nodeLbl.title = "nó do sub-fluxo " + origin.childName + " — não existe em " + (wf ? wf.name : g.d.workflowId);
  top.append(nodeLbl);
  top.append(el("span", "pill risk", errorTypeOf(g.d)));
  if (g.fixSt === "resolved") top.append(el("span", "pill ok", "corrigido"));
  if (g.fixSt === "reopened") top.append(el("span", "pill warn", "reincidiu"));
  e.append(top);

  // A frase que faltava: sem ela o cartão dizia que o nó era deste fluxo.
  if (origin.state === "subflow") {
    e.append(el("div", "when origin",
      "⤷ Este nó não está em " + (wf ? shortName(wf.name) : g.d.workflowId) + ". Ele é do sub-fluxo "
      + origin.childName + ", chamado por " + origin.viaNode + " — o n8n reporta a falha do filho no pai. "
      + "O conserto é no sub-fluxo."));
    if (origin.ambiguous) {
      e.append(el("div", "when origin",
        "⚠ " + origin.ambiguous.length + " sub-fluxos deste pai têm um nó com esse nome ("
        + origin.ambiguous.join(", ") + ") e a execução não informou qual chamou. "
        + "O apontado acima é o primeiro — confirme antes de mexer."));
    }
  } else if (origin.state === "elsewhere") {
    e.append(el("div", "when origin",
      "⤷ O nó " + origin.node + " não existe em " + (wf ? shortName(wf.name) : g.d.workflowId)
      + (origin.scanned ? " nem nos " + origin.scanned + " sub-fluxos chamados diretamente" : " e este fluxo não chama sub-fluxos")
      + " — pode estar mais fundo na cadeia."));
  }

  // `sens`: mensagem de erro vem crua do n8n e pode embutir telefone ou e-mail
  // do lead — no modo gravação ela é borrada junto com o conteúdo de mensagem.
  for (const m of g.msgs.size ? [...g.msgs] : ["(sem mensagem)"]) e.append(el("div", "msg sens", m));
  if (g.msgs.size > 1) e.append(el("div", "when", "⚠ " + g.msgs.size + " mensagens distintas no mesmo nó e tipo — pode ser mais de uma causa."));
  if (g.d.error?.description && !g.msgs.has(g.d.error.description)) {
    e.append(el("div", "msg sens", "↳ " + g.d.error.description));
  }

  // Tempo relativo, não hora do relógio: a janela de 24h cruza a meia-noite e
  // "primeira 15:49 · última 09:52" se lê ao contrário.
  const when = el("div", "when",
    "última há " + agoShort(Date.now() - new Date(g.last).getTime())
    + (g.count > 1 ? " · primeira há " + agoShort(Date.now() - new Date(g.first).getTime()) : "")
    + (g.d.lastNode ? " · último nó executado: " + g.d.lastNode : ""));
  e.append(when);

  if (g.fix) {
    const t = g.fix.markedAt ? " (marcado há " + agoShort(Date.now() - new Date(g.fix.markedAt).getTime()) + ")" : "";
    e.append(el("div", "when", g.fixSt === "reopened"
      ? "⚠ Marcado como corrigido" + t + " e voltou a falhar depois disso — a correção não pegou."
      : "✓ Marcado como corrigido" + t));
    if (g.fix.note) e.append(el("div", "note", "✎ " + g.fix.note));
  }
