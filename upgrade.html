@media (prefers-reduced-motion: reduce) {
  /* Estado, cor e frase ficam; só o movimento sai. Nenhuma informação mora na
     animação — e o `animation-delay` precisa zerar junto, senão com `both` os
     passos atrasados ficam parados no estado inicial, invisíveis. */
  .ver-scrim { animation: none; }
  .ver-step { animation: none; animation-delay: 0s; }
  .ver-steps .barra i { transition: none; }
}
@media (max-width: 860px) {
  .ver-body { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); }
  .ver-steps { border-right: 0; border-bottom: 1px solid var(--line); max-height: 210px; }
  .ver-hd { flex-wrap: wrap; row-gap: 4px; }
  .ver-hd .sp { display: none; }
  .ver-ft .btn { min-height: 40px; }
}

/* O `animation-delay` TEM de ir a zero junto com a duração: com `both`, um
   elemento atrasado fica parado no estado inicial — invisível — em vez de
   aparecer instantaneamente. Esta casa já pagou por isso no fantasma do Tester. */
@media (prefers-reduced-motion: reduce) {
  .bat li { animation-duration: 1ms; animation-delay: 0s; }
}

/* O SELETOR DOS DOIS PATCHES (§5.7.2). Um de cada vez, nunca os dois diffs no
   mesmo ecrã: dois diffs lado a lado num ecrã de aprovação é a forma mais rápida
   de alguém aprovar o que não leu. */
.dois { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.dois button { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .04em;
  padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--txt-dim); cursor: pointer; }
.dois button:hover { border-color: var(--accent-line); color: var(--txt); }
.dois button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dois button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-txt); }
.dois-nota { font-size: 11.5px; line-height: 1.5; color: var(--txt-faint); margin: -4px 0 10px; }


.dnode { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); margin-bottom: 8px; overflow: hidden; }
.dnode > summary { cursor: pointer; list-style: none; padding: 8px 11px;
                   display: flex; gap: 9px; align-items: center; font-size: 12.5px; color: var(--txt); }
.dnode > summary::-webkit-details-marker { display: none; }
.dnode > summary:hover { background: var(--accent-soft); }
.dnode > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dnode .tag { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; padding: 2px 6px; border-radius: 5px; flex: 0 0 auto; }
/* MESMA RECEITA DA BASE, e aqui ela pesa mais: são 9,5px, o menor texto colorido
   desta tela, e é a etiqueta que diz se um nó foi ADICIONADO, ALTERADO ou REMOVIDO na
   banda que decide um clique que escreve em produção. Medido antes: `added` 4,4665 e
   `modified` 4,4841 no claro. A borda fica com a cor cheia — ela é forma. */
.dnode .tag.added    { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt));   background: var(--ok-soft);   border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.dnode .tag.modified { color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.dnode .tag.removed  { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); background: var(--risk-soft); border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent); }
.dnode .ty { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); margin-left: auto;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A caixa rola em SI: linha de diff é longa e o `pre` empurraria a coluna inteira,
   que é a regra que esta página já segue para tabela e desenho. */
.dnode .body { border-top: 1px solid var(--line-soft); overflow-x: auto; }
.dl { display: block; white-space: pre; font-family: var(--font-num); font-size: 11px;
      line-height: 1.6; padding: 0 11px; color: var(--txt-dim); }
.dl.add  { background: color-mix(in srgb, var(--ok) 12%, transparent);   color: var(--ok-txt); }
.dl.del  { background: color-mix(in srgb, var(--risk) 12%, transparent); color: var(--risk-txt); }
.dl.skip { color: var(--txt-faint); font-style: italic; background: var(--surface-2); }

.edgelist { font-family: var(--font-num); font-size: 11px; line-height: 1.7; color: var(--txt-dim); margin: 4px 0 10px; }
.edgelist .rt { display: block; font-size: 10px; letter-spacing: .09em; color: var(--txt-faint); margin-bottom: 3px; }
.edgelist .add { color: var(--ok-txt); }
.edgelist .del { color: var(--risk-txt); }

/* O rodapé. Mesma estrutura do `.confirma` do alvo, porque é o mesmo gesto:
   uma frase sobre o que o botão faz, e o botão. */
.pr-rod { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          border-top: 1px solid var(--line-soft); padding-top: 9px; margin-top: 2px; }
.pr-rod .cf-tx { flex: 1 1 240px; font-size: 12px; line-height: 1.5; color: var(--txt-dim); }

/* A oferta do dossiê no recibo. A cor entra como BORDA e não como texto: a régua
   desta base é que matiz de status em texto pede o par `-txt`, e borda não tem piso
   de contraste nenhum — então a linha ganha estado sem prometer uma medição nova. */
.dos-of { border-left: 2px solid var(--line); padding-left: 11px; }
.dos-of.ok { border-left-color: var(--ok); }
.dos-of.warn { border-left-color: var(--warn); }
.dos-of.risk { border-left-color: var(--risk); }
.dos-of.cold { border-left-color: var(--cold); }
.dos-of .ix { font-family: var(--font-num); font-size: 10px; letter-spacing: .14em; color: var(--brand-txt); }
.alvo .mk { color: var(--accent-txt); font-size: 11px; }
.alvo .o { color: var(--txt-faint); }
.nota { margin-top: 9px; font-size: 11.5px; color: var(--txt-faint);
  border-left: 2px solid var(--line); padding-left: 9px; }
.confirma { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 13px;
  padding-top: 12px; border-top: 1px solid var(--line-soft); }
.cf-tx { font-size: 12px; color: var(--txt-dim); flex: 1 1 220px; }

/* A banda de estado. `--accent` para movimento; `--cold` para parado por ele;
   `--risk` só para o que quebrou sozinho — parar não é falha. */
.banda { display: flex; align-items: center; gap: 11px; margin-top: 13px; padding: 10px 12px;
  border-radius: 10px; border: 1px solid var(--line); }
.banda.accent { background: var(--accent-soft); border-color: var(--accent-line); }
.banda.cold { background: var(--cold-soft); }
.banda.risk { background: var(--risk-soft); border-color: var(--risk); }
.bd-tx { flex: 1 1 auto; font-size: 12px; line-height: 1.55; color: var(--txt-dim); }
.spin { width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto;
  border: 2px solid var(--accent-line); border-top-color: var(--accent);
  animation: upspin .8s linear infinite; }
@keyframes upspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.custo { margin-top: 11px; font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); }
.custo code { font-size: 10.5px; }
kbd { font-family: var(--font-num); font-size: 9.5px; border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 4px; color: var(--txt-faint); margin-left: 5px; }

.leg { display: flex; gap: 16px; margin-top: 11px; font-size: 11px; color: var(--txt-faint); flex-wrap: wrap; }
.leg span { display: flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 4px; border: 1.6px solid var(--node-edge);
  background: var(--node-face); display: inline-block; flex: 0 0 auto; }
.sw.on { border-color: var(--accent); border-width: 2.4px; }
.sw.novo { border-color: var(--accent); border-style: dashed; }
.sw.fail { border-color: var(--risk); border-width: 2.2px; }

/* Os nós que entram. Tracejado e FORA do palco de propósito — ver a seção
   `tarjaNovos()` no script: o desenho não afirma posição que ninguém decidiu. */
.entram { margin-top: 12px; border: 1px dashed var(--accent-line); border-radius: 10px;
  background: var(--accent-soft); padding: 10px 12px; }
.en-hd { font-family: var(--font-num); font-size: 10px; letter-spacing: .06em;
  color: var(--accent-txt); margin-bottom: 8px; }
.en-no { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-size: 11.5px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
.en-no:first-of-type { border-top: 0; }
.en-no code { color: var(--txt); }
.en-no .o { color: var(--txt-faint); flex: 1 1 200px; }

.vazio { padding: 40px 20px; text-align: center; color: var(--txt-faint); font-size: 13px; line-height: 1.7; }
.aviso-inline { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px;
  border-radius: 10px; border: 1px solid var(--risk); background: var(--risk-soft);
  font-size: 12.5px; line-height: 1.6; color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); margin-bottom: 16px; }
.aviso-inline .g { color: var(--risk-txt); }

/* ═══════════════════════════════════════════════════════════════════════════
   A GAVETA — o histórico de conversas deste fluxo
   Opção C das três desenhadas em `preview/HISTORICO-OPCOES.md`, escolhida por
   medição: ela é a única que não tira UM PIXEL das duas colunas para as quais
   esta tela existe (medido idêntico à linha de base, contra −15% de área no
   desenho na opção A e −43px de altura na B). Espaço temporário é grátis, e é por
   isso que aqui o título NÃO TRUNCA — o que importa mais nesta lista do que em
   qualquer outra do produto, porque título de conversa não pode ter `title=`:
   tooltip é hover, e o borrão do modo gravação nunca abre no hover, então um
   tooltip que revela o que o borrão esconde não protege nada.
   Quase tudo aqui é vocabulário que a casa já tem: o véu e o desfoque são os
   números do `.fmod-scrim`, a busca é o `.fbusca`, o rodapé é o `.fmod-ft`.
   ═══════════════════════════════════════════════════════════════════════════ */

/* A gaveta e o véu vivem DENTRO da `.tela`, e é isto que exige o `relative`: o
   topbar e a vitrine atrás não têm nada a ver com escolher conversa. */
.tela { position: relative; }

.hgv-scrim { position: absolute; inset: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1); -webkit-backdrop-filter: blur(9px) saturate(1.1);
  animation: hgvfade .2s ease-out both; }
@keyframes hgvfade { from { opacity: 0; } }
.hgv { position: absolute; left: 0; top: 0; bottom: 0; z-index: 31; width: min(384px, 88%);
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  background: var(--surface); border-right: 1px solid var(--line);
  box-shadow: 0 0 0 1px var(--line-soft), 40px 0 90px -50px rgba(0, 0, 0, .85);
  animation: hgvin .24s cubic-bezier(.16, .84, .34, 1) both; }
@keyframes hgvin { from { transform: translateX(-101%); } }
/* Desarmada depois de entrar UMA vez. O `render()` do SSE reconstrói o `#app`
   inteiro e a gaveta é re-anexada por cima — sem esta classe, cada evento de
   atividade faria ela entrar deslizando de novo, o que é movimento sem informação
   nova atrás e é exatamente o que a regra desta casa proíbe. */
.hgv.pousada, .hgv-scrim.pousada { animation: none; }
@media (prefers-reduced-motion: reduce) { .hgv, .hgv-scrim { animation: none; } }

.hgv-hd { display: flex; align-items: center; gap: 9px; padding: 13px 14px 10px; }
.hgv-hd .idx { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em; color: var(--brand-txt); }
/* `h2`: depois do `h1` da topbar, `h3` pula um nivel. */
.hgv-hd h3, .hgv-hd h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.hgv-hd .x { margin-left: auto; border: 1px solid var(--line); background: transparent; cursor: pointer;
  width: 26px; height: 26px; border-radius: 8px; color: var(--txt-faint); font-size: 13px; line-height: 1; }
.hgv-hd .x:hover { color: var(--txt); border-color: var(--accent-line); background: var(--accent-soft); }
.hgv-busca { padding: 0 14px 11px; }
.hgv-lista { overflow-y: auto; padding: 0 8px 8px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.hgv-lista::-webkit-scrollbar { width: 9px; }
.hgv-lista::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px;
  border: 3px solid transparent; background-clip: content-box; }
.hgv-lista::-webkit-scrollbar-track { background: transparent; }
.hgv-ft { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-top: 1px solid var(--line-soft); background: var(--surface-2);
  font-size: 11px; color: var(--txt-faint); flex-wrap: wrap; }
.hgv-ft .tot { margin-left: auto; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.hgv-ft .h-nova { flex: 0 0 auto; margin-right: 4px; }
.hgv.vazia { grid-template-rows: auto minmax(0, 1fr) auto; }

/* A LINHA. `button` de verdade: teclado de graça, e o anel de foco desta casa
   alcança porque ela entra na regra de `:focus-visible` abaixo. */
.h-item { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 0 9px;
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: 9px;
  padding: 9px 10px; margin-bottom: 3px; }
.h-item:hover { background: var(--surface-2); border-color: var(--line-soft); }
.h-item.sel { background: var(--accent-soft); border-color: var(--accent-line); }
/* O cursor do teclado é DIFERENTE da seleção: andar com ↑↓ não abre nada, e
   pintar os dois igual faria parecer que já abriu. */
.h-item.cur { border-color: var(--accent); }
.h-item i.bar { grid-row: 1 / span 3; width: 3px; align-self: stretch; border-radius: 2px;
  background: var(--cold); }
.h-item .tt { font-size: 12.5px; color: var(--txt-dim); line-height: 1.35;
  overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.h-item.sel .tt { color: var(--txt); font-weight: 600; }
.h-item .ult { grid-column: 2; margin-top: 4px; font-size: 11px; line-height: 1.5;
  color: var(--txt-faint); overflow: hidden; display: -webkit-box;
  -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.h-item .quando { font-family: var(--font-num); font-size: 9.5px; color: var(--txt-faint);
  font-variant-numeric: tabular-nums; }
.h-item .lin1 { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.h-item .lin1 .tt { flex: 1 1 auto; }
.h-item .lin1 .quando { flex: 0 0 auto; }
.h-item .mt { grid-column: 2; display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  margin-top: 4px; font-family: var(--font-num); font-size: 9.5px;
  font-variant-numeric: tabular-nums; color: var(--txt-faint); }
.h-item .mt .est { letter-spacing: .04em; }
.h-item .mt .sep { opacity: .45; }
.h-item .mk { display: inline-flex; align-items: center; gap: 3px; }
.h-item .mk svg { display: block; }
.h-item .spin { width: 9px; height: 9px; border-width: 1.6px; }
/* O fluxo mudou depois desta conversa. É `--warn` porque pede atenção antes de
   confiar no alvo, e nunca `--risk`: nada quebrou. */
.h-item .mudou, .hgv-ft .mudou { color: var(--warn-txt); }
/* A linha é DOIS botões irmãos: abrir e apagar. Ver a nota em `linhaConv` — um
   `role="button"` dentro de um `<button>` deixava o apagar só no mouse. */
.h-lin { display: flex; align-items: stretch; gap: 3px; margin-bottom: 3px; }
.h-lin .h-item { flex: 1 1 auto; min-width: 0; margin-bottom: 0; }
.h-del { flex: 0 0 auto; width: 28px; cursor: pointer; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--txt-faint);
  font-size: 12px; line-height: 1; }
.h-del:hover { color: var(--risk-txt); background: var(--risk-soft);
  border-color: color-mix(in srgb, var(--risk) 35%, transparent); }

/* A cor do estado. OITO estados, oito frases — e nenhum deles é verde: confirmar
   o alvo não aplicou nada (a etapa do patch não existe ainda), e pintar de `--ok`
   afirmaria um resultado que não houve. `--accent` é movimento, `--warn` é o que
   pede ação, `--cold` é o que parou, `--risk` só o que quebrou sozinho. */
.h-item.e-correndo     i.bar { background: var(--accent); }
.h-item.e-alvo         i.bar { background: var(--accent); }
.h-item.e-confirmado   i.bar { background: var(--accent); }
.h-item.e-aguardando   i.bar { background: var(--warn); }
.h-item.e-cancelada    i.bar { background: var(--cold); }
.h-item.e-interrompida i.bar { background: var(--cold); }
.h-item.e-semalvo      i.bar { background: var(--cold); }
.h-item.e-falhou       i.bar { background: var(--risk); }
.h-item.e-correndo     .est { color: var(--accent-txt); }
.h-item.e-alvo         .est { color: var(--accent-txt); }
.h-item.e-confirmado   .est { color: var(--accent-txt); }
.h-item.e-aguardando   .est { color: var(--warn-txt); }
.h-item.e-falhou       .est { color: var(--risk-txt); }

.h-vazio { font-size: 12px; line-height: 1.6; color: var(--txt-faint); padding: 12px 12px 14px; }
.h-vazio b { color: var(--txt-dim); font-weight: 600; }
.h-vazio.ruim b { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }
/* A porta de volta da lixeira, sempre visível quando há algo atrás — regra
   escrita: porta que só aparece quando tem algo dentro é porta que ninguém acha,
   e o momento em que se procura por ela é logo depois de apagar. */
.h-lix { border-top: 1px solid var(--line-soft); margin: 6px 2px 0; padding: 8px 8px 2px;
  font-size: 11px; color: var(--txt-faint); line-height: 1.6; }
.h-lix .volta { border: 0; background: transparent; cursor: pointer; padding: 1px 4px;
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .04em; color: var(--accent-txt); }
.h-lix .volta:hover { text-decoration: underline; }
.h-lix .item { display: flex; align-items: baseline; gap: 7px; padding: 3px 0; }
.h-lix .item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* O botão que chama a gaveta. A contagem vive nele porque, FECHADA, ele é a única
   coisa na tela que diz que existe história — e é o que chama quando uma conversa
   parou numa pergunta. Ícone DESENHADO, nunca glifo: `⌸`, `⌕`, `📎` e `🗀` já
   saíram como quadrado vazio nesta fonte. */
.hgv-bt { display: inline-flex; align-items: center; gap: 6px; }
.hgv-bt svg { display: block; }
.hgv-bt .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.hgv-bt .esp { font-family: var(--font-num); font-size: 10px; letter-spacing: .02em;
  color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); }
.hgv-bt .esp b { font-variant-numeric: tabular-nums; font-weight: 700; }

.h-item:focus-visible, .hgv-hd .x:focus-visible, .h-del:focus-visible, .h-lix .volta:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 9px; }
.h-item:focus-visible { background: var(--accent-soft); }

/* O título da conversa aberta entra no cabeçalho da seção `[ 01 ]`, que estava
   vazio à direita. Com a gaveta fechada ele é a ÚNICA coisa que responde "qual
   delas eu estou lendo" — e `.secao` precisa de `nowrap` para receber qualquer
   coisa ali: sem o guarda, `[ 01 ]` e `A conversa` quebram em três linhas. */
.secao { flex-wrap: nowrap; white-space: nowrap; }
.secao .ix { flex: 0 0 auto; }
.secao .aberta { flex: 1 1 auto; color: var(--txt-dim); min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.secao .aberta i { color: var(--txt-faint); font-style: normal; }

@media (max-width: 900px) {
  .duas { grid-template-columns: 1fr; }
  .col-chat { border-right: 0; border-bottom: 1px solid var(--line); }
  /* Em 390 a gaveta vai a 92% da largura e o custo na tela continua ZERO — ela é
     a única das três opções que não muda de forma no telefone. */
  .hgv { width: 92%; }
}

/* ═══════════════ O TELEFONE — MEDIDO, NÃO ESTIMADO (390px) ════════════════
 *
 * O `CLAUDE.md` registrava este defeito para `/tester` e `/disco` e dizia que
 * `flows.html` tinha bloco mobile e as outras não. **Vale para `/upgrade` também**,
 * e aqui ele era PIOR que uma barra de rolagem: `.tela` tem `overflow: hidden`, então
 * o que não cabia era CORTADO em silêncio. Medido no DOM vivo em 2026-08-20, viewport
 * 390 e 360, com o CSS e a marcação reais:
 *
 *   .tela      350px   (correto — é o que sobra do `.up-wrap`)
 *   .tela-hd   398px   \
 *   .dos       398px    >  48px cortados pelo `overflow: hidden` do `.tela`
 *   .duas      398px   /
 *
 * A CAUSA É `min-width: auto`, e ela não é sobre estilo: item de grid e item de flex
 * nascem com o piso no PRÓPRIO min-content, então um `<span>` com `white-space:
 * nowrap` lá no fundo (as etiquetas `179 nós`, a frase da faixa do dossiê) empurra o
 * container inteiro para além da janela. `min-width: 0` nos containers é o conserto
 * mecânico — não é enfeite, é desligar esse piso. Sem isso, mudar `grid-template-columns`
 * não resolve: a coluna vira `1fr` e o item continua com o piso do conteúdo.
 *
 * A TELA DEIXA DE SER UMA JANELA SÓ, e isso é o orçamento de informação do telefone,
 * não uma concessão: `height: calc(100vh - …)` com duas colunas é a régua do desktop.
 * No telefone a página rola em Y — que é o gesto que existe ali — e o desenho ganha
 * uma altura própria em vez de disputar a mesma janela com a conversa.
 *
 * O DEDO: os três controles do canvas mediam 26px de lado, abaixo do piso de 32.
 * O texto da regra desta casa é "touch targets ≥40px" para o `flows.html`; aqui
 * eles ficam em 34, que é o que caber sobre o desenho sem tapá-lo — declarado como
 * o que é: acima do piso de 32, abaixo do ideal de 40. */
@media (max-width: 620px) {
  /* 1. O PISO DE min-content, desligado onde ele empurra. */
  .tela, .tela-hd, .th-l, .th-r, .duas, .dos, .col-chat, .col-desenho, .palco-box { min-width: 0; }
  /* 2. A tela deixa de ser uma janela só. */
  .tela { height: auto; min-height: 0; overflow: visible; }
  .duas, .tela[data-layout="duas"] .duas, .tela[data-layout="foco"] .duas,
  .tela[data-layout="pilha"] .duas { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  .tela[data-layout="pilha"] .col-desenho, .tela[data-layout="pilha"] .col-chat { grid-row: auto; }
  /* Com o `.tela` em altura automática, `flex: 1` sobre nada dá zero: a conversa e o
     desenho precisam de altura PRÓPRIA aqui, senão os dois colapsam para invisíveis. */
  .conv-rol { max-height: 58vh; }
  .palco-box { height: 46vh; }
  .col-chat { padding: 13px; border-right: 0; border-bottom: 1px solid var(--line); }
  .col-desenho { padding: 13px; }
  /* 3. O cabeçalho quebra em duas linhas em vez de ser cortado. */
  .tela-hd { padding: 11px 13px; row-gap: 8px; }
  .th-l { flex: 1 1 100%; flex-wrap: wrap; row-gap: 5px; }
  .th-r { flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; }
  /* A frase da faixa do dossiê é longa por desenho — ela tem de quebrar, nunca sair. */
  .dos { flex-wrap: wrap; row-gap: 7px; }
  .dos .cf-tx { white-space: normal; }
  /* 4. O dedo. */
  .cam button { height: 34px; min-width: 34px; padding: 0 9px; }
}

/* O CSS DA FAIXA E DO PLAYER (`.tut-*`) mora no `/tutorial.js` servido e é
   injetado por ele uma vez por documento, marcado por id — mesma mecânica do
   `/entradas.js`. Não pode ficar aqui: seriam três folhas para um desenho, e a
   que divergisse seria a que ninguém olhou. Procurando `.tut-hero`? Está lá. */
</style>
<script>

/* O tema escolhido em qualquer página vale aqui ANTES do primeiro paint. A
   leitura já existia no fim do body, mas aí a página pintava no `data-theme`
   fixo do <html> e trocava depois — um flash do tema errado a cada navegação
   para quem escolheu o claro. `?theme=` continua vencendo (kiosk/captura). */
(() => {
  const q = new URLSearchParams(location.search).get("theme");
  const t = (q === "light" || q === "dark") ? q : localStorage.getItem("cockpit-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  // Modo gravação: mesma razão de rodar no <head> — o borrão tem que existir
  // ANTES do primeiro paint, senão cada navegação pisca o dado de cliente que
  // o modo existe para esconder da filmagem.
  if (localStorage.getItem("cockpit-rec") === "1") document.documentElement.setAttribute("data-rec", "1");
})();

</script>
</head>

<header class="topbar">

  <div class="sep eplogo-sep"></div>

  </div>

    <a href="/" data-porta="fluxos"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 5.5h4.2v4.2H3.5z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.3 14.3h4.2v4.2h-4.2z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.7 7.6h3.6a2.2 2.2 0 0 1 2.2 2.2v4.6a2.2 2.2 0 0 0 2.2 2.2h.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.7 7.6h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="lb"><span>Fluxos</span><kbd>alt 1</kbd></span></a>

<!-- `role="main"` e nao um `<main>` de verdade porque este no e o alvo de
     `innerHTML` do render inteiro: trocar a tag mudaria o seletor `.up-wrap` em
     dezenas de regras. O marco e o que faltava, e o papel entrega o marco. -->
<div class="up-wrap" id="app" role="main"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   JUÍZO — TUDO o que esta página decide mora neste bloco.
   O servidor emite FATOS: nomes, contagens, bytes, posições de nó, assinaturas
   de erro. Quem decide se um fluxo entra na vitrine, em que ordem, se é caro de
   conversar e qual nó pintar de vermelho é aqui. Espalhar isso pelas funções de
   render transformaria cada ajuste numa caça ao `if`.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Nome de rascunho. MESMA regra do `flows.html`.
   DÍVIDA CONHECIDA, e ela é real: esta é a SEGUNDA definição de `SCRATCH` e de
   `naPorta` no produto. O plano promete uma só. Unificar significa extrair um
   arquivo servido (como `aba.js`) e mexer no `flows.html`, que hoje funciona —
   mudança de risco próprio que não vai de carona na primeira fatia visual.
   Enquanto forem duas: mudou uma, mude a outra, e o dia em que discordarem as
   duas telas discordam sobre quais fluxos existem. */
const SCRATCH = /(^\[sandbox)|(\(tester\))|(\bteste\b)|(apagar)|(^my workflow)|(^\[sf-test\])/i;

/* Quem chega na porta. Rodou na janela OU está `active` OU é chamado por fluxo
   vivo, menos o que tem nome de rascunho e nunca rodou.
   Um sub-fluxo NUNCA pode estar `active` no n8n — o pai é que é acordado — então
   uma regra do tipo "ativo ou rodou" exclui estruturalmente os quietos. */
function naPorta(f) {
  const rascunho = SCRATCH.test(f.nome || "");
  if (rascunho && !f.exec24) return false;
  return !!(f.exec24 || f.active || (f.chamadores && f.chamadores.length));
}

/* A ordem é o OPOSTO do quadro de erros. Lá sobe o que quebrou; aqui sobe o que
   importa e funciona: um fluxo que roda 751 vezes por dia é onde um upgrade
   paga. Empate desce para número de nós. Fluxo sem execução vai para o fim. */
function ordem(a, b) {
  return (b.exec24 - a.exec24) || (b.nos - a.nos) || String(a.nome).localeCompare(String(b.nome), "pt-BR");
}

/* Peso da conversa. NÃO é cobrança: as sessões rodam no plano, mesma cota de 5h
   de uma sessão interativa. É régua para comparar fluxo caro com fluxo barato, e
   o que decide o clique é a faixa, não a terceira casa decimal. */
const USD_MTOK_IN = 15;
function peso(f) {
  if (!f.tokens) return null;
  const usd = (f.tokens / 1e6) * USD_MTOK_IN;
  const faixa = usd >= 1 ? "pesado" : usd >= 0.35 ? "médio" : "leve";
  const cls = usd >= 1 ? "warn" : usd >= 0.35 ? "cold" : "ok";
  return { usd, faixa, cls, tokens: f.tokens };
}

/* O que o cartão diz do estado. Um sub-fluxo aparece `inativo` com execuções, e
   dizer só "inativo" ali seria mandar o Kauan procurar um gatilho que o fluxo
   não tem. */
function estadoTexto(f) {
  if (f.chamadores && f.chamadores.length) return "chamado por " + f.chamadores[0].nome;
  if (!f.active && f.exec24) return "chamado por outro fluxo";
  if (f.active && !f.exec24) return "ativo · sem execução na janela";
  return f.active ? "ativo" : "inativo";
}

function pontoStatus(f) {
  if (f.erro24) return "risk";
  if (f.exec24) return "ok";
  return "cold";
}

/* Qual nó pintar de vermelho no desenho. Só quando a falha é DESTE fluxo: o n8n
   reporta a falha de um filho no pai, então `error.node.name` rotineiramente
   nomeia um nó que não existe no fluxo que falhou. Pintar o nó errado é pior que
   não pintar nada — e é exatamente o erro que o quadro de falhas já cometeu uma
   vez, com o Kauan abrindo o editor e não achando o nó. */
function nosFalhos(f) {
  if (!f.falhas || !f.falhas.length) return new Set();
  const doGrafo = new Set((f.graph && f.graph.nos || []).map(n => n.nome));
  return new Set(f.falhas.filter(n => doGrafo.has(n)));
}

/* Um fluxo sem execução na janela entra, no fim, apagado. `GABI [Envio Manual]` é
   manual por definição; esconder seria a tela decidir que ele não existe. Mas ele
   não pode competir visualmente com um de 751. */
const morno = f => !f.exec24;

/* `[PROJETO] Nome` partido em dois, num lugar só. Nasceu dentro do `cartao()` e
   o seletor precisava do MESMO corte para poder buscar por projeto — e a segunda
   cópia da regex divergiria no primeiro fluxo que fugisse da convenção. */
function partesNome(nome) {
  const m = String(nome || "").match(/^\[([^\]]+)\]\s*(.*)$/);
  return { proj: m ? m[1] : null, nome: (m && m[2]) || String(nome || "") };
}

/* ═══════════════════ O SELETOR DE FLUXO — dois grupos, e o segundo é o motivo
 *
 * A vitrine já É um seletor: 11 cartões, todos visíveis numa tela. Filtrar 11
 * itens que você está olhando não vale um modal. O que vale é o que a grade NÃO
 * mostra: `S.fluxos` traz os 75 fluxos da instância e `naPorta` deixa 11 na tela,
 * então há 64 fluxos que hoje só se alcançam colando `?f=<id>` na URL — e para
 * isso é preciso saber o id.
 *
 * POR ISSO SÃO DOIS GRUPOS, e o de baixo é a razão de o seletor existir. Juntá-los
 * numa lista só seria mentir por omissão nos dois sentidos: o fluxo de 731
 * execuções e um `My workflow 3` apareceriam como iguais, e a resposta de "por que
 * este não está na grade?" — que é uma pergunta que a pessoa VAI fazer ao ver o
 * nome ali — não estaria em lugar nenhum. A nota do grupo é essa resposta.
 *
 * A ORDEM DE CADA GRUPO É A DECISÃO DE CADA UM. Em cima, `ordem` — a mesma da
 * grade, por execução, porque onde roda mais é onde um upgrade paga, e duas ordens
 * para a mesma lista faria o seletor discordar da tela atrás dele. Embaixo, por
 * NOME: são fluxos com zero execução, então ordená-los por execução seria ordenar
 * um empate de 64, e ali quem procura procura por nome.
 *
 * ABRIR UM FLUXO DE FORA DA PORTA FUNCIONA E NÃO É ACIDENTE: `render()` acha o
 * fluxo em `S.fluxos` inteiro (não no recorte da vitrine), e `irPara(id)` já pede
 * `pesar([id])` e `verDossie(id)` sob demanda — o peso e o dossiê daquele fluxo
 * chegam depois do clique, como chegariam pelo `?f=`. O que ele NÃO ganha é o selo
 * da varredura de boot, que só cobre a vitrine; ver `abrirSeletor`. */
const SELETOR_GRUPO = {
  vitrine: {
    titulo: "na vitrine",
    nota: n => "os " + n + " cartões da grade, na mesma ordem: por execução"
  },
  fora: {
    titulo: "fora da porta",
    nota: n => n + " fluxo(s) que a grade não mostra — não rodaram na janela, "
      + "não estão ativos e nenhum fluxo vivo os chama (ou têm nome de rascunho). "
      + "Dá para abrir: o peso e o dossiê são pedidos no clique."
  }
};

/* Puro sobre a lista de fluxos: nenhuma leitura de `S`, nenhum DOM. É isto que faz
   o agrupamento e as duas ordens serem testáveis sem navegador — mesma razão de
   `resolverAlvo` e `podeConversar` serem puros. */
function gruposDoSeletor(fluxos) {
  const todos = fluxos || [];
  const dentro = todos.filter(naPorta).slice().sort(ordem);
  const ids = new Set(dentro.map(f => String(f.id)));
  const fora = todos.filter(f => !ids.has(String(f.id)))
    .slice().sort((a, b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
  const grupos = [];
  if (dentro.length) grupos.push({ chave: "vitrine", fluxos: dentro });
  if (fora.length) grupos.push({ chave: "fora", fluxos: fora });
  return grupos;
}

/* ═══════════════════ O HISTÓRICO DE CONVERSAS — o juízo da gaveta ═══════════
 *
 * O servidor emite fatos por conversa: `{id, titulo, status, viva, em,
 * evidencias, alvo, rodadas, usd, usdDesconhecido, ultima, wfUpdatedAt}`. O que
 * cada estado SIGNIFICA, em que ordem a lista aparece, o que pede ação e o que a
 * frase diz é aqui.
 *
 * OITO ESTADOS, OITO FRASES, E NENHUM VERDE. Confirmar o alvo não aplicou nada —
 * a etapa do patch não existe — então `--ok` afirmaria um resultado que não houve.
 * `--accent` é movimento, `--warn` é o que pede ação, `--cold` o que parou,
 * `--risk` só o que quebrou sozinho.
 *
 * O oitavo é `interrompida`, e ele não estava no desenho aprovado: ele apareceu
 * porque a conversa é gravada JÁ em `correndo`, então o arquivo de uma conversa
 * que estava rodando quando o cockpit fechou fica dizendo `correndo` com nada
 * rodando. Cair em `cancelada` ("parada por você") seria acusá-lo de um clique que
 * ele não deu; cair em `falhou` gastaria vermelho em quem não quebrou sozinho. E as
 * duas frases levam a decisões OPOSTAS: numa não existe retomar, na outra a
 * rodada simplesmente não aconteceu e a saída é mandar a mensagem de novo. */
const ESTADO = {
  correndo:     { rot: "correndo agora",    frase: "a sessão está pensando neste momento" },
  aguardando:   { rot: "esperando você",    frase: "ela perguntou de volta e parou — é o estado mais fácil de esquecer" },
  alvo:         { rot: "alvo na mesa",      frase: "ela disse onde mexer e espera o seu ✓" },
  confirmado:   { rot: "alvo confirmado",   frase: "você confirmou o alvo; nada foi escrito no n8n" },
  cancelada:    { rot: "parada por você",   frase: "você apertou parar — não existe retomar, a saída é o compositor: manda a correção que a rodada recomeça com ela junto" },
  interrompida: { rot: "interrompida",      frase: "o cockpit fechou no meio de uma rodada, então ela não terminou e o gasto dela entrou como não medido — manda a mensagem de novo que ela recomeça" },
  falhou:       { rot: "quebrou",           frase: "a conversa quebrou sozinha" },
  semalvo:      { rot: "terminou sem alvo", frase: "acabou sem dizer onde mexer" }
};

/* QUAIS ESTADOS GANHAM BANDA, e em que cor. A `frase` acima só existe de verdade
 * por causa disto: até aqui `linhaConv` desenhava apenas o `rot`, e as oito frases
 * eram código morto — pior, eram uma SEGUNDA definição, porque a banda já dizia com
 * outras palavras o que `cancelada` e `falhou` dizem. Duas redações da mesma frase
 * divergem no primeiro ajuste feito num lado só; o `SCRATCH` desta página é a prova
 * viva disso.
 *
 * Quatro dos oito NÃO ganham banda, e a ausência é a decisão: `alvo` tem a faixa de
 * alvo logo acima, `aguardando` tem o compositor esperando, `confirmado` tem o
 * próprio ✓, `semalvo` não pede ação nenhuma. Banda nos oito seria tarja permanente,
 * que é a forma mais rápida de ensinar alguém a não ler tarja.
 *
 * `interrompida` é o que torna isto obrigatório em vez de bom: a palavra sozinha não
 * diz que a rodada recomeça mandando a mensagem de novo, e ninguém nunca viu esse
 * estado antes — ele nasceu nesta fatia. */
const ESTADO_BANDA = {
  correndo: "accent",
  interrompida: "cold",
  cancelada: "cold",
  falhou: "risk"
};

/* ══════════ A BATERIA DE SETE — as cinco cores e o que cada uma AUTORIZA ═════
 *
 * O servidor manda o veredito por linha; o que cada cor significa para quem está
 * decidindo é daqui. As cinco não são graus de uma mesma coisa: `cold` e `risk`
 * são opostos em consequência — um diz "não olhei", o outro diz "olhei e está
 * errado" — e o §5.3 existe porque tratá-los igual faria a aba nunca aplicar em
 * agente nenhum (63% dos fluxos desta instância caem em cinza no fantasma).
 *
 * O glifo fica com a cor cheia porque é forma; o texto usa `-txt`. Um estado
 * distinguido só por cor não existe para quem não a enxerga, então cada linha
 * carrega TAMBÉM o rótulo escrito. */
const BATERIA = {
  ok:     { gl: "✓", rot: "PASSOU" },
  warn:   { gl: "▲", rot: "RESSALVA" },
  risk:   { gl: "✕", rot: "REPROVOU" },
  accent: { gl: "◍", rot: "CONFERINDO" },
  cold:   { gl: "◌", rot: "NÃO CONFERI" }
};
/* Cor que o servidor mandou e esta tela não conhece vira `cold`, nunca verde: uma
   cor nova que caísse no ramo bom apagaria uma checagem inteira em silêncio. */
const corBateria = c => (BATERIA[c] ? c : "cold");

/* CINZA SEM MOTIVO É DEFEITO DO SERVIDOR, E A TELA NÃO PODE ENCOBRIR.
 *
 * "Não consegui conferir" e "conferi e passou" levam a decisões opostas. Uma linha
 * cinza calada é indistinguível de descuido — e o que ela precisa dizer é
 * exatamente que não sabe. Preencher com prosa genérica ("não aplicável") seria
 * inventar um motivo que ninguém mediu. */
const BAT_SEM_MOTIVO = "não veio o motivo — trate como NÃO conferido, não como aprovado";

/* Reanimar a cada evento do SSE é movimento sem informação nova atrás. A
   assinatura é número da linha + cor: mudou o veredito de alguma, acende de novo;
   é o mesmo repaint de sempre, fica parado. */
const assinBateria = b => (b && Array.isArray(b.linhas) ? b.linhas : [])
  .map(l => String(l && l.n) + ":" + corBateria(l && l.cor)).join("|");


/* `viva` é FATO do servidor: existe uma sessão RODANDO esta conversa neste
   processo agora. `correndo` sem `viva` é o processo que morreu no meio — e é a
   única inferência desta função, porque é a única que a página pode fazer sem
   perguntar nada. Um status que esta máquina não escreve cai em `semalvo`: as seis
   que ela escreve estão todas mapeadas, e `preparando` nunca chega ao disco
   porque conversa sem mensagem não é gravada. */
function estadoConv(c) {
  if (c.status === "correndo") return c.viva ? "correndo" : "interrompida";
  return ESTADO[c.status] ? c.status : "semalvo";
}
const pedeAcao = c => estadoConv(c) === "aguardando";
const esperando = cs => (cs || []).filter(pedeAcao).length;

/* Ordem: RECÊNCIA, e nada mais. Subir o que espera por ele reordenaria a lista
   embaixo do olho a cada rodada que termina — a mesma disciplina do `#feed-sel` do
   `flows.html`, que só rola quando a SELEÇÃO muda, nunca a cada poll. Quem acha o
   que espera é a pílula do cabeçalho, que é fato sobre o presente. */
function ordemConv(a, b) { return String(b.em || "").localeCompare(String(a.em || "")); }

/* O FLUXO MUDOU DEPOIS DESTA CONVERSA. Um alvo decidido na segunda contra um
   fluxo de quinta pode apontar para um nó que não existe mais, então isto tem de
   aparecer — mas NÃO bloqueia nada: é a mesma disciplina do semáforo do dossiê,
   divergência e nunca relógio. Ausência de carimbo de um dos dois lados não é
   divergência: é não saber, e afirmar mudança sem saber mandaria ele conferir um
   fluxo que está igual. */
function fluxoMudou(c, f) {
  const antes = c && c.wfUpdatedAt, agora = f && f.updatedAt;
  if (!antes || !agora) return false;
  return String(antes) !== String(agora);
}

/* O filtro por palavra. Bate no TÍTULO e na última mensagem — as duas coisas que
   a linha mostra. Filtrar por algo que não está na tela devolveria uma lista que
   não dá para conferir. Sem acento e sem caixa: ele digita "saudacao". */
const semAcento = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function passaFiltroConv(c, q) {
  const t = semAcento(q).trim();
  if (!t) return true;
  return semAcento(c.titulo).includes(t) || semAcento(c.ultima || "").includes(t);
}

/* `+ nova conversa`: uma roda por vez em TODA a aba, então o botão diz qual está
   ocupando em vez de deixar o 409 aparecer depois do clique. O clique já custou a
   decisão de clicar, e um erro que só chega depois dele ensina a não confiar no
   botão. Três respostas, porque são três situações: livre, ocupada por uma
   conversa deste fluxo, ocupada por outra do fluxo tal. */
function podeNova(hist, wfNome) {
  const a = hist && hist.ativa;
  if (!a) return { pode: true, porque: "" };
  if (String(a.wfNome || "") === String(wfNome || "")) {
    return { pode: false, porque: "uma conversa deste fluxo está rodando — pare ela (Esc) ou espere a rodada acabar" };
  }
  return { pode: false, porque: "uma conversa do fluxo «" + (a.wfNome || a.wfId) + "» está rodando; uma por vez em todo o cockpit" };
}

/* Quando. Relativo, porque a pergunta é "isto é de hoje?" e não "que horas eram".
   A hora absoluta continua no `criadaEm`, que a linha não mostra. */
function quandoConv(iso) {
  const d = new Date(iso || 0);
  if (!iso || isNaN(d)) return "?";
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const seg = (Date.now() - d.getTime()) / 1000;
  if (seg < 90) return "agora";
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dia = new Date(d); dia.setHours(0, 0, 0, 0);
  const atras = Math.round((hoje - dia) / 86400000);
  if (atras <= 0) return "hoje " + hm;
  if (atras === 1) return "ontem " + hm;
  if (atras < 7) return ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][d.getDay()] + " " + hm;
  return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
}

/* ═══════════════════════════════ fim do bloco de juízo ═══════════════════════ */

/* `?f=<id>` abre direto na tela de um fluxo, mesma razão do `?s=` do Tester: uma
   tela que custa cliques para alcançar precisa de endereço. Vale também para
   captura headless, que não tem como clicar. O id é validado com a mesma forma
   que o servidor exige — um `?f=` inventado não pode virar uma tela em branco sem
   explicação. */
const fDaUrl = (() => {
  const v = new URLSearchParams(location.search).get("f");
  return v && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : null;
})();

/* `?c=<conversa>` ao lado do `?f=`, e pelo mesmo motivo: uma conversa que custou
   minutos e cota precisa de endereço, e um F5 no meio tem de voltar para ela. A
   forma é a mesma que o servidor exige do id de sessão — um `?c=` inventado não
   pode virar tela em branco sem explicação.
   PENDÊNCIA DECLARADA: `?c=` sozinho, sem `?f=`, é ignorado. O arquivo da conversa
   sabe o `wfId` e daria para resolver, mas isso é rota nova; ignorar é honesto
   enquanto não virar tela vazia calada, e a vitrine é o que aparece. */
const cDaUrl = (() => {
  const v = new URLSearchParams(location.search).get("c");
  return v && /^u[a-z0-9]{1,32}$/.test(v) ? v : null;
})();

/* QUAL DOS TRÊS LAYOUTS ESTÁ NO AR.
 *
 * `?layout=duas|pilha|foco` troca sem editar nada — é assim que os três foram
 * comparados em print, e é por isso que não existe um gerador de preview para esta
 * tela: cada variante está a uma URL de distância na tela de verdade, e uma cópia
 * num arquivo separado só teria a chance de divergir dela. Mesma razão pela qual o
 * preview do filtro do feed foi apagado depois de servir. */
const LAYOUTS = ["duas", "pilha", "foco"];
/* `duas` é o padrão porque a altura é o que a conversa e o alvo pedem: medido a
   1460×900, ela dá 593px de caixa de desenho (contexto vertical de um alvo e dos
   ramos que saem dele) contra 295px da `pilha`, e 546px de compositor contra os
   322px apertados da `foco`. A `pilha` mostra 13 nós de uma vez em vez de 8 — é a
   melhor para LER o fluxo inteiro, e é uma URL de distância. */
const LAYOUT_PADRAO = "duas";
const LAYOUT = (() => {
  const v = new URLSearchParams(location.search).get("layout");
  return LAYOUTS.includes(v) ? v : LAYOUT_PADRAO;
})();

/* O JUÍZO DO TUTORIAL saiu deste bloco e mora no `/tutorial.js` servido:
 * `estadoDe` (os quatro estados, PURA), o `já vi` em `localStorage`, o `mm:ss`, o
 * pulo de 10s e a tabela de atalhos. Ele é julgamento e continua num bloco só —
 * só que num bloco compartilhado pelas três páginas que têm tutorial, porque três
 * definições de `o convite pode aparecer?` divergiriam no primeiro conserto feito
 * de um lado só, e o lado que divergisse ofereceria um play que não toca.
 *
 * O que é DESTA tela — o slug, os três marcos do vídeo dela, o fim da frase do
 * convite — chega por `TUT().configurar` logo abaixo do `IO().configurar`. */

const S = { fluxos: null, erro: null, sel: fDaUrl, peso: new Map(), convId: null, conv: null, es: null,
  /* O TUTORIAL não tem campo aqui: o estado dele (a resposta do ledger, o player
     aberto, o `já vi` desta sessão) vive dentro do `/tutorial.js` servido, que é
     igualmente fora do DOM e não obriga três páginas a declarar os mesmos três
     campos. Quem pergunta se o player está aberto chama `TUT().aberto()`. */
  // a câmera do desenho, e o observador que a repinta quando a caixa muda de tamanho
  cam: null, camObs: null,
  /* O NÓ DO PALCO, preservado entre repaints — mesma razão da gaveta e do overlay
     da verificação, e o maior ganho dos três. Medido: o palco do Iago são 184 nós
     e 220 arestas, que viram 97KB de string e 1.140 elementos SVG; `render()`
     roda a cada evento de `atividade`, que chega VÁRIAS VEZES POR SEGUNDO durante
     uma rodada. Dentro do HTML de `telaFluxo()` isso era 97KB montados e
     re-parseados a cada um desses eventos.
     `palcoAssin` é o que o desenho MOSTRA (alvo aceso, nós falhos); `palcoGrafo`
     é a identidade do objeto do grafo, comparada à parte porque duas contagens de
     nó podem coincidir e o objeto não. */
  palcoEl: null, palcoAssin: null, palcoGrafo: null,
  // quantas mensagens a tela já rolou até o fim — ver `rolarConversa`
  chatVisto: 0,
  /* O SELETOR DE FLUXO, aberto ou não. Ele carrega o próprio nó, o retrato da lista
     e o cursor: `null` é fechado, e é isso que a cadeia do Esc consulta para saber
     se aquela tecla é dela ou do `parar()`. */
  seletor: null,
  /* O VISOR DO ANEXO, aberto ou não. Guarda o próprio véu, os irmãos que ele
     marcou `inert` e o `<a>` que o abriu — `null` é fechado, e é isso que a
     cadeia do Esc consulta para saber de quem é aquela tecla. Ele vive em `S`
     e não no DOM pela mesma razão da gaveta e do seletor: `render()` reescreve
     o `#app` a cada evento do SSE, e a conversa repinta várias vezes por
     segundo enquanto uma rodada corre. */
  visor: null,
  /* Disparo único: a mensagem que ELE acabou de mandar desce a conversa mesmo que
     ele estivesse lendo lá em cima. Mandar é um ato deliberado — não ver a própria
     frase entrar é a tela parecendo não ter respondido. Vale só para a mensagem
     dele; as que chegam sozinhas obedecem à regra de `rolarConversa`. */
  rolForcar: false,
  // o estado do dossiê por fluxo, e o timer que acompanha uma escrita em curso
  /* `dossiePollDe` é DE QUAL FLUXO o timer acima está perguntando. Sem ele não há
     como distinguir "já estou acompanhando este" de "estou acompanhando outro", e a
     telinha, o clique e a varredura reiniciariam o laço um por cima do outro — cada
     reinício zerando a janela de corrida, ou seja um poll que nunca termina. */
  dossie: new Map(), dossiePoll: null, dossiePollDe: null,
  /* O SEMÁFORO DA VITRINE — a varredura de todos os cartões. É um segundo mapa e
     não o `dossie` acima de propósito: a fatia que a varredura devolve não tem
     `nos`, `bytes`, `paragrafos` nem `preco`, então `faixaDossie` e `botaoDossie`
     desenhariam "undefined parágrafos" e um botão de escrever sem preço. Duas
     FORMAS, uma definição de cor — e `verDossie` copia a fatia para cá justamente
     para que os dois mapas não envelheçam separados.
     `vitMeta` é `null` até a varredura responder: ausente é o terceiro estado, e
     nele o selo diz "conferindo", nunca "sem dossiê". */
  dossieVit: new Map(), dossieVitMeta: null,
  /* O HISTÓRICO. `hist` é `null` até a resposta chegar — nunca `{conversas:[]}`,
     porque "ainda não perguntei" e "não existe nenhuma" levam a frases diferentes
     e esta casa já leu ausência como negativa três vezes. `histErro` é a terceira
     frase: não consegui ler.
     `gavEl` é o NÓ da gaveta, guardado entre repaints de propósito — ver
     `pintarGaveta`. `gavCur` é o cursor do teclado, que não é a seleção. */
  hist: null, histErro: null, histDe: null,
  gaveta: false, gavEl: null, gavFiltro: "", gavCur: -1, gavAssin: "",
  // `?c=` de uma conversa que foi apagada: estado próprio, frase própria.
  convApagada: null,
  /* Qual das duas propostas está na tela (§5.7.2) e a assinatura da bateria já
     acesa. As duas vivem em `S` porque o SSE repinta esta coluna várias vezes por
     segundo: no DOM, a escolha se perderia a cada evento e as linhas reanimariam
     sem nada novo atrás. `qualPatch` nasce em `normal` de propósito — ver
     `patchAtivo`. */
  qualPatch: "normal", batAssin: "",
  /* O overlay da verificação. Guardado em `S` e não no DOM pela mesma razão que
     a gaveta: `render()` reescreve o `#app` a cada evento do SSE. `verifEl` é o
     nó preservado, `verifAssin` decide se as sete reacendem, e `verifDe` é o ID
     do botão que abriu — id, não nó, porque o nó já terá sido descartado. */
  verif: false, verifEl: null, verifAssin: "", verifDe: null,
  /* O RASCUNHO DO COMPOSITOR. Vive aqui e não só no DOM porque o `#cp` pode SAIR
     do documento no meio de uma frase: o fluxo é editado no n8n, o refetch pega a
     divergência, o dossiê vira vermelho e a trava troca o campo por um bloco. Nesse
     repaint o `restaurarInputs` não tem onde devolver o texto — não é que ele erre,
     é que o campo não existe mais. Guardado, volta sozinho quando o campo volta.
     Ver `capturarInputs`. */
  rascunho: "",
  /* VOZ E ANEXO — o estado que o `/entradas.js` lê e escreve.
     `bandeja` é o recibo dos arquivos que já estão no servidor ANTES de a conversa
     existir: aqui a sessão só nasce na primeira mensagem, então anexar antes dela
     não tem id para pendurar nada. `anexosPre` é o que desenhar nesse meio-tempo;
     `anexoErro` é o resumo da última recusa, que tem de aparecer porque um arquivo
     que sumiu sem explicação é pior que um arquivo negado. `ouvindo`/`parcial`/`rec`
     são o microfone. */
  bandeja: null, anexosPre: [], anexoErro: null, subindo: 0,
  ouvindo: false, parcial: "", rec: null,
  /* A TIRA DE ANEXOS ABERTA OU RECOLHIDA. Vive aqui e não no DOM pela mesma razão
     que o `rascunho`, a gaveta e o seletor: `render()` reescreve o `#app` a cada
     evento do SSE, e essa coluna repinta VÁRIAS VEZES POR SEGUNDO enquanto uma
     rodada corre. Num `<details>` nativo ele abriria a tira e ela se fecharia
     sozinha no evento seguinte — que é exatamente por que `entradas.js` pede o
     estado por parâmetro em vez de guardá-lo. Nasce recolhida: a tira existe para
     TIRAR o chip de cima do compositor, e nascer aberta desfaria o conserto. */
  gavetaAnexos: false,
  /* A TELINHA DE PROGRESSO DO DOSSIÊ, aberta ou não. Mesmo formato do `seletor` e
     do `visor`: `null` é fechada, e é isso que a cadeia do Esc consulta para saber
     de quem é a tecla. Ela nasce em `document.body`, fora do `#app`, então
     `render()` não a alcança — quem a atualiza é `pintarProgresso()`. */
  prog: null };
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => new Intl.NumberFormat("pt-BR").format(n || 0);
const usdTxt = v => "US$" + v.toFixed(2).replace(".", ",");
const curto = t => String(t || "").replace("n8n-nodes-base.", "").replace(/^@n8n\/n8n-nodes-langchain\./, "");

/* ════════════════════════════ VOZ E ANEXOS: O MÓDULO SERVIDO ════════════════
 *
 * O bloco inteiro — os botões `⊕ anexar` / `⊞ pasta`, o ditado do navegador, os
 * chips, o agrupamento de recusas — vive em `/entradas.js`, servido a esta página
 * e ao `/tester`. Não é cópia: esta base já carrega três blocos copiados à mão
 * (topbar, `.aviso`, modo gravação) e um deles produziu um `Illegal return
 * statement` no `flows.html` porque alguém INSERIU em vez de SUBSTITUIR.
 * `entradas-test.js` falha no dia em que uma das duas páginas voltar a declarar o
 * bloco por conta própria.
 *
 * O script dele NÃO é deferido (ver o `<head>`): um script inline roda antes dos
 * deferidos, e `configurar()` receberia `undefined`. `IO()` lê na hora do uso —
 * é assim que o teste injeta o módulo de verdade em vez de uma cópia. */
const IO = () => window.__entradas;
/* O tutorial vem pelo mesmo caminho e pela mesma razão. `TUT()` em vez de uma
   referência guardada: o script dele também não é deferido, e ler na hora do uso
   é o que permite a um teste trocar o módulo. */
const TUT = () => window.__tutorial;

/* O que esta página dá ao módulo: o estado, o vocabulário de aviso, o `callApi`
   que já sabe reconhecer um 404 de processo velho, e as ROTAS — que são a única
   coisa que a distingue do Tester. `aoSnapshot` existe porque cada página guarda
   a volta num lugar diferente: aqui é `S.conv`, lá é `S.snap`. */
IO().configurar({
  estado: S, avisar, callApi,
  rotas: {
    bandeja: "/api/upgrade/anexo",
    bandejaRemover: "/api/upgrade/anexo/remover",
    sessao: id => "/api/upgrade/sessao/" + encodeURIComponent(id) + "/anexo",
    sessaoRemover: id => "/api/upgrade/sessao/" + encodeURIComponent(id) + "/desanexar"
  },
  aoSnapshot: snap => { S.conv = snap; }
});

/* O QUE ESTA TELA DÁ AO TUTORIAL. Só o que é dela: o slug, o nome da aba para o
   rótulo de leitor de tela, os TRÊS MARCOS DESTE vídeo — na ordem em que aparecem
   nele, e é a informação que decide se vale clicar — e a `cauda`, que é o fim da
   frase do convite. A frase inteira mora no módulo, numa definição só; cada aba
   diz apenas onde ela termina, porque três páginas montando a frase inteira é a
   divergência de sempre. */
TUT().configurar({
  slug: "upgrade", aba: "Upgrade", callApi, render,
  cauda: "do primeiro clique até o botão que escreve",
  marcos: [
    ["escolher", "o fluxo que vale mexer, e por quê"],
    ["pedir", "a melhoria em português, sem tocar em JSON"],
    ["decidir", "com o diff e as nove conferências na frente"]
  ]
});

/* DE ONDE SAEM OS CHIPS, e são duas fontes porque são dois momentos.
   Antes da primeira mensagem a conversa não existe e os arquivos estão na
   BANDEJA (`S.anexosPre`); depois dela o dono é a sessão, e a lista vem no
   snapshot. Uma fonte só obrigaria a página a adivinhar em qual dos dois está. */
const anexosAgora = () => (S.convId && S.conv ? (S.conv.anexos || []) : (S.anexosPre || []));
/* `lidos` só existe com sessão: é observação do `tool_use` dela. Na bandeja
   ninguém abriu nada ainda, e marcar chip ali seria promessa, não fato. */
const lidosAgora = () => (S.convId && S.conv && S.conv.anexosLidos) || [];

/* `Math.round(t/1000)` vira **0k** num fluxo de 2 nós, e "0k tok" afirma que ler
   aquele fluxo é grátis — não é, é só barato. Abaixo de mil o número certo é
   "<1k", que diz pequeno sem dizer zero. Mesma família do `usd: 0` de rodada
   morta: arredondar para zero é a única direção em que o erro mente. */
const milTok = t => t < 1000 ? "<1k" : Math.round(t / 1000) + "k";

/* Nunca `res.json()` cru nestas rotas. Um processo velho responde `404` como
   corpo de texto, `JSON.parse("404")` é um NÚMERO válido, e a página passa a
   tratar 404 como objeto de estado — foi assim que ela já disse
   "CLI não encontrado em undefined" por causa de um Node que não tinha
   reiniciado. Corpo que não é objeto simples é erro, e 404 tem nome próprio. */

/* Copiado do `tester.html`, byte a byte — ver a nota no CSS acima.
   Nenhum `confirm()` nativo neste projeto: ele chega como "localhost:4317 diz",
   com a fonte do sistema, e não sabe distinguir ação destrutiva de reversível. */
function confirmar({ tag, titulo, corpo, botao, perigo }) {
  return new Promise(resolve => {
    const abriu = document.activeElement;
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML =
      '<div class="cfm" role="dialog" aria-modal="true" aria-labelledby="cfm-t" aria-describedby="cfm-b">' +
        '<div class="cfm-hd"><span class="ix">[ ' + esc(tag || "CONFIRMAR") + " ]</span></div>" +
        '<h2 class="cfm-t" id="cfm-t">' + esc(titulo) + "</h2>" +
        '<div class="cfm-b" id="cfm-b">' + (corpo || []).map(p => "<p>" + esc(p) + "</p>").join("") + "</div>" +
        '<div class="cfm-acts">' +
          '<button type="button" class="btn" data-r="0">Cancelar</button>' +
          '<button type="button" class="btn ' + (perigo ? "perigo" : "prime") + '" data-r="1">' + esc(botao) + "</button>" +
        "</div>" +
      "</div>";

    const irmaos = [...document.body.children];
    for (const el of irmaos) el.setAttribute("inert", "");
    document.body.appendChild(scrim);

    const fechar = v => {
      document.removeEventListener("keydown", onKey, true);
      scrim.remove();
      for (const el of irmaos) el.removeAttribute("inert");
      if (abriu && abriu.isConnected) abriu.focus();
      resolve(v);
    };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); fechar(false); return; }
      if (e.key !== "Tab") return;
      // Ciclo fechado entre os dois botões: o `inert` já tirou o resto da
      // página da ordem de tabulação, isto só impede a saída pelo browser.
      const fs = [...scrim.querySelectorAll("button")];
      const i = fs.indexOf(document.activeElement);
      e.preventDefault();
      fs[(i + (e.shiftKey ? -1 : 1) + fs.length) % fs.length].focus();
    };

    scrim.addEventListener("click", e => { if (e.target === scrim) fechar(false); });
    scrim.querySelectorAll("[data-r]").forEach(b =>
      b.addEventListener("click", () => fechar(b.dataset.r === "1")));
    document.addEventListener("keydown", onKey, true);

    // Destrutivo abre com o foco no Cancelar; reversível, no botão de ação.
    scrim.querySelector(perigo ? '[data-r="0"]' : '[data-r="1"]').focus();
  });
}

/* ========================================================== avisar / aviso
   A única forma de o sistema dizer alguma coisa. Ver o bloco AVISOS no CSS.

   `avisoHtml()` monta o cartão (usado ancorado, dentro de outro render) e
   `avisar()` o coloca na pilha flutuante. Quem chama escolhe o TIPO, e o tipo é
   que decide o resto — inclusive se a mensagem some sozinha.

   Três coisas aqui são acessibilidade, não estilo, e não devem ser cortadas:
   erro entra como `role="alert"` + `aria-live="assertive"` (o leitor de tela
   interrompe, porque a ação falhou e quem está ouvindo precisa saber agora);
   ok/info entram como `role="status"` + `polite` (não interrompem nada); e o
   glifo é `aria-hidden`, porque a cor e o desenho não são a informação — o texto
   é. Um aviso que só se distingue por cor não existe para quem não a vê. */
const AVISO_GLIFO = { erro: "✕", alerta: "!", ok: "✓", info: "i" };
const AVISO_VIDA = { ok: 4500, info: 6000 };   // erro e alerta não somem sozinhos
// Quanto a pausa por hover pode esticar a vida, no máximo. Ver `avisar()`.
const VIDA_MAX_PAUSA = 20000;

function avisoHtml(msg, tipo, titulo) {
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  return '<div class="aviso ' + t + '" role="' + (t === "erro" ? "alert" : "status") + '">' +
    '<span class="ai" aria-hidden="true">' + AVISO_GLIFO[t] + "</span>" +
    '<span class="ac">' + (titulo ? '<span class="at">' + esc(titulo) + "</span>" : "") + esc(msg) + "</span>" +
    "</div>";
}

function pilhaAvisos() {
  let p = document.querySelector(".avisos");
  if (p) return p;
  p = document.createElement("div");
  p.className = "avisos";
  document.body.appendChild(p);
  return p;
}

function avisar(msg, tipo, titulo) {
  if (!msg) return null;
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  const vida = AVISO_VIDA[t] || 0;
  const pilha = pilhaAvisos();

  /* Montado por DOM, nunca por `innerHTML`. Duas razões: a mensagem vem de erro
     de servidor e de nome de arquivo, ou seja de fora, e `textContent` fecha essa
     porta sem depender de ninguém lembrar de escapar; e assim este bloco é
     idêntico nas três páginas — o `flows.html` não tem `esc()`. */
  const cartao = document.createElement("div");
  cartao.className = "aviso " + t;
  cartao.setAttribute("role", t === "erro" ? "alert" : "status");
  cartao.setAttribute("aria-live", t === "erro" ? "assertive" : "polite");

  const gl = document.createElement("span");
  gl.className = "ai"; gl.setAttribute("aria-hidden", "true"); gl.textContent = AVISO_GLIFO[t];
  const corpo = document.createElement("span");
  corpo.className = "ac";
  if (titulo) {
    const tt = document.createElement("span");
    tt.className = "at"; tt.textContent = titulo;
    corpo.appendChild(tt);
  }
  corpo.appendChild(document.createTextNode(msg));
  const fechar = document.createElement("button");
  fechar.type = "button"; fechar.className = "ax";
  fechar.setAttribute("aria-label", "fechar aviso"); fechar.textContent = "×";
  cartao.append(gl, corpo, fechar);
  if (vida) {
    const barra = document.createElement("span");
    barra.className = "abar"; barra.setAttribute("aria-hidden", "true");
    barra.style.animationDuration = vida + "ms";
    cartao.appendChild(barra);
  }

  const sair = () => {
    if (!cartao.isConnected) return;
    cartao.dispatchEvent(new Event("aviso:fim"));
    cartao.classList.add("saindo");
    // Espera a animação de saída, mas nunca depende dela: `setTimeout` remove de
    // qualquer forma, senão um `prefers-reduced-motion` que zera a duração
    // deixaria o cartão pendurado para sempre.
    setTimeout(() => cartao.remove(), 200);
  };
  fechar.addEventListener("click", sair);
  if (vida) {
    let timer = setTimeout(sair, vida);
    /* O mouse em cima pausa a contagem: ler uma frase de 12 palavras leva mais
       que 4,5s, e ver o aviso fugir debaixo do cursor é o pior defeito de toast.
       Mas a pausa tem TETO — medido no verificador: um aviso que nasce debaixo de
       um cursor parado nunca recebe `mouseleave` e ficaria na tela para sempre,
       o que transforma um aviso temporário em sujeira permanente. */
    const tetoDuro = setTimeout(sair, vida + VIDA_MAX_PAUSA);
    const barra = () => cartao.querySelector(".abar");
    cartao.addEventListener("mouseenter", () => {
      clearTimeout(timer);
      const b = barra(); if (b) b.style.animationPlayState = "paused";
    });
    cartao.addEventListener("mouseleave", () => {
      timer = setTimeout(sair, 1200);
      const b = barra(); if (b) b.style.animationPlayState = "running";
    });
    // Fechar pela mão limpa os dois: sem isto o teto duro chamaria `sair()` num
    // cartão já removido — inócuo hoje, e o tipo de coisa que deixa de ser.
    cartao.addEventListener("aviso:fim", () => { clearTimeout(timer); clearTimeout(tetoDuro); });
  }

  pilha.appendChild(cartao);
  // Teto de 4 na tela. Sem ele, uma pasta com oito arquivos recusados vira uma
  // coluna de avisos que cobre a página inteira — e o oitavo esconde o primeiro.
  const todos = [...pilha.querySelectorAll(".aviso")];
  if (todos.length > 4) todos.slice(0, todos.length - 4).forEach(x => x.remove());
  return cartao;
}

async function callApi(url, opts) {
  const res = await fetch(url, opts);
  let corpo = null;
  try { corpo = JSON.parse(await res.text()); } catch { corpo = null; }
  if (res.status === 404) {
    throw new Error("esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js");
  }
  if (!corpo || typeof corpo !== "object" || Array.isArray(corpo)) {
    throw new Error("o servidor respondeu algo que não é um objeto (status " + res.status + ")");
  }
  if (!res.ok) {
    const err = new Error(corpo.error || ("falhou com status " + res.status));
    /* DUAS COISAS ATRAVESSAM O ERRO, e as duas são de anexo.
       `categoria` é o que faz o `avisarRecusas` do `/entradas.js` AGRUPAR: sem
       ela toda recusa de um lote cai em «formato», e uma pasta com uma chave
       dentro diria «3 tipos que eu não abro» — falso, e falso na direção que
       convida a converter a chave para um formato aceito.
       `bandeja` porque o servidor CRIA a bandeja mesmo quando recusa o arquivo:
       sem trazer o id de volta, um lote cujo primeiro arquivo é recusado deixa
       uma bandeja vazia órfã e o próximo arquivo abre outra. */
    if (corpo.categoria) err.categoria = corpo.categoria;
    if (corpo.bandeja) err.bandeja = corpo.bandeja;
    throw err;
  }
  return corpo;
}

/* ------------------------------------------------------------ o desenho ---- */

const NODE = 84, LABEL_GAP = 12;
const ICON = {
  webhook: "M8 12a4 4 0 1 1 8 0M6 18h12M12 8v-2",
  set: "M4 8h16M4 14h10M4 20h6",
  supabase: "M12 3v18M6 7l6-4 6 4v10l-6 4-6-4z",
  if: "M6 4v6a4 4 0 0 0 4 4h8M18 10l3 4-3 4",
  switch: "M6 4v6a4 4 0 0 0 4 4h8M18 10l3 4-3 4",
  noOp: "M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z",
  code: "M9 8l-4 4 4 4M15 8l4 4-4 4",
  clickUp: "M5 14l7-7 7 7M8 19h8",
  slack: "M7 5h10M5 9v8M19 9v8M7 21h10M9 9h6v6H9z",
  whatsApp: "M4 20l1.6-4A8 8 0 1 1 12 20H4z",
  httpRequest: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18",
  redis: "M4 7l8-3 8 3-8 3-8-3zM4 12l8 3 8-3M4 17l8 3 8-3",
  gmail: "M3 7h18v10H3zM3 7l9 6 9-6",
  googleSheets: "M5 3h14v18H5zM9 8h6M9 12h6M9 16h6",
  wait: "M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM12 9v3l2 2",
  merge: "M6 5v5a4 4 0 0 0 4 4h8M6 19v-5",
};

/* Miniatura do cartão: a posição REAL dos nós, normalizada pela caixa. Não é
   enfeite — você reconhece o fluxo pela forma antes de ler o nome. */
function mini(f, w, h) {
  const g = f.graph;
  if (!g || !g.nos || !g.nos.length) return '<span class="carregando">[ desenhando… ]</span>';
  const falhos = nosFalhos(f);
  const pts = g.nos.map(n => [n.x, n.y]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = 6;
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const sx = (x1 - x0) || 1, sy = (y1 - y0) || 1;
  const k = Math.min((w - pad * 2) / sx, (h - pad * 2) / sy);
  const cx = p => pad + (p[0] - x0) * k + ((w - pad * 2) - sx * k) / 2;
  const cy = p => pad + (p[1] - y0) * k + ((h - pad * 2) - sy * k) / 2;
  const r = g.nos.length > 80 ? 1.6 : g.nos.length > 30 ? 2.2 : 3;

  const idx = new Map(g.nos.map((n, i) => [n.nome, i]));
  const linhas = (g.arestas || []).map(a => {
    const A = pts[idx.get(a.de)], B = pts[idx.get(a.para)];
    if (!A || !B) return "";
    return '<line x1="' + cx(A).toFixed(1) + '" y1="' + cy(A).toFixed(1)
      + '" x2="' + cx(B).toFixed(1) + '" y2="' + cy(B).toFixed(1) + '"/>';
  }).join("");

  const caixas = g.nos.map((n, i) => {
    const p = pts[i];
    return '<rect class="' + (falhos.has(n.nome) ? "falhou" : "") + '" x="' + (cx(p) - r).toFixed(1)
      + '" y="' + (cy(p) - r).toFixed(1) + '" width="' + (r * 2) + '" height="' + (r * 2)
      + '" rx="' + (r / 2.5).toFixed(1) + '"/>';
  }).join("");

  return '<svg class="mini" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="forma do fluxo '
    + esc(f.nome) + '"><g class="mw">' + linhas + '</g><g class="mn">' + caixas + "</g></svg>";
}

/* O palco: nó de 84×84 com rótulo fora e abaixo, o vocabulário do `flows.html`.
   `acesos` são os nós que um patch tocaria — vazio até a conversa existir. */
function palco(g, acesos, falhos) {
  if (!g || !g.nos || !g.nos.length) return '<div class="vazio">sem desenho</div>';
  const porNome = new Map(g.nos.map(n => [n.nome, n]));
  const xs = g.nos.map(n => n.x), ys = g.nos.map(n => n.y);
  /* A folga horizontal é MAIOR que a vertical porque o rótulo é centrado no nó e
     transborda para os dois lados: com `pad` igual, o nome do nó mais à esquerda
     saía cortado pela borda do viewBox — medido, `trigger_webhook_…` aparecia
     como `jger_webhook_…`, que parece nome de nó e é recorte. */
  const padX = 118, padY = 30;
  const x0 = Math.min.apply(null, xs) - padX, y0 = Math.min.apply(null, ys) - padY;
  const vw = Math.max.apply(null, xs) - x0 + NODE + padX;
  const vh = Math.max.apply(null, ys) - y0 + NODE + LABEL_GAP + 44 + padY;
  const cx = n => n.x - x0, cy = n => n.y - y0;

  const wires = (g.arestas || []).map(a => {
    const A = porNome.get(a.de), B = porNome.get(a.para);
    if (!A || !B) return "";
    const x1 = cx(A) + NODE, y1 = cy(A) + NODE / 2;
    const x2 = cx(B), y2 = cy(B) + NODE / 2;
    const dx = Math.max(46, Math.abs(x2 - x1) * 0.5);
    return '<path class="pw" d="M' + x1 + " " + y1 + " C" + (x1 + dx) + " " + y1 + " "
      + (x2 - dx) + " " + y2 + " " + x2 + " " + y2 + '"/>'
      + '<path class="pah" d="M' + (x2 - 9) + " " + (y2 - 5) + " L" + x2 + " " + y2
      + " L" + (x2 - 9) + " " + (y2 + 5) + '"/>';
  }).join("");

  const caixas = g.nos.map(n => {
    const cls = "pn" + (acesos.has(n.nome) ? " on" : "") + (falhos.has(n.nome) ? " falhou" : "");
    const d = ICON[curto(n.tipo)] || "M7 12h10";
    const rot = n.nome.length > 15 ? n.nome.slice(0, 14) + "…" : n.nome;
    // `data-x`/`data-y` existem para a câmera poder voar até um nó sem redescobrir
    // a posição: ler do DOM é ler o mesmo número que desenhou a caixa, então as
    // duas nunca discordam.
    return '<g class="' + cls + '" data-x="' + cx(n) + '" data-y="' + cy(n)
      + '" transform="translate(' + cx(n) + "," + cy(n) + ')">'
      + '<rect class="pnf" width="' + NODE + '" height="' + NODE + '" rx="15"/>'
      + '<g class="pni" transform="translate(' + (NODE / 2 - 12) + "," + (NODE / 2 - 16)
      + ')" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="' + d + '"/></g>'
      + '<text class="pnm" x="' + NODE / 2 + '" y="' + (NODE + LABEL_GAP + 12) + '">' + esc(rot) + "</text>"
      + '<text class="pnt" x="' + NODE / 2 + '" y="' + (NODE + LABEL_GAP + 34) + '">' + esc(curto(n.tipo))
      + (n.sub ? " · " + esc(n.sub) : "") + "</text></g>";
  }).join("");

  /* O `viewBox` nasce cabendo tudo e é substituído por `montarCamera()` logo
     depois — assim o desenho existe mesmo que o script da câmera não rode, em vez
     de a caixa ficar em branco. `data-vw/vh` é o mundo, e é o que a câmera limita. */
  return '<div class="palco-box"><svg class="palco" tabindex="0" viewBox="0 0 ' + vw + " " + vh
    + '" data-vw="' + vw + '" data-vh="' + vh + '"'
    + ' role="img" aria-label="o fluxo desenhado, ' + g.nos.length
    + ' nós — arraste para andar, roda ou + e − para aproximar">' + wires + caixas + "</svg>"
    + '<div class="cam">'
    + (acesos.size ? '<button type="button" class="alvo" id="cam-alvo" title="voltar para o alvo">◎ alvo</button>' : "")
    + '<button type="button" id="cam-caber" title="ver o fluxo inteiro">⤢ caber</button>'
    + '<button type="button" id="cam-mais" title="aproximar" aria-label="aproximar">+</button>'
    + '<button type="button" id="cam-menos" title="afastar" aria-label="afastar">−</button></div>'
    + '<div class="cam-dica">arraste para andar · roda para aproximar</div>'
    + '<div class="cam-esc" id="cam-esc"></div></div>';
}

/* A CÂMERA DO DESENHO — porque aumentar a tela não resolve, e isso foi medido.
 *
 * O fluxo do Iago são 184 nós num retângulo de 24064×3368 unidades: razão 7,14.
 * Encaixado por largura, cada nó rende 84·(largura/24064) — 2,4px numa coluna de
 * 700px e 5,2px na largura inteira de 1500px; o nome do nó, 20 unidades, sai a
 * 0,6px e 1,2px. Dobrar a tela leva o nó de 2,4 para 5,2 pixels e continua não
 * dando para ler nada. Quem resolve é escala própria mais poder andar.
 *
 * Duas escalas nomeadas, e ambas são decisão, não constante técnica:
 *   ESC_FORMA — daqui o nó se reconhece COMO nó (caixa e ícone).
 *   ESC_NOME  — daqui o NOME do nó se lê (a fonte de 20 unidades passa de 10px).
 *
 * A abertura sai disso. Se caber inteiro já passa de ESC_FORMA, abre cabendo: a
 * forma do fluxo é a informação mais útil que existe de graça. Se não passa, abre
 * em ESC_NOME na ENTRADA do fluxo — um desenho de 5px é uma imagem de poeira e
 * parece página quebrada, e o gatilho é o lugar por onde se lê um fluxo. E quando
 * a conversa acende um alvo, a câmera vai ao alvo: é a resposta ao que ele acabou
 * de pedir, e é o único movimento aqui com informação nova atrás.
 *
 * A câmera vive em `S.cam` chaveada pelo desenho, pelo mesmo motivo que o Tester
 * guarda a dele: o SSE repinta a coluna inteira, e uma câmera perdida a cada
 * evento jogaria fora o enquadramento no meio da leitura. */
const ESC_FORMA = 0.28, ESC_NOME = 0.5;
/* Teto do VOO, separado do teto do zoom manual. Enquadrando dois nós vizinhos, a
   escala que os faz caber é enorme: medido, o voo até um alvo de 2 nós parava em
   nó de 185px — dois retângulos gigantes ocupando a tela e nenhuma vizinhança à
   vista, que é o contrário do que a pergunta "onde isso vai mexer" precisa. Com
   0,8 o nó sai a 67px e ainda cabem ~12 nós de largura ao lado dele. Na roda o
   teto continua sendo ESC_MAX: aproximar à mão é pedir para chegar perto. */
const ESC_ALVO = 0.8;
const ESC_MIN = 0.02, ESC_MAX = 2.2;
const VOO_MS = 420;

const trava = (v, a, b) => Math.min(Math.max(v, a), b);

function extentoAcesos(svg) {
  const ns = [...svg.querySelectorAll(".pn.on, .pn.falhou")];
  if (!ns.length) return null;
  const xs = ns.map(n => +n.dataset.x), ys = ns.map(n => +n.dataset.y);
  return {
    x0: Math.min(...xs), y0: Math.min(...ys),
    x1: Math.max(...xs) + NODE, y1: Math.max(...ys) + NODE + LABEL_GAP + 34
  };
}

function camCaber(vw, vh, bw, bh) {
  const esc = trava(Math.min(bw / vw, bh / vh), ESC_MIN, ESC_MAX);
  return { cx: vw / 2, cy: vh / 2, esc };
}

/* Enquadrar uma região: a escala é a que faz a região caber com folga, mas nunca
   passa de ESC_MAX (aproximar num nó só até virar um retângulo gigante não mostra
   mais nada) nem fica abaixo de ESC_NOME quando dá — se voou até o alvo, é para
   poder LER o alvo. */
function camRegiao(r, bw, bh, minEsc, maxEsc) {
  const lw = (r.x1 - r.x0) * 1.25, lh = (r.y1 - r.y0) * 1.3;
  let esc = Math.min(bw / Math.max(lw, 1), bh / Math.max(lh, 1));
  if (minEsc) esc = Math.max(esc, minEsc);
  return { cx: (r.x0 + r.x1) / 2, cy: (r.y0 + r.y1) / 2, esc: trava(esc, ESC_MIN, maxEsc || ESC_MAX) };
}

function camAbertura(svg, vw, vh, bw, bh) {
  const cabe = camCaber(vw, vh, bw, bh);
  if (cabe.esc >= ESC_FORMA) return cabe;
  // Não cabe legível: entra pela porta do fluxo, que é o nó mais à esquerda —
  // é onde `palco()` põe o gatilho, e é por onde um fluxo se lê.
  const ns = [...svg.querySelectorAll(".pn")];
  if (!ns.length) return cabe;
  const larg = bw / ESC_NOME;
  /* Abre com a borda ESQUERDA DO MUNDO na borda da caixa, não com o nó de entrada.
     `palco()` já reserva `padX` de folga ali justamente porque o rótulo é centrado
     no nó e transborda para os dois lados — entrar por dentro dessa folga cortou
     `executeWorkFlowTrigger` em `cuteWorkFlowTrigger`, que é o mesmo recorte que a
     folga existe para evitar, agora vindo da câmera em vez do viewBox. */
  /* O centro VERTICAL é o meio do que está dentro da janela horizontal, não o `y`
     do gatilho. Medido no print: centrado no gatilho, metade da caixa ficava vazia
     acima e abaixo dele, porque os ramos que saem dali moram em outras faixas. */
  const naJanela = ns.filter(n => +n.dataset.x < larg).map(n => +n.dataset.y);
  const cy = naJanela.length
    ? (Math.min(...naJanela) + Math.max(...naJanela) + NODE + LABEL_GAP + 34) / 2
    : vh / 2;
  return { cx: larg / 2, cy, esc: ESC_NOME };
}

/* Mensagem nova rola a conversa até o fim — mas SÓ se ele já estava lá embaixo.
   Sem rolar, a bolha que acabou de chegar nasce fora da vista e a tela parece não
   ter respondido, sendo que o que ela mostra é a resposta ao que ele escreveu.
   Com quem rolou para cima é o contrário: puxar a tela no meio de uma releitura
   tira dele a única coisa que ele estava fazendo, e uma rodada longa chega a
   várias mensagens — o texto passaria voando enquanto ele tenta ler.

   Duas guardas, e cada uma responde por um caso: a CONTAGEM, porque rolar a cada
   evento do SSE seria roubar a rolagem várias vezes por segundo; e `preso`, medido
   ANTES do repaint por `capturarInputs`, porque depois de trocar o `innerHTML` não
   há mais onde ler onde ele estava. */
function rolarConversa(st) {
  const n = (S.conv && S.conv.chat) ? S.conv.chat.length : 0;
  if (n === S.chatVisto) return;
  S.chatVisto = n;
  const forcar = S.rolForcar;
  S.rolForcar = false;
  // `st.rol` ausente é a primeira pintura da conversa: não havia caixa para medir,
  // e nascer no fim é o certo. Ausência aqui não é "ele estava lá em cima".
  if (!forcar && st && st.rol && !st.rol.preso) return;
  const rol = document.querySelector(".conv-rol");
  if (rol) rol.scrollTop = rol.scrollHeight;
}

function montarCamera() {
  const box = document.querySelector(".palco-box");
  const svg = box && box.querySelector("svg.palco");
  if (!box || !svg) return;
  const vw = +svg.dataset.vw, vh = +svg.dataset.vh;
  const medida = () => ({ bw: box.clientWidth || 1, bh: box.clientHeight || 1 });

  const pintar = () => {
    const { bw, bh } = medida();
    const w = bw / S.cam.esc, h = bh / S.cam.esc;
    // Folga de meia janela: dá para levar o desenho para o canto sem conseguir
    // perdê-lo de vista, que é o jeito de a câmera parecer quebrada.
    S.cam.cx = trava(S.cam.cx, -w / 2, vw + w / 2);
    S.cam.cy = trava(S.cam.cy, -h / 2, vh + h / 2);
    svg.setAttribute("viewBox", (S.cam.cx - w / 2) + " " + (S.cam.cy - h / 2) + " " + w + " " + h);
    const et = document.getElementById("cam-esc");
    if (et) et.textContent = "nó " + Math.round(NODE * S.cam.esc) + "px";
  };

  const parado = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function irPara(destino, animar) {
    if (!animar || parado) { S.cam = { ...S.cam, ...destino }; pintar(); return; }
    const de = { cx: S.cam.cx, cy: S.cam.cy, esc: S.cam.esc }, t0 = performance.now();
    (function passo(t) {
      const k = trava((t - t0) / VOO_MS, 0, 1), e = 1 - Math.pow(1 - k, 3);
      S.cam.cx = de.cx + (destino.cx - de.cx) * e;
      S.cam.cy = de.cy + (destino.cy - de.cy) * e;
      // A escala interpola em log: linear, a metade do voo já chegou perto do fim
      // e o movimento parece um salto seguido de um arrasto.
      S.cam.esc = Math.exp(Math.log(de.esc) + (Math.log(destino.esc) - Math.log(de.esc)) * e);
      pintar();
      if (k < 1) requestAnimationFrame(passo);
    })(t0);
  }

  const { bw, bh } = medida();
  const chave = String(S.sel) + ":" + vw + "x" + vh;
  const acesos = extentoAcesos(svg);
  const assAlvo = acesos ? JSON.stringify(acesos) : null;

  if (!S.cam || S.cam.chave !== chave) {
    S.cam = { chave, alvoVisto: null, ...camAbertura(svg, vw, vh, bw, bh) };
    pintar();
  } else {
    pintar();
  }
  // Alvo NOVO: voa até ele. O mesmo alvo de novo não voa — o SSE repinta a coluna
  // várias vezes por rodada, e repetir o voo seria movimento sem informação atrás.
  if (assAlvo && S.cam.alvoVisto !== assAlvo) {
    S.cam.alvoVisto = assAlvo;
    irPara(camRegiao(acesos, bw, bh, ESC_NOME, ESC_ALVO), true);
  }

  // Dois atalhos para não repetir a leitura da caixa em cada chamada — e para
  // que a ordem dos argumentos não dependa da ordem das chaves de um objeto.
  const cabeAgora = () => { const m = medida(); return camCaber(vw, vh, m.bw, m.bh); };
  const regiaoAgora = r => { const m = medida(); return camRegiao(r, m.bw, m.bh, ESC_NOME, ESC_ALVO); };
  const usada = () => box.classList.add("usada");
  const paraMundo = (px, py) => {
    const { bw: w0, bh: h0 } = medida();
    const w = w0 / S.cam.esc, h = h0 / S.cam.esc;
    return { x: S.cam.cx - w / 2 + px / S.cam.esc, y: S.cam.cy - h / 2 + py / S.cam.esc };
  };
  const zoom = (fator, px, py) => {
