  if (!("remendo" in c) || !c.remendo) return "";
  const r = c.remendo;
  /* Qual das duas propostas está na tela. Tudo abaixo lê `p`, nunca `r`, com uma
     exceção nomeada: a tarja de troca de fluxo, que é do ALVO e vale para as duas. */
  const { p, qual, tem } = patchAtivo(r);

  const d = p.diff || {};
  const sm = d.summary || {};
  const cabeca = [
    (sm.modified || 0) + " alterado(s)",
    (sm.added || 0) + " novo(s)",
    sm.removed ? sm.removed + " removido(s)" : null,
    (sm.edgesAdded || 0) + "↗ / " + (sm.edgesRemoved || 0) + "↘ conexões"
  ].filter(Boolean).join(" · ");

  /* Em qual fluxo isto escreveria. A tarja é a MESMA de `blocoResolucao`, e o
     `viaNode` vem da resolução — que é justamente quem escolheu este alvo. Sem
     ela, o nome do fluxo aparece sozinho em vez de um `viaNode` inventado. */
  const troca = (r.wfIdAlvo && String(r.wfIdAlvo) !== String(c.wfId))
    ? tarjaTroca({
        deId: c.wfId, deNome: c.wfNome,
        paraId: r.wfIdAlvo, paraNome: r.wfNomeAlvo,
        viaNode: ((c.resolucao || {}).redirecionado || {}).viaNode || null
      })
    : "";

  return '<div class="pr" role="region" aria-label="A proposta de patch, para revisão">'
    + '<div class="prhd"><span class="ix">[ REVISÃO ]</span><b>O que ele quer escrever</b>'
    + '<span class="sum">' + esc(cabeca) + "</span>"
    /* Reabrir a tela da verificação. Fechá-la não cancelou nada, então voltar tem
       de ser possível — e é aqui que ele procura, junto do que a bateria julgou. */
    + '<button type="button" class="btn sm" id="ver-abrir" style="margin-left:auto">'
    + "⤢ ver a verificação</button></div>"
    + (tem ? seletorDois(r, qual) : "")
    + (p.resumo ? '<div class="resumo">' + esc(p.resumo) + "</div>" : "")
    + troca
    + blocoBateria(p.bateria)
    + blocoPortoes(p)
    + desenhaDiff(d)
    + rodapeRemendo(p, qual);
}

/* QUAL DOS DOIS PATCHES ESTÁ NA TELA (§5.7.2).
 *
 * Quando o patch escreve nó novo que EXIGE credencial, a checagem 4 fica vermelha
 * e o botão normal não aparece: `applyPatch` proíbe qualquer chave `credentials`,
 * então o patch não tem como anexar uma, e um nó novo com campo vazio num fluxo
 * vivo falha na PRIMEIRA execução. A saída é um segundo patch, derivado por
 * código — nó novo com `disabled: true` e sem o `rewire` —, e ele é uma proposta
 * INDEPENDENTE: diff próprio, bateria própria, veredito próprio.
 *
 * Um de cada vez. Dois diffs lado a lado num ecrã de aprovação é a forma mais
 * rápida de alguém aprovar o que não leu.
 *
 * O padrão é o patch NORMAL mesmo quando ele está bloqueado: a pessoa precisa ver
 * POR QUE ele não pode ser aplicado antes de lhe ser oferecida a alternativa.
 * Abrir direto no desligado esconderia a causa e transformaria a exceção em
 * caminho comum. */
function patchAtivo(r) {
  const tem = !!(r.desligado && typeof r.desligado === "object");
  const qual = (tem && S.qualPatch === "desligado") ? "desligado" : "normal";
  return { p: qual === "desligado" ? r.desligado : r, qual, tem };
}

function seletorDois(r, qual) {
  const bt = (q, rot, t) => '<button type="button" data-qual="' + q + '" aria-pressed="'
    + (qual === q ? "true" : "false") + '" title="' + esc(t) + '">' + esc(rot) + "</button>";
  return '<div class="dois" role="group" aria-label="Qual proposta está na tela">'
    + bt("normal", "o patch como ele pediu", "o patch original, com o nó novo ligado no caminho")
    + bt("desligado", "com o nó novo desligado", "o mesmo patch, mas com o nó novo fora do caminho — proposta separada, conferida separadamente")
    + "</div>"
    + '<div class="dois-nota">'
    + (qual === "desligado"
      ? "Na tela: a versão com o <strong>nó novo desligado e fora do caminho</strong>. Ela existe porque "
        + "o nó novo exige credencial, e o patch não tem como anexar uma — nó novo com campo vazio num fluxo "
        + "vivo falha na primeira execução. Aplicando esta, falta você anexar a credencial no n8n e ligar o nó."
      : "Na tela: o patch <strong>como ele foi pedido</strong>. Existe uma segunda proposta, com o nó novo "
        + "desligado e fora do caminho — ela é conferida por conta própria e tem o diff dela.")
    + "</div>";
}

/* AS SETE LINHAS. O servidor mede; esta função só desenha o que ele mediu.
 *
 * `bateria` AUSENTE não é `bateria` vazia: conversa reaberta do disco de antes
 * desta fatia não tem o campo, e o cockpit que está rodando pode ter subido antes
 * dela. Aqui a ausência é dita em voz alta — ao contrário do `remendo` ausente,
 * que é silêncio legítimo — porque calar aqui deixaria a tela com um patch e um
 * diff sem nenhuma conferência à vista, que lê como "conferi e passou". */
function blocoBateria(b) {
  if (!b) {
    return '<div class="resol mudo"><span class="rt">SEM A BATERIA</span>'
      + "Este patch não passou pela bateria de sete — ou a conversa é anterior a ela, ou o cockpit "
      + "que está rodando subiu antes desta versão. <strong>Não é o mesmo que ter passado.</strong> "
      + "Monte o patch de novo para conferir.</div>";
  }
  const ls = Array.isArray(b.linhas) ? b.linhas : [];
  if (!ls.length) {
    return '<div class="resol mudo"><span class="rt">BATERIA VAZIA</span>'
      + "A bateria existe e não trouxe linha nenhuma. Isso é defeito do cockpit, não do patch — "
      + "e enquanto for assim não há conferência para ler.</div>";
  }

  /* A assinatura decide se acende. Guardada por conversa: trocar de conversa é
     informação nova, e ali as linhas devem acender de novo. */
  const assin = String(S.convId) + "#" + assinBateria(b);
  const jafoi = S.batAssin === assin;
  S.batAssin = assin;

  const conta = ls.reduce((a, l) => { const c = corBateria(l.cor); a[c] = (a[c] || 0) + 1; return a; }, {});
  const resumo = ["ok", "warn", "cold", "risk", "accent"]
    .filter(c => conta[c]).map(c => conta[c] + " " + BATERIA[c].rot.toLowerCase()).join(" · ");

  return '<div class="bat' + (jafoi ? " jafoi" : "") + '">'
    + '<div class="bat-hd"><span class="ix">[ VERIFICANDO UPGRADE ]</span>'
    + '<span class="sub">' + esc(resumo) + (b.correndo ? " · ainda conferindo" : "") + "</span></div>"
    + '<ol aria-label="A bateria de sete checagens">' + ls.map((l, i) => {
        const cor = corBateria(l.cor);
        const d = BATERIA[cor];
        /* Cinza calado ganha a frase que diz que está calado. Nunca uma frase
           genérica: inventar um motivo é pior que admitir que não veio. */
        const frase = String(l.frase || "").trim() || (cor === "cold" ? BAT_SEM_MOTIVO : "");
        const det = Array.isArray(l.detalhe) && l.detalhe.length
          ? "<ul>" + l.detalhe.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "";
        return '<li class="' + cor + '" style="--i:' + i + '">'
          + '<span class="n">' + esc(l.n || "") + "</span>"
          + '<span class="gl" aria-hidden="true">' + d.gl + "</span>"
          + '<span class="cp"><span class="nm">' + esc(l.nome || "") + "</span>"
          + (frase ? ' <span class="fr">— ' + esc(frase) + "</span>" : "") + det + "</span>"
          + '<span class="rot">' + d.rot + "</span></li>";
      }).join("") + "</ol></div>";
}


/* Um portão por pílula, com o veredito que o servidor mediu. Portão reprovado
   mostra a frase junto: sem ela a pílula diz que algo falhou e não diz o quê,
   que é o único momento em que o detalhe é a coisa mais útil da tela. */
function blocoPortoes(r) {
  const ps = Array.isArray(r.portoes) ? r.portoes : [];
  if (!ps.length) return "";
  return '<div class="portoes">' + ps.map(p =>
    '<span class="porta ' + (p.ok ? "ok" : "bad") + '">' + (p.ok ? "✓ " : "✕ ") + esc(p.nome)
    + (p.ok || !p.frase ? "" : " — " + esc(p.frase)) + "</span>"
  ).join("") + "</div>";
}

/* O diff por nó. `data-no` existe para o repaint: é por ele que
   `capturarInputs` sabe quais `<details>` estavam abertos. */
function desenhaDiff(d) {
  const nos = Array.isArray(d.nodes) ? d.nodes : [];
  const ROT = { added: "NOVO", removed: "REMOVIDO", modified: "ALTERADO" };
  let out = nos.map((nd, i) =>
    '<details class="dnode" data-no="' + esc(nd.name) + '"' + (i === 0 ? " open" : "") + ">"
    + "<summary>"
    + '<span class="tag ' + esc(nd.kind) + '">' + (ROT[nd.kind] || "ALTERADO") + "</span>"
    + '<span class="nm">' + esc(nd.name) + "</span>"
    + '<span class="ty" title="' + esc(nd.type) + '">' + esc(curto(nd.type)) + "</span>"
    + "</summary>"
    + '<div class="body">' + (nd.lines || []).map(l => {
        const cls = l.t === "+" ? " add" : l.t === "-" ? " del" : l.t === "~" ? " skip" : "";
        return '<span class="dl' + cls + '">' + esc(l.t === "~" ? "   ⋯ " + l.s : l.t + " " + l.s) + "</span>";
      }).join("") + "</div></details>"
  ).join("");

  /* Conexão mexida não aparece em nó nenhum: `rewire` troca as saídas sem tocar
     um byte do nó. Sem esta lista, um patch que só recosture o caminho mostraria
     um diff VAZIO — que na tela lê como "não muda nada". */
  const cx = d.connections || {};
  const add = cx.added || [], rem = cx.removed || [];
  if (add.length || rem.length) {
    out += '<div class="edgelist"><span class="rt">CONEXÕES</span>'
      + add.map(e => '<div class="add">+ ' + esc(e) + "</div>").join("")
      + rem.map(e => '<div class="del">− ' + esc(e) + "</div>").join("")
      + "</div>";
  }
  if (!out) {
    return '<div class="resol mudo"><span class="rt">DIFF VAZIO</span>'
      + "O patch passou pelos portões e não mudou nenhum byte do documento. "
      + "Isso é um defeito da proposta, não da tela — descreva de novo o que precisa mudar.</div>";
  }
  return out;
}

/* O RODAPÉ NÃO PODE MENTIR SOBRE O QUE EXISTE.
 *
 * Ele lê `podeAplicar` da bateria e `aplicavel` do patch, e EXIGE OS DOIS. Não
 * recalcula nenhum dos dois: são fatos do servidor, e uma segunda definição da
 * regra do botão divergiria no primeiro ajuste feito num lado só — só que aqui o
 * lado que divergisse ligaria um botão que escreve em produção. Pedir os dois não
 * é reimplementar: é recusar-se a decidir com uma metade da informação.
 *
 * AUSENTE NUNCA LIGA O BOTÃO, e esse é o oposto deliberado da resolução do alvo.
 * Lá, calar transformava "não conferi" em "está tudo certo", então a ausência
 * tinha de ser dita em voz alta. Aqui, um campo que não veio ligando a escrita em
 * produção seria a pior falha possível desta tela — então ausente é falso, e a
 * frase diz por quê.
 *
 * Com vermelho na bateria o botão SAI DA TELA em vez de ficar cinza ao lado da
 * recusa. Botão desligado encostado num "não" convida a insistir — é o mesmo
 * padrão que `rodapeAlvo()` já usa para o alvo bloqueado. */
function rodapeRemendo(p, qual) {
  const b = p.bateria;
  const dizerNada = NADA_NO_N8N;

  /* JÁ FOI ESCRITO: a banda deixa de ser proposta e vira RECIBO.
   *
   * Este ramo vem antes de todos os outros de propósito. Um botão de escrever ao
   * lado de um recibo de escrita convida ao clique duplo — o servidor recusa com
   * 409, mas a tela não deve chegar a oferecer.
   *
   * A ressalva não é modéstia e não pode ser cortada: aplicar NÃO prova que o
   * upgrade funcionou. A próxima execução é a primeira a rodar com a mudança, e
   * é ela quem responde. Mesma disciplina do `APPLY_CAVEAT` no `flows.html`. */
  const ap = S.conv && S.conv.aplicado;
  const df = S.conv && S.conv.desfeito;
  if (ap) {
    const ondeEsc = esc(String(p.wfNomeAlvo || (S.conv && S.conv.wfNome) || ap.wfId || "o fluxo"));
    const comoEsc = ap.qual === "desligado"
      ? " com o nó novo <strong>desligado</strong> e sem religar as conexões"
      : "";
    return '<div class="pr-rod"><span class="cf-tx">'
      + "<strong>Escrito em «" + ondeEsc + "»</strong>" + comoEsc + ", " + esc(quandoConv(ap.em)) + ". "
      + "O backup foi gravado antes. "
      + "<strong>Isto não prova que o upgrade funcionou</strong>: a próxima execução é a primeira a "
      + "rodar com a mudança."
      + "</span>"
      + '<button class="btn" id="desfazer-remendo" '
      + 'title="restaura o backup gravado antes de aplicar">↺ desfazer</button></div>'
      + linhaOfertaDossie(ap);
  }
  /* Desfeito é estado PRÓPRIO, e some do caminho de aplicar: o fluxo voltou ao
     que era, mas a rodada foi paga e o diff continua na tela acima. Dizer só
     "nada foi escrito" apagaria o fato de que algo foi escrito e revertido. */
  if (df) {
    return '<div class="pr-rod"><span class="cf-tx">Este patch foi aplicado e depois <strong>desfeito</strong>, '
      + esc(quandoConv(df.em)) + " — o fluxo está como estava antes. O diff acima continua sendo o que ele "
      + "escreveria, se você quiser montá-lo de novo pela conversa.</span></div>";
  }

  /* Portão estrutural reprovado é anterior à bateria: sem patch aplicável não há
     o que conferir, e a linha 1 da bateria é justamente esse veredito. */
  if ((p.portoes || []).some(x => !x.ok)) {
    return '<div class="pr-rod"><span class="cf-tx">Um portão reprovou, então não há o que aplicar. '
      + "Responda aí embaixo com a correção e ele monta o patch de novo. " + dizerNada + "</span></div>";
  }

  if (!b) {
    return '<div class="pr-rod"><span class="cf-tx">Os portões passaram, mas <strong>a bateria de sete não '
      + "rodou</strong> — e sem ela não dá para dizer que este patch é seguro de aplicar. Ausência de "
      + "conferência não é aprovação. " + dizerNada + "</span>"
      + '<button class="btn pri" id="aplicar-remendo" disabled '
      + 'title="a bateria de sete não rodou neste patch">✓ aplicar</button></div>';
  }

  if (b.correndo) {
    return '<div class="pr-rod"><span class="spin" aria-hidden="true"></span>'
      + '<span class="cf-tx">Ainda conferindo. O botão aparece quando a bateria terminar e não houver '
      + "vermelho. " + dizerNada + "</span></div>";
  }

  if (!b.podeAplicar) {
    const ruins = (b.linhas || []).filter(l => corBateria(l.cor) === "risk");
    const quais = ruins.length
      ? " Reprovou em: " + ruins.map(l => (l.n ? l.n + " " : "") + (l.nome || "")).join(", ") + "."
      : "";
    return '<div class="pr-rod"><span class="cf-tx">A bateria reprovou, então não há botão de aplicar.'
      + esc(quais) + " Responda aí embaixo com a correção e ele monta o patch de novo. " + dizerNada + "</span></div>";
  }

  /* A bateria liberou e mesmo assim `aplicavel` não veio.
   *
   * Os dois saem da MESMA fonte desde que o §6 existe (`aplicavel = !!bat.podeAplicar`),
   * então para um patch montado agora eles não divergem. Divergem para um patch
   * montado ANTES: aquele remendo ficou no disco com `aplicavel` ausente, e ausente
   * é falso.
   *
   * A frase daqui dizia "essa etapa ainda não existe", o que era verdade no §4 e
   * virou mentira no §6 — mandava a pessoa esperar por uma coisa que já estava
   * pronta. Agora ela diz o que de fato resolve: montar de novo. */
  if (!p.aplicavel) {
    return '<div class="pr-rod"><span class="cf-tx">A bateria passou, mas este patch foi montado '
      + "<strong>antes de a etapa de aplicar existir</strong>, então ele não carrega a liberação. "
      + "Clique em <strong>↺ montar de novo</strong> lá em cima: custa uma rodada e o patch volta "
      + "com a bateria e o botão. " + dizerNada + "</span>"
      + '<button class="btn pri" id="aplicar-remendo" disabled '
      + 'title="este patch é anterior à etapa de aplicar — monte de novo">✓ aplicar</button></div>';
  }

  /* Daqui para baixo o botão escreve de verdade, e o rótulo diz qual das duas
     propostas ele escreve — porque são documentos diferentes e a pessoa está
     olhando uma de cada vez. */
  if (qual === "desligado") {
    return '<div class="pr-rod"><span class="cf-tx">A bateria desta proposta passou. <strong>Aplicar escreve '
      + "este diff no fluxo de verdade</strong>, com o nó novo desligado e fora do caminho — depois falta "
      + "você anexar a credencial no n8n e ligar o nó.</span>"
      + '<button class="btn pri" id="aplicar-desligado">✓ aplicar com o nó novo desligado</button></div>';
  }
  return '<div class="pr-rod"><span class="cf-tx">A bateria passou. <strong>Aplicar escreve este diff '
    + "no fluxo de verdade</strong>, e só ele.</span>"
    + '<button class="btn pri" id="aplicar-remendo">✓ aplicar</button></div>';
}

/* A OFERTA, DESENHADA. Linha própria abaixo do recibo, e não dentro dele: o recibo
   é sobre o que foi escrito no n8n, e esta linha é sobre um arquivo LOCAL. Misturar
   as duas frases na mesma seria a tela sugerindo que atualizar o dossiê mexe no
   fluxo — que é o oposto do que acontece.

   O FLUXO É O ESCRITO, NÃO O ABERTO. Por causa do §4.5 o patch pode ter ido para um
   sub-fluxo, e o dossiê que envelheceu é o daquele. Quando os dois diferem a linha
   NOMEIA o fluxo: sem isso ela seria lida como sendo do fluxo que está na tela, que
   é a mesma confusão que a tarja âmbar do alvo existe para impedir. E o botão
   carrega o alvo em `data-wf`, senão o clique escreveria o dossiê do fluxo aberto —
   pago, em silêncio, e do arquivo errado. */
function linhaOfertaDossie(ap) {
  const wf = ap && ap.wfId ? String(ap.wfId) : null;
  if (!wf) return "";
  const d = S.dossie.get(wf);
  const o = ofertaDossie(d);
  const aberto = String((S.conv && S.conv.wfId) || "");
  const nome = (d && d.nome) || ((S.fluxos || []).find(x => String(x.id) === wf) || {}).nome || wf;
  const onde = wf === aberto ? "" : "Em <strong>«" + esc(nome) + "»</strong>, que é onde o patch foi escrito: ";
  /* O DESFECHO DO AUTOMÁTICO É UMA LINHA PRÓPRIA, e não um pedaço da frase da
     oferta. As duas falam de coisas diferentes: a oferta diz o que ESTÁ velho e
     quanto custa consertar, e esta diz o que a máquina JÁ TENTOU fazer sozinha por
     causa deste patch. Juntá-las produziria uma frase que ninguém termina de ler, e
     é justamente a metade que não pode ficar em silêncio — um dossiê que ele acredita
     fresco e está velho é pior que um que ele sabe velho.
     `semtentativa` NÃO desenha: é o estado normal de um fluxo antes de qualquer
     apply, e uma linha dizendo "nada foi registrado" num recibo seria ruído em cima
     do único lugar onde o desfecho importa. */
  const au = autoDossie(d);
  const linhaAuto = au && au.razao !== "semtentativa"
    ? '<div class="pr-rod dos-of ' + au.cls + '"><span class="cf-tx">'
      + '<span class="ix">[ AUTOMÁTICO ]</span> ' + au.frase + "</span></div>"
    : "";
  return '<div class="pr-rod dos-of ' + o.cls + '"><span class="cf-tx">'
    + '<span class="ix">[ DOSSIÊ ]</span> ' + onde + o.frase + "</span>"
    + (o.botao ? botaoDossie(d, wf) : "") + "</div>" + linhaAuto;
}

/* A BANDA DE ESTADO, e ela é onde a `frase` dos oito estados aterrissa.
 *
 * As frases estavam escritas e não chegavam à tela: `linhaConv` desenhava só o
 * `rot`, então elas eram código morto — e pior que morto, eram uma SEGUNDA
 * definição, porque esta banda já dizia com outras palavras o que
 * `ESTADO.cancelada.frase` e `ESTADO.falhou.frase` dizem. Duas definições da mesma
 * frase divergem no primeiro ajuste feito num lado só, e esta casa já pagou isso
 * com o `SCRATCH`.
 *
 * A banda é o lugar certo, e não um `.aviso` novo ao lado dela, por três motivos:
 * ela é FIXA (não rola com a conversa, ao contrário de qualquer coisa dentro de
 * `.conv-rol`), ela fica imediatamente acima do compositor — que é para onde a
 * frase manda ir —, e para `cancelada` e `quebrou` ela já existia, então um aviso
 * separado colocaria dois cartões adjacentes sobre o mesmo fato.
 *
 * `ESTADO_BANDA` diz QUAIS estados merecem banda e em que cor. Quatro dos oito não
 * merecem: `alvo` tem a faixa de alvo logo acima, `aguardando` tem o compositor
 * piscando por conta própria, `confirmado` tem o próprio ✓, e `semalvo` não pede
 * ação nenhuma. Uma banda em todos os oito seria uma tarja permanente na tela, que
 * é a forma mais rápida de ensinar alguém a não ler tarja.
 *
 * A frase é sobre o ESTADO; a sentença sobre o n8n é sobre a TELA, e por isso ela
 * é da banda e não da frase — a lista da gaveta repete a frase e não teria por que
 * repetir a promessa da tela. */
/* `ESTADO_BANDA` mora no bloco de juízo, com o `ESTADO`: quais estados merecem
   banda e em que cor é decisão, não desenho. */
const NADA_NO_N8N = "Nada foi escrito no n8n.";

/* A frase nasce em minúscula porque na lista ela é continuação de um rótulo; na
   banda ela abre a sentença. Uma segunda cópia em maiúscula seria exatamente a
   duplicação que este bloco acabou de remover. */
const maiuscula = s => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);

/* ═══════════════════ O OVERLAY DA VERIFICAÇÃO — [ VERIFICANDO UPGRADE ] ══════
 *
 * O ARCO INTEIRO, não só a bateria. Confirmar o alvo dispara uma rodada de modelo
 * que leva minutos, e só depois vêm as sete checagens. Uma tela que abrisse só na
 * bateria deixaria o pedaço mais longo da espera sem nada na frente — que é
 * exatamente o que fazia o `✓ é isso` parecer que não tinha funcionado.
 *
 * Por isso a etapa 0 existe: ela é a rodada do patch, alimentada por
 * `S.conv.status` e `S.conv.atividade`, do mesmo jeito que o `.hoff` do
 * `flows.html` mostra a sessão do Claude correndo.
 *
 * O NÓ É PRESERVADO ENTRE REPAINTS, como a gaveta. `render()` reescreve o `#app`
 * inteiro a cada evento do SSE e uma rodada emite vários por segundo; se o overlay
 * fosse parte do HTML de `telaFluxo()`, ele renasceria a cada evento, a animação
 * de entrada tocaria de novo e as sete acenderiam para sempre. */

/* A vocabulário das oito linhas. Mora aqui, no bloco de juízo da página, porque o
   servidor só manda `nome` nas linhas que JÁ resolveram — e o que a etapa pendente
   precisa mostrar é justamente o nome dela antes de existir resultado. */
const VER_ETAPAS = {
  "1":  { nm: "Estrutura",              sub: "os 10 portões" },
  "2":  { nm: "Esquema do nó",          sub: "810 tipos conhecidos" },
  "3":  { nm: "Gramática",              sub: "n8n-gramatica.md" },
  "4":  { nm: "Credencial",             sub: "o catálogo dos fluxos" },
  "5a": { nm: "Regressão de caminho",   sub: "runData da janela" },
  "5b": { nm: "Regressão de conteúdo",  sub: "o fantasma" },
  "6":  { nm: "Impacto medido",         sub: "execuções nos nós tocados" },
  "7":  { nm: "Aceite do n8n",          sub: "PUT na cópia inativa" }
};
/* A ordem de fallback, para quando o servidor ainda não mandou `todas` — uma
   conversa reaberta de antes deste contrato, ou o cockpit rodando velho. */
const VER_ORDEM = ["1", "2", "3", "4", "5a", "5b", "6", "7"];

/* Quantos passos já resolveram, para o contador do cabeçalho e a barra. Conta a
   etapa 0 junto: para quem espera, a rodada do patch é um passo como os outros. */
function verEtapas() {
  const c = S.conv || {};
  const r = c.remendo || null;
  const p = r ? patchAtivo(r).p : null;
  const b = (p && p.bateria) || null;

  /* Etapa 0 — a rodada que escreve o patch. `atividade` é o que o servidor está
     fazendo agora; sem ela a linha fica com o próprio nome, nunca vazia. */
  const temPatch = !!(p && (p.diff || p.portoes));
  const rodando = c.status === "correndo";
  const zero = temPatch
    ? { n: "0", nm: "Montando o patch", sub: "pronto", cls: "ok", gl: "✓", rot: "PRONTO" }
    : rodando
      ? { n: "0", nm: "Montando o patch", sub: String(c.atividade || "uma rodada de modelo…"),
          cls: "correndo", gl: "◐", rot: "CORRENDO" }
      : { n: "0", nm: "Montando o patch", sub: "ainda não começou", cls: "aguarda", gl: "○", rot: "" };

  const todas = (b && Array.isArray(b.todas) && b.todas.length) ? b.todas : VER_ORDEM;
  const feitas = new Map();
  for (const l of (b && Array.isArray(b.linhas) ? b.linhas : [])) if (l && l.n) feitas.set(String(l.n), l);

  /* A PRIMEIRA pendente é a que está correndo — e só quando há bateria correndo.
     Sem esse "só": com a bateria parada, a primeira que faltasse acenderia como se
     estivesse trabalhando, e a tela ficaria girando para sempre. */
  const correndoBat = !!(b && b.correndo);
  let jaMarcou = false;

  const passos = [zero];
  for (const n of todas) {
    const k = String(n);
    const voc = VER_ETAPAS[k] || { nm: k, sub: "" };
    const l = feitas.get(k);
    if (l) {
      const cor = corBateria(l.cor);
      const d = BATERIA[cor];
      /* Cinza calado ganha a frase que diz que está calado — mesma regra da banda
         de baixo. Inventar um motivo genérico seria pior que admitir que não veio. */
      const frase = String(l.frase || "").trim() || (cor === "cold" ? BAT_SEM_MOTIVO : voc.sub);
      passos.push({ n: k, nm: l.nome || voc.nm, sub: frase, cls: cor, gl: d.gl, rot: d.rot,
        det: Array.isArray(l.detalhe) ? l.detalhe : null });
      continue;
    }
    if (temPatch && correndoBat && !jaMarcou) {
      jaMarcou = true;
      passos.push({ n: k, nm: voc.nm, sub: voc.sub, cls: "correndo", gl: "◐", rot: "CONFERINDO" });
      continue;
    }
    passos.push({ n: k, nm: voc.nm, sub: voc.sub, cls: "aguarda", gl: "○", rot: "" });
  }
  const prontos = passos.filter(x => x.cls !== "aguarda" && x.cls !== "correndo").length;
  return { passos, prontos, total: passos.length, b, p, r };
}

/* Um diff compacto, de leitura, sem `<details>`: o explorável mora na revisão da
   coluna, e dois `data-no` iguais no documento confundiriam o `capturarInputs`,
   que varre o documento inteiro. */
function verDiff(d) {
  const nos = (d && Array.isArray(d.nodes)) ? d.nodes : [];
  if (!nos.length) return "";
  const ROT = { added: "NOVO", removed: "REMOVIDO", modified: "ALTERADO" };
  const nd = nos[0];
  const ls = Array.isArray(nd.lines) ? nd.lines : [];
  const TETO = 9;
  const mostra = ls.slice(0, TETO);
  const resto = ls.length - mostra.length;
  return '<div class="ver-dif"><div class="cab">'
    + '<span class="tag ' + esc(nd.kind || "modified") + '">' + (ROT[nd.kind] || "ALTERADO") + "</span>"
    + '<span class="nm">' + esc(nd.name || "") + "</span></div>"
    + '<div class="corpo">'
    + mostra.map(l => {
        const t = l && l.t;
        const cls = t === "+" ? "add" : t === "-" ? "del" : "";
        return '<div class="l ' + cls + '">' + esc((t === " " || !t ? " " : t) + " " + String(l && l.s || "")) + "</div>";
      }).join("")
    + (resto > 0 ? '<div class="mais">⋯ mais ' + resto + " linha(s) — o diff inteiro está na revisão, abaixo</div>" : "")
    + (nos.length > 1 ? '<div class="mais">⋯ e mais ' + (nos.length - 1) + " nó(s)</div>" : "")
    + "</div></div>";
}

function verAssinatura() {
  const c = S.conv || {};
  const { passos } = verEtapas();
  return JSON.stringify([S.convId, c.status, c.atividade, S.qualPatch,
    passos.map(x => [x.n, x.cls, x.sub])]);
}

function overlayVerif() {
  const c = S.conv || {};
  const { passos, prontos, total, b, p } = verEtapas();

  const cab = '<div class="ver-hd">'
    + '<span class="ix">[ VERIFICANDO UPGRADE ]</span>'
    + '<span class="wf sens">' + esc(String(p && p.wfNomeAlvo || c.wfNome || "")) + "</span>"
    + '<span class="sp"></span>'
    + '<span class="cont">' + String(prontos).padStart(2, "0") + " / " + String(total).padStart(2, "0") + "</span>"
    /* Fechar NÃO cancela: a rodada é do servidor e continua. O `title` diz isso, e
       o rodapé repete — porque um botão "fechar" ao lado de uma barra correndo lê
       naturalmente como "abortar". */
    + '<button type="button" class="btn sm" id="ver-fechar" '
    + 'title="fecha só esta tela — a rodada continua no servidor e você pode reabrir">fechar</button>'
    + "</div>";

  const barra = Math.round((prontos / Math.max(1, total)) * 100);
  const lista = '<div class="ver-steps' + (S.verifAssin === verAssinatura() ? " jafoi" : "") + '">'
    + '<ol role="log" aria-live="polite" aria-label="As checagens do upgrade">'
    + passos.map((x, i) =>
        '<li class="ver-step ' + x.cls + '" style="--i:' + i + '">'
        + '<span class="gl" aria-hidden="true">' + x.gl + "</span>"
        + '<span><span class="nm">' + esc(x.nm) + "</span>"
        + (x.sub ? '<span class="sub">' + esc(x.sub) + "</span>" : "")
        + (x.det && x.det.length ? "<ul>" + x.det.map(y => "<li>" + esc(y) + "</li>").join("") + "</ul>" : "")
        + "</span>"
        /* O rótulo é IRMÃO da célula do meio, na terceira coluna da grade — dentro
           dela ele ocuparia uma linha própria em cada etapa. */
        + (x.rot ? '<span class="rot">' + x.rot + "</span>" : "<span></span>")
        + "</li>").join("")
    + "</ol>"
    + '<div class="barra"><i style="--p:' + (barra / 100) + '"></i></div>'
    + '<div class="nada">' + esc(NADA_NO_N8N.toLowerCase()) + "</div>"
    + "</div>";

  const corpo = '<div class="ver-main">'
    + (p && p.resumo
        ? '<div><span class="ix">O QUE ELE QUER ESCREVER</span>'
          + '<div class="resumo" style="margin-top:6px">' + esc(p.resumo) + "</div></div>"
        : '<div class="esperando">O patch ainda está sendo escrito. Quando ele ficar pronto, o resumo e '
          + "o diff aparecem aqui, e as sete checagens começam a acender ao lado.</div>")
    + verDiff(p && p.diff)
    + "</div>";

  return '<div class="ver-scrim"><div class="ver" role="dialog" aria-modal="true" '
    + 'aria-labelledby="ver-tit"><span id="ver-tit" class="visually-hidden" '
    + 'style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">'
    + "Verificando o upgrade</span>"
    + cab + '<div class="ver-body">' + lista + corpo + "</div>" + verRodape(b, p) + "</div></div>";
}

/* O RODAPÉ, e a regra que ele carrega: ENQUANTO CORRE NÃO EXISTE BOTÃO DE
 * APLICAR. Nem cinza, nem desabilitado — ausente.
 *
 * Um botão desligado ao lado de uma barra correndo convida a clicar e a concluir
 * que a tela travou. Ele NASCE quando a bateria termina sem vermelho, e o
 * nascimento é o sinal de que acabou. */
function verRodape(b, p) {
  const c = S.conv || {};
  if (c.status === "correndo" || (b && b.correndo) || !p) {
    return '<div class="ver-ft"><span class="spin" aria-hidden="true"></span>'
      + '<span class="diz"><b>Ainda conferindo.</b> O botão de aplicar aparece quando a bateria '
      + "terminar e não houver vermelho. Fechar esta tela não cancela nada — a rodada continua.</span>"
      + '<button type="button" class="btn sm" id="ver-fechar-2">fechar</button></div>';
  }
  if (!b) {
    return '<div class="ver-ft"><span class="diz">A bateria não rodou neste patch, então não há '
      + "conferência para ler. <b>Ausência de conferência não é aprovação.</b></span>"
      + '<button type="button" class="btn sm" id="ver-fechar-2">fechar</button></div>';
  }
  if (b.bloqueia) {
    const ruins = (b.linhas || []).filter(l => corBateria(l.cor) === "risk")
      .map(l => (l.n ? l.n + " " : "") + (l.nome || "")).join(", ");
    return '<div class="ver-ft"><span class="diz"><b>A bateria reprovou'
      + (ruins ? " em: " + esc(ruins) : "") + ".</b> Não há botão de aplicar. "
      + "Responda na conversa com a correção e ele monta o patch de novo.</span>"
      + '<button type="button" class="btn sm" id="ver-fechar-2">fechar</button></div>';
  }
  if (!b.podeAplicar || !p.aplicavel) {
    return '<div class="ver-ft"><span class="diz">A bateria terminou, mas este patch não está '
      + "liberado para aplicar. A revisão abaixo diz por quê.</span>"
      + '<button type="button" class="btn sm" id="ver-fechar-2">fechar</button></div>';
  }
  /* Passou. Daqui o botão escreve de verdade — e o rótulo nomeia o fluxo, porque
     por causa do §4.5 ele pode não ser o que estava aberto. */
  const { qual } = patchAtivo(S.conv.remendo);
  const onde = String(p.wfNomeAlvo || c.wfNome || "o fluxo");
  return '<div class="ver-ft">'
    + '<span class="diz"><b>A bateria passou.</b> Aplicar escreve este diff em '
    + "<b>" + esc(onde) + "</b> — backup antes, ↺ desfazer depois.</span>"
    + '<button type="button" class="btn sm" id="ver-fechar-2">fechar</button>'
    + '<button type="button" class="btn prime" id="' + (qual === "desligado" ? "ver-aplicar-desligado" : "ver-aplicar") + '">'
    + (qual === "desligado" ? "✓ aplicar com o nó novo desligado" : "✓ aplicar no n8n") + "</button>"
    + "</div>";
}

/* Abrir. `deId` é o id do botão que abriu, para devolver o foco no fim — e é um
   ID, não o nó: o SSE redesenha a página enquanto a tela está aberta, e um nó
   guardado seria um nó descartado, com o foco caindo no body. */
function abrirVerif(deId) {
  if (S.verif) return;
  S.verif = true;
  S.verifDe = deId || null;
  S.verifAssin = "";        // primeira pintura acende
  const casca = document.createElement("div");
  casca.innerHTML = overlayVerif();
  S.verifEl = casca.firstElementChild;
  if (!S.verifEl) { S.verif = false; return; }
  document.body.appendChild(S.verifEl);
  S.verifAssin = verAssinatura();
  /* `inert` em todo irmão: sem isso o Tab passeia por trás do véu, por botões
     invisíveis sob o desfoque. Defeito já corrigido uma vez no `flows.html`. */
  for (const el of document.body.children) if (el !== S.verifEl) el.setAttribute("inert", "");
  const fecha = S.verifEl.querySelector("#ver-fechar");
  if (fecha) fecha.focus();
  S.verifEl.addEventListener("click", ev => { if (ev.target === S.verifEl) fecharVerif(); });
}

function fecharVerif() {
  if (!S.verif) return;
  S.verif = false;
  if (S.verifEl && S.verifEl.parentNode) S.verifEl.remove();
  S.verifEl = null;
  limparInert();
  /* Reencontra o botão pelo id: o repaint do SSE quase certamente destruiu o nó
     original, e devolver o foco a um nó descartado é o mesmo que não devolver.
     A CADEIA TEM DE IR ATÉ O FIM, e isto foi medido num navegador: quem abriu foi
     o `confirma-alvo`, que deixa de existir assim que o patch chega — então o
     primeiro elo já falha no caso comum, e sem os seguintes o foco caía no
     `<body>`, com o Tab recomeçando do topo da página.
     A ordem é a do gesto: quem abriu; o botão que REABRE (existe sempre que há
     patch, e é para onde a mão vai a seguir); o compositor; e por último a
     própria região da revisão, que é o que está na tela. */
  const back = (S.verifDe && document.getElementById(S.verifDe))
    || document.getElementById("ver-abrir")
    || document.getElementById("cp")
    || document.querySelector(".pr")
    || app;
  S.verifDe = null;
  if (back) { if (!back.tabIndex || back.tabIndex < 0) back.tabIndex = -1; back.focus(); }
}

/* Chamado no fim de todo `render()`: re-anexa o overlay e repinta o miolo só
   quando o dado mudou. Repintar sempre reanimaria as sete a cada evento do SSE. */
function pintarVerif() {
  if (!S.verif || !S.verifEl) return;
  if (S.verifEl.parentNode !== document.body) document.body.appendChild(S.verifEl);
  for (const el of document.body.children) if (el !== S.verifEl) el.setAttribute("inert", "");
  const assin = verAssinatura();
  if (assin === S.verifAssin) return;
  const casca = document.createElement("div");
  casca.innerHTML = overlayVerif();
  const novo = casca.firstElementChild;
  if (!novo) return;
  const dentro = S.verifEl.contains(document.activeElement);
  S.verifEl.innerHTML = novo.innerHTML;
  S.verifAssin = assin;
  /* Se o foco estava dentro e o nó dele acabou de ser destruído, ele cairia no
     body — e o Tab recomeçaria do topo da página, atrás do véu. */
  if (dentro && !S.verifEl.contains(document.activeElement)) {
    const f = S.verifEl.querySelector("#ver-fechar");
    if (f) f.focus();
  }
}

function bandaEstado() {
  const c = S.conv;
  if (!c) return "";
  /* A conversa aberta é a que o processo está servindo, então `viva` aqui é
     `status === "correndo"` por construção: um snapshot que diz `correndo` vem de
     uma sessão que está correndo agora. É a lista que precisa do fato `viva`, porque
     ela lê arquivo; aqui o estado reaberto já chega como `interrompida`. */
  const chave = ESTADO[c.status] ? c.status : "semalvo";
  const cor = ESTADO_BANDA[chave];
  if (!cor) return "";
  if (chave === "correndo") {
    /* Com a rodada correndo, a banda é o lugar de onde se abre a tela — é a única
       coisa na página que está falando de uma coisa acontecendo agora. */
    return '<div class="banda accent"><span class="spin"></span>'
      + '<span class="bd-tx">' + esc(c.atividade || "pensando…") + "</span>"
      + '<button class="btn sm" id="parar">⨯ parar <kbd>esc</kbd></button></div>';
  }
  /* `quebrou` mostra o erro DE VERDADE junto: a frase diz o que aconteceu, o erro
     diz o quê. Sem o segundo, a banda vira genérica na única vez em que o detalhe
     é a coisa mais útil da tela. */
  const detalhe = chave === "falhou" ? " " + esc(c.erro || "") : "";
  return '<div class="banda ' + cor + '"><span class="bd-tx">'
    + esc(maiuscula(ESTADO[chave].frase)) + ". " + NADA_NO_N8N + detalhe + "</span></div>";
}

function linhaCusto() {
  const c = S.conv;
  if (!c || !c.custo.length) return "";
  const g = c.gasto || { usd: 0 };
  return '<div class="custo">' + c.custo.length + " rodada(s) · "
    + (g.usd ? usdTxt(g.usd) : "US$0,00")
    + (g.estimado ? ' <span class="tag warn">' + g.cegas + " não medida(s)</span>" : "")
    + " · modelo <code>" + esc(c.modelo || "?") + "</code></div>";
}

/* ══════════════════════════════════ A GAVETA ════════════════════════════════
   O histórico das conversas deste fluxo. Ver a nota no CSS para por que ela é
   uma gaveta e não uma coluna nem uma faixa.
   ══════════════════════════════════════════════════════════════════════════ */

/* Desenhados, nunca emoji: `⌸`, `⌕`, `📎` e `🗀` já saíram como quadrado vazio
   nesta fonte. Mesmo dialeto do resto da tela — viewBox 24, traço 1,9,
   `currentColor`. */
function icHist() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M9.4 4.2h8.4a2 2 0 0 1 2 2v5.6a2 2 0 0 1-2 2h-.7"/>'
    + '<path d="M4.2 8.4h9.2a2 2 0 0 1 2 2v5.4a2 2 0 0 1-2 2H7.7L4.2 20.4z"/></svg>';
}
function icEvid() {
  return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M13.4 3.9H7.2a1.8 1.8 0 0 0-1.8 1.8v12.6a1.8 1.8 0 0 0 1.8 1.8h9.6a1.8 1.8 0 0 0 1.8-1.8V9.3z"/>'
    + '<path d="M13.3 4v5.3h5.3"/><path d="M8.8 13.6h6.2M8.8 16.6h3.8"/></svg>';
}

/* A LINHA. `sens` no título e na última mensagem, e isto não é zelo excessivo: o
   título nasce do que ele escreveu, e ele escreve *"a Ana foi chamada de
   outro nome"*. Estado, hora, evidência e custo ficam legíveis no modo gravação —
   dá para saber QUAL conversa é sem publicar o nome do lead.
   E o título NÃO ganha `title=`: tooltip é hover, o borrão nunca abre no hover, e
   um tooltip que revela o que o borrão esconde não protege nada. */
function linhaConv(c, f, cur) {
  const chave = estadoConv(c);
  const e = ESTADO[chave];
  const marcas = [];
  if (chave === "correndo") marcas.push('<span class="spin" aria-hidden="true"></span>');
  marcas.push('<span class="est">' + esc(e.rot) + "</span>");
  if (c.evidencias) {
    marcas.push('<span class="sep">·</span><span class="mk">' + icEvid() + c.evidencias + "</span>");
  }
  if (c.alvo) {
    marcas.push('<span class="sep">·</span><span class="mk">'
      + (c.alvo === "confirmado" ? "✓" : "◇") + " " + c.alvoNos + " nós</span>");
  }
  marcas.push('<span class="sep">·</span><span>'
    + (c.usdDesconhecido ? "US$? não medido" : usdTxt(c.usd || 0)) + "</span>");
  if (fluxoMudou(c, f)) {
    marcas.push('<span class="sep">·</span><span class="mudou">o fluxo mudou depois</span>');
  }
  /* DOIS BOTÕES IRMÃOS, não um dentro do outro. A primeira versão pôs o apagar como
     `<span role="button">` DENTRO da linha, porque conteúdo interativo aninhado num
     `<button>` é markup inválido — e o preço era que apagar só funcionava com o
     mouse, contra a regra escrita de que tudo clicável alcança pelo teclado. Com os
     dois como irmãos, os dois são `button` de verdade: Tab alcança, Enter e Espaço
     funcionam, e o anel de foco desta casa aparece nos dois.
     O `Delete` com o cursor do teclado em cima faz o mesmo — ver `tecladoGaveta`. */
  return '<div class="h-lin">'
    + '<button type="button" class="h-item e-' + chave + (c.id === S.convId ? " sel" : "")
    + (c.id === cur ? " cur" : "") + '"'
    + ' data-c="' + esc(c.id) + '" aria-current="' + (c.id === S.convId ? "true" : "false") + '">'
    + '<i class="bar" aria-hidden="true"></i>'
    + '<div class="lin1"><span class="tt sens">' + esc(c.titulo || "(sem título)") + "</span>"
    + '<span class="quando">' + esc(quandoConv(c.em)) + "</span></div>"
    + (c.ultima ? '<div class="ult sens">' + esc(c.ultima) + "</div>" : "")
    + '<div class="mt">' + marcas.join(" ") + "</div></button>"
    /* O rótulo acessível diz o TÍTULO? Não: ele é `sens`, e o nome acessível de um
       botão viaja em texto que o borrão não alcança. Diz o que a ação faz. */
    + '<button type="button" class="h-del" data-apagar="' + esc(c.id)
    + '" aria-label="apagar esta conversa" title="apagar esta conversa">⌫</button>'
    + "</div>";
}

/* O botão que chama a gaveta. Existe VAZIO também: porta que só aparece quando
   tem algo atrás é porta que ninguém acha. */
function botaoGaveta() {
  const h = S.hist;
  if (!h && !S.histErro) {
    return '<button class="btn sm hgv-bt" id="hgv-bt" disabled>' + icHist() + "lendo o histórico…</button>";
  }
  if (S.histErro) {
    return '<button class="btn sm hgv-bt" id="hgv-bt" aria-haspopup="dialog" '
      + 'title="não consegui ler o histórico deste fluxo">' + icHist() + "conversas <span class=\"esp\">· ?</span></button>";
  }
  const cs = h.conversas || [];
  const n = esperando(cs);
  return '<button class="btn sm hgv-bt" id="hgv-bt" aria-haspopup="dialog"'
    + ' title="as conversas deste fluxo' + (n ? " — " + n + " esperando resposta sua" : "") + '">'
    + icHist() + '<span class="n">' + cs.length + "</span> conversas"
    + (n ? '<span class="esp">· <b>' + n + "</b> espera</span>" : "") + "</button>";
}

/* O corpo da lista, sozinho — é só ele que é repintado quando o SSE traz dado
   novo, para o campo de busca não ser reconstruído embaixo do dedo. */
function listaGaveta(f) {
  if (S.histErro) {
    return '<div class="h-vazio ruim"><b>Não consegui ler o histórico deste fluxo.</b><br>'
      + esc(S.histErro) + "<br>Isto NÃO quer dizer que não existe conversa: quer dizer que eu não sei "
      + "o que existe. Nada foi apagado.</div>";
  }
  const h = S.hist || { conversas: [], ilegiveis: 0, lixeira: [] };
  const todas = (h.conversas || []).slice().sort(ordemConv);
  if (!todas.length) {
    return '<div class="h-vazio"><b>Nenhuma conversa neste fluxo ainda.</b><br>'
      + "A primeira nasce do que você escrever no compositor.</div>" + portaLixeira(h);
  }
  const vis = todas.filter(c => passaFiltroConv(c, S.gavFiltro));
  const cur = S.gavCur >= 0 && vis[S.gavCur] ? vis[S.gavCur].id : null;
  /* Lista vazia POR FILTRO nunca lê como fluxo sem conversa: uma é frase sobre o
     fluxo, a outra sobre o que está digitado aqui. */
  const corpo = vis.length
    ? vis.map(c => linhaConv(c, f, cur)).join("")
    : '<div class="h-vazio">Nenhuma das <b>' + todas.length + "</b> conversas tem «"
      + esc(S.gavFiltro.trim()) + "» no título nem na última mensagem.</div>";
  const ileg = h.ilegiveis
    ? '<div class="h-vazio ruim">' + h.ilegiveis + " arquivo(s) de conversa não abriram. "
      + "Eles continuam no disco — sumir com eles em silêncio esconderia uma conversa que custou dinheiro.</div>"
    : "";
  return corpo + ileg + portaLixeira(h);
}

function portaLixeira(h) {
  const lix = (h && h.lixeira) || [];
  if (!lix.length) return "";
  return '<div class="h-lix"><b>' + lix.length + " na lixeira.</b> Apagar aqui move o arquivo, "
    + "não o destrói — e não existe <code>git checkout</code> como saída, porque <code>conversas/</code> "
    + "não está no git."
    + lix.slice(0, 6).map(l => '<div class="item"><span class="nm sens">' + esc(l.titulo || l.convId) + "</span>"
      + '<button type="button" class="volta" data-volta="' + esc(l.lixo) + '">↩ trazer de volta</button></div>').join("")
    + "</div>";
}

/* CONTROLE QUE NÃO FAZ NADA SAI DE CENA — uma definição, lida pelo corpo e pelo
   rodapé. Vale para lista vazia E para histórico ilegível: nos dois casos não há o
   que filtrar nem o que abrir com Enter, e um campo de busca sobre uma lista que
   não foi lida é pior que campo nenhum. O que nunca sai é o `+ nova conversa`.
   Duas cópias desta condição foi exatamente o que um mutante pegou: elas
   divergiriam no primeiro ajuste feito num lado só. */
const semControles = () => !!S.histErro || !((S.hist && S.hist.conversas) || []).length;

/* O rodapé, separado porque ele é repintado sozinho: o `+ nova conversa` depende de
   quem está ocupando o cockpit, e isso muda com a gaveta já aberta. */
function rodapeGaveta(f) {
  const h = S.hist || { conversas: [] };
  const cs = h.conversas || [];
  const vazia = semControles();
  const nova = podeNova(h, f && f.nome);
  const dicas = vazia ? ""
    : '<span class="kbd">↑↓</span> escolher <span class="kbd">enter</span> abrir'
      + ' <span class="kbd">del</span> apagar'
      + '<span class="tot">' + cs.length + " no total</span>";
  return '<button type="button" class="btn sm h-nova" id="hgv-nova"' + (nova.pode ? "" : " disabled")
    + (nova.pode ? "" : ' title="' + esc(nova.porque) + '"') + ">+ nova conversa</button>"
    + (nova.pode ? dicas : '<span class="mudou">' + esc(nova.porque) + "</span>");
}

function gaveta(f) {
  const h = S.hist || { conversas: [] };
  const cs = h.conversas || [];
  /* Histórico ilegível conta como VAZIA para efeito de controles: não há o que
     filtrar nem o que abrir com Enter, e um campo de busca sobre uma lista que não
     foi lida é um controle que não faz nada — pior do que controle nenhum. O que
     ela NÃO esconde continua sendo o `+ nova conversa`. */
  const vazia = semControles();
  /* Com a lista vazia o filtro e o `↑↓ escolher · enter abrir` saem: filtrar nada
     e "enter abrir" sem nada para abrir são controles que não fazem nada, e um
     controle que não faz nada é pior que controle nenhum. O que NÃO sai é o
     `+ nova conversa` — vazia, ele é a única coisa que importa. */
  const busca = vazia ? ""
    : '<div class="hgv-busca"><div class="fbusca">'
      + '<input type="text" id="hgv-q" placeholder="filtrar por palavra do título…" '
      + 'aria-label="filtrar conversas" value="' + esc(S.gavFiltro) + '">'
      + '<span class="kbd">/</span></div></div>';
  /* A gaveta vive DENTRO do véu, não ao lado dele: assim os dois são UM nó, o que é
     o que permite guardá-los entre repaints (ver `pintarGaveta`). O véu é
     `inset: 0` e posicionado, então o `left/top/bottom` da gaveta resolve contra o
     mesmo retângulo da `.tela` que ele cobre. */
  return '<div class="hgv-scrim">'
    + '<aside class="hgv' + (vazia ? " vazia" : "") + '" role="dialog" aria-modal="true" aria-labelledby="hgv-t">'
    + '<div class="hgv-hd"><span class="idx">[ CONVERSAS ]</span><h2 id="hgv-t">deste fluxo</h2>'
    + '<button type="button" class="x" data-fecha="1" aria-label="fechar">✕</button></div>'
    + busca
    /* SEM cabeçalho de contagem dentro da lista: a contagem já está no botão que
       abriu a gaveta (`6 conversas · 1 espera`) e no rodapé (`N no total`), e a
       palavra "esperando você" já é o rótulo da própria linha. Um terceiro lugar
       dizendo o mesmo número rolaria para fora da vista junto com a lista — e o que
       precisa ser visto é justamente a pílula. */
    + '<div class="hgv-lista" id="hgv-lista">' + listaGaveta(f) + "</div>"
    + '<div class="hgv-ft">' + rodapeGaveta(f) + "</div></aside></div>";
}

function telaFluxo(f) {
  const c = S.conv;
  return '<div class="tela" data-layout="' + esc(LAYOUT) + '">'
    + '<div class="tela-hd"><div class="th-l"><span class="ix">[ UPGRADE ]</span><b>' + esc(f.nome) + "</b>"
    + '<span class="tag cold">' + num(f.nos) + " nós</span>"
    + '<span class="tag cold">' + num(f.exec24) + " exec/24h</span></div>"
    + '<div class="th-r">' + botaoGaveta()
    /* TROCAR DE FLUXO SEM PASSAR PELA VITRINE. O mesmo botão do cabeçalho da grade,
       e por isso o mesmo `data-seletor` com um ouvinte delegado só — dois nós com o
       mesmo `id` seriam HTML inválido e o segundo pintaria sem fazer nada, sem erro
       no console, que é o defeito que o botão do dossiê já pagou nesta página. */
    + '<button class="btn sm" data-seletor="1">trocar de fluxo ▾</button>'
    + '<button class="btn sm" id="voltar">← vitrine</button>'
    + '<button class="btn sm" id="abrir-n8n">abrir no n8n ↗</button></div></div>'
    + faixaDossie(f)
    + '<div class="duas"><div class="col-chat">'
    /* O título da conversa aberta na fatia livre do cabeçalho `[ 01 ]`. Com a
       gaveta FECHADA é a única coisa na tela que responde "qual delas eu estou
       lendo", e é `sens` pelo mesmo motivo que na lista. */
    + '<div class="secao"><span class="ix">[ 01 ]</span> A conversa'
    + (c && c.titulo ? '<span class="aberta"><i>·</i> <span class="sens">' + esc(c.titulo) + "</span></span>" : "")
    + (c ? '<span class="hint">nada escreve no n8n</span>' : "") + "</div>"
    // Só a conversa rola. O alvo, a banda de estado, o compositor e o custo ficam
    // presos: são o que se olha DEPOIS de ler, e descer atrás do campo de escrever
    // era metade do espaço mal usado desta tela.
    + '<div class="conv-rol">' + blocosConversa() + "</div>"
    + faixaAlvo()
    + faixaRemendo()
    + bandaEstado()
    // Sem dossiê não há campo de escrever: ver `podeConversar()`. Qual dos três
    // desenhos aparece é julgamento, e ele mora lá, não aqui.
    + compositorHtml(f)
    + linhaCusto()
    + "</div><div class=\"col-desenho\">"
    + '<div class="secao"><span class="ix">[ 02 ]</span> '
    + (S.conv && S.conv.alvo ? "O alvo, aceso no fluxo" : "O fluxo hoje")
    + '<span class="hint">nada foi escrito no n8n</span></div>'
    // O palco NÃO entra na string: ele é um nó preservado entre repaints, e
    // `pintarPalco()` o re-anexa aqui no fim de cada `render()`. Ver `S.palcoEl`.
    + '<div class="palco-host" id="palco-host"></div>'
    + tarjaNovos()
    + '<div class="leg"><span><i class="sw on"></i> vai ser mexido</span>'
    + (temNovos() ? '<span><i class="sw novo"></i> entra no fluxo</span>' : "")
    + '<span><i class="sw fail"></i> falhou em 24h</span>'
    + '<span><i class="sw"></i> intocado</span></div>'
    + "</div></div></div>";
}

/* ------------------------------------------------------- ligar a conversa --- */

/* O repaint do SSE reescreve a coluna inteira, e o compositor tem texto vivo
   dentro. Sem carregar valor, foco e caret por cima do repaint, uma mensagem
   chegando no meio de uma frase apagava o que estava sendo digitado — defeito que
   o Tester já pagou e documentou. */
/* DOIS CAMPOS, não um: o compositor e o filtro da gaveta. O filtro entrou nesta
   função porque `render()` destaca a `.tela` inteira — a gaveta é re-anexada com o
   texto intacto (o nó é o mesmo), mas o FOCO se perde ao ser destacado, e um campo
   de busca que perde o foco no meio da digitação é indistinguível de um campo que
   perdeu o texto: as letras seguintes vão para o nada. */
const CAMPOS = ["cp", "hgv-q"];

/* A ROLAGEM DA CONVERSA ANDA JUNTO, e é o mesmo defeito com outra roupa. O
   `.conv-rol` é filho do `innerHTML` que `render()` substitui, então cada evento
   do SSE o destrói e cria OUTRO — e caixa rolável recém-nascida começa em zero,
   isto é, NO TOPO. Enquanto uma rodada processa ela emite `atividade` várias vezes
   por segundo sem que a contagem de mensagens mude, `rolarConversa` sai pela
   primeira guarda, e nada devolve a posição: a conversa saltava para o começo
   sozinha e não havia como parar num ponto para ler.

   É a mesma disciplina que a lista da gaveta já usa ("repintar não pode rolar a
   lista de volta ao topo"), que o compositor usa para o caret, e que só faltava
   aqui.

   `preso` é a semântica de chat que todo mundo espera: quem está no fim continua
   no fim quando o texto cresce; quem subiu fica exatamente onde parou. A folga
   existe porque `scrollHeight - clientHeight` quase nunca bate o `scrollTop`
   redondo — sub-pixel, zoom e uma última linha meio visível deixam sobra, e sem
   ela quem está no fim seria tratado como quem subiu. */
const ROL_FOLGA = 24;
function capturarInputs() {
  const st = {};
  for (const id of CAMPOS) {
    const el = document.getElementById(id);
    if (!el) continue;
    st[id] = { v: el.value, foco: document.activeElement === el, ini: el.selectionStart, fim: el.selectionEnd };
  }
  /* O RASCUNHO SOBREVIVE AO CAMPO. O laço acima devolve valor e caret quando o
     `#cp` existe nas duas pinturas — o que ele não cobre é o campo DESAPARECER: o
     fluxo é editado no n8n, o refetch pega a divergência, o dossiê vira vermelho e a
     trava troca o compositor por um bloco. `st.cp` fica ausente na próxima medição e
     a frase dele não tem para onde voltar.
     Aqui o rascunho é copiado para `S` a cada pintura EM QUE O CAMPO EXISTE —
     inclusive vazio, e o vazio é a metade que importa: sem ele, uma mensagem
     enviada (que limpa o `#cp`) continuaria em `S` e voltaria ao campo depois,
     como se ele tivesse escrito duas vezes. Quando o campo não existe, ninguém
     escreve aqui e o que estava fica. */
  const cp = document.getElementById("cp");
  if (cp) S.rascunho = cp.value;
  const rol = document.querySelector(".conv-rol");
  if (rol) st.rol = { top: rol.scrollTop, preso: rol.scrollHeight - rol.clientHeight - rol.scrollTop <= ROL_FOLGA };
  /* Quais nós do diff estavam abertos. Sem isto, um `<details>` aberto fecharia
     sozinho a cada evento do SSE — e durante uma rodada isso são vários por
     segundo, o que torna o diff ilegível exatamente enquanto ele é escrito.
     Mesmo mecanismo do caret e da rolagem, não um terceiro.

     `tinha` é o que separa "ele fechou tudo" de "o diff ainda não existia": sem
     essa distinção, a primeira pintura restauraria uma lista vazia por cima do
     primeiro nó que nasce aberto, e ninguém veria o diff sem clicar. */
  const cxs = [...document.querySelectorAll(".dnode")];
  st.diff = { tinha: !!cxs.length, abertos: cxs.filter(d => d.open).map(d => d.dataset.no) };
  return st;
}
function restaurarInputs(st) {
  if (!st) return;
  for (const id of CAMPOS) {
    const el = document.getElementById(id), s = st[id];
    if (!el || !s) continue;
    el.value = s.v;
    if (s.foco) { el.focus(); try { el.setSelectionRange(s.ini, s.fim); } catch { /* fora de faixa */ } }
  }
  /* O CAMPO VOLTOU e não havia medição dele: é a volta da trava, o dossiê ficou em
     dia e o compositor renasceu vazio. O rascunho guardado volta AQUI, e volta sem
     roubar o foco — ele não pediu para voltar a escrever agora, ele pediu para não
     perder o que escreveu. O bloco de trava já disse que o texto estava guardado
     (ver `compositorHtml`), então a volta não é surpresa. */
  const cp = document.getElementById("cp");
  if (cp && !st.cp && S.rascunho) cp.value = S.rascunho;
  const rol = document.querySelector(".conv-rol");
  // Preso no fim: reancora no fim NOVO, não no antigo — a atividade que chegou
  // acabou de crescer a caixa, e devolver o `top` de antes deixaria um vão.
  if (rol && st.rol) rol.scrollTop = st.rol.preso ? rol.scrollHeight : st.rol.top;
  // Só devolve se JÁ HAVIA diff quando se mediu: a primeira pintura mantém o
  // primeiro nó aberto, que é o padrão, em vez de ser fechado por uma lista vazia.
  if (st.diff && st.diff.tinha) {
    for (const d of document.querySelectorAll(".dnode")) d.open = st.diff.abertos.includes(d.dataset.no);
  }
}

/* ─────────────────────── os três cliques que saem desta página ─────────────
 *
 * `confirma-alvo` MONTA O PATCH: gasta uma rodada de modelo e não escreve nada.
 * `aplicar-remendo` e `aplicar-desligado` ESCREVEM NUM FLUXO DE PRODUÇÃO.
 *
 * Os três estavam desenhados e nenhum tinha handler — os botões pintavam e o
 * clique não fazia nada, sem erro no console, que é a falha mais difícil de
 * reconhecer: parece que o servidor não respondeu. */

/* OS QUATRO CLIQUES QUE SAEM DESTA PÁGINA SÃO DELEGADOS, e isso é conserto, não
 * preferência de estilo.
 *
 * Antes eles eram `getElementById(...).addEventListener` dentro de `render()`.
 * Aquilo depende de três coisas darem certo ao mesmo tempo, a cada evento do SSE:
 * o nó existir naquele instante, o id ser único na página, e o registro acontecer
 * depois do `innerHTML` que criou o botão. Numa tela que repinta várias vezes por
 * segundo enquanto uma rodada corre, uma falha em qualquer das três produz um
 * botão que PARECE normal e não faz nada — sem erro no console, que é o sintoma
 * mais difícil de reconhecer: parece que o servidor não respondeu.
 *
 * Delegar no `document` remove a classe inteira. O ouvinte existe uma vez, não
 * conhece o ciclo de vida de nó nenhum, e continua valendo para um botão que
 * nasceu no repaint de agora.
 *
 * `closest` em vez de `e.target.id` porque o clique pode cair num filho do botão
 * (um `<strong>`, um glifo) e aí o alvo não é o botão. */
function ligarDelegacao() {
  /* O ANEXO QUE JÁ NÃO ESTÁ NO DISCO. `.upgrade-runs/` é scratch e gitignorado: uma
     limpeza de cache apaga o arquivo, e o histórico guarda só nome, tipo e tamanho.
     Sem este ramo o que aparece é o ícone de imagem quebrada, que lê como defeito
     da tela em vez de fato sobre o disco.
     EM CAPTURA, e não é escolha: o evento `error` de um `<img>` NÃO borbulha, então
     um ouvinte na bolha do documento nunca é chamado. */
  document.addEventListener("error", ev => {
    const img = ev.target;
    if (!img || img.tagName !== "IMG") return;
    /* O VISOR CAI NESTE MESMO OUVINTE, e isso é o ponto: a rota é a mesma, as duas
       causas são as mesmas, e a frase tem de ser a mesma. Um tratamento próprio para
       a imagem do visor seria uma SEGUNDA redação desta frase, e a que divergisse
       no primeiro ajuste seria a que ninguém releu.
       O QUE MUDA É O QUE SAI DO LUGAR: na bolha some a moldura inteira
       (`.banx-img`), porque um link para um arquivo que não abre não é link nenhum;
       no visor some só o `<img>`, porque trocar o `.vis-corpo` levaria junto a caixa
       que está segurando o rodapé e o botão de fechar — e aí não sobraria por onde
       sair a não ser o Esc. */
    const cx = img.closest && img.closest(".banx-img");
    const alvo = cx || (img.closest && img.closest(".vis-corpo") ? img : null);
    if (!alvo) return;
    const av = document.createElement("span");
    av.className = "banx-ido";
    /* A FRASE NÃO ACUSA O DISCO, e essa escolha é a lição que este arquivo já pagou
       três vezes. Daqui só se sabe que a imagem não carregou, e há DUAS causas com
       decisões opostas: o scratch foi limpo (fato sobre o disco, esperado) ou o
       cockpit que está respondendo subiu antes desta versão e não tem a rota — Node
       não recarrega o `server.js`. Dizer "não está mais no disco" na segunda causa
       manda ele procurar um arquivo que está lá, exatamente como o
       `Response.json()` sobre corpo 404 mandou procurar defeito na instalação do
       Claude. As duas causas ficam no `title`, e nenhuma é afirmada como a certa. */
    av.textContent = "○ não consegui abrir este anexo";
    av.title = (img.getAttribute("alt") || "")
      + " — ou o arquivo já foi limpo (`.upgrade-runs/` é descartável e o histórico guarda só o nome,"
      + " o tipo e o tamanho), ou o cockpit que está rodando subiu antes desta versão e não tem a rota"
      + " do arquivo. Node não recarrega o `server.js`: feche a janela do cockpit e abra de novo.";
    alvo.replaceWith(av);
  }, true);
  document.addEventListener("click", ev => {
    if (!ev.target || !ev.target.closest) return;
    /* O SÉTIMO CLIQUE: a miniatura do anexo abre O VISOR DESTA PÁGINA, não uma guia.
       Ele foi relatado assim, com um print: clicar no print levava para uma aba nova
       com a imagem crua sobre fundo preto. Isso não é ampliar, é sair da conversa.

       SÓ O CLIQUE ESQUERDO SIMPLES É INTERCEPTADO, e a lista de teclas não é zelo:
       ctrl/⌘+clique, shift+clique e alt+clique são TRÊS FORMAS DE ABRIR que já
       funcionam hoje, e o `preventDefault()` mata as três de uma vez. Tirar o `href`
       do `<a>` — que seria mais simples de escrever — mataria essas três mais o
       "abrir em nova guia" do menu de contexto e o arrastar do link para a barra de
       endereços. Nenhuma delas apareceria quebrada: elas deixariam de existir, em
       silêncio, que é o defeito mais difícil de reconhecer nesta base.
       O botão do meio nem chega aqui (o navegador manda `auxclick`), e o teste de
       `ev.button` é o que garante isso quando alguém sintetiza o evento.

       O CHIP (`a.banx-chip`) NÃO ENTRA, de propósito: PDF, CSV e `.md` não cabem num
       visor de imagem, e o navegador já sabe exibir os dois primeiros. Um visor que
       mostrasse um ícone de arquivo no lugar do arquivo seria pior que a guia — ele
       tiraria o único caminho que hoje funciona e não poria nada no lugar. */
    const fig = ev.target.closest("a.banx-img");
    if (fig && ev.button === 0 && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && !ev.altKey) {
      ev.preventDefault();
      abrirVisor(fig.getAttribute("href"), fig.dataset.nome || "", fig.dataset.meta || "", fig);
      return;
    }
    /* O QUINTO CLIQUE: escrever o dossiê. Ele entrou aqui quando passou a aparecer
       em DOIS lugares (a faixa e o bloco que substitui o compositor travado), o que
       tornou o `id="dos-btn"` impossível — dois nós com o mesmo id são HTML
       inválido, e `getElementById` acharia só o primeiro. É por `data-dossie`, e o
       fluxo aberto é lido do estado, não capturado num closure de `render()`. */
    /* O SEXTO CLIQUE: abrir o seletor de fluxo. Delegado pela MESMA razão do quinto
       — ele existe em dois lugares (o cabeçalho da grade e o da tela do fluxo), e um
       `id` repetido pintaria o segundo botão sem fazer nada, em silêncio.
       O nó vai como `origem` para o foco voltar para ele ao fechar. */
    const sel = ev.target.closest("[data-seletor]");
    if (sel && !sel.disabled) { ev.preventDefault(); abrirSeletor(sel); return; }
    const dos = ev.target.closest("[data-dossie]");
    if (dos && !dos.disabled) {
      ev.preventDefault();
      /* QUAL FLUXO. `data-wf` quando o botão diz — é o caso do recibo, onde o
         dossiê que envelheceu pode ser de um sub-fluxo (§4.5) e não do fluxo aberto.
         Sem ele, `S.sel`, que é o que a faixa e o bloco de trava sempre quiseram.
         O fluxo pode não estar em `S.fluxos` (um sub-fluxo que não chegou na porta),
         e aí o nome sai do próprio estado do dossiê, que o servidor já manda. */
      const wf = dos.dataset.wf || S.sel;
      if (!wf) return;
      const dd = S.dossie.get(String(wf));
      const fx = (S.fluxos || []).find(x => String(x.id) === String(wf))
        || (dd && dd.wfId ? { id: String(dd.wfId), nome: dd.nome || String(dd.wfId) } : null);
      if (fx) escreverDossie(fx);
      return;
    }
    /* O OITAVO CLIQUE: ver o progresso da escrita do dossiê. Delegado pela MESMA
       razão do quinto e do sexto — ele existe em dois lugares (a faixa da tela do
       fluxo e a tira do topo da vitrine), e um `id` repetido pintaria o segundo sem
       fazer nada, em silêncio.
       A ORDEM CONTRA O `[data-dossie]` É LIVRE, e vale dizer por quê em vez de
       deixar parecer sorte: os dois NUNCA existem no mesmo nó. `botaoDossie` devolve
       o de progresso enquanto `job.escrevendo` e o de escrever no resto do tempo, e
       a tira da vitrine só tem `data-prog`. Ele fica depois para o bloco do dossiê
       continuar sendo o primeiro a ler `S.sel` — é ali que a queda de `data-wf` para
       o fluxo aberto é uma decisão, e um `S.sel` acima dela a esconderia.
       `data-wf` quando o botão diz de qual fluxo é — a tira da vitrine sempre diz,
       porque lá não há fluxo aberto para cair. */
    const pg = ev.target.closest("[data-prog]");
    if (pg && !pg.disabled) {
      ev.preventDefault();
      const alvoPg = pg.dataset.wf || S.sel;
      if (alvoPg) abrirProgressoDossie(String(alvoPg), pg);
      return;
    }
    /* O NONO CLIQUE E OS CONTROLES DO PLAYER, todos do módulo servido. Delegados
       pela mesma razão dos de cima — `data-tut` existe em TRÊS lugares (a
       miniatura, o botão grande da faixa e o `.tut-mini` do cabeçalho), e um `id`
       repetido pintaria o segundo e o terceiro sem fazer nada, em silêncio.
       `cliques()` devolve `true` quando consumiu, que é o mesmo contrato do
       `teclado()`: quem decide a ordem é esta página, não o módulo. */
    if (TUT().cliques(ev)) return;
    const bt = ev.target.closest("button[id]");
    if (!bt || bt.disabled) return;
    if (bt.id === "confirma-alvo") { ev.preventDefault(); confirmarAlvo(); return; }
    if (bt.id === "aplicar-remendo") { ev.preventDefault(); aplicarRemendo("normal"); return; }
    if (bt.id === "aplicar-desligado") { ev.preventDefault(); aplicarRemendo("desligado"); return; }
    if (bt.id === "desfazer-remendo") { ev.preventDefault(); desfazerRemendo(); return; }
    /* O overlay usa ids PRÓPRIOS: `aplicar-remendo` já existe na revisão da coluna,
       e dois nós com o mesmo id fariam `getElementById` achar sempre o primeiro. */
    if (bt.id === "ver-abrir") { ev.preventDefault(); abrirVerif("ver-abrir"); return; }
    if (bt.id === "ver-fechar" || bt.id === "ver-fechar-2") { ev.preventDefault(); fecharVerif(); return; }
    if (bt.id === "ver-aplicar") { ev.preventDefault(); aplicarRemendo("normal"); return; }
    if (bt.id === "ver-aplicar-desligado") { ev.preventDefault(); aplicarRemendo("desligado"); return; }
  });

  /* O ARRASTO DA TRILHA e as teclas Home/End dela são do módulo servido
     (`ligarGestos`, chamado no boot): são os únicos ouvintes dele, e todos são
     guardados pelo player estar aberto E pelo alvo estar dentro de `.tut-trilha`,
     então nenhum pode consumir uma tecla que é desta página. */
}

async function confirmarAlvo() {
  if (!S.convId) return;
  const bt = document.getElementById("confirma-alvo");
  /* Desabilita NA HORA. A resposta do servidor demora, e nesse intervalo o botão
     continua clicável — dois cliques são duas rodadas de modelo pagas, e a
     segunda chegaria como 409 sem ninguém entender por quê. */
  if (bt) { bt.disabled = true; bt.textContent = "montando o patch…"; }
  try {
    await callApi("/api/upgrade/sessao/" + encodeURIComponent(S.convId) + "/confirmar", { method: "POST" });
    /* A tela abre AGORA, não quando a bateria começar: a rodada que escreve o
       patch leva minutos, e é justamente esse pedaço que fazia o botão parecer que
       não tinha funcionado. Abrir depois deixaria a espera mais longa sem nada na
       frente. */
    abrirVerif("confirma-alvo");
    /* Nada a fazer com a resposta: o SSE já traz o estado, e repintar daqui
       competiria com ele. */
  } catch (e) {
    if (bt) { bt.disabled = false; bt.textContent = "✓ é isso"; }
    avisar("não deu para montar o patch: " + e.message, "erro");
  }
}

async function aplicarRemendo(qual) {
  if (!S.convId) return;
  const r = S.conv && S.conv.remendo;
  if (!r) return;
  const p = qual === "desligado" ? r.desligado : r;
  const destino = (p && p.wfNomeAlvo) || (r && r.wfNomeAlvo) || (S.conv && S.conv.wfNome) || "o fluxo";

  /* A CONFIRMAÇÃO EXISTE POR UM MOTIVO ESPECÍFICO, não por cerimônia: por causa
     do §4.5, o fluxo que vai ser escrito PODE NÃO SER o que ele abriu. O diálogo
     nomeia o destino, que é a única coisa que o diff sozinho não grita.
     `perigo` porque escreve em produção — abre com o foco no Cancelar, para que
     Enter sem ler não altere um fluxo que está rodando. */
  const vai = await confirmar({
    tag: "APLICAR NO N8N",
    titulo: "Escrever em «" + destino + "»?",
    /* LISTA de parágrafos — `confirmar()` faz `.map()` nela. Uma string aqui
       estoura dentro do handler e o clique não faz nada, sem nada na tela. */
    corpo: qual === "desligado"
      ? ["Isto grava o patch com o nó novo DESLIGADO e sem religar as conexões — ele entra fora do "
         + "caminho, então não dispara. Depois falta anexar a credencial no n8n e ligar o nó.",
         "Um backup é gravado antes, e o ↺ Desfazer restaura."]
      : ["Isto grava o patch que está no diff acima, neste fluxo, agora.",
         "Um backup é gravado antes, e o ↺ Desfazer restaura. Aplicar não prova que o upgrade "
         + "funcionou: a próxima execução é a primeira a rodar com a mudança."],
    botao: "Aplicar",
    perigo: true
  });
  if (!vai) return;

  /* O mesmo gesto tem dois botões — o da revisão na coluna e o do overlay — e
     qual deles foi clicado depende de onde ele estava olhando. Desabilita os dois:
     procurar só um deixaria o outro clicável durante a escrita. */
  const alvos = [
    document.getElementById(qual === "desligado" ? "aplicar-desligado" : "aplicar-remendo"),
    document.getElementById(qual === "desligado" ? "ver-aplicar-desligado" : "ver-aplicar")
  ].filter(Boolean);
  for (const b of alvos) { b.disabled = true; b.textContent = "escrevendo…"; }
  const bt = alvos[0] || null;
  try {
    await callApi("/api/upgrade/sessao/" + encodeURIComponent(S.convId) + "/aplicar", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ qual: qual === "desligado" ? "desligado" : "normal" })
    });
    avisar("aplicado em «" + destino + "» — o backup está guardado e o ↺ Desfazer existe", "ok");
    /* O DOSSIÊ DO FLUXO ESCRITO ACABOU DE ENVELHECER, e é o recibo que oferece
       consertá-lo. Sem esta releitura a oferta ficaria em "conferindo o dossiê…" para
       sempre: o estado em `S.dossie` é o de antes do patch, e a única coisa que o
       renova é perguntar de novo. `forcar` porque o mapa já tem a chave.
       O ALVO É O FLUXO ESCRITO, não o aberto: por causa do §4.5 eles podem ser
       diferentes, e o dossiê que envelheceu é o de lá. */
    const alvo = (p && p.wfIdAlvo) || (r && r.wfIdAlvo) || S.sel;
    /* E O ACOMPANHAMENTO COMEÇA AQUI, porque desde a §2.8 flexibilizada esta escrita
       pode ter começado SOZINHA. Uma releitura só mostraria o "atualizando agora" e
       congelaria nele: o desfecho — escreveu, pulou, ou tentou e não conseguiu — é
       exatamente o que não pode ficar em silêncio, e ele chega minutos depois. */
    if (alvo) { verDossie(alvo, true); acompanharDossie(alvo); }
  } catch (e) {
    for (const b of alvos) { b.disabled = false; b.textContent = "✓ aplicar"; }
    /* Uma escrita que falhou prova ausência de CONFIRMAÇÃO, não ausência de
       efeito — por isso a frase não afirma que nada aconteceu. */
    avisar("não deu para aplicar: " + e.message + " — confira no n8n antes de tentar de novo", "erro");
  }
}

async function desfazerRemendo() {
  if (!S.convId) return;
  /* Guardado ANTES do POST: desfazer zera `s.aplicado`, e depois não haveria mais
     de onde tirar qual fluxo foi escrito. */
  const alvo = (S.conv && S.conv.aplicado && S.conv.aplicado.wfId) || S.sel;
  const vai = await confirmar({
    tag: "DESFAZER",
    titulo: "Voltar o fluxo ao estado anterior?",
    corpo: ["Isto restaura o backup gravado antes de aplicar. O que veio depois pelo editor do n8n, "
            + "se alguém mexeu, será substituído."],
    botao: "Desfazer",
    perigo: false
  });
  if (!vai) return;
  try {
    await callApi("/api/upgrade/sessao/" + encodeURIComponent(S.convId) + "/desfazer", { method: "POST" });
    avisar("desfeito — o fluxo voltou ao estado anterior", "ok");
    /* O fluxo voltou, então o dossiê pode ter voltado a ficar em dia. Deixar o
       estado velho aí faria a faixa continuar pedindo uma escrita de minutos e
       dólares por uma divergência que não existe mais. */
    if (alvo) verDossie(alvo, true);
  } catch (e) {
    avisar("não deu para desfazer: " + e.message, "erro");
  }
}

async function enviar() {
  const el = document.getElementById("cp");
  if (!el) return;
  /* A TRAVA DO DOSSIÊ TAMBÉM VALE AQUI, e isso é defesa em profundidade, não
     zelo: botão desabilitado não é garantia nenhuma, porque o Enter no textarea
     chama esta função direto — e o campo desabilitado do estado "conferindo"
     continua no DOM. Sai sem POST e SEM limpar o campo: perder a frase por causa
     de uma trava seria puni-lo duas vezes pela mesma coisa.

     UMA TRAVA NÃO PODE FALHAR ABERTA. A primeira versão procurava o fluxo na
     lista — `(S.fluxos || []).find(...)` — e com a lista ainda não carregada `fl`
     saía `null`, o `fl &&` curto-circuitava e a guarda LIBERAVA. Inalcançável na
     tela de hoje (o compositor só existe dentro de `telaFluxo(f)`, que exige `f`),
     e mesmo assim a direção do erro estava errada. O veredito sai do `S.dossie`,
     que é onde o estado mora, do mesmo jeito que as outras duas chamadas desta
     página.

     Sem `S.sel` não há fluxo e portanto não há compositor, então travar ou liberar
     dá no mesmo — escolhi TRAVAR, pelo mesmo motivo que o `!d` do `podeConversar`
     trava: uma trava que não sabe sobre o que está decidindo recusa. (E sem `S.sel`
     este POST criaria uma sessão com `wfId: null` de todo modo.) */
  if (!S.sel || !podeConversar(S.dossie.get(String(S.sel))).pode) return;
  const texto = el.value.trim();
  if (!texto) return;
  /* UM UPLOAD EM VOO PERDERIA O ARQUIVO, e sai antes de limpar o campo. A sessão
     ADOTA a bandeja no instante em que nasce (`rename` do diretório); um arquivo
     que ainda está subindo cairia numa bandeja que já foi movida, e o chip
     desapareceria sem uma palavra. Esperar dois segundos é melhor que isso, e a
     frase diz o que se está esperando. */
  if (S.subindo) {
    avisar("estou terminando de subir " + S.subindo + " arquivo(s) — manda de novo em um instante, "
      + "senão eles ficam fora desta conversa.", "info", "anexo ainda subindo");
    return;
  }
  el.value = "";
  /* O rascunho e o campo são a MESMA coisa, então limpar um limpa o outro na mesma
     linha. O `capturarInputs` da próxima pintura faria isso sozinho; explícito aqui
     porque entre este ponto e a próxima pintura há dois `await`, e uma trava que
     subisse nesse vão devolveria a mensagem já enviada como rascunho. */
  S.rascunho = "";
  try {
    if (!S.convId) {
      const r = await callApi("/api/upgrade/sessao", {
        method: "POST", headers: { "content-type": "application/json" },
        /* A BANDEJA É ADOTADA PELA SESSÃO: os arquivos já estão no servidor, o que
           viaja aqui é o RECIBO. Zerada na sequência, porque uma bandeja já movida
           não existe mais — mandá-la de novo pediria a adoção de um diretório que
           não está lá, e o log diria "não consegui aproveitar os anexos" por uma
           coisa que deu certo. */
        body: JSON.stringify({ wfId: S.sel, bandeja: S.bandeja })
      });
      S.convId = r.id;
      S.bandeja = null; S.anexosPre = []; S.anexoErro = null;
      ligarStream(S.convId);
      // A conversa nasceu agora: ela ganha endereço na hora, porque ela é a que
      // está começando a custar. Um F5 antes da primeira resposta perderia o
      // ponteiro para uma rodada já paga.
      urlConversa(S.convId);
    }
    S.conv = await callApi("/api/upgrade/sessao/" + S.convId + "/mensagem", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ texto })
    });
    S.convApagada = null;
    /* A mensagem dele entrou: a conversa desce mesmo que ele estivesse lendo lá em
       cima — ver `rolForcar`. Armado AQUI, e não no começo da função, porque entre
       o clique e a resposta há dois `await`: um evento do SSE no meio consumiria o
       disparo antes da hora, e um envio que falhasse o deixaria armado para roubar
       a rolagem da próxima mensagem que chegasse sozinha. */
    S.rolForcar = true;
    render();
    // A primeira mensagem é o que dá título à conversa, então é ela que faz a
    // linha aparecer na gaveta.
    if (S.sel) carregarHist(S.sel);
  } catch (e) {
    S.erro = e.message;
    el.value = texto;   // devolve o que ele escreveu: perder a frase é pior que o erro
    render();
  }
}

async function parar() {
  if (!S.convId) return;
  try { S.conv = await callApi("/api/upgrade/sessao/" + S.convId + "/cancelar", { method: "POST" }); }
  catch (e) { S.erro = e.message; }
  render();
}

/* ══════════════════════════════ A GAVETA, VIVA ══════════════════════════════
 *
 * O NÓ DA GAVETA É PRESERVADO ENTRE REPAINTS, e isso é o coração desta seção.
 * `render()` reescreve o `#app` inteiro a cada evento do SSE, e uma rodada emite
 * `atividade` várias vezes por segundo. Se a gaveta fosse parte do HTML de
 * `telaFluxo()`, cada evento a reconstruiria: a animação de entrada tocaria de
 * novo (movimento sem informação nova atrás — proibido nesta casa), o campo de
 * busca perderia texto e foco no meio da digitação, e o cursor do teclado
 * voltaria para o começo.
 *
 * Então ela é construída UMA VEZ por abertura, guardada em `S.gavEl`, e
 * re-anexada à `.tela` no fim de cada `render()`. A animação é desarmada com
 * `.pousada` depois de tocar, porque re-inserir um nó reinicia as animações dele.
 * O que é repintado por dado novo é SÓ a lista — que é filha, e não contém o
 * campo de busca.
 */

const gavAssinatura = () => JSON.stringify([
  S.histErro, S.convId, S.gavFiltro, S.gavCur,
  ((S.hist && S.hist.conversas) || []).map(c => [c.id, c.status, c.viva, c.em, c.rodadas, c.usd, c.alvo, c.evidencias]),
  ((S.hist && S.hist.lixeira) || []).map(l => l.lixo),
  S.hist && S.hist.ativa ? S.hist.ativa.convId : null
]);

/* Chamado no fim de todo `render()`. Re-anexa a gaveta, reaplica o `inert` nos
   irmãos (que acabaram de ser reconstruídos) e repinta a lista só se o dado mudou. */
function pintarGaveta() {
  const tela = app.querySelector(".tela");
  if (!S.gaveta || !tela) return;
  if (!S.gavEl) return;
  if (S.gavEl.parentNode !== tela) tela.appendChild(S.gavEl);
  /* `inert` em todo irmão: sem isso o Tab anda por trás do véu, defeito já
     corrigido uma vez no `flows.html`. Os irmãos DENTRO da `.tela` (cabeçalho,
     faixa do dossiê e as duas colunas) mais tudo fora dela, menos o `#app`, que
     é justamente quem contém a gaveta. */
  for (const el of tela.children) if (el !== S.gavEl) el.setAttribute("inert", "");
  for (const el of document.body.children) if (el !== app) el.setAttribute("inert", "");

  const assin = gavAssinatura();
  if (assin !== S.gavAssin) {
    S.gavAssin = assin;
    const f = (S.fluxos || []).find(x => String(x.id) === String(S.sel)) || null;
    const lista = S.gavEl.querySelector("#hgv-lista");
    if (lista) {
      const rol = lista.scrollTop;
      lista.innerHTML = listaGaveta(f);
      lista.scrollTop = rol;   // repintar não pode rolar a lista de volta ao topo
      ligarLinhasGaveta();
    }
    /* O rodapé também: `+ nova conversa` desabilita quando uma conversa de OUTRO
       fluxo começa a rodar, e isso acontece com a gaveta já aberta. Um botão que
       continua habilitado depois de o cockpit ficar ocupado devolve o 409 que ele
       existe para evitar. */
    const ft = S.gavEl.querySelector(".hgv-ft");
    if (ft) { ft.innerHTML = rodapeGaveta(f); ligarNova(); }
  }
}

function ligarNova() {
  const b = S.gavEl && S.gavEl.querySelector("#hgv-nova");
  if (b) b.addEventListener("click", novaConversa);
}

function limparInert() {
  for (const el of document.body.children) el.removeAttribute("inert");
  const tela = app.querySelector(".tela");
  if (tela) for (const el of tela.children) el.removeAttribute("inert");
}

async function abrirGaveta() {
  if (!S.sel) return;
  S.gaveta = true;
  S.gavCur = -1;
  /* O filtro NÃO persiste entre aberturas. "Estou olhando as que falam de áudio" é o
