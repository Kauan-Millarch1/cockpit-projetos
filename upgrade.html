     que ele está fazendo neste minuto; guardado, uma palavra de ontem esconderia a
     lista de hoje sem dizer por quê, e refazer custa uma tecla. Mesma decisão que o
     filtro do feed do `flows.html` tomou, e pelo mesmo motivo. */
  S.gavFiltro = "";
  const f = (S.fluxos || []).find(x => String(x.id) === String(S.sel)) || null;
  const casca = document.createElement("div");
  casca.innerHTML = gaveta(f);
  S.gavEl = casca.firstElementChild;   // o véu, com a gaveta dentro: um nó só
  S.gavAssin = gavAssinatura();

  const tela = app.querySelector(".tela");
  if (!tela || !S.gavEl) { S.gaveta = false; S.gavEl = null; return; }
  tela.appendChild(S.gavEl);
  for (const el of tela.children) if (el !== S.gavEl) el.setAttribute("inert", "");
  for (const el of document.body.children) if (el !== app) el.setAttribute("inert", "");

  ligarGaveta();
  const q = S.gavEl.querySelector("#hgv-q");
  if (q) q.focus(); else { const b = S.gavEl.querySelector("#hgv-nova"); if (b) b.focus(); }

  /* Desarma a animação depois de ela tocar uma vez. Sem timer não dá: `animationend`
     não chega quando `prefers-reduced-motion` já a zerou. */
  setTimeout(() => {
    if (!S.gavEl) return;
    S.gavEl.classList.add("pousada");
    const g = S.gavEl.querySelector(".hgv");
    if (g) g.classList.add("pousada");
  }, 320);
}

/* FECHAR: redesenha ANTES de devolver o foco. Na ordem inversa o foco volta para
   um botão que o `render()` seguinte destrói e cai no `body` — o Tab reinicia do
   topo da página. É o bug documentado na telinha de escolher fluxo do
   `flows.html`, e a ordem aqui existe por causa dele. */
function fecharGaveta() {
  if (!S.gaveta) return;
  S.gaveta = false;
  if (S.gavEl && S.gavEl.parentNode) S.gavEl.parentNode.removeChild(S.gavEl);
  S.gavEl = null;
  S.gavCur = -1;
  limparInert();
  render();
  const bt = document.getElementById("hgv-bt");
  if (bt) bt.focus();
}

function ligarLinhasGaveta() {
  if (!S.gavEl) return;
  S.gavEl.querySelectorAll("[data-c]").forEach(b =>
    b.addEventListener("click", () => abrirConversa(b.getAttribute("data-c"))));
  S.gavEl.querySelectorAll("[data-apagar]").forEach(b =>
    b.addEventListener("click", () => apagarConversa(b.getAttribute("data-apagar"))));
  S.gavEl.querySelectorAll("[data-volta]").forEach(b => {
    b.addEventListener("click", ev => { ev.stopPropagation(); restaurarConversa(b.getAttribute("data-volta")); });
  });
}

function ligarGaveta() {
  if (!S.gavEl) return;
  S.gavEl.querySelectorAll("[data-fecha]").forEach(b => b.addEventListener("click", fecharGaveta));
  /* O véu fecha, mas só quando o clique é NELE: a gaveta é filha dele, então sem o
     `e.target === ` qualquer clique dentro da lista subiria até aqui e fecharia a
     gaveta embaixo do dedo. */
  S.gavEl.addEventListener("click", e => { if (e.target === S.gavEl) fecharGaveta(); });
  ligarNova();
  const q = S.gavEl.querySelector("#hgv-q");
  if (q) q.addEventListener("input", () => {
    S.gavFiltro = q.value;
    S.gavCur = -1;   // filtrou: o cursor antigo apontava para outra lista
    pintarGaveta();
  });
  ligarLinhasGaveta();
}

/* ↑↓ andam, Enter abre. O cursor é DIFERENTE da seleção: andar não abre nada, e
   pintar os dois igual faria parecer que já abriu. */
function tecladoGaveta(e) {
  if (!S.gaveta) return false;
  /* A GAVETA CEDE PARA O DIÁLOGO, e a checagem mora AQUI e não no ouvinte por uma
     razão de ORDEM que foi medida no navegador: o `onKey` do `confirmar()` está
     registrado em CAPTURA no `document` e chama `scrim.remove()` de forma síncrona.
     Um Esc percorre window(captura) → document(captura) → … → target →
     document(bolha) → window(bolha). Então um teste de `.scrim` feito na bolha olha
     um documento onde o véu JÁ FOI REMOVIDO — passa, e o mesmo Esc fecha o diálogo
     E a gaveta. Medido: o `inert` ia a zero e a lista sumia da tela.
     Duas metades consertam isso, e as duas são necessárias: o ouvinte foi para a
     fase de CAPTURA no window, que é upstream da captura no document, e a checagem
     ficou aqui dentro — onde um teste alcança sem navegador. */
  if (document.querySelector(".scrim")) return false;
  /* Esc fecha, mesmo com o foco no filtro. A regra do "Esc reflexo" desta tela
     existe para não custar uma RODADA; reabrir a gaveta custa um clique, e um
     modal que não fecha no Esc é o defeito mais previsível de todos. */
  if (e.key === "Escape") { e.preventDefault(); fecharGaveta(); return true; }
  const f = (S.fluxos || []).find(x => String(x.id) === String(S.sel)) || null;
  const vis = ((S.hist && S.hist.conversas) || []).slice().sort(ordemConv)
    .filter(c => passaFiltroConv(c, S.gavFiltro));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!vis.length) return true;
    e.preventDefault();
    const d = e.key === "ArrowDown" ? 1 : -1;
    S.gavCur = (S.gavCur + d + vis.length + (S.gavCur < 0 && d < 0 ? 1 : 0)) % vis.length;
    pintarGaveta();
    const cur = S.gavEl && S.gavEl.querySelector(".h-item.cur");
    if (cur) cur.scrollIntoView({ block: "nearest" });
    return true;
  }
  if (e.key === "Enter" && S.gavCur >= 0 && vis[S.gavCur]) {
    e.preventDefault();
    abrirConversa(vis[S.gavCur].id);
    return true;
  }
  /* `Delete` na linha sob o cursor. O diálogo de confirmação é o que impede um Del
     reflexo de custar uma conversa — e ele abre com o foco no Cancelar. */
  if (e.key === "Delete" && S.gavCur >= 0 && vis[S.gavCur]) {
    e.preventDefault();
    apagarConversa(vis[S.gavCur].id);
    return true;
  }
  /* Ciclo fechado de Tab: o `inert` já tirou o resto da página da ordem de
     tabulação; isto só impede a saída pelo browser. */
  if (e.key === "Tab" && S.gavEl) {
    const fs = [...S.gavEl.querySelectorAll("button:not([disabled]), input")];
    if (!fs.length) return true;
    const i = fs.indexOf(document.activeElement);
    e.preventDefault();
    fs[(i + (e.shiftKey ? -1 : 1) + fs.length) % fs.length].focus();
    return true;
  }
  return false;
}

/* ─────────────────────────── o histórico: buscar, abrir, apagar ───────────── */

/* Perguntado DEPOIS da primeira pintura, como o peso e o dossiê. Enquanto não
   chega, o botão diz que está lendo — nunca "0 conversas", que é a mesma
   confusão entre ausência e resposta negativa que esta casa já pagou três vezes. */
async function carregarHist(wfId) {
  if (S.histDe !== String(wfId)) { S.hist = null; S.histErro = null; S.histDe = String(wfId); }
  try {
    S.hist = await callApi("/api/upgrade/conversas/" + encodeURIComponent(wfId));
    /* `erro` no corpo é a MESMA frase que uma chamada que falhou: os dois dizem
       "não sei o que existe". O que não pode acontecer é ele virar lista vazia. */
    S.histErro = S.hist.erro || null;
  } catch (e) {
    S.hist = null;
    S.histErro = e.message;
  }
  render();
}

async function abrirConversa(convId) {
  if (!S.sel || !convId) return;
  if (convId === S.convId) { fecharGaveta(); return; }
  try {
    const snap = await callApi("/api/upgrade/conversa/" + encodeURIComponent(S.sel) + "/"
      + encodeURIComponent(convId) + "/abrir", { method: "POST" });
    S.convId = snap.id;
    S.conv = snap;
    S.convApagada = null;
    ligarStream(snap.id);
    urlConversa(snap.id);
  } catch (e) {
    S.erro = e.message;
  }
  fecharGaveta();
  carregarHist(S.sel);
}

/* `+ nova conversa` NÃO chama o servidor: a conversa nasce da primeira mensagem,
   que é onde `enviar()` já faz o POST. Zerar aqui é o que separa "quero começar
   outra" de "gastei uma sessão sem dizer nada". */
function novaConversa() {
  S.convId = null; S.conv = null; S.convApagada = null;
  if (S.es) { try { S.es.close(); } catch { /* já fechado */ } S.es = null; }
  urlConversa(null);
  fecharGaveta();
  const cp = document.getElementById("cp");
  if (cp) cp.focus();
}

async function apagarConversa(convId) {
  const c = ((S.hist && S.hist.conversas) || []).find(x => x.id === convId);
  const ok = await confirmar({
    tag: "APAGAR CONVERSA", perigo: true,
    titulo: "Apagar esta conversa?",
    corpo: [
      c && c.titulo ? "«" + c.titulo + "»" : "esta conversa",
      "O arquivo vai para a lixeira, não é destruído — e a gaveta mostra uma porta de volta "
        + "enquanto ele estiver lá. Não existe git como saída aqui: a pasta `conversas/` não está versionada.",
      c ? c.rodadas + " rodada(s) já pagas nesta conversa" + (c.usdDesconhecido ? ", com gasto não medido." : ".") : "",
      "Nada é escrito nem apagado no n8n."
    ].filter(Boolean),
    botao: "⌫ apagar"
  });
  /* `confirmar()` põe `inert` em TODO filho do body e o remove de todos ao fechar —
     inclusive o que a gaveta tinha posto. Sem reaplicar, cancelar o diálogo deixa o
     topbar tabulável por trás do véu, que é o defeito que o `inert` existe para
     evitar. No caminho do "sim", `carregarHist` → `render` → `pintarGaveta` já
     reaplica; aqui é o caminho do "não". */
  if (!ok) { pintarGaveta(); return; }
  try {
    await callApi("/api/upgrade/conversa/" + encodeURIComponent(S.sel) + "/"
      + encodeURIComponent(convId) + "/apagar", { method: "POST" });
    if (S.convId === convId) {
      S.convId = null; S.conv = null;
      if (S.es) { try { S.es.close(); } catch { /* já fechado */ } S.es = null; }
      urlConversa(null);
    }
  } catch (e) { S.erro = e.message; }
  await carregarHist(S.sel);
  pintarGaveta();
}

async function restaurarConversa(lixo) {
  try {
    await callApi("/api/upgrade/lixeira/" + encodeURIComponent(S.sel), {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ lixo })
    });
  } catch (e) { S.erro = e.message; }
  await carregarHist(S.sel);
  pintarGaveta();
}

/* `?c=` sempre acompanha o `?f=`. `replaceState` e não `pushState`: trocar de
   conversa dentro do mesmo fluxo não é navegação de página, e empilhar uma entrada
   por conversa aberta faria o botão Voltar do browser passear pelo histórico em vez
   de sair da tela. */
function urlConversa(convId) {
  const u = new URL(location.href);
  if (convId) u.searchParams.set("c", convId); else u.searchParams.delete("c");
  history.replaceState({ f: S.sel, c: convId || null }, "", u);
}

/* `?static=1` congela a página numa leitura só, sem SSE. Não é conveniência de
   captura: um EventSource mantém a conexão aberta para sempre, e isso trava
   captura headless (o Chrome derrubou o serviço de rede aqui) e atrapalha
   embutir a tela em qualquer lugar. `flows.html` e `tester.html` têm a mesma
   chave pela mesma razão — a quarta página não ia ser a exceção. */
const ESTATICO = new URLSearchParams(location.search).get("static") === "1";

function ligarStream(id) {
  if (ESTATICO) return;
  if (S.es) { try { S.es.close(); } catch { /* já fechado */ } }
  const es = new EventSource("/api/upgrade/sessao/" + id + "/stream");
  S.es = es;
  /* A gaveta é alimentada pelo SERVIDOR, não por dedução da página: quando o estado
     da conversa muda, o arquivo em disco já mudou (o `upgrade.js` grava em toda
     transição), então relemos a lista. É uma chamada local por TRANSIÇÃO — não por
     evento de atividade, que chega várias vezes por segundo. Deduzir a linha aqui
     seria uma segunda definição dos mesmos fatos, e as duas divergiriam. */
  const aplica = ev => {
    try {
      const antes = S.conv && S.conv.status;
      S.conv = JSON.parse(ev.data);
      render();
      if (S.conv.status !== antes && S.sel) carregarHist(S.sel);
    } catch { /* linha torta */ }
  };
  es.addEventListener("snapshot", aplica);
  es.addEventListener("estado", aplica);
  es.addEventListener("atividade", ev => {
    try { if (S.conv) { S.conv.atividade = JSON.parse(ev.data).atividade; render(); } } catch { /* segue */ }
  });
  es.addEventListener("custo", ev => {
    try { const d = JSON.parse(ev.data); if (S.conv) { S.conv.custo = d.custo; S.conv.gasto = d.total; render(); } }
    catch { /* segue */ }
  });
}

/* Reata a uma conversa já aberta para este fluxo. Uma conversa custou minutos e
   dinheiro; um F5 não pode ser o que a perde. */
async function reatar(wfId) {
  S.convId = null; S.conv = null;
  if (S.es) { try { S.es.close(); } catch { /* já fechado */ } S.es = null; }

  /* `?c=` VENCE o "qual está aberta neste fluxo": o endereço é uma escolha
     explícita, e a conversa em memória é só a última que passou por aqui. Um F5 no
     meio de uma conversa antiga tem de voltar para ela, não para outra. */
  const pedida = new URLSearchParams(location.search).get("c");
  if (pedida && /^u[a-z0-9]{1,32}$/.test(pedida)) {
    try {
      const snap = await callApi("/api/upgrade/conversa/" + encodeURIComponent(wfId) + "/"
        + encodeURIComponent(pedida) + "/abrir", { method: "POST" });
      S.convId = snap.id; S.conv = snap; S.convApagada = null;
      ligarStream(snap.id);
      render();
      return;
    } catch (e) {
      /* APAGADA e NÃO ACHEI são duas frases, e nenhuma delas é uma tela em branco.
         O 410 é o único caso em que a página sabe o que aconteceu com o que ele
         tinha, e é a informação que faz diferença: o arquivo está na lixeira. */
      if (/apagada/i.test(e.message)) {
        S.convApagada = { convId: pedida, apagadaEm: (e.message.match(/em (\S+)$/) || [])[1] || null };
      } else {
        S.erro = "o link (?c=" + pedida + ") não abriu: " + e.message;
      }
      urlConversa(null);
      render();
      return;
    }
  }

  try {
    const r = await callApi("/api/upgrade/aberta/" + encodeURIComponent(wfId));
    if (r.id) {
      S.convId = r.id;
      S.conv = await callApi("/api/upgrade/sessao/" + r.id);
      ligarStream(r.id);
      // O endereço passa a valer para ela: sem isto, a conversa que a tela está
      // mostrando não tem link, e é a que está custando dinheiro agora.
      urlConversa(r.id);
      render();
    }
  } catch { /* sem conversa aberta é o caso normal */ }
}

/* Esc para. Cede para campo de texto: um Esc reflexo depois de errar a digitação
   não pode custar uma rodada — o primeiro tira o foco, o segundo para de verdade.
   E só age com algo rodando, senão Esc na vitrine levantaria um 409 sobre uma
   conversa que nunca existiu. */
addEventListener("keydown", e => {
  /* A GAVETA VEM PRIMEIRO, e a ordem é o ponto: com ela aberta, Esc fecha a
     gaveta e NÃO para a rodada. São duas ações diferentes com a mesma tecla, e a
     que está na frente é a que ganha — mesma disciplina do `confirmar()`, que
     também tem prioridade sobre o Esc que para. E o `confirmar()` continua na
     frente da gaveta: o `.scrim` dele é o que está mais à frente de tudo.
     ESTE OUVINTE RODA EM CAPTURA (o `true` no fim), e isso não é detalhe: o
     `confirmar()` escuta em captura no `document` e remove o véu de forma síncrona,
     então na bolha o `.scrim` já não existe mais para ser testado. Ver a nota longa
     em `tecladoGaveta`. */
  if (document.querySelector(".scrim")) return;
  /* O PLAYER DO TUTORIAL ENTRA AQUI, logo abaixo do `.scrim` e acima do visor,
     porque é essa a camada dele: 50 o `.scrim`, **48 o player**, 47 o visor, 46 a
     telinha do dossiê, 45 o seletor, 40 o overlay da verificação. Com ele aberto,
     Esc FECHA O PLAYER e não para a rodada.
     O MÓDULO NÃO REGISTRA OUVINTE PRÓPRIO, pela mesma razão de todos os outros
     desta cadeia — e aqui a razão é mais forte, porque ele consome MAIS que o Esc:
     espaço, setas, `m` e `f` também são dele enquanto está aberto. Com um `keydown`
     só dele, um Esc fecharia o player E chamaria o `parar()`, matando uma rodada de
     modelo já paga; e o espaço rolaria a página por trás do véu. */
  if (TUT().teclado(e)) return;
  /* O VISOR ENTRA AQUI, logo abaixo do `.scrim` e acima de todo o resto, porque é
     essa a camada dele: 50 o `.scrim`, 47 o visor, 45 o seletor, 40 o overlay da
     verificação. Com ele aberto, Esc FECHA O VISOR e não para a rodada.
     ELE NÃO REGISTRA OUVINTE PRÓPRIO, e isso é a decisão inteira: com um
     `keydown` só dele, um Esc fecharia o visor E chamaria o `parar()` — duas ações
     diferentes na mesma tecla, e uma delas mata uma rodada de modelo JÁ PAGA. É o
     mesmo defeito que a nota do `tecladoGaveta` descreve por inteiro e a mesma
     razão pela qual o seletor também entra por aqui. */
  if (tecladoVisor(e)) return;
  /* A TELINHA DO DOSSIÊ ENTRA AQUI, logo abaixo do visor: a camada desta página é
     50 o `.scrim`, 47 o visor, 46 esta telinha, 45 o seletor, 40 o overlay — e a
     ordem desta cadeia é a mesma, do mais à frente para o mais atrás. Com ela
     aberta, Esc FECHA A TELINHA e não para a rodada.
     ELA NÃO REGISTRA OUVINTE PRÓPRIO, e é a decisão inteira: com um `keydown` só
     dela, um Esc fecharia a telinha E chamaria o `parar()` — duas ações diferentes
     na mesma tecla, e uma delas mata uma rodada de modelo JÁ PAGA. Mesmo defeito
     que a nota do `tecladoGaveta` descreve por inteiro, medido no navegador. */
  if (tecladoProgresso(e)) return;
  /* O OVERLAY ENTRA AQUI, entre o `confirmar()` e tudo o mais.
     Acima dele só o `.scrim`: aquele diálogo nasce de um botão desta tela e tem de
     receber o Esc primeiro. Abaixo, o `parar()` — e a ordem importa muito, porque
     FECHAR A TELA NÃO É PARAR A RODADA. Sem este `return`, um Esc para sair da
     verificação cancelaria uma rodada de modelo já paga. */
  if (S.verif && e.key === "Escape") { e.preventDefault(); fecharVerif(); return; }
  /* O SELETOR ENTRA AQUI, e a posição é a mesma decisão que a gaveta tomou: com ele
     aberto, Esc FECHA O SELETOR e não para a rodada. Se ele tivesse ouvinte próprio,
     as duas coisas aconteceriam com um Esc só — e uma delas é uma rodada de modelo
     já paga. Acima dele ficam o `.scrim` e o overlay, que também nascem de um botão
     desta tela e têm de receber a tecla primeiro. */
  if (tecladoSeletor(e)) return;
  if (tecladoGaveta(e)) return;
  /* `/` abre o filtro com a gaveta aberta — o `.kbd` ao lado do campo promete
     isso, e um atalho anunciado que não existe é pior que nenhum. */
  if (e.key === "/" && S.gaveta && S.gavEl) {
    const q = S.gavEl.querySelector("#hgv-q");
    if (q && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); return; }
  }
  if (e.key !== "Escape") return;
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) { a.blur(); return; }
  if (S.conv && S.conv.status === "correndo") { e.preventDefault(); parar(); }
}, true);

/* ---------------------------------------------------------------- render --- */

/* ═══════════════════════════ O VISOR DO ANEXO ═══════════════════════════════
 *
 * O QUE ELE É: a telinha que mostra o print DENTRO da conversa. Clicar na
 * miniatura abria uma guia nova com a imagem crua sobre o fundo preto do
 * navegador — foi assim que ele relatou, com um print do próprio sintoma. Uma
 * guia nova não é ampliar, é SAIR: o que ele escreveu sai da tela junto, e o
 * caminho de volta é um Alt+Tab para um lugar que não é o painel. O print e a
 * frase que o acompanha decidem juntos se o pedido está certo, e separá-los é
 * tirar metade da evidência de cada vez.
 *
 * DIÁLOGO DE VERDADE, com a mecânica que esta página já tem em dois lugares
 * (`confirmar()` e `abrirSeletor`) — copiada de lá, nunca reinventada: `role`,
 * `aria-modal`, `inert` nos outros filhos do `body`, Esc, clique no véu, botão
 * visível e o foco de volta para quem abriu. Um terceiro jeito de fazer modal
 * nesta página seria um terceiro jeito de errar o foco.
 *
 * MONTADO POR DOM, NUNCA POR `innerHTML`. O nome do arquivo vem do disco, ou
 * seja de fora, e `textContent` fecha essa porta sem depender de ninguém lembrar
 * de escapar — a mesma razão pela qual `avisar()` é montado assim.
 *
 * A COR DE TUDO AQUI DENTRO ESTÁ NO CSS E É LITERAL, medida contra o chão fixo
 * `#101018`: os tokens do tema não valem sobre uma superfície que não muda com o
 * tema. Ver a nota longa no bloco `.vis-scrim`. */
function abrirVisor(url, nome, meta, origem) {
  /* Sem `url` não há o que mostrar, e um visor vazio seria a imagem quebrada com
     um passo a mais. Um visor já aberto não abre outro: dois véus empilhados
     deixariam um `inert` para trás ao fechar o de cima. */
  if (S.visor || !url) return;

  const scrim = document.createElement("div");
  scrim.className = "vis-scrim";
  const cx = document.createElement("div");
  cx.className = "vis";
  cx.setAttribute("role", "dialog");
  cx.setAttribute("aria-modal", "true");
  /* `aria-label` COM O NOME DO ARQUIVO, e não um título fixo: com dois prints na
     mesma conversa, ouvir "visor de anexo" nas duas vezes não distingue nada — e
     qual dos dois abriu é exatamente a pergunta. */
  cx.setAttribute("aria-label", "Anexo: " + (nome || "arquivo"));

  const hd = document.createElement("div");
  hd.className = "vis-hd";
  const ix = document.createElement("span");
  ix.className = "idx"; ix.textContent = "[ ANEXO ]";
  /* O ✕ é BOTÃO VISÍVEL e escrito, não só um glifo: Esc e o véu fecham, mas os
     dois são atalhos que ninguém descobre olhando — e o momento em que se procura
     como sair é o momento em que não se vai adivinhar uma tecla. Mesma decisão do
     "⨯ parar" do Tester. */
  const x = document.createElement("button");
  x.className = "x"; x.type = "button";
  /* O GLIFO É `aria-hidden` e a palavra fica: um leitor de tela leria "✕" como
     "multiplicação" antes de "fechar". É a mesma regra que o `avisar()` desta
     página já segue — a cor e o desenho não são a informação, o texto é. */
  const xg = document.createElement("span");
  xg.setAttribute("aria-hidden", "true"); xg.textContent = "✕";
  x.append(xg, document.createTextNode("fechar"));
  hd.append(ix, x);

  const corpo = document.createElement("div");
  corpo.className = "vis-corpo";
  const img = document.createElement("img");
  /* `sens` TAMBÉM AQUI, e aqui é onde mais importa: no visor o print está em
     tamanho grande, e o modo gravação existe justamente para quando há uma câmera
     apontada para o monitor. `[data-rec="1"] .sens` mora no `documentElement`,
     então alcança este nó, que nasce no `document.body` e não no `#app`. */
  img.className = "sens";
  img.alt = nome || "anexo";
  img.src = url;
  corpo.append(img);

  const ft = document.createElement("div");
  ft.className = "vis-ft";
  /* O NOME É `sens` pela mesma razão que na bolha: `clientes-2026.csv` identifica
     cliente. O tipo e o tamanho ficam legíveis, que é o que deixa confirmar que o
     arquivo certo subiu sem publicar de quem ele é. */
  const nm = document.createElement("span");
  nm.className = "nm sens";
  nm.textContent = nome || "arquivo";
  const mt = document.createElement("span");
  mt.className = "mt"; mt.textContent = meta || "";
  /* A GUIA CONTINUA EXISTINDO, agora por ESCOLHA. Quem quer o print numa aba só
     dele — para deixá-lo aberto ao lado do n8n — clica aqui; quem só queria ver
     grande deixou de pagar por isso. Tirar a guia junto com o defeito teria
     trocado um incômodo por uma perda. */
  const lk = document.createElement("a");
  lk.className = "lk"; lk.href = url; lk.target = "_blank"; lk.rel = "noopener";
  lk.textContent = "abrir em nova guia ↗";
  ft.append(nm, mt, lk);

  cx.append(hd, corpo, ft);
  scrim.append(cx);

  /* `inert` NOS OUTROS FILHOS DO BODY, a mecânica do `confirmar()` e do seletor,
     copiada e não inventada. Sem ela o Tab caminha por trás do véu — 17 controles
     seguiam tabuláveis no `flows.html` antes de isto existir lá. O retrato
     (`behind`) é tirado ANTES de o véu entrar no body, senão ele marcaria a si
     mesmo como inerte e nada dentro do visor receberia foco. */
  const behind = [...document.body.children];
  for (const n of behind) n.setAttribute("inert", "");
  document.body.append(scrim);

  S.visor = { scrim, behind, origem: origem || null };
  x.onclick = fecharVisor;
  /* Só o VÉU fecha, nunca um clique nascido dentro da caixa: sem o teste de
     `target`, arrastar para selecionar o nome do arquivo e soltar fora do texto
     fecharia o visor no meio da seleção. Mesma guarda do seletor de fluxo. */
  scrim.onclick = ev => { if (ev.target === scrim) fecharVisor(); };
  x.focus();
}

function fecharVisor() {
  const v = S.visor;
  if (!v) return;
  S.visor = null;
  for (const n of v.behind) n.removeAttribute("inert");
  v.scrim.remove();
  /* O `<a>` QUE ABRIU COSTUMA NÃO EXISTIR MAIS. `render()` reescreve o `#app`, e a
     conversa repinta várias vezes por segundo enquanto uma rodada corre: entre
     abrir e fechar o visor cabem dezenas de repaints, e o nó que recebeu o clique
     já foi descartado. Devolver o foco a um nó fora do documento derruba o foco no
     `body` de qualquer jeito, e o Tab recomeça do topo da página — é o defeito que
     o handoff do `flows.html` conserta reencontrando o botão por `data-key`.
     AQUI NÃO DÁ PARA REENCONTRAR POR SELETOR, e é por isso que a queda é no
     `body`: `a.banx-img` casaria com qualquer anexo da conversa, e devolver o foco
     para o print errado é pior que devolvê-lo ao documento — o segundo é uma
     posição neutra, o primeiro é uma afirmação falsa sobre onde ele estava.
     Focar o `body` não quebra: é devolver o foco ao documento, e o Tab segue dali. */
  const volta = (v.origem && document.contains(v.origem)) ? v.origem : document.body;
  if (volta && volta.focus) volta.focus();
}

/* O ESC DO VISOR, e ele NÃO tem ouvinte próprio — ver a nota na cadeia de captura
   do `keydown`. Devolve `true` quando consumiu a tecla, que é o contrato de
   `tecladoSeletor` e `tecladoGaveta`: quem consome interrompe a cadeia, e o que
   está atrás dela é o `parar()`, que custa uma rodada já paga. */
function tecladoVisor(e) {
  if (!S.visor) return false;
  if (e.key === "Escape") { e.preventDefault(); fecharVisor(); return true; }
  /* Qualquer outra tecla segue a cadeia: o `inert` já tirou o resto da página da
     ordem de tabulação, e o visor tem dois focáveis só. */
  return false;
}

/* O TUTORIAL — a faixa de convite e o player — mora no `/tutorial.js` SERVIDO.
 *
 * Ele saiu daqui e não foi copiado para as outras duas páginas: o Fluxos e o
 * Tester pediram o mesmo botão, e uma cópia seria a QUINTA desta base (topbar,
 * `.aviso`, modo gravação, e o `entradas.js` que já foi extraído justamente para
 * parar essa fila). O precedente certo é `aba.js`/`entradas.js`, e é ele.
 *
 * O que ficou nesta página é só o que é DELA: o slug, onde a faixa entra, os três
 * marcos DESTE vídeo, o fim da frase do convite, e o lugar do módulo nas duas
 * cadeias (o clique delegado e a captura do teclado). Ver `TUT().configurar` mais
 * acima e `tutorial-test.js`, que falha no dia em que esta página voltar a
 * declarar o bloco ou o CSS por conta própria. */

/* ═══════════════ A TELINHA DE PROGRESSO DO DOSSIÊ ═══════════════════════════
 *
 * O PEDIDO, com estas palavras: "abre uma telinha e fica mostrando o progresso, e
 * se eu clicar voltar pra vitrine, ele precisa ficar realizando o dossiê mesmo
 * assim, e mostrar no card do fluxo a porcentagem".
 *
 * METADE DISSO JÁ ERA VERDADE, e vale escrever porque muda o que faltava fazer: a
 * escrita SEMPRE rodou no servidor (`dossieJob` é singleton lá) e SEMPRE sobreviveu
 * à navegação — o que morria era a PERGUNTA, porque `acompanharDossie` só era
 * chamado de dentro da tela do fluxo. Então o que se construiu aqui foi a janela e
 * o caminho de volta, não a persistência.
 *
 * DIÁLOGO DE VERDADE, com a mecânica que esta página já tem em TRÊS lugares
 * (`confirmar()`, `abrirSeletor`, `abrirVisor`) — copiada de lá, nunca reinventada:
 * `role`, `aria-modal`, `aria-labelledby`, `inert` nos outros filhos do `body`, Esc,
 * clique no véu, botão de fechar visível e o foco de volta para quem abriu. Um
 * quarto jeito de fazer modal nesta página seria um quarto jeito de errar o foco.
 *
 * NÃO EXISTE BOTÃO DE CANCELAR, e o rodapé diz por quê em vez de o botão faltar em
 * silêncio: não há caminho de cancelamento no `dossie.js` — nenhuma rota, nenhum
 * sinal, nenhum `AbortController` — e um botão que promete parar e não para é pior
 * que a ausência dele. O que interrompe de verdade é fechar a JANELA do cockpit,
 * porque é o processo dele que escreve; isso está escrito lá, como fato.
 *
 * ELA NÃO FECHA SOZINHA NO FIM. Quando `escrevendo` vira `false` ela TROCA para o
 * desfecho — escreveu, ou não passou nas checagens com o motivo. Fechar sozinha
 * esconderia justamente o desfecho, que é a metade que este desenho promete nunca
 * esconder: um dossiê que ele ACREDITA fresco e está velho é pior que um que ele
 * sabe velho.
 *
 * ELA NASCE EM `document.body`, fora do `#app`, porque `render()` reescreve o `#app`
 * inteiro — dentro dele a telinha sumiria no primeiro evento do SSE. Quem a mantém
 * em dia é `pintarProgresso()`, chamado pelo `render()` e por um tique próprio. */

/* O TIQUE É DELA, e é separado do poll de propósito. O poll pergunta ao servidor a
   cada 5s (`DOSSIE_POLL_MS`); o relógio decorrido e a barra são aritmética local
   sobre `comecouEm`, e prender os dois ao mesmo intervalo faria o relógio andar de
   cinco em cinco segundos — um relógio que salta lê como travado, que é o oposto do
   que uma tela de progresso existe para dizer. */
const PROG_TIQUE_MS = 1000;

function abrirProgressoDossie(wfId, origem) {
  /* Uma telinha já aberta não abre outra: dois véus empilhados deixariam um `inert`
     para trás ao fechar o de cima — a mesma guarda do visor. */
  if (S.prog || !wfId) return;

  const scrim = document.createElement("div");
  scrim.className = "prog-scrim";
  const cx = document.createElement("div");
  cx.className = "prog";
  cx.setAttribute("role", "dialog");
  cx.setAttribute("aria-modal", "true");
  cx.setAttribute("aria-labelledby", "prog-tit");

  const hd = document.createElement("div"); hd.className = "prog-hd";
  const ix = document.createElement("span"); ix.className = "idx"; ix.textContent = "[ DOSSIÊ ]";
  const h3 = document.createElement("h3"); h3.id = "prog-tit";
  hd.append(ix, h3);

  const corpo = document.createElement("div"); corpo.className = "prog-corpo";
  const ft = document.createElement("div"); ft.className = "prog-ft";
  cx.append(hd, corpo, ft);
  scrim.append(cx);

  /* O retrato dos irmãos é tirado ANTES de o véu entrar no body, senão ele marcaria
     a si mesmo como inerte e nada dentro da telinha receberia foco. */
  const behind = [...document.body.children];
  for (const n of behind) n.setAttribute("inert", "");
  document.body.append(scrim);

  S.prog = { wf: String(wfId), scrim, cx, h3, corpo, ft, behind,
    origem: origem || null, tique: null, fechar: null, nEtapas: 0 };
  /* Só o VÉU fecha, nunca um clique nascido dentro da caixa: sem o teste de
     `target`, arrastar para selecionar o nome do fluxo e soltar fora do texto
     fecharia a telinha no meio da seleção. Mesma guarda do seletor e do visor. */
  scrim.onclick = ev => { if (ev.target === scrim) fecharProgressoDossie(); };

  pintarProgresso();
  if (S.prog && S.prog.fechar) S.prog.fechar.focus();
  S.prog.tique = setInterval(pintarProgresso, PROG_TIQUE_MS);
  /* E PERGUNTAR DE NOVO. Abrir a telinha a partir da vitrine ou de um F5 no meio da
     escrita pode acontecer com o poll parado; `acompanharDossie` já recusa
     reiniciar o que está acompanhando o mesmo fluxo, então isto é barato e nunca
     zera a janela de corrida de um poll em curso. */
  acompanharDossie(wfId);
}

function fecharProgressoDossie() {
  const P = S.prog;
  if (!P) return;
  S.prog = null;
  if (P.tique) clearInterval(P.tique);
  for (const n of P.behind) n.removeAttribute("inert");
  P.scrim.remove();
  /* O BOTÃO QUE ABRIU COSTUMA NÃO EXISTIR MAIS: `render()` reescreve o `#app` e o
     poll repinta a cada 5s, então entre abrir e fechar cabem dezenas de repaints.
     Procura-se primeiro o nó original, depois QUALQUER porta de progresso na tela
     (mesma lição do `data-seletor`), e a queda é o `#app` — devolver o foco a um nó
     fora do documento derruba tudo no `body` e o Tab recomeça do topo da página. */
  const volta = (P.origem && document.contains(P.origem) && P.origem)
    || document.querySelector("[data-prog]") || app;
  if (volta) { if (!volta.tabIndex || volta.tabIndex < 0) volta.tabIndex = -1; volta.focus(); }
}

/* O ESC DELA, e ela NÃO tem ouvinte próprio — ver a nota na cadeia de captura do
   `keydown`. Devolve `true` quando consumiu a tecla, que é o contrato de
   `tecladoVisor`, `tecladoSeletor` e `tecladoGaveta`: quem consome interrompe a
   cadeia, e o que está atrás dela é o `parar()`, que custa uma rodada já paga. */
function tecladoProgresso(e) {
  if (!S.prog) return false;
  if (e.key === "Escape") { e.preventDefault(); fecharProgressoDossie(); return true; }
  return false;
}

/* Escrever texto sem sujar o DOM à toa. Importa mais do que parece: o corpo desta
   caixa é `aria-live`, e reescrever o mesmo texto a cada segundo faria um leitor de
   tela anunciar a mesma frase 60 vezes por minuto. */
const poeTxt = (el, txt) => { const s = String(txt == null ? "" : txt); if (el.textContent !== s) el.textContent = s; };

function pintarProgresso() {
  const P = S.prog;
  if (!P) return;

  /* A FONTE É O MAPA DA TELA DO FLUXO PRIMEIRO, o da vitrine depois. O primeiro é a
     leitura mais fresca que existe (é ele que o poll atualiza) e é o único que traz
     o desfecho — a fatia da vitrine carrega só a posição. Cair no segundo é o caso
     de abrir a telinha a partir de um cartão antes de a primeira volta do poll ter
     acontecido. */
  const d = S.dossie.get(P.wf) || S.dossieVit.get(P.wf) || null;
  const fl = (S.fluxos || []).find(x => String(x.id) === P.wf);
  poeTxt(P.h3, (fl && fl.nome) || (d && d.nome) || P.wf);

  const job = d && d.job;
  const p = progressoDossie(job);
  const escrevendo = !!p;

  /* ── o corpo ── */
  P.corpo.innerHTML = "";
  P.corpo.setAttribute("role", "status");
  P.corpo.setAttribute("aria-live", "polite");

  if (!d) {
    /* TRÊS ESTADOS OUTRA VEZ, e este é o "ainda não sei": a resposta do servidor não
       chegou. Dizer "acabou" aqui seria inventar um desfecho. */
    P.corpo.append(paraProg("prog-porque", "Conferindo o estado desta escrita…"));
  } else if (escrevendo) {
    if (job.etapaI != null) P.corpo.append(etapasProg(job, p));
    /* A LINHA VIVA vem do `diz` de dentro da escrita: é o único fato que se move
       sozinho, e é o mesmo que o `title` do selo já carrega. */
    const at = paraProg("prog-at", job.atividade || "…");
    at.title = String(job.atividade || "");
    P.corpo.append(at);

    const bar = document.createElement("div");
    bar.className = "pbar prog-bar" + (p.indeterminado ? " unknown" : (p.estourou ? " over" : ""));
    const fill = document.createElement("div");
    fill.className = "pfill";
    /* A barra cresce por `transform`, nunca por `width`: ela atualiza a cada
       segundo durante minutos, e animar largura recalcula layout a cada quadro.
       No indeterminado o `scaleX` é do CSS (listra andando) e nada é escrito aqui —
       um número inventado ali seria uma afirmação onde não há medida. */
    if (!p.indeterminado) fill.style.transform = "scaleX(" + p.pct.toFixed(4) + ")";
    bar.append(fill);
    /* O QUE UM LEITOR DE TELA OUVE. Sem isto a barra é uma div vazia; com `role` e
       os três valores, ela é a mesma informação sem depender de enxergar. No
       indeterminado o `valuenow` é OMITIDO de propósito: é o que a norma reserva
       para "andando, valor desconhecido". */
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", "100");
    if (!p.indeterminado) bar.setAttribute("aria-valuenow", String(Math.round(p.pct * 100)));
    bar.setAttribute("aria-label", "progresso da escrita do dossiê");
    P.corpo.append(bar);

    const nums = document.createElement("div");
    nums.className = "prog-nums";
    nums.append(paraProg("", "há " + dur(p.decorridoMs)));
    if (p.rodadaTxt) nums.append(paraProg("", p.rodadaTxt));
    const dir = paraProg("dir" + (p.estourou ? " over" : ""),
      p.indeterminado ? "sem estimativa" : Math.round(p.pct * 100) + "%");
    nums.append(dir);
    P.corpo.append(nums);
    P.corpo.append(paraProg("prog-porque", fraseProgresso(p)));
  } else if (job) {
    P.corpo.append(desfechoProg(job));
  } else {
    /* `job` NULO COM ESTADO PRESENTE: o servidor guarda uma escrita por vez, e o
       registro é substituído pela próxima — de QUALQUER fluxo. Isso não é "não
       aconteceu" e não é "falhou": é "não tenho mais o registro", e o que sobra de
       verdadeiro é o semáforo, que continua medindo a divergência real. */
    const s = seloDossie(d);
    P.corpo.append(paraProg("prog-porque",
      "O cockpit não tem mais o registro desta escrita — ele guarda uma por vez, e outra começou "
      + "depois desta. O estado do dossiê agora é: " + s.txt + "."));
  }

  /* ── o rodapé ── */
  P.ft.innerHTML = "";
  if (escrevendo) {
    const ul = document.createElement("ul");
    /* TRÊS FATOS, E NENHUM INVENTADO. O primeiro responde "posso fechar?"; o segundo
       responde "e como eu paro?", que é a pergunta que a ausência de um botão de
       cancelar levanta; o terceiro é a fronteira que esta aba repete em toda tela,
       porque ela escreve em dois lugares muito diferentes. */
    for (const txt of [
      "Fechar esta janela não para a escrita: ela roda no processo do cockpit, não nesta aba.",
      "O que interrompe de verdade é fechar a JANELA DO COCKPIT — não existe cancelamento pela tela, e um botão que prometesse parar sem parar seria pior que nenhum.",
      "Nada disto é escrito no n8n. O dossiê é um arquivo local."
    ]) { const li = document.createElement("li"); li.textContent = txt; ul.append(li); }
    P.ft.append(ul);
  } else {
    const ul = document.createElement("ul");
    const li = document.createElement("li");
    li.textContent = "Nada foi escrito no n8n. O dossiê é um arquivo local.";
    ul.append(li);
    P.ft.append(ul);
  }
  /* O RÓTULO DIZ O QUE O CLIQUE FAZ, que é a regra desta casa — e aqui ele muda com
     o estado porque a consequência muda: com a escrita correndo, fechar é sair de
     perto de algo que continua; com ela terminada, fechar é só fechar. */
  const x = document.createElement("button");
  x.type = "button"; x.className = "x";
  const xg = document.createElement("span");
  xg.setAttribute("aria-hidden", "true"); xg.textContent = "✕";
  x.append(xg, document.createTextNode(escrevendo ? "fechar (a escrita continua)" : "fechar"));
  x.onclick = fecharProgressoDossie;
  P.ft.append(x);
  P.fechar = x;
}

/* Um `<div>` com classe e texto. Existe para o corpo ser montado por DOM e nunca
   por `innerHTML`: a atividade e o motivo do erro vêm do servidor, ou seja de fora,
   e `textContent` fecha essa porta sem depender de ninguém lembrar de escapar —
   mesma razão pela qual `avisar()` e o visor são montados assim. */
function paraProg(cls, txt) {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = String(txt == null ? "" : txt);
  return el;
}

/* AS QUATRO ETAPAS. `etapaTotal` vem do `dossie.js` (`ETAPAS.length`) e é ele que
   diz quantas linhas existem — nenhum 4 cravado aqui. O RÓTULO de cada uma sai da
   ordem do `PROG_ETAPA`, que é a mesma lista fechada; a linha CORRENTE usa o
   `faseTxt`, que é o nome medido que chegou, e é por isso que uma etapa que este
   mapa não conhece aparece como o nome cru entre aspas em vez de virar outra.
   A SEQUÊNCIA ANDA PARA TRÁS e a lista aguenta isso sem parecer quebrada: uma
   rodada reprovada volta de `conferindo` para `escrevendo`, e as linhas depois da
   corrente simplesmente voltam a ser pendentes. Quem avança é a rodada. */
function etapasProg(job, p) {
  const nomes = Object.keys(PROG_ETAPA);
  const total = Math.max(1, Math.min(12, Number(job.etapaTotal) || nomes.length));
  const i = Number(job.etapaI);
  const box = document.createElement("div");
  box.className = "prog-etapas";
  for (let n = 1; n <= total; n++) {
    const el = document.createElement("div");
    el.className = "prog-et" + (n < i ? " feita" : n === i ? " agora" : "");
    const num = document.createElement("span");
    num.className = "n";
    num.setAttribute("aria-hidden", "true");
    num.textContent = n < i ? "✓" : n === i ? "▸" : "·";
    const q = document.createElement("span");
    q.className = "q";
    q.textContent = (n === i && p.faseTxt) ? p.faseTxt : (PROG_ETAPA[nomes[n - 1]] || "etapa " + n);
    el.append(num, q);
    box.append(el);
  }
  return box;
}

/* O DESFECHO. Ele é a metade que este desenho promete nunca esconder, e por isso a
   telinha não fecha sozinha quando `escrevendo` vira `false`.
   O QUE ESTÁ AQUI VEM DO `job` E NADA É DERIVADO: `resultado` quando escreveu,
   `erro` quando reprovou. As RECUSAS do portão NÃO viajam nesta rota — o
   `dossieResumo()` do servidor não as inclui —, então esta tela não promete
   mostrá-las: ela mostra o motivo, que é o que existe. Prometer uma lista que nunca
   chega seria a mesma pasta inexistente que o `REGRAS.md` já prometeu uma vez. */
function desfechoProg(job) {
  const box = document.createElement("div");
  const r = job.resultado;
  if (r) {
    box.className = "prog-res ok";
    const b = document.createElement("b"); b.textContent = "✓ dossiê escrito";
    const partes = [];
    if (r.nos != null) partes.push(r.nos + " parágrafo(s) refeito(s)");
    if (r.bytes != null) partes.push(kb(r.bytes) + " de prosa");
    if (r.rodadas != null) partes.push(r.rodadas + " rodada(s)");
    if (r.ms != null) partes.push(dur(r.ms));
    /* O PREÇO SÓ SAI SE FOI MEDIDO. Uma rodada morta reporta `usd: 0`, e escrever
       "US$0,00" afirmaria que saiu de graça uma escrita que pode ter sido a mais
       cara da série — é a mesma lição do `usdDesconhecido`. */
    if (r.usd) partes.push(usdTxt(r.usd));
    box.append(b, document.createTextNode(partes.join(" · ")));
    return box;
  }
  box.className = "prog-res mau";
  const b = document.createElement("b"); b.textContent = "⊘ a escrita não terminou";
  box.append(b, document.createTextNode(job.erro
    ? String(job.erro)
    : "a escrita parou e o servidor não registrou o motivo."));
  const nota = document.createElement("div");
  /* UMA TENTATIVA REPROVADA GASTOU COTA E NÃO PRODUZIU NADA, e é isso que separa
     isto de "sem dossiê": o `.md` anterior continua onde estava, com a idade que
     tinha. Voltar para "sem dossiê" calado seria apagar uma tentativa paga. */
  nota.textContent = "O dossiê que já existia não foi tocado — a escrita só publica no fim. "
    + "A cota gasta nesta tentativa não volta.";
  box.append(nota);
  return box;
}

/* Troca de tela mexendo na URL, não só no estado: assim o botão Voltar do
   browser funciona e a tela de um fluxo tem endereço para colar. `replaceState`
   não serviria — voltar da tela do fluxo para a vitrine é navegação de verdade. */
/* ═════════════════════════ O SELETOR DE FLUXO ═══════════════════════════════
 *
 * O QUE ELE É: a telinha de escolher em qual fluxo mexer. Escolher ABRE o fluxo —
 * não filtra a grade. A diferença com o `flows.html` é essa e ela é o desenho
 * inteiro: lá a escolha recorta uma lista de execuções que continua na tela, aqui
 * ela é navegação, porque "escolher qual fluxo eu quero mexer" É abrir. Filtrar a
 * grade para um cartão só e exigir um segundo clique nele seria um clique a mais
 * para chegar ao mesmo lugar.
 *
 * MODAL E NÃO POPOVER, pelo mesmo motivo de lá: um popover cairia por cima da
 * grade, que é justamente o que se está lendo para escolher. E ele nasce em
 * `document.body`, fora do `#app`, porque `render()` reescreve o `#app` inteiro —
 * dentro dele o seletor sumiria no primeiro evento que repintasse a tela.
 *
 * A LISTA É UM RETRATO DO MOMENTO EM QUE ABRIU, e isso é herdado de lá com a mesma
 * razão: repintar a lista sob o cursor moveria o item que está a um Enter de ser
 * escolhido. Os SELOS, sim, atualizam no lugar (ver `pintarSelosSeletor`): mudam
 * texto e cor de uma célula, nunca a ordem nem quantas linhas existem.
 *
 * O TECLADO NÃO TEM OUVINTE PRÓPRIO. Ele entra na cadeia de captura da página
 * (`tecladoSeletor`), acima do `parar()` e abaixo do `.scrim`. Com um ouvinte só
 * para ele, um Esc fecharia o seletor E pararia a rodada em curso — duas ações
 * diferentes na mesma tecla, que é o defeito que a nota do `tecladoGaveta` já
 * descreve por inteiro. */

function abrirSeletor(origem) {
  if (S.seletor) return;
  const grupos = gruposDoSeletor(S.fluxos || []);
  if (!grupos.length) return;

  const scrim = document.createElement("div");
  scrim.className = "fmod-scrim";
  const cx = document.createElement("div");
  cx.className = "fmod";
  cx.setAttribute("role", "dialog");
  cx.setAttribute("aria-modal", "true");
  cx.setAttribute("aria-labelledby", "sel-tit");

  const hd = document.createElement("div");
  hd.className = "fmod-hd";
  const ix = document.createElement("span"); ix.className = "idx"; ix.textContent = "[ FLUXO ]";
  const h3 = document.createElement("h3"); h3.id = "sel-tit"; h3.textContent = "Em qual fluxo você quer mexer";
  const x = document.createElement("button");
  x.className = "x"; x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Fechar");
  hd.append(ix, h3, x);

  const cxBusca = document.createElement("div");
  cxBusca.className = "fmod-busca";
  const bs = document.createElement("div"); bs.className = "fbusca";
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = "nome do fluxo ou do projeto…";
  inp.setAttribute("aria-label", "Buscar fluxo");
  const kb = document.createElement("span"); kb.className = "kbd"; kb.textContent = "ESC";
  bs.append(lupaSvg(), inp, kb);
  cxBusca.append(bs);

  const lista = document.createElement("div");
  lista.className = "fmod-lista";
  lista.setAttribute("role", "listbox");
  const ft = document.createElement("div");
  ft.className = "fmod-ft";

  cx.append(hd, cxBusca, lista, ft);
  scrim.append(cx);

  const behind = [...document.body.children];
  for (const n of behind) n.setAttribute("inert", "");
  document.body.append(scrim);

  S.seletor = { scrim, cx, inp, lista, ft, grupos, behind, origem: origem || null, cur: 0, itens: [] };
  x.onclick = fecharSeletor;
  /* Só o VÉU fecha, nunca um clique que nasceu dentro da caixa: sem o teste de
     `target`, arrastar para selecionar o nome de um fluxo e soltar fora do texto
     fecharia a telinha no meio da seleção. */
  scrim.onclick = ev => { if (ev.target === scrim) fecharSeletor(); };
  /* Digitar volta o cursor para o topo. Sem isso, filtrar com o cursor na quinta
     linha e apertar Enter abriria um fluxo que não é o primeiro da lista que ele
     está lendo — e a lista mudou justamente porque ele digitou. */
  inp.oninput = () => { if (S.seletor) { S.seletor.cur = 0; pintarSeletor(); } };
  pintarSeletor();
  inp.focus();

  /* OS SELOS DOS 64 DE FORA NÃO ESTÃO NA VARREDURA DE BOOT, que cobre só a vitrine.
     Sem este pedido, aquelas linhas ficariam em "conferindo o dossiê…" para sempre —
     e essa frase seria falsa, porque ninguém estaria conferindo. É a mesma regra de
     três estados que este arquivo já escreveu sete vezes, e aqui a saída é fazer a
     frase ficar VERDADEIRA em vez de inventar um quarto rótulo.
     CUSTA QUASE NADA, e isto é medido: um fluxo sem `.md` é respondido cinza sem
     nenhuma leitura do n8n (`estado(null, wf)`), e hoje 2 dos 75 têm `.md`. A rota
     ainda tem cache de 15 min do lado do servidor.
     `meta: false` porque `S.dossieVitMeta` alimenta a FRASE DA VITRINE, que fala dos
     11 cartões: deixar uma varredura de 75 escrever ali faria aquela frase relatar
     leituras de fluxos que não estão na grade. */
  const semSelo = grupos.flatMap(g => g.fluxos).map(f => String(f.id)).filter(id => !S.dossieVit.has(id));
  if (semSelo.length) varrerDossies(semSelo, { meta: false });
}

function fecharSeletor() {
  const s = S.seletor;
  if (!s) return;
  S.seletor = null;
  for (const n of s.behind) n.removeAttribute("inert");
  s.scrim.remove();
  /* O BOTÃO QUE ABRIU COSTUMA NÃO EXISTIR MAIS: `render()` reescreve o `#app`, e
     entre abrir e fechar cabe a varredura dos selos, que termina chamando `render()`.
     Então o foco volta pelo SELETOR (`[data-seletor]`) e não pela referência ao nó —
     mesma lição do handoff do `flows.html`, onde o foco caía no body e o Tab
     recomeçava do topo da página. */
  const volta = (s.origem && document.contains(s.origem) && s.origem)
    || document.querySelector("[data-seletor]") || app;
  if (volta) { if (!volta.tabIndex || volta.tabIndex < 0) volta.tabIndex = -1; volta.focus(); }
}

/* O filtro casa por NOME e por PROJETO, e o projeto sai de `partesNome` — o mesmo
   corte do cartão. Buscar "roberto" tem de achar `[ROBERTO] Cron — …` mesmo que a
   palavra não esteja no nome visível do cartão. */
function passaSeletor(f, q) {
  if (!q) return true;
  const p = partesNome(f.nome);
  return (p.nome + " " + (p.proj || "") + " " + f.nome).toLowerCase().includes(q);
}

function pintarSeletor() {
  const s = S.seletor;
  if (!s) return;
  const q = s.inp.value.trim().toLowerCase();
  s.lista.innerHTML = "";
  s.itens = [];
  let vis = 0, total = 0;

  /* "Voltar para a vitrine" só existe com um fluxo aberto. Na própria vitrine ela
     seria uma linha que não faz nada — e a lição do `.fitem.todos` do `flows.html`
     (tirar o filtro tem de custar o mesmo que pô-lo) aqui vira outra coisa: o que
     custa é VOLTAR, e o botão "← vitrine" do cabeçalho já faz isso. Esta linha é o
     mesmo caminho sem sair do teclado. */
  if (S.sel) {
    const b = document.createElement("button");
    b.className = "fitem todos";
    b.type = "button";
    const d = document.createElement("span"); d.className = "dotst"; d.style.background = "var(--cold)";
    const nm = document.createElement("span"); nm.className = "nm";
    const n1 = document.createElement("span"); n1.className = "n1"; n1.textContent = "Voltar para a vitrine";
    const n2 = document.createElement("span"); n2.className = "n2"; n2.textContent = "fechar este fluxo";
    nm.append(n1, n2);
    const num2 = document.createElement("span"); num2.className = "num";
    const ex = document.createElement("span"); ex.className = "ex";
    ex.textContent = String((s.grupos.find(g => g.chave === "vitrine") || { fluxos: [] }).fluxos.length);
    const nos = document.createElement("span"); nos.className = "nos"; nos.textContent = "cartões";
    num2.append(ex, nos);
    b.append(d, nm, num2);
    b.onclick = () => escolherNoSeletor(null);
    s.lista.append(b);
    s.itens.push(b);
  }

  for (const g of s.grupos) {
    const doGrupo = g.fluxos.filter(f => passaSeletor(f, q));
    total += g.fluxos.length;
    if (!doGrupo.length) continue;
    vis += doGrupo.length;

    const cab = document.createElement("div");
    cab.className = "fmod-grp";
    const tt = document.createElement("b"); tt.textContent = SELETOR_GRUPO[g.chave].titulo;
    const nt = document.createElement("span"); nt.className = "nt";
    nt.textContent = SELETOR_GRUPO[g.chave].nota(g.fluxos.length);
    cab.append(tt, nt);
    s.lista.append(cab);

    for (const f of doGrupo) s.itens.push(linhaSeletor(f, s));
  }

  if (!vis) {
    const vazio = document.createElement("div");
    vazio.className = "fmod-vazio";
    vazio.textContent = "Nenhum fluxo desta instância tem esse nome.";
    s.lista.append(vazio);
  }

  s.ft.innerHTML = "";
  const k1 = document.createElement("span"); k1.className = "kbd"; k1.textContent = "↑↓";
  const k2 = document.createElement("span"); k2.className = "kbd"; k2.textContent = "ENTER";
  const k3 = document.createElement("span"); k3.className = "kbd"; k3.textContent = "ESC";
  const tot = document.createElement("span"); tot.className = "tot";
  tot.textContent = vis + " de " + total + " fluxos";
  s.ft.append(k1, document.createTextNode("andar"), k2, document.createTextNode("abrir"),
    k3, document.createTextNode("fechar"), tot);

  s.cur = Math.max(0, Math.min(s.cur, s.itens.length - 1));
  marcarSeletor();
}

function linhaSeletor(f, s) {
  const b = document.createElement("button");
  b.className = "fitem" + (String(f.id) === String(S.sel) ? " aqui" : "");
  b.type = "button";
  b.dataset.id = String(f.id);

  /* O PONTO É A SAÚDE DE EXECUÇÃO, `pontoStatus`, o mesmo vocabulário do cartão.
     Se aqui ele significasse "estado do dossiê", dois pontos vermelhos na mesma
     tela quereriam dizer coisas diferentes — e o dossiê já tem a linha do selo. */
  const d = document.createElement("span");
  d.className = "dotst";
  d.style.background = "var(--" + pontoStatus(f) + ")";

  const nm = document.createElement("span"); nm.className = "nm";
  const p = partesNome(f.nome);
  const n1 = document.createElement("span"); n1.className = "n1"; n1.textContent = p.nome;
  nm.append(n1);
  /* Sem prefixo, o nome já é a identidade inteira: escrever "SEM PREFIXO" em quatro
     linhas seguidas é ruído no lugar onde se procura um nome. Mesma decisão de lá. */
  if (p.proj) {
    const n2 = document.createElement("span"); n2.className = "n2"; n2.textContent = p.proj;
    nm.append(n2);
  }
  const selo = document.createElement("span");
  selo.className = "sel";
  selo.dataset.selo = String(f.id);
  nm.append(selo);

  const num2 = document.createElement("span"); num2.className = "num";
  const ex = document.createElement("span"); ex.className = "ex"; ex.textContent = num(f.exec24);
  const nos = document.createElement("span"); nos.className = "nos"; nos.textContent = num(f.nos) + " nós";
  num2.append(ex, nos);

  b.append(d, nm, num2);
  b.onclick = () => escolherNoSeletor(String(f.id));
  s.lista.append(b);
  pintarUmSelo(selo, f.id);
  return b;
}

/* O SELO DE UMA LINHA. `seloDossie` é reusado INTEIRO — o mesmo glifo, o mesmo
   texto e a mesma decisão de trava do cartão. Uma segunda redação de "sem dossiê ·
   conversa travada" aqui divergiria da do cartão no primeiro ajuste, e as duas
   telas passariam a discordar sobre qual fluxo aceita conversa. */
function pintarUmSelo(cel, id) {
  const s = seloDossie(S.dossieVit.get(String(id)));
  cel.className = "sel " + s.cls;
  cel.title = s.tit;
  cel.innerHTML = "";
  const g = document.createElement("span");
  g.className = "g"; g.setAttribute("aria-hidden", "true"); g.textContent = s.glifo;
  cel.append(g, document.createTextNode(s.txt));
}

/* Atualiza SÓ as células de selo, no lugar. Chamado no fim de `render()`, que é
   por onde a varredura anuncia que chegou. Não reordena e não muda a quantidade de
   linhas: o item que está a um Enter de ser escolhido não pode andar. */
function pintarSelosSeletor() {
  if (!S.seletor) return;
  for (const cel of S.seletor.lista.querySelectorAll("[data-selo]")) {
    pintarUmSelo(cel, cel.dataset.selo);
  }
}

function marcarSeletor() {
  const s = S.seletor;
  if (!s) return;
  s.itens.forEach((v, i) => v.classList.toggle("cur", i === s.cur));
  if (s.itens[s.cur]) s.itens[s.cur].scrollIntoView({ block: "nearest" });
}

/* FECHA ANTES DE NAVEGAR. `irPara` chama `render()`, que reescreve o `#app`; com o
   véu ainda de pé, o `inert` que ele pôs nos irmãos do body continuaria ali por um
   instante e o foco voltaria para um nó já descartado. */
function escolherNoSeletor(id) {
  const mesmo = id && String(id) === String(S.sel);
  fecharSeletor();
  if (mesmo) return;   // escolher o fluxo aberto é só fechar: nada a recarregar
  irPara(id);
}

function tecladoSeletor(e) {
  const s = S.seletor;
  if (!s) return false;
  if (e.key === "Escape") { e.preventDefault(); fecharSeletor(); return true; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!s.itens.length) return true;
    e.preventDefault();
    s.cur = Math.max(0, Math.min(s.cur + (e.key === "ArrowDown" ? 1 : -1), s.itens.length - 1));
    marcarSeletor();
    return true;
  }
  if (e.key === "Enter" && s.itens[s.cur]) { e.preventDefault(); s.itens[s.cur].click(); return true; }
  /* Qualquer outra tecla é digitação no filtro, e o cursor volta para o topo: com
     ele preso na quinta linha, um Enter depois de filtrar abriria um fluxo que não
     é o primeiro da lista que ele está lendo. */
  return false;
}

/* A lupa DESENHADA. `⌕` (U+2315) sai como um círculo vazio nesta fonte — medido na
   captura do Tester, mesma armadilha de `📎` e `🗀`. */
function lupaSvg() {
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", "14"); s.setAttribute("height", "14");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.9"); s.setAttribute("stroke-linecap", "round");
  s.setAttribute("aria-hidden", "true");
  s.style.flex = "0 0 auto"; s.style.color = "var(--txt-faint)";
  const c = document.createElementNS(ns, "circle");
  c.setAttribute("cx", "10.5"); c.setAttribute("cy", "10.5"); c.setAttribute("r", "6.5");
  const l = document.createElementNS(ns, "path");
  l.setAttribute("d", "M15.5 15.5 L20 20");
  s.append(c, l);
  return s;
}

function irPara(id) {
  S.sel = id || null;
  // Trocar de fluxo fecha a gaveta: ela lista as conversas DAQUELE fluxo, e deixá-la
  // aberta mostraria a lista do fluxo anterior por cima da tela do novo.
  if (S.gaveta) { S.gaveta = false; if (S.gavEl && S.gavEl.parentNode) S.gavEl.remove(); S.gavEl = null; limparInert(); }
  const u = new URL(location.href);
  if (id) u.searchParams.set("f", id); else u.searchParams.delete("f");
  // O `?c=` é de uma conversa daquele fluxo: sair dele deixa o endereço apontando
  // para nada, e um `?c=` órfão é exatamente a tela em branco sem explicação.
  u.searchParams.delete("c");
  history.pushState({ f: S.sel }, "", u);
  S.convApagada = null;
  if (id) { pesar([id]); reatar(id); verDossie(id); carregarHist(id); }
  else {
    S.convId = null; S.conv = null; S.hist = null; S.histErro = null; S.histDe = null;
    if (S.es) { try { S.es.close(); } catch {} S.es = null; }
    /* VOLTAR PARA A VITRINE RECONFERE OS SELOS. A varredura de boot pode ter meia
       hora, e nesse meio tempo ele aplicou um patch, escreveu um dossiê ou editou um
       fluxo no n8n — as três coisas mudam a cor. É um GET com cache de 15 min do
       lado do servidor, então na maioria das vezes não custa leitura nenhuma. */
    if (S.fluxos) varrerDossies(S.fluxos.filter(naPorta).map(f => f.id));
  }
  render();
}
addEventListener("popstate", () => {
  const v = new URLSearchParams(location.search).get("f");
  const antes = S.sel;
  S.sel = v && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : null;
  // Voltar fecha a gaveta: ela é a lista de UM fluxo, e a lista do fluxo anterior
  // por cima da tela nova seria a pior forma de errar qual conversa se abre.
  if (S.gaveta) { S.gaveta = false; if (S.gavEl && S.gavEl.parentNode) S.gavEl.remove(); S.gavEl = null; limparInert(); }
  if (S.sel !== antes) { S.hist = null; S.histErro = null; S.histDe = null; S.convApagada = null; }
  if (S.sel) { verDossie(S.sel); carregarHist(S.sel); reatar(S.sel); }
  render();
});

function render() {
  const f = S.sel ? (S.fluxos || []).find(x => String(x.id) === String(S.sel)) : null;
  // `?f=` de um fluxo que não chegou na porta (ou que não existe) não pode virar
  // tela em branco: cai na vitrine dizendo o que aconteceu.
  if (S.sel && S.fluxos && !f) {
    S.erro = "o fluxo do link (?f=" + S.sel + ") não está na vitrine: ou não existe, ou não chegou na porta.";
    S.sel = null;
  }
  const comp = capturarInputs();
  app.innerHTML = f ? telaFluxo(f) : telaVitrine();
  // Abrir um fluxo é abrir UMA tela: o rodapé de 80px que a vitrine precisa para
  // rolar em paz aqui só empurraria o cartão para fora da janela.
  app.classList.toggle("cheio", !!f);
  // A gaveta é re-anexada ANTES de restaurar os campos: o `#hgv-q` mora dentro
  // dela, e restaurar o foco de um campo que ainda não está no documento não faz
  // nada. Sem isto o filtro perdia o foco a cada evento do SSE.
  pintarGaveta();
  /* O overlay é re-anexado como a gaveta, e pelo mesmo motivo: ele vive fora do
     `#app`, que acabou de ser reescrito inteiro. */
  pintarVerif();
  /* O SELETOR não é re-anexado como a gaveta e o overlay: ele vive em
     `document.body`, então `render()` não o alcança. O que ele precisa daqui é o
     aviso de que os selos chegaram — a varredura termina chamando `render()`, e
     esta linha atualiza só as células de selo, sem reordenar nada. */
  pintarSelosSeletor();
  /* A TELINHA DO DOSSIÊ, pelo mesmo motivo do seletor: ela vive em `document.body`,
     então `render()` não a alcança. O que ela precisa daqui é o aviso de que a
     leitura nova chegou — o poll termina chamando `render()`, e esta linha atualiza
     o conteúdo dela sem recriar o nó (recriar mataria a transição da barra e o
     foco de quem estiver nela). */
  pintarProgresso();
  restaurarInputs(comp);
  /* O palco é re-anexado como a gaveta e o overlay, e pelo mesmo motivo — ver
     `pintarPalco()`. Ele devolve se RECONSTRUIU o nó, e só nesse caso a câmera é
     remontada: no nó preservado os listeners e o `ResizeObserver` continuam
     vivos, e remontar os duplicaria.
     A câmera depende do desenho já estar no DOM: ela lê o mundo do `data-vw/vh` e
     as posições dos nós acesos das próprias caixas que acabaram de ser pintadas. */
  if (f) { if (pintarPalco(f)) montarCamera(); rolarConversa(comp); }

  app.querySelectorAll(".vcard").forEach(b => {
    b.addEventListener("click", () => { irPara(b.getAttribute("data-id")); });
  });
  const v = document.getElementById("voltar");
  if (v) v.addEventListener("click", () => { irPara(null); });
  const bEnv = document.getElementById("enviar");
  if (bEnv) bEnv.addEventListener("click", enviar);
  const cp = document.getElementById("cp");
  if (cp) cp.addEventListener("keydown", ev => {
    // Enter envia, Shift+Enter quebra linha. É conversa, não formulário.
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); enviar(); }
  });
  /* VOZ E ANEXO. Religado a cada pintura de propósito: `render()` reescreve o
     `#app` inteiro, então os botões desta pintura são nós NOVOS — registrar uma
     vez só deixaria o clique caindo num nó que já foi descartado, que é o defeito
     "o botão pinta e não faz nada, sem erro no console" documentado logo abaixo.
     A caixa é o `.compositor`, porque é nela que a borda de arrastar aparece e é
     dentro dela que os chips vivem.
     `repintar` é o `render()` de sempre: `capturarInputs`/`restaurarInputs` já
     carregam texto, foco e caret por cima, então subir um arquivo não custa a
     frase que ele estava montando. */
  const caixaIO = app.querySelector(".compositor");
  if (caixaIO) IO().ligarIO("up", caixaIO, cp, S.convId, () => render());
  /* O × DOS CHIPS DA TIRA, ligado à parte — e isso não é esquecimento de passar
     outra caixa para o `ligarIO`. Ele liga `[data-tirar]` DENTRO da caixa que
     recebe, e essa caixa é também o alvo do arrastar (`.sobre`): passar um invólucro
     que englobasse a tira moveria a borda de "solte aqui" para um lugar onde soltar
     não é o gesto. Então a caixa continua sendo o `.compositor` e a tira ganha o
     mesmo `tirarAnexo` do módulo — a função exportada, nunca uma segunda cópia dela.
     E ela é ligada MESMO COM O COMPOSITOR TRAVADO: a tira sobrevive à trava, e um ×
     que pinta e não faz nada é o defeito silencioso que esta página já pagou. */
  for (const tb of app.querySelectorAll(".anxgav [data-tirar]")) {
    tb.addEventListener("click", () => IO().tirarAnexo(tb.dataset.tirar, S.convId, () => render()));
  }
  const bPara = document.getElementById("parar");
  if (bPara) bPara.addEventListener("click", parar);
  /* Os quatro botões do §4/§6 NÃO são registrados aqui — são delegados, uma vez
     só, em `ligarDelegacao()`. Ver o comentário de lá. */
  const bCorr = document.getElementById("corrige-alvo");
  if (bCorr) bCorr.addEventListener("click", () => { const t = document.getElementById("cp"); if (t) t.focus(); });
  /* Trocar de proposta é decisão de VISTA, não de servidor: nada é pedido, nada é
     gasto. Repinta só, e `S.qualPatch` sobrevive ao repaint porque vive em `S`. */
  for (const bt of document.querySelectorAll(".dois button")) {
    bt.addEventListener("click", () => {
      const q = bt.dataset.qual === "desligado" ? "desligado" : "normal";
      if (S.qualPatch === q) return;
      S.qualPatch = q;
      /* A bateria da OUTRA proposta é outro veredito: ela tem de acender, porque o
         que está na tela mudou. Zerar a assinatura é o que garante isso. */
      S.batAssin = "";
      render();
    });
  }
  const a = document.getElementById("abrir-n8n");
  if (a && f) a.addEventListener("click", () => {
    if (S.instancia) window.open(S.instancia + "/workflow/" + encodeURIComponent(f.id), "_blank", "noopener");
  });
  /* O botão do dossiê NÃO é registrado aqui: ele aparece em dois lugares e é
     delegado uma vez só, em `ligarDelegacao()`. Ver o comentário de lá. */
  const bHist = document.getElementById("hgv-bt");
  if (bHist) bHist.addEventListener("click", () => { if (S.gaveta) fecharGaveta(); else abrirGaveta(); });
}

/* ─────────────────────────────────────────────────────────────── o dossiê ── */

/* Perguntado DEPOIS da primeira pintura, como o peso e o call graph: ele custa
   uma leitura do workflow, e a tela do fluxo tem de aparecer antes. Enquanto não
   chega, a faixa diz que está perguntando — nunca "sem dossiê". */
async function verDossie(id, forcar) {
  const k = String(id);
  if (!forcar && S.dossie.has(k)) return;
  try {
    S.dossie.set(k, await callApi("/api/upgrade/dossie/" + encodeURIComponent(k)));
  } catch (e) {
    S.dossie.set(k, { erro: e.message });
  }
  /* O SELO DA VITRINE ANDA COM ESTA LEITURA, que é a mais fresca que existe. Sem
     isto, aplicar um patch e voltar para a vitrine mostraria o cartão verde por até
     15 minutos enquanto esta mesma tela já dizia vermelho — duas telas discordando
     sobre quem trava a conversa, que é o pior desencontro possível aqui. */
  S.dossieVit.set(k, S.dossie.get(k));
  render();
}

/* A VARREDURA DA VITRINE — depois da primeira pintura, como o peso e o call graph.
 *
 * Custa uma leitura do fluxo por fluxo que TEM dossiê (hoje 2 de 75; um fluxo sem
 * `.md` é cinza sem ninguém ler o n8n), então na prática é barata — mas o teto
 * medido é 18,3s para 75 de 75, e a vitrine não pode esperar por isso para
 * aparecer.
 *
 * EM LOTES DE 40 porque é o teto da rota, o mesmo do `/peso`. Sem os lotes, o dia
 * em que 41 fluxos chegassem na porta a varredura voltaria 400 e TODOS os selos
 * ficariam em "conferindo" para sempre — uma falha que se parece com lentidão.
 *
 * A FALHA DE UM LOTE marca só os ids DAQUELE lote, e marca com `erro`: cinza
 * significa "nunca foi escrito" e levaria à decisão oposta. */
async function varrerDossies(ids, opcoes) {
  /* `meta: false` é o que o SELETOR pede, e a razão é uma frase que fica falsa de
     graça: `S.dossieVitMeta` alimenta `resumoDossieVitrine(vivos)`, que fala dos
     cartões da grade ("nenhum dossiê apodreceu", "N não deu para conferir"). Uma
     varredura dos 75 escrevendo ali faria aquela frase contar leituras de fluxos
     que não estão na tela — números certos sobre a pergunta errada. O DEFAULT é
     `true`, então os dois chamadores antigos não mudam de comportamento. */
  const comMeta = !opcoes || opcoes.meta !== false;
  const alvos = [...new Set((ids || []).map(String))];
  if (!alvos.length) return;
  const lotes = [];
  for (let i = 0; i < alvos.length; i += 40) lotes.push(alvos.slice(i, i + 40));
  let lidos = 0, falhas = 0, quando = null;
  for (const lote of lotes) {
    try {
      const r = await callApi("/api/upgrade/dossies?ids=" + encodeURIComponent(lote.join(",")));
      for (const d of r.dossies || []) S.dossieVit.set(String(d.id), d);
      lidos += Number(r.lidos || 0); falhas += Number(r.falhas || 0); quando = r.geradoEm || quando;
    } catch (e) {
      for (const id of lote) S.dossieVit.set(id, { id, erro: e.message });
      falhas += lote.length;
    }
  }
  if (comMeta) S.dossieVitMeta = { lidos, falhas, geradoEm: quando };
  /* UMA ESCRITA JÁ EM CURSO ENCONTRADA PELA VARREDURA COMEÇA A SER ACOMPANHADA
     SOZINHA. É o caso do F5 no meio de uma escrita, e o do cockpit aberto noutra
     aba: sem esta linha, a tira do topo e o selo do cartão nasceriam com a posição
     do momento da varredura e ficariam PARADOS nela por 15 minutos — uma
     porcentagem congelada é pior que nenhuma, porque parece que a escrita travou.
     A escrita é uma por processo, então `find` basta e o poll é de um fluxo só;
     `acompanharDossie` recusa reiniciar o que já está acompanhando o mesmo. */
  for (const [id, d] of S.dossieVit) {
    if (d && d.job && d.job.escrevendo) { acompanharDossie(id); break; }
  }
  render();
}

/* Escrever custa minutos e cota, então é confirmado — e o diálogo diz o preço
   quando existe e diz que não sabe quando não existe. Nunca `confirm()` nativo:
   ele chega como "localhost:4317 diz", com a fonte do sistema, e não sabe
   distinguir ação destrutiva de reversível. */
/* ACOMPANHAR UMA ESCRITA EM CURSO — UMA definição, DOIS caminhos.
 *
 * A rota devolve 202 e o trabalho segue no servidor: segurar a resposta por 11
 * minutos seria um fetch que qualquer proxy derruba no meio, com o dossiê escrito e
 * a tela dizendo que falhou. Então a tela pergunta de novo.
 *
 * OS DOIS CAMINHOS SÃO O CLIQUE E O AUTOMÁTICO. Enquanto isto morava dentro do
 * `escreverDossie`, a escrita que começa sozinha depois de aplicar (§2.8
 * flexibilizada por decisão do Kauan) não tinha quem a acompanhasse: o recibo ficava
 * parado em "está sendo atualizado sozinho agora" para sempre, e o desfecho — que é
 * a metade que este desenho promete nunca esconder — só apareceria num F5. Duas
 * cópias do laço divergiriam no primeiro conserto feito de um lado só.
 *
 * A CONDIÇÃO DE PARADA OLHA OS DOIS FATOS, e por um motivo medido: o gatilho do
 * automático roda DEPOIS de a rota do apply responder, então nos primeiros instantes
 * não existe nem `job` nem `auto.ultimo` — parar aí encerraria o acompanhamento
 * antes de a escrita começar. Daí a JANELA DE CORRIDA das primeiras voltas.
 *
 * E EXISTE TETO. Um `setInterval` que só para por condição fica batendo no servidor
 * para sempre no dia em que um estado inesperado aparecer, numa aba que fica aberta
 * o dia todo. O teto é o dobro do pior caso medido (682s), com folga. */
const DOSSIE_POLL_MS = 5000;
const DOSSIE_POLL_CORRIDA = 3;     // voltas em que "nada ainda" não é motivo para parar
const DOSSIE_POLL_TETO = 300;      // ~25 min a 5s: o dobro do pior caso medido, com folga

function acompanharDossie(id) {
  const k = String(id);
  /* JÁ ACOMPANHANDO ESTE MESMO FLUXO É NÃO FAZER NADA, e essa guarda é o que
     permite chamar isto de vários lugares — o clique que começa a escrita, a
     telinha ao abrir, a varredura da vitrine que descobre uma escrita já em curso.
     Sem ela, cada chamada reiniciaria o intervalo E zeraria a janela de corrida:
     um poll que nunca amadurece, batendo no servidor para sempre. */
  if (S.dossiePoll && S.dossiePollDe === k) return;
  if (S.dossiePoll) { clearInterval(S.dossiePoll); S.dossiePoll = null; }
  S.dossiePollDe = k;
  let volta = 0;
  /* O TIMER É DA PÁGINA, NÃO DA TELA DO FLUXO, e isso é metade do pedido dele:
     "se eu clicar voltar pra vitrine, ele precisa ficar realizando o dossiê mesmo
     assim". A ESCRITA sempre sobreviveu à navegação (o `dossieJob` é singleton do
     servidor); o que morria era a PERGUNTA, porque este laço só era iniciado de
     dentro da tela do fluxo e nada o mantinha vivo depois. Ele vive em `S`, nenhum
     caminho de navegação o limpa (conferido em `irPara` e em `render`), e o que o
     encerra continua sendo o desfecho ou o teto. */
  S.dossiePoll = setInterval(async () => {
    volta++;
    /* UM FLUXO, e é por isso que isto é barato o suficiente para rodar na vitrine:
       é o mesmo GET da tela do fluxo, uma vez a cada 5s, não a varredura dos 75.
       `verDossie` escreve nos DOIS mapas (`S.dossie` e `S.dossieVit`), senão o selo
       do cartão envelheceria enquanto a tira do topo está fresca — duas caches, duas
       idades, as duas telas discordando sobre o mesmo fato. */
    await verDossie(k, true);
    const at = S.dossie.get(k);
    const escrevendo = !!(at && at.job && at.job.escrevendo);
    const autoCorrendo = !!(at && at.auto && at.auto.ultimo && at.auto.ultimo.estado === "correndo");
    if (escrevendo || autoCorrendo) { if (volta < DOSSIE_POLL_TETO) return; }
    else if (volta <= DOSSIE_POLL_CORRIDA) return;
    clearInterval(S.dossiePoll); S.dossiePoll = null; S.dossiePollDe = null;
  }, DOSSIE_POLL_MS);
}

async function escreverDossie(f) {
  const d = S.dossie.get(String(f.id));
  if (!d || (d.job && d.job.escrevendo) || d.ocupado) return;
  /* O DIÁLOGO DESCREVE O TRABALHO QUE VAI ACONTECER, não "uma escrita de dossiê" em
     geral. Ele dizia "vai ler os 179 nós" e cotava US$4,14 mesmo quando o conserto
     é de três parágrafos — e é este diálogo o último lugar antes do gasto. */
  const parcial = modoDoClique(d) === "incremental";
  const pr = parcial ? d.incremental.preco : d.preco;
  const preco = pr && pr.usd
    ? "Deve custar cerca de " + usdTxt(pr.usd) + ", pela mediana das " + pr.amostras
      + (parcial ? " escritas parciais já medidas." : " escritas inteiras já medidas.")
    : "Ainda não há histórico para estimar o preço" + (parcial ? " de uma escrita parcial" : "")
      + " — as duas primeiras escritas medidas é que criam a régua.";
  const trabalho = parcial
    ? "Uma sessão local vai refazer " + (d.incremental.regenerar
        ? d.incremental.regenerar + " parágrafo(s) de " + f.nome + " mais a «visão geral»"
        : "a «visão geral» de " + f.nome)
      + ", e herdar os outros " + d.incremental.herdar + " como estão."
    : "Uma sessão local vai ler os " + d.nos + " nós de " + f.nome + " e escrever a prosa que descreve cada trecho.";
  /* A ETIQUETA DA HERANÇA VAI NO DIÁLOGO, não só no arquivo. A impressão digital
     prova que aqueles nós não mudaram — nunca que a prosa sobre eles continua
     verdadeira depois que um vizinho mudou. Quem paga a escrita mais barata tem de
     saber o que está comprando de menos. */
  const ressalva = parcial
    ? "Parágrafo herdado não é re-derivado: a impressão digital prova que aquele nó não mudou, nunca que a frase sobre ele segue verdadeira depois que outro nó mudou."
    : null;
  const tempo = parcial
    ? "Uma escrita parcial nunca foi medida nesta máquina — a inteira levou 514s num fluxo de 103 nós e 682s num de 179, e a parcial consome a mesma cota do plano."
    : "Leva minutos — medido: 514s num fluxo de 103 nós, 682s num de 179 — e consome a mesma cota do plano de uma conversa sua.";
  /* METADE DESTE COMENTÁRIO ERA FALSA, e a metade falsa era a que decidia o foco.
     Conferido no código, 2026-08-20:
       · "nada vai para o n8n" — VERDADE. Nenhuma função do `dossie.js` importa
         `putWorkflow` ou `createWorkflow`; o `publicar()` entra na fila do
         `comEscrita` só para segurar a vez, e o que roda dentro é um GET e um
         `rename` local.
       · "nada é apagado" — FALSO. `publicar()` faz `fsp.rename(tmp, alvo)` sobre o
         `.md` que já está lá, `.cache-fluxos/` é gitignored, e não existe `versoes[]`
         nem backup: os 57KB de prosa do Iago, que custaram US$4,14, são substituídos
         sem cópia em lugar nenhum. Reescrever um dossiê VERDE destrói prosa que
         estava certa.
     O FOCO CONTINUA NO BOTÃO DE AÇÃO, e agora por um motivo declarado em vez de por
     uma premissa errada: `perigo` acende o único botão vermelho deste código, que o
     `CLAUDE.md` reserva para o que DELETA — gastá-lo aqui gastaria o alarme antes de
     a exclusão precisar dele. O que a premissa errada escondia entra onde ela devia
     estar desde o começo: no corpo do diálogo, que é o último lugar antes do gasto. */
  const substitui = d.cor !== "cinza" && !parcial
    ? "A prosa que está lá agora é SUBSTITUÍDA, e não há cópia dela em lugar nenhum — "
      + "o arquivo não é versionado em git."
    : null;
  const ok = await confirmar({
    tag: "DOSSIÊ",
    titulo: d.cor === "cinza" ? "Escrever o dossiê deste fluxo?"
      : parcial ? "Consertar só os parágrafos que envelheceram?" : "Reescrever o dossiê inteiro deste fluxo?",
    corpo: [
      trabalho,
      tempo,
      preco,
      ressalva,
      substitui,
      "Nada é escrito no n8n. O dossiê é um arquivo local, e a conversa passa a lê-lo em vez de reler o fluxo inteiro."
    ].filter(Boolean),
    botao: d.cor === "cinza" ? "Escrever" : parcial ? "Consertar" : "Reescrever",
    perigo: false
  });
  if (!ok) return;
  try {
    /* `?incremental=1` É PEDIDO EXPLÍCITO, e é o que faz o preço cotado ser o preço
       gasto. Sem a flag o servidor faz o rewrite inteiro que sempre fez. Se a
       admissão caiu entre a leitura e o clique, a rota RECUSA com 409 em vez de cair
       para o inteiro — o consentimento foi dado sobre a cotação parcial. */
    await callApi("/api/upgrade/dossie/" + encodeURIComponent(f.id) + (parcial ? "?incremental=1" : ""), { method: "POST" });
    await verDossie(f.id, true);
    acompanharDossie(f.id);
    /* A TELINHA ABRE SOZINHA NO CLIQUE — é literalmente o que ele pediu ("abre uma
       telinha e fica mostrando o progresso"). DEPOIS do POST dar certo e nunca
       antes: uma janela de progresso sobre uma escrita que o servidor recusou (409
       de "já estou escrevendo o de X") mostraria progresso de coisa nenhuma, e o
       `catch` logo abaixo é quem tem a frase certa para esse caso. */
    abrirProgressoDossie(f.id);
  } catch (e) {
    /* `S.erro` + `.aviso-inline` é o caminho que esta página já tem. Não trago o
       `avisar()` do `tester.html` junto: seria uma quinta cópia de outro bloco,
       e um 409 daqui é informação ancorada ("já estou escrevendo o de X"), não
       um evento que precisa flutuar. */
    S.erro = "não consegui começar a escrita do dossiê: " + e.message;
    render();
  }
}

/* Peso e desenho vêm DEPOIS da primeira pintura, como o call graph já faz: eles
   custam uma leitura do workflow por fluxo, e a vitrine tem de aparecer antes. */
async function pesar(ids) {
  const faltando = (ids || []).filter(id => !S.peso.has(String(id)));
  if (!faltando.length) return;
  try {
    const r = await callApi("/api/upgrade/peso?ids=" + encodeURIComponent(faltando.join(",")));
    for (const p of r.pesos || []) {
      S.peso.set(String(p.id), p);
      const f = (S.fluxos || []).find(x => String(x.id) === String(p.id));
      if (f) { f.tokens = p.tokens; f.bytes = p.bytes; f.graph = p.graph; }
    }
    render();
  } catch (e) {
    S.erro = "não consegui pesar os fluxos: " + e.message;
    render();
  }
}

async function carregar() {
  try {
    const r = await callApi("/api/upgrade/vitrine");
    S.fluxos = r.fluxos || [];
    S.instancia = r.instancia || null;
    S.erro = null;
    document.getElementById("instance").textContent = r.instancia || "—";
    document.getElementById("stamp").textContent = r.lidoEm
      ? "janela de " + r.janelaHoras + "h · lido " + new Date(r.lidoEm).toLocaleTimeString("pt-BR")
      : "—";
    render();
    // Um F5 direto num `?f=` cai aqui, e a faixa do dossiê precisa perguntar
    // também nesse caminho, senão ela fica dizendo "perguntando…" para sempre.
    // O histórico entra na mesma lista pelo mesmo motivo: sem ele o botão da
    // gaveta ficaria em "lendo o histórico…" para sempre num F5.
    if (S.sel) { reatar(S.sel); verDossie(S.sel); carregarHist(S.sel); }
    // Pesa só os que estão na vitrine, na ordem em que aparecem.
