    const r = box.getBoundingClientRect();
    const cx = px == null ? r.width / 2 : px, cy = py == null ? r.height / 2 : py;
    const antes = paraMundo(cx, cy);
    S.cam.esc = trava(S.cam.esc * fator, ESC_MIN, ESC_MAX);
    const depois = paraMundo(cx, cy);
    S.cam.cx += antes.x - depois.x; S.cam.cy += antes.y - depois.y;
    pintar(); usada();
  };

  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = box.getBoundingClientRect();
    zoom(Math.pow(1.0018, -ev.deltaY), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  let de = null;
  svg.addEventListener("pointerdown", ev => {
    de = { px: ev.clientX, py: ev.clientY, cx: S.cam.cx, cy: S.cam.cy };
    svg.setPointerCapture(ev.pointerId); svg.classList.add("arrasta");
  });
  svg.addEventListener("pointermove", ev => {
    if (!de) return;
    S.cam.cx = de.cx - (ev.clientX - de.px) / S.cam.esc;
    S.cam.cy = de.cy - (ev.clientY - de.py) / S.cam.esc;
    pintar(); usada();
  });
  const solta = () => { de = null; svg.classList.remove("arrasta"); };
  svg.addEventListener("pointerup", solta);
  svg.addEventListener("pointercancel", solta);
  svg.addEventListener("dblclick", () => { irPara(cabeAgora(), true); usada(); });

  // Teclado: o desenho passou a ser interativo, e a regra desta base é que o que
  // se opera com o mouse se opera com o teclado.
  svg.addEventListener("keydown", ev => {
    const passo = 90 / S.cam.esc;
    const mapa = { ArrowLeft: [-passo, 0], ArrowRight: [passo, 0], ArrowUp: [0, -passo], ArrowDown: [0, passo] };
    if (mapa[ev.key]) { S.cam.cx += mapa[ev.key][0]; S.cam.cy += mapa[ev.key][1]; pintar(); usada(); ev.preventDefault(); return; }
    if (ev.key === "+" || ev.key === "=") { zoom(1.25); ev.preventDefault(); }
    else if (ev.key === "-" || ev.key === "_") { zoom(0.8); ev.preventDefault(); }
    else if (ev.key === "0") { irPara(cabeAgora(), true); usada(); ev.preventDefault(); }
  });

  const liga = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener("click", fn); };
  liga("cam-caber", () => { irPara(cabeAgora(), true); usada(); });
  liga("cam-mais", () => zoom(1.3));
  liga("cam-menos", () => zoom(1 / 1.3));
  liga("cam-alvo", () => {
    const r = extentoAcesos(svg);
    if (r) { irPara(regiaoAgora(r), true); usada(); }
  });

  // A janela mudando de tamanho muda o mundo visível, não o enquadramento.
  if (S.camObs) S.camObs.disconnect();
  S.camObs = new ResizeObserver(() => pintar());
  S.camObs.observe(box);
}

/* ═══════════════════════════════ O PALCO, VIVO ═══════════════════════════════
 *
 * O NÓ DO PALCO É PRESERVADO ENTRE REPAINTS, pelo mesmo motivo e no mesmo molde
 * de `pintarGaveta()` e `pintarVerif()` — e este é o maior dos três.
 *
 * Medido no fluxo do Iago: 184 nós e 220 arestas viram 97KB de string e 1.140
 * elementos SVG. `render()` reescreve o `#app` inteiro, e uma rodada emite
 * `atividade` VÁRIAS VEZES POR SEGUNDO (o próprio comentário do listener do SSE
 * já dizia isso). Enquanto o palco era parte da string de `telaFluxo()`, cada um
 * desses eventos remontava os 97KB, o navegador reparseava os 1.140 elementos, e
 * `montarCamera()` religava sete listeners e criava um `ResizeObserver` novo.
 *
 * O que decide reconstruir é o que o desenho MOSTRA — alvo aceso, nós falhos, e a
 * identidade do grafo — nunca a atividade. `atividade` não muda um pixel do
 * palco, então não pode custar um único elemento.
 *
 * A identidade do grafo é comparada À PARTE das contagens: dois grafos diferentes
 * podem ter o mesmo número de nós e de arestas, e aí a assinatura sozinha diria
 * que nada mudou. Comparar o objeto resolve isso em O(1) e sem hash. */
const palcoAssinatura = f => JSON.stringify([
  String(S.sel),
  f && f.graph ? [f.graph.nos.length, (f.graph.arestas || []).length] : null,
  [...nosAcesos()].sort(),
  [...nosFalhos(f)].sort()
]);

/* Chamado no fim de todo `render()`, ANTES de `montarCamera()` — a câmera lê
   `.pn.on` do DOM em `extentoAcesos()` para voar até o alvo, então o desenho tem
   de estar anexado antes.
   Devolve se RECONSTRUIU, e é isso que decide se a câmera é remontada: com o nó
   preservado, os sete listeners e o `ResizeObserver` sobrevivem nele, e chamar
   `montarCamera()` de novo os DUPLICARIA — um arraste passaria a andar o dobro.
   O enquadramento não se perde ao pular a remontagem: ele vive em `S.cam` e já
   está aplicado no `viewBox` do nó que ficou. */
function pintarPalco(f) {
  const host = document.getElementById("palco-host");
  if (!host) {
    /* Sem hospedeiro é a vitrine (ou um fluxo que não existe). Solta o nó: voltar
       para o fluxo tem de reconstruir, porque `S.fluxos` pode ter sido relido e o
       grafo daquele momento não é necessariamente este. */
    S.palcoEl = null; S.palcoAssin = null; S.palcoGrafo = null;
    return false;
  }
  const assin = palcoAssinatura(f);
  const grafo = f ? f.graph : null;
  const mudou = !S.palcoEl || S.palcoAssin !== assin || S.palcoGrafo !== grafo;
  if (mudou) {
    const casca = document.createElement("div");
    casca.innerHTML = palco(grafo, nosAcesos(), nosFalhos(f));
    S.palcoEl = casca.firstElementChild;
    S.palcoAssin = assin;
    S.palcoGrafo = grafo;
  }
  if (S.palcoEl && S.palcoEl.parentNode !== host) host.appendChild(S.palcoEl);
  return mudou;
}

/* --------------------------------------------------------------- vitrine ---- */

function cartao(f) {
  const p = peso(f);
  const { proj, nome } = partesNome(f.nome);
  return '<button class="vcard' + (morno(f) ? " morno" : "") + '" data-id="' + esc(f.id) + '">'
    + '<div class="vc-art">' + mini(f, 258, 96)
    + '<span class="vc-nos">' + num(f.nos) + "</span></div>"
    + '<div class="vc-bd">'
    + '<div class="vc-nm"><span class="sdot ' + pontoStatus(f) + '"></span><span class="nm">' + esc(nome) + "</span></div>"
    + '<div class="vc-sub">' + (proj ? esc(proj) + " · " : "") + esc(estadoTexto(f)) + "</div>"
    + '<div class="vc-ft"><span class="big">' + num(f.exec24) + '</span><span class="un">exec/24h</span>'
    + (p ? '<span class="tag ' + p.cls + ' peso">' + p.faixa + " · " + milTok(p.tokens) + " tok</span>"
         : '<span class="tag cold peso">pesando…</span>')
    + "</div>" + linhaSeloDossie(f) + "</div></button>";
}

/* O selo, desenhado. Ele fica em LINHA PRÓPRIA e não no rodapé do cartão: o rodapé
   já tem o número grande, a unidade e a etiqueta de peso, e a quarta coisa
   estourava os 292px do cartão. Em cima do desenho ele também não vai — ali o fundo
   é um degradê com grade, e cor de status como texto sobre fundo indefinido é
   justamente a medição de contraste que este projeto já reprovou quatro vezes.
   Reaproveita as classes `.tag` que o peso já usa: nenhum par de cor novo entra,
   então nenhuma medição nova é prometida. */
function linhaSeloDossie(f) {
  const s = seloDossie(S.dossieVit.get(String(f.id)));
  return '<div class="vc-dos"><span class="tag ' + s.cls + (s.travado ? " travado" : "") + '"'
    + ' title="' + esc(s.tit) + '"><span class="g" aria-hidden="true">' + s.glifo + "</span> "
    + esc(s.txt) + "</span></div>";
}

/* A TIRA DE ESCRITA EM CURSO, NO TOPO DA VITRINE.
 *
 * POR QUE UMA TIRA E NÃO UM BOTÃO DENTRO DO CARTÃO: o cartão da vitrine É um
 * `<button class="vcard">`, e botão dentro de botão é HTML inválido — o navegador
 * quebra o aninhamento e o clique de dentro vira o clique de fora, ou seja abrir o
 * fluxo em vez de abrir o progresso. Então a porta de volta mora FORA dos cartões.
 *
 * ELA SÓ EXISTE ENQUANTO HÁ ESCRITA. Uma faixa permanente dizendo "nenhuma escrita
 * em curso" seria mais uma linha para o olho aprender a pular, e a vitrine já tem
 * a frase do semáforo logo abaixo.
 *
 * O TEXTO É O MESMO DO SELO (`seloDossie`), REUSADO INTEIRO, mais o nome do fluxo:
 * uma segunda redação de "escrevendo o dossiê… · 41%" aqui divergiria da do cartão
 * no primeiro ajuste feito de um lado só, e as duas passariam a discordar sobre a
 * mesma escrita a três centímetros de distância. */
function tiraEscrevendo() {
  for (const [id, d] of S.dossieVit) {
    if (!d || !d.job || !d.job.escrevendo) continue;
    const fl = (S.fluxos || []).find(x => String(x.id) === String(id));
    const nome = (fl && fl.nome) || d.nome || String(id);
    const s = seloDossie(d);
    return '<button type="button" class="tira-esc" data-prog="1" data-wf="' + esc(String(id)) + '"'
      + ' title="' + esc(d.job.atividade || "") + '">'
      + '<span class="g" aria-hidden="true">✎</span>'
      + '<span class="q">' + esc(s.txt) + " de <b>" + esc(nome) + "</b></span>"
      + '<span class="ver">ver progresso →</span></button>';
  }
  return "";
}

function telaVitrine() {
  const vivos = (S.fluxos || []).filter(naPorta).sort(ordem);
  const erroBox = S.erro
    ? '<div class="aviso-inline"><span class="g">⚠</span><div>' + esc(S.erro) + "</div></div>" : "";
  if (!S.fluxos) return erroBox + '<div class="vazio">lendo a instância…</div>';
  if (!vivos.length) {
    /* O SELETOR TAMBÉM APARECE AQUI, e é a tela em que ele mais importa: "nenhum
       fluxo chegou na porta" é uma frase sobre a JANELA, e a instância pode ter 75
       fluxos parados. Sem este botão, a única tela onde a grade não oferece nada
       seria também a única sem saída. */
    return erroBox + tiraEscrevendo() + '<div class="vazio">nenhum fluxo chegou na porta: nada rodou na janela e nada está ativo.<br>'
      + "isto é uma frase sobre a instância, não sobre esta tela.<br><br>"
      + '<button class="btn sm" data-seletor="1">ver os ' + (S.fluxos || []).length
      + " fluxos da instância ▾</button></div>";
  }
  const semExec = vivos.filter(morno).length;
  return erroBox
    /* A TIRA VEM ANTES DO CABEÇALHO: uma escrita que está acontecendo AGORA é o
       único fato desta tela que muda sozinho, e ela é também a porta de volta para
       quem saiu da tela do fluxo no meio. Embaixo da grade ela estaria fora da
       vista exatamente em quem tem 11 cartões. */
    + tiraEscrevendo()
    /* O BOTÃO DO SELETOR NO CABEÇALHO. Ele não repete a grade: a grade mostra os 11
       que chegaram na porta, e a instância tem 75 — os outros 64 só se alcançavam
       colando `?f=<id>` na URL, o que exige saber o id. É por isso que ele diz
       "todos os fluxos" e não "filtrar". */
    /* A FAIXA DO TUTORIAL VEM ANTES DO CABEÇALHO, e a posição é o pedido: "não pode
       ser um botão tão discreto". Ela é a primeira coisa da tela para quem chega
       aqui pela primeira vez, e sai de vez quando ela clicar em "já vi" — o que
       fica é o `.tut-mini` no cabeçalho, ao lado do seletor. Depois da tira de
       escrita, porque uma escrita acontecendo agora é o único fato desta tela que
       muda sozinho e continua sendo o mais urgente. */
    + TUT().hero()
    + '<div class="up-hd"><span class="ix">[ 01 ]</span><h2>Qual fluxo você quer melhorar</h2>'
    + TUT().mini()
    + '<button class="btn sm abrir-sel" data-seletor="1" title="Escolher entre todos os '
    + (S.fluxos || []).length + ' fluxos da instância, inclusive os que não estão na grade">'
    /* `▾` e NÃO `⌕`: a lupa em texto (U+2315) sai como um círculo vazio nesta fonte
       — medido, e é a mesma armadilha de `📎` e `🗀`. Dentro da telinha ela existe
       DESENHADA (`lupaSvg`), que é onde ela vale a pena. */
    + "todos os fluxos ▾</button></div>"
    + '<p class="up-sub"><b>' + vivos.length + " fluxos</b> chegaram na porta"
    + (semExec ? " (" + semExec + " sem execução na janela, no fim e apagados)" : "")
    + ". A ordem é por execução: onde roda mais é onde um upgrade paga. O desenho é a "
    + "<b>posição real dos nós</b>; nó pintado de <span class=\"tag risk\">vermelho</span> falhou nas últimas 24h. "
    + "O peso é quanto custa <b>conversar</b> sobre aquele fluxo — não é cobrança, sai da mesma cota de plano "
    + "de uma sessão interativa.</p>"
    /* O SEMÁFORO DO DOSSIÊ, resumido antes da grade. Sem esta linha, o selo de cada
       cartão responde "e este?" e ninguém responde "e no geral?" — que é a pergunta
       que a varredura vem responder. */
    + '<p class="up-sub">' + resumoDossieVitrine(vivos) + " O selo de cada cartão diz o estado do "
    + "<b>dossiê</b> dele: sem dossiê em dia a conversa daquele fluxo não abre, e isso é "
    + "informação de antes do clique.</p>"
    + '<div class="vit">' + vivos.map(cartao).join("") + "</div>";
}

/* ---------------------------------------------------------- tela do fluxo -- */

/* A FAIXA DO DOSSIÊ.
 *
 * A cor vem do servidor (`dossie.estado`), porque a tela, o prompt da conversa e
 * a rota precisam da MESMA resposta — está declarado no `dossie.js`. O que este
 * bloco decide é o resto: a frase de cada estado, o texto do botão, e quando ele
 * pode ser clicado.
 *
 * QUATRO ESTADOS COM QUATRO FRASES DISTINTAS, e a distinção não é enfeite:
 * cinza (nunca escrito) e vermelho (desatualizado) levam a decisões OPOSTAS —
 * cinza é "vale escrever", vermelho é "o que está lá pode te enganar". Uma frase
 * só para os dois ensinaria a ignorar as duas. Este repositório pagou essa lição
 * três vezes: `docAgentes` ausente lido como negativo, `usd: 0` de rodada morta,
 * e `Response.json()` sobre corpo 404.
 *
 * Enquanto o estado não chegou, a faixa NÃO diz "sem dossiê": ela diz que está
 * perguntando. Ausência de resposta não é resposta negativa — é o mesmo erro que
 * o `docAgentes` cometeu.
 *
 * AS FRASES DE CINZA E VERMELHO FORAM REESCRITAS quando a trava entrou (ver
 * `podeConversar`). As duas terminavam em "a conversa lê o fluxo pelo índice", que
 * era verdade enquanto a conversa começava sem dossiê. Com a trava no ar ela não
 * lê nada — ela não começa. Uma frase que descreve algo que não acontece mais é
 * pior que frase nenhuma: ela ensina a não acreditar na faixa. */
const DOSSIE_FRASE = {
  verde: d => "em dia · " + d.paragrafos + " parágrafos, " + kb(d.bytes) + " de prosa no lugar de " + kb(d.bytesFluxo || 0) + " de JSON",
  laranja: d => d.quantosMudados + " nó(s) mudaram depois dele · vai para a conversa com esses parágrafos marcados",
  vermelho: d => d.motivo + " · não vai para a sessão · a conversa fica travada até ele ser atualizado",
  cinza: d => "nunca foi escrito para este fluxo · a conversa fica travada até ele existir"
};
const DOSSIE_CLS = { verde: "ok", laranja: "warn", vermelho: "risk", cinza: "cold" };
const kb = b => (Number(b || 0) / 1024).toFixed(0) + "KB";

/* ═══════ O PROGRESSO DE UMA ESCRITA DE DOSSIÊ — o juízo, sem DOM ═══════════
 *
 * O SERVIDOR MANDA POSIÇÃO E RÉGUA, NUNCA PORCENTAGEM: `etapa`/`etapaI`/
 * `etapaTotal` e `rodada`/`rodadas` são o que ele mediu, `duracao` é a mediana do
 * histórico DESTA máquina para o modo pedido. O que isso vale numa barra — quantos
 * por cento, que cor, que frase — é juízo, e mora aqui, do mesmo jeito que a cor do
 * semáforo sai do `dossie.estado()` e a faixa quem escreve é esta página. Um
 * denominador calculado no servidor seria uma segunda régua ao lado da que a tela
 * desenha.
 *
 * PURA, e pelo mesmo motivo de `podeConversar`, `resolverAlvo` e `custoDaRodada`:
 * quem decide o que a barra AFIRMA tem de ser testável sem browser e sem rede.
 *
 * TETO EM 97%, NUNCA 100% ANTES DE TERMINAR. Barra cheia com a tela parada é a
 * forma mais rápida de perder a confiança de um painel — está escrito no
 * `CLAUDE.md` desde a barra da correção, e vale igual aqui: a mediana é a mediana,
 * não uma promessa, e uma escrita que passar dela continua andando.
 *
 * TRÊS MOTIVOS DE INDETERMINADO, E OS TRÊS SÃO FRASES DIFERENTES — é a oitava vez
 * que esta base escreve a regra dos três estados, e aqui o ramo negativo perigoso é
 * "não tem histórico":
 *   · `campoAusente` — o campo `duracao` (ou o `comecouEm`) NÃO VEIO. O cockpit que
 *     está respondendo subiu antes desta versão do `server.js`, e Node não recarrega
 *     esse arquivo. Ler isso como "sem histórico" seria a tela dizer que a máquina
 *     nunca mediu nada numa máquina que tem régua de 4 escritas.
 *   · `lendo` — o campo veio `null`. A rota devolve 202 sem esperar a leitura do
 *     ledger, então por alguns instantes a resposta honesta é "ainda estou lendo".
 *   · `semRegua` — mediu e não há régua: `medianaMs` nulo com `amostras` contadas.
 *     Hoje é o caso de TODA escrita parcial (zero medidas nesta máquina), e isso é
 *     correto, não defeito — a primeira delas é que cria a régua.
 *
 * ETAPA DESCONHECIDA NÃO CAI NO PRIMEIRO RÓTULO: ela volta como o nome CRU entre
 * aspas, do mesmo jeito que `seloDossie` faz com uma cor que não conhece. E etapa
 * AUSENTE volta `null`, que é outro estado ainda: um processo velho que não manda o
 * campo não pode virar «undefined» escrito na tela. */
const PROG_ETAPA = {
  preparando: "lendo o fluxo e montando o diretório",
  escrevendo: "a sessão escrevendo a prosa",
  conferindo: "conferindo nos portões",
  publicando: "publicando o arquivo"
};

/* A frase de cada indeterminado. `semRegua` cita `amostras` porque 0 e 1 são
   histórias diferentes — "nunca" e "só uma vez, e a régua precisa de duas". */
const PROG_INDET = {
  campoAusente: () => "Não sei quanto falta: o cockpit que está respondendo subiu antes desta "
    + "versão do servidor e não manda a régua. Node não recarrega o `server.js` — feche a janela "
    + "do cockpit e abra de novo.",
  lendo: () => "Ainda estou lendo o histórico para saber quanto uma escrita destas costuma demorar.",
  semRegua: n => "Nunca medi uma escrita assim — não sei quanto falta"
    + (n ? " (" + n + " escrita medida até agora, e a régua precisa de duas)"
         : " (nenhuma escrita deste tipo foi medida nesta máquina)")
    + ". É esta que cria a régua."
};

/* `dur` é desta página. O `flows.html` tem um parecido e ele fica lá: importar um
   trecho de outra página seria a quarta cópia à mão desta base, e um formato de
   duração que diverge entre dois painéis do mesmo produto é ruído barato de evitar. */
const dur = ms => {
  const s = Math.max(0, Math.round((Number(ms) || 0) / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "min " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "min";
};

function progressoDossie(job, agora = Date.now()) {
  /* Sem escrita não há progresso, e `null` é o que faz cada chamador não desenhar
     nada em vez de desenhar um zero. Um 0% sobre uma escrita que não existe é uma
     afirmação, não um vazio. */
  if (!job || !job.escrevendo) return null;

  const t0 = Date.parse(job.comecouEm);
  const decorridoMs = Number.isFinite(t0) ? Math.max(0, agora - t0) : null;
  const faseTxt = job.etapa == null
    ? null
    : (PROG_ETAPA[job.etapa] || "«" + String(job.etapa) + "»");
  /* A SEQUÊNCIA NÃO É MONOTÔNICA e a tela tem de aguentar isso sem parecer que
     quebrou: uma rodada reprovada volta de `conferindo` para `escrevendo`, e o
     `etapaI` ANDA PARA TRÁS. O que avança é `rodada` — por isso ela é dita, e por
     isso a barra não é feita de etapas cumpridas. */
  const r = job.rodada, rs = job.rodadas;
  const rodadaTxt = r == null ? null : ("rodada " + r + (rs == null ? "" : "/" + rs));
  const base = { pct: null, indeterminado: true, porqueIndet: null, faseTxt, rodadaTxt,
    estourou: false, decorridoMs, medianaMs: null, amostras: null };

  if (!("duracao" in job) || decorridoMs === null) return { ...base, porqueIndet: "campoAusente" };
  if (job.duracao === null) return { ...base, porqueIndet: "lendo" };
  const d = job.duracao || {};
  const amostras = Number(d.amostras) || 0;
  const med = Number(d.medianaMs);
  if (!(med > 0)) return { ...base, porqueIndet: "semRegua", amostras };

  return { pct: Math.min(0.97, Math.max(0, decorridoMs / med)), indeterminado: false,
    porqueIndet: null, faseTxt, rodadaTxt, estourou: decorridoMs > med,
    decorridoMs, medianaMs: med, amostras };
}

/* A frase debaixo da barra. Ela é o que separa "andando, não sei quanto falta" de
   "andando, e já passou da mediana" — e a segunda NÃO é falha: a mediana é mediana,
   metade das escritas passa dela. Por isso `--warn` e nunca `--risk`. */
function fraseProgresso(p) {
  if (!p) return "";
  if (p.indeterminado) return (PROG_INDET[p.porqueIndet] || PROG_INDET.campoAusente)(p.amostras);
  if (p.estourou) {
    return "Já passou da mediana das " + p.amostras + " escritas medidas ("
      + dur(p.medianaMs) + "). Isso não é falha: metade das escritas passa dela — a barra para "
      + "de crescer aqui porque não sei mais quanto falta.";
  }
  return "Pela mediana das " + p.amostras + " escritas medidas, uma destas leva cerca de "
    + dur(p.medianaMs) + ".";
}

/* O SELO DO CARTÃO — o mesmo semáforo, na vitrine.
 *
 * POR QUE ELE EXISTE: a faixa acima só dispara quando a tela DAQUELE fluxo é
 * aberta. São 75 fluxos e ele abre três, então "quais dossiês apodreceram" não
 * tinha resposta sem 75 cliques. O pedido original era perguntar a ele se o fluxo
 * foi editado nos últimos dias; a máquina já mede isso — `dossie.estado()` compara
 * a impressão digital contra o fluxo VIVO, então edição feita no editor do n8n
 * move a digital igual a uma aplicada pelo cockpit. Pedir a um humano que confirme
 * um fato medido é como se colhe um "sim" errado.
 *
 * O QUE ELE DIZ QUE A FAIXA NÃO DIZ: com a trava no ar (`podeConversar`), cinza e
 * vermelho significam TAMBÉM "não dá para conversar com este fluxo" — e isso é
 * informação de ANTES do clique, não de depois. Por isso o `travado` sai do próprio
 * `podeConversar` e não de uma segunda lista de cores: duas definições de "trava"
 * divergem no primeiro ajuste feito num lado só, e aí o cartão convidaria a abrir
 * um fluxo que a tela seguinte recusa.
 *
 * TRÊS ESTADOS, NÃO DOIS — sexta vez que este arquivo escreve isto e a primeira em
 * que o preço seria só ruído em vez de dano: enquanto a varredura não respondeu, o
 * selo diz que está CONFERINDO. "Sem dossiê" sobre uma resposta que não chegou
 * acusaria o arquivo dele de não existir por causa de um fetch. E `erro` tem ramo
 * próprio: não deu para conferir é diferente de não existe.
 *
 * CINZA É A MAIORIA (2 dossiês, 75 fluxos) e por isso ele é QUIETO: `cold`, a
 * mesma cor do que está parado. Vermelho e laranja é que precisam saltar — são os
 * que apodreceram, que é a pergunta que esta varredura vem responder. Selo barulhento
 * em 12 de 14 cartões ensina a ignorar os 2 que importam. */
function seloDossie(d) {
  if (d === undefined || d === null) {
    return { cls: "cold", glifo: "·", txt: "conferindo o dossiê…", travado: false,
      tit: "a varredura ainda não respondeu por este fluxo. Isto não é «sem dossiê»." };
  }
  /* UMA definição de trava para todo estado PRESENTE, sem exceção nomeada: cada
     ramo abaixo lê o mesmo `podeConversar`. Um `travado: false` escrito à mão em
     qualquer um deles seria a segunda definição, e ela divergiria no primeiro
     ajuste feito num lado só — com o cartão convidando a abrir um fluxo que a tela
     seguinte recusa. O único estado que NÃO deriva é a ausência, lá em cima: a
     trava recusa quando não sabe, e o cartão não pode chamar isso de travado. */
  const travado = !podeConversar(d).pode;
  if (d.job && d.job.escrevendo) {
    /* O TEXTO DE ANTES NÃO MUDA — ele só GANHA CAUDA. "escrevendo o dossiê…" é o
       que dois testes fixam e é a frase que responde a pergunta do cartão; trocá-la
       por "41%" faria o número responder uma pergunta que ninguém fez ("41% de
       quê?"). A cauda é o que o cartão não tinha: ONDE ISSO ESTÁ.
       E ela tem três formas porque há três coisas que se pode saber: a porcentagem
       quando existe régua; a rodada quando não existe (é o que avança de verdade —
       o `etapaI` anda para trás numa rodada reprovada); e NADA quando não se sabe
       nem uma nem outra, que é melhor que um "0%" inventado. */
    const p = progressoDossie(d.job);
    const cauda = !p ? ""
      : !p.indeterminado ? " · " + Math.round(p.pct * 100) + "%"
      : p.rodadaTxt ? " · " + p.rodadaTxt
      : "";
    return { cls: "cold", glifo: "✎", txt: "escrevendo o dossiê…" + cauda, travado,
      tit: "uma sessão local está escrevendo o dossiê deste fluxo agora"
        + (d.job.atividade ? " — " + d.job.atividade : "") + "." };
  }
  if (d.erro || !DOSSIE_CLS[d.cor]) {
    return { cls: "cold", glifo: "?", txt: "dossiê: não deu para conferir", travado,
      tit: d.erro ? String(d.erro)
        : "o servidor respondeu um estado que esta tela não conhece («" + String(d.cor) + "»)." };
  }
  const cls = DOSSIE_CLS[d.cor];
  if (d.cor === "verde") {
    return { cls, glifo: "✓", txt: "dossiê em dia", travado,
      tit: "nenhum nó divergiu desde que ele foi escrito. Escrito por um modelo — a "
        + "impressão digital prova que o nó não mudou, nunca que a descrição estava certa." };
  }
  if (d.cor === "laranja") {
    const n = Number(d.quantosMudados || 0);
    return { cls, glifo: "⚠", txt: "dossiê velho · " + n + " nó(s)", travado,
      tit: n + " nó(s) mudaram depois do dossiê. Ele ainda vai para a sessão, com esses "
        + "parágrafos marcados — entregue com ressalva é entregue." };
  }
  if (d.cor === "vermelho") {
    return { cls, glifo: "⊘", txt: "dossiê velho · conversa travada", travado,
      tit: (d.motivo ? d.motivo + ". " : "")
        + "Desatualizado não é entregue à sessão, então a conversa sobre este fluxo fica "
        + "travada até ele ser atualizado." };
  }
  return { cls, glifo: "⊘", txt: "sem dossiê · conversa travada", travado,
    tit: "nunca foi escrito para este fluxo. Sem ele a conversa não abre: a sessão não "
      + "conheceria o fluxo e ia adivinhar o resto." };
}

/* A OFERTA DO RECIBO — o dossiê que o patch acabou de envelhecer.
 *
 * POR QUE NO RECIBO E POR QUE NÃO AUTOMÁTICO: o §2.8 do PLAN-UPGRADE diz que nada
 * regenera sozinho, e o §2.3.1 nomeia GASTO INVISÍVEL como o risco desta aba.
 * Automático é exatamente esse gasto. O recibo é o momento de maior consentimento
 * que existe nesta tela: ele acabou de clicar aplicar e está olhando o resultado —
 * é onde a oferta custa um clique e não uma caçada.
 *
 * O QUE ELA NÃO FAZ: inventar preço. O número sai de `d.preco`, que é a mediana das
 * escritas MEDIDAS nesta máquina, e é `null` com menos de duas — aí a frase diz que
 * não sabe, mesma disciplina do ETA da correção devolvendo `samples: 0`. Nenhuma
 * frase aqui afirma o que uma escrita parcial custa, porque nenhuma foi medida.
 *
 * ONDE ELA NÃO OFERECE NADA, e cada caso é uma decisão:
 *  - `verde`: nada envelheceu. Um botão de reescrever aqui seria gasto sem motivo.
 *  - `cinza`: não havia dossiê para envelhecer. Escrever um é uma decisão de outro
 *    tamanho (minutos e dólares) e não é consequência deste patch — ela vive na
 *    faixa da tela do fluxo, que é onde ela sempre esteve.
 *  - `perguntando` / `erro` / cor desconhecida: não sabemos. Oferecer uma escrita
 *    paga sobre um estado que não chegou é o oposto de consentimento informado.
 *  - `escrevendo`: já está acontecendo. */
/* O PREÇO DA OFERTA, E QUAL DOS DOIS MODOS ELE ESTÁ COTANDO.
 *
 * O DEFEITO QUE ESTA FUNÇÃO EXISTE PARA IMPEDIR: a oferta é a linha que promete
 * "conserta só o que envelheceu", e ela mostrava o preço da REESCRITA INTEIRA —
 * US$4,14 medidos no Iago contra uma parcial de dois ou três parágrafos. Cotar um
 * gasto e fazer outro é o gasto invisível do §2.3.1 com a agravante de estar escrito
 * na tela como se fosse informação. QUANTO MENOR é o parcial ninguém mediu — zero
 * escritas incrementais existem —, e é justamente por isso que ele não pode ser
 * cotado pela régua do outro modo.
 *
 * A DECISÃO NÃO É DAQUI: `d.incremental.admitido` é FATO do servidor, e ele sai da
 * mesma `planoIncremental` que a escrita vai reconsultar. Esta função só escolhe a
 * frase — se ela tivesse a própria régua de "dá para herdar?", a tela e a escrita
 * discordariam no primeiro conserto feito de um lado só.
 *
 * TRÊS ESTADOS, e o ausente NÃO cai no ramo negativo. `d.incremental` ausente é o
 * cockpit que está respondendo ter subido antes desta versão do `server.js` — Node
 * não recarrega o arquivo, e este repositório já pagou essa lição contando
 * `docAgentes` como arquivo inexistente, `ingredientes.credenciais` como "você não
 * tem credencial", o cinza do dossiê que não pode ler como vermelho e o `resolucao`
 * ausente que não pode ler como "está tudo no fluxo aberto". Aqui errar significaria
 * a tela AFIRMAR que só os parágrafos velhos vão ser refeitos por causa de um campo
 * que nunca chegou — e o clique reescreveria tudo, pago, calado.
 *
 * QUANDO A PARCIAL É RECUSADA A FRASE COTA O INTEIRO, porque é o que vai acontecer
 * de fato, e NOMEIA o motivo que veio do servidor. Isso importa hoje mais que em
 * qualquer cenário futuro: os dois `.md` que existem em disco foram escritos antes
 * do selo `gateV` do portão de vazamento, então NENHUM dos dois pode ser herdado —
 * consequência intencional do selo, que sem esta frase lê como defeito da tela. Ela
 * também diz a saída: é a reescrita inteira que grava o selo, e é a partir dela que
 * o conserto parcial passa a valer.
 *
 * E O PREÇO DA PARCIAL É `null` HOJE, com zero escritas incrementais medidas nesta
 * máquina. Isso sai como "não sei" e NUNCA como zero nem como o número do inteiro —
 * mesma disciplina do ETA da correção devolvendo `samples: 0` em vez de um palpite. */
/* QUAL DOS DOIS MODOS O CLIQUE VAI USAR, DECIDIDO EM UM LUGAR SÓ. O botão, o
   diálogo de confirmação e a frase do preço têm de concordar: três leituras do mesmo
   fato divergem no primeiro ajuste feito num lado só, e a que divergisse cotaria um
   gasto e faria outro.
   VERDE VAI DE INTEIRO mesmo com a parcial admitida, e isto foi visto no estado real
   antes de ser escrito: um dossiê em dia tem `regenerar` 0, então a escrita parcial
   reescreveria só o mapa e herdaria toda a prosa — e o botão dizia "só o que
   envelheceu" sobre um dossiê onde nada envelheceu. Quem clica em atualizar um dossiê
   em dia está pedindo exatamente a prosa RE-DERIVADA, que é a única coisa que a
   herança não faz. (Cinza não precisa de ramo: `admitirIncremental` já recusa a
   ausência, porque não há de onde herdar.) */
function modoDoClique(d) {
  if (!d || !d.incremental || !d.incremental.admitido) return "inteiro";
  if (d.cor === "verde") return "inteiro";
  return "incremental";
}

function fraseDoPreco(d) {
  const pi = d.preco && d.preco.usd
    ? "Reescrever o dossiê inteiro deve custar cerca de " + usdTxt(d.preco.usd)
      + ", pela mediana das " + d.preco.amostras + " escritas inteiras já medidas."
    : "Ainda não sei o preço de reescrever o dossiê inteiro — as duas primeiras escritas medidas é que criam a régua.";
  const inc = d.incremental;

  if (!inc) {
    return "<strong>Não sei se dá para consertar só os parágrafos velhos</strong>: o cockpit que está "
      + "respondendo subiu antes desta versão do servidor, então ele não manda esse estado. " + pi;
  }

  if (!inc.admitido) {
    return "<strong>Não dá para consertar só os parágrafos velhos</strong> deste dossiê"
      + (inc.porque ? " (" + esc(inc.porque) + ")" : "")
      + ", então o clique reescreve o dossiê inteiro. " + pi
      + " É essa reescrita que deixa o conserto parcial disponível da próxima vez.";
  }

  /* `regenerar` pode ser 0 com a parcial admitida, e é escrita legítima: a
     `visão geral` é o mapa do fluxo e vai SEMPRE. Dizer "0 parágrafos" leria como
     "nada a fazer" ao lado de um botão que gasta uma sessão. */
  const oque = inc.regenerar
    ? "<strong>" + inc.regenerar + " parágrafo(s)</strong> mais a <strong>visão geral</strong>"
    : "só a <strong>visão geral</strong>";
  const herda = inc.herdar ? " Os outros " + inc.herdar + " são herdados como estão." : "";
  if (inc.preco && inc.preco.usd) {
    return "Consertar só o que envelheceu reescreve " + oque + " e deve custar cerca de "
      + usdTxt(inc.preco.usd) + ", pela mediana das " + inc.preco.amostras
      + " escritas parciais já medidas." + herda;
  }
  return "Consertar só o que envelheceu reescreve " + oque + ", e <strong>ainda não sei quanto isso "
    + "custa</strong> — nenhuma escrita parcial foi medida nesta máquina, e é a primeira delas que cria "
    + "a régua." + herda + " Para comparação: " + pi;
}

/* ═══════ O QUE A ATUALIZAÇÃO AUTOMÁTICA FEZ — E O QUE ELA NÃO CONSEGUE ═════
 *
 * DECISÃO EXPLÍCITA DO KAUAN: desde que ele pediu, aplicar um patch dispara a
 * atualização do dossiê sozinho (§2.8 do PLAN-UPGRADE flexibilizada; o desenho que
 * impede o gasto surpresa mora no `decidirAuto` do `dossie.js`). O que esta função
 * existe para impedir é o OUTRO risco, que é maior: um final silencioso.
 *
 * O DEFEITO QUE ELA NOMEIA: um dossiê que ele ACREDITA fresco e está velho é pior
 * que um que ele sabe velho. A conversa seguinte remenda a partir de descrição
 * errada com o semáforo dizendo verde. Automático sem frase produz exatamente essa
 * crença — ele clicou aplicar, leu que o dossiê se atualiza sozinho, e nunca soube
 * que aquela vez não rodou.
 *
 * TRÊS ESTADOS, e o ausente NÃO cai no ramo negativo. SÉTIMA vez que este arquivo
 * escreve isso, e aqui o negativo perigoso é "o automático não rodou":
 *   · `d.auto` AUSENTE   — o cockpit que está respondendo subiu antes desta versão
 *                          do servidor (Node não recarrega `server.js`). Isso não é
 *                          "não rodou": é "não sei".
 *   · `ultimo` NULO      — o processo conhece o campo e não tem tentativa
 *                          registrada para este fluxo.
 *   · `ultimo` PRESENTE  — os quatro desfechos abaixo.
 *
 * A FRASE NÃO SUBSTITUI O SEMÁFORO, ela se soma a ele. A cor continua vindo do
 * `estado()` medindo a divergência real: se o automático falhou, a faixa segue
 * vermelha e a conversa segue travada. É por isso que o desfecho `pulado` num dossiê
 * VERMELHO ganha uma frase que LIGA as duas coisas numa só — é o caso em que ele
 * mais vai querer entender o que aconteceu, e duas frases soltas em lugares
 * diferentes o deixariam ligar sozinho, ou concluir que são dois problemas. */
const AUTO_MODO_FRASE = {
  off: "desligada",
  incremental: "ligada, só na forma parcial",
  sempre: "ligada, e reescreve o dossiê inteiro quando a parcial não vale"
};

function autoDossie(d) {
  if (!d) return null;
  const a = d.auto;
  if (!a || a.suportado !== true) {
    return { razao: "semcampo", cls: "cold",
      frase: "<strong>Não sei se o dossiê foi atualizado sozinho</strong>: o cockpit que está "
        + "respondendo subiu antes desta versão do servidor, e ele não manda esse estado." };
  }
  /* O valor da chave que ninguém reconhece é dito em voz alta. Cair no padrão em
     silêncio faria a configuração dele não existir — e o padrão é o barato, então o
     silêncio esconderia justamente a diferença que custa dinheiro. */
  const cfg = a.reconhecido === false
    ? " (o valor <code>" + esc(String(a.bruto)) + "</code> de <code>COCKPIT_DOSSIE_AUTO</code> não é "
      + "reconhecido, então vale o padrão)"
    : "";
  const u = a.ultimo;

  if (!u) {
    if (a.modo === "off") {
      return { razao: "desligado", cls: "cold",
        frase: "A atualização automática do dossiê está <strong>desligada</strong> "
          + "(<code>COCKPIT_DOSSIE_AUTO=off</code>), então ele só muda quando você clicar." + cfg };
    }
    return { razao: "semtentativa", cls: "cold",
      frase: "Nenhuma atualização automática foi registrada para este fluxo. Ela está "
        + esc(AUTO_MODO_FRASE[a.modo] || String(a.modo)) + "." + cfg };
  }

  if (u.estado === "correndo") {
    return { razao: "correndo", cls: "cold",
      frase: "O dossiê <strong>está sendo atualizado sozinho</strong> agora"
        + (u.incremental ? " (só os parágrafos que envelheceram)" : " (reescrita inteira)") + "." + cfg };
  }

  if (u.estado === "escreveu") {
    /* `usdDesconhecido` é a lição do `usd: 0` da rodada morta: uma rodada que morreu
       antes do relatório de custo não foi de graça. "Não medido" é o que se diz. */
    const custo = u.usdDesconhecido
      ? " O custo dessa escrita <strong>não foi medido</strong>."
      : (typeof u.usd === "number" ? " Custou " + usdTxt(u.usd) + "." : "");
    const quanto = u.incremental
      ? "<strong>" + Number(u.regenerados || 0) + " parágrafo(s)</strong> refeito(s) e "
        + Number(u.herdados || 0) + " herdado(s) como estavam"
      : "<strong>o dossiê inteiro</strong> reescrito";
    return { razao: "escreveu", cls: "ok",
      frase: "O dossiê <strong>foi atualizado sozinho</strong> depois deste patch: " + quanto
        + "." + custo + cfg };
  }

  if (u.estado === "pulado") {
    /* A FRASE QUE LIGA AS DUAS COISAS. Vermelho significa que o dossiê não vai para
       a sessão, e é isso que trava a conversa (`podeConversar`). Quando o automático
       foi pulado JUSTAMENTE por a mudança ser grande, os dois fatos têm a mesma
       causa — e dizer só um deles manda ele procurar dois problemas onde existe um. */
    const trava = d.cor === "vermelho"
      ? " E é a MESMA mudança que deixou <strong>a conversa sobre este fluxo travada</strong>: "
        + "desatualizado não é entregue à sessão, então ela não abre até o dossiê ser atualizado — "
        + "e o botão aqui do lado é esse caminho."
      : "";
    return { razao: "pulado", cls: d.cor === "vermelho" ? "risk" : "warn",
      frase: "<strong>O dossiê NÃO foi atualizado sozinho</strong>: " + esc(String(u.porque || ""))
        + ". Ele segue exatamente como estava." + trava + cfg };
  }

  /* `falhou`: a tentativa aconteceu e custou. O dossiê ANTIGO permanece, e isso é
     propriedade do `publicar()` — o `.md` é escrito num `.tmp` e renomeado, então não
     existe estado meio-escrito no lugar dele. */
  return { razao: "falhou", cls: "risk",
    frase: "<strong>A atualização automática do dossiê tentou e não conseguiu</strong>: "
      + esc(String(u.porque || "")) + ". O dossiê anterior <strong>continua no lugar</strong> — nada "
      + "meio-escrito substituiu ele — e o semáforo segue medindo a divergência de verdade." + cfg };
}

function ofertaDossie(d) {
  if (d === undefined || d === null) {
    return { razao: "perguntando", cls: "cold", botao: false,
      frase: "Conferindo o dossiê deste fluxo…" };
  }
  if (d.job && d.job.escrevendo) {
    /* QUEM MANDOU IMPORTA AQUI. "Já está sendo escrito" ao lado de um recibo de
       apply, sem dizer que a escrita começou SOZINHA, deixa a pessoa procurando o
       clique que ela não deu — e com a §2.8 flexibilizada esse clique não existe. */
    const quem = d.job.automatico ? " — ela começou <strong>sozinha</strong>, por causa deste patch" : "";
    return { razao: "escrevendo", cls: "cold", botao: false,
      frase: "O dossiê deste fluxo <strong>já está sendo escrito</strong> agora"
        + (d.job.atividade ? " (" + esc(d.job.atividade) + ")" : "") + quem + "." };
  }
  if (d.erro || !DOSSIE_CLS[d.cor]) {
    return { razao: "erro", cls: "cold", botao: false,
      frase: "<strong>Não deu para conferir o dossiê deste fluxo</strong>, então não sei quantos "
        + "parágrafos este patch envelheceu — e não ofereço uma escrita paga sobre um estado que "
        + "não conheço." };
  }
  if (d.cor === "verde") {
    return { razao: "verde", cls: "ok", botao: false,
      frase: "O dossiê deste fluxo <strong>continua em dia</strong> — nenhum parágrafo envelheceu com "
        + "este patch." };
  }
  if (d.cor === "cinza") {
    return { razao: "cinza", cls: "cold", botao: false,
      frase: "Este fluxo <strong>não tem dossiê</strong>, então nada envelheceu aqui — e a conversa "
        + "sobre ele já estava travada antes deste patch. Escrever um é uma decisão de outro tamanho, "
        + "e ela fica na faixa do dossiê, na tela do fluxo." };
  }
  const n = Number(d.quantosMudados || 0);
  const preco = fraseDoPreco(d);
  if (d.cor === "laranja") {
    return { razao: "laranja", cls: "warn", botao: true,
      frase: "<strong>" + n + " parágrafo(s) do dossiê ficaram velhos</strong> com este patch. Ele ainda "
        + "vai para a próxima conversa, com esses parágrafos marcados. " + preco };
  }
  return { razao: "vermelho", cls: "risk", botao: true,
    frase: "<strong>O dossiê deste fluxo ficou desatualizado</strong> com este patch"
      + (d.motivo ? " (" + esc(d.motivo) + ")" : "")
      + " — desatualizado não é entregue à sessão, então <strong>a conversa sobre este fluxo está "
      + "travada</strong> até ele ser atualizado. " + preco };
}

/* A FRASE DA VITRINE SOBRE OS DOSSIÊS. Ela existe por causa de `falhas`: com
   leitura incompleta, "nenhum dossiê apodreceu" deixa de ser uma afirmação que
   esta tela pode fazer — a mesma razão pela qual o call graph reporta `falhas` e
   pela qual a varredura de disco diz que o número é piso e não total.
   Enquanto a varredura não respondeu ela diz isso, e NÃO um número que seria zero
   por ausência de resposta. */
function resumoDossieVitrine(vivos) {
  if (!S.dossieVitMeta) return "Conferindo o estado dos dossiês…";
  const selos = vivos.map(f => seloDossie(S.dossieVit.get(String(f.id))));
  const podres = selos.filter(s => s.cls === "risk" || s.cls === "warn").length;
  const travados = selos.filter(s => s.travado).length;
  const f = Number(S.dossieVitMeta.falhas || 0);
  const partes = [
    podres ? "<b>" + podres + " dossiê(s) apodreceram</b> (o fluxo mudou depois deles)"
           : "nenhum dossiê apodreceu",
    travados + " de " + vivos.length + " estão com a conversa travada por falta de dossiê em dia"
  ];
  /* A falha vem por último e em `--risk`, porque ela qualifica os dois números
     acima: os dois foram contados sobre uma leitura incompleta. */
  if (f) partes.push('<span style="color:var(--risk-txt)">' + f + " fluxo(s) não deu para conferir, "
    + "então os números acima são piso, não total</span>");
  /* A HORA DA LEITURA, e ela vem do payload — nunca de `new Date()`. Estes números
     são de uma varredura que pode ter sido feita há meia hora; relógio vivo sobre
     dado velho prova que a página está de pé, nunca que o dado está. */
  /* Data ilegível é ausência de data, e ausência de data se cala em vez de escrever
     `Invalid Date` — que é a tela dizendo que quebrou por causa de um campo. */
  const em = new Date(S.dossieVitMeta.geradoEm || 0);
  const quando = isFinite(em.getTime()) && em.getTime() > 0
    ? " Conferido às " + em.toLocaleTimeString("pt-BR") + "." : "";
  return partes.join(" · ") + "." + quando;
}

/* O texto do botão diz o que vai acontecer, e o preço quando existe. Sem
   histórico ele não inventa número — mesma disciplina do ETA da correção, que
   devolve `samples: 0` em vez de um palpite na primeira execução.

   ELE APARECE EM DOIS LUGARES desde que a trava entrou: na faixa e dentro do
   bloco que substitui o compositor. Por isso ele é marcado por `data-dossie`, e
   NÃO mais por `id="dos-btn"` — dois nós com o mesmo id são HTML inválido, e o
   sintoma seria o pior possível: `getElementById` acha o primeiro, o segundo pinta
   igual e o clique não faz nada, sem erro no console. O handler é um só, delegado
   no `document` (ver `ligarDelegacao`), pelo mesmo motivo que os quatro cliques do
   §4/§6 são: numa tela que repinta várias vezes por segundo, registrar por nó a
   cada `render()` é uma classe de defeito inteira que a delegação apaga.

   Preço duplicado nos dois lugares é DE PROPÓSITO: o botão é o mesmo botão, e um
   deles sem o número faria parecer que são duas ações diferentes.

   E DESDE O RECIBO ELE APARECE EM TRÊS. O terceiro é o único que pode ser de OUTRO
   fluxo: por causa do §4.5, o patch aplicado pode ter sido escrito num sub-fluxo, e
   o dossiê que envelheceu é o daquele fluxo, não o do que está aberto. A delegação
   lia o fluxo de `S.sel` — o aberto —, então um botão desses escreveria o dossiê do
   fluxo ERRADO, gastando minutos e cota, em silêncio. `data-wf` é o alvo explícito;
   ausente, cai em `S.sel`, que é o que os dois primeiros sempre quiseram. */
function botaoDossie(d, wfId) {
  if (!d) return "";
  if (d.job && d.job.escrevendo) {
    /* ESTE BOTÃO DEIXOU DE SER MORTO, e a mudança é o motivo de a telinha existir.
       Ele era `disabled` porque não havia nada a fazer além de esperar — mas havia:
       VER. Uma escrita de minutos com a tela mostrando só a última linha de
       atividade não diz em que etapa está, em que rodada, nem quanto falta, e é
       justamente essa a pergunta de quem espera. Agora ele é a porta de volta para o
       progresso, inclusive depois de sair da tela e voltar: a escrita roda no
       processo do cockpit e sobrevive à navegação, então o caminho de volta tem de
       existir em algum lugar visível.
       `data-prog` e não `id`: ele aparece em mais de um lugar (a faixa, e a tira do
       topo da vitrine), e dois nós com o mesmo `id` fazem o segundo pintar sem fazer
       nada, em silêncio — defeito que o botão do dossiê já pagou nesta página. */
    const p = progressoDossie(d.job);
    const onde = !p ? "ver progresso"
      : !p.indeterminado ? Math.round(p.pct * 100) + "% · ver progresso"
      : p.rodadaTxt ? p.rodadaTxt + " · ver progresso"
      : "ver progresso";
    return '<button type="button" class="btn sm" data-prog="1"' + (wfId ? ' data-wf="' + esc(String(wfId)) + '"' : "")
      + ' title="' + esc(d.job.atividade || "a escrita está em curso") + '">✎ escrevendo… <span class="s">'
      + esc(onde) + "</span></button>";
  }
  if (d.ocupado) return '<button class="btn sm" disabled title="uma escrita por vez">escrevendo o de ' + esc(d.ocupado) + "…</button>";
  /* O QUE ESTÁ ESCRITO NO BOTÃO É O QUE O CLIQUE FAZ, INCLUSIVE O MODO. O rótulo
     dizia "atualizar dossiê" e o número ao lado era SEMPRE o do rewrite inteiro,
     então um clique que ia refazer três parágrafos e um que ia refazer 179 liam
     igual, pelo mesmo preço. O modo vive no `<span class="s">` e não no rótulo de
     propósito: `escrever` versus `atualizar` é a distinção entre não ter dossiê e
     ter um velho, e ela já está pinada em teste — empilhar uma terceira palavra no
     mesmo lugar apagaria a primeira.
     Ausente é INTEIRO, e não por preguiça: o processo que respondeu pode ter subido
     antes desta versão, e prometer conserto parcial por causa de um campo que não
     chegou é exatamente o erro que a frase da oferta descreve. */
  const parcial = modoDoClique(d) === "incremental";
  const pr = parcial ? d.incremental.preco : d.preco;
  const cifra = pr && pr.usd ? "~" + usdTxt(pr.usd) : "preço não medido";
  const nota = d.cor === "cinza" ? cifra
    : parcial ? "só o que envelheceu · " + cifra
    : "reescreve inteiro · " + cifra;
  const rotulo = d.cor === "cinza" ? "✎ escrever dossiê" : "↻ atualizar dossiê";
  const alvo = wfId ? ' data-wf="' + esc(String(wfId)) + '"' : "";
  return '<button type="button" class="btn sm pri" data-dossie="1"' + alvo + ">" + rotulo + '<span class="s">' + esc(nota) + "</span></button>";
}

function faixaDossie(f) {
  const d = S.dossie.get(String(f.id));
  if (!d) {
    return '<div class="dos cold"><span class="sdot cold"></span>'
      + '<div class="dos-tx"><b class="t">dossiê</b><span class="s">perguntando ao servidor…</span></div></div>';
  }
  if (d.erro) {
    return '<div class="dos risk"><span class="sdot risk"></span>'
      + '<div class="dos-tx"><b class="t">não sei o estado do dossiê</b><span class="s">' + esc(d.erro) + "</span></div></div>";
  }
  const cls = DOSSIE_CLS[d.cor] || "cold";
  const frase = (DOSSIE_FRASE[d.cor] || DOSSIE_FRASE.cinza)(d);
  /* As duas etiquetas obrigatórias viajam no `title`, sempre que existe dossiê:
     escrito por um modelo, e a partir de tal versão. Descrição gerada exibida
     como fato é exatamente a mentira que este projeto não conta. */
  const etiq = d.em
    ? ' title="Escrito por um modelo, não medido — a impressão digital prova que o nó não mudou, nunca que a descrição estava certa. Lido do n8n em ' + esc(d.em) + '."'
    : "";
  const falhou = d.job && !d.job.escrevendo && d.job.erro
    ? '<span class="s" style="color:var(--risk-txt)">última tentativa não passou: ' + esc(d.job.erro) + "</span>"
    : "";
  return '<div class="dos ' + cls + '"' + etiq + '><span class="sdot ' + cls + '"></span>'
    + '<div class="dos-tx"><b class="t">' + (d.cor === "cinza" ? "sem dossiê" : "dossiê " + d.cor) + "</b>"
    + '<span class="s">' + esc(frase) + "</span>" + falhou + "</div>"
    + botaoDossie(d) + "</div>";
}

/* SEM DOSSIÊ, NÃO SE ESCREVE. Este é o veredito, e ele é PURO de propósito —
 * mesmo motivo de `custoDaRodada()` e de `resolverAlvo`: quem decide se um clique
 * é permitido tem de ser testável sem browser e sem rede.
 *
 * O que mudou de verdade: antes, sem dossiê a conversa funcionava igual, só lendo
 * o fluxo pelo `nodes-index.md`. Nada na tela dizia que o dossiê importava — o
 * campo de texto estava lá, aberto, convidando a escrever, e a importância do
 * dossiê vivia numa nota que ninguém lê. Agora ela vive no controle: sem dossiê o
 * campo não existe.
 *
 * ONDE CADA ESTADO CAI, e por quê:
 *
 * - `!d` (a resposta do servidor não chegou) TRAVA, mas a frase é "conferindo".
 *   Ausência de resposta não é resposta negativa, e é a quinta vez que este
 *   arquivo escreve isso: `docAgentes` ausente lido como "o arquivo não existe",
 *   `ingredientes.credenciais` ausente lido como "você não tem credencial", o
 *   cinza do dossiê que nunca pode ler como vermelho, e o `resolucao` ausente que
 *   não pode ler como "está tudo no fluxo aberto". Aqui o erro seria acusar o
 *   dossiê dele de não existir por causa de um fetch de 200ms.
 *
 * - `d.erro` (não deu para LER o estado) NÃO TRAVA. Travar aqui culparia o
 *   arquivo dele por um problema do servidor — e o preço de errar para este lado é
 *   barato: a conversa roda como rodava antes desta trava existir, lendo o fluxo
 *   pelo índice. O que a tela deve é DIZER isso, e é o que o aviso faz.
 *
 * - `verde` e `laranja` LIBERAM. Laranja é entregue à sessão com os parágrafos
 *   suspeitos marcados; entregue com ressalva é entregue.
 *
 * - Cor que este bloco não conhece NÃO TRAVA, e cai no mesmo aviso do `d.erro`.
 *   Não é ausência de campo: o servidor respondeu algo que ESTA tela não sabe ler,
 *   ou seja é desencontro entre o servidor e a página — nosso problema, não o
 *   dossiê dele. Fica declarado o preço da escolha: se um dia o `dossie.js` ganhar
 *   uma quinta cor que signifique "pior que vermelho", ela vai liberar a conversa
 *   até alguém acrescentá-la aqui.
 *
 * - `escrevendo` sobre cinza/vermelho TRAVA com frase própria: não é "escreve o
 *   dossiê", é "já estou escrevendo, espera". A ordem importa — este teste vem
 *   DEPOIS de verde/laranja, porque reescrever um dossiê verde não pode travar a
 *   conversa: o dossiê antigo existe e é o que vai para a sessão.
 *
 * - `cinza` e `vermelho` TRAVAM, e o rótulo do botão continua separando os dois:
 *   escrever contra atualizar. Vermelho trava pelo mesmo motivo do cinza, e é a
 *   própria frase da faixa que já dizia: desatualizado não é entregue à sessão,
 *   então é o mesmo que não ter.
 *
 * A trava vale INCLUSIVE com conversa já aberta. Uma conversa antiga num fluxo sem
 * dossiê continua legível — o histórico pinta —, ela só não aceita mensagem nova.
 * É exatamente o caso que este pedido existe para impedir: continuar conversando
 * sobre um fluxo de 179 nós que a sessão não conhece. */
function podeConversar(d) {
  if (!d) return { pode: false, razao: "perguntando" };
  if (d.erro) return { pode: true, razao: "erro", aviso: "não sei o estado do dossiê deste fluxo, então não sei se a sessão vai recebê-lo. Se não receber, ela lê o fluxo pelo índice de nós — que é como esta aba funcionava antes." };
  if (d.cor === "verde" || d.cor === "laranja") return { pode: true, razao: d.cor };
  if (d.cor !== "cinza" && d.cor !== "vermelho") {
    return { pode: true, razao: "desconhecido", aviso: "o servidor respondeu um estado de dossiê que esta tela não conhece («" + String(d.cor) + "»), então não sei se a sessão vai recebê-lo. Se não receber, ela lê o fluxo pelo índice de nós." };
  }
  if (d.job && d.job.escrevendo) return { pode: false, razao: "escrevendo" };
  return { pode: false, razao: d.cor };
}

/* As frases do bloqueio. Título curto (o que está acontecendo) e corpo (por que
   isso importa e o que fazer). Cinza e vermelho dizem coisas DIFERENTES pelo mesmo
   motivo que as frases da faixa: um é "nunca existiu", o outro é "existe e mente".
   `escrevendo` é o único que não pede nada de ninguém. */
const TRAVA_FRASE = {
  perguntando: () => ["conferindo o dossiê…", ""],
  escrevendo: d => ["escrevendo o dossiê agora",
    "quando terminar, a conversa desbloqueia sozinha — a tela pergunta de novo a cada 5s."
    + ((d && d.job && d.job.atividade) ? " Agora: " + d.job.atividade + "." : "")],
  cinza: d => ["escreve o dossiê para desbloquear a conversa",
    "sem ele eu não conheço este fluxo: a sessão ia ler o índice de nós"
    + (d && d.nos ? " dos " + d.nos + " nós" : "") + " e adivinhar o resto."],
  vermelho: d => ["atualiza o dossiê para desbloquear a conversa",
    "ele está desatualizado" + (d && d.motivo ? " (" + d.motivo + ")" : "")
    + " e por isso não é entregue à sessão — o que é o mesmo que não ter."]
};

/* O COMPOSITOR, nos seus três desenhos. Fica aqui, junto do veredito, e não no
   meio do `telaFluxo`: é o julgamento que decide qual dos três aparece, e espalhar
   isso pelas funções de render é o que este projeto não faz. */
function compositorHtml(f) {
  const d = S.dossie.get(String(f.id));
  const v = podeConversar(d);
  /* A frase do "conferindo" sai de `TRAVA_FRASE`, não escrita à mão aqui: ela
     aparece no `placeholder` E na nota, e uma terceira cópia solta seria a que um
     dia diverge das outras duas. */
  const esperando = TRAVA_FRASE.perguntando()[0];
  /* A FILEIRA DE ENTRADAS FICA DENTRO DO COMPOSITOR, e isso resolve a trava sem
     regra nova: sem dossiê o compositor não existe, então os botões de anexar vão
     com ele — não sobra botão órfão convidando a anexar numa conversa que não
     aceita mensagem.
     No estado "conferindo" ela aparece DESABILITADA em vez de ausente, pelo mesmo
     motivo que o campo continua no lugar ali: sumir e voltar em meio segundo é a
     tela saltando duas vezes por uma resposta que quase sempre chega, e o segundo
     salto é o que lê como "algo deu errado". */
  const anx = anexosAgora();
  /* Tirar um chip é bloqueado enquanto uma rodada corre — o arquivo já está no
     prompt que está sendo respondido, e removê-lo no meio faria a resposta citar
     algo que não está mais lá. Um cálculo só, lido pela tira E pelos chips da
     bandeja: duas cópias desta condição divergiriam no primeiro ajuste. */
  const podeTirar = !(S.conv && S.conv.status === "correndo");
  /* ══════════ A TIRA: O CHIP SAI DE CIMA DO COMPOSITOR ══════════
   *
   * O DEFEITO, relatado com um print: ele anexou uma imagem, mandou a mensagem, e
   * o chip continuou colado embaixo do campo. Lido junto com o campo já vazio,
   * isso diz "ainda não mandei" — e o arquivo tinha ido, tinha sido aberto pela
   * sessão, e a tela não dizia.
   *
   * SUMIR SERIA MENTIR NA DIREÇÃO OPOSTA. O anexo é da CONVERSA e não da mensagem:
   * ele fica no diretório da sessão e volta no prompt de TODA rodada seguinte, que
   * é o que faz o print continuar valendo quando ele escreve a segunda frase.
   * Então ele SAI DO COMPOSITOR e vira a tira recolhida acima dele — o campo fica
   * limpo, o fato continua na tela a um clique.
   *
   * SÓ COM CONVERSA EXISTINDO. Antes dela o arquivo está na BANDEJA e ainda VAI:
   * ali o chip embaixo do campo é a leitura certa, e a frase de lá diz "vai com a
   * próxima mensagem". Dois estados, duas leituras — uma tira para os dois
   * ensinaria a não acreditar nela.
   *
   * O DESENHO É DO `entradas.js` (`gavetaAnexos`), inteiro, com o CSS dele: uma
   * segunda redação da tira aqui seria a quinta cópia à mão desta base, e a cópia
   * é invisível até divergir.
   *
   * ELA É IRMÃ DO COMPOSITOR, NÃO FILHA — e é isso que a mantém quando a trava do
   * dossiê derruba o campo (ver o fim desta função). */
  const naConversa = !!S.convId;
  const tira = naConversa
    ? IO().gavetaAnexos(anx, lidosAgora(), podeTirar, {
        aberta: !!S.gavetaAnexos,
        /* O 4º argumento, e NÃO um ouvinte `data-anxgaveta` nosso: os dois juntos
           alternariam a tira duas vezes por clique. `ligarGaveta` registra um
           ouvinte por documento e guarda só o último callback, então chamar isto a
           cada repintura não empilha nada. O valor que chega é o estado NOVO. */
        aoAlternar: nova => { S.gavetaAnexos = nova; render(); }
      })
    : "";
  const campo = travado => '<div class="compositor' + (travado ? " esperando" : "") + '">'
    /* NOME ACESSÍVEL FIXO, e ele não pode ser o `placeholder`: placeholder DESAPARECE
       no primeiro caractere digitado, então num leitor de tela o campo mais
       importante desta aba era "caixa de texto, em branco" a partir da primeira
       letra. Medido num navegador de verdade. Ele também não varia com o estado:
       trocar o nome do campo entre "conferindo" e "liberado" faria o leitor anunciar
       um campo diferente a cada repintura, e esta tela repinta várias vezes por
       segundo. Os dois campos do Tester já tinham o seu — este era a metade barata
       de esquecer. */
    + '<textarea class="cp-in" id="cp" rows="3"' + (travado ? " disabled" : "")
    + ' aria-label="o que você quer no fluxo — Enter envia, Shift+Enter quebra linha"'
    + ' placeholder="' + esc(travado ? esperando : "descreve o upgrade que você quer, ou pergunta sobre um nó…") + '"></textarea>'
    + '<div class="cp-bt">' + IO().barraIO("up", travado) + '<span class="nota">'
    + esc(travado ? esperando : "Enter envia · Shift+Enter quebra linha") + "</span>"
    + '<button type="button" class="btn pri sm" id="enviar"' + (travado ? " disabled" : "") + ">enviar</button></div>"
    /* Os chips da BANDEJA ficam DENTRO da caixa, embaixo dos botões: ali o anexo
       ainda é parte do pedido que está sendo escrito, e não uma coisa ao lado dele.
       COM CONVERSA ABERTA ELES SAEM DAQUI e vão para a tira (ver o comentário longo
       lá em cima) — o que resta neste bloco é o que pertence ao MOMENTO e não à
       conversa: o upload em curso e a recusa do arquivo que não entrou. */
    + ((anx.length && !naConversa) || S.subindo || S.anexoErro
      ? '<div class="cp-anx">'
        + (naConversa ? ""
          : IO().chipsAnexos(anx, lidosAgora(), podeTirar)
            + IO().notaAnexos(anx))
        /* A FRASE DE DEPOIS DO ENVIO SAIU DAQUI, e não foi apagada: ela mora agora
           no corpo aberto da tira (`GAV_PORQUE`, em `entradas.js`), que é onde o
           chip passou a viver. Mantê-la aqui seria uma segunda redação do mesmo
           fato a dois centímetros da primeira, e a que divergisse seria a que
           ninguém releu. O defeito que ela fechou continua fechado — e por um
           desenho mais forte que uma frase: MOSTRAR onde o arquivo está bate
           AFIRMAR que ele foi. A mensagem que levou cada arquivo continua mostrando
           o print dentro dela — ver `anexosDaBolha`.
           O QUE FICA É A FRASE DA BANDEJA, e ela ficou porque o estado dela ficou:
           ele perguntou "é para aparecer dessa forma?" olhando exatamente esta tela
           — chip na bandeja, campo vazio, nada enviado. O MOMENTO DA DÚVIDA É ANTES
           DE ENVIAR, e era ali que a tela não dizia nada. Agora ela diz também para
           onde o chip vai depois, senão o chip mudar de lugar no primeiro envio é
           mais uma coisa acontecendo sem aviso. */
        + (anx.length && !S.convId
          ? '<div class="anxnota">'
            + "Vai com a próxima mensagem que você mandar — o print aparece dentro da mensagem "
            + "que o levou. Depois estes arquivos ficam com a conversa, voltam no prompt de "
            + "toda rodada, e os chips passam para a tira acima do campo."
            + "</div>"
          : "")
        + (S.subindo ? '<div class="anxnota">subindo ' + S.subindo + " arquivo(s)…</div>" : "")
        // Ancorado, e no vocabulário único: a recusa pertence à caixa onde o
        // arquivo foi soltado, não à pilha do canto.
        + (S.anexoErro ? avisoHtml(S.anexoErro, "alerta") : "")
        + "</div>"
      : "")
    + "</div>";

  /* Liberado com ressalva: o campo é o mesmo campo, com uma frase ancorada acima
     dele. O aviso fica ANCORADO e não na pilha flutuante porque ele qualifica ESTE
     controle — sair sozinho em 6s deixaria o campo sem a ressalva que o explica. */
  if (v.pode) {
    return v.aviso
      ? tira + '<div class="trava">' + avisoHtml(v.aviso, "alerta", "estado do dossiê desconhecido") + campo(false) + "</div>"
      : tira + campo(false);
  }
  /* Ainda perguntando: o campo continua no lugar, surdo. Trocar a caixa de texto
     por um bloco e depois de volta, em meio segundo, é a tela saltando duas vezes
     por uma resposta que quase sempre chega — e o segundo salto é o que faz parecer
     que algo deu errado. Nada aqui é recusa: não sabemos ainda. */
  if (v.razao === "perguntando") return tira + campo(true);

  const [titulo, corpo] = (TRAVA_FRASE[v.razao] || TRAVA_FRASE.cinza)(d);
  /* `escrevendo` não repete o botão: o da faixa, dois centímetros acima, já está
     desabilitado dizendo a mesma coisa. Um segundo botão morto no lugar onde se
     escreve seria só mais uma coisa que não faz nada. */
  const acao = v.razao === "escrevendo" ? ""
    : '<div class="trava-bt">' + botaoDossie(d)
      + '<span class="nota">leva minutos e sai da mesma cota de plano de uma conversa sua.<br>'
      + "Nada é escrito no n8n: o dossiê é um arquivo local.</span></div>";
  /* O RASCUNHO GUARDADO, DITO. A trava pode subir no meio de uma frase — o fluxo
     é editado no n8n e o refetch pega a divergência —, e aí o campo sai do DOM
     levando o texto com ele; `S.rascunho` é onde ele fica (ver `capturarInputs`).
     Dos três desfechos possíveis, o pior não é perder: é guardar e não contar.
     Perder ele descobre na hora e reescreve; guardado em silêncio, ele reescreve
     a frase em outro lugar e depois ela reaparece — duas versões da mesma ideia,
     e nenhum jeito de saber qual é a nova. Então a frase existe, e ela promete
     exatamente o que o código faz: volta para o campo quando o campo voltar.
     O texto em si NÃO é repetido aqui: ele pode ser longo, e o bloco de trava é
     sobre o dossiê. O que se conta é que ele existe e quanto dele existe. */
  const rasc = String(S.rascunho || "").trim();
  const guardado = rasc
    ? '<div class="nota">Guardei o que você estava escrevendo (' + rasc.length
      + " caracteres) — volta para o campo quando ele voltar.</div>"
    : "";
  /* E O ANEXO TAMBÉM É DITO, pelo mesmo raciocínio do rascunho. Os arquivos já
     estão no servidor (na bandeja, ou no diretório da conversa) e sobrevivem à
     trava. Guardar em silêncio é o pior dos três desfechos: ele arrasta o print de
     novo, e aí há duas cópias do mesmo arquivo e nenhum jeito de saber qual entrou.
     Aqui vai só a CONTAGEM: o nome é `sens` (identifica cliente) e este bloco é
     sobre o dossiê, não sobre o material.
     A TIRA FICA QUANDO A TRAVA SOBE — ela é irmã do compositor, não filha —, e é
     por isso que a frase tem DUAS redações em vez de uma ou nenhuma. Com a tira na
     tela, a antiga ("os chips voltam junto com o campo") passa a ser falsa duas
     vezes: os chips não saíram, e não é o campo que os traz de volta. ESCOLHI
     REESCREVER E NÃO REMOVER porque sobra um fato que a tira não diz — que os
     arquivos sobrevivem à trava e continuam valendo quando o campo voltar; a tira
     mostra QUAIS são, nunca que eles atravessam este bloqueio. Sem conversa não há
     tira, e aí a frase antiga continua sendo a verdadeira, palavra por palavra. */
  const nAnx = anexosAgora().length;
  const anxGuardado = !nAnx ? ""
    : naConversa
      ? '<div class="nota">Os ' + nAnx + " anexo(s) continuam guardados com a conversa — "
        + "a tira acima segue mostrando quais são, e eles voltam no prompt assim que o campo voltar.</div>"
      : '<div class="nota">Os ' + nAnx + " anexo(s) que você mandou continuam guardados — "
        + "os chips voltam junto com o campo.</div>";
  return tira + '<div class="trava">'
    + avisoHtml(corpo, v.razao === "escrevendo" ? "info" : "alerta", titulo)
    + acao + guardado + anxGuardado + "</div>";
}

/* ---------------------------------------------------------------- conversa -- */

/* Os nós que o alvo proposto toca. Vazio até existir alvo — e o aceso é
   `--accent`, nunca cor de status: nada aqui é veredito ainda. */
function nosAcesos() {
  const a = S.conv && S.conv.alvo;
  if (!a || !Array.isArray(a.nos)) return new Set();
  return new Set(a.nos.map(n => n.nome));
}

/* Nó novo NÃO é desenhado dentro do fluxo, e isso é decisão, não limitação.
   Ele não tem posição — quem decide onde ele entra é o patch, que ainda não
   rodou. Chutar um lugar faria o desenho AFIRMAR uma topologia que ninguém
   escolheu, e é o desenho que o Kauan usa para confirmar o alvo: uma seta
   inventada ali seria a mentira mais cara desta tela. Então eles aparecem numa
   tarja separada, tracejada, dizendo que entram e que a posição vem depois. */
const novosDoAlvo = () => {
  const a = S.conv && S.conv.alvo;
  return (a && Array.isArray(a.nos) ? a.nos : []).filter(n => n.novo);
};
const temNovos = () => novosDoAlvo().length > 0;

function tarjaNovos() {
  const novos = novosDoAlvo();
  if (!novos.length) return "";
  return '<div class="entram"><div class="en-hd">⊕ ' + novos.length
    + " nó(s) que entram — a posição no desenho é decidida pelo patch, não agora</div>"
    + novos.map(n => '<div class="en-no"><code>' + esc(n.nome) + "</code>"
      + (n.tipoNo ? '<span class="tag cold">' + esc(curto(n.tipoNo)) + "</span>" : "")
      + '<span class="o">' + esc(n.oque || "") + "</span></div>").join("")
    + "</div>";
}

/* O QUE FOI COM A MENSAGEM, desenhado dentro da bolha dela.
 *
 * O DEFEITO QUE ISTO FECHA foi ele quem viu: manda um print e a conversa desenha a
 * mensagem como texto puro. Medido, o arquivo chega ao disco, entra no prompt e é
 * ABERTO pela sessão — o `Read` volta com a imagem decodificada —, mas nada na tela
 * dizia isso, e o chip continuava no compositor, o que lê como *ainda não mandei*.
 * Um pipeline que funciona e uma tela que não mostra é indistinguível de um que não
 * funciona, e a segunda leitura é a que faz alguém mandar de novo.
 *
 * IMAGEM VIRA IMAGEM; o resto vira chip com o nome. A miniatura é `sens` — é dado de
 * cliente, e o modo gravação tem de borrar isto antes de qualquer coisa nesta tela.
 * Ela também é `<a>` para o próprio arquivo: ver o print em tamanho real é o que
 * decide se ele mandou o certo, e um `<img>` sozinho não amplia.
 *
 * TRÊS ESTADOS, e o terceiro é o motivo de a rota devolver 404 com corpo em JSON:
 * `.upgrade-runs/` é scratch e gitignorado, então o arquivo pode ter sido limpo
 * enquanto o histórico guardou nome, tipo e tamanho. Aí o `onerror` troca a
 * miniatura por uma frase dizendo que o arquivo não está mais aqui — nunca uma
 * imagem quebrada, que lê como defeito da tela.
 *
 * `null` e `[]` LEEM IGUAL: conversa gravada antes desta versão não tem o campo, e
 * uma mensagem sem anexo não tem o que desenhar. As duas somem sem dizer nada, que é
 * o correto — afirmar "esta mensagem não levou anexo" sobre um campo que nunca
 * existiu seria a sétima vez que este arquivo lê ausência como negativa. */
function anexosDaBolha(m) {
  const lista = Array.isArray(m && m.anexos) ? m.anexos : [];
  if (!lista.length || !S.convId) return "";
  const rota = a => "/api/upgrade/arquivo/" + encodeURIComponent(S.convId)
    + "?nome=" + encodeURIComponent(a.arquivo);
  const itens = lista.map(a => {
    const kb = (Number(a.bytes || 0) / 1024).toFixed(0) + "KB";
    if (a.tipo === "imagem") {
      /* SEM `onerror` inline. Um handler escrito dentro de uma string HTML precisa de
         três níveis de aspas e é onde um `esc()` esquecido vira execução; e seriam
         tantas definições dele quantos anexos na tela. O ramo do arquivo ausente é
         UM ouvinte em CAPTURA no documento (`ligarDelegacao`), porque o evento
         `error` de um `<img>` não borbulha. */
      /* O `href` FICA, e tirá-lo seria o conserto errado deste defeito. O clique
         esquerdo simples é interceptado em `ligarDelegacao` e abre o visor da
         própria página; ctrl+clique, o botão do meio e o "abrir em nova guia" do
         menu de contexto continuam funcionando porque continuam tendo para onde
         ir. Um `<span>` com `onclick` seria mais simples de escrever e destruiria
         três formas de abrir que já funcionam — e nenhuma delas apareceria
         quebrada: elas simplesmente deixariam de existir, em silêncio.
         `data-nome` e `data-meta` viajam prontos porque o rodapé do visor mostra
         os dois, e reconstituí-los partindo o `title` ao meio pelo `·` seria
         inventar um formato para um nome de arquivo que vem do disco. */
      return '<a class="banx-img" href="' + esc(rota(a)) + '" target="_blank" rel="noopener"'
        + ' data-nome="' + esc(a.nome) + '" data-meta="' + esc((a.tipo || "arquivo") + " · " + kb) + '"'
        + ' title="' + esc(a.nome + " · " + kb) + '">'
        + '<img class="sens" src="' + esc(rota(a)) + '" alt="' + esc(a.nome) + '" loading="lazy">'
        + "</a>";
    }
    return '<a class="banx-chip" href="' + esc(rota(a)) + '" target="_blank" rel="noopener">'
      + '<span class="sens">' + esc(a.nome) + "</span>"
      + '<span class="t">' + esc(a.tipo || "arquivo") + " · " + kb + "</span></a>";
  }).join("");
  return '<div class="banx">' + itens + "</div>";
}

function blocosConversa() {
  const c = S.conv;
  /* TRÊS AUSÊNCIAS, TRÊS FRASES, e elas não podem ler igual. "nenhuma conversa
     ainda" é convite; "essa conversa foi apagada" diz o que aconteceu com o que
     ele tinha; "não achei" diz que o endereço não vale. Deixar as duas últimas
     caírem na primeira seria mandá-lo escrever de novo o que ele já tinha. */
  if (!c && S.convApagada) {
    const a = S.convApagada;
    return '<div class="vazio"><b>Essa conversa foi apagada.</b><br>'
      + (a.apagadaEm ? "Apagada em " + esc(quandoConv(a.apagadaEm)) + ". " : "")
      + "O arquivo foi movido para a lixeira, não destruído — abre a gaveta de conversas "
      + "e ela está lá, com um botão de trazer de volta.</div>";
  }
  if (!c || !c.chat.length) {
    /* QUARTA AUSÊNCIA, e ela entrou com a trava: sem dossiê o convite virou uma
       frase falsa. "Descreve o upgrade que você quer" é o maior texto da coluna e
       manda escrever num campo que não está lá — a mesma classe de mentira que as
       frases da faixa passaram a contar quando a conversa deixou de ler o fluxo
       pelo índice. Aqui o primeiro passo é outro, e é ele que a frase nomeia.
       Só vale para a conversa VAZIA: histórico existente continua sendo
       renderizado, travado ou não. */
    const trv = S.sel ? podeConversar(S.dossie.get(String(S.sel))) : { pode: true };
    if (!trv.pode && trv.razao !== "perguntando") {
      return '<div class="vazio">O primeiro passo deste fluxo é o <b>dossiê</b>.<br>'
        + "Ele é a prosa que descreve o que cada trecho faz — é com ela que eu conheço o fluxo "
        + "sem reler o JSON inteiro. Sem isso eu ia adivinhar, e adivinhar aqui escreve em "
        + "produção.</div>";
    }
    return '<div class="vazio">Descreve o upgrade que você quer neste fluxo.<br>'
      + "Se faltar informação eu pergunto de volta em vez de adivinhar — e se o que você pediu "
      + "não resolver, eu digo.</div>";
  }
  /* Reaberta do disco: o log da rodada anterior não existe neste processo, e o
     `--resume` não é usado de propósito (um `session_id` morto mata o spawn). Dito
     em vez de deixar o painel de atividade parecer que nada aconteceu. */
  const reaberta = c.reaberta
    ? '<div class="msg ele"><div class="bub"><span class="mtag">RETOMADA</span>'
      + "Esta conversa foi reaberta do disco. As mensagens acima estão todas aqui, mas o log das "
      + "rodadas anteriores não — ele vive no processo, e o processo é outro. A próxima rodada é "
      + "uma sessão nova: o histórico vai pelo prompt.</div></div>"
    : "";
  return '<div class="chat">' + reaberta + c.chat.map(m => {
    if (m.de === "eu") {
      return '<div class="msg eu"><div class="bub">' + esc(m.texto) + anexosDaBolha(m) + "</div></div>";
    }
    const tag = m.tipo === "alvo"
      ? '<span class="mtag alvo">ALVO PROPOSTO</span>'
      : '<span class="mtag">' + (m.perguntas && m.perguntas.length ? "PERGUNTA DE VOLTA" : "RESPOSTA") + "</span>";
    const perg = (m.perguntas && m.perguntas.length)
      ? '<ul class="perg">' + m.perguntas.map(q => "<li>" + esc(q) + "</li>").join("") + "</ul>" : "";
    return '<div class="msg ele"><div class="bub">' + tag + esc(m.texto) + perg + "</div></div>";
  }).join("") + "</div>";
}

function faixaAlvo() {
  const a = S.conv && S.conv.alvo;
  if (!a) return "";
  const linhas = a.nos.map(n =>
    '<div class="alvo' + (n.novo ? " novo" : "") + '"><span class="mk">' + (n.novo ? "⊕" : "◇") + "</span>"
    + "<code>" + esc(n.nome) + "</code>"
    + '<span class="o">' + esc(n.oque || (n.novo ? "nó novo" : "muda")) + (n.novo && n.tipoNo ? " · " + esc(curto(n.tipoNo)) : "") + "</span></div>"
  ).join("");
  return '<div class="alvos">' + linhas + "</div>"
    + (a.nota ? '<div class="nota">' + esc(a.nota) + "</div>" : "")
    + blocoResolucao()
    + rodapeAlvo();
}

/* ONDE OS NÓS DO ALVO MORAM (§4.5).
 *
 * O servidor manda o FATO (`resolucao`); o juízo de como isso se lê é daqui.
 *
 * Quatro estados, e o quarto é o que esta casa já errou três vezes: campo
 * AUSENTE não é resposta negativa. Uma conversa reaberta do disco de antes desta
 * fatia não tem `resolucao`, e pintar isso como "está tudo no fluxo aberto" seria
 * afirmar uma conferência que nunca aconteceu — exatamente no lugar onde a
 * afirmação decide em qual fluxo se escreve. */
function blocoResolucao() {
  const c = S.conv || {};
  if (!("resolucao" in c) || !c.resolucao) {
    return '<div class="resol mudo"><span class="rt">SEM CONFERÊNCIA</span>'
      + "Este alvo não passou pela conferência de em qual fluxo os nós moram — ou a conversa "
      + "é anterior a ela, ou o cockpit que está rodando subiu antes desta versão. "
      + "<strong>Não é o mesmo que estar tudo no fluxo aberto.</strong> Refaça a pergunta para conferir.</div>";
  }
  const r = c.resolucao;

  if (r.estado === "trocar") return tarjaTroca(r.redirecionado || {});

  if (r.estado === "bloqueado") {
    const nos = (r.bloqueio && r.bloqueio.nos || []).filter(p => p.porque || p.candidatos);
    const lista = nos.length
      ? "<ul>" + nos.map(p => "<li><code>" + esc(p.nome) + "</code> — "
          + esc(p.porque || (p.candidatos || []).map(x => x.nome || x.id).join(", ")) + "</li>").join("") + "</ul>"
      : "";
    return '<div class="resol trava"><span class="rt">⊘ NÃO DÁ PARA SEGUIR AINDA</span>'
      + esc(r.bloqueio.frase) + lista + "</div>";
  }
  return "";
}

/* A TARJA DE TROCA DE FLUXO, uma só.
 *
 * Ela aparece em dois lugares — na resolução do alvo e na revisão do patch — e é
 * a mesma afirmação nas duas: ele abriu o fluxo X e a escrita iria para o Y.
 * Duas cópias divergiriam no primeiro ajuste feito num lado só, e o lado que
 * divergisse seria uma tarja dizendo o fluxo errado. */
function tarjaTroca(d) {
  return '<div class="resol troca"><span class="rt">◈ ISTO ESCREVERIA EM OUTRO FLUXO</span>'
    + "Os nós moram em <code>" + esc(d.paraNome || d.paraId || "?") + "</code>"
    + (d.viaNode ? ", que é chamado por <code>" + esc(d.viaNode) + "</code> aqui dentro" : "")
    + ". A escrita iria <strong>lá</strong>, não em <code>" + esc(d.deNome || d.deId || "?")
    + "</code> — que é o fluxo que você abriu.</div>";
}

/* O rodapé diz o que confirmar FAZ e o que não faz.
 *
 * A frase antiga era "O patch é a próxima etapa — e ela ainda não existe": o `ela`
 * ficava solto (etapa ou patch?) e, numa tela em português ao lado de "não existe",
 * `patch` foi lido como `path` e a mensagem virou "erro de caminho". Medido no uso.
 *
 * AGORA EXISTEM DOIS BOTÕES NESTA TELA E ELES CUSTAM COISAS DIFERENTES, e essa é a
 * distinção que a copy tem de carregar:
 *
 *   - `confirma-alvo` MONTA O PATCH. Gasta uma rodada de modelo — minutos e
 *     dinheiro — e não escreve nada no n8n.
 *   - `aplicar-remendo`, lá na banda de revisão, ESCREVE NO N8N. Não existe ainda.
 *
 * Se os dois lerem como "a próxima etapa", ninguém sabe qual clique custa o quê —
 * e o que se aprende é a clicar nos dois sem ler.
 *
 * Com o alvo bloqueado não existe botão de confirmar: não há o que confirmar, e um
 * botão desligado ao lado de uma recusa convida a insistir. */
function rodapeAlvo() {
  const c = S.conv || {};
  const r = c.resolucao;
  if (r && r.estado === "bloqueado") {
    return '<div class="confirma"><span class="cf-tx">Responda aí embaixo dizendo qual é o fluxo certo, '
      + "e eu refaço o alvo em cima dele.</span>"
      + '<button class="btn" id="corrige-alvo">descrever de novo</button></div>';
  }

  /* Com o patch já na tela, confirmar de novo NÃO é o mesmo gesto: manda montar
     outra vez, e outra rodada custa outra vez. O botão continua (refazer é
     legítimo — ele pode querer o patch de novo depois de mudar de ideia), mas
     diz que refaz em vez de fingir que o primeiro clique ainda está pendente. */
  const jaTem = ("remendo" in c) && c.remendo;
  const onde = r && r.estado === "trocar" && r.wfNomeAlvo
    ? " O patch seria montado em cima de <code>" + esc(r.wfNomeAlvo) + "</code>." : "";

  if (jaTem) {
    return '<div class="confirma"><span class="cf-tx">O patch deste alvo já está montado, logo abaixo. '
      + "Confirmar de novo <strong>gasta outra rodada</strong> e monta outro — só faz sentido se você "
      + "mudou de ideia sobre o alvo.</span>"
      + '<button class="btn" id="confirma-alvo" title="monta o patch de novo, e isso custa mais uma rodada">↺ montar de novo</button>'
      + '<button class="btn" id="corrige-alvo">não, é em outro lugar</button></div>';
  }

  return '<div class="confirma"><span class="cf-tx">Confirma o alvo? Confirmar manda ele <strong>montar o '
    + "patch</strong> e mostrar o diff aqui — custa uma rodada, e <strong>não escreve nada no n8n</strong>."
    + onde + "</span>"
    + '<button class="btn pri" id="confirma-alvo" title="monta o patch e mostra o diff — uma rodada de modelo, nenhuma escrita no n8n">✓ é isso</button>'
    + '<button class="btn" id="corrige-alvo">não, é em outro lugar</button></div>';
}

/* ══════════════════════════ [ REVISÃO ] — O PATCH (§4.1/4.2/4.4) ══════════
 *
 * O servidor manda FATO: o diff já redigido (credencial nenhuma atravessa) e o
 * veredito de cada portão. O juízo de como isso se lê é daqui.
 *
 * A banda fica FORA da contagem `[ 01 ]`/`[ 02 ]`, como `[ HANDOFF ]` em
 * `flows.html`: ela não é uma terceira seção da tela, é o que aparece quando há
 * uma proposta — e renumerar a página conforme existe ou não patch faria o índice
 * mentir metade do tempo. */
function faixaRemendo() {
  const c = S.conv || {};

  /* AUSENTE não é VAZIO. Conversa reaberta do disco de antes desta fatia não tem
     o campo, e o cockpit que está rodando pode ter subido antes dela. Nos dois
     casos a resposta certa é não desenhar nada: aqui a ausência é silêncio
     legítimo — não existe patch —, ao contrário da resolução do alvo, onde o
     silêncio seria afirmar uma conferência que não houve. */
