@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }

/* ==========================================================================
   HANDOFF — a tela do "Mandar pro Claude"
   Oito etapas, cada uma correspondendo a trabalho que acontece de verdade:
   assinatura em memória, GET do grafo, localização do nó, GET da execução,
   diagnóstico heurístico, sessão headless do Claude Code, portas de validação
   determinísticas e a revisão do diff. A tela termina num diff esperando
   aprovação, e diz em voz alta que nada foi escrito no n8n até o clique. Uma
   tela que animasse "corrigido" com o nó intacto na instância seria a mesma
   mentira do relógio vivo sobre dado velho — e essa é a linha que este painel
   não cruza.
   ========================================================================== */
.hoff-scrim {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1);
  animation: scrimin .28s ease-out both;
}
@keyframes scrimin { from { opacity: 0; } }
.hoff {
  position: relative; width: min(1080px, 100%); max-height: min(88vh, 860px);
  /* Quatro faixas: cabeçalho, corpo, briefing, rodapé. O briefing só é inserido
     no fim, mas a faixa precisa existir desde já — com três faixas ele caía numa
     linha implícita e passava por cima do terminal. */
  display: grid; grid-template-rows: auto minmax(0,1fr) auto auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow), 0 50px 110px -50px rgba(0,0,0,.85);
  overflow: hidden; transform-origin: top left;
}
.hoff-hd { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.hoff-hd .idx { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em; color: var(--brand-txt); }
.hoff-hd h2 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.hoff-hd .sig { font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hoff-hd .spacer { flex: 1; }

.hoff-body { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 0; min-height: 0; }
.hoff-steps { border-right: 1px solid var(--line-soft); padding: 16px 14px; overflow-y: auto; background: var(--surface-2); }
.hoff-step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 6px; border-radius: 8px; opacity: .38; transition: opacity .3s, background .3s; }
.hoff-step .mark {
  width: 18px; height: 18px; border-radius: 50%; margin-top: 2px;
  border: 1px solid var(--line); display: grid; place-items: center;
  font-family: var(--font-num); font-size: 9px; color: var(--txt-faint);
}
.hoff-step .nm { font-size: 12.5px; color: var(--txt-dim); line-height: 1.35; }
.hoff-step .sub { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); margin-top: 2px; }
.hoff-step.on { opacity: 1; background: var(--accent-soft); }
.hoff-step.on .mark { border-color: var(--accent); color: var(--accent-txt); animation: markspin 1s linear infinite; }
.hoff-step.on .nm { color: var(--txt); font-weight: 600; }
@keyframes markspin { to { transform: rotate(360deg); } }
.hoff-step.done { opacity: 1; }
.hoff-step.done .mark { border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: var(--ok-soft); color: var(--ok-txt); animation: none; }
.hoff-step.warnst .mark { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-soft); color: var(--warn-txt); animation: none; }

/* Três faixas fixas por posição explícita, não por ordem de inserção: a faixa
   de atividade é REMOVIDA do DOM quando a corrida acaba, e com auto-placement o
   terminal subiria para a linha `auto` e encolheria para a altura do texto. */
.hoff-main { display: grid; grid-template-rows: 244px auto minmax(0,1fr); min-height: 0; }
.hoff-mini { grid-row: 1; }
.hoff-act  { grid-row: 2; }
.hoff-term { grid-row: 3; }

/* ------------------------------------------------- ATIVIDADE (o que ele faz)
   O terminal mostra tudo, e é justamente por isso que "o que está acontecendo
   agora" se perdia nele: 40 linhas rolando enterram a única que importa. Esta
   faixa carrega um fato por vez, sobrescrito, em tamanho legível de longe —
   mais a barra, que é a resposta para "quanto falta".

   A barra mede TEMPO contra a mediana das corridas anteriores, não etapas
   concluídas: das oito etapas, sete levam milissegundos e uma leva três
   minutos, então uma barra por etapa saltaria para 60% e ficaria parada. */
.hoff-act {
  border-bottom: 1px solid var(--line-soft); background: var(--surface-2);
  padding: 11px 18px 12px; display: grid; gap: 8px;
}
.hoff-act .act-line { display: flex; align-items: center; gap: 9px; min-width: 0; }
.hoff-act .dot {
  width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
  background: var(--accent); box-shadow: 0 0 0 0 var(--accent-line);
  animation: actpulse 1.9s ease-out infinite;
}
@keyframes actpulse {
  0% { box-shadow: 0 0 0 0 var(--accent-line); }
  70%, 100% { box-shadow: 0 0 0 7px transparent; }
}
.hoff-act .act-txt {
  font-size: 13.5px; color: var(--txt); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hoff-act .act-stage { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .1em; color: var(--accent-txt); flex: 0 0 auto; }
.hoff-act .act-round {
  margin-left: auto; flex: 0 0 auto;
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
}
.pbar { height: 5px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
/* Cresce por `transform`, não por `width`: a barra atualiza a cada segundo
   durante minutos, e animar largura recalcula layout a cada quadro. */
.pfill {
  height: 100%; width: 100%; border-radius: inherit;
  transform: scaleX(0); transform-origin: left center;
  background: linear-gradient(90deg, var(--accent-line), var(--accent));
  transition: transform .9s linear;
}
/* Sem histórico não existe denominador, e uma barra parada em 30% seria uma
   afirmação falsa. A listra em movimento diz "andando, duração desconhecida" —
   que é exatamente o que se sabe. */
.pbar.unknown .pfill {
  transform: scaleX(1);
  background: repeating-linear-gradient(115deg,
    var(--accent-line) 0 10px, transparent 10px 22px);
  animation: pslide 1.1s linear infinite;
}
@keyframes pslide { to { background-position: 44px 0; } }
.pbar.over .pfill { background: linear-gradient(90deg, var(--warn), var(--warn)); }
.hoff-act .act-foot {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint);
}
.hoff-act .act-foot b { color: var(--txt-dim); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
  .hoff-act .dot { animation: none; }
  .pbar.unknown .pfill { animation: none; }
  .pfill { transition: none; }
  /* A telinha do filtro chega sem subir e sem escala; o blur fica, porque um
     desfoque parado não é movimento. Nenhuma informação mora na entrada. */
  .fmod-scrim, .fmod { animation: none; }
}
.hoff-mini {
  position: relative; border-bottom: 1px solid var(--line-soft);
  background:
    linear-gradient(var(--surface-2), var(--surface-2)),
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 24px);
  overflow: hidden;
}
.hoff-mini svg { display: block; width: 100%; height: 100%; }
/* Chip em vez de texto solto: num grafo de 188 nós o rótulo cai atrás de um nó
   e some. O fundo o mantém legível sem precisar reservar espaço no layout. */
.hoff-mini .corner {
  position: absolute; top: 8px; left: 10px; z-index: 1;
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .12em; color: var(--txt-dim);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px 7px;
}
.hoff-mini .idle { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); }

/* terminal-animation: linhas mono entrando uma a uma, com cursor de bloco. */
.hoff-term { overflow-y: auto; padding: 14px 18px 18px; font-family: var(--font-num); font-size: 11.5px; line-height: 1.72; }
.hoff-term .ln { display: flex; gap: 9px; color: var(--txt-dim); animation: lnin .3s ease-out both; }
@keyframes lnin { from { opacity: 0; transform: translateY(4px); } }
.hoff-term .ln .g { color: var(--txt-faint); flex: 0 0 auto; }
.hoff-term .ln.hd { color: var(--accent-txt); margin-top: 10px; }
.hoff-term .ln.hd:first-child { margin-top: 0; }
.hoff-term .ln.bad { color: var(--risk-txt); }
.hoff-term .ln.warn { color: var(--warn-txt); }
.hoff-term .ln.good { color: var(--ok-txt); }
.hoff-term .ln .tx { min-width: 0; word-break: break-word; }
.hoff-term .caret { display: inline-block; width: 7px; height: 13px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.hoff-ft { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.hoff-ft .truth { flex: 1; min-width: 260px; font-size: 12px; color: var(--txt-dim); line-height: 1.45; }
.hoff-ft .truth b { color: var(--txt); font-weight: 600; }
.hoff-brief {
  width: calc(100% - 36px); height: 108px; min-height: 68px; max-height: 40vh; resize: vertical;
  margin: 0 18px 12px;
  font-family: var(--font-num); font-size: 11px; line-height: 1.55;
  color: var(--txt); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
}
.hoff-brief:focus { outline: none; border-color: var(--accent); }

/* --------------------------------------------------------------------------
   REVISÃO — a tela de pull request da proposta do Claude.
   Ela ocupa a mesma faixa onde o briefing ficava, porque substitui exatamente
   aquilo: antes o cockpit entregava texto para colar, agora entrega um diff
   para aprovar. Rola sozinha e tem teto de altura — um nó de agente tem 15k
   caracteres de prompt e sem teto o rodapé com os botões sai da tela, que é
   justamente onde a decisão acontece.
   -------------------------------------------------------------------------- */
.hoff.reviewing { max-height: min(93vh, 940px); }
.hoff.reviewing .hoff-main { grid-template-rows: 132px auto minmax(0,1fr); }
.hoff-pr {
  border-top: 1px solid var(--line-soft); background: var(--surface-2);
  overflow-y: auto; max-height: 48vh; padding: 14px 18px 16px;
}
.hoff-pr .prhd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.hoff-pr .prhd .idx { font-family: var(--font-num); font-size: 10px; letter-spacing: .16em; color: var(--brand-txt); }
.hoff-pr .prhd h3 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.hoff-pr .prhd .sum { font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); }

.gates { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.gate {
  font-family: var(--font-num); font-size: 10.5px; line-height: 1.4;
  padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--txt-dim);
}
.gate.ok   { color: var(--ok-txt);   border-color: color-mix(in srgb, var(--ok) 38%, transparent);   background: var(--ok-soft); }
.gate.bad  { color: var(--risk-txt); border-color: color-mix(in srgb, var(--risk) 42%, transparent); background: var(--risk-soft); }
.gate.skip { color: var(--cold-txt); border-color: var(--line); background: var(--cold-soft); }
/* O report do Claude é longo por bom motivo, e empurra o diff para fora da
   vista logo onde a decisão acontece. O atalho custa uma linha e evita a
   rolagem às cegas. */
button.gate { font-family: var(--font-num); cursor: pointer; }
.gate.jump { color: var(--accent-txt); border-color: var(--accent-line); background: var(--accent-soft); }
.gate.jump:hover { border-color: var(--accent); }
.gate.jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.report {
  font-size: 12.5px; line-height: 1.62; color: var(--txt-dim);
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 12px;
}
.report h4 { margin: 12px 0 4px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--txt); }
.report h4:first-child { margin-top: 0; }
.report p { margin: 0 0 7px; }
.report li { margin-left: 16px; }
.report code { font-family: var(--font-num); font-size: 11.5px; background: var(--surface-2); border-radius: 4px; padding: 1px 4px; }

.dnode { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); margin-bottom: 8px; overflow: hidden; }
.dnode > summary {
  cursor: pointer; list-style: none; padding: 9px 12px;
  display: flex; gap: 9px; align-items: center; font-size: 12.5px; color: var(--txt);
}
.dnode > summary::-webkit-details-marker { display: none; }
.dnode > summary:hover { background: var(--accent-soft); }
.dnode > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dnode .tag { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; padding: 2px 6px; border-radius: 5px; flex: 0 0 auto; }
/* MESMA RECEITA DA BASE, e aqui ela pesa mais: são 9,5px, o menor texto colorido
   desta tela, e é a etiqueta que diz se um nó foi ADICIONADO, ALTERADO ou REMOVIDO na
   banda que decide um clique que escreve em produção. Medido antes: `added` 4,4665 e
   `modified` 4,4841 no claro. A borda fica com a cor cheia — ela é forma. */
.dnode .tag.added    { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt));   background: var(--ok-soft);   border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.dnode .tag.modified { color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.dnode .tag.removed  { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); background: var(--risk-soft); border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent); }
.dnode .ty { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dnode .body { border-top: 1px solid var(--line-soft); overflow-x: auto; }
.dl { display: block; white-space: pre; font-family: var(--font-num); font-size: 11px; line-height: 1.6; padding: 0 12px; color: var(--txt-dim); }
.dl.add  { background: color-mix(in srgb, var(--ok) 12%, transparent);   color: var(--ok-txt); }
.dl.del  { background: color-mix(in srgb, var(--risk) 12%, transparent); color: var(--risk-txt); }
.dl.skip { color: var(--txt-faint); font-style: italic; background: var(--surface-2); }

.edgelist { font-family: var(--font-num); font-size: 11px; line-height: 1.7; color: var(--txt-dim); margin-bottom: 10px; }
.edgelist .add { color: var(--ok-txt); }
.edgelist .del { color: var(--risk-txt); }

/* O resultado de aplicar. Fica dentro da faixa de revisão, acima do diff, para
   que a próxima coisa lida depois do clique seja o que de fato aconteceu. */
.applied {
  font-size: 12.5px; line-height: 1.55; border-radius: 10px; padding: 11px 13px; margin-bottom: 12px;
  border: 1px solid color-mix(in srgb, var(--ok) 38%, transparent); background: var(--ok-soft); color: var(--ok-txt);
}
.applied.bad { border-color: color-mix(in srgb, var(--risk) 42%, transparent); background: var(--risk-soft); color: var(--risk-txt); }
.applied.warn { border-color: color-mix(in srgb, var(--warn) 42%, transparent); background: var(--warn-soft); color: var(--warn-txt); }

/* --------------------------------------------------------------- CONCLUÍDO
   O recibo. Depois de aplicar, a faixa de revisão troca de papel: o topo passa
   a ser o que aconteceu, e o diff desce para um `details` fechado — auditoria
   continua ao alcance sem competir com a informação nova. O título sobe um
   degrau de tamanho porque é o fim de um fluxo de decisão, não mais um bloco
   entre outros; nenhuma cor nova entra, o verde é o mesmo `--ok` de sempre. */
.hoff-pr .prhd h3.done-title { font-size: 16.5px; letter-spacing: -.015em; }
.notecard {
  border: 1px solid var(--accent-line); border-radius: 10px; background: var(--accent-soft);
  padding: 11px 13px; margin-bottom: 12px;
}
.notecard .nhd {
  font-family: var(--font-num); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent-txt); margin-bottom: 5px;
}
.notecard .ntx { font-size: 13px; line-height: 1.55; color: var(--txt); }
.donediff > summary {
  cursor: pointer; list-style: none; font-family: var(--font-num); font-size: 11px;
  color: var(--txt-faint); padding: 6px 0;
}
.donediff > summary::-webkit-details-marker { display: none; }
.donediff > summary::before { content: "▸ "; }
.donediff[open] > summary::before { content: "▾ "; }
.donediff > summary:hover { color: var(--txt-dim); }
.donediff > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Movimento reduzido: a tela ainda roda todas as etapas e ainda copia — só que
   sem morph, sem giro e sem entrada escalonada. Nenhuma informação se perde. */
@media (prefers-reduced-motion: reduce) {
  .beam.on::after, .beam:hover::after { animation: none; }
  .backdrop .gbeam { display: none; }
  .rise { animation: none; }
  .hoff-scrim, .hoff-term .ln { animation: none; }
  .hoff-step.on .mark { animation: none; }
  .card::after { display: none; }
}

@media (max-width: 900px) {
  .hoff-scrim { padding: 10px; }
  .hoff { max-height: 94vh; }
  /* O `.spacer` com `flex: 1` empurrava o Fechar para uma terceira linha só
     dele. Sem ele, `margin-left: auto` encosta o botão na direita do título. */
  .hoff-hd { flex-wrap: wrap; row-gap: 4px; }
  .hoff-hd .spacer { display: none; }
  .hoff-hd .btn:last-of-type { margin-left: auto; }
  .hoff-hd .sig { flex-basis: 100%; order: 9; }
  .hoff-body { grid-template-columns: minmax(0,1fr); }
  .hoff-steps { border-right: 0; border-bottom: 1px solid var(--line-soft); max-height: 148px; }
  .hoff-main { grid-template-rows: 150px minmax(0,1fr); }
  .hoff-brief { width: calc(100% - 20px); margin: 0 10px 10px; height: 84px; }
  /* Em 390px o desenho do fluxo e a revisão não cabem juntos, e entre os dois
     quem decide é a revisão — o grafo já foi visto durante as etapas. */
  .hoff.reviewing .hoff-mini { display: none; }
  .hoff.reviewing .hoff-main { grid-template-rows: minmax(0,1fr); }
  /* Em 390px a faixa de revisão come o corpo inteiro. Medido: a trilha do grid
     ficou em 26px enquanto o corpo continuava com 132px, e o terminal foi
     pintado por cima do cabeçalho da revisão.
     `min-height` no ITEM não cria espaço — o item passa a estourar a trilha, e
     como `.hoff-body` não tem overflow próprio o excesso vaza para a linha
     seguinte. O piso tem que estar na TRILHA (`minmax`), e a faixa de revisão
     tem que ter teto para sobrar altura para ela. As etapas somem: são
     histórico, e o que decide já chegou. */
  .hoff.reviewing .hoff-steps { display: none; }
  .hoff.reviewing { grid-template-rows: auto minmax(110px, 1fr) auto auto; }
  .hoff-pr { max-height: 40vh; padding: 12px; }
  .dnode > summary { flex-wrap: wrap; }
  .dnode .ty { margin-left: 0; flex-basis: 100%; }
  .hoff-term { padding: 12px 12px 14px; }
  /* Alvo de toque: o botão do cabeçalho ficava em 32px, abaixo do piso de 40. */
  .hoff-ft .btn, .hoff-hd .btn { min-height: 40px; }
  /* A topbar é uma linha flex sem quebra: em 390px o conteúdo soma ~660px e
     empurrava a página inteira para a rolagem horizontal. Ela vira duas faixas,
     com a URL da instância descendo para a segunda — nada é escondido, só
     reordenado, porque em tela pequena o orçamento é outro, não menor. */
  .topbar { height: auto; min-height: 56px; flex-wrap: wrap; row-gap: 6px; padding: 8px 14px; }
  .topbar .sep { display: none; }
  .topbar .btn { flex: 0 0 auto; min-height: 40px; }
  .topbar .spacer { flex: 1 1 auto; }
  #instance { order: 9; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* No desktop os controles do painel não encolhem (senão o rótulo quebra sob o
     ícone). Em 390px isso vira estouro horizontal, então aqui quem quebra é a
     linha inteira — o controle continua íntegro, só desce. */
  .panel-hd { flex-wrap: wrap; row-gap: 8px; }
  .panel-hd .btn { min-height: 40px; }

  .shell { grid-template-columns: minmax(0,1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; }
  .rail h4 { display: none; }
  /* No trilho horizontal os chips voltam a uma linha: a meta dobraria a altura
     da faixa inteira por causa do chip mais largo. */
  .rail-item { min-height: 40px; flex: 0 0 auto; }
  .rail-item .meta { display: none; }
  .rail-item i.bar { grid-row: 1; height: 15px; align-self: center; }
  main { padding: 16px 14px 70px; }
  .kpi .val { font-size: 26px; }
  .stage { height: 340px; }
}

/* ==========================================================================
   SUPERFÍCIES DO NAVEGADOR — a parte do painel que não foi desenhada
   A barra de rolagem nativa do Windows (trilho branco, setas nas pontas, canto
   quadrado) é o único pedaço da tela que não pertence a nenhum tema: aparecia
   como uma faixa clara dentro do modal escuro do handoff. Aqui ela vira um
   pill flutuante tirado da mesma escada de texto do resto — trilho invisível,
   polegar em `--txt`, hover em `--accent` (movimento e realce são de accent;
   cor de status continua reservada).

   `background-clip: content-box` sobre uma borda transparente é o que dá a
   folga lateral: a calha continua com 12px de alvo de clique, mas o polegar
   desenha 6px. Estreitar a calha em vez disso deixaria a barra bonita e difícil
   de pegar com o mouse.

   Chromium ignora os pseudo-elementos `::-webkit-scrollbar` assim que
   `scrollbar-color` está declarado no mesmo elemento — por isso a via padrão
   (Firefox) fica dentro de `@supports not selector(...)`, e não lado a lado.
   ========================================================================== */
::-webkit-scrollbar { width: 12px; height: 12px; background: transparent; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: color-mix(in srgb, var(--txt) 20%, transparent);
  background-clip: content-box;
  border: 3px solid transparent;
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--accent) 58%, transparent); }
::-webkit-scrollbar-thumb:active { background-color: var(--accent); }
/* As setas das pontas são o traço mais datado da barra nativa e não levam a
   lugar nenhum que a roda do mouse não leve. */
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
::-webkit-scrollbar-corner { background: transparent; }

@supports not selector(::-webkit-scrollbar) {
  html, body, .rail, .feed, .hoff-steps, .hoff-term, .hoff-pr, .dnode .body, textarea {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--txt) 24%, transparent) transparent;
  }
}

/* O terminal e a faixa de revisão crescem enquanto a sessão roda: sem calha
   reservada, a linha que faz o conteúdo passar da altura empurra tudo 12px
   para a esquerda no meio da leitura. */
.hoff-term, .hoff-pr, .hoff-steps { scrollbar-gutter: stable; }

::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--txt); }
textarea, input { caret-color: var(--accent); }


/* ==========================================================================
   UPGRADE — o que é só desta tela
   Tudo acima veio do `flows.html` em tempo de composição. Daqui para baixo é
   vocabulário novo, e ele reusa os tokens: nada aqui inventa cor.
   ========================================================================== */

.up-wrap { max-width: 1560px; margin: 0 auto; padding: 22px 20px 80px; position: relative; z-index: 1; }
/* Com um fluxo aberto a tela é a janela: o rodapé da vitrine viraria barra de
   rolagem numa página que não tem para onde rolar. O `calc` de `.tela` conta com
   estes 22+22. */
.up-wrap.cheio { padding-bottom: 22px; }

.up-hd { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.up-hd .ix { font-family: var(--font-num); font-size: 11px; color: var(--brand-txt); letter-spacing: .12em; }
.up-hd h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.up-sub { color: var(--txt-dim); font-size: 12.5px; line-height: 1.6; margin: 6px 0 18px; max-width: 96ch; }
.up-sub code { font-family: var(--font-num); font-size: 11.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }

/* ---- vitrine: ideia C, a forma do fluxo como identidade ---- */
/* A TIRA DE ESCRITA EM CURSO, no topo da vitrine. Ela é a porta de volta para o
   progresso de quem saiu da tela do fluxo no meio — dentro do cartão ela não pode
   morar, porque o cartão É um `<button>` e botão dentro de botão é HTML inválido.
   `--accent` e nunca cor de status: uma escrita em curso é MOVIMENTO, não veredito.
   As duas cores de texto foram medidas sobre o `--accent-soft` composto: o rótulo
   usa a receita `color-mix(... 72%, var(--txt))` (5,94 no escuro, 8,11 no claro) e
   o `--txt` cheio do meio passa folgado nos dois temas. */
.tira-esc {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 10px;
  padding: 9px 13px; margin: 0 0 14px; font-family: var(--font); font-size: 12.5px; color: var(--txt);
}
.tira-esc:hover { border-color: var(--accent); }
.tira-esc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tira-esc .g { font-family: var(--font-num); flex: 0 0 auto;
  color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt)); }
.tira-esc .q { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tira-esc .ver { margin-left: auto; flex: 0 0 auto; font-family: var(--font-num); font-size: 11px;
  color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt)); }
.vit { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 15px; }
.vcard { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; box-shadow: var(--shadow); cursor: pointer; text-align: left;
  padding: 0; font: inherit; color: inherit; display: block; width: 100%;
  transition: border-color .16s, transform .16s; }
.vcard:hover { border-color: var(--accent-line); transform: translateY(-2px); }
.vcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vcard.morno { opacity: .62; }
.vcard.morno .vc-art { border-bottom-style: dashed; }

.vc-art { position: relative; height: 96px; border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(0deg, var(--surface) 0%, transparent 72%),
    radial-gradient(circle at 1px 1px, var(--grid-bold) 1px, transparent 0) 0 0/13px 13px; }
.vc-nos { position: absolute; right: 9px; top: 8px; font-family: var(--font-num); font-size: 10px;
  color: var(--txt-faint); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 6px; }
.vc-art .carregando { font-family: var(--font-num); font-size: 10px; color: var(--txt-faint); letter-spacing: .1em; }

.mini { width: 100%; height: 100%; display: block; }
.mini .mw line { stroke: var(--wire); stroke-width: .9; opacity: .6; }
.mini .mn rect { fill: var(--txt-faint); }
/* O nó que falhou, pintado no desenho. É o que separa este cartão de um enfeite:
   dá para ver ONDE dói antes de clicar. Quando a atribuição aponta para
   sub-fluxo, nada é pintado — pintar o nó errado é pior que não pintar. */
.mini .mn rect.falhou { fill: var(--risk); }

.vc-bd { padding: 12px 14px 13px; }
.vc-nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13.5px; }
.vc-nm .nm { font-weight: 600; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* `--txt-faint` mede 4,2105 sobre a face do cartao, nos dois temas — mesmo numero
   que a `.anxnota` do `entradas.js` ja pagou. Sobe um degrau da escada. */
.vc-sub { font-size: 11px; color: var(--txt-dim); margin-top: 3px; min-height: 14px; }
.vc-ft { display: flex; align-items: baseline; gap: 6px; margin-top: 11px; }
.vc-ft .big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 20px; color: var(--txt); }
.vc-ft .un { font-size: 11.5px; color: var(--txt-dim); }
.vc-ft .peso { margin-left: auto; }

/* O selo do dossiê. Linha própria, separada por um traço: é uma pergunta diferente
   das outras duas do cartão (quanto roda, quanto custa conversar) — é se dá para
   conversar. `min-width: 0` + `overflow: hidden` porque o texto do laranja cresce
   com o número de nós e um cartão de 292px não pode empurrar a grade. */
.vc-dos { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line-soft);
  display: flex; align-items: center; min-width: 0; overflow: hidden; }
.vc-dos .tag { overflow: hidden; text-overflow: ellipsis; }
.vc-dos .tag .g { font-family: var(--font-num); }
/* AS QUATRO REGRAS DE COR QUE MORAVAM AQUI SUBIRAM PARA A BASE `.tag`. Elas nasceram
   quando só este cartão tinha sido medido, e o comentário registrava como ACHADO que
   a etiqueta do peso e as do diff tinham os mesmos números e não haviam sido tocadas.
   Foram medidas — as três reprovavam —, então a família foi resolvida de uma vez e
   duas definições da mesma cor deixaram de existir. Ver o comentário da base.
   O que fica aqui é o GLIFO com a cor cheia: ele é forma, não texto corrido. */
.vc-dos .tag.ok .g { color: var(--ok-txt); }
.vc-dos .tag.warn .g { color: var(--warn-txt); }
.vc-dos .tag.risk .g { color: var(--risk-txt); }
.vc-dos .tag.cold .g { color: var(--cold-txt); }
/* Travado ganha contorno, não só cor: a regra desta base é que a pista nunca é
   apenas o matiz. */
.vc-dos .tag.travado { border: 1px dashed currentColor; }

/* `sdot`, não `dot`: o topbar já tem `<span class="dot">⏺</span>` nos botões
   Gravar e Avisar, e `.rec .dot` do bloco extraído só declara `display` — então uma
   regra genérica `.dot` com 7px de largura passa por baixo e transforma o glifo
   numa caixa torta. Mesma família do `.st` que já colidiu com a grade de passos do
   palco: classe de duas letras num arquivo que carrega o CSS de outra tela é
   colisão esperando acontecer. */
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
.sdot.ok { background: var(--ok); } .sdot.warn { background: var(--warn); }
.sdot.risk { background: var(--risk); } .sdot.cold { background: var(--cold); }

/* A FAMÍLIA `.tag` INTEIRA, e não uma etiqueta de cada vez. Medido no DOM vivo em
   2026-08-20, com o CSS real e a marcação real, ANTES do conserto — cor de status
   como texto corrido sobre o fundo `-soft` reprova AA em seis lugares:

     claro  `.tag.ok`   4,4665   `.tag.warn`  4,4841   (e as três do diff, 9,5px)
     escuro `.tag.cold` 4,0437 sobre `--raised` (a `.tela-hd`)

   O `.tag.cold` é o caso que prova a regra que o `CLAUDE.md` já escreveu: um token de
   texto tem de vencer TODA superfície onde ele cai, não a mais fácil. O mesmo cinza
   passa em 4,5168 sobre `--surface` (o cartão) e reprova em 4,0437 sobre `--raised`
   (o cabeçalho da tela) — medir só um dos dois teria fechado o achado pela metade.

   A receita é a que o `.aviso` e a faixa `.dos` já usam: 72% do par `-txt` misturado
   com `--txt`, que mantém o matiz reconhecível e sobe o contraste. O `-soft` de fundo
   NÃO muda: ele foi calibrado como preenchimento, onde WCAG não impõe piso, e é a
   cor que o Kauan ajustou.

   AS QUATRO REGRAS DO `.vc-dos` SAÍRAM DAQUI. Elas eram a mesma `color-mix` com o
   mesmo valor, escritas quando só aquele cartão tinha sido medido; mantê-las ao lado
   da base seria uma segunda definição do mesmo fato, e a que divergisse decidiria o
   contraste de uma etiqueta e não da outra. O que ficou lá é o `.g`, que é DIFERENTE
   de propósito: o glifo é forma, não texto corrido, e leva a cor cheia. */
.tag { font-family: var(--font-num); font-size: 10.5px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.tag.ok { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt)); background: var(--ok-soft); }
.tag.warn { color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); background: var(--warn-soft); }
.tag.cold { color: color-mix(in srgb, var(--cold-txt) 72%, var(--txt)); background: var(--cold-soft); }
.tag.risk { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); background: var(--risk-soft); }

/* ---- a tela do fluxo ---- */
/* UMA TELA SÓ, DO TAMANHO DA JANELA.
 *
 * Antes o cartão crescia com o conteúdo: sobrava meia janela vazia embaixo
 * enquanto o desenho de 184 nós era uma faixa de 98px. Abrir um fluxo é abrir UM
 * fluxo — não há segunda coisa nesta página para a qual rolar — então a tela é a
 * unidade, e cada coluna rola dentro de si.
 *
 * `min-height` existe para a janela baixa: abaixo dele a página volta a rolar, o
 * que é melhor que espremer o compositor e o desenho até nenhum dos dois servir. */
.tela { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); overflow: hidden;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  height: calc(100vh - 58px - 44px); min-height: 560px; }
.tela-hd { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--raised); }
.th-l { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13.5px; }
.th-l .ix { font-family: var(--font-num); font-size: 10.5px; color: var(--brand-txt); letter-spacing: .12em; }
.th-l b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th-r { display: flex; gap: 7px; flex: 0 0 auto; }

/* faixa do dossiê — a cor vem de DIVERGÊNCIA, nunca de data. A data aparece
   como contexto. Dossiê de 30 dias de um fluxo estável há 48 está correto. */
.dos { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.dos.ok { background: var(--ok-soft); } .dos.warn { background: var(--warn-soft); }
.dos.risk { background: var(--risk-soft); } .dos.cold { background: var(--cold-soft); }
.dos-tx { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; min-width: 0; flex: 1 1 auto; }
.dos-tx .t { font-size: 12.5px; }
.dos.ok .t { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt)); }
.dos.warn .t { color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); }
.dos.risk .t { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }
.dos.cold .t { color: color-mix(in srgb, var(--cold-txt) 72%, var(--txt)); }
.dos-tx .s { font-size: 11.5px; color: var(--txt-dim); }

/* AS TRÊS VARIANTES DE LAYOUT, e a que vale é escolhida em `LAYOUT_PADRAO`
 * (ou por `?layout=`, que é como as três foram comparadas em print).
 *
 * O que decide entre elas é a razão do desenho, não gosto: medido nesta
 * instância, os fluxos vivos vão de 1,16 a 7,14 de largura/altura, e o maior
 * deles — o Iago, 184 nós — é 7,14. Num desenho assim a LARGURA é o eixo que
 * rende: cada 100px de largura vale 14px de altura útil. Altura sobrando só
 * vira tarja preta em cima e embaixo.
 *
 *   duas  — conversa | desenho, lado a lado. O desenho ganha a fatia maior.
 *   pilha — desenho em cima, na largura inteira; conversa embaixo. Dá ao
 *           desenho o eixo que ele quer, ao preço de encurtar a conversa.
 *   foco  — conversa estreita à esquerda, desenho no resto. Máximo de desenho
 *           com as duas coisas visíveis ao mesmo tempo.
 *
 * As três mantêm conversa e desenho na tela juntos de propósito: o alvo acendendo
 * no desenho é o retorno do que ele acabou de escrever, e esconder um dos dois
 * quebraria justamente esse par. */
.duas { display: grid; min-height: 0; }
.tela[data-layout="duas"] .duas { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); }
.tela[data-layout="foco"] .duas { grid-template-columns: minmax(330px, 25%) minmax(0, 1fr); }
.tela[data-layout="pilha"] .duas { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); }
/* Na pilha o desenho vem primeiro na TELA e continua segundo no HTML: a ordem do
   documento é conversa → desenho porque é essa a ordem de leitura para quem usa
   leitor de tela, e trocá-la para arrumar o visual custaria isso. */
.tela[data-layout="pilha"] .col-desenho { grid-row: 1; border-bottom: 1px solid var(--line); }
.tela[data-layout="pilha"] .col-chat { grid-row: 2; border-right: 0; }
/* Medida máxima na conversa, e só neste layout: com a coluna em 1386px o
   compositor virava uma linha de texto que o olho não consegue voltar, e a bolha
   a 92% de 1386 dava 1275px de linha. Largura de coluna não é largura de leitura.
   Em `px` e não em `ch` porque `ch` mede na fonte DO PRÓPRIO elemento: o cabeçalho
   da seção (12px) ganhou uma largura menor que o compositor (15px) e os dois
   ficaram desalinhados, cada um centrado na sua própria medida. */
.tela[data-layout="pilha"] .col-chat > * { width: min(100%, 760px); margin-left: auto; margin-right: auto; }

.col-chat { padding: 16px; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.col-desenho { padding: 16px; background: var(--bg-deep);
  display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* A conversa rola dentro de si e o compositor fica preso embaixo. Era isso o
   "espaço mal usado": a coluna crescia com o texto, empurrando o cartão para
   fora da janela, e o campo de escrever descia junto até sair da tela. */
/* `min-height` no lugar de `0`: medido na `pilha`, com um alvo proposto a pilha de
   blocos presos (seção, alvo, nota, confirma, compositor, custo) passava dos 295px
   da faixa e a conversa era espremida a ZERO — a conversa desaparecia exatamente
   quando havia mais o que ler nela. Com o piso, quem não couber transborda e a
   coluna rola; o compositor deixa de ficar preso só nesse caso, que é bem melhor
   que uma conversa de altura nenhuma. */
/* `display: flex` AQUI E O CONSERTO DE UMA REGRA QUE NAO FAZIA NADA. A linha
   `.conv-rol > .vazio { margin: auto }` logo abaixo existe para centrar o convite da
   conversa vazia, e em layout de BLOCO margem vertical `auto` resolve para ZERO — o
   `.conv-rol` era item de flex do `.col-chat`, nunca container. Medido no DOM vivo em
   1440px: o convite ficava no TOPO e sobravam 250px de vao entre ele e o
   compositor, que era o "espaco mal usado" que sobrou desta tela. Em coluna de flex a
   mesma margem centra de verdade.
   `.chat` fica `flex: 0 0 auto` para nao mudar nada do caso com mensagens: ele
   continua comecando no topo e crescendo, e quem rola e o `.conv-rol`. */
.conv-rol { flex: 1 1 auto; min-height: 104px; overflow-y: auto; margin: 0 -4px; padding: 0 4px;
  display: flex; flex-direction: column; }
.conv-rol > .chat { flex: 0 0 auto; }
.col-chat { overflow-y: auto; }
.col-chat > .compositor, .col-chat > .custo, .col-chat > .banda, .col-chat > .trava,
.col-chat > .alvos, .col-chat > .nota, .col-chat > .confirma { flex: 0 0 auto; }
/* Sem conversa ainda, o convite fica no meio do vazio em vez de colado no topo. */
.conv-rol > .vazio { margin: auto; }
.secao { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--txt-dim); margin: 0 0 11px; }
.secao .ix { font-family: var(--font-num); font-size: 10.5px; color: var(--brand-txt); letter-spacing: .1em; }
.secao .hint { font-size: 10.5px; color: var(--warn-txt); background: var(--warn-soft);
  padding: 2px 7px; border-radius: 5px; margin-left: auto; }

/* O hospedeiro do palco é `display: contents` e isso NÃO é detalhe: `.palco-box`
   é `flex: 1 1 auto` dentro da `.col-desenho`, que é flex-column. Um wrapper
   normal viraria ele o item flexível e a caixa desabaria para a altura do
   conteúdo — o desenho sumiria da tela. Com `contents` o hospedeiro não existe
   para o layout e a caixa continua sendo o item flexível, exatamente como antes
   de o nó passar a ser preservado. */
.palco-host { display: contents; }
.palco-box { border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, var(--grid-bold) 1px, transparent 0) 0 0/17px 17px;
  flex: 1 1 auto; min-height: 0; position: relative; }
/* `touch-action: none` é o que faz o arraste funcionar no trackpad sem a página
   rolar por baixo. `cursor: grab` é a única pista de que o desenho se move. */
.palco { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.palco.arrasta { cursor: grabbing; }
.palco:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Os controles da câmera. Ficam DENTRO da caixa porque é o desenho que eles
   movem, e um botão de zoom longe do que amplia é um botão que não se acha. */
.cam { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; z-index: 2; }
.cam button { height: 26px; min-width: 26px; padding: 0 6px; display: grid; place-items: center;
  font-family: var(--font-num); font-size: 11px; cursor: pointer; color: var(--txt-dim);
  border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
.cam button:hover { color: var(--txt); border-color: var(--accent-line); }
.cam button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cam button.alvo { color: var(--accent-txt); border-color: var(--accent-line); }
/* A dica desaparece assim que a câmera é usada: instrução cumprida é ruído. */
.cam-dica { position: absolute; left: 11px; bottom: 8px; pointer-events: none;
  font-family: var(--font-num); font-size: 10px; color: var(--txt-faint); transition: opacity .3s ease; }
.palco-box.usada .cam-dica { opacity: 0; }
/* Quanto o nó está medindo AGORA. É o número que diz se dá para ler, e é o que
   transforma "está pequeno" numa observação verificável. */
.cam-esc { position: absolute; right: 10px; bottom: 8px; pointer-events: none;
  font-family: var(--font-num); font-size: 10px; color: var(--txt-faint); }
.pw { fill: none; stroke: var(--wire); stroke-width: 2; opacity: .75; }
.pah { fill: none; stroke: var(--wire); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.pnf { fill: var(--node-face); stroke: var(--node-edge); stroke-width: 1.6; }
.pn .pni { stroke: var(--txt-faint); }
/* O alvo aceso é `--accent`: MOVIMENTO, nunca status. Nada no desenho é veredito. */
.pn.on .pnf { stroke: var(--accent); stroke-width: 2.6; fill: color-mix(in srgb, var(--accent) 12%, var(--node-face)); }
.pn.on .pni { stroke: var(--accent-txt); }
.pn.falhou .pnf { stroke: var(--risk); stroke-width: 2.4; fill: color-mix(in srgb, var(--risk) 10%, var(--node-face)); }
/* Tipo em unidades de viewBox: o palco é escalado, então 23 rende ~11px. */
.pnm { fill: var(--txt-dim); font-size: 20px; font-weight: 600; text-anchor: middle; }
.pnt { fill: var(--txt-faint); font-size: 17px; text-anchor: middle; font-family: var(--font-num); }

.compositor { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
.cp-in { width: 100%; border: 0; background: transparent; color: var(--txt); font: inherit;
  font-size: 12.5px; padding: 11px 12px; resize: vertical; min-height: 62px; }
/* `outline: none` sem substituto deixava o campo mais importante desta aba sem
   indicador de foco. O anel vai no `.compositor`, nunca no fundo: mudar o fundo
   moveria o contraste do texto que acabou de ser calibrado. */
.cp-in:focus { outline: none; }
.compositor:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
/* `flex-wrap` entrou com a fileira de entradas, e as duas coisas são uma decisão
   só: a `.iobar` tem três pílulas de `flex: 0 0 auto` (elas não encolhem, pelo
   mesmo motivo que os controles do `.panel-hd` do `flows.html` não encolhem — o
   ícone quebraria embaixo do rótulo), e o que não encolhe tem de poder descer de
   linha. Sem isto a coluna da conversa a 390px empurra o botão «enviar» para
   fora. */
.cp-bt { display: flex; gap: 7px; justify-content: flex-end; align-items: center;
  padding: 0 10px 10px; flex-wrap: wrap; }
.cp-bt .nota { margin-right: auto; font-size: 11px; color: var(--txt-faint); }
/* Os chips + a nota + a recusa ancorada, DENTRO da caixa. O `.anexos` do
   `/entradas.js` já vem com `margin-top`, então aqui só falta o recuo lateral
   para eles não encostarem na borda do compositor. */
.cp-anx { padding: 0 10px 10px; }
.cp-anx > .anexos:first-child { margin-top: 0; }
.cp-anx .aviso { margin: 8px 0 0; }
/* O compositor ESPERANDO o estado do dossiê chegar. A forma é a mesma — trocar a
   caixa de texto por outro bloco enquanto a resposta está no ar faria a tela
   saltar duas vezes em meio segundo, e o segundo salto é o que dá a impressão de
   que algo deu errado. Só o campo fica surdo e a nota diz o que se está fazendo. */
.cp-in:disabled { color: var(--txt-faint); cursor: progress; }
.compositor.esperando { border-style: dashed; }

/* O COMPOSITOR TRAVADO — ver `podeConversar()`. Não é o `.compositor` com o campo
   desabilitado: um campo cinzento continua parecendo um campo, e o que precisa
   ficar dito é que aqui não se escreve ainda. O aviso é ANCORADO (`.aviso` solto,
   nunca `.avisos > .aviso`), porque o bloqueio pertence ao lugar dele — é a mesma
   divisão que o resto do produto já segue: o que é consequência de um clique
   flutua, o que é problema de um lugar fica nele. */
.trava { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.trava .aviso { margin: 0; }
/* Liberado COM ressalva: o `.trava` já dá o afastamento do bloco de cima, e o
   `margin-top` do compositor por dentro dele abriria um vão duplo entre a frase e
   o campo que ela qualifica. */
.trava > .compositor { margin-top: 0; }
/* A nota do rascunho guardado entra na mesma coluna, e o `margin-top` dela por
   dentro do `gap` do `.trava` abriria um vão duplo — mesma razão da regra acima. */
.trava > .nota { margin-top: 0; }
.trava-bt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trava-bt .nota { font-size: 11px; color: var(--txt-faint); line-height: 1.55; }

/* ---- a conversa ---- */
.chat { display: flex; flex-direction: column; gap: 11px; }
.msg { display: flex; }
.msg.eu { justify-content: flex-end; }
.bub { max-width: 92%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px;
  font-size: 12.5px; line-height: 1.62; color: var(--txt-dim); background: var(--raised);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.eu .bub { background: var(--accent-soft); border-color: var(--accent-line); color: var(--txt); }
.mtag { display: inline-block; font-family: var(--font-num); font-size: 9px; letter-spacing: .1em;
  color: var(--txt-faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  margin-bottom: 7px; }
.mtag.alvo { color: var(--accent-txt); border-color: var(--accent-line); }
.perg { margin: 8px 0 0; padding-left: 17px; }
.perg li { margin: 3px 0; }

/* ---- o que foi COM a mensagem, dentro da bolha ----
   `white-space: normal` porque a `.bub` é `pre-wrap`: sem isto, o espaço entre as
   miniaturas viraria linha em branco dentro da bolha. */
/* `align-items: flex-start` porque o padrão do flex é `stretch`: sem isto o chip do
   CSV esticava até a altura da miniatura ao lado — uma caixa vazia de 170px com um
   nome de arquivo no topo, medido na captura. */
.banx { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-top: 9px;
  white-space: normal; }
.banx-img { display: block; line-height: 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--accent-line); background: var(--surface-2); }
/* Teto pequeno de propósito: a bolha é a CONVERSA, e um print de 1440px empurraria
   a mensagem seguinte para fora da tela. Quem quer ver grande clica — o `<a>` abre o
   arquivo em tamanho real, que é o que decide se ele mandou o print certo. */
.banx-img img { display: block; max-width: 240px; max-height: 170px; width: auto; height: auto; }
.banx-img:hover { border-color: var(--accent); }
.banx-img:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.banx-chip, .banx-ido {
  display: inline-flex; align-items: baseline; gap: 7px; max-width: 100%;
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-dim);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
  background: var(--surface-2); text-decoration: none; min-width: 0;
}
.banx-chip:hover { border-color: var(--accent-line); color: var(--txt); }
.banx-chip .sens { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--txt); }
/* `--txt-dim` e NÃO `--txt-faint`: medido no DOM vivo, faint aqui dá **4,2513** no
   tema escuro — reprovação de AA. O fundo é `--surface-2` composto dentro de uma
   bolha `--accent-soft`, e é a regra que esta base já escreve: um token de texto
   tem de passar em TODA superfície em que cai, nunca na mais fácil. A hierarquia
   não se perde porque o nome subiu para `--txt` no mesmo movimento. */
.banx-chip .t { color: var(--txt-dim); flex: 0 0 auto; }
/* O arquivo que já não existe. `--cold`, nunca `--risk`: scratch apagado é o que
   estava previsto acontecer, não uma falha — vermelho aqui gastaria o alarme que o
   patch em produção precisa.
   A COR SAI DA RECEITA MEDIDA, não do token cru: `--cold-txt` sozinho deu 4,4237 no
   escuro e 4,1293 no claro — reprovado nos dois. */
.banx-ido { color: color-mix(in srgb, var(--cold-txt) 72%, var(--txt)); border-style: dashed; }

/* ═════════ A TELINHA DE PROGRESSO DO DOSSIÊ — a escrita tem onde ser vista ═══
 *
 * O PEDIDO, com estas palavras: "essa parte de dossiê precisa ser igual quando
 * enviamos o claude arrumar o fluxo, que abre uma telinha e fica mostrando o
 * progresso". A escrita leva MINUTOS (medido: 514s num fluxo de 103 nós, 682s num
 * de 179) e o que existia no lugar dela era um botão desabilitado com uma linha de
 * atividade dentro — nada dizia em que etapa está, em que rodada, nem quanto falta.
 *
 * A BARRA NÃO É NOVA, E ESSA É A DECISÃO. `.pbar`/`.pfill` (com `.unknown` e
 * `.over`) já existiam neste arquivo, vieram junto com o bloco do handoff e
 * estavam MORTAS — medido por grep, as únicas ocorrências eram as próprias regras.
 * Acender CSS morto é o que o seletor de fluxo já fez com a casca `.fmod*`; uma
 * segunda família de barra seria uma segunda calibragem da mesma coisa, e a que
 * divergisse seria a que ninguém olhou. Os dois estados de que esta tela precisa
 * — sem régua e estourado — são exatamente `.unknown` e `.over`.
 *
 * `z-index: 46`, e a posição é a camada DECLARADA desta página: 40 o overlay da
 * verificação, 45 o seletor de fluxo, 46 ESTA telinha, 47 o visor do anexo, 50 o
 * `.scrim` do `confirmar()`. ACIMA do seletor porque ela é aberta por cima do que
 * a tela já tem; ABAIXO do visor porque o visor é aberto de dentro de uma conversa
 * que continua viva enquanto o dossiê é escrito; e ABAIXO do `.scrim` porque este
 * arquivo afirma em três lugares que o diálogo de confirmação é o que está mais à
 * frente de tudo — um progresso por cima de um diálogo que decide GASTO esconderia
 * justamente o botão que decide o gasto.
 *
 * A COR AQUI É DO TEMA, ao contrário do visor: o que está dentro desta caixa é
 * texto nosso, não o print de uma interface qualquer. Todas as medições foram
 * feitas contra `--surface` e contra o `--surface-2` composto sobre ela, e o texto
 * de status usa a receita `color-mix(in srgb, var(--*-txt) 72%, var(--txt))` que
 * esta casa já escreveu — o token cru reprova AA em texto pequeno. */
.prog-scrim {
  position: fixed; inset: 0; z-index: 46; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1);
  -webkit-backdrop-filter: blur(9px) saturate(1.1);
  animation: progin .2s ease-out both;
}
@keyframes progin { from { opacity: 0; } }
.prog {
  position: relative; width: min(540px, 100%); max-height: min(84vh, 760px);
  display: grid; grid-template-rows: auto minmax(0,1fr) auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow), 0 50px 110px -50px rgba(0,0,0,.85);
  overflow: hidden;
  animation: progup .24s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes progup { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.prog-hd { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 8px; }
.prog-hd .idx { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em;
  color: var(--brand-txt); flex: 0 0 auto; }
/* `min-width: 0` + `nowrap`: o nome do fluxo é longo ("Agente Iago Comercial") e
   sem os dois ele quebra em duas linhas dentro de uma caixa de 540px — a mesma
   lição que o `.tela-hd` e o `.fmod-grp` desta página já pagaram. */
.prog-hd h3 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-corpo { min-height: 0; overflow-y: auto; padding: 2px 16px 14px; }
/* AS QUATRO ETAPAS. A lista é fechada e vem do `dossie.js` (`ETAPAS`) pelo campo
   `etapaTotal` — nenhum 4 cravado aqui nem na página. */
.prog-etapas { display: flex; flex-direction: column; gap: 1px; margin: 6px 0 4px; }
.prog-et { display: flex; align-items: baseline; gap: 9px; padding: 5px 9px; border-radius: 8px;
  font-size: 12.5px; color: var(--txt-faint); }
.prog-et .n { font-family: var(--font-num); font-size: 10.5px; flex: 0 0 auto; }
.prog-et .q { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-et.feita { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt)); }
.prog-et.agora { color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt)); background: var(--accent-soft); }
/* A LINHA VIVA. É o mesmo fato que o `title` do selo já carrega, e é o único
   texto desta caixa que muda sozinho — por isso ele fica em `--txt` cheio. */
.prog-at { margin: 10px 0 2px; font-size: 13px; color: var(--txt); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-bar { margin: 10px 0 6px; }
.prog-nums { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  font-family: var(--font-num); font-size: 11px; color: var(--txt-dim); }
.prog-nums .dir { margin-left: auto; }
.prog-nums .over { color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); }
/* A frase do indeterminado. Ela NÃO é `--txt-faint`: é a única coisa na tela que
   explica por que a barra não diz um número, e esconder a explicação da barra
   parada é o mesmo que não ter a explicação. */
.prog-porque { margin-top: 7px; font-size: 12px; line-height: 1.5; color: var(--txt-dim); }
.prog-res { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); }
.prog-res b { display: block; margin-bottom: 4px; font-size: 12px; }
.prog-res.ok b { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt)); }
.prog-res.mau b { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }
.prog-res ul { margin: 6px 0 0; padding-left: 16px; }
.prog-ft { padding: 11px 16px; border-top: 1px solid var(--line-soft); background: var(--surface-2);
  font-size: 11.5px; line-height: 1.5; color: var(--txt-dim); }
.prog-ft ul { margin: 0 0 10px; padding-left: 15px; }
.prog-ft li { margin: 2px 0; }
.prog-ft .x { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; border-radius: 9px;
  height: 30px; padding: 0 12px; color: var(--txt-dim); font-family: var(--font-num); font-size: 11.5px; }
.prog-ft .x:hover { color: var(--txt); border-color: var(--accent-line); background: var(--accent-soft); }
@media (prefers-reduced-motion: reduce) {
  /* O estado fica, a barra fica, o movimento de entrada sai. Nenhuma informação
     mora na animação — e a listra do `.pbar.unknown` já tem regra própria mais
     acima, que alcança esta caixa porque a barra é a MESMA. */
  .prog-scrim, .prog { animation: none; }
}

/* ═══════════════ O VISOR: o print abre AQUI, não noutra guia ════════════════
 *
 * O DEFEITO, relatado com um print: clicar na miniatura abria uma GUIA NOVA com a
 * imagem crua sobre o fundo preto do navegador. Aquilo não é ampliar, é SAIR — a
 * conversa fica para trás, o que ele escreveu sai da tela, e voltar é um Alt+Tab
 * para um lugar que não é o painel. O que ele queria era ver o que mandou do lado
 * do que escreveu.
 *
 * `z-index: 47`, e a posição é a camada DECLARADA desta página: 40 o overlay da
 * verificação, 45 o seletor de fluxo, 47 este visor, 50 o `.scrim` do
 * `confirmar()`. ACIMA do seletor porque o visor é aberto por cima de tudo o que a
 * tela já tem; ABAIXO do `.scrim` porque este arquivo afirma em dois lugares que o
 * diálogo de confirmação é o que está mais à frente de tudo — e um visor por cima
 * de um diálogo destrutivo esconderia o botão que decide o gasto.
 *
 * O VÉU usa o vocabulário da casa (`--bg-deep` a 72% com `blur(9px)`), igual ao
 * `.fmod-scrim` e ao `.ver-scrim`: um segundo jeito de escurecer a página seria um
 * segundo jeito de dizer "isto está na frente", e esta casa já tem um.
 *
 * A CAIXA, NÃO — e isto é decisão, não esquecimento de tokenizar. O chão é
 * `#101018` FIXO nos dois temas porque o que está dentro dele é o print de UMA
 * interface qualquer, que pode ser branca ou preta: um chão que muda de cor com o
 * tema mudaria a borda aparente da imagem do cliente conforme o horário do dia, e
 * um print branco sobre um chão branco perde a própria moldura. Chão fixo é o que
 * separa o print do resto da tela.
 *
 * CONSEQUÊNCIA, e ela é o motivo desta nota existir: OS TOKENS DE TEXTO NÃO VALEM
 * AQUI DENTRO. Medido contra `#101018`: `--txt-faint` do tema claro (`#666973`) dá
 * 3,4553 e `--cold-txt` claro (`#6D717E`) dá 3,8884 — os dois reprovam em AA. Toda
 * cor de texto do visor é literal e medida contra esse chão:
 *     nome do arquivo        `#EAECF6`  16,0703:1
 *     meta (tipo · tamanho)  `#A8AEC2`   8,5622:1
 *     link da guia           `#9AA6FF`   8,3586:1
 *     frase do arquivo sumido`#9AA3B8`   7,4865:1
 * O `--accent` cru foi RECUSADO no link: `#5865F5` dá 4,1420 no escuro e `#3B48E0`
 * dá 2,8749 no claro. É a mesma regra que esta casa já escreve — um token de texto
 * tem de passar em TODA superfície em que cai, e esta superfície não é do tema. */
.vis-scrim {
  position: fixed; inset: 0; z-index: 47; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1);
  -webkit-backdrop-filter: blur(9px) saturate(1.1);
  animation: visin .2s ease-out both;
}
@keyframes visin { from { opacity: 0; } }
.vis {
  position: relative; width: min(1080px, 100%); max-height: min(90vh, 900px);
  display: grid; grid-template-rows: auto minmax(0,1fr) auto;
  background: #101018; border: 1px solid rgba(255,255,255,.13); border-radius: 14px;
  box-shadow: 0 50px 110px -50px rgba(0,0,0,.9);
  overflow: hidden;
  animation: visup .24s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes visup { from { opacity: 0; transform: translateY(9px) scale(.99); } }
.vis-hd { display: flex; align-items: center; gap: 10px; padding: 10px 13px;
  border-bottom: 1px solid rgba(255,255,255,.08); }
.vis-hd .idx { font-family: var(--font-num); font-size: 10px; letter-spacing: .16em; color: #A8AEC2; }
.vis-hd .x { margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid rgba(255,255,255,.16); background: transparent; cursor: pointer;
  height: 28px; padding: 0 11px; border-radius: 8px; color: #A8AEC2;
  font-family: var(--font-num); font-size: 11px; }
.vis-hd .x:hover { color: #EAECF6; border-color: rgba(255,255,255,.34); }
.vis-hd .x:focus-visible { outline: 2px solid #9AA6FF; outline-offset: 2px; }
/* `place-items: center` com `overflow: auto`: um print maior que a caixa rola em
   vez de ser cortado, e um menor não estica — ampliar um print de 300px até 1080
   entregaria uma imagem borrada afirmando ser o original. */
.vis-corpo { min-height: 0; display: grid; place-items: center; padding: 14px; overflow: auto; }
/* Teto explícito em vez de `max-height: 100%`: a porcentagem depende de a linha da
   grade ter altura definida, e `.vis` tem `max-height`, não `height`. Um valor em
   `vh` não depende de nada e dá o mesmo resultado. */
.vis-corpo img { display: block; max-width: 100%; max-height: min(72vh, 690px);
  width: auto; height: auto; border-radius: 4px; }
.vis-ft { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.08); }
.vis-ft .nm { font-family: var(--font-num); font-size: 12px; color: #EAECF6;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vis-ft .mt { font-family: var(--font-num); font-size: 10.5px; color: #A8AEC2; flex: 0 0 auto; }
/* A GUIA CONTINUA EXISTINDO, agora por escolha: quem quer o print numa aba só dele
   — para comparar com o n8n aberto ao lado — clica aqui, e quem só queria ver
   grande não paga por isso. */
.vis-ft .lk { margin-left: auto; flex: 0 0 auto; font-family: var(--font-num); font-size: 11px;
  color: #9AA6FF; text-decoration: none; border-bottom: 1px solid rgba(154,166,255,.42); }
.vis-ft .lk:hover { border-bottom-color: #9AA6FF; }
.vis-ft .lk:focus-visible { outline: 2px solid #9AA6FF; outline-offset: 3px; }
/* A FRASE DO ARQUIVO SUMIDO DENTRO DO VISOR. `.banx-ido` traz a receita
   `color-mix(--cold-txt 72%, --txt)`, que no tema claro é tinta escura: sobre este
   chão fixo ela desapareceria. Mesma frase, mesmo ouvinte, outra cor — e a cor é a
   medida acima. */
.vis-corpo .banx-ido { color: #9AA3B8; border-color: rgba(255,255,255,.16); font-size: 12px; }
@media (prefers-reduced-motion: reduce) {
  /* O estado fica, o movimento sai — o visor continua abrindo, com a imagem, o
     rodapé e o foco no lugar. Nenhuma informação mora na animação. */
  .vis-scrim, .vis { animation: none; }
}

.alvos { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.alvo { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; padding: 6px 9px;
  border: 1px solid var(--accent-line); border-radius: 8px; background: var(--accent-soft); }
.alvo.novo { border-style: dashed; }

/* A RESOLUÇÃO DE ALVO (§4.5) — em qual fluxo os nós moram.
   `--warn` na troca porque ela pede atenção antes de confirmar e NÃO é falha;
   `--risk` no bloqueio porque ali não há o que confirmar. A distinção é a mesma
   que o resto do painel já faz, e gastar vermelho na troca queimaria o alarme
   antes de o bloqueio precisar dele. */
.resol { margin-top: 9px; border: 1px solid; border-radius: 7px; padding: 9px 11px; font-size: 12px; line-height: 1.5; }
.resol .rt { display: block; font: 600 10.5px/1 var(--font-mono); letter-spacing: .09em; margin-bottom: 5px; }
.resol code { font-size: 11.5px; }
.resol.troca { border-color: var(--warn-line, var(--line)); background: var(--warn-soft); color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); }
.resol.troca .rt { color: var(--warn-txt); }
.resol.trava { border-color: var(--risk-line, var(--line)); background: var(--risk-soft); color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }
.resol.trava .rt { color: var(--risk-txt); }
.resol.mudo { border-color: var(--line); background: var(--surface-2); color: var(--txt-faint); }
.resol.mudo .rt { color: var(--txt-dim); }
/* O que foi lido e o que não foi. Sem esta lista, "não consegui decidir" é um beco:
   é ela que permite a ele desempatar à mão. */
.resol ul { margin: 6px 0 0; padding-left: 16px; }
.resol li { margin: 2px 0; }

/* ══════════════════════ [ REVISÃO ] — O PATCH NA TELA (§4.1/4.2/4.4) ═══════
   Portado de `flows.html`, seletor por seletor: `.dnode`, `.dl`, `.edgelist`,
   `.porta`. Aquela tela já desenha EXATAMENTE este objeto — é a saída de
   `diffWorkflow` nos dois casos —, e uma segunda gramática visual para a mesma
   coisa é o que faz um produto parecer montado por quatro pessoas. Este painel
   já carrega essa dívida em três blocos copiados; não vale abrir um quarto com
   desenho DIFERENTE.

   Como lá, cor de status entra como texto pelos tokens `-txt` e como fundo pelos
   `-soft`: o par existe porque o token de preenchimento reprova AA em 12px, e
   isso está medido no `CLAUDE.md`. */
.pr { margin-top: 10px; border: 1px solid var(--line-soft); border-radius: 10px;
      background: var(--surface-2); padding: 11px 12px; }
.pr .prhd { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 9px; }
.pr .prhd .ix { font-family: var(--font-num); font-size: 10px; letter-spacing: .16em; color: var(--brand-txt); }
.pr .prhd b { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.pr .prhd .sum { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); }
.pr .resumo { font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); margin-bottom: 9px; }

/* Os portões. Mesma pílula do `.gate` de `flows.html`; o nome muda porque nesta
   página `gate` não existe e `porta` é a palavra que o resto do arquivo usa. */
.portoes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.porta { font-family: var(--font-num); font-size: 10.5px; line-height: 1.4;
         padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--txt-dim); }
.porta.ok  { color: var(--ok-txt);   border-color: color-mix(in srgb, var(--ok) 38%, transparent);   background: var(--ok-soft); }
.porta.bad { color: var(--risk-txt); border-color: color-mix(in srgb, var(--risk) 42%, transparent); background: var(--risk-soft); }

/* ══════════════ [ VERIFICANDO UPGRADE ] — A BATERIA DE SETE (§5) ═══════════
   Sete linhas acendendo uma a uma, e as CINCO cores não são decoração: cada uma
   leva a uma decisão diferente sobre o clique que vem depois.

   Cinza (`--cold`) é "não deu para conferir aqui", e ele NÃO bloqueia — 63% dos
   fluxos desta instância contêm tipo que o fantasma recusa por princípio, então
   uma regra literal de "todos os sete verdes" faria a aba nunca aplicar em agente
   nenhum. Vermelho bloqueia. Indigo é movimento, e movimento neste produto é
   sempre `--accent`: laranja aqui significa "passou, mas você precisa saber
   disso", e gastá-lo em "ainda vou conferir" mataria esse papel (§5.2).

   Cor de status entra como TEXTO pelos tokens `-txt` e como fundo pelos `-soft`,
   a mesma regra do resto desta página — o token de preenchimento reprova AA em
   12px, e isso está medido no `CLAUDE.md`. O glifo é a exceção deliberada: ele é
   FORMA, não texto corrido, então fica com a cor cheia. */
.bat { margin: 0 0 11px; }
.bat-hd { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 7px; }
.bat-hd .ix { font-family: var(--font-num); font-size: 10px; letter-spacing: .16em; color: var(--brand-txt); }
.bat-hd .sub { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); }
.bat ol { list-style: none; margin: 0; padding: 0; }
.bat li { display: flex; gap: 8px; align-items: baseline; padding: 6px 9px; border-radius: 8px;
          border: 1px solid transparent; font-size: 12px; line-height: 1.5; }
.bat li + li { margin-top: 3px; }
.bat .n  { flex: 0 0 auto; width: 20px; font-family: var(--font-num); font-size: 10px; color: var(--txt-faint); }
.bat .gl { flex: 0 0 auto; width: 13px; text-align: center; font-size: 12px; }
.bat .cp { flex: 1 1 200px; }
.bat .nm { font-weight: 600; color: var(--txt); }
.bat .fr { color: var(--txt-dim); }
.bat .rot { flex: 0 0 auto; font-family: var(--font-num); font-size: 9.5px; letter-spacing: .09em; }
/* O detalhe é lista, não `title`: motivo escondido atrás de hover não existe para
   quem está decidindo, nem para quem usa leitor de tela. */
.bat ul { margin: 4px 0 0; padding-left: 15px; color: var(--txt-faint); font-size: 11.5px; }
.bat ul li { display: list-item; padding: 0; border: none; margin: 1px 0; animation: none; }

.bat li.ok     { background: var(--ok-soft);     border-color: color-mix(in srgb, var(--ok) 26%, transparent); }
.bat li.ok   .gl { color: var(--ok); }
.bat li.ok   .rot { color: var(--ok-txt); }
.bat li.warn   { background: var(--warn-soft);   border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.bat li.warn .gl { color: var(--warn); }
.bat li.warn .rot { color: var(--warn-txt); }
.bat li.risk   { background: var(--risk-soft);   border-color: color-mix(in srgb, var(--risk) 42%, transparent); }
.bat li.risk .gl { color: var(--risk); }
.bat li.risk .rot { color: var(--risk-txt); }
.bat li.accent { background: var(--accent-soft); border-color: var(--accent-line); }
.bat li.accent .gl { color: var(--accent); }
.bat li.accent .rot { color: var(--accent-txt); }
.bat li.cold   { background: var(--surface); border-color: var(--line-soft); }
.bat li.cold .gl { color: var(--cold); }
.bat li.cold .rot { color: var(--cold-txt); }
.bat li.cold .nm { color: var(--txt-dim); }

/* Acendem uma a uma. É a única animação desta banda, e ela tem informação nova
   atrás: a ordem em que as checagens ficam prontas. `.jafoi` desliga tudo quando a
   assinatura não mudou — o SSE repinta esta coluna várias vezes por segundo, e
   reanimar a cada evento seria movimento sem informação, que depois de dois dias
   é pior que nenhum. */
.bat li { animation: batacende .3s ease-out both; animation-delay: calc(var(--i, 0) * 85ms); }
@keyframes batacende { from { opacity: 0; transform: translateX(-7px); } }
.bat.jafoi li { animation: none; }

/* ══════════════════════ O OVERLAY DA VERIFICAÇÃO ═════════════════════════════
 *
 * A tela do MOMENTO em que a bateria roda. Mesma anatomia do `.hoff` do
 * `flows.html` — é o desenho que ele reconheceu ("quando mando um erro pro
 * Claude, abre uma tela e começa a mostrar as coisas") — e o mesmo vocabulário de
 * véu: `--bg-deep` a 72% com `blur(9px)`. Um segundo jeito de escurecer a página
 * seria um segundo jeito de dizer "isto está na frente", e esta casa já tem um.
 *
 * `z-index: 40` fica ABAIXO do `.scrim` (50) do `confirmar()`: o diálogo que
 * pergunta "escrever em «X»?" nasce de um botão daqui e precisa vir por cima.
 *
 * Ele NÃO substitui a revisão da coluna. Aqui se assiste; lá se relê o diff com
 * calma, com os `<details>` que abrem e fecham. Por isso o diff daqui é compacto e
 * sem `.dnode`: dois `data-no` iguais no documento confundiriam o
 * `capturarInputs`, que varre o documento inteiro. */
.ver-scrim { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter: blur(9px) saturate(1.1); animation: verin .28s ease-out both; }
@keyframes verin { from { opacity: 0; } }
.ver { position: relative; width: min(980px, 100%); max-height: min(88vh, 800px);
  display: grid; grid-template-rows: auto minmax(0,1fr) auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow), 0 40px 90px -40px rgba(10,10,20,.5); overflow: hidden; }

.ver-hd { display: flex; align-items: center; gap: 11px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
.ver-hd .ix { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .14em; color: var(--accent-txt); }
.ver-hd .wf { font-family: var(--font-num); font-size: 12.5px; font-weight: 600; color: var(--txt);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ver-hd .cont { font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); flex: 0 0 auto; }
.ver-hd .sp { flex: 1 1 auto; }

.ver-body { display: grid; grid-template-columns: 352px minmax(0,1fr); min-height: 0; }

/* A rolagem e da LISTA, nao da coluna: a barra de progresso e a frase do rodape
   ficam presas embaixo, e so as etapas rolam. `min-height:0` e o que permite o
   filho flex encolher — sem ele a lista estoura a caixa e as ultimas etapas
   somem sem barra de rolagem nenhuma. Medido: 6 e 7 nao apareciam. */
.ver-steps { border-right: 1px solid var(--line); padding: 14px 12px; min-height: 0;
  background: var(--surface-2); display: flex; flex-direction: column; }
.ver-steps ol { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
/* TRES colunas, e a do meio e a unica que cresce. O rotulo (PASSOU / NAO CONFERI)
   fica a direita do nome em vez de numa linha propria: com nove etapas isso era
   uma linha a mais em cada uma, e a nona saia da caixa. Medido num navegador —
   8 de 9 visiveis. */
.ver-step { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 9px; align-items: start;
  padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; }
.ver-step + .ver-step { margin-top: 2px; }
.ver-step .gl { font-family: var(--font-num); font-size: 11.5px; line-height: 1.45; text-align: center; }
/* `display:block` nos dois: eles vivem dentro de um `<span>` (a celula da grade),
   e sem isso o nome e a frase saem colados — "Estruturaos 10 portoes passaram".
   Medido num navegador; o HTML parecia certo. */
.ver-step .nm { display: block; font-size: 12.5px; font-weight: 600; color: var(--txt); line-height: 1.35; }
.ver-step .sub { display: block; font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); margin-top: 2px; line-height: 1.4; }
.ver-step .rot { font-family: var(--font-num); font-size: 8.5px; letter-spacing: .08em; white-space: nowrap;
  align-self: center; flex: 0 0 auto; }
/* O detalhe é lista visível, nunca `title`: motivo atrás de hover não existe para
   quem está decidindo nem para quem usa leitor de tela. */
.ver-step ul { margin: 4px 0 0; padding-left: 14px; color: var(--txt-faint); font-size: 11px; line-height: 1.45; }
.ver-step ul li { margin: 1px 0; }

/* PENDENTE é o estado mais importante desta lista: é ele que faz as sete
   acenderem uma a uma em vez de aparecerem prontas. Apagado, glifo vazio, sem
   frase — porque ainda não há frase nenhuma para dizer. */
.ver-step.aguarda { opacity: .42; }
.ver-step.aguarda .nm { font-weight: 500; color: var(--txt-dim); }
.ver-step.aguarda .gl { color: var(--txt-faint); }

/* CONFERINDO é `--accent`, nunca `--warn`. Laranja nesta casa significa "passou,
   mas você precisa saber disso" e carrega a informação que decide o clique;
   gastá-lo em "ainda estou conferindo" mataria o papel dele. */
.ver-step.correndo { background: var(--accent-soft); border-color: var(--accent-line); }
.ver-step.correndo .gl { color: var(--accent); }
.ver-step.correndo .nm { color: var(--accent-txt); }
.ver-step.correndo .rot { color: var(--accent-txt); }

.ver-step.ok     { background: var(--ok-soft);   border-color: color-mix(in srgb, var(--ok) 24%, transparent); }
.ver-step.ok   .gl { color: var(--ok); }   .ver-step.ok   .rot { color: var(--ok-txt); }
.ver-step.warn   { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.ver-step.warn .gl { color: var(--warn); } .ver-step.warn .rot { color: var(--warn-txt); }
.ver-step.risk   { background: var(--risk-soft); border-color: color-mix(in srgb, var(--risk) 42%, transparent); }
.ver-step.risk .gl { color: var(--risk); } .ver-step.risk .rot { color: var(--risk-txt); }
.ver-step.cold   { background: var(--surface); border-color: var(--line-soft); }
.ver-step.cold .gl { color: var(--cold); } .ver-step.cold .rot { color: var(--cold-txt); }
.ver-step.cold .nm { color: var(--txt-dim); }

.ver-steps .barra { height: 3px; border-radius: 2px; background: var(--surface-2);
  border: 1px solid var(--line-soft); overflow: hidden; margin-top: 12px; }
/* `scaleX` com origem a esquerda desenha a mesma barra sem reflow — largura
   animada e propriedade de layout, e esta casa so gasta isso quando o desenho
   depende dela. Aqui nao depende. */
.ver-steps .barra i { display: block; height: 100%; width: 100%; background: var(--accent);
  transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform .4s ease-out; }
.ver-steps .nada { font-family: var(--font-num); font-size: 10px; color: var(--txt-faint); margin-top: 7px; }

.ver-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 15px 18px; overflow-y: auto; }
.ver-main .ix { font-family: var(--font-num); font-size: 10px; letter-spacing: .16em; color: var(--brand-txt); }
.ver-main .resumo { font-size: 13px; line-height: 1.55; color: var(--txt); }
.ver-main .esperando { font-size: 12.5px; line-height: 1.6; color: var(--txt-faint); }
.ver-dif { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.ver-dif .cab { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-bottom: 1px solid var(--line-soft); }
.ver-dif .cab .tag { font-family: var(--font-num); font-size: 9px; letter-spacing: .09em; padding: 2px 7px; border-radius: 5px; }
.ver-dif .cab .tag.modified { background: var(--warn-soft); color: var(--warn-txt); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.ver-dif .cab .tag.added    { background: var(--ok-soft);   color: var(--ok-txt);   border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
.ver-dif .cab .tag.removed  { background: var(--risk-soft); color: var(--risk-txt); border: 1px solid color-mix(in srgb, var(--risk) 30%, transparent); }
.ver-dif .cab .nm { font-family: var(--font-num); font-size: 12px; font-weight: 600; }
.ver-dif .corpo { font-family: var(--font-num); font-size: 11.5px; line-height: 1.75; padding: 8px 0; overflow-x: auto; }
.ver-dif .corpo .l { padding: 0 12px; white-space: pre; color: var(--txt-faint); }
.ver-dif .corpo .l.add { background: var(--ok-soft); color: var(--ok-txt); }
.ver-dif .corpo .l.del { background: var(--risk-soft); color: var(--risk-txt); }
.ver-dif .mais { padding: 5px 12px 0; font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint); opacity: .75; }

.ver-ft { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-top: 1px solid var(--line);
  background: var(--surface-2); flex-wrap: wrap; }
.ver-ft .diz { flex: 1 1 300px; min-width: 0; font-size: 12.5px; line-height: 1.45; color: var(--txt-dim); }
.ver-ft .diz b { color: var(--txt); font-weight: 650; }
/* O botão que ESCREVE em produção não é um `.btn` qualquer no fim de uma frase.
   Foi a queixa: "o aplicar estava muito escondido". */
.ver-ft .btn.prime { font-size: 13px; padding: 10px 20px; }

/* Acendem uma a uma — a única animação daqui, e ela tem informação nova atrás: a
   ordem em que as checagens ficam prontas. `.jafoi` desliga tudo quando a
   assinatura não mudou, porque o SSE repinta várias vezes por segundo. */
.ver-step { animation: veracende .3s ease-out both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes veracende { from { opacity: 0; transform: translateX(-7px); } }
.ver-steps.jafoi .ver-step { animation: none; }
.ver-steps.jafoi .ver-step.aguarda { opacity: .42; }
