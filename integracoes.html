  "O cofre protege a chave em <b>texto puro num arquivo que viaja</b>: pasta zipada, " +
  "backup na nuvem, commit por engano. Ele <b>não</b> protege contra um programa " +
  "rodando nesta mesma conta do Windows — a chave precisa estar decifrável para o " +
  "painel usar, e nada guardado nesta máquina mudaria isso.";

/* ═══════════════════════════════════════════════════════ PAREAMENTO (fatia 3)
   ─────────────────────────────────────────────────────────────────────────────
   `pareamento.js` emite fato (`estado`, `origens`, `origensInvalidas`,
   `idConfere`, `temChave`, `guardaAceita`); esta página decide o nome do estado,
   a frase, e — a parte que mais importa — QUAL CONTROLE cada estado oferece.

   O QUE ESTA CERIMÔNIA DECIDE: qual site hospedado pode mandar este agente
   ESCREVER num fluxo de produção do n8n e disparar `retry`, que manda mensagem
   real para um lead e não tem desfazer. É a coisa de maior consequência que esta
   tela toca, e por isso ela não tem um estado só de "ligado/desligado".

   A DIREÇÃO DO FLUXO É CONTRAINTUITIVA, E FOI MEDIDA CONTRA O `guarda.decidir`,
   não escolhida: uma origem ainda não pareada classifica como `estranha` e toma
   403 em toda requisição mutante. Então o desenho óbvio — "o site mostra o
   código, o painel confirma" — é impossível: o site não alcança rota nenhuma
   daqui. Quem conduz é este painel local.

   E O CÓDIGO NÃO VOLTA EM RESPOSTA NENHUMA. Se `iniciar` devolvesse o código,
   quem pediu a cerimônia já o saberia e chamaria `confirmar` na linha seguinte —
   a confirmação humana viraria enfeite, porque ela é a única camada que separa
   "a pessoa quis" de "algo na máquina dela quis". Esta tela portanto NÃO tenta
   mostrar o código: ela mostra ONDE procurá-lo. Sem essa frase em destaque a
   pessoa procura o código na tela, não acha, e conclui que quebrou. */

/* Os quatro passos, e o 3 é o que carrega a seção inteira. `PASSOS` é lista
   ordenada e não um mapa por nome porque a ordem é o conteúdo. */
const PASSOS = [
  { n: "passo 1", txt: "No site, copie o pacote: a conta, a origem, o emissor e o JWKS." },
  { n: "passo 2", txt: "Cole o pacote aqui neste painel e comece a cerimônia." },
  { n: "passo 3", txt: "O agente imprime o código NO CONSOLE DELE — a janela preta que ficou aberta." },
  { n: "passo 4", txt: "Digite esse código aqui. Só então alguma coisa é gravada." }
];

/* Em que passo a pessoa está. Puro, e devolve NÚMERO — 5 significa "acabou".
   `pareado` sem cerimônia é 5; cerimônia aberta é 4 (o código já foi impresso);
   sem cerimônia e sem pareamento é 2 (o passo 1 acontece no site, fora daqui). */
function passoAtual(par, cerim) {
  if (cerim && cerim.desafio) return 4;
  if (par && par.estado === "pareado") return 5;
  return 2;
}

/* ---------------------------------------------------- a variante do estado

   A ORDEM DOS TESTES É A REGRA, não preferência de leitura:

   1. bloco/campo AUSENTE → `ausente`. É a nona vez que este arquivo escreve a
      frase, e aqui o galho negativo é o pior possível: cair em `nao-pareado`
      faria a tela dizer "nenhum site manda neste agente" por causa de um
      processo Node velho, com um pareamento vivo no disco.
   2. `ilegivel` ANTES de qualquer coisa sobre conteúdo: existe arquivo e não deu
      para ler, então nada do que viria depois foi medido.
   3. `nao-pareado`.
   4. estado que esta tela NÃO CONHECE → `desconhecido`, nunca o ramo bom. Uma
      quarta palavra que signifique algo pior que `ilegivel` não pode liberar
      nada só por não estar na lista.
   5. dentro de `pareado`, do mais grave para o menos: o guarda ignorar o arquivo
      (é meio-pareamento e não pareamento), faltar a chave, a identidade não
      bater, a identidade não ser conferível, haver origem descartada. */
function variantePar(d) {
  if (!d || typeof d !== "object" || typeof d.estado !== "string") return "ausente";
  if (d.estado === "ilegivel") return "ilegivel";
  if (d.estado === "nao-pareado") return "naoPareado";
  if (d.estado !== "pareado") return "desconhecido";
  if (d.guardaAceita !== true) return "meioPareamento";
  if (d.temChave !== true) return "semChave";
  if (d.idConfere === false) return "idNaoBate";
  if (d.idConfere !== true) return "idNaoConferivel";
  if (Array.isArray(d.origensInvalidas) && d.origensInvalidas.length) return "origensDescartadas";
  return "pareado";
}

/* NENHUMA destas frases pode ler como outra. `nao-pareado` e `ilegivel` são o par
   perigoso — as duas são "não está funcionando", e mandam para lugares opostos:
   uma manda parear, a outra manda desparear ANTES de parear, porque parear por
   cima esconde um arquivo que ela nem sabe que está lá. Uma frase só para as duas
   ensina a ignorar as duas, que é a lição que a faixa do dossiê pagou. */
const PAR_FRASE = {
  ausente: () =>
    "<b>O cockpit que está rodando não respondeu qual é o estado do pareamento</b> — o campo não veio. " +
    "O Node não relê o <code>server.js</code>: <b>feche a janela do cockpit e abra de novo</b>. " +
    "Enquanto isso esta seção <b>não afirma que existe pareamento nem que não existe</b>, e não oferece controle nenhum.",
  ilegivel: d =>
    "<b>Existe um arquivo de pareamento aqui e eu não consegui ler</b>: " +
    (d && d.porque ? "<b class=\"sens\">" + esc(d.porque) + "</b>" : "o agente não disse o motivo") + ". " +
    "<b>Isto não é «nunca pareado»</b> — tem coisa no disco. Parear por cima esconderia esse arquivo, " +
    "então a saída é <b>desparear e refazer</b>.",
  naoPareado: () =>
    "<b>Este agente não está ligado a nenhuma conta.</b> Nada quebrou e nada está faltando para o uso local: " +
    "<b>o painel nesta máquina funciona igual</b>. O que não existe é permissão para site nenhum — " +
    "<b>o guarda recusa toda origem que não esteja na lista</b>, e hoje a lista não existe.",
  desconhecido: d =>
    "O agente respondeu um estado que <b>esta tela não sabe ler</b> (<code>" + esc(d && d.estado) + "</code>). " +
    "<b>Não traduzo o que não conheço</b>, então esta seção não oferece controle: um quarto estado que " +
    "signifique algo pior que «ilegível» não pode liberar nada só por não estar na minha lista.",
  meioPareamento: () =>
    "<b>Meio-pareamento: o arquivo existe e o guarda o ignora.</b> Na prática nenhum site manda neste agente — " +
    "e a tela <b>não pode mostrar isto como conectado</b>, que é exatamente o erro que este estado existe para não " +
    "cometer. Não há o que consertar dentro do arquivo: <b>despareie e refaça</b>.",
  semChave: () =>
    "<b>Pareado sem identidade.</b> O <code>pareamento.json</code> está no disco e <b>a chave privada do agente não está</b>. " +
    "Sem ela este agente não assina nada, então o pareamento não termina de valer. <b>Despareie e refaça</b> — " +
    "a chave é gerada pela cerimônia e não dá para recriá-la por fora.",
  idNaoBate: () => idConfereFrase({ idConfere: false }),
  idNaoConferivel: () => idConfereFrase({ idConfere: null }),
  origensDescartadas: d =>
    "<b>Pareado, e parte da lista de origens não vale.</b> " + origensDescartadasFrase(d) +
    " O resto do pareamento está de pé: as origens válidas continuam valendo.",
  pareado: () =>
    "<b>Pareado.</b> As origens abaixo — <b>e só elas</b> — podem mandar este agente escrever num fluxo de produção " +
    "e disparar <code>retry</code>. Confira a conta e cada origem, uma a uma: é esta lista que o guarda consulta."
};

/* TRÊS saídas, e a do meio é a que não pode existir. `false` é ACUSAÇÃO — o
   `agenteId` gravado não é o que sai da pública gravada, então alguém editou o
   arquivo à mão. `null` é AUSÊNCIA DE MATERIAL — não há pública no arquivo, então
   não há com o que comparar, e dizer "não bate" ali seria acusar por um campo que
   nunca existiu, que é o defeito do `docAgentes`. `true` é a conferência feita. */
function idConfereFrase(d) {
  const v = d ? d.idConfere : undefined;
  if (v === true) {
    return "<b>A identidade bate.</b> O <code>agenteId</code> do arquivo é o que sai da chave pública gravada nele — " +
      "conferido agora, não presumido.";
  }
  if (v === false) {
    return "<b>A identidade não bate com a chave gravada.</b> Isto é acusação e não dúvida: o <code>agenteId</code> " +
      "do arquivo <b>não é</b> o que sai da pública que está nele. Alguém editou o arquivo à mão, ou ele foi montado por " +
      "outra coisa. <b>Despareie e refaça</b> — não é para consertar por dentro.";
  }
  return "<b>Não dá para conferir a identidade: este arquivo não tem a chave pública gravada.</b> " +
    "Isto <b>não</b> quer dizer que ela não bate — quer dizer que <b>não há com o que comparar</b>. " +
    "As duas frases mandam para lugares diferentes, e esta é a que não acusa ninguém.";
}

/* Nomeia QUAIS, nunca quantas. O guarda descarta cada uma pelo próprio filtro, e
   uma contagem sem os nomes deixaria a pessoa sem saber qual tirar. */
function origensDescartadasFrase(d) {
  const inv = d && Array.isArray(d.origensInvalidas) ? d.origensInvalidas : [];
  if (!inv.length) return "";
  return "<b>" + inv.length + (inv.length === 1 ? " origem gravada não tem forma de origem" : " origens gravadas não têm forma de origem") +
    "</b>, e <b>o guarda descarta cada uma delas</b>: " +
    inv.map(o => "<code>" + esc(o) + "</code>").join(", ") + ". Elas estão no arquivo e não valem nada.";
}

/* Qual controle cada variante oferece. É juízo e não desenho: `ilegivel` NÃO pode
   oferecer só «Parear», porque parear por cima do arquivo ilegível é justamente o
   que esconde o problema. E as variantes que não sabem de nada (`ausente`,
   `desconhecido`) não oferecem NADA — um botão que age sobre um estado que a tela
   não leu é a pior linha disponível aqui. */
const PAR_CONTROLE = {
  ausente:            { parear: false, desparear: false, refazer: false },
  desconhecido:       { parear: false, desparear: false, refazer: false },
  ilegivel:           { parear: false, desparear: false, refazer: true },
  naoPareado:         { parear: true,  desparear: false, refazer: false },
  meioPareamento:     { parear: false, desparear: false, refazer: true },
  semChave:           { parear: false, desparear: false, refazer: true },
  idNaoBate:          { parear: false, desparear: false, refazer: true },
  idNaoConferivel:    { parear: false, desparear: true,  refazer: false },
  origensDescartadas: { parear: false, desparear: true,  refazer: false },
  pareado:            { parear: false, desparear: true,  refazer: false }
};

/* A etiqueta, e a classe de cor dela. `ausente` e `desconhecido` são FRIOS e não
   vermelhos: não sei não é quebrou. `ilegivel`, `meioPareamento`, `semChave` e
   `idNaoBate` são `risk` porque cada um é um arquivo no disco que não está
   fazendo o que parece fazer. `origensDescartadas` é `warn`: o pareamento vale,
   parte da lista não. */
const PAR_TAG = {
  ausente:            { txt: "AINDA NÃO SEI",        cls: "cold", bl: "voo",  gl: "voo",   glifo: "anel" },
  desconhecido:       { txt: "ESTADO DESCONHECIDO",  cls: "cold", bl: "voo",  gl: "voo",   glifo: "anel" },
  ilegivel:           { txt: "ARQUIVO ILEGÍVEL",     cls: "risk", bl: "mau",  gl: "risco", glifo: "aviso" },
  naoPareado:         { txt: "NÃO PAREADO",          cls: "cold", bl: "frio", gl: "frio",  glifo: "cruz" },
  meioPareamento:     { txt: "MEIO-PAREAMENTO",      cls: "risk", bl: "mau",  gl: "risco", glifo: "aviso" },
  semChave:           { txt: "SEM IDENTIDADE",       cls: "risk", bl: "mau",  gl: "risco", glifo: "aviso" },
  idNaoBate:          { txt: "IDENTIDADE NÃO BATE",  cls: "risk", bl: "mau",  gl: "risco", glifo: "aviso" },
  idNaoConferivel:    { txt: "SEM COMO CONFERIR",    cls: "warn", bl: "",     gl: "frio",  glifo: "anel" },
  origensDescartadas: { txt: "ORIGENS DESCARTADAS",  cls: "warn", bl: "",     gl: "frio",  glifo: "aviso" },
  pareado:            { txt: "PAREADO",              cls: "ok",   bl: "",     gl: "bom",   glifo: "check" }
};

/* A frase que o `desparear` obriga a repetir, e ela vem do próprio módulo quando
   ele responde. Aqui é o texto de ANTES do clique — reescrever o `naoRevoga` do
   módulo seria uma segunda definição do mesmo fato. */
const NAO_REVOGA = "Desparear tira o poder do site sobre <b>este agente</b>. <b>Não invalida nenhuma sessão do lado do site</b> — " +
  "é a mesma diferença de trocar a chave no cofre e não revogar a antiga no n8n.";

/* ------------------------------------------------ achei a máquina? (o interativo)
   O Kauan pediu "algo interativo para confirmar que a máquina foi encontrada".
   O que se move aqui é ESTADO, nunca enfeite, e a frase tem que resistir a uma
   objeção óbvia: esta página É servida pelo agente, então "achar" seria trivial.
   O que a rota prova de verdade é outra coisa — que o agente que serve esta
   página é o mesmo que responde pelo pareamento, e que ele leu o próprio disco.
   É isso que a frase diz, e nada além. */
const BUSCA = {
  procurando: "<b>Falando com o agente desta máquina…</b> Ele serve esta página, então achá-lo não é a pergunta: " +
    "a pergunta é se ele consegue ler o próprio arquivo de pareamento — e é isso que está em voo.",
  achei: "<b>O agente respondeu.</b> É ele que serve esta página e é ele que o site vai mandar: o estado abaixo saiu " +
    "do disco dele agora.",
  falhou: "<b>O agente serve esta página e não respondeu sobre o pareamento.</b> Isto é defeito do cockpit, " +
    "não da sua configuração — e por isso <b>nenhuma frase abaixo diz que você não está pareado</b>."
};

function buscaFase(s) {
  if (s.parBuscando) return "procurando";
  if (s.parErro) return "falhou";
  if (s.par) return "achei";
  return "procurando";
}

/* ------------------------------------------------ a cerimônia em andamento

   `onde` é o campo que diz EM QUE JANELA o código apareceu, e ele tem os três
   estados de sempre. O ramo ausente aqui é caro: sem a frase, a pessoa procura o
   código nesta tela — onde ele nunca vai estar, por decisão de segurança — e
   conclui que a cerimônia quebrou. */
const ONDE_PADRAO = "O agente não disse em qual janela o código apareceu. Ele imprime <b>no console dele</b>: " +
  "a janela de terminal que o <code>start-cockpit.cmd</code> deixou aberta.";

function ondeFrase(c) {
  const onde = c && typeof c.onde === "string" && c.onde.trim() ? c.onde.trim() : null;
  const base = "<b>O código NÃO aparece nesta tela, e isso é de propósito</b> — se ele voltasse na resposta, " +
    "quem pediu a cerimônia poderia fechá-la sozinho e a sua confirmação viraria enfeite. ";
  if (!onde) return base + ONDE_PADRAO;
  return base + "<b>" + esc(onde) + "</b>";
}

/* "Você colou X, vou parear Y". Sem isto ela pareia uma origem diferente da que
   acha que colou — e o sintoma seria "pareei e o site continua dando 403", que
   aponta para lugar nenhum. Item a item, nomeando os dois lados. */
function normalizacoesFrase(c) {
  const ns = c && Array.isArray(c.normalizacoes) ? c.normalizacoes : [];
  if (!ns.length) return null;
  return "<b>O que você colou não é byte a byte o que vai ser pareado</b> — o agente normalizou " +
    (ns.length === 1 ? "um campo" : ns.length + " campos") + ", e é a forma normalizada que o guarda vai comparar: " +
    ns.map(n => "<code>" + esc(n.campo) + "</code>: <code>" + esc(n.de) + "</code> → <code>" + esc(n.para) + "</code>").join(" · ") + ".";
}

/* Quanto falta. Puro, e o `null` tem frase própria: sem `expiraEm` a tela não
   sabe o prazo, e um "0 s" ali leria como vencido. */
function restaFrase(expiraEm, agora) {
  if (typeof expiraEm !== "number" || !isFinite(expiraEm)) {
    return { venceu: false, txt: "sem prazo declarado" };
  }
  const ms = expiraEm - agora;
  if (ms <= 0) return { venceu: true, txt: "o código venceu" };
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  return { venceu: false, txt: "vale por mais " + (m ? m + " min " + String(s % 60).padStart(2, "0") + " s" : s + " s") };
}

/* 400 e 410 são DUAS HISTÓRIAS e a tela não pode obrigar ninguém a ler a frase
   para saber qual é: 400 é "erre outra vez", 410 é "acabou, comece de novo".
   O status AUSENTE é o terceiro estado e não cai em nenhum dos dois. */
function confirmarFalha(status, corpo) {
  const motivo = corpo && typeof corpo.motivo === "string" ? corpo.motivo : null;
  const restam = corpo && typeof corpo.tentativasRestantes === "number" ? corpo.tentativasRestantes : null;
  if (status === 410) {
    return { fim: true, frase: "<b>A cerimônia acabou e nada foi pareado.</b> Não dá para tentar de novo nesta — " +
      "comece o pareamento outra vez, e o agente imprime um código novo. " + (motivo ? "O agente disse: <b>" + esc(motivo) + "</b>" : "") };
  }
  if (status === 400) {
    return { fim: false, frase: "<b>O código não foi aceito, e a cerimônia continua aberta.</b> " +
      (motivo ? esc(motivo) + " " : "") +
      (restam !== null ? "Restam <b>" + restam + (restam === 1 ? " tentativa" : " tentativas") + "</b>." :
        "<b>Quantas tentativas restam, não sei</b>: o campo não veio nesta resposta.") };
  }
  return { fim: false, frase: "<b>Não sei se ainda dá para tentar.</b> O agente respondeu de um jeito que esta tela não " +
    "classifica" + (typeof status === "number" ? " (HTTP " + status + ")" : " e sem status") + ", então ela não diz nem " +
    "«erre de novo» nem «acabou». " + (motivo ? "O que veio foi: <b>" + esc(motivo) + "</b>" : "") };
}

/* ═════════════════════════════════════════════ A IA DA RODADA (fatia 3)
   ─────────────────────────────────────────────────────────────────────────────
   Dois eixos, e eles são independentes: QUAL CLI, e DE QUEM É A CONTA QUE PAGA.

   DE ONDE VÊM ESTES FATOS. A rota passou a emitir o bloco `ia`
   (`ia.capacidades()`), e a chegada dela criou — por uma fatia — o pior defeito
   que esta tela pode ter: `iaFonte` começou a dizer "isto veio do servidor"
   enquanto `iaHtml` continuava desenhando a lista transcrita aqui. **A tela
   afirmava uma origem e desenhava outra**, num cartão que responde quem paga a
   conta de alguém. Antes disso a cópia existia e a tela DIZIA que era cópia, o
   que era honesto; o meio-termo era pior que os dois.

   A REGRA QUE FECHA ISSO, e é uma regra e não um cuidado: **«diz servidor» e
   «desenha servidor» são a mesma condição, lida de um lugar só.** `iaFonte()`
   devolve o veredito INTEIRO — a frase E as listas a desenhar. `iaHtml` não
   escolhe fonte: ele desenha o que o veredito entregou. Duas decisões separadas
   divergiriam na primeira correção feita num lado só, e o lado que divergisse
   seria o que mente sobre a procedência.

   O QUE O SERVIDOR MANDA É FATO, E A PROSA CONTINUA SENDO DAQUI. `capacidades()`
   devolve `rotulo`, `utilizavel` e `cercasQueFaltam` — e **não** devolve o motivo
   medido da recusa do Codex, que é o que impede a leitura "o cockpit não suporta
   Codex". Então o veredito casa o fato do servidor com a prosa desta tela
   (`IA_SABIDO`), e — a parte que não pode ser esquecida — **quando os dois
   discordam, quem manda é o servidor** e a tela diz que a prosa daqui ficou
   velha. Prosa medida que sobrevive ao fato que a contradiz é a mentira mais
   cara disponível aqui. */

const IA_PROVEDOR = [
  {
    id: "claude",
    rotulo: "Claude Code CLI",
    aceito: true,
    resumo: "<b>É a CLI que o cockpit usa hoje.</b> A correção de uma falha, o dossiê de um fluxo, a conversa do " +
      "upgrade e as rodadas do Tester saem dela — sempre local, headless, sem rede e sem shell.",
    porque: "<b>As três cercas existem neste CLI</b>: <code>--disallowedTools</code> fecha família de ferramenta, " +
      "<code>--setting-sources \"\"</code> derruba a configuração global de quem instalou o painel, e " +
      "<code>--strict-mcp-config</code> com <code>{\"mcpServers\":{}}</code> impede carregar servidor de MCP. " +
      "É por ter as três que ele é o único aceitável."
  },
  {
    id: "codex",
    rotulo: "Codex CLI",
    aceito: false,
    resumo: "<b>Existe, está instalado nesta máquina, e o cockpit recusa rodar com ele.</b> " +
      "A recusa é por <b>ausência medida de flag</b>, não por o CLI não existir — e é por isso que ele aparece " +
      "aqui em vez de sumir da lista.",
    porque: "<b>Ele não tem equivalente de <code>--setting-sources \"\"</code></b>, então " +
      "<code>~/.codex/config.toml</code> e <code>~/.codex/AGENTS.md</code> <b>carregam sempre</b>. " +
      "Medido nesta máquina: esse <code>config.toml</code> tem uma linha que <b>casa com a varredura de segredo " +
      "deste repositório</b> — uma chave de API em texto puro. É a mesma forma de defeito que a flag do Claude foi " +
      "medida para fechar, e aqui não existe flag para fechar."
  }
];

/* Uma opção ausente e sem explicação vira "o cockpit não suporta"; uma opção
   VISÍVEL E RECUSADA COM O MOTIVO é informação. Este mapa é o que garante que o
   `codex` nunca seja escondido — a tela desenha os dois e desabilita um. */
/* A LISTA VEM POR PARÂMETRO, e o padrão é a cópia local. Sem isso, esta função
   seria um segundo lugar decidindo a fonte — exatamente o que o veredito único
   existe para não permitir. Quem chama de dentro do desenho passa a lista que o
   veredito entregou; quem chama de fora (um teste sobre a transcrição) recebe a
   cópia por omissão. */
function provedorPorId(id, lista) {
  return (lista || IA_PROVEDOR).find(p => p.id === id) || null;
}

/* A prosa medida DESTA TELA, por provedor. Ela é casada com o fato do servidor
   em `provedorDoServidor` e só é usada quando o veredito de utilizável BATE — o
   `aceito` aqui não é uma decisão paralela, é a condição sob a qual a prosa
   continua verdadeira. */
const IA_SABIDO = {};
for (const p of IA_PROVEDOR) IA_SABIDO[p.id] = p;

/* O que cada cerca faz, em português. É o que deixa um provedor que esta tela
   nunca viu sair com um motivo de verdade em vez de "não suportado" — o servidor
   manda os NOMES das cercas que faltam, e a tradução é juízo, daqui. */
const CERCA_FRASE = {
  negadas: "fechar família de ferramenta (<code>--disallowedTools</code>)",
  settings: "derrubar a configuração global de quem instalou o painel (<code>--setting-sources \"\"</code>)",
  mcp: "impedir o carregamento de servidor de MCP (<code>--strict-mcp-config</code>)"
};

function cercasEmPortugues(faltam) {
  const ns = (Array.isArray(faltam) ? faltam : []).map(n => CERCA_FRASE[n] || "<code>" + esc(n) + "</code>");
  if (!ns.length) return null;
  if (ns.length === 1) return ns[0];
  return ns.slice(0, -1).join(", ") + " nem para " + ns[ns.length - 1];
}

/* Um provedor desenhado A PARTIR DO SERVIDOR. `aceito` sai SEMPRE do
   `utilizavel` que veio — nunca da cópia — porque no dia em que uma flag nova
   aparecer no Codex, a prosa daqui viraria uma recusa que o cockpit já não faz.
   A prosa medida entra por cima só enquanto ela concorda com esse fato. */
function provedorDoServidor(id, p) {
  const aceito = p.utilizavel === true;
  const rotulo = typeof p.rotulo === "string" && p.rotulo.trim() ? p.rotulo.trim() : id;
  const sab = Object.prototype.hasOwnProperty.call(IA_SABIDO, id) ? IA_SABIDO[id] : null;
  if (sab && sab.aceito === aceito) {
    return { id, rotulo, aceito, resumo: sab.resumo, porque: sab.porque, doServidor: true };
  }
  const cercas = cercasEmPortugues(p.cercasQueFaltam);
  const resumo = aceito
    ? "<b>O cockpit diz que este CLI é utilizável</b>: as cercas obrigatórias existem nele."
    : "<b>O cockpit recusa rodar com este CLI.</b> A recusa é por <b>ausência de flag</b>, não por o CLI não existir.";
  let porque = aceito
    ? "<b>Nenhuma cerca falta</b> segundo o cockpit — foi ele que respondeu isto agora, não uma lista escrita nesta página."
    : (cercas
      ? "<b>Falta equivalente para " + cercas + ".</b> Sem essas flags a sessão roda sem cerca, então ela não roda."
      : "<b>O cockpit não disse quais cercas faltam</b>, só que não dá para usar — e eu não invento a explicação.");
  if (sab) {
    /* A prosa medida aqui CONTRADIZ o que o cockpit acabou de responder. O fato
       vence, e a divergência é dita: silenciar seria manter na tela uma medição
       que o processo já desmentiu. */
    porque += " <b>A explicação medida que esta página guarda diz o contrário</b> " +
      "(ela tem este CLI como <b>" + (sab.aceito ? "utilizável" : "recusado") + "</b>), então ela está velha — " +
      "quem manda é o que o cockpit respondeu agora.";
  } else {
    porque += " <b>Esta página não tem prosa medida para este CLI</b>: o que está acima foi derivado do que o " +
      "cockpit respondeu, e nada além disso.";
  }
  return { id, rotulo, aceito, resumo, porque, doServidor: true };
}

/* Quem paga, e essa é a diferença que decide a escolha. `plano` tem um
   PRÉ-REQUISITO que não é do painel — sem CLI instalada e logada não existe cota
   para gastar — e a linha do Claude lá em cima é quem responde se ela está. */
const IA_MODO = [
  {
    id: "plano",
    rotulo: "plano (login no CLI)",
    paga: "<b>A cota da assinatura dela.</b> A mesma cota de uma sessão interativa, e <b>nenhum cartão é cobrado</b>. " +
      "É o comportamento de hoje e é o padrão.",
    exige: "<b>Exige a CLI instalada e logada nesta máquina.</b> Sem login não existe cota para gastar, e este " +
      "painel não faz login por ninguém — quem responde se ela está logada é <b>a linha do Claude Code acima</b>, " +
      "que pergunta ao próprio CLI."
  },
  {
    id: "chave",
    rotulo: "chave de API",
    paga: "<b>O cartão dela, por token.</b> A rodada sai do crédito de API e <b>não</b> da assinatura — " +
      "são duas contas diferentes, e a diferença aparece na fatura, não aqui.",
    exige: "<b>Exige a variável <code>ANTHROPIC_API_KEY</code> no ambiente da rodada.</b> Sem ela a rodada é " +
      "recusada por nome, antes de qualquer spawn. <b>Esta tela não recebe, não guarda e não mostra chave nenhuma.</b>"
  }
];

/* Mesma regra do `provedorPorId`: a lista vem por parâmetro e a cópia é só o
   padrão. */
function modoPorId(id, lista) {
  return (lista || IA_MODO).find(m => m.id === id) || null;
}

/* A prosa dos modos, casada por id com o que o servidor mandar. O servidor manda
   `id`, `rotulo` e `usaChave`; QUEM PAGA e O QUE EXIGE continuam sendo frase
   desta tela — é a diferença que decide a escolha e ela não existe em
   `capacidades()`. Um modo que esta tela não conhece sai com a frase derivada de
   `usaChave`, que é o fato que o servidor deu, e diz que é derivada. */
const MODO_SABIDO = {};
for (const m of IA_MODO) MODO_SABIDO[m.id] = m;

function modoDoServidor(m) {
  const id = typeof m.id === "string" ? m.id : "";
  const rotulo = typeof m.rotulo === "string" && m.rotulo.trim() ? m.rotulo.trim() : id;
  const sab = Object.prototype.hasOwnProperty.call(MODO_SABIDO, id) ? MODO_SABIDO[id] : null;
  if (sab && sab.usaChave === (m.usaChave === true)) {
    return { id, rotulo, usaChave: m.usaChave === true, paga: sab.paga, exige: sab.exige, doServidor: true };
  }
  const usaChave = m.usaChave === true;
  const paga = usaChave
    ? "<b>O cockpit diz que este modo usa CHAVE DE API</b>, então o gasto sai do <b>cartão</b> e não da assinatura."
    : "<b>O cockpit diz que este modo NÃO usa chave de API</b>, então o gasto sai da <b>cota do plano</b> — nenhum cartão.";
  const exige = "<b>Esta página não tem prosa medida para este modo</b>: o que está acima foi derivado do " +
    "<code>usaChave</code> que o cockpit respondeu" +
    (sab ? ", e a explicação guardada aqui diz o contrário — ela está velha" : "") + ".";
  return { id, rotulo, usaChave, paga, exige, doServidor: true };
}

/* O padrão vale e é DITO. Um padrão silencioso é o defeito que o próprio `ia.js`
   descreve: no dia em que ele mudar, ninguém vai saber que estava valendo um. */
const IA_PADRAO = { provedor: "claude", modo: "plano" };

function escolhaFrase(provId, modoId, ehPadrao, listas) {
  const p = provedorPorId(provId, listas && listas.provedores);
  const m = modoPorId(modoId, listas && listas.modos);
  if (!p || !m) {
    return "<b>Não sei qual escolha está em vigor</b> — o que está selecionado nesta tela não é um provedor e um modo " +
      "que eu conheça, então não afirmo nada sobre quem paga.";
  }
  const marca = ehPadrao
    ? "<b>Ninguém escolheu isto: é o padrão</b>, e ele é dito em vez de assumido em silêncio. "
    : "<b>Escolhido por você nesta aba.</b> ";
  if (!p.aceito) {
    return marca + "<b>E ele não roda</b>: " + p.rotulo + " está recusado, então nesta configuração <b>nenhuma rodada " +
      "acontece</b> — a tela prefere dizer isso a deixar você descobrir no meio de uma construção.";
  }
  return marca + "<b>" + esc(p.rotulo) + "</b>, no modo <b>" + esc(m.rotulo) + "</b>. " + m.paga;
}

/* A PENDÊNCIA, dita na tela e não num comentário. Não existe rota para gravar a
   escolha — nem `ia.capacidades()` chega ao browser hoje. Prometer que gravou e
   não gravar é pior que não ter o controle, então a promessa não é feita. */
const IA_PENDENTE =
  "<b>Esta escolha ainda não é gravada em lugar nenhum.</b> Não existe rota para salvá-la — ela vale enquanto esta " +
  "aba estiver aberta e <b>some num F5</b>. E, hoje, <b>nenhuma rodada do painel lê esta escolha</b>: os quatro " +
  "lugares que abrem uma CLI continuam usando o Claude com o login desta máquina. " +
  "<b>Prometer que gravou e não gravar seria pior que não ter o controle</b>, então está escrito aqui em vez de " +
  "enterrado numa notinha.";

/* A forma que esta tela sabe ler, conferida CAMPO A CAMPO antes de desenhar.
   Devolve `null` quando está boa, ou a frase que nomeia o que está errado — e o
   que não passa cai na transcrição COM a frase, nunca em cartão vazio nem num
   `undefined` na tela. É a mesma disciplina do `callApi` recusando um corpo que
   não é objeto simples: o defeito que se lê é o que vira sentença. */
function formaIaRuim(ia) {
  if (!ia || typeof ia !== "object" || Array.isArray(ia)) return "ele não é um objeto simples";
  const ps = ia.provedores;
  if (!ps || typeof ps !== "object" || Array.isArray(ps)) return "não veio <code>provedores</code> como objeto";
  const ids = Object.keys(ps);
  if (!ids.length) return "a lista de <code>provedores</code> veio vazia";
  for (const id of ids) {
    const p = ps[id];
    if (!p || typeof p !== "object" || Array.isArray(p)) return "o provedor <code>" + esc(id) + "</code> não é um objeto";
    if (typeof p.utilizavel !== "boolean") return "o provedor <code>" + esc(id) + "</code> não diz <code>utilizavel</code>";
  }
  if (!Array.isArray(ia.modos) || !ia.modos.length) return "não veio <code>modos</code> como lista não vazia";
  for (const m of ia.modos) {
    if (!m || typeof m !== "object" || typeof m.id !== "string" || !m.id) return "um dos <code>modos</code> não tem <code>id</code>";
    if (typeof m.usaChave !== "boolean") return "o modo <code>" + esc(m.id) + "</code> não diz <code>usaChave</code>";
  }
  const pd = ia.padrao;
  if (!pd || typeof pd !== "object" || typeof pd.provedor !== "string" || typeof pd.modo !== "string") {
    return "não veio <code>padrao</code> com <code>provedor</code> e <code>modo</code>";
  }
  return null;
}

/* AS QUATRO FRASES, e nenhuma pode ler como outra. As três de transcrição
   mandam para lugares DIFERENTES, que é o que as obriga a ser distintas:

     `ausente`    → o processo é velho. A saída é fechar a janela e abrir de novo.
     `nulo`       → o processo é novo e o ADAPTADOR falhou. Reabrir não muda nada;
                    o que está quebrado é o `ia.js` deste checkout, ou a injeção.
     `malformado` → o adaptador respondeu e a forma não é a que esta tela lê.

   Tratar `null` como ausente mandaria alguém reiniciar o cockpit para sempre por
   causa de um módulo quebrado. É a mesma regra dos três estados que `idConfere` e
   `guardaAceita` já seguem, num lugar novo. */
const IA_FONTE_FRASE = {
  servidor: "<b>Estes fatos vieram do cockpit</b>, no bloco <code>ia</code> de <code>/api/integracoes</code> — " +
    "<b>e os cartões acima são desenhados a partir dele</b>: quais CLIs existem, qual é utilizável e qual é o padrão. " +
    "<b>A prosa que explica cada recusa continua sendo desta tela</b> — o módulo emite fato, quem escreve a frase é a página.",
  ausente: "<b>O cockpit que está rodando não emite as capacidades de IA</b> (não veio bloco <code>ia</code> em " +
    "<code>/api/integracoes</code>). O Node não relê o <code>server.js</code>: <b>feche a janela do cockpit e abra de " +
    "novo</b>. Enquanto isso, o que está acima é <b>transcrição feita nesta página</b> a partir do <code>ia.js</code> — " +
    "uma segunda cópia do mesmo fato, que <b>pode envelhecer sem ninguém notar</b>.",
  nulo: "<b>O cockpit emite o bloco <code>ia</code> e ele veio vazio</b> (<code>null</code>): a colheita chegou e " +
    "<b>o adaptador de IA falhou ou não está lá</b>. <b>Isto não é «o cockpit é velho»</b> — reabrir a janela não muda " +
    "nada, este processo já é novo; o que está quebrado é o <code>ia.js</code> deste checkout ou a injeção dele. " +
    "O que está acima é a <b>transcrição desta página</b>, e ela pode estar velha.",
  malformado: "<b>O bloco <code>ia</code> veio e não tem a forma que esta tela sabe ler</b>: MOTIVO. " +
    "<b>Prefiro desenhar a transcrição desta página a desenhar cartão vazio</b> — e ela pode estar velha."
};

/* ═══ O VEREDITO ÚNICO. Ele devolve A FRASE E AS LISTAS juntas, e é por isso que
   «diz servidor» e «desenha servidor» não podem divergir: são o mesmo `return`.
   `iaHtml` não escolhe fonte nenhuma — ele desenha o que sai daqui. */
function iaFonte(f) {
  const copia = (motivo, frase) => ({
    doServidor: false, motivo,
    frase: frase || IA_FONTE_FRASE[motivo],
    provedores: IA_PROVEDOR, modos: IA_MODO, padrao: IA_PADRAO
  });

  if (!f || typeof f !== "object" || !("ia" in f)) return copia("ausente");
  const ia = f.ia;
  if (ia === null || ia === undefined) return copia("nulo");
  const ruim = formaIaRuim(ia);
  if (ruim) return copia("malformado", IA_FONTE_FRASE.malformado.replace("MOTIVO", ruim));

  const provedores = Object.keys(ia.provedores).map(id => provedorDoServidor(id, ia.provedores[id]));
  const modos = ia.modos.map(modoDoServidor);
  return {
    doServidor: true, motivo: "servidor", frase: IA_FONTE_FRASE.servidor,
    provedores, modos, padrao: { provedor: ia.padrao.provedor, modo: ia.padrao.modo }
  };
}

/* ------------------------------------------------ o pacote colado do site

   Isto é juízo e não desenho: decide o que um texto colado SIGNIFICA, e a frase
   de recusa é o que a pessoa vai ler. Ele confere FORMA e nada mais — quem diz
   se uma origem é aceitável é o `pareamento.js`, do outro lado, com o `URL` do
   Node e a normalização de verdade. Uma segunda validação aqui divergiria da de
   lá na primeira correção feita num lado só, e a que divergisse seria a que
   recusa antes de o servidor ter chance de falar.

   `origens` no plural E `origem` no singular são aceitos porque a rota aceita os
   dois. Recusar o singular seria esta tela sendo mais estrita que o servidor,
   por conta própria. */
const PACOTE_EXEMPLO =
  '{\n  "dono": "[O SUB DA CONTA, DO SITE]",\n  "origens": ["https://[O SITE]"],\n' +
  '  "iss": "https://[O EMISSOR]/auth/v1",\n  "jwks": "https://[O EMISSOR]/auth/v1/.well-known/jwks.json"\n}';

const PACOTE_CAMPOS = ["dono", "origens", "iss", "jwks"];

function lerPacote(txt) {
  const bruto = String(txt == null ? "" : txt).trim();
  if (!bruto) {
    return { ok: false, vazio: true, campos: null, porque:
      "<b>Cole aqui o pacote que o site mostrou.</b> Ele tem quatro coisas: a conta, a origem do site, " +
      "o emissor e o endereço do JWKS. <b>Esta tela não inventa nenhuma delas</b>." };
  }
  let d = null;
  try { d = JSON.parse(bruto); } catch { d = null; }
  if (!d || typeof d !== "object" || Array.isArray(d)) {
    return { ok: false, vazio: false, campos: null, porque:
      "<b>Isto não é o pacote.</b> O que o site mostra é um bloco JSON com <code>dono</code>, <code>origens</code>, " +
      "<code>iss</code> e <code>jwks</code>. <b>Copie o bloco inteiro</b>, incluindo as chaves <code>{</code> e " +
      "<code>}</code> — um pedaço não serve." };
  }
  const origens = Array.isArray(d.origens) ? d.origens.filter(x => typeof x === "string" && x.trim())
    : (typeof d.origem === "string" && d.origem.trim() ? [d.origem.trim()] : []);
  const campos = {
    dono: typeof d.dono === "string" ? d.dono.trim() : "",
    origens: origens,
    iss: typeof d.iss === "string" ? d.iss.trim() : "",
    jwks: typeof d.jwks === "string" ? d.jwks.trim() : ""
  };
  const faltam = [];
  if (!campos.dono) faltam.push("dono");
  if (!campos.origens.length) faltam.push("origens");
  if (!campos.iss) faltam.push("iss");
  if (!campos.jwks) faltam.push("jwks");
  if (faltam.length) {
    return { ok: false, vazio: false, campos, faltam, porque:
      "<b>O pacote está incompleto</b>: " + (faltam.length === 1 ? "falta " : "faltam ") +
      faltam.map(c => "<code>" + c + "</code>").join(", ") + ". " +
      "<b>Não completo o que não recebi</b>, e o agente também não — ele recusaria por nome." };
  }
  /* PASSOU NA FORMA, e a frase diz exatamente até onde isso vale. */
  return { ok: true, vazio: false, campos, porque:
    "<b>A forma está certa e é só isso que eu conferi.</b> Quem decide se cada endereço é aceitável é o agente, " +
    "quando você clicar — inclusive a regra que exige o JWKS ser <b>do mesmo endereço do emissor</b>." };
}

/* ═══════════════════════════════════════════════════════════════════════════
   FIM DO JUÍZO. Nada daqui para baixo decide estado, cor ou frase.
   ═══════════════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => Number(v).toLocaleString("pt-BR");
function dur(ms) {
  if (typeof ms !== "number" || !isFinite(ms)) return "—";
  return ms < 1000 ? Math.round(ms) + " ms" : (ms / 1000).toFixed(1).replace(".", ",") + " s";
}
function quando(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const p2 = x => String(x).padStart(2, "0");
  return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}

/* ------------------------------------------------------------------ avisos
   Montado por DOM, nunca por `innerHTML`: a mensagem vem de erro de servidor,
   ou seja de fora, e `textContent` fecha essa porta sem depender de ninguém
   lembrar de escapar. Erro entra como `role="alert"` + `assertive` (o leitor de
   tela interrompe, porque a ação falhou); ok/info como `status` + `polite`; e o
   glifo é `aria-hidden`, porque um aviso que só se distingue por cor não existe
   para quem não a vê. */
const AVISO_GLIFO = { erro: "✕", alerta: "!", ok: "✓", info: "i" };
const AVISO_VIDA = { ok: 4500, info: 6000 };   // erro e alerta não somem sozinhos
const VIDA_MAX_PAUSA = 20000;

function avisoHtml(msg, tipo, titulo) {
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  return '<div class="aviso ' + t + '" role="' + (t === "erro" ? "alert" : "status") + '">' +
    '<span class="ai" aria-hidden="true">' + AVISO_GLIFO[t] + "</span>" +
    '<span class="ac">' + (titulo ? '<span class="at">' + esc(titulo) + "</span>" : "") + msg + "</span>" +
    "</div>";
}

function pilhaAvisos() {
  let p = document.querySelector(".avisos");
  if (p) return p;
  p = document.createElement("div");
  p.className = "avisos";
  document.body.appendChild(p);
  return p;
}

function avisar(msg, tipo, titulo) {
  if (!msg) return null;
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  const vida = AVISO_VIDA[t] || 0;
  const pilha = pilhaAvisos();

  const cartao = document.createElement("div");
  cartao.className = "aviso " + t;
  cartao.setAttribute("role", t === "erro" ? "alert" : "status");
  cartao.setAttribute("aria-live", t === "erro" ? "assertive" : "polite");

  const gl = document.createElement("span");
  gl.className = "ai"; gl.setAttribute("aria-hidden", "true"); gl.textContent = AVISO_GLIFO[t];
  const corpo = document.createElement("span");
  corpo.className = "ac";
  if (titulo) {
    const tt = document.createElement("span");
    tt.className = "at"; tt.textContent = titulo;
    corpo.appendChild(tt);
  }
  corpo.appendChild(document.createTextNode(msg));
  const fechar = document.createElement("button");
  fechar.type = "button"; fechar.className = "ax";
  fechar.setAttribute("aria-label", "fechar aviso"); fechar.textContent = "×";
  cartao.append(gl, corpo, fechar);
  if (vida) {
    const barra = document.createElement("span");
    barra.className = "abar"; barra.setAttribute("aria-hidden", "true");
    barra.style.animationDuration = vida + "ms";
    cartao.appendChild(barra);
  }

  const sair = () => {
    if (!cartao.isConnected) return;
    cartao.dispatchEvent(new Event("aviso:fim"));
    cartao.classList.add("saindo");
    // Espera a animação de saída, mas nunca depende dela: um
    // `prefers-reduced-motion` que zera a duração deixaria o cartão pendurado.
    setTimeout(() => cartao.remove(), 200);
  };
  fechar.addEventListener("click", sair);
  if (vida) {
    let timer = setTimeout(sair, vida);
    /* O mouse em cima pausa a contagem: ler uma frase de 12 palavras leva mais
       que 4,5s. Mas a pausa tem TETO — um aviso que nasce debaixo de um cursor
       parado nunca recebe `mouseleave` e viraria sujeira permanente. */
    const tetoDuro = setTimeout(sair, vida + VIDA_MAX_PAUSA);
    const barra = () => cartao.querySelector(".abar");
    cartao.addEventListener("mouseenter", () => {
      clearTimeout(timer);
      const b = barra(); if (b) b.style.animationPlayState = "paused";
    });
    cartao.addEventListener("mouseleave", () => {
      timer = setTimeout(sair, 1200);
      const b = barra(); if (b) b.style.animationPlayState = "running";
    });
    cartao.addEventListener("aviso:fim", () => { clearTimeout(timer); clearTimeout(tetoDuro); });
  }

  pilha.appendChild(cartao);
  // Teto de 4 na tela: sem ele uma rajada de avisos vira uma coluna que cobre a
  // página, com o último escondendo o primeiro.
  const todos = [...pilha.querySelectorAll(".aviso")];
  if (todos.length > 4) todos.slice(0, todos.length - 4).forEach(x => x.remove());
  return cartao;
}

/* ------------------------------------------------------------------ callApi
   `res.json()` NUNCA é chamado direto nestas rotas, e isso é medição, não
   estilo: `JSON.parse("404")` SUCEDE — 404 é um número JSON válido. Um processo
   Node velho (o Node não relê o `server.js`) responde `404` em texto puro, o
   corpo vira o número 404, a página trata esse número como objeto de status,
   lê os campos como `undefined` e acusa a configuração do Kauan por causa de um
   processo antigo. Já aconteceu, exatamente assim, no `/api/claude/status`.
   Então: qualquer corpo que não seja objeto simples é recusado, e o 404 é
   nomeado pelo que ele é. */
async function callApi(url, opts) {
  const res = await fetch(url, opts);
  let corpo = null;
  try { corpo = JSON.parse(await res.text()); } catch { corpo = null; }
  if (res.status === 404) {
    throw new Error("esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js");
  }
  if (!corpo || typeof corpo !== "object" || Array.isArray(corpo)) {
    throw new Error("o servidor respondeu algo que não é um objeto (status " + res.status + ")");
  }
  if (!res.ok) {
    /* DUAS PALAVRAS PARA A MESMA COISA, e uma delas não estava sendo lida.
       `pareamento.recusa()` devolve `{ok:false, motivo, categoria}` e o resto do
       servidor devolve `{error}`. Esta função só olhava `error`, então TODA recusa
       de entrada do pareamento — que existe precisamente para carregar a frase que
       a tela mostra — chegava como "falhou com status 400". A frase morria no
       caminho e o defeito ficava invisível: o 400 é o caminho normal ali, não uma
       exceção, então nada nunca acusou.
       `categoria` viaja pendurada no Error, mesma disciplina do `/api/tester/anexo`:
       é o que deixa a tela agrupar e dizer a frase certa em vez de "deu erro". */
    const err = new Error(corpo.error || corpo.motivo || ("falhou com status " + res.status));
    if (corpo.categoria) err.categoria = corpo.categoria;
    err.status = res.status;
    throw err;
  }
  return corpo;
}

     por PALAVRA, que é a pista que sobrevive ao cinza sem gastar cor. A classe

     linha acabou de afirmar, não um fato a mais. */
  if (L.aviso) h += '<div class="linha-aviso">' + avisoHtml(L.aviso.texto, L.aviso.tipo, L.aviso.titulo) + "</div>";

      "não casa com nada.</p>";

      (d.iss ? "emissor <b>" + esc(d.iss) + "</b>" : "sem emissor gravado") + "<br>" + NAO_REVOGA + "</div>";
  }

/* A cerimônia. Duas caras: colar o pacote (passo 2) e digitar o código (passo 4).
   A trilha dos quatro passos aparece nas duas, porque é ela que responde "onde eu
   estou" — e o passo 3 é o que diz que o código sai no console do agente. */
function cerimoniaHtml() {
  const c = S.cerim;
  const passo = passoAtual(S.par, c);
  let h = '<section class="bl voo" id="cerim">';
  h += passosHtml(passo);

  if (!c) {
    const p = lerPacote(S.pacote);
    h += '<div class="form">';
    h += '<div class="lb">o pacote que o site mostrou</div>';
    h += '<div class="fld"><textarea id="pacote" rows="6" spellcheck="false" ' +
      'aria-label="o pacote de pareamento, copiado do site" placeholder="' + esc(PACOTE_EXEMPLO) + '"></textarea></div>';
    h += avisoHtml(p.porque, p.ok ? "ok" : (p.vazio ? "info" : "alerta"));
    if (p.campos && (p.ok || (p.faltam && p.faltam.length < PACOTE_CAMPOS.length))) {
      h += '<div class="lb">o que eu li nesse texto</div>';
      h += '<ul class="origens">';
      h += '<li class="' + (p.campos.dono ? "val" : "inv") + '"><span class="mk">conta</span><span class="o sens">' +
        (p.campos.dono ? esc(p.campos.dono) : "—") + "</span></li>";
      for (const o of p.campos.origens) h += '<li class="val"><span class="mk">site</span><span class="o">' + esc(o) + "</span></li>";
      h += '<li class="' + (p.campos.iss ? "val" : "inv") + '"><span class="mk">emissor</span><span class="o">' +
        (p.campos.iss ? esc(p.campos.iss) : "—") + "</span></li>";
      h += '<li class="' + (p.campos.jwks ? "val" : "inv") + '"><span class="mk">jwks</span><span class="o">' +
        (p.campos.jwks ? esc(p.campos.jwks) : "—") + "</span></li>";
      h += "</ul>";
    }
    if (S.cerimErro) h += avisoHtml(S.cerimErro, "erro", "o agente recusou o pacote");
    h += '<div class="ln">';
    h += '<button class="btn prime" type="button" data-acao="par-iniciar"' + (p.ok && !S.ocupado ? "" : " disabled") + ">" +
      ICO_ESCUDO + (S.ocupado ? "Começando…" : "Começar a cerimônia") + "</button>";
    h += '<button class="btn ghost" type="button" data-acao="par-fechar">Cancelar</button>';
    h += '<span class="push"></span>';
    h += '<span class="mono">até aqui nada foi gravado</span>';
    h += "</div></div>";
    return h + "</section>";
  }

  /* Cerimônia aberta. O código está no console DELE. */
  const r = restaFrase(c.expiraEm, Date.now());
  h += '<div class="form">';
  h += avisoHtml(ondeFrase(c), "info", "onde está o código");
  const nz = normalizacoesFrase(c);
  if (nz) h += avisoHtml(nz, "alerta", "o que vai ser pareado de verdade");

    'spellcheck="false" maxlength="9" aria-label="o código que apareceu no console do agente" placeholder="000-000"></div>';
  h += '<span class="reg' + (r.venceu ? " venceu" : "") + '" id="par-resta">' + esc(r.txt) + "</span>";
  h += "</div>";
  h += '<p class="corpo" style="padding:0">' +
    (typeof c.tentativas === "number"

      : "<b>Quantas tentativas existem, não sei</b>: o campo não veio nesta resposta.") +
    " O alfabeto não tem <code>0</code>, <code>1</code>, <code>I</code> nem <code>O</code>.</p>";
  if (S.cerimErro) h += avisoHtml(S.cerimErro, "erro", "o código não foi aceito");
  h += '<div class="ln">';
  h += '<button class="btn prime" type="button" data-acao="par-confirmar"' + (S.ocupado ? " disabled" : "") + ">" +
    ICO_ESCUDO + (S.ocupado ? "Confirmando…" : "Confirmar e parear") + "</button>";
  h += '<button class="btn ghost" type="button" data-acao="par-cancelar">Cancelar a cerimônia</button>';
  h += '<span class="push"></span>';
  h += '<span class="mono">confirmar grava o arquivo e a chave deste agente</span>';
  h += "</div></div>";
  return h + "</section>";
}
