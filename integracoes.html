   lidos aqui — se fossem, esta função voltaria a poder desenhar a cópia enquanto
   o pé da seção anuncia o servidor, que é o defeito que custou uma fatia. O
   `pareamento-tela-test.js` amarra as duas metades num caso só, e um mutante que
   mude só um lado volta vermelho. */
function iaHtml() {
  const fonte = iaFonte(S.fatos);
  /* O padrão em vigor é o do VEREDITO, nunca a constante local: com a rota no
     ar, quem decide qual é o padrão é o `ia.js` do processo, e um padrão
     desenhado daqui poderia estar apontando para outro provedor que o do
     cockpit. */
  const prov = S.iaProv || fonte.padrao.provedor;
  const modo = S.iaModo || fonte.padrao.modo;
  const ehPadrao = !S.iaProv && !S.iaModo;

  let h = '<p class="eyebrow"><span class="idx">[ IA DA RODADA ]</span>';
  h += "<span>qual CLI roda, e de quem é a conta que paga</span><span class=\"rule\"></span>";
  h += '<span class="qt">escolha não gravada</span></p>';

  h += '<section class="bl">';
  h += '<p class="corpo">' + escolhaFrase(prov, modo, ehPadrao, fonte) + "</p>";
  h += '<div class="form">';
  h += '<div class="lb">qual CLI</div>';
  h += '<div class="ops" role="group" aria-label="qual CLI roda as ações que gastam modelo">';
  for (const p of fonte.provedores) h += opProvedorHtml(p, prov);
  h += "</div>";
  h += '<div class="lb">de quem é a conta que paga</div>';
  h += '<div class="ops" role="group" aria-label="de quem é a conta que paga a rodada">';
  for (const m of fonte.modos) h += opModoHtml(m, modo);
  h += "</div>";
  h += "</div>";
  /* A frase de procedência sai do MESMO objeto que entregou as listas acima.
     Um `iaFonte(...)` chamado de novo aqui seria uma segunda leitura, e duas
     leituras podem discordar. */
  h += '<div class="pe">' + fonte.frase + "</div>";
  h += "</section>";

  h += '<div class="pend"><span class="mk">[ pendente ]</span><p>' + IA_PENDENTE + "</p></div>";
  return h;
}

/* ------------------------------------------------------- o que sobrevive ao repaint
   `render()` reescreve `#app` inteiro, e dentro dele há dois campos de digitar:
   o pacote e o código. Sem isto, qualquer repintura (a colheita terminando, o
   ticker do prazo, um aviso) apagaria o que está sendo digitado no meio da
   cerimônia — que é o momento em que a tela menos pode fazer isso. Guarda VALOR,
   FOCO e CARET, a mesma receita do `capturarInputs` do `tester.html`. */
const CAMPOS_VIVOS = ["#pacote", "#codigo"];
function capturarCampos() {
  const fora = {};
  for (const sel of CAMPOS_VIVOS) {
    const el = $(sel);
    if (!el) continue;
    fora[sel] = { v: el.value, foco: document.activeElement === el, ini: el.selectionStart, fim: el.selectionEnd };
  }
  return fora;
}
function restaurarCampos(m) {
  for (const sel of CAMPOS_VIVOS) {
    const el = $(sel);
    const g = m[sel];
    if (!el || !g) continue;
    el.value = g.v;
    if (g.foco) {
      el.focus();
      try { el.setSelectionRange(g.ini, g.fim); } catch { /* campo que não suporta seleção */ }
    }
  }
}

/* O ticker do prazo. Ele toca UM texto e mais nada — repintar a tela a cada
   segundo apagaria o código sendo digitado, que é o defeito que este arquivo
   inteiro existe para não cometer. Mesma decisão do `tocarRelogios` no
   `flows.html`: o que envelhece é o relógio, não a página. */
let tickPrazo = null;
function ligarTicker() {
  if (tickPrazo) { clearInterval(tickPrazo); tickPrazo = null; }
  if (!S.cerim) return;
  tickPrazo = setInterval(() => {
    const el = $("#par-resta");
    if (!el || !S.cerim) { clearInterval(tickPrazo); tickPrazo = null; return; }
    const r = restaFrase(S.cerim.expiraEm, Date.now());
    el.textContent = r.txt;
    el.classList.toggle("venceu", r.venceu);
  }, 1000);
}

/* -------------------------------------------------------------- as ações
   UM ouvinte delegado, ligado uma vez. Ligar `onclick` depois de cada `render()`
   funcionaria e criaria a chance de ligar duas vezes no dia em que alguém
   chamasse `render()` de dentro de um handler — o defeito que o `montarCamera`
   do `upgrade.html` documenta com os sete ouvintes duplicados. */
let acoesLigadas = false;
function ligarAcoes() {
  if (acoesLigadas) return;
  acoesLigadas = true;
  document.addEventListener("click", ev => {
    const b = ev.target.closest && ev.target.closest("[data-acao]");
    if (!b || b.disabled) return;
    const a = b.dataset.acao;
    if (a === "par-reler") return void carregarPar(true);
    if (a === "par-abrir") { S.abrindoPacote = true; S.cerimErro = null; render(); const t = $("#pacote"); if (t) t.focus(); return; }
    if (a === "par-fechar") { S.abrindoPacote = false; S.cerimErro = null; render(); return; }
    if (a === "par-iniciar") return void iniciarCerimonia();
    if (a === "par-confirmar") return void confirmarCerimonia();
    if (a === "par-cancelar") return void cancelarCerimonia();
    if (a === "par-desparear") return void desparear();
    if (a === "ia-prov") { S.iaProv = b.dataset.id; render(); return; }
    if (a === "ia-modo") { S.iaModo = b.dataset.id; render(); return; }
    if (a === "cofre-guardar") return void guardarChave();
    if (a === "cofre-apagar") { S.chaveApagando = true; render(); return; }
    if (a === "cofre-apagar-nao") { S.chaveApagando = false; render(); return; }
    if (a === "cofre-apagar-ok") return void apagarChave();
  });
  /* O pacote e o código não repintam a tela a cada tecla — só guardam o texto.
     Repintar por tecla é o que faz um campo perder foco e caret; a prévia do
     pacote é redesenhada quando o campo perde o foco, que é quando a leitura
     dele importa. */
  document.addEventListener("input", ev => {
    if (ev.target.id === "pacote") S.pacote = ev.target.value;
    if (ev.target.id === "codigo") S.codigo = ev.target.value;
  });
  document.addEventListener("change", ev => { if (ev.target.id === "pacote") render(); });
  /* Enter no campo do código confirma. É o gesto que a pessoa vai fazer depois de
     digitar seis caracteres olhando para outra janela. */
  document.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || ev.target.id !== "codigo") return;
    ev.preventDefault();
    confirmarCerimonia();
  });
}

/* ------------------------------------------------------------- o cofre
   O VALOR NÃO MORA EM `S`. Ele é lido do campo no momento do clique e some
   junto com o repintar — guardar uma credencial no estado da página seria
   deixá-la ao alcance de qualquer script desta aba, exatamente o que o cookie
   `HttpOnly` da sessão existe para evitar do outro lado. */

async function carregarChave(pedido) {
  if (S.chaveBuscando) return;
  S.chaveBuscando = true;
  if (pedido) S.chaveErro = null;
  try {
    S.chave = await callApi("/api/cofre");
    S.chaveErro = null;
  } catch (e) {
    /* Falha de leitura é NOSSA. `S.chave` fica como estava — a última colheita
       boa continua valendo, e o estado cai em `conferindo` pelas guardas de campo
       ausente se nunca houve nenhuma. */
    S.chaveErro = e && e.message ? e.message : String(e);
  } finally {
    S.chaveBuscando = false;
    render();
  }
}

async function guardarChave() {
  const campo = $("#chaven8n");
  const v = campo ? campo.value : "";
  if (!v.trim()) { avisar("Cole a chave antes de guardar.", "alerta"); return; }
  if (S.chaveOcupado) return;
  S.chaveOcupado = true; render();
  try {
    const r = await callApi("/api/cofre", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ chave: v })
    });
    /* O campo é limpo ANTES de qualquer outra coisa: a partir daqui a chave não
       tem por que continuar no DOM. */
    if (campo) campo.value = "";
    /* `forma` é AVISO, nunca recusa — o cofre guarda mesmo o que não parece um
       JWT, porque recusar por forma travaria a pessoa fora da instância no dia
       em que o formato mudasse. A tela diz o que ela viu. */
    if (r.forma !== "jwt") {
      avisar("Guardada — mas <b>isso não tem cara de chave do n8n</b>. Confira se você não colou a URL da instância por engano.", "alerta");
    } else {
      avisar("Chave guardada e cifrada. Ela passa a valer na próxima conferência.", "ok");
    }
    /* A obrigação do `cofre.js`, consumida como CAMPO e não como prosa: se a
       rota parar de mandá-la, este aviso some e o teste percebe. */
    if (r.revogacaoManual) avisar(COFRE_REVOGA, "alerta");
    await carregarChave(false);
    /* A chave mudou, então o que a colheita anterior disse sobre o n8n é sobre
       outra credencial. Reconferir aqui é o que evita a tela afirmar "conectado"
       com base numa medição que não vale mais. */
    await carregar(false);
  } catch (e) {
    avisar(e && e.message ? e.message : String(e), "erro");
  } finally {
    S.chaveOcupado = false; render();
  }
}

async function apagarChave() {
  if (S.chaveOcupado) return;
  S.chaveApagando = false;
  S.chaveOcupado = true; render();
  try {
    const r = await callApi("/api/cofre", { method: "DELETE" });
    /* `tinha: false` não é erro — apagar o que não existe é o resultado pedido,
       e a frase diz isso em vez de fingir que apagou algo. */
    avisar(r.tinha ? "Chave apagada do cofre." : "Não havia nada guardado no cofre.", "ok");
    await carregarChave(false);
    await carregar(false);
  } catch (e) {
    avisar(e && e.message ? e.message : String(e), "erro");
  } finally {
    S.chaveOcupado = false; render();
  }
}

/* -------------------------------------------------------------- as chamadas */

async function carregarPar(pedido) {
  if (S.parBuscando) return;
  S.parBuscando = true;
  if (pedido) S.parErro = null;
  render();
  try {
    const d = await callApi("/api/pareamento");
    S.par = d;
    S.parErro = null;
    /* A cerimônia VIVE NO PROCESSO do agente, não nesta aba: o `estado` traz
       `desafio` quando há uma aberta. Sem isto, um F5 no meio da cerimônia
       perderia o `desafio` e a pessoa teria de recomeçar — com o código já
       impresso no console e sem nada para fazer com ele. */
    if (d && d.desafio && d.desafio.desafio && !d.desafio.expirado) {
      /* OS DOIS LADOS CHAMAM O MESMO FATO POR NOMES DIFERENTES: `iniciar`
         devolve `tentativas` (o teto, no começo) e `estado` devolve
         `tentativasRestantes` (quantas sobraram agora). São o mesmo número na
         mesma unidade, e sem esta linha um F5 no meio da cerimônia cairia no
         ramo honesto "quantas tentativas existem, não sei" com o número ali,
         vindo do agente. Traduzir aqui é traduzir FATO; a frase continua sendo
         decidida no bloco de juízo. */
      const veio = Object.assign({}, d.desafio);
      if (typeof veio.tentativasRestantes === "number") veio.tentativas = veio.tentativasRestantes;
      /* SEGUNDA CAMADA CONTRA A TROCA DE CERIMONIA. Esta aba adotava o que
         chegasse do poll, entao uma cerimonia aberta por OUTRO processo local
         sobrescrevia `desafio`, `origens` e `dono` da que o Kauan estava
         conduzindo. Ele leria do console o codigo mais recente — o do atacante —
         e confirmaria a origem do atacante achando que confirmava a dele.
         A camada de verdade e o `pareamento.js`, que agora RECUSA abrir uma
         segunda cerimonia. Esta aqui existe porque o desenho da tela nao pode
         depender de uma garantia que mora noutro arquivo: se a aba ja tem um
         desafio proprio e chega outro DIFERENTE, ela nao troca — quem manda no
         que esta na tela e a cerimonia que esta tela abriu.
         Casar por `desafio` e nao por presenca: o poll traz a MESMA cerimonia a
         cada 2s, e recusar por presenca congelaria `tentativasRestantes`. */
      S.cerim = (S.cerim && S.cerim.desafio && veio.desafio && S.cerim.desafio !== veio.desafio)
        ? S.cerim
        : Object.assign({}, S.cerim || {}, veio);
      S.abrindoPacote = false;
    } else if (d && d.desafio === null && S.cerim) {
      /* O agente diz que não há cerimônia. Isso vence o que esta aba achava. */
      S.cerim = null;
    }
    if (pedido) avisar("O agente respondeu. Nada foi escrito.", "ok");
  } catch (e) {
    S.parErro = e && e.message ? e.message : String(e);
  } finally {
    S.parBuscando = false;
    render();
  }
}

async function iniciarCerimonia() {
  const p = lerPacote(S.pacote);
  if (!p.ok || S.ocupado) return;
  S.ocupado = true; S.cerimErro = null; render();
  try {
    const r = await callApi("/api/pareamento/iniciar", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ origens: p.campos.origens, iss: p.campos.iss, jwks: p.campos.jwks, dono: p.campos.dono })
    });
    S.cerim = r;
    S.abrindoPacote = false;
    S.codigo = "";
    avisar("O código foi impresso no console do agente — a janela do cockpit.", "info");
  } catch (e) {
    /* A recusa de entrada é um 400 normal carregando a frase e a `categoria`; ela
       não é um defeito do cockpit e a tela não a chama de um. */
    S.cerimErro = e && e.message ? e.message : String(e);
    /* E QUANDO A RECUSA É "já existe uma cerimônia aberta", a frase manda cancelar
       — e o botão de cancelar só existe DENTRO do painel da cerimônia, que esta aba
       não tem, porque foi ela que acabou de ser recusada. O resultado é uma
       instrução sem porta: a pessoa lê "cancele antes de abrir outra" e não tem o
       que clicar até o poll de 2s adotar a cerimônia viva.
       Puxar o estado aqui fecha isso no mesmo quadro. Não é cosmético: a recusa
       nasceu de uma correção de SEGURANÇA (abrir de novo substituía a cerimônia
       anterior, que era o bypass), e uma correção que deixa a tela parecendo
       travada é a que alguém desfaz na semana seguinte para "destravar". */
    if (e && e.categoria === "desafio") { try { await carregarPar(false); } catch { /* o poll pega */ } }
  } finally {
    S.ocupado = false;
    render();
    const el = $("#codigo"); if (el) el.focus();
  }
}

async function confirmarCerimonia() {
  if (!S.cerim || S.ocupado) return;
  S.ocupado = true; S.cerimErro = null; render();
  try {
    const res = await fetch("/api/pareamento/confirmar", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ desafio: S.cerim.desafio, codigo: S.codigo })
    });
    let corpo = null;
    try { corpo = JSON.parse(await res.text()); } catch { corpo = null; }
    if (res.status === 404) throw new Error("esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js");
    if (!corpo || typeof corpo !== "object" || Array.isArray(corpo)) {
      throw new Error("o servidor respondeu algo que não é um objeto (status " + res.status + ")");
    }
    if (corpo.ok === true) {
      S.cerim = null;
      S.codigo = "";
      S.pacote = "";
      avisar("Pareado. " + (corpo.substituiu ? "Isto substituiu o pareamento anterior inteiro." : "Este agente não estava pareado antes."), "ok");
      await carregarPar(false);
      return;
    }
    /* 400 e 410 são histórias diferentes, e `confirmarFalha` é quem decide qual.
       Uma cerimônia que ACABOU volta para o passo do pacote — deixar o campo do
       código na tela convidaria a insistir num código que não vale mais. */
    const f = confirmarFalha(res.status, corpo);
    S.cerimErro = f.frase;
    if (f.fim) { S.cerim = null; S.abrindoPacote = true; }
    if (typeof corpo.tentativasRestantes === "number" && S.cerim) S.cerim.tentativas = corpo.tentativasRestantes;
  } catch (e) {
    S.cerimErro = "<b>Não consegui falar com o agente para confirmar.</b> Isto é defeito do cockpit, não do seu código: " +
      esc(e && e.message ? e.message : String(e)) + ". <b>A cerimônia pode continuar aberta</b> — o agente é quem sabe.";
  } finally {
    S.ocupado = false;
    render();
  }
}

async function cancelarCerimonia() {
  try { await callApi("/api/pareamento/cancelar", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); }
  catch (e) { avisar("Não consegui cancelar no agente: " + (e && e.message ? e.message : e), "erro"); }
  S.cerim = null; S.cerimErro = null; S.codigo = ""; S.abrindoPacote = false;
  render();
  carregarPar(false);
}

/* Desparear NÃO pede confirmação, e isso é deliberado: é a direção que FECHA, e
   pedir confirmação para fechar ensina a clicar em confirmar. É a mesma frase que
   o `pareamento.js` escreve no próprio corpo. O que a tela faz é REPETIR o
   `naoRevoga` que voltou do módulo — reescrevê-lo aqui seria uma segunda
   definição do mesmo fato. */
async function desparear() {
  if (S.ocupado) return;
  S.ocupado = true; render();
  try {
    const r = await callApi("/api/pareamento", { method: "DELETE" });
    avisar(typeof r.naoRevoga === "string" && r.naoRevoga
      ? "Desparelhado. " + r.naoRevoga
      : "Desparelhado. O agente não disse o que isto não revoga — e não invento a ressalva.", "ok");
  } catch (e) {
    avisar("Não consegui desparear: " + (e && e.message ? e.message : e), "erro");
  } finally {
    S.ocupado = false;
    await carregarPar(false);
  }
}

/* ------------------------------------------------------------------ estado
   `fatos` é a última colheita que chegou. Ele NÃO é limpo quando uma
   conferência falha: fato velho carimbado como velho vale mais que uma tela em
   branco, e apagar as três linhas por causa de um fetch que caiu faria a falha
   do cockpit parecer uma queda das integrações. */
const S = {
  fase: "carregando", fatos: null, erro: null, conferindo: false,
  /* O pareamento tem estado PRÓPRIO, e é outra rota: `par` é a última resposta
     de `/api/pareamento`, `parErro` é a falha de LER isso (nossa, nunca dela) e
     `parBuscando` é a leitura em voo. Misturar com `fatos` faria uma colheita de
     integrações que falhou apagar o que se sabe do pareamento, e vice-versa. */
  par: null, parErro: null, parBuscando: true,
  /* A cerimônia. `abrindoPacote` é só a tela do passo 2 aberta — ela NÃO é uma
     cerimônia e não existe do lado do agente. `cerim` é a de verdade, e ela vive
     no PROCESSO do agente: por isso é relida do `estado` a cada colheita, e por
     isso um F5 no meio dela não perde o `desafio`. */
  abrindoPacote: false, cerim: null, cerimErro: null, pacote: "", codigo: "", ocupado: false,
  /* O cofre. `chave` é a última resposta de `/api/cofre` — FATO, e nunca a chave
     em si. `chaveErro` é a falha de LER isso, que é nossa e nunca dela, e
     `chaveApagando` é o segundo passo da confirmação de apagar.

     O VALOR DIGITADO NÃO MORA AQUI: ele é lido do campo no momento do clique e
     some no repintar. Guardar uma credencial no estado da página a deixaria ao
     alcance de qualquer script desta aba — que é exatamente o que o cookie
     `HttpOnly` da sessão existe para evitar do outro lado. */
  chave: null, chaveErro: null, chaveBuscando: false, chaveOcupado: false, chaveApagando: false,
  /* A escolha de IA. Mora na memória desta aba e em lugar nenhum: não existe rota
     para gravá-la, e a tela DIZ isso em vez de deixar implícito. `null` nos dois
     significa "ninguém escolheu, está valendo o padrão" — que é uma terceira
     coisa, diferente de ter escolhido justamente o que o padrão diria. */
  iaProv: null, iaModo: null
};

/* ─────────────────────────────────────────────────── a seção do cofre, desenhada
   Nada aqui decide estado, cor ou frase: tudo vem do bloco de juízo lá em cima. */
function cofreHtml() {
  const k = S.chave;
  const est = estadoCofre(k);

  let h = '<p class="eyebrow"><span class="idx">[ CHAVE DO n8n ]</span>';
  h += "<span>onde ela mora, e como trocá-la sem abrir um editor</span>";
  h += '<span class="rule"></span>';
  h += '<span class="qt tag ' + COFRE_TAG[est] + '">' + esc(est.toUpperCase()) + "</span></p>";
  h += '<section class="bl">';

  /* Falha de LER o cofre é defeito nosso, e a frase diz isso — nenhuma linha
     abaixo pode afirmar que não há chave por causa de um fetch que caiu. */
  if (S.chaveErro) {
    h += avisoHtml(
      "<b>Não consegui ler o estado do cofre.</b> Isto é um defeito do cockpit, não da sua " +
      "configuração — e por isso <b>nada abaixo diz que você está sem chave</b>. O servidor " +
      'respondeu: <b class="sens">' + esc(S.chaveErro) + "</b>",
      "erro", "a leitura do cofre falhou");
  }

  h += '<p class="corpo">' + fonteFrase(k) + "</p>";
  h += '<p class="corpo">' + COFRE_FRASE[est] + "</p>";

  if (est !== "indisponivel" && est !== "conferindo") {
    /* `type="password"` e `autocomplete="off"`: é uma credencial num campo que
       fica aberto numa tela que este painel filma em demonstração. E `spellcheck`
       desligado porque um JWT sublinhado de vermelho parece erro. */
    h += '<div class="form">';
    h += '<div class="lb"><label for="chaven8n">colar a chave</label></div>';
    h += '<input id="chaven8n" type="password" autocomplete="off" spellcheck="false" ' +
      'placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…"' +
      (S.chaveOcupado ? " disabled" : "") + ">";
    h += '<div class="ops">';
    h += '<button class="btn prime" type="button" data-acao="cofre-guardar"' +
      (S.chaveOcupado ? " disabled" : "") + ">" +
      (S.chaveOcupado ? "Guardando…" : "Guardar") + "</button>";

    /* Confirmação em DOIS PASSOS, e não um diálogo: esta página não tem
       `confirmar()`, e copiar o bloco de outra faria dele a quinta cópia à mão
       de algo que já quebrou uma página quando alguém inseriu em vez de
       substituir. O gesto de dois passos já existe aqui — é o mesmo de abrir o
       pacote na cerimônia de pareamento. */
    if (est === "ok" || est === "quebrou") {
      if (!S.chaveApagando) {
        h += '<button class="btn ghost" type="button" data-acao="cofre-apagar"' +
          (S.chaveOcupado ? " disabled" : "") + ">Apagar do cofre</button>";
      } else {
        h += '<button class="btn perigo" type="button" data-acao="cofre-apagar-ok"' +
          (S.chaveOcupado ? " disabled" : "") + ">Confirmar: apagar</button>";
        h += '<button class="btn ghost" type="button" data-acao="cofre-apagar-nao">Cancelar</button>';
      }
    }
    h += "</div></div>";

    /* A consequência aparece com o pedido, e não depois do clique. Sem histórico
       no cofre, "não dá para desfazer" é a informação que decide. */
    if (S.chaveApagando) {
      h += avisoHtml(
        "O cofre <b>não guarda histórico</b>, então isto não tem como ser desfeito. Depois de apagar, " +
        "o painel volta a procurar a chave no <code>.env</code> — e se não houver uma lá, ele para de " +
        "ler o n8n. <b>Nada é apagado na sua instância</b>: a chave continua valendo lá.",
        "alerta", "apagar não tem volta");
    }

    /* A obrigação escrita no `cofre.js`, ANTES do clique e não depois. */
    h += avisoHtml(COFRE_REVOGA, "alerta", "trocar aqui não revoga lá");
    h += '<p class="corpo">' + COFRE_TETO + "</p>";
    h += '<p class="corpo">O cockpit <b>não valida</b> a chave. Quem diz se ela presta é o n8n, ' +
      'na próxima conferência.</p>';
  }

  h += "</section>";
  return h;
}

function render() {
  const app = $("#app");
  app.setAttribute("aria-busy", S.fase === "carregando" || S.conferindo ? "true" : "false");

  /* As linhas vêm ANTES do eyebrow porque ele resume o estado delas. */
  const linhas = S.fase === "carregando" ? null
    : porUrgencia([linhaN8n(S.fatos), linhaClaude(S.fatos), linhaCodex(S.fatos)]);

  let h = '<p class="eyebrow"><span class="idx">[ INTEGRAÇÕES ]</span>';
  h += "<span>" + (S.fase === "carregando"
    ? "lendo o que o cockpit sabe responder…"
    : "três conexões, cada uma no seu estado") + "</span>";
  h += '<span class="rule"></span>';
  /* O carimbo de frescor NÃO entra aqui, e o pé também não o repete: ele mora
     UMA vez, no `.meta` do topbar. Ver `resumoEstados` para a defesa. O que
     ocupa este slot é o talhe por estado — a única coisa desta tela que nenhum
     outro lugar dela diz. */
  h += '<span class="qt">' + esc(linhas ? resumoEstados(linhas) : "três conexões") + "</span></p>";

  /* A falha do FETCH é nossa, e a frase diz isso. Culpar a configuração dele por
     um erro nosso é o defeito que o `docAgentes` cometeu ao anunciar "não achei
     `tester-agentes.md`" com o arquivo de 48KB no lugar. E ela é ANCORADA, no
     alto da lista: um erro que pertence a um lugar fica nele. */
  if (S.erro) {
    h += avisoHtml(
      "<b>Não consegui ler o estado das integrações.</b> Isto é um defeito do cockpit, " +
      "não da sua configuração — o que está abaixo é a última colheita que chegou, se chegou alguma, " +
      "e <b>nenhuma linha vai dizer que quebrou por causa disto</b>. O servidor respondeu: " +
      '<b class="sens">' + esc(S.erro) + "</b>",
      "erro", "a conferência falhou");
  }

  if (S.fase === "carregando") {
    h += esqueletoHtml();
    h += '<p class="corpo" style="padding-left:0">Nenhuma linha afirma nada até a colheita chegar: ' +
      "<b>«não achei» e «ainda não olhei» são duas frases diferentes</b>, e esta é a segunda.</p>";
  } else {
    for (const L of linhas) h += linhaHtml(L);
  }

  /* As duas seções novas entram DEPOIS das três linhas e ANTES do rodapé. A
     ordem é decisão: o rodapé fala do que esta tela toda não faz, e ele tem que
     ficar embaixo de tudo o que ela faz — inclusive do que ela passou a fazer.

     A falha de LER o pareamento é ancorada aqui, junto da seção, e não na pilha
     flutuante: um erro que pertence a um lugar fica nele. E ela diz que o defeito
     é do cockpit, porque é: acusar a configuração dela por um fetch nosso é o
     mesmo defeito do `docAgentes`. */
  if (S.parErro) {
    h += avisoHtml(
      "<b>Não consegui ler o estado do pareamento.</b> Isto é um defeito do cockpit, não da sua configuração — " +
      "e por isso <b>nenhuma frase abaixo diz que você não está pareado</b>. O servidor respondeu: " +
      '<b class="sens">' + esc(S.parErro) + "</b>",
      "erro", "a leitura do pareamento falhou");
  }
  h += pareamentoHtml();
  h += iaHtml();
  h += cofreHtml();

  h += '<div class="rodape">';
  h += '<button class="btn ghost" id="conferir" type="button" title="' + esc(SO_UM_CONTROLE) + '"' +
    (S.conferindo ? " disabled" : "") + ">" + ICO_RECARREGAR +
    (S.conferindo ? "Conferindo…" : "Conferir de novo") + "</button>";
  /* Sem carimbo aqui: era a terceira cópia, e a topbar é `sticky` — o carimbo
     dela está na tela mesmo quando se rola até este botão. O que sobra é a
     ressalva do próprio botão, que é outro fato. */
  h += '<span class="mono">' + esc(SO_UM_CONTROLE) + "</span>";
  h += '<span class="push"></span>';
  h += "</div>";

  h += '<div class="verdade">';
  for (const v of VERDADE) h += '<div class="it"><div class="lb">' + esc(v.lb) + '</div><p>' + v.html + "</p></div>";
  h += "</div>";

  /* O que está sendo digitado é capturado ANTES do `innerHTML` e devolvido
     depois. Sem isto, a colheita das integrações terminando no meio da cerimônia
     apagaria o código que ela está copiando da outra janela. */
  const vivos = capturarCampos();
  app.innerHTML = h;
  restaurarCampos(vivos);
  ligarTicker();
  const b = $("#conferir");
  if (b) b.onclick = () => carregar(true);
}

async function carregar(pedido) {
  if (S.conferindo) return;
  S.conferindo = true;
  if (pedido) { S.erro = null; render(); }
  try {
    const f = await callApi("/api/integracoes");
    S.fatos = f;
    S.erro = null;
    S.fase = "pronto";
    if (pedido) avisar("Colheita refeita. Nada foi escrito.", "ok");
  } catch (e) {
    /* A fase NÃO volta para "carregando": o esqueleto diria "estou lendo" para
       uma leitura que já terminou em erro. Se nunca houve colheita, as três
       linhas caem em `conferindo` pelas guardas de campo ausente do bloco de
       juízo — que é o certo, porque um fetch que caiu não prova nada sobre a
       instância. */
    S.erro = e && e.message ? e.message : String(e);
    S.fase = "pronto";
  } finally {
    S.conferindo = false;
    render();
    pintarTopbar();
  }
}

/* O topbar é fato, e ele carrega os dois carimbos: o endereço da instância (que
   é `sens`, porque identifica a conta numa filmagem) e o instante da colheita —
   sempre do payload, jamais de `new Date()`. */
function pintarTopbar() {
  const n = S.fatos && S.fatos.n8n;
  const inst = $("#instance");
  if (n && n.instancia) inst.textContent = n.instancia;
  else if (n && n.configurado === false) inst.textContent = "sem n8n no .env";
  else inst.textContent = "instância —";
  $("#stamp").textContent = S.fatos ? selo(S.fatos) : (S.erro ? "leitura falhou" : "carregando…");
}

ligarAcoes();
render();
carregar();
/* Duas colheitas independentes, em paralelo e sem `await` entre elas: o
   `/api/integracoes` mede ~1,4 s de n8n mais ~670 ms de CLI, e o
   `/api/pareamento` é leitura de dois arquivos locais. Encadear faria o
   pareamento — que é a seção nova e a mais barata — esperar pela mais cara, com a
   tela dizendo "procurando" o tempo todo. Quem falha falha sozinha: é por isso
   que `parErro` é um campo próprio e não o `erro` da colheita. */
carregarPar(false);

/* Terceira colheita independente, e pelo mesmo motivo das outras duas: ler o
   cofre abre o DPAPI, que custa ~800 ms na primeira vez do processo. Encadear
   faria a tela inteira esperar por isso. Quem falha, falha sozinha. */
carregarChave(false);

/* ══════════════════════════════════════════════════════ CHROME COMPARTILHADO
   Alternador de tema e modo gravação, extraídos verbatim do `upgrade.html`.

   DÍVIDA REGISTRADA: com este arquivo o topbar e o modo gravação passam a ser
   CINCO cópias. O CLAUDE.md já registra a fila de quatro; esta é a quinta, e ela
   entra com a mesma regra: mudou numa, mude nas cinco. O caminho de saída é o
   que o `aba.js` e o `entradas.js` já provaram — um arquivo servido — e ele vale
   mais agora que são cinco. Não vai de carona nesta fatia porque mexeria em
   quatro páginas que hoje funcionam. */
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  localStorage.setItem("cockpit-theme", document.documentElement.dataset.theme);
};
const wantTheme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("cockpit-theme");
if (wantTheme === "light" || wantTheme === "dark") document.documentElement.dataset.theme = wantTheme;

const REC_KEY = "cockpit-rec";
function recPaint() {
  const on = document.documentElement.dataset.rec === "1";
  const b = $("#rec");
  b.querySelector(".lbl").textContent = on ? "REC" : "Gravar";
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.title = on
    ? "modo gravação ligado — endereço da instância, conta do Claude e caminho da CLI borrados; clique para desligar"
    : "modo gravação — borra o endereço da instância, a conta do Claude e o caminho da CLI para filmar a tela";
}
function recWave(btn) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const w = document.createElement("div");
  w.className = "rec-wave";
  document.body.append(w);
  w.animate(
    [{ clipPath: `circle(0px at ${x}px ${y}px)`, opacity: .95 },
     { clipPath: `circle(${raio}px at ${x}px ${y}px)`, opacity: 0 }],
    { duration: 700, easing: "cubic-bezier(.22,.61,.36,1)" }
  ).onfinish = () => w.remove();
}
$("#rec").onclick = () => {
  const on = document.documentElement.dataset.rec !== "1";
  if (on) document.documentElement.dataset.rec = "1";
  else delete document.documentElement.dataset.rec;
  try { on ? localStorage.setItem(REC_KEY, "1") : localStorage.removeItem(REC_KEY); } catch { /* modo privado */ }
  recWave($("#rec"));
  recPaint();
};
// Duas telas do cockpit abertas lado a lado: a outra aba acompanha, sem onda.
addEventListener("storage", e => {
  if (e.key !== REC_KEY) return;
  if (e.newValue === "1") document.documentElement.dataset.rec = "1";
  else delete document.documentElement.dataset.rec;
  recPaint();
});
recPaint();
</script>

<script>
/* ─────────────────────────────────────────── o atalho que o chip promete
   O BLOCO COMPARTILHADO DA LENTE NÃO ESTÁ NESTA PÁGINA, e é preciso dizer por
   quê: aquele JS existe para mover a `.lente` entre as portas e ele começa com
   `if (!lente) return`. Aqui não há porta ativa — nenhuma das quatro é esta
   tela — então a lente ficaria estacionada, visível, na porta de onde você veio:
   a tela diria "você está no Upgrade" estando em Integrações. Sem a lente, o
   bloco inteiro sai pela primeira linha, e com ele sairia o atalho alt+1/2/3,
   que os chips `kbd` prometem. Um rótulo prometendo tecla que não faz nada é
   pior que nenhum rótulo — então o atalho fica, sozinho, nomeado.

   A guarda pela ausência da lente é o que impede dois ouvintes no dia em que
   alguém trouxer o bloco compartilhado para cá. */
(function () {
  "use strict";
  var nav = document.querySelector(".nvd");
  if (!nav || nav.querySelector(".lente")) return;
  addEventListener("keydown", function (ev) {
    if (!ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var i = "12345".indexOf(ev.key);
    if (i < 0) return;
    var a = nav.querySelectorAll("a")[i];
    if (!a) return;
    ev.preventDefault();
    location.href = a.getAttribute("href");
  });
}());
</script>
