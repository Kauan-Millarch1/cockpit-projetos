<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   JUÍZO — TUDO o que esta página decide mora neste bloco.

   `integracoes.js` emite FATO (`configurado`, `respondeu`, `httpStatus`,
   `fluxos`, `cliAchada`, `logado`, `rota`, `plano`) e esta página é que decide o
   nome do estado, a cor, a frase da causa, o que significa cada rota de
   autenticação e o que para em consequência. Mesma invariante do
   `BANDS`/`diagnose` no `flows.html` e do `ESTADO`/`podeConversar` no
   `upgrade.html`, e pelo mesmo motivo: a definição de "quebrou" é a parte que o
   Kauan mais ajusta, e no servidor cada ajuste exigiria reiniciar o processo.

   Nada abaixo deste bloco julga nada. O que vem depois desenha o descritor que
   as funções daqui devolvem.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Os quatro estados, e o que faz cada um distinguível SEM COR. A cor é a última
   pista da lista, nunca a primeira: `cls` escolhe o ritmo do traço da barra e o
   contorno do container, `gl` escolhe a FORMA do glifo, e só a linha `quebrou`
   ganha manchete de 15px. Ver o comentário longo em `.card` no CSS. */
const ESTADO = {
  quebrou:    { tag: "PAROU DE FUNCIONAR", tagCls: "risk", cls: "st-quebrou",    gl: "risco", glifo: "aviso",  ordem: 0 },
  ok:         { tag: "CONECTADA",           tagCls: "ok",   cls: "st-ok",         gl: "bom",   glifo: "check",  ordem: 1 },
  conferindo: { tag: "AINDA NÃO SEI",       tagCls: "cold", cls: "st-conferindo", gl: "voo",   glifo: "anel",   ordem: 1 },
  nunca:      { tag: "NUNCA CONECTADO",     tagCls: "cold", cls: "st-nunca",      gl: "frio",  glifo: "cruz",   ordem: 1 }
};

/* SÓ o que quebrou sobe. As outras três mantêm a ordem declarada (n8n, Claude,
   Codex) porque numa tela de configuração você vem procurar uma conexão
   ESPECÍFICA, e uma lista que se reordena a cada colheita faz procurar de novo.
   `ordem` acima é a única exceção, e ela existe porque uma linha vermelha
   embaixo de duas verdes é a única que precisa ser encontrada sem procurar. */
function porUrgencia(linhas) {
  return linhas
    .map((l, i) => ({ l, i }))
    .sort((a, b) => (ESTADO[a.l.estado].ordem - ESTADO[b.l.estado].ordem) || (a.i - b.i))
    .map(x => x.l);
}

/* ------------------------------------------------- o talhe por estado
   Ele existe porque o carimbo de frescor estava TRIPLICADO na mesma tela —
   topbar, slot direito do eyebrow e pé, com as duas primeiras a ~100px uma da
   outra. Três cópias de uma frase é o que faz um painel parecer montado por três
   pessoas, e aqui custava o único slot capaz de dizer algo que a tela ainda não
   dizia. Ficou UMA cópia, no `.meta` do topbar, e a defesa é mecânica e não de
   gosto: a topbar é `position: sticky`, então aquele carimbo está na tela
   INCLUSIVE quando você rola até o botão de conferir — uma segunda cópia no pé
   não estaria mais perto do botão, estaria ao lado da primeira. Somado a isso,
   `#stamp` é onde as outras quatro páginas põem o delas, então tirá-lo de lá
   faria esta ser a única sem carimbo no lugar onde ele é procurado.

   O que o pé carrega agora é de OUTRO fato: o que o botão faz e o que ele não
   faz. E este slot carrega o talhe, que nenhum outro lugar da tela diz.

   Singular e plural EXPLÍCITOS, nunca derivados: pôr "s" no fim produziu
   "3 chave ou segredos" na tela dos anexos, porque o português não flexiona no
   fim da frase. */
const CONTAGEM = {
  quebrou:    { um: "1 parada",          n: k => k + " paradas" },
  ok:         { um: "1 conectada",       n: k => k + " conectadas" },
  conferindo: { um: "1 sem resposta",    n: k => k + " sem resposta" },
  nunca:      { um: "1 nunca conectada", n: k => k + " nunca conectadas" }
};
function resumoEstados(linhas) {
  const c = {};
  for (const l of linhas) c[l.estado] = (c[l.estado] || 0) + 1;
  const partes = [];
  /* Ordem de urgência, a mesma intenção do `ESTADO.ordem`: o que parou é lido
     primeiro. */
  for (const k of ["quebrou", "ok", "conferindo", "nunca"]) {
    if (!c[k]) continue;
    partes.push(c[k] === 1 ? CONTAGEM[k].um : CONTAGEM[k].n(c[k]));
  }
  return partes.join(" · ");
}

/* ------------------------------------------------------- o estado do n8n
   A ORDEM DOS TESTES É A REGRA, não uma preferência de leitura:

   1. objeto ausente → `conferindo`. Um campo que não chegou nunca pode cair no
      branch negativo. Este repositório já pagou CINCO vezes por isso — o
      `docAgentes` acusando o arquivo do Kauan por causa de um processo Node
      velho, o `ingredientes.credenciais` mostrando zero credenciais num projeto
      antigo, o cinza do dossiê que não pode ler como vermelho, a `resolucao`
      ausente que não pode ler como "tudo está no fluxo aberto", e a trava do
      compositor. Aqui o branch negativo é o pior de todos: ele acusaria uma
      chave revogada por causa de um servidor velho.
   2. `configurado === false` → `nunca`, e ANTES do teste de `respondeu`: sem
      `.env` não houve pergunta, então `respondeu` é `null` e cairia em
      `conferindo` — "estou conferindo" para uma instância que não existe.
   3. `configurado` que não é exatamente `true` → `conferindo`. Não é `nunca`:
      `nunca` afirma que o `.env` está vazio, e isso é um fato que não chegou.
   4. `respondeu === true` → `ok`; `=== false` → `quebrou`; `null` ou ausente →
      `conferindo`. `null` significa *não perguntei nesta colheita* e `false`
      significa *perguntei e não respondeu* — as duas levam a decisões opostas. */
function estadoN8n(n) {
  if (!n || typeof n !== "object") return "conferindo";
  if (n.configurado === false) return "nunca";
  if (n.configurado !== true) return "conferindo";
  if (n.respondeu === true) return "ok";
  if (n.respondeu === false) return "quebrou";
  return "conferindo";
}

/* `conferindo` tem UM nome e TRÊS causas, e nenhuma delas é o cache.

   O CACHE NÃO CAI AQUI, e isso é uma correção do contrato: `checado: false`
   significa *esta colheita não perguntou de novo*, e ela vem COM o `respondeu`
   guardado — `true` ou `false`, nunca `null`. Um cache que devolvesse `null`
   serviria trinta segundos de ignorância depois de cada conferência bem
   sucedida, ou seja, existiria para desfazer a própria razão de existir (a
   chamada mediu 1,4 s). Cache é `ok` ou `quebrou` com idade; ver `frescor()`.

   Então `respondeu === null` sobrou com um sentido só: **não deu para
   perguntar** — e as três variantes dele mandam para lugares diferentes. Duas
   apontam para a NOSSA fiação, não para a instância dele, e a frase tem que
   dizer isso: acusar a configuração do Kauan por um defeito nosso é o que o
   `docAgentes` fez ao anunciar "não achei `tester-agentes.md`" com o arquivo de
   48KB no lugar. */
function porqueConferindo(n) {
  if (!n || typeof n !== "object") {
    return "O servidor que está rodando não devolveu o bloco do n8n. Provavelmente ele subiu antes desta versão — e <b>ausência de campo não é resposta negativa</b>, por isso esta linha não diz nem que está conectada nem que quebrou.";
  }
  if (n.configurado === null) {
    return "O módulo respondeu <code>configurado: null</code>: quem foi injetado nele <b>não expõe esse fato</b>. Isso é <b>fiação nossa</b>, não configuração sua — e é por isso que esta linha não afirma que falta <code>.env</code>.";
  }
  if (n.configurado !== true) {
    return "Não recebi se o <code>.env</code> tem as duas variáveis. Sem esse fato eu não tenho como dizer se falta configuração ou se falta leitura.";
  }
  return "O <code>.env</code> está configurado e <b>ainda assim não deu para perguntar</b>: o módulo do n8n que este processo injetou não tem <code>listWorkflows</code>. <b>Isso é defeito da nossa fiação, não da instância</b> — ela pode estar perfeitamente no ar.";
}

/* ------------------------------------------------- de onde vem esta colheita
   `doCache` e `idadeMs` são fato do topo, não do n8n, e mudam a LEITURA de
   qualquer linha: um `quebrou` guardado há 28 s pode já ter passado. Não muda o
   estado — o estado é o `respondeu` guardado, e inventar um quarto estado para
   "ok mas velho" seria dizer duas coisas com uma pista.

   AUSENTE É O TERCEIRO ESTADO: o cockpit que respondeu pode ter subido antes
   desta versão do módulo, e "não sei se perguntei agora" jamais pode virar
   "perguntei agora" — que é o branch que faria a tela apresentar fato velho
   como recém-colhido. */
function frescor(f) {
  const idade = f && typeof f.idadeMs === "number" && isFinite(f.idadeMs) ? f.idadeMs : null;
  if (!f || (f.doCache !== true && f.doCache !== false)) {
    return { cache: null,
      frase: "<b>Não sei se esta colheita perguntou agora ou veio do cache</b>: o campo não veio nesta resposta. Se estiver duvidando do que está escrito acima, clique em <b>Conferir de novo</b>." };
  }
  if (f.doCache === true) {
    return { cache: true,
      frase: "<b>Esta colheita não perguntou de novo</b>" + (idade !== null ? ", ela veio do cache <b>colhido há " + dur(idade) + "</b>" : ", ela veio do cache") +
        ". A resposta acima é a de antes — <b>guardada, não ignorada</b>. Clique em <b>Conferir de novo</b> para perguntar neste instante." };
  }
  return { cache: false,
    frase: "<b>Esta colheita perguntou agora</b> para a instância — o que está acima é a resposta deste instante." };
}

/* ------------------------------------------------- a frase da causa (§5)
   Três classes, e a terceira é o ponto: `401`/`403` com host respondendo É
   chave recusada; `5xx`, timeout ou erro de rede É instância fora do ar;
   QUALQUER OUTRA COISA diz que é ambígua em vez de escolher.

   Fail-closed, mesma disciplina do `REEXEC_AMBIGUO`: os dois erros não são
   simétricos. Chamar de "chave recusada" uma instância fora do ar manda gerar
   uma chave nova que não vai resolver nada; chamar de "fora do ar" uma chave
   revogada manda esperar uma instância que já está no ar. Errar para o lado do
   "não sei" custa uma conferência a mais; errar para o lado do palpite custa a
   confiança na tela, que é a única coisa que ela tem. */
const REDE = /\b(ETIMEDOUT|ENOTFOUND|ECONNREFUSED|ECONNRESET|EAI_AGAIN|EHOSTUNREACH|ENETUNREACH|EPIPE|UND_ERR_(?:CONNECT_TIMEOUT|SOCKET|HEADERS_TIMEOUT))\b|socket hang up|fetch failed|network(?: |-)?error|timed? ?out|timeout|tempo esgotado|abort(?:ed|error)?/i;

function causaN8n(n) {
  const s = n && typeof n.httpStatus === "number" ? n.httpStatus : null;
  const bruto = n && typeof n.erro === "string" ? n.erro : "";

  if (s === 401 || s === 403) {
    return {
      classe: "chave",
      frase: 'A chave foi <em>recusada</em>. O host respondeu — a instância está no ar e não aceitou esta chave.',
      oQue: "<b>" + s + " com o host respondendo é chave recusada.</b> Se fosse timeout ou 5xx a frase seria outra — instância fora do ar — e mandaria você para outro lugar.",
      caminho: "Gere uma chave nova no n8n e troque <code>N8N_API_KEY</code> no <code>.env</code>. Trocar o <code>.env</code> exige <b>reiniciar o cockpit</b>: o Node não relê o arquivo."
    };
  }
  if (s !== null && s >= 500 && s <= 599) {
    return {
      classe: "instancia",
      frase: 'A <em>instância não respondeu direito</em>. Não foi a chave: o outro lado devolveu ' + s + ', que é erro dele, não recusa de credencial.',
      oQue: "<b>" + s + " é a instância com problema.</b> Uma chave revogada volta como 401 ou 403; um 5xx nem chegou a olhar a chave.",
      caminho: "Não há nada para trocar aqui. Veja o status da instância no n8n Cloud e confira de novo em alguns minutos."
    };
  }
  if (s === null && REDE.test(bruto)) {
    return {
      classe: "instancia",
      frase: 'A <em>instância não respondeu</em>. Não foi a chave: nada do outro lado atendeu para aceitar ou recusar.',
      oQue: "<b>Não veio status HTTP nenhum</b>, e o erro tem forma de rede ou de timeout. Isso é anterior à autenticação — a chave nem foi lida.",
      caminho: "Confira se a instância está no ar e se esta máquina tem rede. Não gere chave nova: ela cairia no mesmo lugar."
    };
  }
  /* Nem 401/403, nem 5xx, nem forma de rede reconhecida. Pode ser um 4xx que
     não é de credencial, um corpo que não deu para ler, ou um erro cuja forma
     este código não conhece. Uma classe nova não pode entrar pela porta de trás
     de um `else` que já tem nome. */
  return {
    classe: "ambiguo",
    frase: '<em class="duvida">Não sei dizer qual das duas é.</em> A leitura falhou, e o que voltou não é 401/403 (chave recusada) nem 5xx/timeout (instância fora do ar).',
    oQue: "<b>Escolher uma das duas causas aqui te mandaria para o lugar errado</b>, então esta tela não escolhe. " +
      (s === null ? "Não veio status HTTP e o erro não tem forma de rede conhecida." : "Voltou HTTP " + s + ", que não é nenhuma das duas classes conhecidas."),
    caminho: "Confira as duas coisas: se a instância abre no navegador, e se a chave do <code>.env</code> ainda existe no n8n. A mensagem crua está na terceira célula."
  };
}

/* ─────────────────────────────────── a FORMA do que está guardado no cofre

   Isto existe porque `cofre-test.js` tem um alarme: enquanto nenhuma tela lesse
   `forma`, o aviso *"isso não tem cara de chave do n8n"* não existiria — existiria
   a INTENÇÃO dele. O caso fica vermelho no dia em que a tela passar a falar do
   cofre e não consumir o campo, e esse dia chegou. A referência que ele cita é o
   `escreveNoN8n`, que carregou uma afirmação falsa por muito tempo justamente
   porque ninguém lia o campo.

   A LISTA É FECHADA E É DO MÓDULO, não deduzida: `cofre.guardar` devolve
   `pareceChave(v) ? "jwt" : "estranha"` — duas palavras, e nada mais.

   AVISA E NUNCA RECUSA, que é a regra do próprio módulo. Uma chave que o n8n
   aceita e que não parece um JWT continua sendo a chave dela: quem diz se ela
   vale é o n8n, e o cofre nunca finge saber isso. Por isso o tipo é `alerta` e
   não `erro`, a frase relata o que foi OBSERVADO e não afirma que a chave está
   errada, e nada é bloqueado. Acusar quem está certo é exatamente como se ensina
   alguém a ignorar avisos — que é o oposto do que este aviso existe para fazer.

   QUATRO SILÊNCIOS, e cada um é uma decisão:
     sem bloco do cofre    → não há segunda fonte de chave nesta colheita;
     `temChave` não é true → `forma` não descreve nada, e avisar sobre um estado
                             normal é ruído;
     `forma` AUSENTE       → é *não sei*. Um cockpit que subiu antes do campo não
                             o emite, e nesta fatia esse é o caso COMUM. Ausente
                             não pode ler como estranha nem como boa — quarta vez
                             que este arquivo escreve a regra;
     `forma: "jwt"`        → reconhecida, e um aviso aqui gastaria a palavra.

   E uma palavra PRESENTE que esta tela não conhece não vira o alerta: dizer "não
   tem cara de chave" a partir de um termo que eu não sei ler seria acusar sem
   fato. Ela tem frase própria, e `info`, porque é sobre o vocabulário e não sobre
   a chave. */
const FORMA_CONHECIDA = ["jwt", "estranha"];

function avisoFormaChave(f) {
  const c = f && f.n8n && f.n8n.cofre;
  if (!c || typeof c !== "object") return null;
  if (c.temChave !== true) return null;
  const forma = typeof c.forma === "string" && c.forma.trim() ? c.forma.trim() : null;
  if (forma === null) return null;
  if (forma === "jwt") return null;
  if (!FORMA_CONHECIDA.includes(forma)) {
    return { tipo: "info", titulo: "uma palavra que eu não conheço",
      texto: "O cofre disse que a forma do que está guardado é <b>" + esc(forma) + "</b>, e <b>esta tela não sabe ler " +
        "essa palavra</b>. <b>Não digo nada sobre a chave a partir de um termo que eu não conheço</b> — as formas que " +
        "eu sei ler são <code>jwt</code> e <code>estranha</code>." };
  }
  return { tipo: "alerta", titulo: "a chave guardada não parece um JWT",
    texto: "<b>O que está guardado no cofre não tem cara de chave do n8n.</b> Uma chave desta instância é um JWT — " +
      "três pedaços separados por ponto, começando em <code>eyJ</code> —, e isto não é. " +
      "<b>Isto não quer dizer que ela está errada</b>: quem decide se a chave vale é o n8n, e esta tela não decide. " +
      "<b>Nada foi recusado e nada foi bloqueado</b> — o cofre guardou. Vale conferir se você não colou o endereço da " +
      "instância no lugar da chave, que é o engano que produz exatamente esta forma." };
}

/* ------------------------------------------------- o que para em consequência
   Sem leitura do n8n a vitrine fica vazia, o feed para, o quadro de erros fica
   cego, e correção, dossiê e upgrade não abrem — porque nenhum dos três sabe o
   fluxo sem esta leitura. Só aparece quando algo está de fato parado: listar
   consequências embaixo de uma linha saudável é ruído, e ruído numa tela de
   diagnóstico ensina a ignorar a tela. */
const PARA_SEM_N8N = "<b>Vitrine vazia, feed parado, quadro de erros cego.</b> Correção, dossiê e upgrade não abrem: nenhum dos três sabe o fluxo sem esta leitura.";
const PARA_TALVEZ_N8N = "Se a leitura não estiver acontecendo, <b>a vitrine, o feed e o quadro de erros ficam sem fato novo</b> — e as telas que dependem do fluxo não abrem. Enquanto eu não sei, não afirmo que pararam.";

function oQuePara(estado) {
  if (estado === "ok") return null;
  if (estado === "conferindo") return PARA_TALVEZ_N8N;
  return PARA_SEM_N8N;
}

/* ------------------------------------------------- o estado da CLI do Claude
   ESTA LINHA NÃO SAI MAIS DE `cliAchada`, e essa é a correção inteira. Achar o
   binário no disco é `fs.existsSync`; estar logado é outro fato. Na máquina do
   Kauan os dois coincidem e nunca incomodou — na máquina de um estranho,
   "instalei e nunca loguei" virava <b>CONECTADA</b> na tela e a primeira
   construção morria com um erro que não nomeava nada. A tela afirmava o segundo
   fato a partir do primeiro.

   A ORDEM DOS TESTES É A REGRA:

   1. bloco ausente → `conferindo`.
   2. `cliAchada === false` → `nunca`, e ANTES de olhar `logado`: sem CLI no
      disco não há o que logar, e o módulo devolve `logado: null` justamente
      nesse caso. Sem esta precedência, "não instalada" leria como "não deu para
      perguntar".
   3. `cliAchada` que não é `true` → `conferindo`. Não é `nunca`: `nunca`
      afirmaria que não há CLI, e isso é um fato que não chegou.
   4. `logado === true` → `ok`; `=== false` → `nunca`; `null` ou AUSENTE →
      `conferindo`.

   `logado === false` é `nunca` e NÃO `quebrou`, pelo mesmo motivo que
   `cliAchada: false` já era: `quebrou` significa que existia e deixou de
   funcionar — tem causa, tem "última vez que funcionou", tem regressão. Ninguém
   ter feito login nunca não é uma regressão; é uma conexão que nunca existiu.

   E `logado` AUSENTE é `conferindo`, o que faz um cockpit velho parar de dizer
   CONECTADA nesta linha. É de propósito: o cockpit velho não pergunta login, e
   `CONECTADA` agora quer dizer *logada*. Manter o verde ali seria exatamente a
   afirmação que esta fatia veio desfazer, agora escrita por nós. */
function estadoClaude(c) {
  if (!c || typeof c !== "object") return "conferindo";
  if (c.cliAchada === false) return "nunca";
  if (c.cliAchada !== true) return "conferindo";
  if (c.logado === true) return "ok";
  if (c.logado === false) return "nunca";
  return "conferindo";
}

/* ------------------------------------------------- de qual cota sai o gasto
   O mockup afirmava «Assinatura, por OAuth — plano team» e «Nenhum cartão é
   cobrado nesta rota», e a fatia 1 se RECUSOU a imprimir porque o fato não vinha
   na colheita. Agora vem, em `rota` e `plano`, e a recusa vira frase.

   `claude.ai` é a ÚNICA rota que esta tela sabe traduzir, e isso é fail-closed
   deliberado: a segunda leitura possível de uma rota qualquer é crédito de API,
   ou seja cartão. Errar para o lado do "não sei" custa uma conferência; errar
   para o lado do palpite escreve na tela que ninguém está pagando quando alguém
   está. Rota desconhecida sai NOMEADA e sem tradução.

   Rota ausente com `logado: true` também não vira `claude.ai` por conveniência:
   o campo pode faltar num cockpit velho, e é o sexto lugar deste arquivo onde
   ausente não pode cair no ramo que afirma. */
const ROTA_ASSINATURA = "claude.ai";

function rotaFrase(c) {
  const rota  = c && typeof c.rota  === "string" && c.rota.trim()  ? c.rota.trim()  : null;
  const plano = c && typeof c.plano === "string" && c.plano.trim() ? c.plano.trim() : null;
  const noPlano = plano ? ", no plano <b>" + esc(plano) + "</b>" : "";

  if (rota === null) {
    return "<b>Está logada</b> — foi o próprio CLI que respondeu isso, e é por isso que esta linha diz conectada. " +
      "<b>Por qual rota ela autentica, eu não sei</b>: o campo não veio nesta colheita" +
      (plano ? ", e o plano que veio (<b>" + esc(plano) + "</b>) sozinho não diz de qual cota sai o gasto" : "") +
      " — então esta tela <b>não afirma quem paga</b>.";
  }
  if (rota === ROTA_ASSINATURA) {
    return "<b>Está logada</b>, e autentica por <b>" + esc(rota) + "</b>: o gasto de toda ação do painel sai da " +
      "<b>assinatura desta conta</b>" + noPlano + " — a mesma cota de uma sessão interativa. " +
      "<b>Nenhum cartão é cobrado nesta rota.</b>" +
      (plano ? "" : " Qual plano, não sei: o campo não veio.");
  }
  return "<b>Está logada</b>, e autentica por <b>" + esc(rota) + "</b>" + noPlano + ". " +
    "<b>A única rota que esta tela sabe traduzir é <code>" + ROTA_ASSINATURA + "</code></b>, então para esta aqui ela " +
    "<b>não diz de qual cota sai o gasto</b> — a outra leitura possível é crédito de API, e chutar entre assinatura e " +
    "cartão é o pior lugar deste painel para chutar.";
}

/* Conta e organização: é a máquina dela, e é assim que ela confere que é a conta
   certa. As duas saem `sens`, igual ao host da instância — o modo gravação borra,
   porque uma filmagem não publica em nome de quem o painel está autenticado. */
function contaFrase(c) {
  const conta = c && typeof c.conta === "string" && c.conta.trim() ? c.conta.trim() : null;
  const org   = c && typeof c.org   === "string" && c.org.trim()   ? c.org.trim()   : null;
  if (!conta && !org) {
    return "Não veio nesta colheita. <b>Que está logada eu sei; em qual conta, não</b> — e eu não preencho o que não recebi.";
  }
  let h = "";
  if (conta) h += '<b class="sens">' + esc(conta) + "</b>";
  if (conta && org) h += " · ";
  if (org) h += '<span class="sens">' + esc(org) + "</span>";
  h += "<br>" + (conta && org
    ? "É por aqui que você confere que é a conta certa."
    : "Só uma metade do par veio nesta colheita.");
  return h + " O <b>modo gravação borra</b>, igual ao endereço da instância.";
}

/* `conferindo` na linha do Claude tem QUATRO causas, e nenhuma delas pode ler
   como "não está logada". O módulo já manda a específica em `porqueNaoSei` —
   reescrevê-la aqui seria uma segunda definição do mesmo fato, e a que
   divergisse seria a que ninguém olhou.

   O caso em que ele NÃO manda motivo nenhum é o cockpit velho: os seis campos
   simplesmente não existem na resposta. Aí a frase é nossa, e ela aponta para o
   processo Node, não para a instalação dela — acusar a máquina do outro por um
   defeito nosso é o que o `docAgentes` fez ao anunciar "não achei
   `tester-agentes.md`" com o arquivo de 48KB no lugar. */
function porqueClaudeConferindo(c) {
  if (!c || typeof c !== "object") {
    return "Não recebi o bloco do Claude. <b>Ausência de campo não é resposta</b> — esta linha não afirma nada nem oferece nada até a colheita chegar.";
  }
  if (c.cliAchada !== true) {
    return "Não recebi se a CLI foi achada. <b>«não achei» e «ainda não olhei» são duas frases diferentes</b> — esta é a segunda, e por isso ela não afirma nada nem oferece nada até a resposta chegar.";
  }
  const motivo = typeof c.porqueNaoSei === "string" && c.porqueNaoSei.trim() ? c.porqueNaoSei.trim() : null;
  const base = "<b>Achei a CLI no disco e não sei se alguém fez login nela.</b> São dois fatos, e o binário existir não prova sessão nenhuma. " +
    "<b>Isto não é «não está logada»</b> — é «não perguntei, ou perguntei e não obtive resposta».";
  if (motivo) return base + " O módulo disse: <b>" + esc(motivo) + "</b>";
  return base + " E o motivo também não veio: <b>o cockpit que está rodando subiu antes da versão que pergunta login</b>. " +
    "O Node não relê o <code>server.js</code> — feche a janela do cockpit e abra de novo.";
}

/* O que continua funcionando sem rodada automática do Claude. UMA definição,
   usada pelos DOIS motivos de `nunca` (não instalada, e instalada sem login):
   duas cópias divergiriam na primeira correção feita num lado só. */
const PARA_SEM_CLAUDE = "<b>O painel continua servindo</b>: o «Mandar pro Claude» cai no handoff por clipboard <b>e diz por quê</b>, nunca finge que uma sessão rodou. O que não existe é a rodada automática que escreve o patch, roda os gates e monta o diff.";

/* ------------------------------------------------- o estado do Codex
   `nunca`, e sem botão de conectar: oferecer um botão para um caminho que não
   existe é a pretensão que este repositório recusa. A frase é a do módulo
   (`porque`) — reescrevê-la aqui seria uma segunda definição do mesmo fato, e a
   que divergisse seria a que ninguém olhou. Ausente é `conferindo`, nunca
   `nunca`: "o cockpit não sabe chamar o Codex" é uma afirmação, e afirmação sem
   fato que a sustente é exatamente o que esta tela não faz. */
function estadoCodex(cx) {
  if (!cx || typeof cx !== "object") return "conferindo";
  if (cx.integrado === false) return "nunca";
  if (cx.integrado === true) return "ok";
  return "conferindo";
}

const CODEX_SEM_PORQUE = "O módulo não mandou o motivo. O fato que eu tenho é só que não há integração — <b>e eu não invento a explicação</b>.";

/* ─── A LINHA DO CODEX E O CARTÃO DE IA FALAM DO MESMO NOME, E NÃO DO MESMO FATO.
   Isto entrou porque a chegada do bloco `ia` deixou uma frase DESTA PÁGINA
   medivelmente falsa. O pé desta linha dizia «não há spawn, não há detecção, não
   há variável de ambiente» — e o `ia.js`, que agora responde nesta mesma
   colheita, declara `CODEX_BIN` e sabe procurar o binário. Duas frases numa tela
   só, uma negando o que a outra imprime dez centímetros abaixo.

   Os dois fatos são verdadeiros e são de coisas diferentes: o que NÃO existe é
   caminho de AÇÃO (nenhum dos cinco trabalhos do painel abre o Codex); o que
   existe é a POLÍTICA, que conhece o nome do CLI e o recusa por cerca. Deixar o
   leitor descobrir sozinho que as duas convivem é o mesmo que deixá-lo achar que
   uma delas está errada — e a tela perde exatamente a coisa que ela tem.

   Fala só quando há o par para reconciliar: `ia` ausente não ganha frase nova,
   porque aí não há segunda voz na tela e o silêncio é o estado de antes, não um
   galho negativo. */
function codexReconciliar(f) {
  const fonte = iaFonte(f);
  if (!fonte.doServidor) return null;
  const p = fonte.provedores.find(x => x.id === "codex");
  if (!p) return null;
  return "e há um segundo fato sobre o mesmo nome, logo abaixo: a política de IA deste cockpit <b>conhece</b> " +
    "o " + esc(p.rotulo) + " e o <b>" + (p.aceito ? "aceita" : "recusa") + "</b>. " +
    "<b>Não é contradição</b>: o que não existe é <b>caminho de ação</b> — nenhum dos cinco trabalhos do painel " +
    "abre o Codex —, e o que existe é a <b>regra que decidiria qual CLI rodar</b> se houvesse.";
}

/* Quantos fluxos, e — a parte que decide a frase — se aquilo é PISO ou TOTAL.
   O módulo responde `parcial`, então a página não precisa mais afirmar piso em
   todo caso: dizer "piso" quando a leitura foi completa gasta a palavra e ensina
   a ignorá-la, e dizer "total" quando ela bateu no teto é o defeito que a
   varredura truncada do `/disco` já documenta — um número que parece completo e
   não é vale menos que nenhum.

   Três estados, e o ausente NÃO cai no positivo: `parcial` que não veio é *não
   sei se a leitura foi completa*, jamais *foi completa*. E `parcial` é uma
   AFIRMAÇÃO SOBRE A LEITURA, não escritura: o próprio módulo a infere de uma
   constante de teto duplicada do `n8n.js`, então a frase diz "bateu no teto",
   que é o que foi medido, e não "a instância tem mais". */
function fluxosFrase(n) {
  if (!n || typeof n.fluxos !== "number") return "Não sei quantos fluxos ela tem: o número não veio nesta colheita.";
  const quantos = "<b>" + num(n.fluxos) + " fluxo" + (n.fluxos === 1 ? "" : "s") + " lidos</b>";
  const teto = typeof n.teto === "number" ? " (teto de " + num(n.teto) + ")" : "";
  if (n.parcial === true) return quantos + " — <b>piso, não total</b>: a leitura bateu no teto" + teto + " e parou, então a instância pode ter mais.";
  if (n.parcial === false) return quantos + ", e a leitura foi completa: <b>é o que a instância tem</b>.";
  return quantos + ". <b>Não sei se a leitura foi completa</b> — o campo que diria isso não veio, então trate o número como piso até saber.";
}

/* O carimbo de frescor sai do payload (`em`), NUNCA de `new Date()`. Um relógio
   vivo sobre dado velho prova que a página está viva, jamais que o dado está.

   E ele carrega SÓ O INSTANTE. A primeira versão colava a origem aqui também
   ("· do cache, há 20,9 s") porque um `em` congelado num acerto de cache lido ao
   lado de um botão de conferir parece um relógio travado — mas isso punha o
   MESMO FATO duas vezes na tela, já que a linha do n8n explica a origem por
   inteiro no `.pe` dela («veio do cache colhido há 20,9 s. A resposta acima é a
   de antes — guardada, não ignorada»). Um fato, um lugar: o topbar diz QUANDO,
   a linha diz DE ONDE e O QUE ISSO SIGNIFICA — e as duas estão na mesma tela,
   então o medo do relógio travado continua respondido. */
function selo(f) {
  const q = quando(f && f.em);
  return q ? "conferido " + q : "sem carimbo de colheita";
}

/* O que o `COCKPIT_SANDBOX_TEST` desligado significa, dito como ausência de
   pergunta e não como aprovação: "não perguntei ao n8n se ele aceita o JSON" e
   "perguntei e ele aceitou" autorizam decisões opostas. */
function sandboxFrase(c) {
  if (!c || typeof c.sandbox !== "boolean") return "Não sei se o teste na instância está ligado — o campo não veio.";
  return c.sandbox
    ? "<b>Ligado.</b> Antes de você aprovar, a proposta é escrita numa cópia inativa e sem credencial, só para provar que o n8n aceita o JSON."
    : "<b>Desligado</b> (o padrão). Ninguém perguntou ao n8n se ele aceita o JSON da proposta — e isso é diferente de ele ter aceitado.";
}

/* ---------------------------------------------- as três linhas, como descritor
   Estas três funções são JUÍZO: elas escolhem o estado, a etiqueta e cada frase.
   O que vem depois do bloco só desenha o objeto que elas devolvem. */

function linhaN8n(f) {
  const n = f && f.n8n;
  const est = estadoN8n(n);
  const fr = frescor(f);
  const host = n && typeof n.instancia === "string" && n.instancia ? n.instancia : null;
  const L = {
    id: "n8n",

    sub: "a instância que o cockpit lê — fluxos, execuções e falhas",
    estado: est,
    link: host ? { texto: "abrir a instância ↗", href: "https://" + host } : null,
    fatos: [],
    conferindo: null,
    diag: null,
    pe: null
  };

  if (est === "quebrou") {
    const c = causaN8n(n);
    L.diag = c.frase;
    L.fatos = [
      { lb: "o que aconteceu", html: c.oQue },
      { lb: "o que fazer com isso", html: c.caminho },
      { lb: "o que para enquanto isso", html: PARA_SEM_N8N }
    ];
    /* A origem da colheita entra na MESMA linha da resposta crua, e numa linha
       vermelha ela é o fato mais fácil de esquecer: um `respondeu: false`
       guardado pode já ter passado, e sem isto a tela acusaria uma instância
       que voltou. */
    L.pe = "resposta da instância: " + (typeof n.httpStatus === "number" ? "<b>HTTP " + n.httpStatus + "</b>" : "<b>sem status HTTP</b>") +
      (typeof n.ms === "number" ? " · <b>" + dur(n.ms) + "</b>" : "") +
      (n.erro ? ' · mensagem crua: <b class="sens">' + esc(n.erro) + "</b>" : " · sem mensagem") +
      "<br>" + fr.frase;
  } else if (est === "ok") {
    L.fatos = [
      { lb: "o que ela responde", html: fluxosFrase(n) + (typeof n.ms === "number" ? " Levou <b>" + dur(n.ms) + "</b>." : "") },
      { lb: "o que a chave pode fazer", html: "<b>Ler</b> fluxos e execuções. Escrever é sempre um diff que você aprovou na tela, com backup salvo antes e <b>↺ desfazer</b> depois — <b>e a chave nunca sai deste processo</b>." },

    ];

  } else if (est === "nunca") {
    L.fatos = [
      { lb: "o que falta", html: "O <code>.env</code> não tem <code>N8N_BASE_URL</code> e <code>N8N_API_KEY</code>. <b>Sem as duas o cockpit não pergunta nada</b> — não é recusa, é ausência de configuração." },
      { lb: "onde isso é escrito", html: "No arquivo <code>.env</code>, ao lado do <code>server.js</code>. <b>Esta tela não escreve lá</b>, e depois de editar é preciso <b>reiniciar o cockpit</b>: o Node não relê o arquivo." },
      { lb: "o que para enquanto isso", html: PARA_SEM_N8N }
    ];
    L.pe = "o <code>/disco</code> continua funcionando sem isto: ele lê a pasta de projetos, não o n8n.";
  } else {
    L.conferindo = porqueConferindo(n);
    L.fatos = [{ lb: "o que para enquanto isso", html: PARA_TALVEZ_N8N }];
    /* O módulo manda `erro` também aqui, e nesta situação ele nomeia a NOSSA
       fiação («o módulo n8n injetado não expõe listWorkflows»). Esconder isso
       deixaria a frase acima parecendo palpite quando ela tem uma mensagem
       exata atrás. `sens` do mesmo jeito: é mensagem crua, e crua é hostil. */
    if (n && typeof n.erro === "string" && n.erro) {
      L.pe = 'o módulo disse: <b class="sens">' + esc(n.erro) + "</b>";
    }
  }
  /* O aviso da forma é ANCORADO nesta linha, e é aqui porque é aqui que a chave
     mora — não na pilha flutuante do canto. Um erro que pertence a um lugar fica
     nele, e a chave é assunto desta linha em QUALQUER dos quatro estados: uma
     chave com forma estranha guardada no cofre continua sendo o que vai sair na
     próxima requisição, mesmo com a instância respondendo bem agora. */
  L.aviso = avisoFormaChave(f);
  return L;
}

       Não vai no `.diag` — aquele tamanho é da linha QUEBRADA e só dela, senão

    L.corpo = rotaFrase(c);

    ];

  } else if (est === "nunca" && c && c.cliAchada === true) {
    /* INSTALADA E SEM LOGIN. Este é o estado que a fatia 1 não sabia enxergar, e
       ele NÃO pode ler igual a "não achei a CLI": lá não há nada para fazer sem
       instalar, aqui está a um comando de distância.

       Ele empresta a gramática fria do `nunca` (barra tracejada, fundo hachurado,
       glifo de cruz em anel) porque é isso que ele é — uma conexão que nunca
       existiu, sem regressão nenhuma. O que o separa do outro `nunca` não gasta
       cor nenhuma: a ETIQUETA diz outra palavra, e a linha ganha as três células
       de fato que a outra não tem. */
    L.tag = "SEM LOGIN";
    L.corpo = "A CLI está nesta máquina e <b>ninguém fez login nela</b>. <b>Nada quebrou</b> — ela nunca esteve conectada por este caminho. " +
      "<b>Instalada e logada são dois fatos</b>, e até esta versão o painel afirmava o segundo a partir do primeiro.";
    L.fatos = [
      { lb: "o que fazer com isso", html: "Rode <code>claude login</code> num terminal e siga o fluxo no navegador. Depois clique em <b>Conferir de novo</b> aqui. <b>Esta tela não faz login por você</b>: ela só lê." },
      { lb: "onde ela está", html: (c.caminho ? '<code class="sens caminho">' + esc(c.caminho) + "</code>" : "<b>O caminho não veio nesta colheita.</b>") + "<br>O binário existe — é a sessão que falta." },
      { lb: "o que para enquanto isso", html: PARA_SEM_CLAUDE }
    ];
    L.pe = "quem respondeu isto foi o próprio CLI (<code>claude auth status</code>), <b>não o arquivo de credencial</b> — esta tela não abre <code>~/.claude/.credentials.json</code>.";
  } else if (est === "nunca") {
    L.corpo = "O cockpit não achou a CLI do Claude nesta máquina. <b>Nada quebrou</b> — ela nunca esteve conectada por este caminho, e <b>sem CLI no disco não há o que perguntar sobre login</b>: por isso esta linha não diz que ela está deslogada. " + PARA_SEM_CLAUDE;

  } else {
    L.conferindo = porqueClaudeConferindo(c);
    /* O caminho é o único fato que esta linha TEM quando não sabe do login, e
       mostrá-lo é o que impede a frase acima de parecer palpite. Só existe
       quando a CLI foi achada — no `conferindo` de `cliAchada` ausente não há
       caminho nenhum para mostrar. */
    if (c && c.cliAchada === true && typeof c.caminho === "string" && c.caminho) {

    }

  return L;
}

function linhaCodex(f) {

const VERDADE = [

/* Um botão que não faz nada é pior que nenhum botão. O mockup tinha
   `Reconectar com outra chave`, `Trocar a chave`, `Desconectar` e `Conectar`, e
   por três fatias nenhum deles existiu aqui — não havia caminho de escrita para
   eles chamarem.

   ISSO MUDOU na fatia 4, e só para UM deles: existe onde colar a chave do n8n, e
   os botões são `Guardar` e `Apagar do cofre`. Os outros três continuam sem
   existir, e os nomes são deliberados: "Desconectar" prometeria desligar do n8n,

   Esta constante segue descrevendo o botão do rodapé, que continua não

const SO_UM_CONTROLE = "refaz a colheita e não escreve nada";

/* ════════════════════════════════════════════════ O COFRE DA CHAVE (fatia 4)
   ─────────────────────────────────────────────────────────────────────────────
   Esta é a PRIMEIRA escrita desta tela, e o comentário acima deixou de valer
   para ela — os botões existem agora porque existe caminho de escrita atrás
   deles. `Conectar`, `Trocar a chave` e `Desconectar` continuam sem existir com
   esses nomes: aqui é `Guardar` e `Apagar do cofre`, porque é o que eles fazem.
   "Desconectar" prometeria desligar do n8n, e nada aqui desliga de nada.

   O QUE ESTA SEÇÃO É: um lugar para colar a chave sem abrir editor de texto. O
   `cofre.js` cifra com o DPAPI do Windows, que amarra o segredo à CONTA DE
   WINDOWS de quem cifrou — arquivo copiado para outra máquina não decifra.

   O QUE ELA NÃO É, e a tela diz as três:
     1. não protege contra outro processo rodando na MESMA conta de Windows —
        é o teto da primitiva, declarado no cabeçalho do `cofre.js`;
     2. guardar aqui NÃO REVOGA a chave antiga no n8n. Ela continua valendo na
        instância para sempre, até alguém ir lá apagá-la — e o motivo de trocar
        é quase sempre vazamento, caso em que trocar só aqui não fecha porta
        nenhuma;
     3. não valida a chave. Quem diz se ela presta é o n8n, na próxima colheita.

   A (2) é obrigação escrita no `cofre.js`: *"a tela que chamar `guardar()` tem
   obrigação de dizer isso"*. Ela chega como o campo `revogacaoManual` da
   resposta — como CAMPO, e não como prosa, justamente para a ausência do
   consumidor ser aferível por teste. */

/* Os quatro estados do cofre, no mesmo vocabulário das três conexões. `abriu`
   tem três valores no fato e é ele que decide — `null` não é `false`. */
function estadoCofre(k) {
  if (!k || typeof k !== "object" || !k.cofre) return "conferindo";
  const c = k.cofre;
  if (c.disponivel !== true) return "indisponivel";
  /* Existe cofre e ele NÃO abriu. NUNCA confundir com "não tem chave": um cofre
     que veio de outra máquina ou de outra conta do Windows não decifra aqui, por
     desenho, e a saída é colar a chave de novo — não é procurar defeito. */
  if (c.temChave === true && c.abriu === false) return "quebrou";
  if (c.temChave === true) return "ok";
  return "vazio";
}

const COFRE_FRASE = {
  conferindo: "Ainda não li o estado do cofre.",
  indisponivel: "O cofre usa o DPAPI do Windows e não está disponível aqui — a chave continua vindo do <code>.env</code>.",
  vazio: "Nada guardado no cofre. Cole a chave abaixo e ela passa a viver cifrada, fora da pasta do cockpit.",
  ok: "A chave está no cofre, cifrada pelo DPAPI desta conta do Windows.",
  quebrou: "Existe um cofre e ele <b>não abriu</b>. Isso <b>não</b> é o mesmo que não ter chave: um cofre de outra máquina, ou de outra conta do Windows, não decifra aqui — por desenho. Cole a chave de novo."
};

const COFRE_TAG = { conferindo: "cold", indisponivel: "cold", vazio: "warn", ok: "ok", quebrou: "risk" };

/* De onde a chave está vindo AGORA. É outro fato que o do cofre: dá para ter
   chave no cofre e o painel estar usando a do `.env` (não dá, com a ordem atual,
   mas a ordem viaja no fato em vez de ser suposta aqui — o dia em que ela mudar,
   esta frase continua verdadeira). */
function fonteFrase(k) {
  if (!k || typeof k !== "object") return "Não sei de onde a chave está vindo.";
  if (k.fonte === "cofre") return "A chave em uso agora vem do <b>cofre</b>.";
  if (k.fonte === "env") return "A chave em uso agora vem do <b><code>.env</code></b>, em texto puro, dentro da pasta do cockpit.";
  if (k.configurado === false) return "Não há chave nenhuma configurada — nem no cofre, nem no <code>.env</code>.";
  return "Não sei de onde a chave está vindo.";
}

   do cofre: guardar aqui é substituição, nunca rotação. */
const COFRE_REVOGA =
