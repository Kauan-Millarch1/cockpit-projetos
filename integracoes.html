<title>Cockpit — Integrações</title>
<!-- Favicon PRÓPRIO, e a ausência do `/aba.js` aqui é decisão, não esquecimento.
     Aquele arquivo é o aviso de um trabalho que leva minutos (um build do Tester)
     e ele planta um botão "Avisar" no topbar. Esta tela não tem trabalho longo
     nenhum: um botão prometendo notificar sobre um build que não está nesta tela
     seria controle sem assunto. Sem ele a página ficaria com o globo genérico do
     Chrome, então o ícone é um SVG embutido — dois nós e um fio, o mesmo
     vocabulário monocromático do resto, com o laranja de identidade. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306060B'/%3E%3Cpath d='M9 16h14' stroke='%23FF5A1F' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='16' r='3.4' fill='%23FF5A1F'/%3E%3Ccircle cx='24' cy='16' r='3.4' fill='none' stroke='%23FF5A1F' stroke-width='2.4' stroke-dasharray='3 2.6'/%3E%3C/svg%3E">
<style>

/* ==========================================================================
   TOKENS
   Dark is the house style (Panda Video: near-black navy, electric indigo).
   Light is the same instrument rendered as a blueprint (Firecrawl: paper white,
   hairline grid, mono annotations). Both are first-class; the toggle wins in
   either direction because :root[data-theme] is declared after the media query.
   ========================================================================== */
:root {
  --bg:        #06060B;
  --bg-deep:   #040408;
  --surface:   #0E0F1A;
  --surface-2: #14162454;
  --raised:    #171A2B;
  --line:      rgba(255,255,255,.09);
  --line-soft: rgba(255,255,255,.05);
  --grid:      rgba(255,255,255,.028);
  --grid-bold: rgba(255,255,255,.055);

  --txt:       #E9EBF5;
  --txt-dim:   #AAAFC2;
  --txt-faint: #777D92;   /* 4.5:1 no PIOR fundo, não no mais fácil */

  --accent:      #5865F5;
  --accent-soft: #5865F51f;
  --accent-line: #5865F55c;
  --brand:       #FF5A1F;   /* identity only: wordmark, section index, sparkles */

  /* RESERVED. Status only — never a chart series, never a node-kind tint. */
  --ok:    #2FD48F;
  --warn:  #F5A524;
  --risk:  #FF4F5E;
  --cold:  #59617D;
  --ok-soft:   #2FD48F1a;
  --warn-soft: #F5A5241a;
  --risk-soft: #FF4F5E1a;
  --cold-soft: #59617D1a;

  /* Segundo conjunto, SÓ para cor de texto — a divisão fill-vs-text que o resto
     do produto já segue. Reusar o token de preenchimento em texto de 12px
     reprova o AA; onde a cor original já passava, o par é o mesmo valor. */
  --ok-txt:     #2FD48F;
  --warn-txt:   #F5A524;
  --risk-txt:   #FF4F5E;
  --cold-txt:   #798096;
  --accent-txt: #606CF5;
  --brand-txt:  #FF5A1F;

  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);

  --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  --font-num: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #FAFAF9; --bg-deep: #F4F4F2; --surface: #FFFFFF; --surface-2: #00000005;
    --raised: #FFFFFF;
    --line: rgba(10,10,20,.11); --line-soft: rgba(10,10,20,.06);
    --grid: rgba(10,10,20,.045); --grid-bold: rgba(10,10,20,.08);
    --txt: #14151C; --txt-dim: #3F424D; --txt-faint: #666973;
    --accent: #3B48E0; --accent-soft: #3B48E014; --accent-line: #3B48E055;
    --ok: #0E9F6E; --warn: #B7791F; --risk: #DC2B3A; --cold: #8B90A0;
    --ok-soft: #0E9F6E14; --warn-soft: #B7791F14; --risk-soft: #DC2B3A14; --cold-soft: #8B90A014;
    --ok-txt: #0B8159; --warn-txt: #9A661A; --risk-txt: #D02937; --cold-txt: #6D717E;
    --accent-txt: #3B48E0; --brand-txt: #D04919;
    --shadow: 0 1px 2px rgba(10,10,20,.04), 0 12px 28px -22px rgba(10,10,20,.28);
  }
}
:root[data-theme="dark"] {
  --bg: #06060B; --bg-deep: #040408; --surface: #0E0F1A; --surface-2: #14162454; --raised: #171A2B;
  --line: rgba(255,255,255,.09); --line-soft: rgba(255,255,255,.05);
  --grid: rgba(255,255,255,.028); --grid-bold: rgba(255,255,255,.055);
  --txt: #E9EBF5; --txt-dim: #AAAFC2; --txt-faint: #777D92;
  --accent: #5865F5; --accent-soft: #5865F51f; --accent-line: #5865F55c;
  --ok: #2FD48F; --warn: #F5A524; --risk: #FF4F5E; --cold: #59617D;
  --ok-soft: #2FD48F1a; --warn-soft: #F5A5241a; --risk-soft: #FF4F5E1a; --cold-soft: #59617D1a;
  --ok-txt: #2FD48F; --warn-txt: #F5A524; --risk-txt: #FF4F5E; --cold-txt: #798096;
  --accent-txt: #606CF5; --brand-txt: #FF5A1F;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);
}
:root[data-theme="light"] {
  --bg: #FAFAF9; --bg-deep: #F4F4F2; --surface: #FFFFFF; --surface-2: #00000005; --raised: #FFFFFF;
  --line: rgba(10,10,20,.11); --line-soft: rgba(10,10,20,.06);
  --grid: rgba(10,10,20,.045); --grid-bold: rgba(10,10,20,.08);
  --txt: #14151C; --txt-dim: #3F424D; --txt-faint: #666973;
  --accent: #3B48E0; --accent-soft: #3B48E014; --accent-line: #3B48E055;
  --ok: #0E9F6E; --warn: #B7791F; --risk: #DC2B3A; --cold: #8B90A0;
  --ok-soft: #0E9F6E14; --warn-soft: #B7791F14; --risk-soft: #DC2B3A14; --cold-soft: #8B90A014;
  --ok-txt: #0B8159; --warn-txt: #9A661A; --risk-txt: #D02937; --cold-txt: #6D717E;
  --accent-txt: #3B48E0; --brand-txt: #D04919;
  --shadow: 0 1px 2px rgba(10,10,20,.04), 0 12px 28px -22px rgba(10,10,20,.28);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--txt); font-family: var(--font);
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
button { font-family: inherit; }

/* ------------------------------------------------------- blueprint backdrop */
/* `overflow: hidden` porque o feixe da malha viaja para fora da caixa e a
   camada é `position: fixed` — que o `overflow-x: hidden` do body não recorta.
   Sem isso a decoração do fundo cria rolagem horizontal na página. */
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.backdrop::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 30%, transparent 78%);
}
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 45% at 50% -12%, var(--accent-soft), transparent 70%);
}
.backdrop .gbeam {
  position: absolute; left: -30%; width: 60%; height: 1px; top: 22%;
  background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
  filter: blur(.4px); opacity: .55;
  animation: gbeam 13s cubic-bezier(.4,0,.25,1) infinite;
}
.backdrop .gbeam.b2 { top: 61%; animation-duration: 19s; animation-delay: 5s; opacity: .35; }
@keyframes gbeam { 0% { transform: translateX(0); } 100% { transform: translateX(250%); } }

/* ------------------------------------------------------------------- topbar */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 0 22px; height: 58px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.02em; }
.brand .flame { color: var(--brand); display: grid; place-items: center; }
.brand .wm { font-size: 15px; margin: 0; font-weight: 700; line-height: 1.45; }
.brand .wm b { color: var(--txt); }
.brand .wm span { color: var(--txt-faint); font-weight: 500; }

/* ------------------------------------------------------- a logo da empresa
   Bloco transcrito do `upgrade.html`. Altura 32px porque foi MEDIDO: o arquivo
   é um lockup de duas linhas e a 18px a linha "ecommerce" renderiza com 4,5px de
   altura — um borrão que lê como bug de renderização, não como marca. E os três
   blocos de tema estão presos SÓ a `prefers-color-scheme` e a `data-theme`,
   nunca a um token de cor: o `:root` do `cockpit.html` é claro por padrão e o
   das outras é escuro, então uma regra que dependesse do padrão sairia
   invertida em uma das páginas. */
.eplogo { height: 32px; width: auto; flex: 0 0 auto; display: block; filter: invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .eplogo { filter: none; } }
:root[data-theme="dark"] .eplogo { filter: none; }
:root[data-theme="light"] .eplogo { filter: invert(1); }
@media (max-width: 620px) { .eplogo, .eplogo-sep { display: none; } }

@media (min-width: 621px) {
  .brand { flex: 0 0 auto; }
  .brand .wm { white-space: nowrap; }
}
/* Deixar o `.meta` encolher nunca aumenta o estouro, só muda quem cede
   primeiro — e o endereço da instância é a única coisa do topbar que continua
   legível pela metade: o começo dele já identifica a instância. */
.topbar .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ═══════════════════════════════════════════════════════ NAV — as cinco portas
   BLOCO COMPARTILHADO. Este CSS é IDÊNTICO em flows.html, tester.html,
   cockpit.html e upgrade.html — gerado por preview/aplicar-nav.js e travado por
   nav-sync-test.js. Ao mudar, rode o gerador de novo; NÃO edite uma página só,
   e nunca insira um segundo bloco (foi assim que o rabo de um bloco antigo
   ficou pendurado no flows.html e a página morreu com "Illegal return
   statement").

   A cápsula é ícone-primeiro: o rótulo existe na porta ativa, sob o cursor e no
   foco de teclado. O fundo do ativo NÃO é pintado por cada porta — é UM
   elemento que viaja, a .lente, movida por mola no JS. Enquanto cada porta
   pintava o próprio fundo não havia o que animar entre elas: o estado aparecia
   e desaparecia.

   Cor: corpo e aro da lente são --accent, que neste painel significa MOVIMENTO.
   Status (ok/warn/risk/cold) continua reservado e não entra na navegação. */
.nvd{position:relative;display:flex;align-items:center;gap:3px;padding:3px;
  border-radius:999px;flex:0 0 auto;background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line-soft)}
.nvd a{position:relative;z-index:1;display:flex;align-items:center;height:30px;
  padding:0 9px;border-radius:999px;color:var(--txt-faint);text-decoration:none;
  transition:color .22s ease}
.nvd a:hover{color:var(--txt-dim)}
.nvd a[aria-current="page"]{color:var(--txt)}
.nvd a[aria-current="page"] .ic{color:var(--accent-txt)}
.nvd a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nvd .ic{display:grid;transition:transform .3s cubic-bezier(.2,.9,.15,1)}
.nvd a[aria-current="page"] .ic{transform:translateY(-.5px)}
.nvd .lb{display:flex;align-items:center;gap:7px;max-width:0;overflow:hidden;
  opacity:0;white-space:nowrap;font-size:12.5px;font-weight:500;
  transition:max-width .34s cubic-bezier(.2,.9,.15,1),opacity .24s ease,
    margin-left .34s cubic-bezier(.2,.9,.15,1)}
.nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
  max-width:130px;opacity:1;margin-left:7px}
.nvd kbd{font-family:var(--font-num);font-size:9px;letter-spacing:.02em;
  color:color-mix(in srgb,var(--txt-faint) 58%,var(--txt));
  padding:1px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);
  line-height:1.5}
.nvd .lente{position:absolute;top:3px;left:0;height:30px;width:var(--w,30px);opacity:0;
  transform:translateX(var(--x,0)) scale(var(--sx,1),var(--sy,1));
  transform-origin:var(--org,center);
  border-radius:999px;pointer-events:none;z-index:0;
  background:
    radial-gradient(130% 170% at 28% -12%,
      color-mix(in srgb,#fff 62%,transparent), transparent 58%),
    color-mix(in srgb,var(--accent) 12%,transparent);
  backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  -webkit-backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),
    inset 0 1.5px 0 color-mix(in srgb,#fff 90%,transparent),
    inset 0 -3px 5px -2px rgba(10,10,20,.13),
    0 3px 10px -7px rgba(10,10,20,.40)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .nvd .lente{
    background:
      radial-gradient(130% 170% at 28% -10%,
        color-mix(in srgb,#fff 17%,transparent), transparent 62%),
      color-mix(in srgb,var(--accent) 22%,transparent);
    backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    box-shadow:
      inset 0 0 0 1px var(--accent-line),
      inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
      inset 0 -2px 3px -1px rgba(0,0,0,.22),
      0 2px 9px -6px rgba(0,0,0,.55)}
}
:root[data-theme="dark"] .nvd .lente{
  background:
    radial-gradient(130% 170% at 28% -10%,
      color-mix(in srgb,#fff 17%,transparent), transparent 62%),
    color-mix(in srgb,var(--accent) 22%,transparent);
  backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  box-shadow:
    inset 0 0 0 1px var(--accent-line),
    inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
    inset 0 -2px 3px -1px rgba(0,0,0,.22),
    0 2px 9px -6px rgba(0,0,0,.55)}
.nvd .lente.pronta{opacity:1}
.nvd .lente::before{content:"";position:absolute;inset:0;border-radius:inherit;
  padding:3px;pointer-events:none;
  backdrop-filter:blur(2px) saturate(2.4);
  -webkit-backdrop-filter:blur(2px) saturate(2.4);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.nvd .lente::after{content:"";position:absolute;inset:0;border-radius:inherit;
  opacity:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 34%,
    color-mix(in srgb,#fff 55%,transparent) 47%,transparent 60%)}
.nvd .lente.varre::after{animation:navvarrer .62s cubic-bezier(.2,.75,.2,1) 1}
@keyframes navvarrer{
  0%{opacity:0;transform:translateX(-40%)}
  22%{opacity:.9}
  100%{opacity:0;transform:translateX(40%)}}
@media (max-width:620px){
  .nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
    max-width:0;opacity:0;margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  .nvd .lb,.nvd .ic,.nvd a{transition:none}
  .nvd .lente.varre::after{animation:none}
}
.topbar .sep { width: 1px; height: 20px; background: var(--line); }

/* ------------------------------------------------------- modo gravação (REC)
   Borra o que não pode aparecer numa filmagem. Nesta tela o que carrega `sens`
   é o ENDEREÇO da instância, a CONTA e a ORGANIZAÇÃO em que o Claude está
   logado, o CAMINHO da CLI (que contém o nome de usuário do Windows) e a
   mensagem crua de erro do n8n — o módulo varre a chave antes de emitir, e o
   borrão é a segunda camada, não a primeira. O borrão NUNCA abre no hover: a
   tela pode estar sendo filmada neste exato momento. */
.rec .dot { display: inline-block; }
[data-rec="1"] .rec { color: var(--accent-txt); border-color: var(--accent-line); background: var(--accent-soft); }
[data-rec="1"] .rec .dot { animation: recpulse 1.6s ease-in-out infinite; }
@keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.sens { transition: filter .45s ease; }
[data-rec="1"] .sens { filter: blur(7px); user-select: none; }
.rec-wave { position: fixed; inset: 0; z-index: 400; pointer-events: none;
  background: color-mix(in srgb, var(--accent) 16%, transparent); }
@media (prefers-reduced-motion: reduce) {
  [data-rec="1"] .rec .dot { animation: none; }
  .sens { transition: none; }
}
.meta { font-family: var(--font-num); font-size: 11.5px; color: var(--txt-faint); letter-spacing: .02em; }
.meta b { color: var(--txt-dim); font-weight: 500; }
.spacer { flex: 1; }

/* ---------------------------------------------------------------- o botão
   UMA regra `.btn`, e isso é a resolução de um defeito conhecido: o
   `upgrade.html` carrega DOIS blocos `.btn` (o base e o do texture-button do
   cult-ui) e o segundo vence por cascata. Aqui os dois já vêm compostos num só,
   como o mockup aprovado fez, para não nascer com a mesma dívida.
   `white-space` e `flex: 0 0 auto` moram nesta regra porque o painel trava
   "um controle nunca encolhe e o rótulo dele nunca quebra". */
.btn {
  height: 32px; padding: 0 13px; border-radius: 8px; cursor: pointer; color: var(--txt);
  font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  flex: 0 0 auto; border: 1px solid transparent;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--txt) 4%, var(--raised)), var(--raised)) padding-box,
    linear-gradient(180deg, color-mix(in srgb, var(--txt) 14%, transparent), var(--line)) border-box;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--txt) 7%, transparent), 0 1px 2px rgba(0,0,0,.18);
  transition: background .16s, box-shadow .18s, transform .09s, color .16s;
}
.btn:hover {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--raised)), var(--raised)) padding-box,
    linear-gradient(180deg, var(--accent-line), var(--line)) border-box;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--txt) 10%, transparent), 0 2px 6px rgba(0,0,0,.22);
}
.btn:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,.22); }
.btn.ghost { background: transparent padding-box, linear-gradient(180deg, var(--line), var(--line-soft)) border-box; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft) padding-box, linear-gradient(180deg, var(--accent-line), var(--line)) border-box; }
.btn[disabled] { opacity: .55; cursor: default; transform: none; }
.btn[disabled]:hover { background:
  linear-gradient(180deg, color-mix(in srgb, var(--txt) 4%, var(--raised)), var(--raised)) padding-box,
  linear-gradient(180deg, color-mix(in srgb, var(--txt) 14%, transparent), var(--line)) border-box; }
/* O painel não declarava foco em lugar nenhum e o outline padrão do Chrome caía
   sobre a borda em gradiente do botão, praticamente desaparecendo. */
.btn:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px;
}

/* ==========================================================================
   AVISOS
   UM vocabulário para toda mensagem do sistema, nas páginas do cockpit.

   Dois MODOS, um só desenho:
     `.aviso`         — ancorado, fica onde o problema está (campo, seção, caixa).
     `.avisos > .aviso` — evento: o CONTAINER é que faz flutuar, sai sozinho.
   E quatro TIPOS, que só trocam a cor e o glifo: erro, alerta, ok, info.

   O tipo decide o comportamento, não só a cor: erro e alerta NÃO somem sozinhos
   (quem precisa ler não pode perder a frase), ok e info somem em 4,5s com a
   barra mostrando o tempo — uma coisa que vai desaparecer tem que dizer isso. */
.aviso{display:flex;gap:9px;align-items:flex-start;text-align:left;
  font-size:12px;line-height:1.6;border-radius:10px;padding:10px 12px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--txt-dim)}
.aviso .ai{flex:0 0 auto;font-size:11px;line-height:1.55;opacity:.95}
.aviso .ac{flex:1 1 auto;min-width:0}
.aviso .at{display:block;font-weight:650;color:var(--txt);margin-bottom:2px}
.aviso .ax{flex:0 0 auto;border:none;background:none;cursor:pointer;padding:1px 4px;
  border-radius:5px;color:inherit;opacity:.55;font-size:13px;line-height:1}
.aviso .ax:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
/* A borda sai da PRÓPRIA cor do tipo (`currentColor`), não de um token por
   variante: inventar quatro tokens novos para uma borda seria quatro lugares
   para dessincronizar. */
.aviso.erro,.aviso.alerta,.aviso.ok,.aviso.info{border-color:color-mix(in srgb,currentColor 30%,transparent)}
/* A cor é PUXADA para o texto base. Medido no DOM vivo, com o `-soft` composto
   sobre o fundo da página: `--risk-txt` puro dava 4,41 no claro, `--warn-txt`
   4,30, `--ok-txt` 4,29 e `--accent-txt` 4,38 no escuro — quatro reprovações de
   AA (4,5) em texto de 12px. Mexeu em token de status? Re-meça. */
.aviso.erro{background:var(--risk-soft);color:color-mix(in srgb,var(--risk-txt) 72%,var(--txt))}
.aviso.alerta{background:var(--warn-soft);color:color-mix(in srgb,var(--warn-txt) 72%,var(--txt))}
.aviso.ok{background:var(--ok-soft);color:color-mix(in srgb,var(--ok-txt) 72%,var(--txt))}
.aviso.info{background:var(--accent-soft);color:color-mix(in srgb,var(--accent-txt) 72%,var(--txt))}
/* O glifo fica na cor CHEIA: ele é forma, não texto corrido. */
.aviso.erro .ai{color:var(--risk-txt)}
.aviso.alerta .ai{color:var(--warn-txt)}
.aviso.ok .ai{color:var(--ok-txt)}
.aviso.info .ai{color:var(--accent-txt)}
.aviso.bloco{max-width:700px;margin:16px auto 0}
.avisos{position:fixed;top:70px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px;
  width:min(380px,calc(100vw - 36px));pointer-events:none}
.avisos .aviso{pointer-events:auto;box-shadow:var(--shadow);backdrop-filter:blur(8px);
  animation:avin .26s cubic-bezier(.2,.9,.3,1) both}
.aviso.saindo{animation:avout .18s ease-in both}
@keyframes avin{from{opacity:0;transform:translateX(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes avout{from{opacity:1}to{opacity:0;transform:translateX(10px)}}
/* A barra do tempo restante. Só existe onde há auto-dismiss — desenhar uma barra
   parada num aviso que não sai seria prometer que ele vai sumir. */
.aviso .abar{position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:currentColor;opacity:.35;transform-origin:left;animation:avbar linear both}
@keyframes avbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.avisos .aviso{position:relative;overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .avisos .aviso,.aviso.saindo{animation-duration:1ms;animation-delay:0s}
  /* A barra continua encurtando: ela é INFORMAÇÃO (quanto falta), não enfeite. */
  .aviso .abar{animation-duration:inherit}
}
@media (max-width:520px){ .avisos{top:auto;bottom:14px;right:12px;left:12px;width:auto} }

/* ==========================================================================
   A TELA
   ========================================================================== */
.tela { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;
  padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 12px;
  /* `min-width: 0` porque um item de flex nasce com piso no próprio min-content:
     um `white-space: nowrap` lá dentro (o `code` do host, a linha mono do pé)
     empurra o container para além da janela, e `.tela` não rola em X. */
  min-width: 0; }

code { font-family: var(--font-num); font-size: 11.5px; color: var(--txt);
  background: var(--surface-2); border: 1px solid var(--line-soft);
  padding: 1px 5px; border-radius: 5px; }

/* ── eyebrow — a anotação em colchete. Aqui é rótulo de SEÇÃO: esta tela é
   permanente, então não existe denominador e não existe "passo N de 3". */
.eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-num);
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--txt-faint); margin: 0; min-width: 0; }
/* MEDIDO no DOM vivo: `--brand-txt` cru dá **4,3250** sobre `--bg` no tema
   claro — reprovação de AA a 10,5px. É exatamente a armadilha que este projeto
   já documenta duas vezes (token calibrado como preenchimento e identidade não é
   token de texto corrido), e a receita da casa é esta mistura, a mesma que o
   `.aviso` e a faixa do dossiê usam. Depois: 6,44 no claro, 6,48 no escuro, e o
   laranja continua sendo laranja.
   FICA REGISTRADO: o índice de seção das outras quatro páginas usa
   `--brand-txt` cru no mesmo tamanho, logo carrega o mesmo 4,3250. Não foi
   tocado aqui — é anterior a esta fatia e mexer nele é mexer em quatro páginas
   que hoje funcionam. */
.eyebrow .idx { color: color-mix(in srgb, var(--brand-txt) 72%, var(--txt)); white-space: nowrap; }
.eyebrow .rule { flex: 1 1 auto; height: 1px; background: var(--line-soft); min-width: 12px; }
.eyebrow .qt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── a etiqueta de estado */
.tag { font-family: var(--font-num); font-size: 10.5px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.tag.ok   { color: color-mix(in srgb,var(--ok-txt) 72%,var(--txt));   background: var(--ok-soft); }
.tag.warn { color: color-mix(in srgb,var(--warn-txt) 72%,var(--txt)); background: var(--warn-soft); }
.tag.risk { color: color-mix(in srgb,var(--risk-txt) 72%,var(--txt)); background: var(--risk-soft); }
.tag.cold { color: color-mix(in srgb,var(--cold-txt) 72%,var(--txt)); background: var(--cold-soft); }

/* ═══ a linha de conexão.
   UMA linha por conexão, e o estado da linha comanda tudo o que ela oferece.
   A barra de 2px à esquerda do `.card` do cockpit carrega STATUS — é a pista
   primária, e é uma pista que SOBREVIVE AO CINZA, porque os quatro estados
   diferem por RITMO DE TRAÇO antes de diferirem por matiz:
     quebrou    → 3px, contínua
     ok         → 2px, contínua
     nunca      → 2px, tracejado longo (7 aceso / 7 apagado)
     conferindo → 2px, pontilhado fino (2 aceso / 3 apagado)
   Mais três pistas de forma empilham em cima: a forma do glifo (triângulo,
   check, cruz em anel, anel partido), o container (sólido tingido / sólido /
   tracejado com fundo hachurado / pontilhado) e o peso do tipo — a linha
   quebrada é a única com frase-diagnóstico de 15px.
   O `.card` do painel de fluxos tem brilho que segue o cursor; aqui NÃO tem, e
   é de propósito: lá o cartão é clicável e o brilho é affordance, aqui a linha
   não abre nada e um brilho seria movimento sem informação atrás. */
.card { position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; }

.card.st-quebrou { border-color: color-mix(in srgb, var(--risk) 26%, var(--line)); }
.card.st-quebrou::before { width: 3px; background: var(--risk); }
.card.st-ok::before { background: var(--ok); }
.card.st-nunca { border: 1px dashed var(--line);
  background:
    repeating-linear-gradient(135deg, var(--grid) 0 1px, transparent 1px 8px) padding-box,
    var(--bg-deep); }
.card.st-nunca::before {
  background: repeating-linear-gradient(180deg, var(--cold) 0 7px, transparent 7px 14px); }
/* `conferindo` é o quarto estado, e ele e o `nunca` são o par mais difícil de
   separar: os dois são frios, então NENHUM dos dois pode se apoiar em cor.
   Pontilhado onde o outro é tracejado, sem hachura onde o outro tem, anel
   partido onde o outro tem cruz, e — a pista que não gasta pixel nenhum — ele
   não oferece controle nem afirma nada. */
.card.st-conferindo { border: 1px dotted var(--line); background: var(--surface); }
.card.st-conferindo::before {
  background: repeating-linear-gradient(180deg, var(--cold) 0 2px, transparent 2px 5px); }

/* cabeça da linha */
.cab { display: flex; align-items: center; gap: 12px; padding: 13px 16px 13px 18px;
  border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; min-width: 0; }
.card.st-quebrou .cab { background: color-mix(in srgb, var(--risk) 6%, transparent); }
.card.st-nunca .cab { border-bottom: 1px dashed var(--line-soft); }
.card.st-conferindo .cab { border-bottom: 1px dotted var(--line-soft); }
.cab .push { flex: 1 1 auto; }

/* o glifo de estado — bloco preenchido para os dois estados definidos, contorno
   tracejado para os dois frios. A forma carrega o estado antes da cor. */
.gl { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; display: grid;
  place-items: center; border: 1px solid var(--line); background: var(--raised); }
.gl.risco { background: var(--risk-soft); color: var(--risk-txt);
  border-color: color-mix(in srgb, var(--risk) 36%, transparent); }
.gl.bom { background: var(--ok-soft); color: var(--ok-txt);
  border-color: color-mix(in srgb, var(--ok) 36%, transparent); }
.gl.frio { background: transparent; color: var(--cold-txt); border: 1px dashed var(--line); }
.gl.voo { background: transparent; color: var(--cold-txt); border: 1px dotted var(--line); }

.ident { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ident .nm { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
/* MEDIDO, e é a regra que o painel já enuncia: um token de texto tem que passar
   em TODA superfície onde ele cai, não na mais fácil. `--txt-faint` dá 4,94
   sobre `--bg` (o meta do topbar, o eyebrow) e só 4,42 sobre `--surface`, que é
   onde esta linha fica. Então a sublinha sobe para `--txt-dim` e a hierarquia é
   carregada pelo 12px contra o 13,5px/600 do nome, não pelo preenchimento. */
.ident .sb { font-size: 12px; color: var(--txt-dim); }

.mono { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--txt-faint); white-space: nowrap; }
/* `--accent-txt` como texto corrido mede 4,27 sobre esta cabeça de cartão e
   4,84 sobre o corpo — uma reprovação e uma aprovação por um fio. As duas
   tomam a receita da casa para levantar um token de texto colorido. */
.lk, .corpo a { color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt)); }
.lk { font-size: 12.5px; white-space: nowrap; }

/* o diagnóstico — a linha quebrada é a ÚNICA com este tamanho e este peso */
.diag { margin: 0; padding: 13px 18px 0; font-size: 15px; font-weight: 600;
  letter-spacing: -.01em; line-height: 1.42; }
/* A palavra que nomeia a causa. `--risk-txt` cru media 5,93 aqui e, mais ao
   ponto, saía como a coisa mais FRACA de uma manchete branca de 15px quando a
   cor era removida — a ênfase invertia no cinza. A mistura de 72% lê como
   vermelho e fica perto do peso da própria manchete. */
.diag em { font-style: normal; color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }
/* A frase ambígua NÃO é vermelha: ela não afirma qual das duas causas é, e
   pintá-la com a cor da causa seria dizer com a cor o que o texto se recusa a
   dizer com a palavra. */
.diag em.duvida { color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); }

.fatos { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
.diag + .fatos { margin-top: 12px; border-top: 1px solid var(--line-soft); }
.cab + .fatos { border-top: 0; }
.fato { padding: 12px 16px 13px; border-left: 1px solid var(--line-soft); min-width: 0; }
.fato:first-child { border-left: 0; padding-left: 18px; }
.fato .lb { font-family: var(--font-num); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--txt-faint); }
.fato p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); }
.fato p b { color: var(--txt); font-weight: 600; }
.fato p code {
  /* `word-break: break-all` sozinho parte o caminho no meio do token
     (`claude.e` / `xe`) E, porque `code` é inline, cada pedaço ganha a própria
     borda: sai como duas caixinhas empilhadas, que lê como defeito de
     renderização. Um caminho do Windows não tem ponto de quebra macio nenhum em
     CSS, então quebrar no meio do token é aceitável — a borda cortando ao meio
     não é. `inline-block` com `max-width:100%` faz dele UMA caixa que quebra por
     dentro. Não vira `title`: este elemento é `sens` e o modo gravação o borra,
     e uma dica que revela o que o borrão esconde não protege nada. */
  display: inline-block; max-width: 100%; word-break: break-all;
}
/* Um token longo precisa quebrar, e `<code>` é INLINE — então a borda do
   segundo fragmento fica aberta e o pedaço final vira uma caixinha solta
   embaixo da primeira. MEDIDO na captura contra a instância viva: o caminho da
   CLI saiu como `claude.e` / `xe`, em duas caixas, o que lê como bug de
   renderização e não como uma linha quebrada. `clone` faz cada fragmento levar
   a borda inteira. Vale para todo `code` da página, porque o host da instância
   pode ser longo do mesmo jeito. */
code { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
/* E o CAMINHO não é um token no meio de uma frase: é o único dado daquela
   célula, então ele é UMA caixa que quebra dentro de si mesma.
   Não vai de `title` nem de reticências, e isso é regra da casa e não gosto: o
   elemento é `sens`, o modo gravação o borra, e uma dica que revela o que o
   borrão esconde não protege nada — foi exatamente por isso que a mensagem de
   erro saiu do `title` da faixa do palco. Um caminho do Windows não tem ponto
   bom de quebra em CSS, então quebrar no meio do token é aceitável; a borda
   cortando o token não é. */
.fato p code.caminho { display: block; margin-top: 5px; padding: 5px 7px;
  line-height: 1.55; word-break: break-all; }

/* O `.aviso` ancorado dentro de uma linha de conexão. Só recuo — o desenho do
   aviso é o do bloco AVISOS e não é redesenhado aqui, senão passariam a existir
   dois desenhos para um vocabulário e o que divergisse seria o que ninguém
   olhou. */
.linha-aviso { padding: 0 18px 13px; min-width: 0; }
.diag + .linha-aviso, .corpo + .linha-aviso { padding-top: 2px; }
.cab + .linha-aviso { padding-top: 13px; }

/* a linha mono discreta no pé de uma linha */
.pe { padding: 9px 18px 10px; border-top: 1px solid var(--line-soft);
  background: var(--surface-2); font-family: var(--font-num); font-size: 11px;
  line-height: 1.55; color: var(--txt-faint); overflow-wrap: anywhere; }
.pe b { color: var(--txt-dim); font-weight: 400; }

.corpo { margin: 0; padding: 12px 18px 13px; font-size: 12.8px; line-height: 1.6;
  color: var(--txt-dim); }
.corpo b { color: var(--txt); font-weight: 600; }

/* ═══ o carimbo de "em voo", inline dentro de uma linha `conferindo`.
   Ele carrega um trilho de três segmentos que diz "em trânsito" — e não oferece
   controle nenhum, que é a pista final contra o `nunca`. */
.linha-conf { display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 18px 12px; border-top: 1px dotted var(--line-soft); min-width: 0; }
.linha-conf p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); }
.linha-conf p b { color: var(--txt); font-weight: 600; }
.confer { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 9px 5px 8px; border: 1px dotted var(--line); border-radius: 8px;
  background: var(--surface-2); }
.confer .arc { display: grid; place-items: center; color: var(--cold-txt); }
.confer .k { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .13em;
  text-transform: uppercase; color: color-mix(in srgb,var(--cold-txt) 72%,var(--txt)); }
.confer .rail { display: flex; gap: 3px; }
.confer .rail i { width: 8px; height: 2px; border-radius: 1px; background: var(--cold); opacity: .3; }
.confer .rail i.on { opacity: 1; animation: railwalk 1.5s steps(1) infinite; }
/* Movimento permanente só pode tocar `transform` e `opacity` — regra medida
   neste repositório, onde um `box-shadow` pulsante de 7px custava 19% de CPU
   com a página parada. Aqui é `opacity`, e o trilho só existe enquanto há
   leitura em voo. */
@keyframes railwalk { 0%, 66% { opacity: 1 } 67%, 100% { opacity: .3 } }
.confer .rail i:nth-child(2).on { animation-delay: .5s }
.confer .rail i:nth-child(3).on { animation-delay: 1s }
@media (prefers-reduced-motion: reduce) { .confer .rail i.on { animation: none } }

/* ── esqueleto da carga. Não é um spinner: são as três linhas que vão existir,
   já no estado `conferindo`, para a tela não pular de "vazio" para "três
   cartões" — e cada uma já diz a frase certa, que é "ainda não olhei". */
.esq { height: 11px; border-radius: 5px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line-soft); }
.esq.w1 { width: 190px } .esq.w2 { width: 320px }

/* ═══ o rodapé honesto. Não é um "continuar": esta tela não é passo de nada.
   E ele NÃO é a notinha cinza de sempre — o que está escrito aqui é a resposta
   para a suposição que uma tela chamada "integrações" cria por si só, que é a
   de que já existe login. Enterrar isso em 11px seria deixar a suposição de pé. */
.rodape { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-top: 4px; min-width: 0; }
.rodape .push { flex: 1 1 auto; }
.verdade { border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface-2); padding: 14px 18px 15px;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; min-width: 0; }
.verdade .it { min-width: 0; }
.verdade .lb { font-family: var(--font-num); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--txt-faint); }
.verdade p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); }
.verdade p b { color: var(--txt); font-weight: 600; }

/* ═══ PAREAMENTO e ESCOLHA DE IA
   Duas seções novas, e as duas reusam a gramática que já está acima em vez de
   inventar a própria: `.bl` é o `.card` SEM a barra de status à esquerda, e essa
   subtração é a decisão. Aquela barra de 2px significa ESTADO DE CONEXÃO nas três
   linhas de cima; gastá-la aqui como enfeite de caixa seria gastar o vocabulário
   que o BRIEF §6 reserva. O estado do pareamento é carregado pela ETIQUETA, pela
   forma do glifo e pelo passo aceso da trilha — pistas que sobrevivem ao cinza.
   Nenhuma cor nova entra: status continua `ok/warn/risk/cold` e `--accent`
   continua significando movimento. */
.bl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.bl.frio { border: 1px dashed var(--line);
  background:
    repeating-linear-gradient(135deg, var(--grid) 0 1px, transparent 1px 8px) padding-box,
    var(--bg-deep); }
.bl.voo  { border: 1px dotted var(--line); }
.bl.mau  { border-color: color-mix(in srgb, var(--risk) 26%, var(--line)); }

/* ── a trilha da cerimônia. Ela é a parte que SE MOVE, e move porque o estado
   mudou — nunca por relógio. Os quatro passos são a única coisa desta tela que
   responde "onde eu estou", e o passo 3 é o que a pessoa mais precisa ler: o
   código sai no CONSOLE do agente e não chega nesta tela por rota nenhuma.
   Distinção sem cor: o passo cumprido tem o disco preenchido, o atual tem anel
   grosso e rótulo em peso 600, o futuro tem anel tracejado e texto `--txt-faint`. */
.passos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0; border-bottom: 1px solid var(--line-soft); }
.passo { padding: 12px 14px 13px; border-left: 1px solid var(--line-soft); min-width: 0;
  display: flex; flex-direction: column; gap: 6px; }
.passo:first-child { border-left: 0; padding-left: 18px; }
.passo .n { display: flex; align-items: center; gap: 8px; font-family: var(--font-num);
  font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--txt-faint); }
.passo .bola { width: 13px; height: 13px; border-radius: 999px; flex: 0 0 auto;
  border: 1px dashed var(--cold); }
.passo.feito .bola { border: 1px solid var(--ok); background: var(--ok); }
.passo.agora .bola { border: 3px solid var(--accent); background: transparent; }
.passo p { margin: 0; font-size: 12.3px; line-height: 1.5; color: var(--txt-faint); }
.passo.feito p { color: var(--txt-dim); }
.passo.agora p { color: var(--txt); font-weight: 600; }
.passo.agora .n { color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt)); }
.passo.feito .n { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt)); }

/* ── o campo. É o `.fld` do BRIEF §2, byte a byte no que ele declara, mais o
   ramo de `textarea` que aquele bloco não tem. */
.fld { display: flex; align-items: center; gap: 8px; min-width: 0; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; }
.fld:focus-within { border-color: var(--accent-line); background: var(--accent-soft); }
.fld input, .fld textarea { flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font-family: var(--font); font-size: 13px; color: var(--txt); padding: 1px 0; }
.fld textarea { font-family: var(--font-num); font-size: 11.5px; line-height: 1.6;
  resize: vertical; min-height: 92px; }
.fld input::placeholder, .fld textarea::placeholder { color: var(--txt-faint); }
/* O campo do código é o único numeral grande desta tela, e é assim de propósito:
   é o que a pessoa está copiando de outra janela, olhando de um lado para o
   outro. `text-transform` só na aparência — o módulo normaliza caixa e
   separador de qualquer jeito, então isto não é validação disfarçada. */
.fld.cod input { font-family: var(--font-num); font-size: 22px; letter-spacing: .34em;
  text-transform: uppercase; font-variant-numeric: tabular-nums; }

.form { display: flex; flex-direction: column; gap: 11px; padding: 14px 18px 15px; min-width: 0; }
.form .lb { font-family: var(--font-num); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--txt-faint); }
.form .ln { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.form .ln .push { flex: 1 1 auto; }

/* ── a lista de origens, item a item. Nunca "3 origens": esta lista é
   exatamente quem pode mandar o agente escrever num fluxo de produção, e um
   número esconde justamente o que precisa ser conferido. */
.origens { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.origens li { display: flex; align-items: baseline; gap: 9px; min-width: 0;
  font-family: var(--font-num); font-size: 11.5px; line-height: 1.5; color: var(--txt);
  overflow-wrap: anywhere; }
.origens li .mk { flex: 0 0 auto; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
.origens li.val .mk { color: color-mix(in srgb, var(--ok-txt) 72%, var(--txt)); }
.origens li.inv .mk { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }
.origens li.inv .o { text-decoration: line-through; color: var(--txt-faint); }

/* ── a contagem regressiva. Ela é NÚMERO e não barra: uma barra encolhendo
   promete que o painel sabe quanto falta com precisão de pixel, e o que existe
   aqui é um instante vindo do servidor mais o relógio desta máquina. O texto
   troca sozinho a cada segundo pelo ticker, sem repintar a tela — repintar
   apagaria o código que está sendo digitado. */
.reg { font-family: var(--font-num); font-size: 11.5px; letter-spacing: .04em;
  color: color-mix(in srgb, var(--warn-txt) 72%, var(--txt)); white-space: nowrap; }
.reg.venceu { color: color-mix(in srgb, var(--risk-txt) 72%, var(--txt)); }

/* ── o marcador de PENDENTE. Tracejado e hachurado, o mesmo desenho do estado
   `nunca` lá em cima, porque é a mesma família de fato: uma coisa que ainda não
   existe. Ele carrega texto de 12,5px e não a notinha de 11px — enterrar "isto
   não é gravado" em cinza pequeno é como não dizer. */
.pend { display: flex; gap: 13px; align-items: flex-start; border: 1px dashed var(--line);
  border-radius: var(--r); padding: 13px 16px 14px; min-width: 0;
  background:
    repeating-linear-gradient(135deg, var(--grid) 0 1px, transparent 1px 8px) padding-box,
    var(--bg-deep); }
.pend .mk { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--txt-faint); white-space: nowrap; padding-top: 2px; }
.pend p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--txt-dim); }
.pend p b { color: var(--txt); font-weight: 600; }

/* ── as escolhas de IA. Um `<button>` por opção, e não um `<label>` com rádio
   escondido: o rádio dá o agrupamento de teclado de graça e tira o `disabled`
   legível — e aqui UMA das opções é recusada e precisa continuar sendo LIDA, com
   o motivo. Uma opção que some não explica nada, e a regra desta tela é que a
   opção recusada apareça COM o motivo. */
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.op { text-align: left; font-family: inherit; color: var(--txt); cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 15px 15px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.op:hover { border-color: var(--accent-line); }
.op[aria-pressed="true"] { border-color: var(--accent-line);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.op[disabled] { cursor: default; opacity: 1; border-style: dashed; background: var(--bg-deep); }
.op[disabled]:hover { border-color: var(--line); }
.op .oh { display: flex; align-items: center; gap: 9px; min-width: 0; }
.op .oh .nm { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op .oh .push { flex: 1 1 auto; }
.op p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--txt-dim); }
.op p b { color: var(--txt); font-weight: 600; }
.op .marca { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-num);
  font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
  color: color-mix(in srgb, var(--accent-txt) 72%, var(--txt)); white-space: nowrap; }
.op:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── a faixa de "quem paga". Ela é a diferença que decide a escolha, então tem
   linha própria e não vira uma quarta frase dentro do cartão. */
.paga { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.paga .it { padding: 12px 16px 13px; border-left: 1px solid var(--line-soft); min-width: 0; }
.paga .it:first-child { border-left: 0; padding-left: 18px; }
.paga .lb { font-family: var(--font-num); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--txt-faint); }
.paga p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); }
.paga p b { color: var(--txt); font-weight: 600; }

/* ── o cabeçalho de busca ("achei a máquina"). O trilho de três segmentos é o
   mesmo `.confer` das linhas de cima, reusado e não redesenhado. */
.busca { display: flex; align-items: center; gap: 11px; padding: 12px 18px 13px;
  border-top: 1px solid var(--line-soft); flex-wrap: wrap; min-width: 0; }
.busca p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--txt-dim); flex: 1 1 260px; min-width: 0; }
.busca p b { color: var(--txt); font-weight: 600; }

/* ---------------------------------------------------------------- estreito
   Bloco de 900px e de 620px, e o que ele faz primeiro é desligar o piso de
   min-content dos itens de grid e de flex: sem `min-width: 0` trocar
   `grid-template-columns` não resolve nada, porque a coluna vira `1fr` e o item
   mantém o piso do conteúdo. Foi assim que o `/upgrade` recortou em silêncio o
   "abrir no n8n" em 390px. */
@media (max-width: 900px) {
  .fatos { grid-template-columns: 1fr; }
  .fato { border-left: 0; border-top: 1px solid var(--line-soft); padding-left: 18px; }
  .fato:first-child { border-top: 0; }
  .verdade { grid-template-columns: 1fr; gap: 14px; }
  /* As grades novas desabam pela mesma regra e na mesma largura. A trilha da
     cerimônia vira DUAS colunas e não uma: quatro passos empilhados viram uma
     coluna de texto que perde a leitura de "trilha", que é a única coisa que ela
     comunica. */
  .passos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .passo:nth-child(3) { border-left: 0; }
  .passo:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
  .ops { grid-template-columns: 1fr; }
  .paga { grid-template-columns: 1fr; }
  .paga .it { border-left: 0; border-top: 1px solid var(--line-soft); padding-left: 18px; }
  .paga .it:first-child { border-top: 0; }
}
@media (max-width: 620px) {
  .topbar { height: auto; min-height: 56px; flex-wrap: wrap; row-gap: 6px; padding: 8px 14px; gap: 10px; }
  .topbar .sep { display: none; }
  .topbar .btn { min-height: 40px; }
  .tela { padding: 16px 14px 32px; }
  .backdrop .gbeam { display: none; }
  .cab { padding: 12px 14px 12px 16px; }
  .rodape .mono { white-space: normal; }
  .passos { grid-template-columns: 1fr; }
  .passo { border-left: 0; border-top: 1px solid var(--line-soft); padding-left: 16px; }
  .passo:first-child { border-top: 0; }
  .form .ln .mono { white-space: normal; }
  /* O campo do código encolhe, mas continua o maior numeral da tela: é o que
     ela está copiando de outra janela, um caractere por vez. */
  .fld.cod input { font-size: 18px; letter-spacing: .24em; }
}

<script>
/* O tema escolhido em qualquer página vale aqui ANTES do primeiro paint. Sem
   isto a página pintaria no `data-theme` fixo do <html> e trocaria depois — um
   flash do tema errado a cada navegação para quem escolheu o claro.

(() => {

  if (localStorage.getItem("cockpit-rec") === "1") document.documentElement.setAttribute("data-rec", "1");
})();
