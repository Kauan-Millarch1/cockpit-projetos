   permanente vira mentira no instante em que a etapa 05 escreve a cópia — e
   seria esta feature cometendo exatamente o erro que o resto do cockpit gasta
   comentário evitando. */
function rodape(s) {
  const sb = s && s.sandbox;
  if (!sb || !sb.estado) return { classe: "", partes: ["nada foi criado no n8n", "nenhuma chamada feita"] };
  if (sb.estado === "desligado") return { classe: "", partes: ["nada foi criado no n8n", "a cópia de teste está desligada"] };
  if (sb.estado === "indeterminado") {
    // Escrita que falhou prova ausência de CONFIRMAÇÃO, não ausência de efeito.
    return { classe: "indeterminado", partes: ["não consegui confirmar se a cópia de teste foi criada", sb.motivo || ""] };
  }
  return { classe: "escreveu", partes: [

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Toda chamada passa por aqui. NUNCA `res.json()` direto: `JSON.parse("404")`
   é um número válido, então um 404 em texto puro vira um corpo "parseável" e a
   tela mostra um erro que não é o erro. Este bug já custou uma sessão inteira
   neste codebase — está documentado no CLAUDE.md. */
async function callApi(url, opts) {
  let res;
  try { res = await fetch(url, opts); }
  catch (e) { throw new Error("o cockpit não respondeu — ele está rodando? (" + (e && e.message) + ")"); }
  const txt = await res.text();
  let body = null;
  try { body = JSON.parse(txt); } catch { /* não é JSON */ }
  if (res.status === 404 && (body === null || typeof body !== "object")) {
    throw new Error("esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js. Reinicie o cockpit.");
  }
  if (!body || typeof body !== "object" || Array.isArray(body) && !res.ok) {
    if (!res.ok) throw new Error("o servidor respondeu " + res.status);
  }
  if (!res.ok) {
    const err = new Error((body && body.error) || ("o servidor respondeu " + res.status));
    // Campos que o servidor manda JUNTO com o erro chegam a quem chamou. Hoje é
    // `categoria` (para agrupar recusas de anexo); sem isto ela morria no `throw`
    // e a tela só teria a frase, que é o que impede agrupar por motivo.
    if (body && typeof body === "object") {
      if (body.categoria) err.categoria = body.categoria;
      if (body.bandeja) err.bandeja = body.bandeja;
    }
    throw err;
  }
  return body;
}

/* Torna clicável um elemento que não é <button>, sem perder o layout. */
function clicavel(el, rotulo, fn) {
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  if (rotulo) el.setAttribute("aria-label", rotulo);
  el.style.cursor = "pointer";
  el.addEventListener("click", fn);
  el.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(ev); } });
  return el;
}

const S = { snap: null, es: null, nivel: "sei o básico", enviando: false, desenhado: null, capab: null, projetos: [],

  // escolhas de chip, por TEXTO da pergunta; sobrevivem ao repaint do SSE

  // pan/zoom do grafo e assinatura do fantasma: sem eles cada evento do SSE
  // resetaria a câmera e re-animaria a chegada da mensagem
  cam: null, fantasmaVisto: null,

     `#app` inteiro a cada evento do SSE, e reconstruir o desenho custava 652
     elementos e 69 `getTotalLength()` (medido no agente de 65 nós) POR EVENTO —
     de longe o maior desperdício desta página. Mesmo molde do `pintarPalco` do
     upgrade.html.
     `desenhoAjustar` é o closure do "ajustar": o `#fit` é filho do `#canvas` e
     portanto recriado pelo innerHTML, então precisa ser religado — senão o botão

     desenho já substituído continue escrevendo no `#corner` do novo. */
  desenhoEl: null, desenhoAjustar: null, desenhoRotulo: null, desenhoMontando: false, desenhoGen: 0,

     antes de a sessão existir, e `bandeja` é o recibo. `anexosPre` é o que
     desenhar; `anexoErro` é a última recusa, que tem que aparecer porque um
     arquivo que sumiu sem explicação é pior que um arquivo negado. */
  bandeja: null, anexosPre: [], anexoErro: null, subindo: 0,
  // O ditado por voz. `ouvindo` é o estado do microfone; `parcial` é o que o

  ouvindo: false, parcial: "", rec: null };

/* ============================================================================
   VOZ E ANEXOS — as duas entradas que não são o teclado
   ============================================================================

   O bloco inteiro saiu daqui para `/entradas.js`, servido a esta página e ao
   `/upgrade`. Ele já nascia parametrizado por `idPrefixo`; o que faltava era
   não ser copiado. Esta base carrega três blocos copiados à mão (topbar,
   `.aviso`, modo gravação) e um deles já produziu um `Illegal return
   statement` no `flows.html` porque alguém INSERIU em vez de SUBSTITUIR.
   `entradas-test.js` falha no dia em que uma das duas páginas voltar a
   declarar o bloco por conta própria.

   O SCRIPT DELE NÃO É DEFERIDO, e isso é a correção de uma armadilha: um script
   inline no fim do body roda ANTES dos deferidos, então `configurar()` abaixo
   receberia `window.__entradas` ainda `undefined` — e o erro apareceria no clique
   de anexar, onde pareceria defeito do arquivo dela. `IO()` continua lendo na
   hora do uso porque é assim que o teste injeta o módulo de verdade. */
const IO = () => window.__entradas;

/* O que a página dá ao módulo: o estado, o vocabulário de aviso, o `callApi`
   que já sabe reconhecer um 404 de processo velho, e as ROTAS — que são o que
   distingue esta página da outra. `aoSnapshot` existe porque cada uma guarda a
   volta num lugar diferente (aqui `S.snap`, no Upgrade `S.conv`).

   Chamado no CARREGAMENTO da página e não no primeiro uso: se `entradas.js`
   não subiu, é aqui que isso aparece — e não no clique de anexar, onde pareceria
   defeito do arquivo dele. */
IO().configurar({
  estado: S, avisar, callApi,
  rotas: {
    bandeja: "/api/tester/anexo",
    bandejaRemover: "/api/tester/anexo/remover",
    sessao: id => "/api/tester/session/" + id + "/anexo",
    sessaoRemover: id => "/api/tester/session/" + id + "/desanexar"
  },
  aoSnapshot: snap => { S.snap = snap; }
});

/* Os eventos do bloco de projetos, separados da tela: o poll da abertura troca
   o bloco inteiro quando o estado da construção muda, e precisa religar isto
   sem repintar a página — repintar comeria o que está digitado na ideia. */
function ligarEventosProjetos() {
  // O card fantasma volta para a corrida — mesmo ligar(id) de sempre, então o
  // SSE e o ?s= na URL continuam valendo.
  app.querySelectorAll(".proj.ghost").forEach(g =>
    clicavel(g, "voltar para a construção em andamento", () => ligar(g.dataset.sessao)));

  app.querySelectorAll(".proj").forEach(card => {
    const slug = card.dataset.slug;
    if (!slug) return;                            // o fantasma não tem menu nem slug
    const abrir = async () => {
      try { telaProjeto(await callApi("/api/tester/projeto/" + encodeURIComponent(slug))); }
      catch (e) { avisoAbertura(e.message); }
    };
    clicavel(card, "abrir projeto", ev => { if (!ev.target.closest(".proj-menu")) abrir(); });

    const dots = card.querySelector(".dots"), pop = card.querySelector(".pop");
    dots.addEventListener("click", ev => {
      ev.stopPropagation();
      const abrindo = pop.hasAttribute("hidden");
      // Um menu aberto por vez: dois abertos viram dois alvos para o mesmo Esc.
      app.querySelectorAll(".pop").forEach(x => x.setAttribute("hidden", ""));
      app.querySelectorAll(".dots").forEach(x => x.setAttribute("aria-expanded", "false"));
      if (abrindo) { pop.removeAttribute("hidden"); dots.setAttribute("aria-expanded", "true"); }
    });

    pop.querySelectorAll(".pop-i").forEach(item => item.addEventListener("click", async ev => {
      ev.stopPropagation();
      pop.setAttribute("hidden", "");
      dots.setAttribute("aria-expanded", "false");

      if (item.dataset.acao === "renomear") {
        // `.pt-edit`, nunca `.campo`: `.campo` é `flex: 1 1 220px`, e o card é
        // uma COLUNA flex — ali o basis vira ALTURA, e o campo abria o card com
        // 220px de vão. Este entra no lugar exato do título, do tamanho dele.
        const titulo = card.querySelector(".pt");
        const antes = titulo.textContent;
        const campo = document.createElement("input");
        campo.className = "pt-edit"; campo.value = antes; campo.maxLength = 120;
        campo.setAttribute("aria-label", "novo nome do projeto");
        titulo.replaceWith(campo);
        campo.focus(); campo.select();
        const salvar = async () => {
          const novo = campo.value.trim();
          if (!novo || novo === antes) { await inicio(); return; }
          try { await callApi("/api/tester/projeto/" + encodeURIComponent(slug) + "/renomear", corpo({ titulo: novo })); }
          catch (e) { avisoAbertura(e.message); }
          await inicio();
        };
        campo.addEventListener("keydown", e2 => {
          if (e2.key === "Enter") { e2.preventDefault(); salvar(); }
          if (e2.key === "Escape") inicio();
        });
        campo.addEventListener("blur", salvar);
        return;
      }

      /* Excluir MOVE para a lixeira. Continua pedindo confirmação — o card sai
         da tela e isso precisa ser uma decisão —, mas o texto não pode assustar
         com um dano que não vai acontecer: nada é apagado aqui. O alarme
         vermelho fica guardado para o "apagar de vez", que é onde ele é verdade. */
      const nome = card.querySelector(".pt").textContent;
      const ok = await confirmar({
        tag: "LIXEIRA", perigo: false, botao: "Mandar para a lixeira",
        titulo: "Mandar «" + nome + "» para a lixeira?",
        corpo: [
          "Ele sai da lista, mas não é apagado: fica na lixeira até você decidir. De lá dá para restaurar a qualquer momento.",
          "Nada é tocado no n8n. Se você já importou este fluxo lá, ele continua lá."
        ]
      });
      if (!ok) return;
      try { await callApi("/api/tester/projeto/" + encodeURIComponent(slug), { method: "DELETE" }); }
      catch (e) { avisoAbertura(e.message); }
      await inicio();
    }));
  });
}

/* Enquanto a abertura está na tela e existe (ou pode surgir) uma construção,
   o status é relido a cada 4s e SÓ o bloco de projetos é trocado — nunca a
   página, que tem um textarea com texto vivo. É o que mantém a porcentagem do
   card fantasma andando e o faz sumir sozinho quando a construção termina. */
function pollAbertura() {
  clearInterval(S.pollTimer);
  S.pollTimer = setInterval(async () => {
    const abertura = app.querySelector(".stage-open");
    if (!abertura) { clearInterval(S.pollTimer); return; }
    let st;
    try { st = await callApi("/api/tester/status"); } catch { return; }
    S.capab = st;
    carimbarVersao();
    const antes = JSON.stringify(S.andamento || null);
    S.andamento = st.andamento || null;
    if (antes === JSON.stringify(S.andamento)) return;
    // A construção acabou de sumir do status: ela terminou (ou falhou), e pode
    // ter virado um projeto salvo — a lista precisa ser relida junto.
    if (!S.andamento) await carregarProjetos();
    const bloco = abertura.querySelector(".projs");
    const novo = document.createElement("div");
    novo.innerHTML = cardsProjetos();
    const conteudo = novo.firstElementChild;
    if (bloco && conteudo) bloco.replaceWith(conteudo);
    else if (!bloco && conteudo) abertura.querySelector(".open-in").appendChild(conteudo);
    else if (bloco && !conteudo) bloco.remove();
    const vl = $("#ver-lixeira");
    if (vl) vl.addEventListener("click", telaLixeira);
    ligarEventosProjetos();
  }, 4000);
}

async function comecar() {
  const ideia = $("#ideia").value.trim();
  if (!ideia) { $("#ideia").focus(); return; }
  const btn = $("#comecar");
  // Um upload em voo perderia o arquivo: a sessão adotaria a bandeja antes do
  // último `POST` chegar, e o print ficaria num diretório que já foi movido.
  if (S.subindo) { btn.textContent = "esperando os anexos…"; return; }
  btn.disabled = true; btn.textContent = "abrindo…";
  try {
    const r = await callApi("/api/tester/session", {
      method: "POST", headers: { "content-type": "application/json" },
      // A bandeja é adotada pela sessão: os arquivos já estão no servidor, o que
      // viaja aqui é o recibo. Zerada depois, porque uma bandeja já movida não
      // existe mais e reusá-la na próxima ideia daria erro sem causa aparente.
      body: JSON.stringify({ ideia, nivel: S.nivel, bandeja: S.bandeja })
    });
    S.bandeja = null; S.anexosPre = []; S.anexoErro = null;
    ligar(r.id);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Começar →";
    // Falhou ao abrir a sessão: erro, e ancorado onde ela clicou. Não some
    // sozinho — a construção não começou e isso precisa ser lido.
    const av = document.createElement("div");
    av.className = "aviso erro bloco";
    av.setAttribute("role", "alert");
    av.innerHTML = '<span class="ai" aria-hidden="true">✕</span><span class="ac">' + esc(e.message) + "</span>";
    $(".open-in").appendChild(av);
  }
}

/* ------------------------------------------------------------------- SSE */

/* `?static=1` congela a tela numa leitura só. O SSE mantém a conexão aberta
   para sempre, o que trava captura headless e qualquer embed simples — a mesma
   razão pela qual o flows.html já tem esta flag. */
const ESTATICO = new URLSearchParams(location.search).get("static") === "1";

/* Espelho do teto do `diz()` no tester.js, que faz `shift()` acima de 400. Não é
   juízo: é um fato do servidor que o handler de `log` precisa repetir para não
   crescer sozinho entre dois eventos de outro tipo. Se o servidor mudar, mude
   aqui — o snapshot corrige na próxima etapa de qualquer forma, então o pior
   caso de divergir é memória, nunca uma linha errada na tela. */
const LOG_TETO = 400;

function ligar(id) {
  if (S.es) { S.es.close(); S.es = null; }
  clearInterval(S.pollTimer);                     // a corrida tem SSE; o poll é da abertura
  if (ESTATICO) return;
  // A sessão vai para a URL. Uma construção leva minutos, e sem isto um F5 —
  // ou um clique no link errado — perdia a corrida inteira: ela continua viva
  // no servidor e a tela não tinha como voltar para ela.
  if (!ESTATICO && new URLSearchParams(location.search).get("s") !== id) {
    history.replaceState(null, "", "/tester?s=" + encodeURIComponent(id));
  }
  const es = new EventSource("/api/tester/session/" + encodeURIComponent(id) + "/stream");
  S.es = es;
  // O snapshot inteiro vem primeiro e vem de novo a cada reconexão, então o
  // cliente nunca depende de ter visto os deltas anteriores.
  es.addEventListener("snapshot", ev => { S.snap = JSON.parse(ev.data); pintar(); });
  /* `log` NÃO entra nesta lista, e essa ausência é a metade barata desta página.
     `diz()` no tester.js emite UM evento `log` por linha do stream-json do CLI, e
     cada item daqui custa um GET do snapshot INTEIRO — que num agente de 65 nós
     são ~51KB de `wf` mais até 400 linhas de log — mais o `JSON.parse` e o
     `app.innerHTML` da tela toda. Uma linha de terminal não pode custar isso.
     `anexos` e `projeto` ENTRARAM: eles eram emitidos e ninguém escutava, então
     só apareciam na tela de carona no refresh que a próxima linha de `log`
     disparava. Tirar o `log` sem eles deixaria o chip de "a sessão abriu este
     arquivo" mudo até a etapa seguinte. São raros — um punhado por corrida. */
  for (const t of ["etapa", "entendi", "espera", "gates", "wf", "wfParcial", "sandbox", "fantasma", "custo", "ingredientes", "doc", "chat", "proposta", "anexos", "projeto", "fim"]) {
    es.addEventListener(t, () => refrescar(id));
  }
  /* A linha nova é ANEXADA, no molde do `atividade` abaixo — sem GET e sem
     repaint. MEDIDO: nada nesta página renderiza `s.log`. Não há terminal aqui
     (o `.hoff-term` é do flows.html), então a linha não tem para onde ir na
     tela; o que este handler faz é manter a cópia do cliente honesta, para que
     quem desenhar esse terminal um dia não descubra do pior jeito que o array
     estava velho. A última linha antes de a sessão morrer não se perde de
     qualquer forma: todo `emit(s, "fim")` vem DEPOIS do último `diz()`, e o
     `fim` continua na lista acima, então o snapshot final traz o log inteiro. */
  es.addEventListener("log", ev => {
    if (!S.snap) return;                    // o snapshot vem primeiro e já traz o log
    let d = null;
    try { d = JSON.parse(ev.data); } catch { return; }
    if (!d || typeof d.texto !== "string") return;
    const l = S.snap.log || (S.snap.log = []);
    /* O SSE e o GET do `refrescar` correm soltos: uma linha pode chegar no
       snapshot ANTES do seu próprio evento, e aí anexar duplicaria. O array
       inteiro é varrido em vez de só o rabo porque 400 comparações de string
       por linha são de graça ao lado do que este handler acabou de deixar de
       gastar, e um teto de rabo seria uma constante a defender. O preço
       declarado: duas linhas de verdade idênticas no MESMO milissegundo viram
       uma — num array que ninguém desenha. */
    if (!l.some(x => x && x.at === d.at && x.texto === d.texto && x.nivel === d.nivel)) l.push(d);
    // O mesmo teto do `diz()` no servidor: numa etapa longa sem nenhum outro
    // evento (o build do agente mediu 660s) isto cresceria sem limite.
    while (l.length > LOG_TETO) l.shift();
  });
  es.addEventListener("atividade", ev => {
    const d = JSON.parse(ev.data);
    if (S.snap) S.snap.atividade = d.atividade;
    const b = $("#atividade"); if (b) b.textContent = d.atividade || "";
  });
  es.onerror = () => { /* o browser reconecta sozinho; o snapshot reconstrói */ };
}

let refrescando = false;
async function refrescar(id) {
  if (refrescando) return;
  refrescando = true;
  try { S.snap = await callApi("/api/tester/session/" + encodeURIComponent(id)); pintar(); }
  catch { /* o SSE traz o próximo */ }
  finally { refrescando = false; }
}

/* -------------------------------------------------------------- a corrida */

function pintar() {
  const s = S.snap;
  if (!s) return;
  const antes = app.querySelector(".stream");
  const scroll = antes ? antes.scrollTop : 0;
  const noFim = antes ? (antes.scrollHeight - antes.scrollTop - antes.clientHeight < 80) : true;
  const digitado = capturarInputs();

  app.innerHTML =
    '<div class="split">' +
      '<div class="stream" id="stream">' + blocosStream(s) + '</div>' +
      '<aside class="side">' + ladoDireito(s) + '</aside>' +
    '</div>' +
    (s.status === "pronta" ? "" : '<div class="composer-wrap">' + composer(s) + '</div>');

  ligarEventos(s);
  desenharSeNovo(s);
  restaurarInputs(digitado);

  const st = $("#stream");
  if (st) st.scrollTop = noFim ? st.scrollHeight : scroll;
  pintarRodape(s);
  $("#cab").textContent = (s.ideia || "").slice(0, 44) + (s.ideia && s.ideia.length > 44 ? "…" : "") + " · " + s.nivel;
  $("#voltar").hidden = false;
}

/* O SSE repinta a tela inteira a cada evento — e uma construção emite eventos o
 * tempo todo. Sem isto, o que estava sendo DIGITADO no composer, no "Outro…" ou
 * no título do projeto sumia no meio da frase, junto com o foco. O texto de quem
 * usa nunca é descartável. */
function capturarInputs() {
  const foco = document.activeElement;
  const out = [];
  const ta = $("#resposta");
  if (ta && (ta.value || foco === ta)) out.push({ tipo: "resposta", v: ta.value, foco: foco === ta, a: ta.selectionStart, b: ta.selectionEnd });
  const ti = $("#titulo");
  if (ti && (foco === ti || ti.value !== ti.defaultValue)) out.push({ tipo: "titulo", v: ti.value, foco: foco === ti, a: ti.selectionStart, b: ti.selectionEnd });
  app.querySelectorAll(".outro-campo").forEach(c => {
    if (foco !== c) return;                       // valor já sobrevive via S.respostas
    const q = c.closest(".q");
    if (q) out.push({ tipo: "outro", q: q.dataset.q, v: c.value, foco: true, a: c.selectionStart, b: c.selectionEnd });
  });
  return out;
}
function restaurarInputs(lista) {
  for (const it of lista) {
    let el = null;
    if (it.tipo === "resposta") el = $("#resposta");
    else if (it.tipo === "titulo") el = $("#titulo");
    else {
      const q = [...app.querySelectorAll(".q")].find(x => x.dataset.q === it.q);
      el = q && q.querySelector(".outro-campo");
      if (el) el.removeAttribute("hidden");
    }
    if (!el) continue;
    el.value = it.v;
    if (it.foco) { el.focus(); try { el.setSelectionRange(it.a, it.b); } catch { /* textarea vs input */ } }
  }
}

/* A conversa como blocos de tela. Compartilhada entre a corrida e o projeto
   guardado — reabrir um projeto mostra a MESMA conversa que aconteceu, não um
   resumo dela. */
/* `dono` é a sessão ou o projeto salvo — os dois carregam `ehAgente`, e o cartão
   precisa dele para dizer que classificação foi feita. Um projeto salvo antes
   desta feature não tem o campo, e aí o cartão simplesmente não diz nada, que é
   melhor que afirmar "automação" sobre algo que nunca foi classificado. */
/* Markdown LEVE para a fala do Tester. A resposta de uma conversa de edição
   vinha como parede de texto — "1. ... 2. ... 3. ..." emendados num parágrafo
   só, ilegível (medido no primeiro uso real). O subconjunto é deliberado:
   parágrafo, lista (- e numerada), **negrito** e `código`. Nada de headings,
   links ou HTML — a fonte é um modelo, e o escape roda ANTES de qualquer
   transformação: o que entra hostil sai texto. */
function mdLeve(t) {
  const linhas = String(t || "").split(/\n/);
  const out = [];
  let lista = null;                              // "ul" | "ol" | null
  const fecha = () => { if (lista) { out.push("</" + lista + ">"); lista = null; } };
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  let par = [];
  const solta = () => { if (par.length) { out.push("<p>" + par.join("<br>") + "</p>"); par = []; } };
  for (const l of linhas) {
    const s = l.trim();
    const mUl = /^[-•]\s+(.*)$/.exec(s);
    const mOl = /^\d+[.)]\s+(.*)$/.exec(s);
    if (mUl || mOl) {
      solta();
      const tipo = mUl ? "ul" : "ol";
      if (lista !== tipo) { fecha(); out.push("<" + tipo + ">"); lista = tipo; }
      out.push("<li>" + inline((mUl || mOl)[1]) + "</li>");
      continue;
    }
    fecha();
    if (!s) { solta(); continue; }
    par.push(inline(s));
  }
  fecha(); solta();
  return out.join("");
}

function blocosConversa(chat, dono) {
  return (chat || []).map(m => {
    if (m.quem === "voce") return '<div class="msg me"><div class="who">VOCÊ</div><div class="body">' + esc(m.texto) + "</div></div>";
    if (m.entendi) return cartaoEntendi(m.entendi, dono);
    /* Fala do Tester em texto. Numa construção isto nunca acontece — lá a fala
       dele É o cartão de entendimento, e `texto` vem nulo. Numa conversa sobre
       um fluxo salvo é o caso comum: a resposta a uma dúvida é uma frase, e sem
       esta linha ela era descartada e a pergunta ficava sem resposta na tela. */
    if (m.texto) return '<div class="msg sys"><div class="who">TESTER</div><div class="body md">' + mdLeve(m.texto) + "</div></div>";
    return "";
  }).join("");
}

function blocosStream(s) {
  // Conversa sobre um fluxo que já existe é outra tela: não tem entrevista, não
  // tem portão de sete etapas e não entrega JSON no fim — entrega um remendo
  // para você aprovar ou descartar.
  if (s.modo === "edicao") return blocosEdicao(s);

  const out = [];
  out.push(blocosConversa(s.chat, s));

  if (s.status === "correndo" && s.etapa === 1) out.push(faixaProc(s));

  for (const q of s.perguntas || []) out.push(pergunta(q));

  if (s.etapa === 1 && s.status === "aguardando") {
    if ((s.perguntas || []).length) {
      // Entrevista em aberto: responder alimenta a rodada seguinte; pular é
      // permitido, mas dito com o preço — o que ficar aberto vira suposição.
      out.push(acoesEntrevista(s));
    } else {
      out.push(portao(
        ((s.respostas || []).length ? "Entrevista completa — tenho o que preciso. " : "") +
        "Confere? Se estiver certo eu já sigo sozinho até o resultado.",
        "Daqui pra frente são cinco passos seguidos: pesquisar (se precisar), listar o que você precisa, " +
        "desenhar o fluxo, validar e simular. Só volto a te perguntar no final.",
        "É isso, pode seguir", s.custoTotal));
    }
  }

  // O desenho aparece assim que a sessão de construção ESCREVE o arquivo —
  // rascunho ainda sem validação — e é substituído pelo documento validado.
  if (s.wf || s.wfParcial) out.push(canvas(s));

  if (s.gates && !s.gates.passou) {
    out.push('<div class="gatefail"><div style="font-size:12.5px;font-weight:600;margin-bottom:7px">O validador reprovou a proposta</div><ul style="margin:0;padding-left:18px">' +
      s.gates.falhas.map(f => "<li>" + esc(f) + "</li>").join("") + "</ul></div>");
  }

  if (s.fantasma) out.push(fantasmaBloco(s));

  if (s.etapa === 6 && s.status === "aguardando") {
    out.push(portao("É isso que você queria ver?",
      "Se sim, eu fecho e te entrego o JSON pra importar no n8n. Se não, escreve embaixo o que mudar — " +
      "eu recomeço do ponto que interessa.", "É isso, pode fechar", s.custoTotal));
  }

  /* A checklist vem ANTES da entrega, não depois: ela é o que ele vai executar
     assim que colar o JSON no n8n, e um bloco de trabalho embaixo de um `<pre>`
     de 400 linhas é um bloco que ninguém encontra. */
  if (s.status === "pronta" && s.wf) out.push(checklistCred(s, true), entrega(s));

  if (s.status === "correndo" && s.etapa > 1) out.push(faixaProc(s));
  if (s.status === "cancelada") out.push(faixaParado(s));

  if (s.erro) out.push('<div class="erro"><strong>Parou aqui.</strong><br>' + esc(s.erro) + "</div>");
  return out.join("");
}

/* O que a tela diz depois de você parar.
 *
 * Três frases, e as três existem por um motivo. A primeira separa parada de
 * defeito — sem ela, uma etapa interrompida no meio de uma escrita fica
 * indistinguível de uma que quebrou. A segunda diz o que SOBROU, porque o
 * desenho continua na tela e "isto aqui ainda vale?" é a pergunta imediata. A
 * terceira diz como seguir, e a resposta não é um botão: é o compositor, que
 * recomeça da etapa afetada já com a correção junto. */
function faixaParado(s) {
  const e = (s.etapas || []).find(x => x.n === s.etapa) || {};
  const cego = (s.custo || []).some(c => c.usdDesconhecido);
  return '<div class="parado" role="status">' +
    "<strong>Você parou" + (e.nome ? " em " + esc(e.nome) : "") + ".</strong><br>" +
    "Nada foi escrito no n8n por causa disto, e o que já tinha ficado pronto continua aí em cima.<br>" +
    "Para seguir, escreve no campo abaixo o que quer diferente — eu recomeço daquele ponto." +
    (cego ? "<br>O gasto desta última etapa não foi medido: o custo só chega na linha final do processo, e ele não chegou lá." : "") +
    "</div>";
}

/* A faixa que diz onde a esteira está. A linha de cima é a ETAPA, que é o que
   responde "quanto falta"; a de baixo é o detalhe do segundo, que muda rápido
   demais para ser a informação principal.
   O total sai de `s.etapas`, nunca de um `07` escrito à mão: a conversa sobre um
   fluxo salvo tem cinco passos, e um "03 / 07" ali seria um contador prometendo
   duas etapas que não existem. */
function faixaProc(s) {
  const e = (s.etapas || []).find(x => x.n === s.etapa) || {};
  const total = (s.etapas || []).length || 7;
  const titulo = s.modo === "edicao"
    ? (e.nome ? "Trabalhando no seu pedido — " + e.nome : "Trabalhando no seu pedido…")
    : s.etapa === 1
      ? (s.entendi ? "Digerindo o que você respondeu…" : "Lendo a sua ideia…")
      : "Processando a próxima etapa — " + (e.nome || "");
  return '<div class="proc" role="status" aria-live="polite">' +
    '<span class="spin" aria-hidden="true"></span>' +
    '<span class="col"><span class="t1">' + esc(titulo) + "</span>" +
    '<span class="t2" id="atividade">' + esc(s.atividade || "começando…") + "</span></span>" +
    '<span class="passo">' + String(s.etapa).padStart(2, "0") + " / " + String(total).padStart(2, "0") + "</span>" +
    '<button type="button" class="parar" id="parar" title="parar esta etapa">⨯ parar <kbd>esc</kbd></button>' +
    "</div>";
}

/* ----------------------------------------------- conversa sobre um fluxo salvo
 *
 * Três coisas podem sair de um pedido, e a tela tem que distinguir as três:
 * uma FRASE (era dúvida, nada mudou), um REMENDO esperando decisão, ou um erro.
 * O fluxo salvo não muda em nenhuma delas até o clique em aplicar — e a faixa
 * do topo diz isso o tempo todo, porque a tela mostra o desenho do fluxo e
 * "estou vendo o fluxo" é fácil de confundir com "o fluxo já mudou". */
/* A ORDEM é a correção de um defeito medido: a conversa vinha primeiro e os
   artefatos (desenho, simulação, checklist) depois — uma tela inteira deles —
   então a mensagem recém-enviada aparecia "lá em cima" e a resposta chegava
   fora da vista. Numa conversa, o que cresce fica embaixo, junto do compositor:
   o desenho é CONTEXTO e fica no topo; simulação e credenciais viram um bloco
   recolhido (continuam a um clique, sem dominar a tela); a conversa flui por
   último, e o pintar() já rola para o fim quando você está perto dele. */
function blocosEdicao(s) {
  const out = [];
  const nos = (s.wf && s.wf.nodes || []).length;
  out.push('<div class="edhd"><span class="ix">[ CONVERSA SOBRE O FLUXO ]</span> ' +
    esc(s.projetoTitulo || s.titulo || "projeto salvo") + " · " + nos + " nós" +
    '<div class="edhd-sub">Pergunte, peça mudança, peça coisa nova ou peça para tirar. ' +
    "Nada é gravado enquanto você não aprovar o remendo.</div></div>");

  if (s.wf) out.push(canvas(s));

  const ctx = [];
  if (!s.proposta && s.fantasma) ctx.push(fantasmaBloco(s));
  /* Um remendo que acrescenta nó acrescenta credencial junto, e ela não aparece
     em lugar nenhum do diff — o patch tem `credentials` proibido justamente por
     isso. A checklist é o único lugar onde esse custo fica visível. */
  if (!s.proposta && s.wf) ctx.push(checklistCred(s, true));
  if (ctx.length) {
    out.push('<details class="ddet edctx"><summary>Simulação e credenciais deste fluxo</summary>' +
      '<div class="edctx-in">' + ctx.join("") + "</div></details>");
  }

  out.push(blocosConversa(s.chat, s));

  if (s.status === "correndo") out.push(faixaProc(s));

  if (s.gatesProposta && !s.gatesProposta.passou && !s.proposta) {
    out.push('<div class="gatefail"><div style="font-size:12.5px;font-weight:600;margin-bottom:7px">' +
      "O validador reprovou este remendo — vou tentar de novo</div><ul style=\"margin:0;padding-left:18px\">" +
      s.gatesProposta.falhas.map(f => "<li>" + esc(f) + "</li>").join("") + "</ul></div>");
  }

  if (s.proposta) out.push(propostaBloco(s));
  if (s.status === "cancelada") out.push(faixaParado(s));

  if (s.erro) out.push('<div class="erro"><strong>Parou aqui.</strong><br>' + esc(s.erro) + "</div>");
  return out.join("");
}

/* O remendo, antes de ser remendo. Resumo em português primeiro, porque é o que
   decide o clique; o diff embaixo é a prova, e vive num `<details>` para não
   empurrar o botão para fora da tela num fluxo grande. */
function propostaBloco(s) {
  const p = s.proposta;
  const d = p.diff || { nodes: [], connections: { added: [], removed: [] }, summary: {} };
  const sm = d.summary || {};
  const conta = [
    sm.added ? sm.added + " nó(s) novo(s)" : "",
    sm.modified ? sm.modified + " alterado(s)" : "",
    sm.removed ? sm.removed + " removido(s)" : "",
    sm.edgesAdded ? sm.edgesAdded + " ligação(ões) nova(s)" : "",
    sm.edgesRemoved ? sm.edgesRemoved + " ligação(ões) desfeita(s)" : ""
  ].filter(Boolean).join(" · ") || "nenhuma diferença medida";

  return '<div class="prop"><div class="sh"><span class="ix">[ REMENDO PROPOSTO ]</span> ' + esc(conta) + "</div>" +
    '<div class="prop-resumo">' + esc(p.resumo) + "</div>" +
    (p.porque ? '<div class="prop-porque">' + esc(p.porque) + "</div>" : "") +
    (p.removidos && p.removidos.length
      ? '<div class="prop-warn">Isto APAGA ' + p.removidos.length + " nó(s): " +
        esc(p.removidos.join(", ")) + ". A versão anterior fica guardada e o desfazer traz ela de volta.</div>"
      : "") +
    '<div class="prop-gates">✓ passou nos portões na rodada ' + (p.rodada || 1) +
      " · a cópia de teste no n8n só roda quando você aplicar</div>" +
    diffBloco(d) +
    (p.fantasma ? fantasmaBloco({ fantasma: p.fantasma, sementesOrigem: s.sementesOrigem }) : "") +
    '<div class="acoes"><button type="button" class="btn prime" id="aplicar">✓ Aplicar e salvar</button>' +
    '<button type="button" class="btn" id="descartar">Descartar este remendo</button>' +
    '<span class="cost">O FLUXO SALVO SÓ MUDA NO CLIQUE</span></div></div>';
}

function diffBloco(d) {
  const nos = (d.nodes || []).map(n => {
    const rot = { added: "NOVO", modified: "ALTERADO", removed: "REMOVIDO" }[n.kind] || "";
    return '<div class="dnode"><div class="dnh"><span class="dk ' + esc(n.kind) + '">' + rot + "</span>" +
      "<strong>" + esc(n.name) + "</strong><span class=\"dty\">" + esc(String(n.type).replace("n8n-nodes-base.", "")) + "</span></div>" +
      '<pre class="dlines">' + (n.lines || []).map(l =>
        '<span class="dl ' + (l.t === "+" ? "add" : l.t === "-" ? "del" : l.t === "~" ? "skip" : "ctx") + '">' +
        esc(l.t === "~" ? "  ⋯ " + l.s : l.t + " " + l.s) + "</span>").join("\n") + "</pre></div>";
  }).join("");

  const arestas = [
    ...(d.connections && d.connections.added || []).map(e => '<div class="dl add">+ ' + esc(e) + "</div>"),
    ...(d.connections && d.connections.removed || []).map(e => '<div class="dl del">- ' + esc(e) + "</div>")
  ].join("");

  if (!nos && !arestas) return '<div class="empty">o diff saiu vazio — isso não deveria acontecer com um remendo aprovado</div>';
  return "<details class=\"ddet\"><summary>Ver o diff, nó por nó</summary>" +
    nos + (arestas ? '<div class="dedges"><div class="dnh"><strong>ligações</strong></div>' + arestas + "</div>" : "") +
    "</details>";
}

/* Cada linha tem TRÊS estados, e a distância entre o segundo e o terceiro é a
   distância entre "ainda vou te perguntar" e "já decidi sem você":
     preenchido        — o que você disse;
     em aberto         — a entrevista continua, a pergunta ainda vem;
     suposição em vigor — ninguém mais vai perguntar e a construção segue com um
                          padrão, seja porque o modelo declarou a suposição
                          (prefixo "suposição:") ou porque a entrevista fechou
                          com o campo vazio.
   Enquanto os dois últimos diziam a mesma frase, o cartão cobrava resposta com a
   etapa 04 já desenhando — pedindo algo que não tinha mais onde ser respondido. */
function cartaoEntendi(e, dono) {
  const fechada = !!(dono && !(dono.perguntas || []).length && (dono.etapa || 1) > 1);
  const linha = (k, v) => {
    const t = String(v == null ? "" : v).trim();
    const sup = /^suposi[çc][ãa]o\s*:/i.test(t);
    const vazio = !t || /^n[ãa]o disse$/i.test(t);
    if (!sup && !vazio) return '<div class="row"><div class="k">' + esc(k) + '</div><div class="v">' + esc(t) + "</div></div>";
    if (vazio && !fechada) {
      return '<div class="row"><div class="k">' + esc(k) + '</div><div class="v miss">você ainda não disse</div></div>';
    }
    const txt = sup ? t.replace(/^suposi[çc][ãa]o\s*:\s*/i, "") : "vou usar o padrão mais comum e deixar marcado no fluxo";
    return '<div class="row"><div class="k">' + esc(k) + '</div><div class="v sup">' +
      '<span class="tagsup">SUPOSIÇÃO</span>' + esc(txt) + "</div></div>";
  };
  /* Só quando é agente. Dizer "automação" no cartão de todo fluxo normal seria
     ruído — a classificação só é notícia quando ela muda o que vem a seguir, e é
     isso que a segunda linha explica: a entrevista vai ser mais longa de
     propósito, e não porque travou. */
  const agente = dono && dono.ehAgente === true
    ? '<div class="row"><div class="k">tipo</div><div class="v">agente conversacional — vou perguntar mais que o normal ' +
      '(buffer, mídia, voz, memória, tools, escalonamento) porque cada uma dessas respostas muda os nós do fluxo</div></div>'
    : "";
  /* Uma suposição em vigor é uma decisão de construção tomada sem confirmação:
     o rodapé existe para dizer que ela ainda dá para desfazer, e como. Sem ele o
     cartão marca o campo de amarelo e não oferece saída nenhuma. */
  const vals = [e.quando, e.oQueFaz, e.resultado, e.ondeChega].map(v => String(v == null ? "" : v).trim());
  const temSup = vals.some(t => /^suposi[çc][ãa]o\s*:/i.test(t)) ||
    (fechada && vals.some(t => !t || /^n[ãa]o disse$/i.test(t)));
  const rodape = temSup
    ? '<div class="row"><div class="k">correção</div><div class="v" style="color:var(--txt-dim)">' +
      'escreva no campo lá embaixo o que está errado — eu recomeço a partir desta etapa</div></div>'
    : "";
  return '<div class="card"><div class="ch"><span class="ix">◈</span> O QUE EU ENTENDI</div>' +
    agente +
    linha("quando", e.quando) + linha("o que faz", e.oQueFaz) + linha("resultado", e.resultado) + linha("onde chega", e.ondeChega) +
    rodape +
    "</div>";
}

/* Clicar numa opção JÁ É a resposta. Não escreve nada no campo de baixo e não
   exige um segundo clique em Enviar: a escolha fica marcada no próprio cartão e
   viaja junto do "pode seguir".
   As escolhas são guardadas pelo TEXTO da pergunta, não pela posição — o SSE
   repinta a tela a cada evento, e um índice sobreviveria a um repaint mas não a
   uma pergunta reformulada. */
function pergunta(q) {
  const escolhida = S.respostas[q.q];
  const opcoes = q.opcoes || [];
  // Resposta que não está entre as sugestões só pode ter vindo do campo livre —
  // então ele reabre já preenchido, e a escolha sobrevive ao repaint do SSE.
  const ehOutro = escolhida !== undefined && !opcoes.includes(escolhida);
  // Com modelos a opção vira cartão com a mensagem montada; sem eles, o chip de
  // sempre. A escolha continua sendo a MESMA string nos dois casos — `data-resp`
  // é o contrato, e por isso o handler de clique não sabe nem precisa saber qual
  // dos dois desenhos está na tela.
  const comModelo = !!(q.modelos && Object.keys(q.modelos).length);
  return '<div class="q" data-q="' + esc(q.q) + '"><div class="qt">' + esc(q.q) + "</div>" +
    (q.porque ? '<div class="qw">' + esc(q.porque) + "</div>" : "") +
    '<div class="opts' + (comModelo ? " tpl" : "") + '" role="radiogroup" aria-label="' + esc(q.q) + '">' +
    opcoes.map(o => {
      const on = escolhida === o;
      if (comModelo) {
        return '<button type="button" class="tpl-op resp' + (on ? " on" : "") + '" role="radio" aria-checked="' +
          on + '" data-resp="' + esc(o) + '">' +
          '<span class="tpl-hd"><span class="tpl-dot" aria-hidden="true"></span>' + esc(o) + "</span>" +
          previaModelo(q.previa, q.modelos[o]) + "</button>";
      }
      return '<button type="button" class="chip resp' + (on ? " on" : "") + '" role="radio" aria-checked="' +
        on + '" data-resp="' + esc(o) + '">' + esc(o) + "</button>";
    }).join("") +
    '<button type="button" class="chip resp outro' + (ehOutro ? " on" : "") + '" role="radio" aria-checked="' +
      ehOutro + '">Outro…</button>' +
    "</div>" +
    '<input class="campo outro-campo" type="text" maxlength="200" placeholder="escreva a sua resposta"' +
      ' aria-label="outra resposta para: ' + esc(q.q) + '"' +
      (ehOutro ? "" : " hidden") + ' value="' + esc(ehOutro ? escolhida : "") + '">' +
    "</div>";
}

/* O modelo desenhado na anatomia do destino, para a escolha ser feita olhando a
   mensagem e não a descrição dela. A hora é a MESMA congelada do fantasma, pelo
   mesmo motivo: relógio vivo faria o mesmo modelo mudar a cada olhada.
   `marcarCampos` distingue o campo do valor — `{{ assunto }}` é o buraco onde o
   assunto entra, e sem a marca alguém lê aquilo como texto literal que o fluxo
   vai mandar. */
const marcarCampos = t => esc(t).replace(/\{\{\s*([^{}]{1,60}?)\s*\}\}/g, '<span class="ph">{{ $1 }}</span>');

function previaModelo(previa, texto) {
  const t = String(texto || "").trim();
  if (!t) return "";
  const topo = d => '<span class="mock-top"><span class="dest">' + esc(d) +
    '</span><span class="mk">MODELO</span></span>';

  if (previa === "slack") {
    return '<span class="mock tpl-mock">' + topo("canal do Slack") +
      '<span class="slack-msg"><span class="slack-av" aria-hidden="true">◈</span><span class="slack-col">' +
      '<span class="slack-head"><strong>seu fluxo</strong><span class="badge-app">APP</span>' +
      '<span class="mock-time">' + HORA_SIM + "</span></span>" +
      '<span class="mock-text">' + marcarCampos(t) + "</span></span></span></span>";
  }
  if (previa === "whatsapp") {
    return '<span class="mock tpl-mock">' + topo("conversa no WhatsApp") +
      '<span class="wha-chat"><span class="wha-bubble"><span class="mock-text">' + marcarCampos(t) + "</span>" +
      '<span class="wha-meta">' + HORA_SIM + " ✓✓</span></span></span></span>";
  }
  if (previa === "email") {
    // Um e-mail se lê pelo assunto primeiro. Quando o modelo abre com
    // "Assunto: …", essa linha sobe para o cabeçalho em vez de ficar enterrada
    // como primeira linha do corpo, que é onde ninguém procura por ela.
    const linhas = t.split("\n");
    const m = /^assunto\s*:\s*(.+)$/i.exec((linhas[0] || "").trim());
    const assunto = m ? m[1] : "";
    const corpo = m ? linhas.slice(1).join("\n").trim() : t;
    return '<span class="mock tpl-mock">' + topo("e-mail") +
      '<span class="mail-head"><span class="k">assunto</span>' +
      '<span class="sub">' + (assunto ? marcarCampos(assunto) : "(definido no fluxo)") + "</span></span>" +
      '<span class="mail-body"><span class="mock-text">' + marcarCampos(corpo) + "</span></span></span>";
  }
  return '<span class="mock tpl-mock">' + topo("mensagem") +
    '<span class="mail-body"><span class="mock-text">' + marcarCampos(t) + "</span></span></span>";
}

function portao(titulo, desc, botao, custo) {
  return '<div class="gate"><div class="gt">' + esc(titulo) + '</div><div class="gd">' + esc(desc) + "</div>" +
    '<div class="acts"><button type="button" class="btn prime" id="seguir">' + esc(botao) + "</button>" +
    '<span class="cost">ATÉ AQUI US$' + (custo || 0).toFixed(2).replace(".", ",") + " · PLANO, SEM COBRANÇA POR FORA</span></div></div>";
}

/* O bloco de ação enquanto a entrevista tem perguntas em aberto. "Enviar" leva
   as respostas para a rodada seguinte — o modelo digere e pergunta o que ainda
   faltar, ou libera o portão. "Pular" segue com o que existe. */
function acoesEntrevista(s) {
  const n = (s.perguntas || []).length;
  return '<div class="gate"><div class="gt">' +
      (n === 1 ? "Falta 1 resposta pra fechar o desenho" : "Faltam " + n + " respostas pra fechar o desenho") + "</div>" +
    '<div class="gd">Cada resposta vira uma decisão de construção. Dá pra pular, mas o que ficar em aberto ' +
      "eu preencho com o padrão mais comum e marco como suposição nos achados.</div>" +
    '<div class="acts"><button type="button" class="btn prime" id="responder">Enviar respostas →</button>' +
    '<button type="button" class="btn" id="seguir">Pular e construir assim mesmo</button>' +
    '<span class="cost">RODADA ' + (s.rodadaEntrevista || 1) + ' DA ENTREVISTA · ATÉ AQUI US$' +
      (s.custoTotal || 0).toFixed(2).replace(".", ",") + "</span></div></div>";
}

function composer(s) {
  const trabalhando = s.status === "correndo";
  /* Anexo que a sessão ainda não abriu. A dica muda por causa dele, e a razão
     não é enfeite: um print sozinho não diz o que fazer com ele. O botão exige
     texto de propósito — inventar uma frase em nome dela ("olha os anexos")
     colocaria no chat uma mensagem que ela não escreveu. */
  const pendentes = (s.anexos || []).filter(a => !(s.anexosLidos || []).includes(a.arquivo)).length;
  const dica = pendentes
    ? "anexei " + pendentes + " arquivo(s) — escreve o que eu devo fazer com isso"
    : s.modo === "edicao"
      ? (trabalhando
          ? "escreve aqui pra trocar o pedido — eu largo o atual e começo por este"
          : "pergunta sobre o fluxo, ou pede o que mudar, acrescentar ou tirar…")
      : (trabalhando ? "escreve aqui pra corrigir no meio do caminho — eu recomeço deste ponto" : "escreve o que mudar…");
  /* Os chips dos anexos da SESSÃO ficam acima da caixa, e o `lidos` é o que
     transforma isso em informação: sai do `tool_use` observado no stream da
     sessão, então um chip marcado significa "ela abriu este arquivo", nunca "o
     prompt pediu para abrir". Sem essa distinção, anexar seria fé. */
  const anx = (s.anexos || []);
  /* Chips e caixa num invólucro só (`.compzone`), e isso não é arrumação de
     markup: `ligarIO` liga o `×` de cada chip com um `querySelectorAll` dentro
     da caixa que recebe. Com os chips como irmãos da `.composer`, esse
     `querySelectorAll` achava zero botões e tirar um anexo no meio da conversa
     não fazia nada — sem erro no console, que é a pior forma de não funcionar.
     Arrastar um arquivo também passa a valer sobre a área inteira, que é onde a
     mão vai. */
  return '<div class="compzone">' +
    (anx.length ? IO().chipsAnexos(anx, s.anexosLidos || [], !trabalhando) + IO().notaAnexos(anx) : "") +
    (S.subindo ? '<div class="anxnota">subindo ' + S.subindo + " arquivo(s)…</div>" : "") +
    (S.anexoErro ? avisoHtml(S.anexoErro, "alerta") : "") +
    '<div class="composer">' +
    '<textarea id="resposta" rows="1" placeholder="' + esc(dica) +
      '" aria-label="sua resposta"></textarea>' +
    IO().barraIO("cp") +
    '<button type="button" class="btn" id="enviar">Enviar</button></div>' +
    '</div>';
}

/* ------------------------------------------------------------- o desenho */

const GLYPH = {
  trigger: '<circle cx="0" cy="0" r="7"/><path d="M0 -4 V0 L3 2.5"/>',
  http:    '<circle cx="0" cy="0" r="7"/><path d="M-7 0h14M0 -7c3.2 3 3.2 11 0 14M0 -7c-3.2 3 -3.2 11 0 14"/>',
  code:    '<path d="M-3 -5 L-8 0 L-3 5"/><path d="M3 -5 L8 0 L3 5"/>',
  branch:  '<path d="M-7 0h5l4 -5h5"/><path d="M-2 0l4 5h5"/>',
  msg:     '<path d="M-8 -5h16v9h-9l-4 4v-4h-3z"/>',
  db:      '<ellipse cx="0" cy="-4" rx="7" ry="2.6"/><path d="M-7 -4v8c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-8"/>',
  set:     '<path d="M-7 -4h14M-7 0h9M-7 4h5"/>'
};
function glyphDe(t) {
  const s = String(t || "");
  if (/trigger|cron|schedule|webhook/i.test(s)) return "trigger";
  if (/httpRequest/i.test(s)) return "http";
  if (/\.code$/i.test(s)) return "code";
  if (/\.(if|switch|filter)$/i.test(s)) return "branch";
  if (/slack|whatsApp|telegram|gmail|emailSend/i.test(s)) return "msg";
  if (/supabase|postgres|mySql|redis|googleSheets|clickUp|airtable/i.test(s)) return "db";
  return "set";
}

function canvas(s) {
  return '<div class="canvas" id="canvas">' +
    '<div class="corner" id="corner"></div>' +
    '<div class="canvas-ctl"><button type="button" class="iconbtn" id="fit">ajustar</button></div>' +
    '<div class="canvas-hint">arraste para mover · role para aproximar · duplo clique para ajustar</div></div>';
}

/* Revela o desenho nó a nó e deixa navegar com o mouse.
 *
 * Duas decisões que vieram de olhar a tela funcionando:
 *   - FILEIRA ÚNICA. O ziguezague economizava largura mas empilhava o rótulo de
 *     um nó em cima do vizinho, e metade dos nomes sumia da tela. Com pan e zoom
 *     a largura deixou de ser problema, então a fileira reta ganha.
 *   - A câmera é DESTE svg. O palco do flows.html tem uma câmera singleton;
 *     dirigi-la daqui moveria a outra tela por baixo.
 *
 * O contador mostra a contagem final quando termina, e "MONTANDO i / n" durante
 * a revelação — ele revela um documento que já está pronto, e não afirma estar
 * escrevendo o terceiro nó enquanto os cinco já existem. */

/* O que o desenho MOSTRA — e é isto, nunca a atividade, que decide reconstruir.
 * Mora aqui e não no bloco de juízo pelo mesmo motivo do `palcoAssinatura` do
 * upgrade.html: ela é o inventário do que a função ali embaixo desenha, e
 * separá-las é como as duas divergem.
 *
 * Cada parte está aqui porque o desenho depende dela:
 *   - `parcial` (rascunho contra validado) troca o rótulo do `#corner` — é a
 *     transição de "[ RASCUNHO · N NOS · AINDA DESENHANDO ]" para
 *     "[ N NOS · M CONEXOES ]", e sem ela o rótulo ficaria preso em rascunho.
 *   - `name` desenha o rótulo e é a chave de tudo. Era a assinatura INTEIRA, e
 *     bastava enquanto o svg era reconstruído a cada evento de qualquer forma:
 *     com o nó preservado, uma troca de `type` com os mesmos nomes pararia de
 *     aparecer na tela.
 *   - `type` desenha o glifo, a linha de tipo e o `<title>`, e `typeVersion`
 *     entra no `<title>`. Um `stickyNote` novo também cai aqui: ele não é
 *     desenhado, mas é documento novo, e reconstruir uma vez é o lado certo de
 *     errar.
 *   - `connections` é a topologia: as arestas, quais nós vão para a segunda
 *     trilha (portas `ai_*`), a largura e o `viewBox`. Vai inteira em vez de
 *     destilada em pares porque destilar exigiria repetir aqui a varredura de
 *     três níveis que a função faz — duas cópias que divergem na primeira
 *     correção feita num lado só. O preço é declarado: um `index` mudando dentro
 *     de `connections` reconstrói sem diferença visível. Assinatura estrita de
 *     mais desperdiça um redesenho; solta de mais ESCONDE uma mudança, e esta
 *     casa falha fechado.
 *
 * MEDIDO no agente de 65 nós (`.tester-runs/t74ee9813fa57`): 9.185 caracteres e
 * 0,105 ms — contra 0,669 ms só do `JSON.parse` do `wf` que o refresh já paga, e
 * contra os 652 elementos SVG e 69 `getTotalLength()` que ela substitui. */
const desenhoAssinatura = s => {
  const wf = s && (s.wf || s.wfParcial);
  if (!wf) return null;
  return JSON.stringify([
    !(s.wf),
    (wf.nodes || []).map(n => [n.name, n.type, n.typeVersion == null ? null : n.typeVersion]),
    wf.connections || null
  ]);
};

/* `#fit` e `#corner` são filhos do `#canvas`, então o `app.innerHTML` do
   `pintar()` os recria a cada evento — INCLUSIVE quando o svg é preservado. O
   `ajustar` é um closure sobre o escopo da construção, e sem religar ele o botão
   pinta e não faz nada: erro nenhum no console, que é o defeito que este repo já
   pagou duas vezes. */
function religarCanvas() {
  const fit = $("#fit");
  if (fit && S.desenhoAjustar) fit.addEventListener("click", S.desenhoAjustar);
  const corner = $("#corner");
  // Enquanto a revelação corre, o contador é DELA: escrever o rótulo final aqui
  // afirmaria a contagem antes de o último nó chegar.
  if (corner && !S.desenhoMontando && S.desenhoRotulo) corner.textContent = S.desenhoRotulo;
}

/* Devolve se RECONSTRUIU. */
function desenharSeNovo(s) {
  const host = $("#canvas");
  const wf = s.wf || s.wfParcial;
  if (!host || !wf) return false;
  const parcial = !s.wf;
  const assinatura = desenhoAssinatura(s);
  const jaEra = S.desenhado === assinatura;

  /* O NÓ ATRAVESSA O REPAINT. Um `return` seco aqui não serviria: o `#canvas` é
     um nó NOVO e VAZIO a cada evento, e a tela ficaria sem desenho. O que
     acontece é o mesmo do `pintarPalco` do upgrade.html — o svg é segurado em
     `S.desenhoEl` e RE-ANEXADO no hospedeiro novo, com a câmera, os seis
     listeners de pan/zoom e a revelação em curso vivos dentro dele.
     A trava tinha de subir para cá: ela existia, e era consultada 160 linhas
     depois de o svg inteiro já ter sido construído e o antigo demolido. */
  if (jaEra && S.desenhoEl) {
    if (S.desenhoEl.parentNode !== host) host.appendChild(S.desenhoEl);
    religarCanvas();
    return false;
  }

  const nodes = wf.nodes.filter(n => !/stickyNote/i.test(n.type));
  const W = 64, H = 48, GAP = 176, PAD = 44, LINHA = 66;

  const ordem = new Map(nodes.map((n, i) => [n.name, i]));
  const arestas = [];
  /* O nome da porta importa aqui, não só a existência da aresta. Um agente pendura
     modelo, memória, parser e cada tool nas portas `ai_*`, e essas conexões vão do
     anexo PARA o agente — na trilha única elas viravam arestas voltando da direita
     para a esquerda por cima de tudo, e um agente saía como espaguete. */
  const anexo = new Map();          // nó de IA -> nome do agente a que ele serve
  for (const [de, portas] of Object.entries(wf.connections || {})) {
    for (const [porta, ramos] of Object.entries(portas || {})) {
      for (const lista of ramos || []) for (const c of lista || []) {
        if (!ordem.has(de) || !ordem.has(c.node)) continue;
        arestas.push([ordem.get(de), ordem.get(c.node), porta]);
        if (/^ai_/.test(porta)) anexo.set(de, c.node);
      }
    }
  }

  /* Duas trilhas, como o editor do n8n desenha: a de execução na horizontal, e os
     anexos de IA numa faixa abaixo do agente que eles servem. */
  const TRILHA2 = LINHA + H + 62;
  const principais = nodes.filter(n => !anexo.has(n.name));
  const colDe = new Map(principais.map((n, i) => [n.name, i]));
  const pos = [];
  const porAgente = new Map();
  for (const n of nodes) {
    if (!anexo.has(n.name)) { pos[ordem.get(n.name)] = [PAD + colDe.get(n.name) * GAP, LINHA]; continue; }
    const alvo = anexo.get(n.name);
    const fila = porAgente.get(alvo) || [];
    porAgente.set(alvo, fila.concat([n.name]));
    // Espalhados sob o agente, meio GAP entre eles, começando meio GAP à esquerda.
    pos[ordem.get(n.name)] = [PAD + (colDe.has(alvo) ? colDe.get(alvo) : 0) * GAP + fila.length * (GAP * 0.52) - GAP * 0.5, TRILHA2];
  }

  /* A largura sai do nó mais à direita que EXISTE, não de uma estimativa por
     colunas: com anexos a estimativa sobrava ~400px de vazio à direita e o
     `viewBox` encolhia o desenho inteiro para caber em espaço que ninguém usa. */
  const direita = pos.reduce((m, p) => Math.max(m, (p && p[0]) || 0), 0) + W;
  const largura = Math.max(direita + PAD, PAD * 2 + GAP);
  const alt = anexo.size ? TRILHA2 + H + 46 : 200;

  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = mk("svg", { viewBox: "0 0 " + largura + " " + alt, preserveAspectRatio: "xMidYMid meet",
    role: "img", "aria-label": "desenho do fluxo com " + nodes.length + " nos" });
  const cam = mk("g", { class: "cam" });
  const gE = mk("g", {}), gN = mk("g", {});
  cam.append(gE, gN);
  svg.appendChild(cam);

  const paths = arestas.map(par => {
    const [x1, y1] = pos[par[0]], [x2, y2] = pos[par[1]];
    const ehIA = /^ai_/.test(par[2] || "");
    /* Aresta de execução sai da direita e entra pela esquerda. Aresta de IA sai do
       TOPO do anexo e entra por BAIXO do agente — é o que faz as duas trilhas
       lerem como duas coisas diferentes em vez de um grafo emaranhado. */
    const d = ehIA
      ? (() => {
          const ax = x1 + W / 2, ay = y1, bx = x2 + W / 2, by = y2 + H;
          return "M" + ax + "," + ay + " C" + ax + "," + (ay - 34) + " " + bx + "," + (by + 34) + " " + bx + "," + by;
        })()
      : (() => {
          const ax = x1 + W, ay = y1 + H / 2, bx = x2, by = y2 + H / 2;
          return "M" + ax + "," + ay + " C" + (ax + 64) + "," + ay + " " + (bx - 64) + "," + by + " " + bx + "," + by;
        })();
    const p = mk("path", { class: "edge" + (ehIA ? " ia" : ""), d });
    gE.appendChild(p);
    p.style.setProperty("--len", Math.ceil(p.getTotalLength()) + "px");
    return p;
  });

  const gs = nodes.map((n, i) => {
    const x = pos[i][0], y = pos[i][1];
    const g = mk("g", { class: "nd" });
    g.appendChild(mk("rect", { class: "face", x: x, y: y, width: W, height: H, rx: 10 }));
    const gl = mk("g", { class: "glyph", transform: "translate(" + (x + W / 2) + "," + (y + H / 2) + ")" });
    gl.innerHTML = GLYPH[glyphDe(n.type)];
    g.appendChild(gl);
    /* Anexo de IA tem UMA porta, no topo: ele não está no caminho da execução,
       ele é pendurado no agente. Desenhar portas laterais nele diria que o dado
       passa por ali, e não passa. */
    if (anexo.has(n.name)) {
      g.appendChild(mk("circle", { class: "port", cx: x + W / 2, cy: y, r: 2.8 }));
    } else {
      g.appendChild(mk("circle", { class: "port", cx: x, cy: y + H / 2, r: 2.8 }));
      g.appendChild(mk("circle", { class: "port", cx: x + W, cy: y + H / 2, r: 2.8 }));
    }
    const nm = mk("text", { class: "nm", x: x + W / 2, y: y + H + 15 }); nm.textContent = n.name;
    const ty = mk("text", { class: "ty", x: x + W / 2, y: y + H + 26 });
    ty.textContent = String(n.type).replace("n8n-nodes-base.", "").replace("@n8n/n8n-nodes-langchain.", "ia/");
    const tt = mk("title", {});
    tt.textContent = n.name + "  ·  " + n.type + (n.typeVersion ? "  v" + n.typeVersion : "");
    g.append(nm, ty, mk("rect", { class: "caret", x: x + W + 6, y: y + H / 2 - 6, width: 2, height: 12 }), tt);
    gN.appendChild(g);
    return g;
  });

  host.querySelectorAll("svg").forEach(x => x.remove());
  host.appendChild(svg);
  /* O `#corner` é lido a cada escrita, nunca capturado: a revelação sobrevive ao
     repaint agora, e o nó que ela tinha na mão no começo já foi jogado fora pelo
     `innerHTML` — escrever nele seria escrever num órfão. */
  const escreverCorner = txt => { const c = $("#corner"); if (c) c.textContent = txt; };
  // Rascunho é dito como rascunho: o desenho ao vivo vem do Write da sessão,
  // ANTES dos portões — afirmar contagem final aqui seria prometer cedo demais.
  const rotulo = parcial
    ? "[ RASCUNHO · " + nodes.length + " NOS · AINDA DESENHANDO ]"
    : "[ " + nodes.length + " NOS · " + arestas.length + " CONEXOES ]";

  /* ------------------------------------------------------------- a câmera */
  // O SSE repinta e recria este svg a cada evento; a câmera vive em S para o
  // pan/zoom não voltar ao zero no meio de uma olhada.
  const cm = (S.cam && S.cam.assinatura === assinatura)
    ? { x: S.cam.x, y: S.cam.y, k: S.cam.k }
    : { x: 0, y: 0, k: 1 };
  const aplicar = () => {
    cam.setAttribute("transform", "translate(" + cm.x + "," + cm.y + ") scale(" + cm.k + ")");
    S.cam = { assinatura, x: cm.x, y: cm.y, k: cm.k };
  };
  aplicar();
  const ajustar = () => { cm.x = 0; cm.y = 0; cm.k = 1; aplicar(); };
  const escala = () => largura / (svg.getBoundingClientRect().width || largura);

  let arrasto = null;
  svg.addEventListener("pointerdown", ev => {
    arrasto = { x: ev.clientX, y: ev.clientY, cx: cm.x, cy: cm.y };
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* sem captura */ }
    svg.style.cursor = "grabbing";
  });
  svg.addEventListener("pointermove", ev => {
    if (!arrasto) return;
    // O ponteiro anda em pixel de tela; a câmera vive em unidade do viewBox.
    const e = escala();
    cm.x = arrasto.cx + (ev.clientX - arrasto.x) * e;
    cm.y = arrasto.cy + (ev.clientY - arrasto.y) * e;
    aplicar();
  });
  const soltar = ev => {
    arrasto = null; svg.style.cursor = "grab";
    try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* já solto */ }
  };
  svg.addEventListener("pointerup", soltar);
  svg.addEventListener("pointercancel", soltar);
  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    const e = largura / (r.width || largura);
    // Ponto sob o cursor, em unidade do desenho: o zoom mantém ele parado.
    const px = (ev.clientX - r.left) * e, py = (ev.clientY - r.top) * e;
    const k2 = Math.min(3, Math.max(0.35, cm.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    cm.x = px - (px - cm.x) * (k2 / cm.k);
    cm.y = py - (py - cm.y) * (k2 / cm.k);
    cm.k = k2;
    aplicar();
  }, { passive: false });
  svg.addEventListener("dblclick", ajustar);
  svg.style.cursor = "grab";
  const fit = $("#fit");
  if (fit) fit.addEventListener("click", ajustar);

  /* O desenho e o que o repaint precisa para religar em volta dele. `S.desenhado`
     é atribuído AQUI, antes de qualquer `return`, e isso conserta um defeito
     latente real: a ordem antiga era `if (jaEra || reduzido) { …; return; }` e só
     depois `S.desenhado = assinatura`, então com `prefers-reduced-motion` a
     atribuição nunca acontecia, `jaEra` era sempre falso e o desenho era
     reconstruído inteiro a CADA evento do SSE, para sempre. Quem pediu menos
     movimento pagava mais CPU. */
  S.desenhoEl = svg;
  S.desenhoAjustar = ajustar;
  S.desenhoRotulo = rotulo;
  S.desenhado = assinatura;
  /* A revelação sobrevive ao repaint, então duas podem existir ao mesmo tempo —
     a antiga rodando sobre um svg já substituído. Ela para de mexer no `#corner`
     do desenho novo por causa deste selo, no molde do `alive()` do flows.html. */
  const gen = S.desenhoGen = (S.desenhoGen || 0) + 1;
  S.desenhoMontando = false;

  const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (jaEra || reduzido) {
    gs.forEach(g => g.classList.add("built"));
    paths.forEach(p => p.classList.add("done"));
    escreverCorner(rotulo);
    return true;
  }
  S.desenhoMontando = true;

  // Nada re-anima numa atualização: a assinatura acima é o que impede o SSE de
  // redesenhar tudo a cada evento. Movimento sem informação nova vira ruído.
  (async () => {
    for (let i = 0; i < gs.length; i++) {
      if (gen !== S.desenhoGen) return;        // outro desenho tomou o lugar deste
      if (i > 0 && paths[i - 1]) {
        paths[i - 1].classList.add("drawing");
        await esperar(400);
        paths[i - 1].classList.remove("drawing");
        paths[i - 1].classList.add("done");
      }
      gs[i].classList.add("writing");
      escreverCorner("[ MONTANDO " + (i + 1) + " / " + gs.length + " ]");
      await esperar(400);
      gs[i].classList.remove("writing"); gs[i].classList.add("built");
      await esperar(80);
    }
    if (gen !== S.desenhoGen) return;
    paths.forEach(p => p.classList.add("done"));
    S.desenhoMontando = false;
    escreverCorner(rotulo);
  })();
  return true;
}

const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ------------------------------------------------------------- o fantasma */

function fantasmaBloco(s) {
  const f = s.fantasma;
  if (!f.ok) {
    return '<div class="surf"><div class="sh">' + TITULO_FANTASMA(f) + "</div>" +
      '<div class="band" style="border-color:var(--warn-soft);background:var(--warn-soft);color:var(--warn-txt)">' +
      '<span class="txt" style="white-space:normal">Não simulei este fluxo: ' + esc(f.recusa) + "</span></div>" +
      (f.detalhe ? '<div class="empty" style="white-space:normal;text-align:left">' + esc(f.detalhe) + "</div>" : "") +
      '<div class="selo">' + esc(SELO_RECUSA[f.classe] || SELO_RECUSA[""]) + "</div></div>";
  }
  // A entrada dos mockups anima UMA vez por resultado: o SSE repinta a tela a
  // cada evento, e sem a assinatura a mensagem "chegaria" de novo a cada poll —
  // movimento sem informação nova, exatamente o que o resto do cockpit evita.
  const assin = JSON.stringify(f.superficies || []);
  const anim = S.fantasmaVisto !== assin;
  S.fantasmaVisto = assin;
  const sup = (f.superficies || []).map((x, i) => superficie(x, i, anim)).join("");
  const pend = (f.pendencias || []).filter(p => p.expr || p.motivo);
  return '<div class="surf"><div class="sh">[ 06 ] O QUE ISTO PRODUZIRIA · ' +
      esc(s.sementesOrigem || "dados de exemplo") + "</div>" +
    (sup || '<div class="empty">o fluxo não termina num destino que eu saiba desenhar</div>') +
    (pend.length ? '<div style="margin-top:11px">' + pend.map(p =>
      '<div class="i risco" style="margin-bottom:6px"><div class="ih"><span class="kind">CHECAR</span></div>' +
      '<div class="tx">' + (p.no ? "<strong>" + esc(p.no) + "</strong> · " : "") +
      (p.expr ? "<code>{{ " + esc(p.expr) + " }}</code><br>" : "") + esc(p.motivo) + "</div></div>").join("") + "</div>" : "") +
    '<div class="selo">' + esc(SELO_FANTASMA) + "</div></div>";
}

/* Cada destino é desenhado com a anatomia do app onde a mensagem chegaria —
 * forma e rótulo, nunca cor de marca (o comentário no CSS diz por quê). A hora
 * é a do relógio CONGELADO da simulação (simulate.js fixa 09:00): um relógio de
 * verdade faria a mesma simulação mudar a cada olhada. */
const HORA_SIM = "09:00";

function superficie(x, i, anim) {
  const e = x.envio || {};
  const marca = t => esc(t).replace(/⟨não simulada⟩/g, '<span class="naosim">não simulada</span>');
  const rot = x.rotulo || String(x.tipo || "").replace("n8n-nodes-base.", "") || "destino";
  const abre = '<div class="mock' + (anim ? " anim" : "") + '"' +
    (anim && i ? ' style="animation-delay:' + (i * 160) + 'ms"' : "") + ">";
  const selo = '<span class="mk">SIMULAÇÃO</span>';
  const topo = dest => '<div class="mock-top"><span class="dest">' + dest + "</span>" + selo + "</div>";

  if (x.superficie === "slack") {
    return abre + topo(marca(e.canal || "canal não definido")) +
      '<div class="slack-msg"><div class="slack-av" aria-hidden="true">◈</div><div>' +
        '<div class="slack-head"><strong>' + esc(x.no || "seu fluxo") + '</strong>' +
        '<span class="badge-app">APP</span><span class="mock-time">' + HORA_SIM + "</span></div>" +
        '<div class="mock-text">' + marca(e.texto || "(mensagem vazia)") + "</div>" +
      "</div></div></div>";
  }
  if (x.superficie === "whatsapp") {
    return abre + topo(esc(rot) + " · para " + marca(e.para || "destino não definido")) +
      '<div class="wha-chat"><div class="wha-bubble">' +
        '<div class="mock-text">' + marca(e.texto || "(mensagem vazia)") + "</div>" +
        '<span class="wha-meta">' + HORA_SIM + " ✓✓</span></div></div></div>";
  }
  if (x.superficie === "email") {
    return abre + topo(esc(rot)) +
      '<div class="mail-head">' +
        '<span class="k">para</span><span>' + marca(e.para || "destinatário não definido") + "</span>" +
        '<span class="k">assunto</span><span class="sub">' + marca(e.assunto || "(sem assunto)") + "</span>" +
      "</div>" +
      '<div class="mail-body"><div class="mock-text">' + marca(e.texto || "(sem corpo)") + "</div></div></div>";
  }
  if (x.superficie === "linha") {
    const campos = linhaCampos(e);
    const chaves = Object.keys(campos);
    const tabela = chaves.length
      ? '<div class="tblwrap"><table class="tbl"><thead><tr>' +
          chaves.map(k => "<th>" + esc(k) + "</th>").join("") + "</tr></thead>" +
          "<tbody><tr>" + chaves.map(k => "<td>" + marca(campos[k]) + "</td>").join("") + "</tr></tbody></table></div>"
      : '<div class="mail-body"><div class="mock-text">não deu para derivar os campos da linha — veja o JSON do nó</div></div>';
    return abre + topo(esc(rot) + " · " + marca(e.tabela || "tabela não definida") + " · 1 linha nova") + tabela + "</div>";
  }
  if (x.superficie === "resposta") {
    return abre + topo(esc(rot)) +
      '<div class="http-resp"><span class="hst">HTTP 200</span>\n' + marca(e.texto || "(corpo vazio)") + "</div></div>";
  }
  // Destino que não tem anatomia própria: o envio, campo a campo.
  const linhas = Object.entries(e).map(([k, v]) =>
    "<dt>" + esc(k) + "</dt><dd>" + marca(typeof v === "object" ? JSON.stringify(v) : v) + "</dd>").join("");
  return abre + topo("envio para " + esc(String(x.tipo || rot).replace("n8n-nodes-base.", ""))) +
    '<div class="mail-body"><dl class="kv">' + linhas + "</dl></div></div>";
}

/* Achata o registro de uma "linha gravada" para virar colunas de tabela. Cobre
 * as duas formas que os nós desta instância usam: `fieldsUi.fieldValues[]` do
 * Supabase e `columns.value{}` do Google Sheets. O resto passa como está. */
function linhaCampos(e) {
  const out = {};
  const poe = (k, v) => {
    if (v === undefined || v === null || v === "") return;
    out[String(k)] = typeof v === "object" ? JSON.stringify(v) : String(v);
  };
  for (const [k, v] of Object.entries(e.campos || {})) {
    if (v && typeof v === "object" && Array.isArray(v.fieldValues)) {
      for (const fv of v.fieldValues) if (fv && fv.fieldId !== undefined) poe(fv.fieldId, fv.fieldValue);
    } else if (v && typeof v === "object" && v.value && typeof v.value === "object" && !Array.isArray(v.value)) {
      for (const [k2, v2] of Object.entries(v.value)) poe(k2, v2);
    } else poe(k, v);
  }
  return out;
}

/* -------------------------------------------------------------- a entrega */

/* ------------------------------------------------ checklist de credenciais
 *
 * A lista por TIPO responde "o que este fluxo precisa". Esta responde "e agora,
 * o que eu clico" — que é a pergunta que sobra com o fluxo já importado e três
 * nós vermelhos na tela, e que exigia traduzir tipo de credencial em nó a olho.
 *
 * Três coisas que ela NÃO pode fingir, e que estão escritas nela:
 *   - a API pública responde 405 em `GET /credentials`, então não existe
 *     inventário: "você já usa" quer dizer que algum fluxo seu referencia esse
 *     TIPO, nunca que a credencial certa existe e está válida;
 *   - a lista sai dos fluxos dele, então um nó que aqui nunca pediu credencial
 *     não aparece. É piso, não total — a mesma honestidade da varredura truncada;
 *   - a cópia de teste no n8n roda SEM credencial, então nada aqui foi
 *     autenticado. O portão daquela etapa prova schema, nunca acesso.
 */
function checklistCred(s, vivo) {
  const lista = (s.ingredientes && s.ingredientes.porNo) || [];
  const base = (S.capab && S.capab.instancia) || "";
  const linkCred = base ? base + "/home/credentials" : "";
  const ligados = new Map(((s.credLigacao && s.credLigacao.ligados) || []).map(l => [l.no, l]));
  // Empatado é diferente de vazio: aqui existe credencial, o que falta é a
  // escolha. Só esse caso ganha botão.
  const empatados = new Map(((s.credLigacao && s.credLigacao.vazios) || [])
    .filter(v => (v.candidatos || []).length > 1).map(v => [v.no, v]));

  if (!lista.length) {
    return '<div class="surf"><div class="sh">[ CREDENCIAIS ] POR NÓ</div>' +
      '<div class="empty">nenhum nó deste fluxo pediu credencial nos seus outros fluxos. ' +
      "Isso é o que dá para afirmar — não é promessa de que nenhum vai pedir.</div></div>";
  }

  const faltando = lista.filter(x => (x.opcoes || []).every(o => !o.visto)).length;
  const linhas = lista.map(x => {
    const ops = (x.opcoes || []).map(o => {
      // Nomear vale mais que tipar: "Slack Ecommerce Puro, em 6 fluxos" é
      // acionável, "existe alguma do tipo slackApi" não é.
      // `sens`: o nome da credencial identifica a conta real — é o que o modo
      // gravação borra nesta tela.
      const ex = (o.existentes || []).slice(0, 3).map(e =>
        '<span class="cr-nome"><span class="sens">' + esc(e.nome || "(sem nome)") + "</span>" +
        '<span class="cr-usos">' + e.usos + (e.usos === 1 ? " fluxo" : " fluxos") + "</span></span>").join("");
      const sobra = Math.max(0, (o.existentes || []).length - 3);
      return '<div class="cr-op ' + (o.visto ? "tem" : "nao") + '">' +
        '<span class="cr-tag">' + (o.visto ? "JÁ USA" : "NÃO ACHEI") + "</span>" +
        "<code>" + esc(o.tipo) + "</code>" +
        (ex ? '<span class="cr-nomes">' + ex + (sobra ? '<span class="cr-usos">+' + sobra + "</span>" : "") + "</span>" : "") +
        (o.campos && o.campos.length ? '<span class="cr-campos">pede: ' + esc(o.campos.join(", ")) + "</span>" : "") +
      "</div>";
    }).join("");
    const lig = ligados.get(x.no);
    /* O desempate, no lugar onde o empate é mostrado. Um nó com duas credenciais
       possíveis ficava em branco para sempre: o cockpit se recusa a chutar — um
       palpite importaria calado e mandaria a mensagem pela conta errada — e até
       aqui não havia como dizer qual era. Clicar é grátis e instantâneo: o que
       viaja é o `id` de uma credencial que já existe, nunca um segredo. */
    const emp = empatados.get(x.no);
    const escolher = (emp && vivo)
      ? '<div class="cr-pick"><span class="cr-nota">qual delas?</span>' +
        emp.candidatos.filter(c => c.id).map(c =>
          '<button type="button" class="chip cr-esc" data-cred="' + esc(c.id) + '">usar a <span class="sens">' + esc(c.nome) + "</span></button>").join("") +
        "</div>"
      : (emp
        ? '<div class="cr-nota">mais de uma credencial serviria — abra em «Conversar e editar» para escolher</div>'
        : "");

    return '<div class="cr-row"><div class="cr-no"><strong>' + esc(x.no) + "</strong><br>" +
      '<span class="cr-ty">' + esc(String(x.tipo).replace("n8n-nodes-base.", "")) + "</span>" +
      (lig ? '<br><span class="cr-lig">✓ já vai ligado no JSON' + (lig.porEscolha ? " (escolha sua)" : "") + "</span>" : "") + "</div>" +
      '<div class="cr-ops">' + ops +
      ((x.opcoes || []).length > 1 && !emp ? '<div class="cr-nota">mais de um tipo possível — a escolha é sua</div>' : "") +
      escolher +
      "</div></div>";
  }).join("");

  return '<div class="surf"><div class="sh">[ CREDENCIAIS ] ' + lista.length + " NÓ(S) PEDEM · " +
      (faltando ? faltando + " SEM NADA DO TIPO NOS SEUS FLUXOS" : "TODOS DE TIPOS QUE VOCÊ JÁ USA") + "</div>" +
    '<div class="crlist">' + linhas + "</div>" +
    (linkCred ? '<div class="acoes"><a class="btn" target="_blank" rel="noopener" href="' + esc(linkCred) +
      '">Abrir as credenciais no n8n ↗</a></div>' : "") +
    '<div class="selo">"JÁ USA" quer dizer que algum fluxo seu referencia esse tipo de credencial — ' +
      "a API pública não lista credencial nenhuma (responde 405), então isto nunca é promessa de que " +
      "a credencial certa existe nem de que está válida. A cópia de teste no n8n roda <strong>sem credencial</strong>: " +
      "ela prova que o n8n aceita o formato do fluxo, nunca que o acesso funciona.</div></div>";
}

/* O documento que vai para o clipboard, montado aqui a partir dos fatos que o
   servidor mandou.

   `s.wf` NUNCA carrega `credentials` — nem no portão, nem na cópia sandbox, nem
   no fantasma, nem no arquivo do projeto. O que sai ligado é só este documento,
   e só para os nós em que o servidor achou UMA credencial e nenhuma escolha a
   fazer. O `id` é ponteiro, não segredo: ele só significa alguma coisa dentro
   desta instância, e o segredo nunca sai do n8n (a API pública não devolve valor
   de credencial e responde 405 em `GET /credentials`).

   O interruptor existe porque o JSON limpo tem um uso real — mandar o fluxo para
   outra pessoa, ou para outra conta, onde aquele `id` não quer dizer nada. */
const LIGAR_CRED_PADRAO = true;
function ligarCred() { return S.ligarCred === undefined ? LIGAR_CRED_PADRAO : !!S.ligarCred; }

function wfParaExportar(s) {
  const ligados = (s.credLigacao && s.credLigacao.ligados) || [];
  if (!ligarCred() || !ligados.length) return s.wf;
  const out = JSON.parse(JSON.stringify(s.wf));
  const porNome = new Map((out.nodes || []).map(n => [n.name, n]));
  for (const l of ligados) {
    const nd = porNome.get(l.no);
    if (!nd) continue;                       // nó renomeado por um remendo
    nd.credentials = { ...(nd.credentials || {}), [l.tipo]: { id: l.id, name: l.nome } };
  }
  return out;
}

/* A linha que diz o que foi ligado e o que ficou em branco. Ela é obrigatória:
   um JSON que importa com metade das credenciais já ligadas e metade não é
   exatamente o caso em que alguém assume que está tudo pronto. */
function faixaExport(s) {
  const c = s.credLigacao;
  if (!c || (!c.ligados.length && !c.vazios.length)) return "";
  const on = ligarCred();
  const cx = '<label class="cx"><input type="checkbox" id="ligarcred"' + (on ? " checked" : "") +
    "> ligar no JSON as credenciais que já existem</label>";
  if (!on) {
    return '<div class="expbar">' + cx +
      '<div class="expsub">JSON limpo: nenhuma credencial vai junto. Use assim para mandar o fluxo ' +
      "para outra pessoa ou outra conta, onde estes identificadores não querem dizer nada.</div></div>";
  }
  const partes = [];
  if (c.ligados.length) partes.push("<strong>" + c.ligados.length + " nó(s) já vão ligados</strong>");
  if (c.vazios.length) partes.push(c.vazios.length + " ficam em branco para você escolher no n8n");
  return '<div class="expbar">' + cx + '<div class="expsub">' + partes.join(" · ") + ". " +
    "Só liga quando existe UMA credencial possível — havendo duas, a escolha é sua, e um palpite aqui " +
    "importaria calado e mandaria a mensagem pela conta errada.</div></div>";
}

function entrega(s) {
  const json = JSON.stringify(wfParaExportar(s), null, 2);
  const salvo = !!s.projetoSlug;
  // O título sugerido é o humano que a entrevista propôs — `wf.name` é
  // snake_case técnico e virava nome de projeto ilegível na tela inicial.
  const sugestao = s.titulo || (s.wf && s.wf.name) || s.ideia || "";
  return '<div class="surf"><div class="sh">[ 07 ] PRONTO PARA IMPORTAR</div>' +
    '<div class="selo" style="color:var(--txt-dim);background:var(--surface-2);border-color:var(--line)">' + esc(SELO_ENTREGA) + "</div>" +

    // Guardar é uma decisão à parte de copiar: o JSON serve agora, o projeto
    // serve daqui a um mês, quando ninguém lembra o que esta construção era.
    '<div class="salvar">' +
      (salvo
        ? '<div class="salvo">✓ salvo como <strong>' + esc(s.projetoTitulo || "") + "</strong></div>"
        : '<label class="lbl" for="titulo">Dê um nome a este projeto para guardá-lo</label>' +
          '<div class="linha">' +
            '<input id="titulo" class="campo" maxlength="120" value="' + esc(sugestao.slice(0, 120)) + '" placeholder="ex.: aviso de venda no Slack">' +
            '<button type="button" class="btn prime" id="salvar">Salvar projeto</button>' +
          "</div>") +
    "</div>" +

    '<div class="acoes">' +
      '<button type="button" class="btn prime" id="copiar">⧉ Copiar o JSON</button>' +
      (s.sandbox && s.sandbox.id ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(instanciaUrl(s)) + '">Abrir a cópia de teste ↗</a>' : "") +
      '<button type="button" class="btn" id="novo">← Voltar para o início</button>' +
    "</div>" +
    faixaExport(s) +
    '<pre class="json" id="jsonwf">' + esc(json) + "</pre></div>";
}

/* Cartões dos projetos guardados, na tela de abertura. */
/* O glifo da lixeira, desenhado — não emoji. Mesmo viewBox 24 e mesma espessura
   de traço do resto dos ícones desta tela, senão ele lê como colado de outro
   lugar. Um 🗑 do sistema muda de desenho por sistema operacional e não segue
   `currentColor`, então nem tema nem foco chegariam nele. */
const GLIFO_LIXO =
  '<svg class="gl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M4 7h16M10 4h4M6 7l1 12.2A1.8 1.8 0 0 0 8.8 21h6.4a1.8 1.8 0 0 0 1.8-1.8L18 7"/>' +
  '<path d="M10 11v6M14 11v6"/></svg>';

/* O card do que está sendo construído agora. Clicar volta para a corrida —
   é o `ligar(id)` de sempre, então F5 e SSE continuam valendo. */
function cardConstrucao() {
  const a = S.andamento;
  if (!a) return "";
  const etapas = a.etapas || [];
  const total = etapas.length || 7;
  const feitas = etapas.filter(e => ESTADO_TAG[e.estado] && ESTADO_TAG[e.estado].ordem >= 2).length;
  /* A etapa em andamento conta como MEIA. Só as concluídas dava 0% durante toda
     a etapa 01 — e a entrevista pode ter duas rodadas respondidas e ainda ler
     como "nada aconteceu", que era exatamente a mentira na tela. Meia etapa é
     um chute declarado no comentário e monotônico: nunca volta, nunca é 0 com
     trabalho feito, e 100% continua impossível antes de a última etapa fechar. */
  const ativa = etapas.some(e => e.estado === "correndo" || e.estado === "espera") ? 0.5 : 0;
  const pct = Math.min(99, Math.round(100 * (feitas + ativa) / total));
