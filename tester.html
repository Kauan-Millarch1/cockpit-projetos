  const vals = [e.quando, e.oQueFaz, e.resultado, e.ondeChega].map(v => String(v == null ? "" : v).trim());
  const temSup = vals.some(t => /^suposi[çc][ãa]o\s*:/i.test(t)) ||
    (fechada && vals.some(t => !t || /^n[ãa]o disse$/i.test(t)));
  const rodape = temSup
    ? '<div class="row"><div class="k">correção</div><div class="v" style="color:var(--txt-dim)">' +
      'escreva no campo lá embaixo o que está errado — eu recomeço a partir desta etapa</div></div>'
    : "";
  return '<div class="card"><div class="ch"><span class="ix">◈</span> O QUE EU ENTENDI</div>' +
    agente +
    linha("quando", e.quando) + linha("o que faz", e.oQueFaz) + linha("resultado", e.resultado) + linha("onde chega", e.ondeChega) +
    rodape +
    "</div>";
}

/* Clicar numa opção JÁ É a resposta. Não escreve nada no campo de baixo e não
   exige um segundo clique em Enviar: a escolha fica marcada no próprio cartão e
   viaja junto do "pode seguir".
   As escolhas são guardadas pelo TEXTO da pergunta, não pela posição — o SSE
   repinta a tela a cada evento, e um índice sobreviveria a um repaint mas não a
   uma pergunta reformulada. */
function pergunta(q) {
  const escolhida = S.respostas[q.q];
  const opcoes = q.opcoes || [];
  // Resposta que não está entre as sugestões só pode ter vindo do campo livre —
  // então ele reabre já preenchido, e a escolha sobrevive ao repaint do SSE.
  const ehOutro = escolhida !== undefined && !opcoes.includes(escolhida);
  // Com modelos a opção vira cartão com a mensagem montada; sem eles, o chip de
  // sempre. A escolha continua sendo a MESMA string nos dois casos — `data-resp`
  // é o contrato, e por isso o handler de clique não sabe nem precisa saber qual
  // dos dois desenhos está na tela.
  const comModelo = !!(q.modelos && Object.keys(q.modelos).length);
  return '<div class="q" data-q="' + esc(q.q) + '"><div class="qt">' + esc(q.q) + "</div>" +
    (q.porque ? '<div class="qw">' + esc(q.porque) + "</div>" : "") +
    '<div class="opts' + (comModelo ? " tpl" : "") + '" role="radiogroup" aria-label="' + esc(q.q) + '">' +
    opcoes.map(o => {
      const on = escolhida === o;
      if (comModelo) {
        return '<button type="button" class="tpl-op resp' + (on ? " on" : "") + '" role="radio" aria-checked="' +
          on + '" data-resp="' + esc(o) + '">' +
          '<span class="tpl-hd"><span class="tpl-dot" aria-hidden="true"></span>' + esc(o) + "</span>" +
          previaModelo(q.previa, q.modelos[o]) + "</button>";
      }
      return '<button type="button" class="chip resp' + (on ? " on" : "") + '" role="radio" aria-checked="' +
        on + '" data-resp="' + esc(o) + '">' + esc(o) + "</button>";
    }).join("") +
    '<button type="button" class="chip resp outro' + (ehOutro ? " on" : "") + '" role="radio" aria-checked="' +
      ehOutro + '">Outro…</button>' +
    "</div>" +
    '<input class="campo outro-campo" type="text" maxlength="200" placeholder="escreva a sua resposta"' +
      ' aria-label="outra resposta para: ' + esc(q.q) + '"' +
      (ehOutro ? "" : " hidden") + ' value="' + esc(ehOutro ? escolhida : "") + '">' +
    "</div>";
}

/* O modelo desenhado na anatomia do destino, para a escolha ser feita olhando a
   mensagem e não a descrição dela. A hora é a MESMA congelada do fantasma, pelo
   mesmo motivo: relógio vivo faria o mesmo modelo mudar a cada olhada.
   `marcarCampos` distingue o campo do valor — `{{ assunto }}` é o buraco onde o
   assunto entra, e sem a marca alguém lê aquilo como texto literal que o fluxo
   vai mandar. */
const marcarCampos = t => esc(t).replace(/\{\{\s*([^{}]{1,60}?)\s*\}\}/g, '<span class="ph">{{ $1 }}</span>');

function previaModelo(previa, texto) {
  const t = String(texto || "").trim();
  if (!t) return "";
  const topo = d => '<span class="mock-top"><span class="dest">' + esc(d) +
    '</span><span class="mk">MODELO</span></span>';

  if (previa === "slack") {
    return '<span class="mock tpl-mock">' + topo("canal do Slack") +
      '<span class="slack-msg"><span class="slack-av" aria-hidden="true">◈</span><span class="slack-col">' +
      '<span class="slack-head"><strong>seu fluxo</strong><span class="badge-app">APP</span>' +
      '<span class="mock-time">' + HORA_SIM + "</span></span>" +
      '<span class="mock-text">' + marcarCampos(t) + "</span></span></span></span>";
  }
  if (previa === "whatsapp") {
    return '<span class="mock tpl-mock">' + topo("conversa no WhatsApp") +
      '<span class="wha-chat"><span class="wha-bubble"><span class="mock-text">' + marcarCampos(t) + "</span>" +
      '<span class="wha-meta">' + HORA_SIM + " ✓✓</span></span></span></span>";
  }
  if (previa === "email") {
    // Um e-mail se lê pelo assunto primeiro. Quando o modelo abre com
    // "Assunto: …", essa linha sobe para o cabeçalho em vez de ficar enterrada
    // como primeira linha do corpo, que é onde ninguém procura por ela.
    const linhas = t.split("\n");
    const m = /^assunto\s*:\s*(.+)$/i.exec((linhas[0] || "").trim());
    const assunto = m ? m[1] : "";
    const corpo = m ? linhas.slice(1).join("\n").trim() : t;
    return '<span class="mock tpl-mock">' + topo("e-mail") +
      '<span class="mail-head"><span class="k">assunto</span>' +
      '<span class="sub">' + (assunto ? marcarCampos(assunto) : "(definido no fluxo)") + "</span></span>" +
      '<span class="mail-body"><span class="mock-text">' + marcarCampos(corpo) + "</span></span></span>";
  }
  return '<span class="mock tpl-mock">' + topo("mensagem") +
    '<span class="mail-body"><span class="mock-text">' + marcarCampos(t) + "</span></span></span>";
}

function portao(titulo, desc, botao, custo) {
  return '<div class="gate"><div class="gt">' + esc(titulo) + '</div><div class="gd">' + esc(desc) + "</div>" +
    '<div class="acts"><button type="button" class="btn prime" id="seguir">' + esc(botao) + "</button>" +
    '<span class="cost">ATÉ AQUI US$' + (custo || 0).toFixed(2).replace(".", ",") + " · PLANO, SEM COBRANÇA POR FORA</span></div></div>";
}

/* O bloco de ação enquanto a entrevista tem perguntas em aberto. "Enviar" leva
   as respostas para a rodada seguinte — o modelo digere e pergunta o que ainda
   faltar, ou libera o portão. "Pular" segue com o que existe. */
function acoesEntrevista(s) {
  const n = (s.perguntas || []).length;
  return '<div class="gate"><div class="gt">' +
      (n === 1 ? "Falta 1 resposta pra fechar o desenho" : "Faltam " + n + " respostas pra fechar o desenho") + "</div>" +
    '<div class="gd">Cada resposta vira uma decisão de construção. Dá pra pular, mas o que ficar em aberto ' +
      "eu preencho com o padrão mais comum e marco como suposição nos achados.</div>" +
    '<div class="acts"><button type="button" class="btn prime" id="responder">Enviar respostas →</button>' +
    '<button type="button" class="btn" id="seguir">Pular e construir assim mesmo</button>' +
    '<span class="cost">RODADA ' + (s.rodadaEntrevista || 1) + ' DA ENTREVISTA · ATÉ AQUI US$' +
      (s.custoTotal || 0).toFixed(2).replace(".", ",") + "</span></div></div>";
}

function composer(s) {
  const trabalhando = s.status === "correndo";
  const dica = s.modo === "edicao"
    ? (trabalhando
        ? "escreve aqui pra trocar o pedido — eu largo o atual e começo por este"
        : "pergunta sobre o fluxo, ou pede o que mudar, acrescentar ou tirar…")
    : (trabalhando ? "escreve aqui pra corrigir no meio do caminho — eu recomeço deste ponto" : "escreve o que mudar…");
  return '<div class="composer">' +
    '<textarea id="resposta" rows="1" placeholder="' + esc(dica) +
      '" aria-label="sua resposta"></textarea>' +
    '<button type="button" class="btn" id="enviar">Enviar</button></div>';
}

/* ------------------------------------------------------------- o desenho */

const GLYPH = {
  trigger: '<circle cx="0" cy="0" r="7"/><path d="M0 -4 V0 L3 2.5"/>',
  http:    '<circle cx="0" cy="0" r="7"/><path d="M-7 0h14M0 -7c3.2 3 3.2 11 0 14M0 -7c-3.2 3 -3.2 11 0 14"/>',
  code:    '<path d="M-3 -5 L-8 0 L-3 5"/><path d="M3 -5 L8 0 L3 5"/>',
  branch:  '<path d="M-7 0h5l4 -5h5"/><path d="M-2 0l4 5h5"/>',
  msg:     '<path d="M-8 -5h16v9h-9l-4 4v-4h-3z"/>',
  db:      '<ellipse cx="0" cy="-4" rx="7" ry="2.6"/><path d="M-7 -4v8c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-8"/>',
  set:     '<path d="M-7 -4h14M-7 0h9M-7 4h5"/>'
};
function glyphDe(t) {
  const s = String(t || "");
  if (/trigger|cron|schedule|webhook/i.test(s)) return "trigger";
  if (/httpRequest/i.test(s)) return "http";
  if (/\.code$/i.test(s)) return "code";
  if (/\.(if|switch|filter)$/i.test(s)) return "branch";
  if (/slack|whatsApp|telegram|gmail|emailSend/i.test(s)) return "msg";
  if (/supabase|postgres|mySql|redis|googleSheets|clickUp|airtable/i.test(s)) return "db";
  return "set";
}

function canvas(s) {
  return '<div class="canvas" id="canvas">' +
    '<div class="corner" id="corner"></div>' +
    '<div class="canvas-ctl"><button type="button" class="iconbtn" id="fit">ajustar</button></div>' +
    '<div class="canvas-hint">arraste para mover · role para aproximar · duplo clique para ajustar</div></div>';
}

/* Revela o desenho nó a nó e deixa navegar com o mouse.
 *
 * Duas decisões que vieram de olhar a tela funcionando:
 *   - FILEIRA ÚNICA. O ziguezague economizava largura mas empilhava o rótulo de
 *     um nó em cima do vizinho, e metade dos nomes sumia da tela. Com pan e zoom
 *     a largura deixou de ser problema, então a fileira reta ganha.
 *   - A câmera é DESTE svg. O palco do flows.html tem uma câmera singleton;
 *     dirigi-la daqui moveria a outra tela por baixo.
 *
 * O contador mostra a contagem final quando termina, e "MONTANDO i / n" durante
 * a revelação — ele revela um documento que já está pronto, e não afirma estar
 * escrevendo o terceiro nó enquanto os cinco já existem. */
function desenharSeNovo(s) {
  const host = $("#canvas");
  const wf = s.wf || s.wfParcial;
  if (!host || !wf) return;
  const parcial = !s.wf;
  const assinatura = JSON.stringify(wf.nodes.map(n => n.name));
  const jaEra = S.desenhado === assinatura;

  const nodes = wf.nodes.filter(n => !/stickyNote/i.test(n.type));
  const W = 64, H = 48, GAP = 176, PAD = 44, LINHA = 66;

  const ordem = new Map(nodes.map((n, i) => [n.name, i]));
  const arestas = [];
  /* O nome da porta importa aqui, não só a existência da aresta. Um agente pendura
     modelo, memória, parser e cada tool nas portas `ai_*`, e essas conexões vão do
     anexo PARA o agente — na trilha única elas viravam arestas voltando da direita
     para a esquerda por cima de tudo, e um agente saía como espaguete. */
  const anexo = new Map();          // nó de IA -> nome do agente a que ele serve
  for (const [de, portas] of Object.entries(wf.connections || {})) {
    for (const [porta, ramos] of Object.entries(portas || {})) {
      for (const lista of ramos || []) for (const c of lista || []) {
        if (!ordem.has(de) || !ordem.has(c.node)) continue;
        arestas.push([ordem.get(de), ordem.get(c.node), porta]);
        if (/^ai_/.test(porta)) anexo.set(de, c.node);
      }
    }
  }

  /* Duas trilhas, como o editor do n8n desenha: a de execução na horizontal, e os
     anexos de IA numa faixa abaixo do agente que eles servem. */
  const TRILHA2 = LINHA + H + 62;
  const principais = nodes.filter(n => !anexo.has(n.name));
  const colDe = new Map(principais.map((n, i) => [n.name, i]));
  const pos = [];
  const porAgente = new Map();
  for (const n of nodes) {
    if (!anexo.has(n.name)) { pos[ordem.get(n.name)] = [PAD + colDe.get(n.name) * GAP, LINHA]; continue; }
    const alvo = anexo.get(n.name);
    const fila = porAgente.get(alvo) || [];
    porAgente.set(alvo, fila.concat([n.name]));
    // Espalhados sob o agente, meio GAP entre eles, começando meio GAP à esquerda.
    pos[ordem.get(n.name)] = [PAD + (colDe.has(alvo) ? colDe.get(alvo) : 0) * GAP + fila.length * (GAP * 0.52) - GAP * 0.5, TRILHA2];
  }

  /* A largura sai do nó mais à direita que EXISTE, não de uma estimativa por
     colunas: com anexos a estimativa sobrava ~400px de vazio à direita e o
     `viewBox` encolhia o desenho inteiro para caber em espaço que ninguém usa. */
  const direita = pos.reduce((m, p) => Math.max(m, (p && p[0]) || 0), 0) + W;
  const largura = Math.max(direita + PAD, PAD * 2 + GAP);
  const alt = anexo.size ? TRILHA2 + H + 46 : 200;

  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = mk("svg", { viewBox: "0 0 " + largura + " " + alt, preserveAspectRatio: "xMidYMid meet",
    role: "img", "aria-label": "desenho do fluxo com " + nodes.length + " nos" });
  const cam = mk("g", { class: "cam" });
  const gE = mk("g", {}), gN = mk("g", {});
  cam.append(gE, gN);
  svg.appendChild(cam);

  const paths = arestas.map(par => {
    const [x1, y1] = pos[par[0]], [x2, y2] = pos[par[1]];
    const ehIA = /^ai_/.test(par[2] || "");
    /* Aresta de execução sai da direita e entra pela esquerda. Aresta de IA sai do
       TOPO do anexo e entra por BAIXO do agente — é o que faz as duas trilhas
       lerem como duas coisas diferentes em vez de um grafo emaranhado. */
    const d = ehIA
      ? (() => {
          const ax = x1 + W / 2, ay = y1, bx = x2 + W / 2, by = y2 + H;
          return "M" + ax + "," + ay + " C" + ax + "," + (ay - 34) + " " + bx + "," + (by + 34) + " " + bx + "," + by;
        })()
      : (() => {
          const ax = x1 + W, ay = y1 + H / 2, bx = x2, by = y2 + H / 2;
          return "M" + ax + "," + ay + " C" + (ax + 64) + "," + ay + " " + (bx - 64) + "," + by + " " + bx + "," + by;
        })();
    const p = mk("path", { class: "edge" + (ehIA ? " ia" : ""), d });
    gE.appendChild(p);
    p.style.setProperty("--len", Math.ceil(p.getTotalLength()) + "px");
    return p;
  });

  const gs = nodes.map((n, i) => {
    const x = pos[i][0], y = pos[i][1];
    const g = mk("g", { class: "nd" });
    g.appendChild(mk("rect", { class: "face", x: x, y: y, width: W, height: H, rx: 10 }));
    const gl = mk("g", { class: "glyph", transform: "translate(" + (x + W / 2) + "," + (y + H / 2) + ")" });
    gl.innerHTML = GLYPH[glyphDe(n.type)];
    g.appendChild(gl);
    /* Anexo de IA tem UMA porta, no topo: ele não está no caminho da execução,
       ele é pendurado no agente. Desenhar portas laterais nele diria que o dado
       passa por ali, e não passa. */
    if (anexo.has(n.name)) {
      g.appendChild(mk("circle", { class: "port", cx: x + W / 2, cy: y, r: 2.8 }));
    } else {
      g.appendChild(mk("circle", { class: "port", cx: x, cy: y + H / 2, r: 2.8 }));
      g.appendChild(mk("circle", { class: "port", cx: x + W, cy: y + H / 2, r: 2.8 }));
    }
    const nm = mk("text", { class: "nm", x: x + W / 2, y: y + H + 15 }); nm.textContent = n.name;
    const ty = mk("text", { class: "ty", x: x + W / 2, y: y + H + 26 });
    ty.textContent = String(n.type).replace("n8n-nodes-base.", "").replace("@n8n/n8n-nodes-langchain.", "ia/");
    const tt = mk("title", {});
    tt.textContent = n.name + "  ·  " + n.type + (n.typeVersion ? "  v" + n.typeVersion : "");
    g.append(nm, ty, mk("rect", { class: "caret", x: x + W + 6, y: y + H / 2 - 6, width: 2, height: 12 }), tt);
    gN.appendChild(g);
    return g;
  });

  host.querySelectorAll("svg").forEach(x => x.remove());
  host.appendChild(svg);
  const corner = $("#corner");
  // Rascunho é dito como rascunho: o desenho ao vivo vem do Write da sessão,
  // ANTES dos portões — afirmar contagem final aqui seria prometer cedo demais.
  const rotulo = parcial
    ? "[ RASCUNHO · " + nodes.length + " NOS · AINDA DESENHANDO ]"
    : "[ " + nodes.length + " NOS · " + arestas.length + " CONEXOES ]";

  /* ------------------------------------------------------------- a câmera */
  // O SSE repinta e recria este svg a cada evento; a câmera vive em S para o
  // pan/zoom não voltar ao zero no meio de uma olhada.
  const cm = (S.cam && S.cam.assinatura === assinatura)
    ? { x: S.cam.x, y: S.cam.y, k: S.cam.k }
    : { x: 0, y: 0, k: 1 };
  const aplicar = () => {
    cam.setAttribute("transform", "translate(" + cm.x + "," + cm.y + ") scale(" + cm.k + ")");
    S.cam = { assinatura, x: cm.x, y: cm.y, k: cm.k };
  };
  aplicar();
  const ajustar = () => { cm.x = 0; cm.y = 0; cm.k = 1; aplicar(); };
  const escala = () => largura / (svg.getBoundingClientRect().width || largura);

  let arrasto = null;
  svg.addEventListener("pointerdown", ev => {
    arrasto = { x: ev.clientX, y: ev.clientY, cx: cm.x, cy: cm.y };
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* sem captura */ }
    svg.style.cursor = "grabbing";
  });
  svg.addEventListener("pointermove", ev => {
    if (!arrasto) return;
    // O ponteiro anda em pixel de tela; a câmera vive em unidade do viewBox.
    const e = escala();
    cm.x = arrasto.cx + (ev.clientX - arrasto.x) * e;
    cm.y = arrasto.cy + (ev.clientY - arrasto.y) * e;
    aplicar();
  });
  const soltar = ev => {
    arrasto = null; svg.style.cursor = "grab";
    try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* já solto */ }
  };
  svg.addEventListener("pointerup", soltar);
  svg.addEventListener("pointercancel", soltar);
  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    const e = largura / (r.width || largura);
    // Ponto sob o cursor, em unidade do desenho: o zoom mantém ele parado.
    const px = (ev.clientX - r.left) * e, py = (ev.clientY - r.top) * e;
    const k2 = Math.min(3, Math.max(0.35, cm.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    cm.x = px - (px - cm.x) * (k2 / cm.k);
    cm.y = py - (py - cm.y) * (k2 / cm.k);
    cm.k = k2;
    aplicar();
  }, { passive: false });
  svg.addEventListener("dblclick", ajustar);
  svg.style.cursor = "grab";
  const fit = $("#fit");
  if (fit) fit.addEventListener("click", ajustar);

  const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (jaEra || reduzido) {
    gs.forEach(g => g.classList.add("built"));
    paths.forEach(p => p.classList.add("done"));
    corner.textContent = rotulo;
    return;
  }
  S.desenhado = assinatura;

  // Nada re-anima numa atualização: a assinatura acima é o que impede o SSE de
  // redesenhar tudo a cada evento. Movimento sem informação nova vira ruído.
  (async () => {
    for (let i = 0; i < gs.length; i++) {
      if (i > 0 && paths[i - 1]) {
        paths[i - 1].classList.add("drawing");
        await esperar(400);
        paths[i - 1].classList.remove("drawing");
        paths[i - 1].classList.add("done");
      }
      gs[i].classList.add("writing");
      corner.textContent = "[ MONTANDO " + (i + 1) + " / " + gs.length + " ]";
      await esperar(400);
      gs[i].classList.remove("writing"); gs[i].classList.add("built");
      await esperar(80);
    }
    paths.forEach(p => p.classList.add("done"));
    corner.textContent = rotulo;
  })();
}

const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ------------------------------------------------------------- o fantasma */

function fantasmaBloco(s) {
  const f = s.fantasma;
  if (!f.ok) {
    return '<div class="surf"><div class="sh">' + TITULO_FANTASMA(f) + "</div>" +
      '<div class="band" style="border-color:var(--warn-soft);background:var(--warn-soft);color:var(--warn-txt)">' +
      '<span class="txt" style="white-space:normal">Não simulei este fluxo: ' + esc(f.recusa) + "</span></div>" +
      (f.detalhe ? '<div class="empty" style="white-space:normal;text-align:left">' + esc(f.detalhe) + "</div>" : "") +
      '<div class="selo">' + esc(SELO_RECUSA[f.classe] || SELO_RECUSA[""]) + "</div></div>";
  }
  // A entrada dos mockups anima UMA vez por resultado: o SSE repinta a tela a
  // cada evento, e sem a assinatura a mensagem "chegaria" de novo a cada poll —
  // movimento sem informação nova, exatamente o que o resto do cockpit evita.
  const assin = JSON.stringify(f.superficies || []);
  const anim = S.fantasmaVisto !== assin;
  S.fantasmaVisto = assin;
  const sup = (f.superficies || []).map((x, i) => superficie(x, i, anim)).join("");
  const pend = (f.pendencias || []).filter(p => p.expr || p.motivo);
  return '<div class="surf"><div class="sh">[ 06 ] O QUE ISTO PRODUZIRIA · ' +
      esc(s.sementesOrigem || "dados de exemplo") + "</div>" +
    (sup || '<div class="empty">o fluxo não termina num destino que eu saiba desenhar</div>') +
    (pend.length ? '<div style="margin-top:11px">' + pend.map(p =>
      '<div class="i risco" style="margin-bottom:6px"><div class="ih"><span class="kind">CHECAR</span></div>' +
      '<div class="tx">' + (p.no ? "<strong>" + esc(p.no) + "</strong> · " : "") +
      (p.expr ? "<code>{{ " + esc(p.expr) + " }}</code><br>" : "") + esc(p.motivo) + "</div></div>").join("") + "</div>" : "") +
    '<div class="selo">' + esc(SELO_FANTASMA) + "</div></div>";
}

/* Cada destino é desenhado com a anatomia do app onde a mensagem chegaria —
 * forma e rótulo, nunca cor de marca (o comentário no CSS diz por quê). A hora
 * é a do relógio CONGELADO da simulação (simulate.js fixa 09:00): um relógio de
 * verdade faria a mesma simulação mudar a cada olhada. */
const HORA_SIM = "09:00";

function superficie(x, i, anim) {
  const e = x.envio || {};
  const marca = t => esc(t).replace(/⟨não simulada⟩/g, '<span class="naosim">não simulada</span>');
  const rot = x.rotulo || String(x.tipo || "").replace("n8n-nodes-base.", "") || "destino";
  const abre = '<div class="mock' + (anim ? " anim" : "") + '"' +
    (anim && i ? ' style="animation-delay:' + (i * 160) + 'ms"' : "") + ">";
  const selo = '<span class="mk">SIMULAÇÃO</span>';
  const topo = dest => '<div class="mock-top"><span class="dest">' + dest + "</span>" + selo + "</div>";

  if (x.superficie === "slack") {
    return abre + topo(marca(e.canal || "canal não definido")) +
      '<div class="slack-msg"><div class="slack-av" aria-hidden="true">◈</div><div>' +
        '<div class="slack-head"><strong>' + esc(x.no || "seu fluxo") + '</strong>' +
        '<span class="badge-app">APP</span><span class="mock-time">' + HORA_SIM + "</span></div>" +
        '<div class="mock-text">' + marca(e.texto || "(mensagem vazia)") + "</div>" +
      "</div></div></div>";
  }
  if (x.superficie === "whatsapp") {
    return abre + topo(esc(rot) + " · para " + marca(e.para || "destino não definido")) +
      '<div class="wha-chat"><div class="wha-bubble">' +
        '<div class="mock-text">' + marca(e.texto || "(mensagem vazia)") + "</div>" +
        '<span class="wha-meta">' + HORA_SIM + " ✓✓</span></div></div></div>";
  }
  if (x.superficie === "email") {
    return abre + topo(esc(rot)) +
      '<div class="mail-head">' +
        '<span class="k">para</span><span>' + marca(e.para || "destinatário não definido") + "</span>" +
        '<span class="k">assunto</span><span class="sub">' + marca(e.assunto || "(sem assunto)") + "</span>" +
      "</div>" +
      '<div class="mail-body"><div class="mock-text">' + marca(e.texto || "(sem corpo)") + "</div></div></div>";
  }
  if (x.superficie === "linha") {
    const campos = linhaCampos(e);
    const chaves = Object.keys(campos);
    const tabela = chaves.length
      ? '<div class="tblwrap"><table class="tbl"><thead><tr>' +
          chaves.map(k => "<th>" + esc(k) + "</th>").join("") + "</tr></thead>" +
          "<tbody><tr>" + chaves.map(k => "<td>" + marca(campos[k]) + "</td>").join("") + "</tr></tbody></table></div>"
      : '<div class="mail-body"><div class="mock-text">não deu para derivar os campos da linha — veja o JSON do nó</div></div>';
    return abre + topo(esc(rot) + " · " + marca(e.tabela || "tabela não definida") + " · 1 linha nova") + tabela + "</div>";
  }
  if (x.superficie === "resposta") {
    return abre + topo(esc(rot)) +
      '<div class="http-resp"><span class="hst">HTTP 200</span>\n' + marca(e.texto || "(corpo vazio)") + "</div></div>";
  }
  // Destino que não tem anatomia própria: o envio, campo a campo.
  const linhas = Object.entries(e).map(([k, v]) =>
    "<dt>" + esc(k) + "</dt><dd>" + marca(typeof v === "object" ? JSON.stringify(v) : v) + "</dd>").join("");
  return abre + topo("envio para " + esc(String(x.tipo || rot).replace("n8n-nodes-base.", ""))) +
    '<div class="mail-body"><dl class="kv">' + linhas + "</dl></div></div>";
}

/* Achata o registro de uma "linha gravada" para virar colunas de tabela. Cobre
 * as duas formas que os nós desta instância usam: `fieldsUi.fieldValues[]` do
 * Supabase e `columns.value{}` do Google Sheets. O resto passa como está. */
function linhaCampos(e) {
  const out = {};
  const poe = (k, v) => {
    if (v === undefined || v === null || v === "") return;
    out[String(k)] = typeof v === "object" ? JSON.stringify(v) : String(v);
  };
  for (const [k, v] of Object.entries(e.campos || {})) {
    if (v && typeof v === "object" && Array.isArray(v.fieldValues)) {
      for (const fv of v.fieldValues) if (fv && fv.fieldId !== undefined) poe(fv.fieldId, fv.fieldValue);
    } else if (v && typeof v === "object" && v.value && typeof v.value === "object" && !Array.isArray(v.value)) {
      for (const [k2, v2] of Object.entries(v.value)) poe(k2, v2);
    } else poe(k, v);
  }
  return out;
}

/* ------------------------------------------------ checklist de credenciais
 *
 * A lista por TIPO responde "o que este fluxo precisa". Esta responde "e agora,
 * o que eu clico" — que é a pergunta que sobra com o fluxo já importado e três
 * nós vermelhos na tela, e que exigia traduzir tipo de credencial em nó a olho.
 *
 * Três coisas que ela NÃO pode fingir, e que estão escritas nela:
 *   - a API pública responde 405 em `GET /credentials`, então não existe
 *     inventário: "você já usa" quer dizer que algum fluxo seu referencia esse
 *     TIPO, nunca que a credencial certa existe e está válida;
 *   - a lista sai dos fluxos dele, então um nó que aqui nunca pediu credencial
 *     não aparece. É piso, não total — a mesma honestidade da varredura truncada;
 *   - a cópia de teste no n8n roda SEM credencial, então nada aqui foi
 *     autenticado. O portão daquela etapa prova schema, nunca acesso.
 */
function checklistCred(s, vivo) {
  const lista = (s.ingredientes && s.ingredientes.porNo) || [];
  const base = (S.capab && S.capab.instancia) || "";
  const linkCred = base ? base + "/home/credentials" : "";
  const ligados = new Map(((s.credLigacao && s.credLigacao.ligados) || []).map(l => [l.no, l]));
  // Empatado é diferente de vazio: aqui existe credencial, o que falta é a
  // escolha. Só esse caso ganha botão.
  const empatados = new Map(((s.credLigacao && s.credLigacao.vazios) || [])
    .filter(v => (v.candidatos || []).length > 1).map(v => [v.no, v]));

  if (!lista.length) {
    return '<div class="surf"><div class="sh">[ CREDENCIAIS ] POR NÓ</div>' +
      '<div class="empty">nenhum nó deste fluxo pediu credencial nos seus outros fluxos. ' +
      "Isso é o que dá para afirmar — não é promessa de que nenhum vai pedir.</div></div>";
  }

  const faltando = lista.filter(x => (x.opcoes || []).every(o => !o.visto)).length;
  const linhas = lista.map(x => {
    const ops = (x.opcoes || []).map(o => {
      // Nomear vale mais que tipar: "Slack Ecommerce Puro, em 6 fluxos" é
      // acionável, "existe alguma do tipo slackApi" não é.
      const ex = (o.existentes || []).slice(0, 3).map(e =>
        '<span class="cr-nome">' + esc(e.nome || "(sem nome)") +
        '<span class="cr-usos">' + e.usos + (e.usos === 1 ? " fluxo" : " fluxos") + "</span></span>").join("");
      const sobra = Math.max(0, (o.existentes || []).length - 3);
      return '<div class="cr-op ' + (o.visto ? "tem" : "nao") + '">' +
        '<span class="cr-tag">' + (o.visto ? "JÁ USA" : "NÃO ACHEI") + "</span>" +
        "<code>" + esc(o.tipo) + "</code>" +
        (ex ? '<span class="cr-nomes">' + ex + (sobra ? '<span class="cr-usos">+' + sobra + "</span>" : "") + "</span>" : "") +
        (o.campos && o.campos.length ? '<span class="cr-campos">pede: ' + esc(o.campos.join(", ")) + "</span>" : "") +
      "</div>";
    }).join("");
    const lig = ligados.get(x.no);
    /* O desempate, no lugar onde o empate é mostrado. Um nó com duas credenciais
       possíveis ficava em branco para sempre: o cockpit se recusa a chutar — um
       palpite importaria calado e mandaria a mensagem pela conta errada — e até
       aqui não havia como dizer qual era. Clicar é grátis e instantâneo: o que
       viaja é o `id` de uma credencial que já existe, nunca um segredo. */
    const emp = empatados.get(x.no);
    const escolher = (emp && vivo)
      ? '<div class="cr-pick"><span class="cr-nota">qual delas?</span>' +
        emp.candidatos.filter(c => c.id).map(c =>
          '<button type="button" class="chip cr-esc" data-cred="' + esc(c.id) + '">usar a ' + esc(c.nome) + "</button>").join("") +
        "</div>"
      : (emp
        ? '<div class="cr-nota">mais de uma credencial serviria — abra em «Conversar e editar» para escolher</div>'
        : "");

    return '<div class="cr-row"><div class="cr-no"><strong>' + esc(x.no) + "</strong><br>" +
      '<span class="cr-ty">' + esc(String(x.tipo).replace("n8n-nodes-base.", "")) + "</span>" +
      (lig ? '<br><span class="cr-lig">✓ já vai ligado no JSON' + (lig.porEscolha ? " (escolha sua)" : "") + "</span>" : "") + "</div>" +
      '<div class="cr-ops">' + ops +
      ((x.opcoes || []).length > 1 && !emp ? '<div class="cr-nota">mais de um tipo possível — a escolha é sua</div>' : "") +
      escolher +
      "</div></div>";
  }).join("");

  return '<div class="surf"><div class="sh">[ CREDENCIAIS ] ' + lista.length + " NÓ(S) PEDEM · " +
      (faltando ? faltando + " SEM NADA DO TIPO NOS SEUS FLUXOS" : "TODOS DE TIPOS QUE VOCÊ JÁ USA") + "</div>" +
    '<div class="crlist">' + linhas + "</div>" +
    (linkCred ? '<div class="acoes"><a class="btn" target="_blank" rel="noopener" href="' + esc(linkCred) +
      '">Abrir as credenciais no n8n ↗</a></div>' : "") +
    '<div class="selo">"JÁ USA" quer dizer que algum fluxo seu referencia esse tipo de credencial — ' +
      "a API pública não lista credencial nenhuma (responde 405), então isto nunca é promessa de que " +
      "a credencial certa existe nem de que está válida. A cópia de teste no n8n roda <strong>sem credencial</strong>: " +
      "ela prova que o n8n aceita o formato do fluxo, nunca que o acesso funciona.</div></div>";
}

/* O documento que vai para o clipboard, montado aqui a partir dos fatos que o
   servidor mandou.

   `s.wf` NUNCA carrega `credentials` — nem no portão, nem na cópia sandbox, nem
   no fantasma, nem no arquivo do projeto. O que sai ligado é só este documento,
   e só para os nós em que o servidor achou UMA credencial e nenhuma escolha a
   fazer. O `id` é ponteiro, não segredo: ele só significa alguma coisa dentro
   desta instância, e o segredo nunca sai do n8n (a API pública não devolve valor
   de credencial e responde 405 em `GET /credentials`).

   O interruptor existe porque o JSON limpo tem um uso real — mandar o fluxo para
   outra pessoa, ou para outra conta, onde aquele `id` não quer dizer nada. */
const LIGAR_CRED_PADRAO = true;
function ligarCred() { return S.ligarCred === undefined ? LIGAR_CRED_PADRAO : !!S.ligarCred; }

function wfParaExportar(s) {
  const ligados = (s.credLigacao && s.credLigacao.ligados) || [];
  if (!ligarCred() || !ligados.length) return s.wf;
  const out = JSON.parse(JSON.stringify(s.wf));
  const porNome = new Map((out.nodes || []).map(n => [n.name, n]));
  for (const l of ligados) {
    const nd = porNome.get(l.no);
    if (!nd) continue;                       // nó renomeado por um remendo
    nd.credentials = { ...(nd.credentials || {}), [l.tipo]: { id: l.id, name: l.nome } };
  }
  return out;
}

/* A linha que diz o que foi ligado e o que ficou em branco. Ela é obrigatória:
   um JSON que importa com metade das credenciais já ligadas e metade não é
   exatamente o caso em que alguém assume que está tudo pronto. */
function faixaExport(s) {
  const c = s.credLigacao;
  if (!c || (!c.ligados.length && !c.vazios.length)) return "";
  const on = ligarCred();
  const cx = '<label class="cx"><input type="checkbox" id="ligarcred"' + (on ? " checked" : "") +
    "> ligar no JSON as credenciais que já existem</label>";
  if (!on) {
    return '<div class="expbar">' + cx +
      '<div class="expsub">JSON limpo: nenhuma credencial vai junto. Use assim para mandar o fluxo ' +
      "para outra pessoa ou outra conta, onde estes identificadores não querem dizer nada.</div></div>";
  }
  const partes = [];
  if (c.ligados.length) partes.push("<strong>" + c.ligados.length + " nó(s) já vão ligados</strong>");
  if (c.vazios.length) partes.push(c.vazios.length + " ficam em branco para você escolher no n8n");
  return '<div class="expbar">' + cx + '<div class="expsub">' + partes.join(" · ") + ". " +
    "Só liga quando existe UMA credencial possível — havendo duas, a escolha é sua, e um palpite aqui " +
    "importaria calado e mandaria a mensagem pela conta errada.</div></div>";
}

function entrega(s) {
  const json = JSON.stringify(wfParaExportar(s), null, 2);
  const salvo = !!s.projetoSlug;
  // O título sugerido é o humano que a entrevista propôs — `wf.name` é
  // snake_case técnico e virava nome de projeto ilegível na tela inicial.
  const sugestao = s.titulo || (s.wf && s.wf.name) || s.ideia || "";
  return '<div class="surf"><div class="sh">[ 07 ] PRONTO PARA IMPORTAR</div>' +
    '<div class="selo" style="color:var(--txt-dim);background:var(--surface-2);border-color:var(--line)">' + esc(SELO_ENTREGA) + "</div>" +

    // Guardar é uma decisão à parte de copiar: o JSON serve agora, o projeto
    // serve daqui a um mês, quando ninguém lembra o que esta construção era.
    '<div class="salvar">' +
      (salvo
        ? '<div class="salvo">✓ salvo como <strong>' + esc(s.projetoTitulo || "") + "</strong></div>"
        : '<label class="lbl" for="titulo">Dê um nome a este projeto para guardá-lo</label>' +
          '<div class="linha">' +
            '<input id="titulo" class="campo" maxlength="120" value="' + esc(sugestao.slice(0, 120)) + '" placeholder="ex.: aviso de venda no Slack">' +
            '<button type="button" class="btn prime" id="salvar">Salvar projeto</button>' +
          "</div>") +
    "</div>" +

    '<div class="acoes">' +
      '<button type="button" class="btn prime" id="copiar">⧉ Copiar o JSON</button>' +
      (s.sandbox && s.sandbox.id ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(instanciaUrl(s)) + '">Abrir a cópia de teste ↗</a>' : "") +
      '<button type="button" class="btn" id="novo">← Voltar para o início</button>' +
    "</div>" +
    faixaExport(s) +
    '<pre class="json" id="jsonwf">' + esc(json) + "</pre></div>";
}

/* Cartões dos projetos guardados, na tela de abertura. */
/* O glifo da lixeira, desenhado — não emoji. Mesmo viewBox 24 e mesma espessura
   de traço do resto dos ícones desta tela, senão ele lê como colado de outro
   lugar. Um 🗑 do sistema muda de desenho por sistema operacional e não segue
   `currentColor`, então nem tema nem foco chegariam nele. */
const GLIFO_LIXO =
  '<svg class="gl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M4 7h16M10 4h4M6 7l1 12.2A1.8 1.8 0 0 0 8.8 21h6.4a1.8 1.8 0 0 0 1.8-1.8L18 7"/>' +
  '<path d="M10 11v6M14 11v6"/></svg>';

/* O card do que está sendo construído agora. Clicar volta para a corrida —
   é o `ligar(id)` de sempre, então F5 e SSE continuam valendo. */
function cardConstrucao() {
  const a = S.andamento;
  if (!a) return "";
  const etapas = a.etapas || [];
  const total = etapas.length || 7;
  const feitas = etapas.filter(e => ESTADO_TAG[e.estado] && ESTADO_TAG[e.estado].ordem >= 2).length;
  const pct = Math.round(100 * feitas / total);
  const atual = etapas.find(e => e.n === a.etapa) || {};
  const rotulo = a.status === "correndo"
    ? (a.modo === "edicao" ? "REMENDANDO AGORA" : "EM CONSTRUÇÃO")
    : "ESPERANDO VOCÊ";
  return '<div class="proj ghost" data-sessao="' + esc(a.id) + '">' +
    '<span class="ghost-top"><span class="ghost-dot" aria-hidden="true"></span>' + rotulo +
      '<span style="margin-left:auto" class="ghost-pct">' + pct + "%</span></span>" +
    '<span class="pt">' + esc(a.titulo || a.ideia || "construção em andamento") + "</span>" +
    '<span class="pm">etapa ' + String(a.etapa).padStart(2, "0") + " de " + String(total).padStart(2, "0") +
      (atual.nome ? " · " + esc(atual.nome) : "") + "</span>" +
    '<span class="ghost-bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"' +
      ' aria-label="progresso da construção"><i style="width:' + pct + '%"></i></span>' +
    '<span class="pm" style="margin-top:5px">' +
      (a.status === "correndo" ? esc(a.atividade || "trabalhando…") : "parada esperando a sua resposta — clica para continuar") +
    "</span></div>";
}

function cardsProjetos() {
  const naLixeira = (S.lixeira || []).length;
  const ghost = cardConstrucao();
  // Sem projeto E sem lixeira não há bloco nenhum. Com lixeira cheia e nenhum
  // projeto, o bloco existe só para a lixeira ser alcançável — senão ela vira
  // um lugar que guarda coisas e não tem porta. Uma construção em andamento
  // também segura o bloco: o card fantasma é o caminho de volta para ela.
  if (!S.projetos || !S.projetos.length) {
    if (ghost) {
      return '<div class="projs"><div class="projs-h">[ SEUS PROJETOS ]<span>0</span>' + botaoLixeira() + "</div>" +
        '<div class="projs-g">' + ghost + "</div></div>";
    }
    return naLixeira
      ? '<div class="projs"><div class="projs-h">[ SEUS PROJETOS ]<span>0</span>' + botaoLixeira() + "</div>" +
        '<div class="vazio-proj">Nenhum projeto guardado — mas há ' + naLixeira +
        " na lixeira, e de lá dá para restaurar.</div></div>"
      : "";
  }
  // O card é `div`, não `button`: ele tem um botão de menu dentro, e botão
  // dentro de botão é HTML inválido — o navegador desfaz o aninhamento e o menu
  // deixa de existir. `clicavel()` devolve o teclado ao card.
  return '<div class="projs"><div class="projs-h">[ SEUS PROJETOS ]<span>' + S.projetos.length + "</span>" + botaoLixeira() + "</div>" +
    '<div class="projs-g">' + ghost + S.projetos.map(p =>
      '<div class="proj" data-slug="' + esc(p.slug) + '">' +
        '<div class="proj-menu">' +
          '<button type="button" class="dots" aria-label="opções de ' + esc(p.titulo) + '" aria-expanded="false">⋯</button>' +
          '<div class="pop" hidden>' +
            '<button type="button" class="pop-i" data-acao="renomear">Renomear</button>' +
            '<button type="button" class="pop-i risco" data-acao="excluir">Excluir</button>' +
          "</div>" +
        "</div>" +
        '<span class="pt">' + esc(p.titulo) + "</span>" +
        '<span class="pi">' + esc(p.ideia || "") + "</span>" +
        '<span class="pm">' + p.nos + " nós · " + esc((p.tipos || []).slice(0, 3).join(", ")) + "</span>" +
        '<span class="pd">' + esc(dataCurta(p.salvoEm)) + (p.simulou ? " · simulou" : "") + "</span>" +
      "</div>").join("") + "</div></div>";
}

/* A porta da lixeira. Aparece SEMPRE, inclusive vazia: uma porta que só existe
   quando há algo atrás dela é uma porta que ninguém descobre — e o momento em
   que ela é procurada é logo depois de excluir, exatamente quando o card que a
   revelaria acabou de sair da tela. Vazia ela diz que está vazia, em vez de
   sumir. */
function botaoLixeira() {
  const n = (S.lixeira || []).length;
  return '<button type="button" class="lixbtn' + (n ? " tem" : "") + '" id="ver-lixeira">' +
    GLIFO_LIXO + "<span>Lixeira</span>" +
    (n ? '<span class="lixn">' + n + "</span>" : '<span class="lixn vaz">vazia</span>') + "</button>";
}

function dataCurta(iso) {
  try {
    const d = new Date(iso);
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  } catch { return ""; }
}

/* ------------------------------------------------------------------ lixeira
 *
 * O que foi excluído, com as duas saídas explícitas: voltar ou acabar. A tela
 * não é uma lista cinza de arrependimento — ela mostra o que cada item CUSTOU,
 * porque é isso que decide o clique. Uma construção de agente foi US$3,19 e 13,6
 * minutos; apagar isso atrás da palavra "excluir" é o tipo de dano que este
 * painel existe para não causar.
 *
 * Os cards ficam visualmente adormecidos — dessaturados, com a data da exclusão
 * como carimbo. Não é decoração: eles precisam se ler como fora de serviço à
 * distância, senão a lixeira parece a lista de projetos e alguém restaura por
 * engano achando que está abrindo. */
function telaLixeira() {
  const itens = S.lixeira || [];
  const total = itens.length;
  const custo = itens.reduce((a, x) => a + (Number(x.custoTotal) || 0), 0);

  const corpo = total
    ? '<div class="lix-g">' + itens.map(x =>
        '<div class="lixc" data-lixo="' + esc(x.lixo) + '">' +
          '<div class="lixc-top">' + GLIFO_LIXO +
            '<span class="lixc-em">na lixeira desde ' + esc(dataCurta(x.excluidoEm)) + "</span></div>" +
          '<div class="lixc-t">' + esc(x.titulo || x.slug) + "</div>" +
          '<div class="lixc-i">' + esc(x.ideia || "") + "</div>" +
          '<div class="lixc-m">' + x.nos + " nós · " + esc((x.tipos || []).slice(0, 3).join(", ")) + "</div>" +
          '<div class="lixc-m">criado em ' + esc(dataCurta(x.salvoEm)) +
            (x.versoes ? " · " + x.versoes + " versão(ões) de edição" : "") +
            (Number(x.custoTotal) ? " · custou US$" + Number(x.custoTotal).toFixed(2).replace(".", ",") : "") + "</div>" +
          '<div class="lixc-acts">' +
            '<button type="button" class="btn prime lix-restaurar">↺ Restaurar</button>' +
            '<button type="button" class="btn lix-apagar">Apagar de vez</button>' +
          "</div>" +
        "</div>").join("") + "</div>"
    : '<div class="lix-vazia">' + GLIFO_LIXO +
      "<div><strong>A lixeira está vazia.</strong><br>" +
      "Projeto excluído vem parar aqui e fica até você decidir — nada some sozinho, e não há prazo.</div></div>";

  app.innerHTML =
    '<section class="stage-open"><div class="open-in lix-in">' +
      '<div class="lix-h">' +
        '<div class="lix-h-l"><span class="ix">[ LIXEIRA ]</span>' +
          '<h1>' + (total ? total + (total === 1 ? " projeto guardado aqui" : " projetos guardados aqui") : "Nada por aqui") + "</h1>" +
          '<p class="hint">Nada é apagado sozinho e não existe prazo. Restaurar devolve o projeto inteiro — ' +
            "conversa, desenho, simulação e histórico de edições. Apagar de vez é o único caminho sem volta desta tela." +
            (custo ? " O que está aqui custou <strong>US$" + custo.toFixed(2).replace(".", ",") + "</strong> para construir." : "") +
          "</p></div>" +
        '<div class="lix-h-r">' +
          '<button type="button" class="btn" id="lix-voltar">← Voltar</button>' +
          (total > 1 ? '<button type="button" class="btn perigo" id="lix-esvaziar">Esvaziar a lixeira</button>' : "") +
        "</div>" +
      "</div>" +
      corpo +
    "</div></section>";

  ligarEventosLixeira();
  pintarRodape(null);
  $("#cab").textContent = "lixeira";
  $("#voltar").hidden = true;
}

function ligarEventosLixeira() {
  $("#lix-voltar").addEventListener("click", inicio);

  const esv = $("#lix-esvaziar");
  if (esv) esv.addEventListener("click", async () => {
    const n = (S.lixeira || []).length;
    const ok = await confirmar({
      tag: "APAGAR DE VEZ", perigo: true, botao: "Apagar os " + n + " de vez",
      titulo: "Apagar de vez os " + n + " projetos da lixeira?",
      corpo: [
        "Isto é sem volta por esta tela. Some o JSON do fluxo, a conversa que decidiu ele, a simulação e o histórico de edições.",
        "A pasta projetos/ é versionada no git, então enquanto o commit anterior existir dá para recuperar com: git checkout -- projetos/",
        "Nada é tocado no n8n."
      ]
    });
    if (!ok) return;
    try { await callApi("/api/tester/lixeira/esvaziar", corpo({})); }
    catch (e) { avisoAbertura(e.message); }
    await carregarProjetos();
    telaLixeira();
  });

  app.querySelectorAll(".lixc").forEach(card => {
    const lixo = card.dataset.lixo;
    const nome = card.querySelector(".lixc-t").textContent;

    card.querySelector(".lix-restaurar").addEventListener("click", async () => {
      try {
        const r = await callApi("/api/tester/lixeira/" + encodeURIComponent(lixo) + "/restaurar", corpo({}));
        await carregarProjetos();
        /* O slug pode ter sido reocupado enquanto ele estava na lixeira, e aí a
           volta é com outro identificador. Isso muda a URL do projeto, então é
           dito — restaurar em silêncio sob outro nome é como um link quebrado
           que ninguém sabe que quebrou. */
        if (r && r.renomeado) {
          await confirmar({
            tag: "RESTAURADO", perigo: false, botao: "Entendi",
            titulo: "«" + (r.titulo || nome) + "» voltou com outro identificador",
            corpo: [
              "Já existia um projeto ocupando o nome de arquivo original, então este voltou como " + r.slug + ".",
              "O nome na tela não mudou — o que mudou é o endereço do arquivo em projetos/."
            ]
          });
        }
        telaLixeira();
      } catch (e) { avisoAbertura(e.message); }
    });

    card.querySelector(".lix-apagar").addEventListener("click", async () => {
      const ok = await confirmar({
        tag: "APAGAR DE VEZ", perigo: true, botao: "Apagar de vez",
        titulo: "Apagar «" + nome + "» de vez?",
        corpo: [
          "Isto é sem volta por esta tela. Some o JSON do fluxo, a conversa que decidiu ele, a simulação e o histórico de edições.",
          "Se este projeto já tinha sido commitado no git, git checkout -- projetos/ traz ele de volta. Se ele foi salvo depois do último commit, não existe cópia em lugar nenhum — e eu não tenho como saber qual dos dois é daqui.",
          "Nada é tocado no n8n. Se você já importou este fluxo lá, ele continua lá."
        ]
      });
      if (!ok) return;
      try { await callApi("/api/tester/lixeira/" + encodeURIComponent(lixo), { method: "DELETE" }); }
      catch (e) { avisoAbertura(e.message); }
      await carregarProjetos();
      telaLixeira();
    });
  });
}

/* Um projeto guardado, aberto para leitura. Não é uma sessão: não há esteira,
   não há custo, não há nada correndo — só o que ficou registrado. E o registro
   é a conversa INTEIRA: os balões, os cartões de entendimento, o desenho e a
   simulação, na ordem em que aconteceram. Projeto salvo antes de o chat ser
   persistido não tem essa história — a tela diz isso em vez de fingir. */
function telaProjeto(p) {
  const json = JSON.stringify(wfParaExportar(p), null, 2);
  const temChat = Array.isArray(p.chat) && p.chat.length > 0;
  /* O histórico de edições é o que faz o desfazer ser uma promessa verificável e
     não uma frase num botão: cada linha é uma versão inteira guardada dentro do
     arquivo do projeto, com o pedido que a produziu. */
  const versoes = Array.isArray(p.versoes) ? p.versoes : [];
  const histBloco = versoes.length
    ? '<details class="ddet"><summary>' + versoes.length + " versão(ões) anterior(es) guardada(s)</summary>" +
      versoes.map((v, i) => '<div class="vrow"><span class="vn">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="vt">' + esc(dataCurta(v.em)) + "</span>" +
        '<span class="vd"><strong>' + esc(v.pedido || "sem pedido registrado") + "</strong><br>" +
        esc(v.resumo || "") + "</span></div>").join("") + "</details>"
    : "";
  const conversa = temChat
    ? blocosConversa(p.chat, p)
    : '<div class="msg me"><div class="who">A IDEIA ERA</div><div class="body">' + esc(p.ideia || "") + "</div></div>" +
      '<div class="empty">este projeto foi salvo antes de a conversa ser guardada — só a ideia ficou registrada</div>';
  app.innerHTML = '<div class="split"><div class="stream" id="stream">' +
    conversa +
    canvas(p) +
    (p.fantasma ? fantasmaBloco(p) : "") +
    checklistCred(p, false) +
    '<div class="surf"><div class="sh">[ PROJETO GUARDADO ] ' + esc(dataCurta(p.salvoEm)) + "</div>" +
      '<h2 style="margin:0 0 10px;font-size:17px;font-weight:650">' + esc(p.titulo) + "</h2>" +
      (p.report ? '<div class="selo" style="color:var(--txt-dim);background:var(--surface-2);border-color:var(--line)">' +
        esc(String(p.report).split(/\n/).find(l => /Resumo/i.test(l)) || String(p.report).slice(0, 240)) + "</div>" : "") +
      /* Conversar é o primeiro botão porque é a coisa que este projeto salvo
         deixou de ser capaz de fazer por mais tempo: até aqui reabrir um fluxo
         era só olhar, e qualquer mudança custava construir tudo de novo. */
      '<div class="acoes"><button type="button" class="btn prime" id="editar">✎ Conversar e editar</button>' +
      '<button type="button" class="btn" id="copiar">⧉ Copiar o JSON</button>' +
      (versoes.length ? '<button type="button" class="btn" id="desfazer">↺ Desfazer a última edição</button>' : "") +
      '<button type="button" class="btn" id="novo">← Voltar para o início</button></div>' +
      faixaExport(p) +
      histBloco +
      '<pre class="json" id="jsonwf">' + esc(json) + "</pre></div>" +
    "</div><aside class=\"side\">" +
      '<div class="sec"><div class="sech"><span class="ix">[ NÓS ]</span><span>' + (p.wf.nodes || []).length + "</span></div>" +
      (p.wf.nodes || []).map(n => '<div class="i ideia"><div class="tx"><strong>' + esc(n.name) + "</strong><br>" +
        esc(String(n.type).replace("n8n-nodes-base.", "")) + "</div></div>").join("") + "</div>" +
    "</aside></div>";
  ligarEventosProjeto(p);
  desenharSeNovo({ wf: p.wf });
  pintarRodape(null);
  $("#cab").textContent = p.titulo;
  $("#voltar").hidden = true;
}

function ligarEventosProjeto(p) {
  const c = $("#copiar");
  if (c) c.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("#jsonwf").textContent); c.textContent = "✓ copiado"; }
    catch { c.textContent = "não consegui copiar — selecione o texto abaixo"; }
    setTimeout(() => { c.textContent = "⧉ Copiar o JSON"; }, 2400);
  });
  const cx = $("#ligarcred");
  if (cx) cx.addEventListener("change", () => { S.ligarCred = cx.checked; telaProjeto(p); });

  const n = $("#novo");
  if (n) n.addEventListener("click", inicio);

  /* Abrir para conversar cria uma SESSÃO no servidor, com o mesmo formato de id
     e o mesmo SSE da construção — daí em diante a tela é a mesma máquina de
     sempre, só que no modo edição. Por isso o caminho é `ligar(id)` e não uma
     tela nova: um F5 no meio de um remendo volta para ele. */
  const ed = $("#editar");
  if (ed) ed.addEventListener("click", async () => {
    ed.disabled = true; ed.textContent = "abrindo…";
    try {
      const r = await callApi("/api/tester/projeto/" + encodeURIComponent(p.slug) + "/editar", corpo({}));
      S.respostas = {}; S.desenhado = null; S.cam = null; S.fantasmaVisto = null;
      ligar(r.id);
    } catch (e) {
      ed.disabled = false; ed.textContent = "✎ Conversar e editar";
      alertaInline(e.message);
    }
  });

  const un = $("#desfazer");
  if (un) un.addEventListener("click", async () => {
    /* Desfazer troca a versão em vigor pela anterior — não apaga nenhuma das
       duas. Confirma mesmo assim porque o desenho na tela muda embaixo dele,
       mas NÃO é destrutivo: por isso o botão é o normal e não o vermelho, e o
       foco abre nele. Vestir de perigo uma ação reversível gasta o alarme que a
       exclusão vai precisar. */
    const ok = await confirmar({
      tag: "DESFAZER", perigo: false, botao: "Voltar para a anterior",
      titulo: "Voltar este fluxo para a versão anterior?",
      corpo: [
        "A versão de agora continua guardada no projeto — desfazer de novo traz ela de volta.",
        "Nada é tocado no n8n: o que muda é o arquivo do projeto nesta máquina."
      ]
    });
    if (!ok) return;
    un.disabled = true; un.textContent = "desfazendo…";
    try {
      await callApi("/api/tester/projeto/" + encodeURIComponent(p.slug) + "/desfazer", corpo({}));
      S.desenhado = null; S.cam = null;
      telaProjeto(await callApi("/api/tester/projeto/" + encodeURIComponent(p.slug)));
    } catch (e) {
      un.disabled = false; un.textContent = "↺ Desfazer a última edição";
      alertaInline(e.message);
    }
  });
}

/* Volta para a tela de abertura, derrubando o SSE da sessão anterior. A sessão
   em si NÃO morre — ela mora no servidor, e o card "em construção" da abertura
   é o caminho de volta. Por isso o status é relido aqui: sem isto, voltar no
   meio de um build desenhava a abertura sem o card, e a construção parecia
   perdida exatamente para quem acabou de sair dela. */
async function inicio() {
  if (S.es) { S.es.close(); S.es = null; }
  S.snap = null; S.desenhado = null; S.respostas = {}; S.cam = null; S.fantasmaVisto = null;
  history.replaceState(null, "", "/tester");
  try { S.capab = await callApi("/api/tester/status"); S.andamento = S.capab.andamento || null; }
  catch { /* mantém o que tinha — o poll da abertura corrige no próximo ciclo */ }
  await carregarProjetos();
  telaAbertura(null);
}

async function carregarProjetos() {
  /* As duas listas juntas, e independentes: a lixeira falhar não pode esconder
     os projetos, e os projetos falharem não pode esconder a lixeira. Cada uma
     mantém o que tinha em vez de virar lista vazia — uma lista vazia por erro de
     rede se lê como "você não tem nada", que é a mentira mais cara desta tela. */
  const [proj, lix] = await Promise.allSettled([
    callApi("/api/tester/projetos"),
    callApi("/api/tester/lixeira")
  ]);
  S.projetos = proj.status === "fulfilled" ? proj.value : (S.projetos || []);
  S.lixeira = lix.status === "fulfilled" ? lix.value : (S.lixeira || []);
}
function instanciaUrl(s) {
  const base = (S.capab && S.capab.instancia) || "";
  return base ? base + "/workflow/" + s.sandbox.id : "#";
}

/* ---------------------------------------------------------- lado direito */

function ladoDireito(s) {
  const feitas = (s.etapas || []).filter(e => ESTADO_TAG[e.estado] && ESTADO_TAG[e.estado].ordem >= 2).length;
  const passos = (s.etapas || []).map(e => {
    const meta = ESTADO_TAG[e.estado] || ESTADO_TAG.espera;
    // Marcar de antemão onde a esteira vai parar é informação útil; confundir
    // isso com "parou agora" não é. O tom separa os dois.
    // `para` vem da própria lista de etapas do servidor. A esteira de construção
    // não manda o campo e cai no `PARA_EM` de sempre; a conversa sobre um fluxo
    // salvo manda, e para num passo diferente.
    const paraAqui = e.para === undefined ? PARA_EM.has(e.n) : e.para === true;
    const tag = e.estado === "pendente" && paraAqui ? "para aqui" : meta.tag;
    return '<div class="st ' + esc(e.estado) + '">' +
      '<span class="num">' + String(e.n).padStart(2, "0") + '</span>' +
      '<span class="nm">' + esc(e.nome) + '</span>' +
      '<span class="tag">' + esc(tag) + "</span>" +
      (e.nota ? '<span class="nota">' + esc(e.nota) + "</span>" : "") + "</div>";
  }).join("");

  const achados = (s.achados || []).length
    ? s.achados.map(a => {
        const fonte = { fato: "FATO · verificado", "a-confirmar": "A CONFIRMAR · ainda não verifiquei", sugestao: "SUGESTÃO · minha, não é regra" }[a.fonte] || esc(a.fonte || "");
        return '<div class="i ' + esc(a.tipo || "ideia") + '"><div class="ih"><span class="kind">' +
          esc(String(a.tipo || "ideia").toUpperCase()) + '</span></div><div class="tx">' + esc(a.texto) +
          '</div><div class="src">' + esc(fonte) + "</div></div>";
      }).join("")
    : '<div class="empty">nada ainda — os achados aparecem conforme as etapas rodam</div>';

  const cred = (s.ingredientes && s.ingredientes.credenciais || []);
  const ingr = cred.length
    ? cred.map(c => '<div class="i ' + (c.visto ? "ideia" : "falta") + '"><div class="ih"><span class="kind">' +
        (c.visto ? "JÁ USA" : "NÃO ACHEI") + '</span></div><div class="tx"><code>' + esc(c.tipo) + "</code>" +
        (c.campos && c.campos.length ? "<br>pede: " + esc(c.campos.join(", ")) : "") + "</div>" +
        (c.visto ? "" : '<div class="src">não encontrei em nenhum fluxo seu — pode existir e ainda não estar em uso</div>') + "</div>").join("")
    : '<div class="empty">ainda não sei quais credenciais este fluxo precisa</div>';

  const total = (s.etapas || []).length || 7;
  return '<div class="sec"><div class="sech"><span class="ix">[ ETAPAS ]</span><span>' +
      String(feitas).padStart(2, "0") + " de " + String(total).padStart(2, "0") + "</span></div><div class=\"steps\">" + passos + "</div></div>" +
    '<div class="sec"><div class="sech"><span class="ix">[ ACHADOS ]</span><span>' + (s.achados || []).length + "</span></div>" + achados + "</div>" +
    '<div class="sec"><div class="sech"><span class="ix">[ CREDENCIAIS ]</span></div>' + ingr + "</div>" +
    '<div class="sec"><div class="sech"><span class="ix">[ GASTO ]</span><span>desta construção</span></div>' +
      '<div class="empty">US$' + (s.custoTotal || 0).toFixed(2).replace(".", ",") +
      " equivalentes · sai do seu plano, sem cobrança por fora.<br>Mexer na simulação depois de pronto não gasta nada — ela roda aqui na sua máquina.</div></div>";
}

/* ------------------------------------------------------------------ eventos */

function ligarEventos(s) {
  // Manda as respostas para a rodada seguinte da entrevista. Sem nada marcado
  // não há o que digerir — a rodada custaria ~20s para reescrever o mesmo cartão.
  const responder = $("#responder");
  if (responder) responder.addEventListener("click", async () => {
    const respostas = Object.entries(S.respostas).map(([q, r]) => ({ q, r }));
    if (!respostas.length) { alertaInline("marca ou escreve pelo menos uma resposta — ou usa «Pular e construir assim mesmo»."); return; }
    responder.disabled = true; responder.textContent = "enviando…";
    try {
      S.snap = await callApi(rota("reply"), corpo({ respostas }));
      S.respostas = {};
      pintar();
    } catch (e) { responder.disabled = false; responder.textContent = "Enviar respostas →"; alertaInline(e.message); }
  });

  /* Desempate de credencial. Sem modelo, sem custo: o que viaja é o `id` de uma
     credencial que já existe na instância. Nenhum segredo passa por aqui —
     criar credencial continua sendo no n8n, e nem poderia ser diferente: 7 dos
     16 tipos usados nesta conta são OAuth e exigem o redirecionamento no
     browser. */
  app.querySelectorAll(".cr-esc").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try { S.snap = await callApi(rota("credencial"), corpo({ credId: b.dataset.cred })); pintar(); }
    catch (e) { b.disabled = false; alertaInline(e.message); }
  }));

  // Liga/desliga as credenciais no JSON exportado. Só muda o que vai para o
  // clipboard: `s.wf` continua sem `credentials` em qualquer caminho.
  const cxCred = $("#ligarcred");
  if (cxCred) cxCred.addEventListener("change", () => { S.ligarCred = cxCred.checked; pintar(); });

  /* A decisão sobre um remendo. É o único clique desta tela que escreve — e o
     que ele escreve é o arquivo do projeto nesta máquina, nunca o n8n. */
  const aplicar = $("#aplicar");
  if (aplicar) aplicar.addEventListener("click", async () => {
    aplicar.disabled = true; aplicar.textContent = "aplicando…";
    const desc = $("#descartar"); if (desc) desc.disabled = true;
    try { S.snap = await callApi(rota("decidir"), corpo({ aplicar: true })); pintar(); }
    catch (e) {
      aplicar.disabled = false; aplicar.textContent = "✓ Aplicar e salvar";
      if (desc) desc.disabled = false;
      alertaInline(e.message);
    }
  });

  const descartar = $("#descartar");
  if (descartar) descartar.addEventListener("click", async () => {
    descartar.disabled = true;
    try { S.snap = await callApi(rota("decidir"), corpo({ aplicar: false })); pintar(); }
    catch (e) { descartar.disabled = false; alertaInline(e.message); }
  });

  const seguir = $("#seguir");
  if (seguir) seguir.addEventListener("click", async () => {
    seguir.disabled = true;
    // As escolhas vão JUNTO. Antes elas só existiam como texto no campo de
    // baixo, então clicar e apertar "pode seguir" sem enviar o texto perdia a
    // resposta silenciosamente — e o fluxo era montado ignorando o que ele
    // acabou de responder.
    const respostas = Object.entries(S.respostas).map(([q, r]) => ({ q, r }));
    try {
      S.snap = await callApi(rota("reply"), corpo({ seguir: true, respostas }));
      S.respostas = {};
      pintar();
    } catch (e) { seguir.disabled = false; alertaInline(e.message); }
  });

  // Seleção única por pergunta, resolvida no próprio cartão. Clicar de novo na
  // mesma opção desmarca — dá para voltar atrás sem recarregar nada.
  app.querySelectorAll(".resp").forEach(b => b.addEventListener("click", () => {
    const grupo = b.closest(".q");
    const chave = grupo && grupo.dataset.q;
    if (!chave) return;
    const campo = grupo.querySelector(".outro-campo");
    const ehOutro = b.classList.contains("outro");

    if (ehOutro) {
      // "Outro…" abre o campo e passa a mandar. O valor só existe quando ele
      // digita — marcar sem texto guardaria a palavra "Outro" como resposta.
      const abrindo = campo.hasAttribute("hidden");
      if (abrindo) { campo.removeAttribute("hidden"); campo.focus(); }
      else { campo.setAttribute("hidden", ""); delete S.respostas[chave]; }
      marcar(grupo, abrindo ? b : null);
      if (!abrindo) campo.value = "";
      else if (campo.value.trim()) S.respostas[chave] = campo.value.trim();
      return;
    }

    const jaEra = S.respostas[chave] === b.dataset.resp;
    if (jaEra) delete S.respostas[chave]; else S.respostas[chave] = b.dataset.resp;
    if (campo) { campo.setAttribute("hidden", ""); campo.value = ""; }
    marcar(grupo, jaEra ? null : b);
  }));

  app.querySelectorAll(".outro-campo").forEach(campo => {
    const grupo = campo.closest(".q");
    const chave = grupo && grupo.dataset.q;
    campo.addEventListener("input", () => {
      const v = campo.value.trim();
      if (v) S.respostas[chave] = v; else delete S.respostas[chave];
    });
    // Enter aqui confirma a resposta, não envia o formulário.
    campo.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); campo.blur(); } });
  });

  const enviar = $("#enviar"), ta = $("#resposta");
  if (ta) {
    ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; });
    ta.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); mandar(); } });
  }
  if (enviar) enviar.addEventListener("click", mandar);

  const salvar = $("#salvar");
  if (salvar) salvar.addEventListener("click", async () => {
    const campo = $("#titulo");
    const titulo = campo ? campo.value.trim() : "";
    if (!titulo) { if (campo) campo.focus(); return; }
    salvar.disabled = true; salvar.textContent = "salvando…";
    try {
      await callApi("/api/tester/projeto", corpo({ id: S.snap.id, titulo }));
      S.snap = await callApi("/api/tester/session/" + encodeURIComponent(S.snap.id));
      await carregarProjetos();
      pintar();
    } catch (e) { salvar.disabled = false; salvar.textContent = "Salvar projeto"; alertaInline(e.message); }
  });

  const novo = $("#novo");
  if (novo) novo.addEventListener("click", inicio);

  const copiar = $("#copiar");
  if (copiar) copiar.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("#jsonwf").textContent); copiar.textContent = "✓ copiado"; }
    catch { copiar.textContent = "não consegui copiar — selecione o texto abaixo"; }
    setTimeout(() => { copiar.textContent = "⧉ Copiar o JSON"; }, 2400);
  });
}

async function mandar() {
  const ta = $("#resposta");
  if (!ta || !ta.value.trim() || S.enviando) return;
  S.enviando = true;
  const texto = ta.value.trim();
  ta.value = ""; ta.style.height = "auto";
  try { S.snap = await callApi(rota("reply"), corpo({ texto })); pintar(); }
  catch (e) { alertaInline(e.message); ta.value = texto; }
  finally { S.enviando = false; }
}

const rota = sub => "/api/tester/session/" + encodeURIComponent(S.snap.id) + "/" + sub;
const corpo = o => ({ method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o) });

/* Marca uma opção e desmarca as irmãs. Uma função só, porque a seleção acontece
   em três lugares (chip, "Outro…", e o repaint) e três cópias divergiriam. */
function marcar(grupo, alvo) {
  grupo.querySelectorAll(".resp").forEach(x => {
    const on = x === alvo;
    x.classList.toggle("on", on);
    x.setAttribute("aria-checked", String(on));
  });
}

/* Aviso na tela de abertura (a de corrida usa alertaInline). */
function avisoAbertura(msg) {
  const alvo = $(".open-in");
  if (!alvo) return;
  const d = document.createElement("div");
  d.className = "avisobar"; d.textContent = msg;
  alvo.appendChild(d);
}

/* ------------------------------------------------------ confirmar uma ação
 *
 * O `confirm()` nativo do browser é a única coisa nesta tela que o tema não
 * alcança: ele chega com "localhost:4317 diz", tipografia do sistema operacional,
 * ordem de botão do sistema operacional e `\n\n` no lugar de parágrafo. Pior que
 * feio — ele NÃO consegue distinguir uma ação destrutiva de uma reversível, e as
 * duas que existem aqui são exatamente uma de cada: excluir apaga um arquivo,
 * desfazer troca duas versões que continuam as duas guardadas.
 *
 * Regras que este diálogo herda do resto do painel e que não são decoração:
 *   - `role="dialog"` + `aria-modal` + `aria-labelledby`, e `inert` em todo o
 *     resto do body enquanto ele está aberto — sem isso o Tab passeia por trás
 *     do scrim, que foi um defeito real corrigido no flows.html;
 *   - o foco volta para o botão que abriu, e não para o começo da página;
 *   - Esc e o scrim cancelam, porque cancelar é sempre o caminho seguro;
 *   - numa ação destrutiva o foco inicial é o CANCELAR. Enter sem ler não pode
 *     apagar nada.
 * `prefers-reduced-motion` zera só a entrada; nada de informação vive nela. */
function confirmar({ tag, titulo, corpo, botao, perigo }) {
  return new Promise(resolve => {
    const abriu = document.activeElement;
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML =
      '<div class="cfm" role="dialog" aria-modal="true" aria-labelledby="cfm-t" aria-describedby="cfm-b">' +
        '<div class="cfm-hd"><span class="ix">[ ' + esc(tag || "CONFIRMAR") + " ]</span></div>" +
        '<h2 class="cfm-t" id="cfm-t">' + esc(titulo) + "</h2>" +
        '<div class="cfm-b" id="cfm-b">' + (corpo || []).map(p => "<p>" + esc(p) + "</p>").join("") + "</div>" +
        '<div class="cfm-acts">' +
          '<button type="button" class="btn" data-r="0">Cancelar</button>' +
          '<button type="button" class="btn ' + (perigo ? "perigo" : "prime") + '" data-r="1">' + esc(botao) + "</button>" +
        "</div>" +
      "</div>";

    const irmaos = [...document.body.children];
    for (const el of irmaos) el.setAttribute("inert", "");
    document.body.appendChild(scrim);

    const fechar = v => {
      document.removeEventListener("keydown", onKey, true);
      scrim.remove();
      for (const el of irmaos) el.removeAttribute("inert");
      if (abriu && abriu.isConnected) abriu.focus();
      resolve(v);
    };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); fechar(false); return; }
      if (e.key !== "Tab") return;
      // Ciclo fechado entre os dois botões: o `inert` já tirou o resto da
      // página da ordem de tabulação, isto só impede a saída pelo browser.
      const fs = [...scrim.querySelectorAll("button")];
      const i = fs.indexOf(document.activeElement);
      e.preventDefault();
      fs[(i + (e.shiftKey ? -1 : 1) + fs.length) % fs.length].focus();
    };

    scrim.addEventListener("click", e => { if (e.target === scrim) fechar(false); });
    scrim.querySelectorAll("[data-r]").forEach(b =>
      b.addEventListener("click", () => fechar(b.dataset.r === "1")));
    document.addEventListener("keydown", onKey, true);

    // Destrutivo abre com o foco no Cancelar; reversível, no botão de ação.
    scrim.querySelector(perigo ? '[data-r="0"]' : '[data-r="1"]').focus();
  });
}

function alertaInline(msg) {
  const st = $("#stream");
  if (!st) return;
  const d = document.createElement("div");
  d.className = "erro"; d.textContent = msg;
  st.appendChild(d); st.scrollTop = st.scrollHeight;
}

function pintarRodape(s) {
  const r = rodape(s);
  foot.className = "foot " + r.classe;
  foot.innerHTML = r.partes.filter(Boolean).map(esc).join(' <span aria-hidden="true">·</span> ');
}

/* ---------------------------------------------------------------- boot */

/* Fecha qualquer menu aberto. Registrado UMA vez, no documento: preso ao render
   dos cards ele era re-registrado a cada volta para a tela inicial, e os
   ouvintes iam se acumulando. */
function fecharMenus() {
  document.querySelectorAll(".pop").forEach(x => x.setAttribute("hidden", ""));
  document.querySelectorAll(".dots").forEach(x => x.setAttribute("aria-expanded", "false"));
}
document.addEventListener("click", fecharMenus);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") fecharMenus(); });

$("#tema").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme");
  const escuro = atual ? atual === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", escuro ? "light" : "dark");
});

// A seta do appbar. Sair não mata nada: a sessão continua no servidor e o card
// "em construção" da abertura é a volta.
$("#voltar").addEventListener("click", inicio);

(async () => {
  let aviso = null;
  try {
    S.capab = await callApi("/api/tester/status");
    S.andamento = S.capab.andamento || null;
    if (!S.capab.cliEncontrado) aviso = "Não encontrei o CLI do Claude em " + S.capab.cli + " — sem ele o Tester não consegue construir nada. Defina CLAUDE_BIN no .env se ele estiver em outro lugar.";
    else if (!S.capab.n8nConfigurado) aviso = "O n8n não está configurado no .env, então não sei quais nós a sua instância aceita nem consigo criar a cópia de teste.";
    // Construção em andamento não é mais um aviso de texto: é o card pulsando
    // na lista de projetos, e clicar nele volta para ela.
    /* Sem o doc de agentes o Tester ainda constrói um agente, e constrói pior:
       sem buffer, sem lock, sem as sete camadas. Isso tem que ser dito ANTES do
       build, porque depois o fluxo já saiu e parece normal.

       TRÊS estados, não dois. O campo AUSENTE do payload não é o mesmo que o
       arquivo ausente do disco: um servidor que subiu antes desta versão não sabe
       responder sobre o doc, e tratar esse silêncio como "não existe" faz a tela
       culpar o arquivo do Kauan por um processo Node velho. Foi exatamente o que
       aconteceu — o aviso apareceu com o arquivo de 48KB no lugar. É a mesma
       armadilha do `Response.json()` num corpo 404 que este projeto já documenta:
       resposta que não sei ler nunca é resposta negativa. */
    else if (!("docAgentes" in S.capab)) {
      aviso = "O cockpit que está rodando subiu antes desta versão do servidor, então ele não sabe me dizer nada sobre `tester-agentes.md`. Feche a janela do cockpit e abra de novo — o Node não recarrega o `server.js` sozinho. (Isto não é um problema com o arquivo.)";
    }
    else {
      const da = S.capab.docAgentes || {};
      if (!da.encontrado) aviso = "Não achei `tester-agentes.md` na pasta do cockpit — é onde vive o que eu sei sobre agentes conversacionais. Sem ele ainda dá para pedir um agente, mas ele vai sair sem buffer, sem memória e sem as camadas que fazem um agente funcionar de verdade.";
      else if ((da.faltando || []).length) aviso = "O `tester-agentes.md` está sem o(s) bloco(s) " + da.faltando.join(", ") + ". Confira se as âncoras de abertura e fechamento estão sozinhas na própria linha.";
      else if ((da.desconhecidos || []).length) aviso = "O `tester-agentes.md` tem bloco que ninguém lê: " + da.desconhecidos.join(", ") + ". Ou é erro de digitação na âncora, ou é uma seção escrita esperando ser usada.";
    }
  } catch (e) { aviso = e.message; }

  await carregarProjetos();

  const retomar = new URLSearchParams(location.search).get("s");
  if (retomar && /^t[a-z0-9]{1,32}$/.test(retomar)) {
    try {
      S.snap = await callApi("/api/tester/session/" + encodeURIComponent(retomar));
      pintar();
      ligar(retomar);
      return;
    } catch {
      // Sessão sumiu (o servidor reiniciou). Melhor começar do zero dizendo o
      // que houve do que deixar a tela em branco esperando um SSE que não vem.
      aviso = "aquela construção não existe mais neste servidor — ele foi reiniciado. Comece de novo.";
      history.replaceState(null, "", "/tester");
    }
  }
  telaAbertura(aviso);
})();
</script>
