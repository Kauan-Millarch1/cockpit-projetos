  const atual = etapas.find(e => e.n === a.etapa) || {};
  const rotulo = a.status === "correndo"
    ? (a.modo === "edicao" ? "REMENDANDO AGORA" : "EM CONSTRUÇÃO")
    : "ESPERANDO VOCÊ";
  return '<div class="proj ghost" data-sessao="' + esc(a.id) + '">' +
    '<span class="ghost-top"><span class="ghost-dot" aria-hidden="true"></span>' + rotulo +
      '<span style="margin-left:auto" class="ghost-pct">' + pct + "%</span></span>" +
    '<span class="pt">' + esc(a.titulo || a.ideia || "construção em andamento") + "</span>" +
    '<span class="pm">etapa ' + String(a.etapa).padStart(2, "0") + " de " + String(total).padStart(2, "0") +
      (atual.nome ? " · " + esc(atual.nome) : "") + "</span>" +
    '<span class="ghost-bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"' +
      ' aria-label="progresso da construção"><i style="transform:scaleX(' + (pct / 100) + ')"></i></span>' +
    '<span class="pm" style="margin-top:5px">' +
      (a.status === "correndo" ? esc(a.atividade || "trabalhando…") : "parada esperando a sua resposta — clica para continuar") +
    "</span></div>";
}

function cardsProjetos() {
  const naLixeira = (S.lixeira || []).length;
  const ghost = cardConstrucao();
  // Sem projeto E sem lixeira não há bloco nenhum. Com lixeira cheia e nenhum
  // projeto, o bloco existe só para a lixeira ser alcançável — senão ela vira
  // um lugar que guarda coisas e não tem porta. Uma construção em andamento
  // também segura o bloco: o card fantasma é o caminho de volta para ela.
  if (!S.projetos || !S.projetos.length) {
    if (ghost) {
      return '<div class="projs"><div class="projs-h">[ SEUS PROJETOS ]<span>0</span>' + botaoLixeira() + "</div>" +
        '<div class="projs-g">' + ghost + "</div></div>";
    }
    return naLixeira
      ? '<div class="projs"><div class="projs-h">[ SEUS PROJETOS ]<span>0</span>' + botaoLixeira() + "</div>" +
        '<div class="vazio-proj">Nenhum projeto guardado — mas há ' + naLixeira +
        " na lixeira, e de lá dá para restaurar.</div></div>"
      : "";
  }
  // O card é `div`, não `button`: ele tem um botão de menu dentro, e botão
  // dentro de botão é HTML inválido — o navegador desfaz o aninhamento e o menu
  // deixa de existir. `clicavel()` devolve o teclado ao card.
  return '<div class="projs"><div class="projs-h">[ SEUS PROJETOS ]<span>' + S.projetos.length + "</span>" + botaoLixeira() + "</div>" +
    '<div class="projs-g">' + ghost + S.projetos.map(p =>
      '<div class="proj" data-slug="' + esc(p.slug) + '">' +
        '<div class="proj-menu">' +
          '<button type="button" class="dots" aria-label="opções de ' + esc(p.titulo) + '" aria-expanded="false">⋯</button>' +
          '<div class="pop" hidden>' +
            '<button type="button" class="pop-i" data-acao="renomear">Renomear</button>' +
            '<button type="button" class="pop-i risco" data-acao="excluir">Excluir</button>' +
          "</div>" +
        "</div>" +
        '<span class="pt">' + esc(p.titulo) + "</span>" +
        '<span class="pi">' + esc(p.ideia || "") + "</span>" +
        '<span class="pm">' + p.nos + " nós · " + esc((p.tipos || []).slice(0, 3).join(", ")) + "</span>" +
        '<span class="pd">' + esc(dataCurta(p.salvoEm)) + (p.simulou ? " · simulou" : "") + "</span>" +
      "</div>").join("") + "</div></div>";
}

/* A porta da lixeira. Aparece SEMPRE, inclusive vazia: uma porta que só existe
   quando há algo atrás dela é uma porta que ninguém descobre — e o momento em
   que ela é procurada é logo depois de excluir, exatamente quando o card que a
   revelaria acabou de sair da tela. Vazia ela diz que está vazia, em vez de
   sumir. */
function botaoLixeira() {
  const n = (S.lixeira || []).length;
  return '<button type="button" class="lixbtn' + (n ? " tem" : "") + '" id="ver-lixeira">' +
    GLIFO_LIXO + "<span>Lixeira</span>" +
    (n ? '<span class="lixn">' + n + "</span>" : '<span class="lixn vaz">vazia</span>') + "</button>";
}

function dataCurta(iso) {
  try {
    const d = new Date(iso);
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  } catch { return ""; }
}

/* ------------------------------------------------------------------ lixeira
 *
 * O que foi excluído, com as duas saídas explícitas: voltar ou acabar. A tela
 * não é uma lista cinza de arrependimento — ela mostra o que cada item CUSTOU,
 * porque é isso que decide o clique. Uma construção de agente foi US$3,19 e 13,6
 * minutos; apagar isso atrás da palavra "excluir" é o tipo de dano que este
 * painel existe para não causar.
 *
 * Os cards ficam visualmente adormecidos — dessaturados, com a data da exclusão
 * como carimbo. Não é decoração: eles precisam se ler como fora de serviço à
 * distância, senão a lixeira parece a lista de projetos e alguém restaura por
 * engano achando que está abrindo. */
function telaLixeira() {
  const itens = S.lixeira || [];
  const total = itens.length;
  const custo = itens.reduce((a, x) => a + (Number(x.custoTotal) || 0), 0);

  const corpo = total
    ? '<div class="lix-g">' + itens.map(x =>
        '<div class="lixc" data-lixo="' + esc(x.lixo) + '">' +
          '<div class="lixc-top">' + GLIFO_LIXO +
            '<span class="lixc-em">na lixeira desde ' + esc(dataCurta(x.excluidoEm)) + "</span></div>" +
          '<div class="lixc-t">' + esc(x.titulo || x.slug) + "</div>" +
          '<div class="lixc-i">' + esc(x.ideia || "") + "</div>" +
          '<div class="lixc-m">' + x.nos + " nós · " + esc((x.tipos || []).slice(0, 3).join(", ")) + "</div>" +
          '<div class="lixc-m">criado em ' + esc(dataCurta(x.salvoEm)) +
            (x.versoes ? " · " + x.versoes + " versão(ões) de edição" : "") +
            (Number(x.custoTotal) ? " · custou US$" + Number(x.custoTotal).toFixed(2).replace(".", ",") : "") + "</div>" +
          '<div class="lixc-acts">' +
            '<button type="button" class="btn prime lix-restaurar">↺ Restaurar</button>' +
            '<button type="button" class="btn lix-apagar">Apagar de vez</button>' +
          "</div>" +
        "</div>").join("") + "</div>"
    : '<div class="lix-vazia">' + GLIFO_LIXO +
      "<div><strong>A lixeira está vazia.</strong><br>" +
      "Projeto excluído vem parar aqui e fica até você decidir — nada some sozinho, e não há prazo.</div></div>";

  app.innerHTML =
    '<section class="stage-open"><div class="open-in lix-in">' +
      '<div class="lix-h">' +
        '<div class="lix-h-l"><span class="ix">[ LIXEIRA ]</span>' +
          '<h1>' + (total ? total + (total === 1 ? " projeto guardado aqui" : " projetos guardados aqui") : "Nada por aqui") + "</h1>" +
          '<p class="hint">Nada é apagado sozinho e não existe prazo. Restaurar devolve o projeto inteiro — ' +
            "conversa, desenho, simulação e histórico de edições. Apagar de vez é o único caminho sem volta desta tela." +
            (custo ? " O que está aqui custou <strong>US$" + custo.toFixed(2).replace(".", ",") + "</strong> para construir." : "") +
          "</p></div>" +
        '<div class="lix-h-r">' +
          '<button type="button" class="btn" id="lix-voltar">← Voltar</button>' +
          (total > 1 ? '<button type="button" class="btn perigo" id="lix-esvaziar">Esvaziar a lixeira</button>' : "") +
        "</div>" +
      "</div>" +
      corpo +
    "</div></section>";

  ligarEventosLixeira();
  pintarRodape(null);
  $("#cab").textContent = "lixeira";
  $("#voltar").hidden = true;
}

function ligarEventosLixeira() {
  $("#lix-voltar").addEventListener("click", inicio);

  const esv = $("#lix-esvaziar");
  if (esv) esv.addEventListener("click", async () => {
    const n = (S.lixeira || []).length;
    const ok = await confirmar({
      tag: "APAGAR DE VEZ", perigo: true, botao: "Apagar os " + n + " de vez",
      titulo: "Apagar de vez os " + n + " projetos da lixeira?",
      corpo: [
        "Isto é sem volta por esta tela. Some o JSON do fluxo, a conversa que decidiu ele, a simulação e o histórico de edições.",
        "A pasta projetos/ é versionada no git, então enquanto o commit anterior existir dá para recuperar com: git checkout -- projetos/",
        "Nada é tocado no n8n."
      ]
    });
    if (!ok) return;
    try { await callApi("/api/tester/lixeira/esvaziar", corpo({})); }
    catch (e) { avisoAbertura(e.message); }
    await carregarProjetos();
    telaLixeira();
  });

  app.querySelectorAll(".lixc").forEach(card => {
    const lixo = card.dataset.lixo;
    const nome = card.querySelector(".lixc-t").textContent;

    card.querySelector(".lix-restaurar").addEventListener("click", async () => {
      try {
        const r = await callApi("/api/tester/lixeira/" + encodeURIComponent(lixo) + "/restaurar", corpo({}));
        await carregarProjetos();
        /* O slug pode ter sido reocupado enquanto ele estava na lixeira, e aí a
           volta é com outro identificador. Isso muda a URL do projeto, então é
           dito — restaurar em silêncio sob outro nome é como um link quebrado
           que ninguém sabe que quebrou. */
        if (r && r.renomeado) {
          await confirmar({
            tag: "RESTAURADO", perigo: false, botao: "Entendi",
            titulo: "«" + (r.titulo || nome) + "» voltou com outro identificador",
            corpo: [
              "Já existia um projeto ocupando o nome de arquivo original, então este voltou como " + r.slug + ".",
              "O nome na tela não mudou — o que mudou é o endereço do arquivo em projetos/."
            ]
          });
        }
        telaLixeira();
      } catch (e) { avisoAbertura(e.message); }
    });

    card.querySelector(".lix-apagar").addEventListener("click", async () => {
      const ok = await confirmar({
        tag: "APAGAR DE VEZ", perigo: true, botao: "Apagar de vez",
        titulo: "Apagar «" + nome + "» de vez?",
        corpo: [
          "Isto é sem volta por esta tela. Some o JSON do fluxo, a conversa que decidiu ele, a simulação e o histórico de edições.",
          "Se este projeto já tinha sido commitado no git, git checkout -- projetos/ traz ele de volta. Se ele foi salvo depois do último commit, não existe cópia em lugar nenhum — e eu não tenho como saber qual dos dois é daqui.",
          "Nada é tocado no n8n. Se você já importou este fluxo lá, ele continua lá."
        ]
      });
      if (!ok) return;
      try { await callApi("/api/tester/lixeira/" + encodeURIComponent(lixo), { method: "DELETE" }); }
      catch (e) { avisoAbertura(e.message); }
      await carregarProjetos();
      telaLixeira();
    });
  });
}

/* Um projeto guardado, aberto para leitura. Não é uma sessão: não há esteira,
   não há custo, não há nada correndo — só o que ficou registrado. E o registro
   é a conversa INTEIRA: os balões, os cartões de entendimento, o desenho e a
   simulação, na ordem em que aconteceram. Projeto salvo antes de o chat ser
   persistido não tem essa história — a tela diz isso em vez de fingir. */
function telaProjeto(p) {
  const json = JSON.stringify(wfParaExportar(p), null, 2);
  const temChat = Array.isArray(p.chat) && p.chat.length > 0;
  /* O histórico de edições é o que faz o desfazer ser uma promessa verificável e
     não uma frase num botão: cada linha é uma versão inteira guardada dentro do
     arquivo do projeto, com o pedido que a produziu. */
  const versoes = Array.isArray(p.versoes) ? p.versoes : [];
  const histBloco = versoes.length
    ? '<details class="ddet"><summary>' + versoes.length + " versão(ões) anterior(es) guardada(s)</summary>" +
      versoes.map((v, i) => '<div class="vrow"><span class="vn">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="vt">' + esc(dataCurta(v.em)) + "</span>" +
        '<span class="vd"><strong>' + esc(v.pedido || "sem pedido registrado") + "</strong><br>" +
        esc(v.resumo || "") + "</span></div>").join("") + "</details>"
    : "";
  const conversa = temChat
    ? blocosConversa(p.chat, p)
    : '<div class="msg me"><div class="who">A IDEIA ERA</div><div class="body">' + esc(p.ideia || "") + "</div></div>" +
      '<div class="empty">este projeto foi salvo antes de a conversa ser guardada — só a ideia ficou registrada</div>';
  app.innerHTML = '<div class="split"><div class="stream" id="stream">' +
    conversa +
    canvas(p) +
    (p.fantasma ? fantasmaBloco(p) : "") +
    checklistCred(p, false) +
    '<div class="surf"><div class="sh">[ PROJETO GUARDADO ] ' + esc(dataCurta(p.salvoEm)) + "</div>" +
      '<h2 style="margin:0 0 10px;font-size:17px;font-weight:650">' + esc(p.titulo) + "</h2>" +
      (p.report ? '<div class="selo" style="color:var(--txt-dim);background:var(--surface-2);border-color:var(--line)">' +
        esc(String(p.report).split(/\n/).find(l => /Resumo/i.test(l)) || String(p.report).slice(0, 240)) + "</div>" : "") +
      /* Conversar é o primeiro botão porque é a coisa que este projeto salvo
         deixou de ser capaz de fazer por mais tempo: até aqui reabrir um fluxo
         era só olhar, e qualquer mudança custava construir tudo de novo. */
      '<div class="acoes"><button type="button" class="btn prime" id="editar">✎ Conversar e editar</button>' +
      '<button type="button" class="btn" id="copiar">⧉ Copiar o JSON</button>' +
      (versoes.length ? '<button type="button" class="btn" id="desfazer">↺ Desfazer a última edição</button>' : "") +
      '<button type="button" class="btn" id="novo">← Voltar para o início</button></div>' +
      faixaExport(p) +
      histBloco +
      '<pre class="json" id="jsonwf">' + esc(json) + "</pre></div>" +
    "</div><aside class=\"side\">" +
      '<div class="sec"><div class="sech"><span class="ix">[ NÓS ]</span><span>' + (p.wf.nodes || []).length + "</span></div>" +
      (p.wf.nodes || []).map(n => '<div class="i ideia"><div class="tx"><strong>' + esc(n.name) + "</strong><br>" +
        esc(String(n.type).replace("n8n-nodes-base.", "")) + "</div></div>").join("") + "</div>" +
    "</aside></div>";
  ligarEventosProjeto(p);
  desenharSeNovo({ wf: p.wf });
  pintarRodape(null);
  $("#cab").textContent = p.titulo;
  $("#voltar").hidden = true;
}

function ligarEventosProjeto(p) {
  const c = $("#copiar");
  if (c) c.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("#jsonwf").textContent); c.textContent = "✓ copiado"; }
    catch { c.textContent = "não consegui copiar — selecione o texto abaixo"; }
    setTimeout(() => { c.textContent = "⧉ Copiar o JSON"; }, 2400);
  });
  const cx = $("#ligarcred");
  if (cx) cx.addEventListener("change", () => { S.ligarCred = cx.checked; telaProjeto(p); });

  const n = $("#novo");
  if (n) n.addEventListener("click", inicio);

  /* Abrir para conversar cria uma SESSÃO no servidor, com o mesmo formato de id
     e o mesmo SSE da construção — daí em diante a tela é a mesma máquina de
     sempre, só que no modo edição. Por isso o caminho é `ligar(id)` e não uma
     tela nova: um F5 no meio de um remendo volta para ele. */
  const ed = $("#editar");
  if (ed) ed.addEventListener("click", async () => {
    ed.disabled = true; ed.textContent = "abrindo…";
    try {
      const r = await callApi("/api/tester/projeto/" + encodeURIComponent(p.slug) + "/editar", corpo({}));
      S.respostas = {}; S.desenhado = null; S.cam = null; S.fantasmaVisto = null;
      ligar(r.id);
    } catch (e) {
      ed.disabled = false; ed.textContent = "✎ Conversar e editar";
      alertaInline(e.message);
    }
  });

  const un = $("#desfazer");
  if (un) un.addEventListener("click", async () => {
    /* Desfazer troca a versão em vigor pela anterior — não apaga nenhuma das
       duas. Confirma mesmo assim porque o desenho na tela muda embaixo dele,
       mas NÃO é destrutivo: por isso o botão é o normal e não o vermelho, e o
       foco abre nele. Vestir de perigo uma ação reversível gasta o alarme que a
       exclusão vai precisar. */
    const ok = await confirmar({
      tag: "DESFAZER", perigo: false, botao: "Voltar para a anterior",
      titulo: "Voltar este fluxo para a versão anterior?",
      corpo: [
        "A versão de agora continua guardada no projeto — desfazer de novo traz ela de volta.",
        "Nada é tocado no n8n: o que muda é o arquivo do projeto nesta máquina."
      ]
    });
    if (!ok) return;
    un.disabled = true; un.textContent = "desfazendo…";
    try {
      await callApi("/api/tester/projeto/" + encodeURIComponent(p.slug) + "/desfazer", corpo({}));
      S.desenhado = null; S.cam = null;
      telaProjeto(await callApi("/api/tester/projeto/" + encodeURIComponent(p.slug)));
    } catch (e) {
      un.disabled = false; un.textContent = "↺ Desfazer a última edição";
      alertaInline(e.message);
    }
  });
}

/* Volta para a tela de abertura, derrubando o SSE da sessão anterior. A sessão
   em si NÃO morre — ela mora no servidor, e o card "em construção" da abertura
   é o caminho de volta. Por isso o status é relido aqui: sem isto, voltar no
   meio de um build desenhava a abertura sem o card, e a construção parecia
   perdida exatamente para quem acabou de sair dela. */
async function inicio() {
  if (S.es) { S.es.close(); S.es = null; }
  S.snap = null; S.desenhado = null; S.respostas = {}; S.cam = null; S.fantasmaVisto = null;
  history.replaceState(null, "", "/tester");
  try { S.capab = await callApi("/api/tester/status"); S.andamento = S.capab.andamento || null; carimbarVersao(); }
  catch { /* mantém o que tinha — o poll da abertura corrige no próximo ciclo */ }
  await carregarProjetos();
  telaAbertura(null);
}

async function carregarProjetos() {
  /* As duas listas juntas, e independentes: a lixeira falhar não pode esconder
     os projetos, e os projetos falharem não pode esconder a lixeira. Cada uma
     mantém o que tinha em vez de virar lista vazia — uma lista vazia por erro de
     rede se lê como "você não tem nada", que é a mentira mais cara desta tela. */
  const [proj, lix] = await Promise.allSettled([
    callApi("/api/tester/projetos"),
    callApi("/api/tester/lixeira")
  ]);
  S.projetos = proj.status === "fulfilled" ? proj.value : (S.projetos || []);
  S.lixeira = lix.status === "fulfilled" ? lix.value : (S.lixeira || []);
}
function instanciaUrl(s) {
  const base = (S.capab && S.capab.instancia) || "";
  return base ? base + "/workflow/" + s.sandbox.id : "#";
}

/* ---------------------------------------------------------- lado direito */

function ladoDireito(s) {
  const feitas = (s.etapas || []).filter(e => ESTADO_TAG[e.estado] && ESTADO_TAG[e.estado].ordem >= 2).length;
  const passos = (s.etapas || []).map(e => {
    const meta = ESTADO_TAG[e.estado] || ESTADO_TAG.espera;
    // Marcar de antemão onde a esteira vai parar é informação útil; confundir
    // isso com "parou agora" não é. O tom separa os dois.
    // `para` vem da própria lista de etapas do servidor. A esteira de construção
    // não manda o campo e cai no `PARA_EM` de sempre; a conversa sobre um fluxo
    // salvo manda, e para num passo diferente.
    const paraAqui = e.para === undefined ? PARA_EM.has(e.n) : e.para === true;
    const tag = e.estado === "pendente" && paraAqui ? "para aqui" : meta.tag;
    return '<div class="st ' + esc(e.estado) + '">' +
      '<span class="num">' + String(e.n).padStart(2, "0") + '</span>' +
      '<span class="nm">' + esc(e.nome) + '</span>' +
      '<span class="tag">' + esc(tag) + "</span>" +
      (e.nota ? '<span class="nota">' + esc(e.nota) + "</span>" : "") + "</div>";
  }).join("");

  const achados = (s.achados || []).length
    ? s.achados.map(a => {
        const fonte = { fato: "FATO · verificado", "a-confirmar": "A CONFIRMAR · ainda não verifiquei", sugestao: "SUGESTÃO · minha, não é regra" }[a.fonte] || esc(a.fonte || "");
        return '<div class="i ' + esc(a.tipo || "ideia") + '"><div class="ih"><span class="kind">' +
          esc(String(a.tipo || "ideia").toUpperCase()) + '</span></div><div class="tx">' + esc(a.texto) +
          '</div><div class="src">' + esc(fonte) + "</div></div>";
      }).join("")
    : '<div class="empty">nada ainda — os achados aparecem conforme as etapas rodam</div>';

  const cred = (s.ingredientes && s.ingredientes.credenciais || []);
  const ingr = cred.length
    ? cred.map(c => '<div class="i ' + (c.visto ? "ideia" : "falta") + '"><div class="ih"><span class="kind">' +
        (c.visto ? "JÁ USA" : "NÃO ACHEI") + '</span></div><div class="tx"><code>' + esc(c.tipo) + "</code>" +
        (c.campos && c.campos.length ? "<br>pede: " + esc(c.campos.join(", ")) : "") + "</div>" +
        (c.visto ? "" : '<div class="src">não encontrei em nenhum fluxo seu — pode existir e ainda não estar em uso</div>') + "</div>").join("")
    : '<div class="empty">ainda não sei quais credenciais este fluxo precisa</div>';

  const total = (s.etapas || []).length || 7;
  return '<div class="sec"><div class="sech"><span class="ix">[ ETAPAS ]</span><span>' +
      String(feitas).padStart(2, "0") + " de " + String(total).padStart(2, "0") + "</span></div><div class=\"steps\">" + passos + "</div></div>" +
    '<div class="sec"><div class="sech"><span class="ix">[ ACHADOS ]</span><span>' + (s.achados || []).length + "</span></div>" + achados + "</div>" +
    '<div class="sec"><div class="sech"><span class="ix">[ CREDENCIAIS ]</span></div>' + ingr + "</div>" +
    '<div class="sec"><div class="sech"><span class="ix">[ GASTO ]</span><span>desta construção</span></div>' +
      '<div class="empty">US$' + (s.custoTotal || 0).toFixed(2).replace(".", ",") +
      " equivalentes · sai do seu plano, sem cobrança por fora.<br>Mexer na simulação depois de pronto não gasta nada — ela roda aqui na sua máquina.</div></div>";
}

/* ------------------------------------------------------------------ eventos */

function ligarEventos(s) {
  // O botão de parar vive dentro da faixa de processamento, que é redesenhada a
  // cada evento do SSE — por isso o ouvinte é religado aqui, e não uma vez só
  // como o Esc. Os dois chamam exatamente a mesma função.
  const parar = $("#parar");
  if (parar) parar.addEventListener("click", () => pararAgora());

  // Manda as respostas para a rodada seguinte da entrevista. Sem nada marcado
  // não há o que digerir — a rodada custaria ~20s para reescrever o mesmo cartão.
  const responder = $("#responder");
  if (responder) responder.addEventListener("click", async () => {
    const respostas = Object.entries(S.respostas).map(([q, r]) => ({ q, r }));
    if (!respostas.length) { alertaInline("marca ou escreve pelo menos uma resposta — ou usa «Pular e construir assim mesmo»."); return; }
    responder.disabled = true; responder.textContent = "enviando…";
    try {
      S.snap = await callApi(rota("reply"), corpo({ respostas }));
      S.respostas = {};
      pintar();
    } catch (e) { responder.disabled = false; responder.textContent = "Enviar respostas →"; alertaInline(e.message); }
  });

  /* Desempate de credencial. Sem modelo, sem custo: o que viaja é o `id` de uma
     credencial que já existe na instância. Nenhum segredo passa por aqui —
     criar credencial continua sendo no n8n, e nem poderia ser diferente: 7 dos
     16 tipos usados nesta conta são OAuth e exigem o redirecionamento no
     browser. */
  app.querySelectorAll(".cr-esc").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try { S.snap = await callApi(rota("credencial"), corpo({ credId: b.dataset.cred })); pintar(); }
    catch (e) { b.disabled = false; alertaInline(e.message); }
  }));

  // Liga/desliga as credenciais no JSON exportado. Só muda o que vai para o
  // clipboard: `s.wf` continua sem `credentials` em qualquer caminho.
  const cxCred = $("#ligarcred");
  if (cxCred) cxCred.addEventListener("change", () => { S.ligarCred = cxCred.checked; pintar(); });

  /* A decisão sobre um remendo. É o único clique desta tela que escreve — e o
     que ele escreve é o arquivo do projeto nesta máquina, nunca o n8n. */
  const aplicar = $("#aplicar");
  if (aplicar) aplicar.addEventListener("click", async () => {
    aplicar.disabled = true; aplicar.textContent = "aplicando…";
    const desc = $("#descartar"); if (desc) desc.disabled = true;
    try { S.snap = await callApi(rota("decidir"), corpo({ aplicar: true })); pintar(); }
    catch (e) {
      aplicar.disabled = false; aplicar.textContent = "✓ Aplicar e salvar";
      if (desc) desc.disabled = false;
      alertaInline(e.message);
    }
  });

  const descartar = $("#descartar");
  if (descartar) descartar.addEventListener("click", async () => {
    descartar.disabled = true;
    try { S.snap = await callApi(rota("decidir"), corpo({ aplicar: false })); pintar(); }
    catch (e) { descartar.disabled = false; alertaInline(e.message); }
  });

  const seguir = $("#seguir");
  if (seguir) seguir.addEventListener("click", async () => {
    seguir.disabled = true;
    // As escolhas vão JUNTO. Antes elas só existiam como texto no campo de
    // baixo, então clicar e apertar "pode seguir" sem enviar o texto perdia a
    // resposta silenciosamente — e o fluxo era montado ignorando o que ele
    // acabou de responder.
    const respostas = Object.entries(S.respostas).map(([q, r]) => ({ q, r }));
    try {
      S.snap = await callApi(rota("reply"), corpo({ seguir: true, respostas }));
      S.respostas = {};
      pintar();
    } catch (e) { seguir.disabled = false; alertaInline(e.message); }
  });

  // Seleção única por pergunta, resolvida no próprio cartão. Clicar de novo na
  // mesma opção desmarca — dá para voltar atrás sem recarregar nada.
  app.querySelectorAll(".resp").forEach(b => b.addEventListener("click", () => {
    const grupo = b.closest(".q");
    const chave = grupo && grupo.dataset.q;
    if (!chave) return;
    const campo = grupo.querySelector(".outro-campo");
    const ehOutro = b.classList.contains("outro");

    if (ehOutro) {
      // "Outro…" abre o campo e passa a mandar. O valor só existe quando ele
      // digita — marcar sem texto guardaria a palavra "Outro" como resposta.
      const abrindo = campo.hasAttribute("hidden");
      if (abrindo) { campo.removeAttribute("hidden"); campo.focus(); }
      else { campo.setAttribute("hidden", ""); delete S.respostas[chave]; }
      marcar(grupo, abrindo ? b : null);
      if (!abrindo) campo.value = "";
      else if (campo.value.trim()) S.respostas[chave] = campo.value.trim();
      return;
    }

    const jaEra = S.respostas[chave] === b.dataset.resp;
    if (jaEra) delete S.respostas[chave]; else S.respostas[chave] = b.dataset.resp;
    if (campo) { campo.setAttribute("hidden", ""); campo.value = ""; }
    marcar(grupo, jaEra ? null : b);
  }));

  app.querySelectorAll(".outro-campo").forEach(campo => {
    const grupo = campo.closest(".q");
    const chave = grupo && grupo.dataset.q;
    campo.addEventListener("input", () => {
      const v = campo.value.trim();
      if (v) S.respostas[chave] = v; else delete S.respostas[chave];
    });
    // Enter aqui confirma a resposta, não envia o formulário.
    campo.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); campo.blur(); } });
  });

  const enviar = $("#enviar"), ta = $("#resposta");
  if (ta) {
    ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; });
    ta.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); mandar(); } });
    /* Voz e anexo no meio da conversa. O repintar é `pintar()`, que já carrega o
       texto e o foco pelo `capturarInputs` — anexar não custa a frase que está
       sendo escrita. O id da sessão vai junto: aqui o arquivo entra direto no
       diretório da corrida, sem bandeja, porque a sessão já existe. */
    // `.compzone`, não `.composer`: os chips com o `×` moram acima da caixa, e é
    // dentro do elemento passado aqui que `ligarIO` procura por eles.
    const cx = ta.closest(".compzone") || ta.closest(".composer");
    if (cx && S.snap) IO().ligarIO("cp", cx, ta, S.snap.id, () => pintar());
  }
  if (enviar) enviar.addEventListener("click", mandar);

  const salvar = $("#salvar");
  if (salvar) salvar.addEventListener("click", async () => {
    const campo = $("#titulo");
    const titulo = campo ? campo.value.trim() : "";
    if (!titulo) { if (campo) campo.focus(); return; }
    salvar.disabled = true; salvar.textContent = "salvando…";
    try {
      await callApi("/api/tester/projeto", corpo({ id: S.snap.id, titulo }));
      S.snap = await callApi("/api/tester/session/" + encodeURIComponent(S.snap.id));
      await carregarProjetos();
      pintar();
    } catch (e) { salvar.disabled = false; salvar.textContent = "Salvar projeto"; alertaInline(e.message); }
  });

  const novo = $("#novo");
  if (novo) novo.addEventListener("click", inicio);

  const copiar = $("#copiar");
  if (copiar) copiar.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("#jsonwf").textContent); copiar.textContent = "✓ copiado"; }
    catch { copiar.textContent = "não consegui copiar — selecione o texto abaixo"; }
    setTimeout(() => { copiar.textContent = "⧉ Copiar o JSON"; }, 2400);
  });
}

async function mandar() {
  const ta = $("#resposta");
  if (!ta || !ta.value.trim() || S.enviando) return;
  /* Microfone aberto na hora de enviar: fecha. Sem isto o reconhecimento
     continua rodando depois da mensagem ir, e a próxima frase falada cai num
     campo que já foi limpo — parece que o ditado perdeu o que foi dito. */
  if (S.ouvindo && S.rec) { try { S.rec.stop(); } catch { /* já parou */ } S.rec = null; S.ouvindo = false; S.parcial = ""; }
  S.enviando = true;
  const texto = ta.value.trim();
  ta.value = ""; ta.style.height = "auto";
  try { S.snap = await callApi(rota("reply"), corpo({ texto })); pintar(); }
  catch (e) { alertaInline(e.message); ta.value = texto; }
  finally { S.enviando = false; }
}

const rota = sub => "/api/tester/session/" + encodeURIComponent(S.snap.id) + "/" + sub;
const corpo = o => ({ method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o) });

/* Marca uma opção e desmarca as irmãs. Uma função só, porque a seleção acontece
   em três lugares (chip, "Outro…", e o repaint) e três cópias divergiriam. */
function marcar(grupo, alvo) {
  grupo.querySelectorAll(".resp").forEach(x => {
    const on = x === alvo;
    x.classList.toggle("on", on);
    x.setAttribute("aria-checked", String(on));
  });
}

/* Aviso na tela de abertura (a de corrida usa alertaInline). Cai para a pilha
   flutuante quando a abertura não está montada — sem isso, um erro disparado
   fora dela desaparecia sem deixar rastro, que é a pior forma de avisar. */
function avisoAbertura(msg, tipo) {
  const alvo = $(".open-in");
  if (!alvo) { avisar(msg, tipo || "alerta"); return; }
  const d = document.createElement("div");
  const t = tipo || "alerta";
  d.className = "aviso " + t + " bloco";
  d.setAttribute("role", t === "erro" ? "alert" : "status");
  d.innerHTML = '<span class="ai" aria-hidden="true">' + (AVISO_GLIFO[t] || "!") +
    '</span><span class="ac">' + esc(msg) + "</span>";
  alvo.appendChild(d);
}

/* ------------------------------------------------------ confirmar uma ação
 *
 * O `confirm()` nativo do browser é a única coisa nesta tela que o tema não
 * alcança: ele chega com "localhost:4317 diz", tipografia do sistema operacional,
 * ordem de botão do sistema operacional e `\n\n` no lugar de parágrafo. Pior que
 * feio — ele NÃO consegue distinguir uma ação destrutiva de uma reversível, e as
 * duas que existem aqui são exatamente uma de cada: excluir apaga um arquivo,
 * desfazer troca duas versões que continuam as duas guardadas.
 *
 * Regras que este diálogo herda do resto do painel e que não são decoração:
 *   - `role="dialog"` + `aria-modal` + `aria-labelledby`, e `inert` em todo o
 *     resto do body enquanto ele está aberto — sem isso o Tab passeia por trás
 *     do scrim, que foi um defeito real corrigido no flows.html;
 *   - o foco volta para o botão que abriu, e não para o começo da página;
 *   - Esc e o scrim cancelam, porque cancelar é sempre o caminho seguro;
 *   - numa ação destrutiva o foco inicial é o CANCELAR. Enter sem ler não pode
 *     apagar nada.
 * `prefers-reduced-motion` zera só a entrada; nada de informação vive nela. */
function confirmar({ tag, titulo, corpo, botao, perigo }) {
  return new Promise(resolve => {
    const abriu = document.activeElement;
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML =
      '<div class="cfm" role="dialog" aria-modal="true" aria-labelledby="cfm-t" aria-describedby="cfm-b">' +
        '<div class="cfm-hd"><span class="ix">[ ' + esc(tag || "CONFIRMAR") + " ]</span></div>" +
        '<h2 class="cfm-t" id="cfm-t">' + esc(titulo) + "</h2>" +
        '<div class="cfm-b" id="cfm-b">' + (corpo || []).map(p => "<p>" + esc(p) + "</p>").join("") + "</div>" +
        '<div class="cfm-acts">' +
          '<button type="button" class="btn" data-r="0">Cancelar</button>' +
          '<button type="button" class="btn ' + (perigo ? "perigo" : "prime") + '" data-r="1">' + esc(botao) + "</button>" +
        "</div>" +
      "</div>";

    const irmaos = [...document.body.children];
    for (const el of irmaos) el.setAttribute("inert", "");
    document.body.appendChild(scrim);

    const fechar = v => {
      document.removeEventListener("keydown", onKey, true);
      scrim.remove();
      for (const el of irmaos) el.removeAttribute("inert");
      if (abriu && abriu.isConnected) abriu.focus();
      resolve(v);
    };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); fechar(false); return; }
      if (e.key !== "Tab") return;
      // Ciclo fechado entre os dois botões: o `inert` já tirou o resto da
      // página da ordem de tabulação, isto só impede a saída pelo browser.
      const fs = [...scrim.querySelectorAll("button")];
      const i = fs.indexOf(document.activeElement);
      e.preventDefault();
      fs[(i + (e.shiftKey ? -1 : 1) + fs.length) % fs.length].focus();
    };

    scrim.addEventListener("click", e => { if (e.target === scrim) fechar(false); });
    scrim.querySelectorAll("[data-r]").forEach(b =>
      b.addEventListener("click", () => fechar(b.dataset.r === "1")));
    document.addEventListener("keydown", onKey, true);

    // Destrutivo abre com o foco no Cancelar; reversível, no botão de ação.
    scrim.querySelector(perigo ? '[data-r="0"]' : '[data-r="1"]').focus();
  });
}

/* ========================================================== avisar / aviso
   A única forma de o sistema dizer alguma coisa. Ver o bloco AVISOS no CSS.

   `avisoHtml()` monta o cartão (usado ancorado, dentro de outro render) e
   `avisar()` o coloca na pilha flutuante. Quem chama escolhe o TIPO, e o tipo é
   que decide o resto — inclusive se a mensagem some sozinha.

   Três coisas aqui são acessibilidade, não estilo, e não devem ser cortadas:
   erro entra como `role="alert"` + `aria-live="assertive"` (o leitor de tela
   interrompe, porque a ação falhou e quem está ouvindo precisa saber agora);
   ok/info entram como `role="status"` + `polite` (não interrompem nada); e o
   glifo é `aria-hidden`, porque a cor e o desenho não são a informação — o texto
   é. Um aviso que só se distingue por cor não existe para quem não a vê. */
const AVISO_GLIFO = { erro: "✕", alerta: "!", ok: "✓", info: "i" };
const AVISO_VIDA = { ok: 4500, info: 6000 };   // erro e alerta não somem sozinhos
// Quanto a pausa por hover pode esticar a vida, no máximo. Ver `avisar()`.
const VIDA_MAX_PAUSA = 20000;

function avisoHtml(msg, tipo, titulo) {
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  return '<div class="aviso ' + t + '" role="' + (t === "erro" ? "alert" : "status") + '">' +
    '<span class="ai" aria-hidden="true">' + AVISO_GLIFO[t] + "</span>" +
    '<span class="ac">' + (titulo ? '<span class="at">' + esc(titulo) + "</span>" : "") + esc(msg) + "</span>" +
    "</div>";
}

function pilhaAvisos() {
  let p = document.querySelector(".avisos");
  if (p) return p;
  p = document.createElement("div");
  p.className = "avisos";
  document.body.appendChild(p);
  return p;
}

function avisar(msg, tipo, titulo) {
  if (!msg) return null;
  const t = AVISO_GLIFO[tipo] ? tipo : "info";
  const vida = AVISO_VIDA[t] || 0;
  const pilha = pilhaAvisos();

  /* Montado por DOM, nunca por `innerHTML`. Duas razões: a mensagem vem de erro
     de servidor e de nome de arquivo, ou seja de fora, e `textContent` fecha essa
     porta sem depender de ninguém lembrar de escapar; e assim este bloco é
     idêntico nas três páginas — o `flows.html` não tem `esc()`. */
  const cartao = document.createElement("div");
  cartao.className = "aviso " + t;
  cartao.setAttribute("role", t === "erro" ? "alert" : "status");
  cartao.setAttribute("aria-live", t === "erro" ? "assertive" : "polite");

  const gl = document.createElement("span");
  gl.className = "ai"; gl.setAttribute("aria-hidden", "true"); gl.textContent = AVISO_GLIFO[t];
  const corpo = document.createElement("span");
  corpo.className = "ac";
  if (titulo) {
    const tt = document.createElement("span");
    tt.className = "at"; tt.textContent = titulo;
    corpo.appendChild(tt);
  }
  corpo.appendChild(document.createTextNode(msg));
  const fechar = document.createElement("button");
  fechar.type = "button"; fechar.className = "ax";
  fechar.setAttribute("aria-label", "fechar aviso"); fechar.textContent = "×";
  cartao.append(gl, corpo, fechar);
  if (vida) {
    const barra = document.createElement("span");
    barra.className = "abar"; barra.setAttribute("aria-hidden", "true");
    barra.style.animationDuration = vida + "ms";
    cartao.appendChild(barra);
  }

  const sair = () => {
    if (!cartao.isConnected) return;
    cartao.dispatchEvent(new Event("aviso:fim"));
    cartao.classList.add("saindo");
    // Espera a animação de saída, mas nunca depende dela: `setTimeout` remove de
    // qualquer forma, senão um `prefers-reduced-motion` que zera a duração
    // deixaria o cartão pendurado para sempre.
    setTimeout(() => cartao.remove(), 200);
  };
  fechar.addEventListener("click", sair);
  if (vida) {
    let timer = setTimeout(sair, vida);
    /* O mouse em cima pausa a contagem: ler uma frase de 12 palavras leva mais
       que 4,5s, e ver o aviso fugir debaixo do cursor é o pior defeito de toast.
       Mas a pausa tem TETO — medido no verificador: um aviso que nasce debaixo de
       um cursor parado nunca recebe `mouseleave` e ficaria na tela para sempre,
       o que transforma um aviso temporário em sujeira permanente. */
    const tetoDuro = setTimeout(sair, vida + VIDA_MAX_PAUSA);
    const barra = () => cartao.querySelector(".abar");
    cartao.addEventListener("mouseenter", () => {
      clearTimeout(timer);
      const b = barra(); if (b) b.style.animationPlayState = "paused";
    });
    cartao.addEventListener("mouseleave", () => {
      timer = setTimeout(sair, 1200);
      const b = barra(); if (b) b.style.animationPlayState = "running";
    });
    // Fechar pela mão limpa os dois: sem isto o teto duro chamaria `sair()` num
    // cartão já removido — inócuo hoje, e o tipo de coisa que deixa de ser.
    cartao.addEventListener("aviso:fim", () => { clearTimeout(timer); clearTimeout(tetoDuro); });
  }

  pilha.appendChild(cartao);
  // Teto de 4 na tela. Sem ele, uma pasta com oito arquivos recusados vira uma
  // coluna de avisos que cobre a página inteira — e o oitavo esconde o primeiro.
  const todos = [...pilha.querySelectorAll(".aviso")];
  if (todos.length > 4) todos.slice(0, todos.length - 4).forEach(x => x.remove());
  return cartao;
}

/* O aviso ancorado da corrida: fica no fluxo da conversa, onde o erro aconteceu.
   Mantido separado do flutuante de propósito — um erro que pertence a um lugar
   deve ficar nele; o flutuante é para o que é consequência de um clique. */
function alertaInline(msg) {
  const st = $("#stream");
  if (!st) { avisar(msg, "erro"); return; }
  const d = document.createElement("div");
  d.className = "aviso erro";
  d.setAttribute("role", "alert");
  d.innerHTML = '<span class="ai" aria-hidden="true">✕</span><span class="ac">' + esc(msg) + "</span>";
  st.appendChild(d); st.scrollTop = st.scrollHeight;
}

function pintarRodape(s) {
  const r = rodape(s);
  foot.className = "foot " + r.classe;
  foot.innerHTML = r.partes.filter(Boolean).map(esc).join(' <span aria-hidden="true">·</span> ');
}

/* ---------------------------------------------------------------- boot */

/* Fecha qualquer menu aberto. Registrado UMA vez, no documento: preso ao render
   dos cards ele era re-registrado a cada volta para a tela inicial, e os
   ouvintes iam se acumulando. */
function fecharMenus() {
  document.querySelectorAll(".pop").forEach(x => x.setAttribute("hidden", ""));
  document.querySelectorAll(".dots").forEach(x => x.setAttribute("aria-expanded", "false"));
}
document.addEventListener("click", fecharMenus);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") fecharMenus(); });

/* ------------------------------------------------------------ parar no meio
 *
 * Esc para o processo, como num terminal. Registrado UMA vez no documento, e
 * cedendo a tudo que já usa Esc nesta página — a tecla não é nova aqui, é a
 * quarta coisa a querer usá-la:
 *
 *   1. `confirmar()` já escuta Esc na FASE DE CAPTURA para fechar o diálogo.
 *      `preventDefault()` não impede a propagação, então este ouvinte ainda
 *      seria chamado com o diálogo aberto — e um Esc para fechar a confirmação
 *      abriria outra confirmação. O teste é a existência do `.scrim`.
 *   2. Campo de texto: Esc no compositor deve tirar o foco, não matar a
 *      construção. Vale para o `input` do título, o "Outro…" e o compositor —
 *      um Esc reflexo depois de digitar errado não pode custar minutos.
 *      O segundo Esc, já fora do campo, para de verdade.
 *   3. Menus: `fecharMenus` acima roda antes e é barato; se havia menu aberto,
 *      a intenção era fechá-lo.
 *
 * E só age com algo realmente correndo: sem isso, Esc na tela inicial tentaria
 * cancelar uma sessão que não existe e a tela responderia com um erro de 409
 * sobre algo que a pessoa nem começou. */
let parando = false;

function ehCampoDeTexto(el) {
  if (!el) return false;
  const t = (el.tagName || "").toLowerCase();
  return t === "textarea" || t === "input" || el.isContentEditable === true;
}

document.addEventListener("keydown", async ev => {
  if (ev.key !== "Escape") return;
  if (document.querySelector(".scrim")) return;           // diálogo aberto: é dele
  if (ehCampoDeTexto(document.activeElement)) { document.activeElement.blur(); return; }
  if (!S.snap || S.snap.status !== "correndo") return;
  ev.preventDefault();
  await pararAgora();
});

/* A confirmação é obrigatória e é destrutiva por dentro (`perigo: true`, foco em
   Cancelar): uma construção custa minutos e dólares, e Enter sem ler não pode
   jogar isso fora. O `parando` é o que impede dois Esc seguidos de abrirem dois
   diálogos empilhados — o segundo ficaria órfão sobre um `inert` já removido. */
async function pararAgora() {
  if (parando) return;
  if (!S.snap || S.snap.status !== "correndo") return;
  const e = (S.snap.etapas || []).find(x => x.n === S.snap.etapa) || {};
  parando = true;
  try {
    const ok = await confirmar({
      tag: "PARAR",
      titulo: "Parar" + (e.nome ? " a etapa " + e.nome : " o processamento") + "?",
      corpo: [
        "O processo que está rodando agora é morto na hora. O que já ficou pronto continua na tela — desenho, etapas concluídas e achados não somem.",
        "Nada é escrito no n8n por causa disto.",
        "Não existe «retomar»: para seguir, escreve no compositor o que quer diferente e eu recomeço daquele ponto — com a sua correção junto.",
        "O gasto desta etapa pode não ser medido: o custo só chega na última linha do processo, e um processo morto não chega lá."
      ],
      botao: "Parar agora",
      perigo: true
    });
    if (!ok) return;
    S.snap = await callApi(rota("cancelar"), corpo({}));
    pintar();
  } catch (err) {
    alertaInline(String(err && err.message || err));
  } finally {
    parando = false;
  }
}

$("#tema").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme");
  const escuro = atual ? atual === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const novo = escuro ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", novo);
  // A mesma chave do flows: o tema é do produto, não da página.
  try { localStorage.setItem("cockpit-theme", novo); } catch { /* modo privado */ }
});

/* Modo gravação — copiado do flows.html, como o resto do chrome. A chave é a
   mesma (`cockpit-rec`), então ligar aqui liga lá; a onda é cerimônia, o
   borrão nos `.sens` é a informação. */
const REC_KEY = "cockpit-rec";
function recPaint() {
  const on = document.documentElement.getAttribute("data-rec") === "1";
  const b = $("#rec");
  b.querySelector(".lbl").textContent = on ? "REC" : "Gravar";
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.title = on
    ? "modo gravação ligado — dados sensíveis borrados; clique para desligar"
    : "modo gravação — borra dados sensíveis para filmar a tela";
}
function recWave(btn) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const w = document.createElement("div");
  w.className = "rec-wave";
  document.body.append(w);
  w.animate(
    [{ clipPath: `circle(0px at ${x}px ${y}px)`, opacity: .95 },
     { clipPath: `circle(${raio}px at ${x}px ${y}px)`, opacity: 0 }],
    { duration: 700, easing: "cubic-bezier(.22,.61,.36,1)" }
  ).onfinish = () => w.remove();
}
$("#rec").addEventListener("click", () => {
  const on = document.documentElement.getAttribute("data-rec") !== "1";
  if (on) document.documentElement.setAttribute("data-rec", "1");
  else document.documentElement.removeAttribute("data-rec");
  try { on ? localStorage.setItem(REC_KEY, "1") : localStorage.removeItem(REC_KEY); } catch { /* modo privado */ }
  recWave($("#rec"));
  recPaint();
});
// Tester e fluxos abertos lado a lado: a outra aba acompanha, sem onda.
addEventListener("storage", e => {
  if (e.key !== REC_KEY) return;
  if (e.newValue === "1") document.documentElement.setAttribute("data-rec", "1");
  else document.documentElement.removeAttribute("data-rec");
  recPaint();
});
recPaint();

// A seta do appbar. Sair não mata nada: a sessão continua no servidor e o card
// "em construção" da abertura é a volta.
/* O carimbo da base no topbar.
 *
 * TRÊS estados, nunca dois — a lição que este projeto já pagou duas vezes: um
 * campo ausente no status jamais pode cair no galho negativo. Ausente aqui não
 * quer dizer "sem versão", quer dizer que o processo subiu antes de o carimbo
 * existir, e isso é notícia sobre o Node que está rodando, não sobre a base.
 *
 * A frase inteira vive no `title`; no topbar fica só o número, porque um
 * cabeçalho é o pior lugar para uma linha que ninguém vai ler duas vezes. */
function carimbarVersao() {
  const chip = $("#ver");
  if (!chip || !S.capab) return;
  chip.hidden = false;
  if (!("versao" in S.capab)) {
    chip.textContent = "base ?";
    chip.classList.add("velho");
    chip.title = "o cockpit que está rodando subiu antes do carimbo de versão existir — feche a janela e abra de novo";
    return;
  }
  const v = S.capab.versao || {};
  chip.classList.remove("velho");
  chip.textContent = v.n || "base ?";
  chip.title = "Tester " + (v.n || "?") + (v.em ? ", base de " + v.em : "")
    + (v.nota ? " — " + v.nota : "") + ". Sobe quando muda o que ele sabe, não como ele desenha.";
}

/* ------------------------------------------------- o aviso de atualização
 *
 * O job do `novidades.js` roda uma vez por dia, com a aba fechada, e escreve na
 * base sozinho. Este é o único lugar onde ele fala.
 *
 * FICA ATÉ ELE FECHAR — decisão dele, e é o que separa isto do resto da pilha de
 * avisos: os outros são consequência de um clique que ele acabou de dar, e ele
 * estava olhando. Este é um fato consumado que aconteceu enquanto ninguém
 * estava, e um aviso que some sozinho aqui é o mesmo que não avisar.
 *
 * `ok` e não `alerta`: nada quebrou, a base ficou mais nova. `alerta` é o que
 * pede ação, e aqui a ação já foi tomada — a exceção é quando entra novidade de
 * ESQUEMA, que precisa de dois comandos que só ele pode rodar, e aí a linha do
 * comando aparece em `--warn-txt` dentro do mesmo aviso.
 *
 * O estado mora no servidor, não em `localStorage`: guardado no navegador, o
 * aviso só existiria para a aba que já estava aberta na hora — que é exatamente
 * a que não precisa dele. */
function pintarNovidades() {
  const band = $("#novband");
  if (!band) return;
  const av = S.novidades && S.novidades.aviso;
  if (!av) { band.hidden = true; band.textContent = ""; return; }

  band.hidden = false;
  band.textContent = "";
  const cx = document.createElement("div");
  cx.className = "aviso ok";
  cx.setAttribute("role", "status");
  cx.setAttribute("aria-live", "polite");

  const gl = document.createElement("span");
  gl.className = "ai"; gl.setAttribute("aria-hidden", "true"); gl.textContent = "✓";
  cx.append(gl);

  const corpo = document.createElement("span");
  corpo.className = "ac";
  const tit = document.createElement("span");
  tit.className = "at";
  tit.textContent = "O Tester se atualizou sozinho"
    + (av.versao ? " — agora " + av.versao : "")
    + ": " + av.quantas + (av.quantas > 1 ? " novidades do n8n entraram" : " novidade do n8n entrou") + " na base.";
  corpo.append(tit);

  const lst = document.createElement("ul");
  lst.className = "nv-l";
  for (const it of av.itens || []) {
    const li = document.createElement("li");
    const b = document.createElement("b");
    b.textContent = it.titulo;
    li.append(b);
    if (it.versao) {
      const v = document.createElement("span");
      v.className = "nv-v"; v.textContent = it.versao;
      li.append(v);
    }
    li.append(document.createTextNode(" — " + it.texto + " "));
    if (it.link) {
      const a = document.createElement("a");
      // A fonte vai junto na tela pelo mesmo motivo que vai no doc: uma linha
      // que ninguém revisou tem que poder ser conferida em um clique.
      a.href = it.link; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "ver o PR ↗";
      li.append(a);
    }
    lst.append(li);
  }
  corpo.append(lst);

  if (av.precisaEsquema) {
    /* A única parte que pede ação. O job escreve prosa; propriedade de nó é
       MEDIDA dos pacotes, e trocar medição por notícia seria a pior direção
       possível — então quem roda isso é ele. */
    const p = document.createElement("p");
    p.className = "nv-esq";
    p.append(document.createTextNode("Tem novidade de esquema de nó. Isso o job não escreve — rode "));
    const c = document.createElement("code");
    c.className = "nv-cod";
    c.textContent = "node esquema.js --baixar && node esquema.js --construir";
    p.append(c);
    corpo.append(p);
  }
  cx.append(corpo);

  const x = document.createElement("button");
  x.type = "button"; x.className = "ax"; x.textContent = "✕";
  x.setAttribute("aria-label", "fechar este aviso de atualização");
  x.addEventListener("click", async () => {
    x.disabled = true;
    try { S.novidades = await callApi("/api/novidades/fechar", { method: "POST" }); }
    catch (e) { x.disabled = false; avisar(e.message, "erro", "não consegui fechar o aviso"); return; }
    pintarNovidades();
  });
  cx.append(x);
  band.append(cx);
}

async function carregarNovidades() {
  try { S.novidades = await callApi("/api/novidades"); } catch { return; }
  pintarNovidades();
}

$("#voltar").addEventListener("click", inicio);

(async () => {
  let aviso = null;
  try {
    S.capab = await callApi("/api/tester/status");
    S.andamento = S.capab.andamento || null;
    carimbarVersao();
    /* O job pode terminar com a aba já aberta, e aí o aviso só apareceria depois
       de um F5. Cinco minutos: ele roda uma vez por dia e leva minutos, então
       nada mais rápido que isso muda o que aparece na tela. */
    carregarNovidades();
    setInterval(carregarNovidades, 5 * 60 * 1000);
    if (!S.capab.cliEncontrado) aviso = "Não encontrei o CLI do Claude em " + S.capab.cli + " — sem ele o Tester não consegue construir nada. Defina CLAUDE_BIN no .env se ele estiver em outro lugar.";
    else if (!S.capab.n8nConfigurado) aviso = "O n8n não está configurado no .env, então não sei quais nós a sua instância aceita nem consigo criar a cópia de teste.";
    // Construção em andamento não é mais um aviso de texto: é o card pulsando
    // na lista de projetos, e clicar nele volta para ela.
    /* Sem o doc de agentes o Tester ainda constrói um agente, e constrói pior:
       sem buffer, sem lock, sem as sete camadas. Isso tem que ser dito ANTES do
       build, porque depois o fluxo já saiu e parece normal.

       TRÊS estados, não dois. O campo AUSENTE do payload não é o mesmo que o
       arquivo ausente do disco: um servidor que subiu antes desta versão não sabe
       responder sobre o doc, e tratar esse silêncio como "não existe" faz a tela
       culpar o arquivo do Kauan por um processo Node velho. Foi exatamente o que
       aconteceu — o aviso apareceu com o arquivo de 48KB no lugar. É a mesma
       armadilha do `Response.json()` num corpo 404 que este projeto já documenta:
       resposta que não sei ler nunca é resposta negativa. */
    else if (!("docAgentes" in S.capab)) {
      aviso = "O cockpit que está rodando subiu antes desta versão do servidor, então ele não sabe me dizer nada sobre `tester-agentes.md`. Feche a janela do cockpit e abra de novo — o Node não recarrega o `server.js` sozinho. (Isto não é um problema com o arquivo.)";
    }
    else {
      const da = S.capab.docAgentes || {};
      if (!da.encontrado) aviso = "Não achei `tester-agentes.md` na pasta do cockpit — é onde vive o que eu sei sobre agentes conversacionais. Sem ele ainda dá para pedir um agente, mas ele vai sair sem buffer, sem memória e sem as camadas que fazem um agente funcionar de verdade.";
      else if ((da.faltando || []).length) aviso = "O `tester-agentes.md` está sem o(s) bloco(s) " + da.faltando.join(", ") + ". Confira se as âncoras de abertura e fechamento estão sozinhas na própria linha.";
      else if ((da.desconhecidos || []).length) aviso = "O `tester-agentes.md` tem bloco que ninguém lê: " + da.desconhecidos.join(", ") + ". Ou é erro de digitação na âncora, ou é uma seção escrita esperando ser usada.";
    }
  } catch (e) { aviso = e.message; }

  await carregarProjetos();

  const retomar = new URLSearchParams(location.search).get("s");
  if (retomar && /^t[a-z0-9]{1,32}$/.test(retomar)) {
    try {
      S.snap = await callApi("/api/tester/session/" + encodeURIComponent(retomar));
      pintar();
      ligar(retomar);
      return;
    } catch {
      // Sessão sumiu (o servidor reiniciou). Melhor começar do zero dizendo o
      // que houve do que deixar a tela em branco esperando um SSE que não vem.
      aviso = "aquela construção não existe mais neste servidor — ele foi reiniciado. Comece de novo.";
      history.replaceState(null, "", "/tester");
    }
  }
  telaAbertura(aviso);
})();
</script>
<script>
/* ═══════════════════════════════════════════════════ NAV — a lente de vidro
   BLOCO COMPARTILHADO. Idêntico em flows.html, tester.html, cockpit.html, upgrade.html e entrar.html,
   gerado por preview/aplicar-nav.js e travado por nav-sync-test.js.

   As cinco portas são navegação DE VERDADE: clicar recarrega a página. Então a
   lente nunca seria vista viajando — cada página nasceria com ela parada no
   lugar. Ela parte da porta DE ONDE VOCÊ VEIO, guardada em sessionStorage, e
   voa até a atual no carregamento. Mesma disciplina do resto do painel: só
   anima quando há informação nova atrás (você trocou de tela); F5 na mesma
   porta não anima nada, e uma aba nova também não, porque ali você não veio de
   lugar algum.

   Nada aqui julga: a navegação não tem estado de saúde, não lê fato nenhum e
   não faz uma única chamada. */
(function () {
  "use strict";
  var nav = document.querySelector(".nvd");
  if (!nav) return;
  var lente = nav.querySelector(".lente");
  if (!lente) return;

  var CHAVE = "cockpit.nav.v1";
  var reduzir = function () {
    return matchMedia("(prefers-reduced-motion: reduce)").matches;
  };

  /* Mesmo integrador do springNumber() — passo fixo de 16ms, porque com a aba em
     segundo plano o dt real explode e a mola diverge em vez de assentar. A
     afinação é OUTRA de propósito: lá a razão de amortecimento é ~0,97, porque
     um contador que passa do valor e volta lê como dado errado; aqui é ~0,54,
     porque passar e voltar é o que faz parecer líquido. */
  var K = 170, C = 14, M = 1;
  /* Quanto a velocidade vira deformação. Medido: em 0,055 o esticão grudava no
     teto e deformação constante lê como escala fixa, não como física. */
  var ESTICA = 0.022, TETO = 0.16;

  var x = 0, vx = 0, w = 30, vw = 0, vivo = false;

  function alvo() {
    var a = nav.querySelector('[aria-current="page"]');
    if (!a) return null;
    /* Lido A CADA QUADRO: o rótulo abre por CSS, então o destino se move. */
    var ax = a.offsetLeft, aw = a.offsetWidth;
    /* Ímã: com o cursor sobre uma porta inativa a lente se inclina para ela.
       4px lê como intenção e é pouco para não parecer erro. */
    var h = nav.querySelector("a:hover");
    /* `ax` JÁ é `a.offsetLeft`: ler de novo aqui era uma quarta leitura de
       geometria por quadro, e cada uma força layout do documento inteiro. */
    if (h && h !== a) ax += (h.offsetLeft > ax ? 1 : -1) * 4;
    return { x: ax, w: aw };
  }

  /* A deformação SAI da velocidade da própria mola: estica no eixo do movimento
     e comprime no outro, volume preservado. É o que separa vidro líquido de
     pastilha com easing. A origem segue o sentido do movimento — com origem no
     centro a lente esticava para os dois lados e vazava para fora do leito. */
  function pintar(v) {
    var d = Math.min(TETO, Math.abs(v) * ESTICA / 100);
    lente.style.setProperty("--x", x.toFixed(2) + "px");
    lente.style.setProperty("--w", w.toFixed(2) + "px");
    lente.style.setProperty("--sx", (1 + d).toFixed(3));
    lente.style.setProperty("--sy", (1 - d * 0.72).toFixed(3));
    if (Math.abs(v) > 12) {
      lente.style.setProperty("--org", v > 0 ? "left center" : "right center");
    }
  }

  function assentar() {
    var t = alvo();
    if (!t) return;
    x = t.x; w = t.w; vx = 0; vw = 0;
    lente.style.setProperty("--org", "center");
    pintar(0);
  }

  function passo() {
    var t = alvo();
    if (!t) { vivo = false; return; }
    if (reduzir()) { assentar(); vivo = false; return; }
    var i, dt = 0.016;
    for (i = 0; i < 2; i++) {
      vx += ((-K * (x - t.x) - C * vx) / M) * dt; x += vx * dt;
      vw += ((-K * (w - t.w) - C * vw) / M) * dt; w += vw * dt;
    }
    pintar(vx);
    if (Math.abs(t.x - x) < 0.35 && Math.abs(vx) < 3 &&
        Math.abs(t.w - w) < 0.35 && Math.abs(vw) < 3) {
      x = t.x; w = t.w; vx = 0; vw = 0; pintar(0); vivo = false; return;
    }
    requestAnimationFrame(passo);
  }

  function acordar() { if (!vivo) { vivo = true; requestAnimationFrame(passo); } }

  var aqui = (nav.querySelector('[aria-current="page"]') || {}).dataset;
  aqui = aqui ? aqui.porta : null;

  /* A partida. Se a porta anterior desta aba não é esta, a lente nasce lá e voa
     para cá. Só então a varredura de brilho se paga: ela marca uma chegada. */
  var de = null;
  try { de = sessionStorage.getItem(CHAVE); } catch (e) { de = null; }
  var origem = de && de !== aqui ? nav.querySelector('[data-porta="' + de + '"]') : null;

  /* A PARTIDA RODA DEPOIS DA PRIMEIRA PINTURA, e isto é medição, não gosto.
     Ler `offsetLeft` durante a execução do script ANTECIPA o primeiro layout do
     documento e o torna síncrono: 209 ms de thread bloqueada no `/disco` e 126 ms
     no `/tester` (as duas funções nº 1 de JS no boot dessas telas). O `/upgrade`,
     com o dobro do CSS, custa 0 ms no mesmo ponto — a diferença é só QUANDO o
     script corre em relação ao layout já estar limpo.
     Dois quadros: o primeiro deixa o navegador fazer o layout dele, o segundo lê
     uma árvore que já existe. A lente fica invisível (`opacity:0`) até estar
     posicionada, então o adiamento não vira flash no lugar errado. */
  function partir() {
    if (origem && !reduzir()) {
      x = origem.offsetLeft; w = origem.offsetWidth; vx = 0; vw = 0;
      pintar(0);
      lente.classList.add("varre");
      acordar();
    } else {
      assentar();
    }
    lente.classList.add("pronta");
  }
  requestAnimationFrame(function () { requestAnimationFrame(partir); });
  try { if (aqui) sessionStorage.setItem(CHAVE, aqui); } catch (e) {}

  nav.addEventListener("pointerover", acordar);
  nav.addEventListener("pointerout", acordar);
  addEventListener("resize", assentar);

  /* O atalho que o chip promete. Navega de verdade; alt+dígito não digita nada
     em campo de texto, então não precisa de guarda contra o compositor. */
  addEventListener("keydown", function (ev) {
    if (!ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var i = "12345".indexOf(ev.key);
    if (i < 0) return;
    var a = nav.querySelectorAll("a")[i];
    if (!a || a.getAttribute("aria-current") === "page") return;
    ev.preventDefault();
    location.href = a.getAttribute("href");
  });
}());
</script>
</body>
</html>
