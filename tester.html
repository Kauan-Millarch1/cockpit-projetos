<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tester · Cockpit</title>
<style>
/* Tokens: os mesmos do flows.html. Mudar cor aqui sem mudar lá é como o painel
   começa a parecer dois produtos. Status color (ok/warn/risk) é RESERVADA:
   nunca vira cor de série, nunca vira cor de marca. */
:root{
  --bg:#FAFAF9; --bg-deep:#F4F4F2; --surface:#FFFFFF; --surface-2:#00000005; --raised:#FFFFFF;
  --line:rgba(10,10,20,.11); --line-soft:rgba(10,10,20,.06);
  --grid:rgba(10,10,20,.045); --grid-bold:rgba(10,10,20,.08);
  --txt:#14151C; --txt-dim:#3F424D; --txt-faint:#666973;
  --accent:#3B48E0; --accent-soft:#3B48E014; --accent-line:#3B48E055; --accent-txt:#3B48E0;
  --brand:#FF5A1F; --brand-txt:#D04919;
  --ok:#0E9F6E; --warn:#B7791F; --risk:#DC2B3A; --cold:#8B90A0;
  --ok-soft:#0E9F6E14; --warn-soft:#B7791F14; --risk-soft:#DC2B3A14; --cold-soft:#8B90A014;
  --ok-txt:#0B8159; --warn-txt:#9A661A; --risk-txt:#D02937; --cold-txt:#6D717E;
  --node-face:#FFFFFF; --node-edge:rgba(10,10,20,.16); --port:#9AA0B4; --wire:#A8AEC0;
  --sb:rgba(10,10,20,.20); --sb-hov:rgba(10,10,20,.36);
  --shadow:0 1px 2px rgba(10,10,20,.04), 0 12px 28px -22px rgba(10,10,20,.28);
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --font-num:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06060B; --bg-deep:#040408; --surface:#0E0F1A; --surface-2:#14162454; --raised:#171A2B;
    --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
    --grid:rgba(255,255,255,.028); --grid-bold:rgba(255,255,255,.055);
    --txt:#E9EBF5; --txt-dim:#AAAFC2; --txt-faint:#777D92;
    --accent:#5865F5; --accent-soft:#5865F51f; --accent-line:#5865F55c; --accent-txt:#606CF5;
    --brand:#FF5A1F; --brand-txt:#FF5A1F;
    --ok:#2FD48F; --warn:#F5A524; --risk:#FF4F5E; --cold:#59617D;
    --ok-soft:#2FD48F1a; --warn-soft:#F5A5241a; --risk-soft:#FF4F5E1a; --cold-soft:#59617D1a;
    --ok-txt:#2FD48F; --warn-txt:#F5A524; --risk-txt:#FF4F5E; --cold-txt:#798096;
    --node-face:#1B1D2E; --node-edge:rgba(255,255,255,.14); --port:#6E7590; --wire:#6A7089;
    --sb:rgba(255,255,255,.15); --sb-hov:rgba(255,255,255,.30);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#06060B; --bg-deep:#040408; --surface:#0E0F1A; --surface-2:#14162454; --raised:#171A2B;
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
  --grid:rgba(255,255,255,.028); --grid-bold:rgba(255,255,255,.055);
  --txt:#E9EBF5; --txt-dim:#AAAFC2; --txt-faint:#777D92;
  --accent:#5865F5; --accent-soft:#5865F51f; --accent-line:#5865F55c; --accent-txt:#606CF5;
  --brand:#FF5A1F; --brand-txt:#FF5A1F;
  --ok:#2FD48F; --warn:#F5A524; --risk:#FF4F5E; --cold:#59617D;
  --ok-soft:#2FD48F1a; --warn-soft:#F5A5241a; --risk-soft:#FF4F5E1a; --cold-soft:#59617D1a;
  --ok-txt:#2FD48F; --warn-txt:#F5A524; --risk-txt:#FF4F5E; --cold-txt:#798096;
  --node-face:#1B1D2E; --node-edge:rgba(255,255,255,.14); --port:#6E7590; --wire:#6A7089;
  --sb:rgba(255,255,255,.15); --sb-hov:rgba(255,255,255,.30);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit}
/* `main` precisa crescer E ser flex, senão o filho com `flex:1` não tem contra
   quem crescer e a página deixa um vazio embaixo do rodapé. `min-height:0` é o
   que permite as colunas rolarem por dentro em vez de esticarem a página. */
#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* A barra de rolagem faz parte da moldura, não é um controle do sistema. A padrão
   do Chrome chega como uma faixa cinza-clara opaca que ignora o tema — no tema
   escuro ela era a coisa mais clara da tela, disputando com o conteúdo.
   O polegar é desenhado com `background-clip:padding-box` sobre uma borda
   transparente: a borda vira a folga, então o polegar fica FINO sem estreitar a
   pista, que é o que mantém o alvo de clique confortável. `scrollbar-width:thin`
   cobre Firefox, que ignora as regras `::-webkit-`. */
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);background-clip:padding-box;
  border:3px solid transparent;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hov);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ---------------------------------------------------------------- appbar */
.appbar{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line-soft);
  background:var(--surface);flex:0 0 auto;flex-wrap:wrap}
.mark{font-family:var(--font-num);font-size:11px;letter-spacing:.1em;color:var(--brand-txt);font-weight:700;text-decoration:none}
.tabs{display:flex;gap:3px}
.tab{font-size:12px;color:var(--txt-faint);padding:5px 11px;border-radius:8px;text-decoration:none}
.tab:hover{background:var(--surface-2);color:var(--txt-dim)}
.tab.on{color:var(--txt);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.appbar .right{margin-left:auto;font-family:var(--font-num);font-size:10.5px;color:var(--txt-faint);
  display:flex;align-items:center;gap:12px;flex:0 0 auto}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;
  font-size:11px;color:var(--txt-faint);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--txt-dim)}
.iconbtn[hidden]{display:none}

/* ------------------------------------------------- card "em construção"
   O projeto que está sendo construído AGORA, visto da tela de abertura. Ele é
   deliberadamente diferente de um projeto guardado: translúcido e com a borda
   respirando, porque é a única coisa da abertura que está em movimento de
   verdade — a animação aqui é informação, não decoração. A porcentagem sai das
   etapas concluídas (via ESTADO_TAG, o mesmo juízo do painel lateral), então
   ela é honesta e salta em degraus; a barra diz em qual etapa está, que é o
   que responde "quanto falta" de verdade. */
.proj.ghost{border:1px dashed var(--accent-line);background:color-mix(in srgb,var(--surface) 62%,transparent);
  animation:ghostpulse 2.2s ease-in-out infinite}
.proj.ghost:hover{border-style:solid}
.ghost-top{display:flex;align-items:center;gap:7px;font-family:var(--font-num);font-size:9px;
  letter-spacing:.07em;color:var(--accent-txt)}
.ghost-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  animation:ghostdot 1.1s ease-in-out infinite}
.ghost-bar{height:4px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin-top:7px}
.ghost-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);
  transition:width .6s cubic-bezier(.2,.9,.3,1)}
.ghost-pct{font-family:var(--font-num);font-size:10.5px;color:var(--txt);font-weight:700}
@keyframes ghostpulse{0%,100%{border-color:var(--accent-line)}50%{border-color:color-mix(in srgb,var(--accent) 18%,transparent)}}
@keyframes ghostdot{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){
  .proj.ghost,.ghost-dot{animation:none}
  .ghost-bar i{transition:none}
}

/* ------------------------------------------------------------- abertura */
.stage-open{flex:1 1 auto;display:grid;place-items:center;padding:40px 22px;position:relative;
  background:var(--bg-deep);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
.open-in{width:100%;max-width:700px;text-align:center}
.open-in h1{font-size:clamp(26px,4.4vw,36px);font-weight:600;letter-spacing:-.025em;margin:0 0 10px}
.open-in .hint{color:var(--txt-dim);font-size:13.5px;margin:0 auto 28px;max-width:56ch;line-height:1.6}
.bigbox{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px 12px;position:relative;box-shadow:var(--shadow)}
.bigbox textarea{width:100%;border:none;background:none;resize:none;font:inherit;font-size:14.5px;
  color:var(--txt);line-height:1.6;min-height:56px;outline:none}
.bigbox textarea::placeholder{color:var(--txt-faint)}
.boxfoot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line-soft);flex-wrap:wrap}
.lvl{font-family:var(--font-num);font-size:9.5px;color:var(--txt-faint);letter-spacing:.05em;margin-right:2px}
.chip{font-size:11.5px;color:var(--txt-dim);border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:5px 12px;line-height:1.3;cursor:pointer;min-height:30px}
.chip:hover{border-color:var(--accent-line);color:var(--txt)}
.chip[aria-pressed="true"],.chip.on{color:var(--txt);border-color:var(--accent-line);background:var(--accent-soft)}
.btn{font-size:12px;border-radius:9px;padding:8px 14px;border:1px solid var(--line);
  background:var(--raised);color:var(--txt-dim);cursor:pointer;flex:0 0 auto;min-height:34px}
.btn:hover:not(:disabled){color:var(--txt);border-color:var(--accent-line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.prime{color:#fff;border-color:transparent;font-weight:600;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.btn.prime:hover:not(:disabled){filter:brightness(1.06)}
/* O único botão vermelho do painel, e ele existe para uma coisa só: apagar.
   Usar `--risk` em qualquer ação reversível gastaria o alarme antes da hora. */
.btn.perigo{color:#fff;border-color:transparent;font-weight:600;
  background:linear-gradient(180deg,color-mix(in srgb,var(--risk) 84%,#fff),var(--risk));
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.btn.perigo:hover:not(:disabled){filter:brightness(1.06)}

/* ------------------------------------------------------------- confirmar
   Substitui o `confirm()` do browser, que chega com "localhost:4317 diz", fonte
   do sistema e ordem de botão do sistema — e que não sabe distinguir apagar de
   desfazer. O scrim é `fixed` com desfoque; o cartão tem largura de leitura, não
   largura de tela. */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;
  background:color-mix(in srgb,var(--bg-deep) 72%,transparent);backdrop-filter:blur(6px)}
.cfm{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:18px 19px 16px;box-shadow:var(--shadow);animation:cfmin .22s cubic-bezier(.2,.9,.3,1) both}
.cfm-hd .ix{font-family:var(--font-num);font-size:9.5px;letter-spacing:.07em;color:var(--txt-faint)}
.cfm-t{margin:8px 0 10px;font-size:16.5px;font-weight:650;line-height:1.35;letter-spacing:-.01em;color:var(--txt)}
.cfm-b p{margin:0 0 9px;font-size:12.8px;line-height:1.6;color:var(--txt-dim)}
.cfm-b p:last-child{margin-bottom:0}
.cfm-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
@keyframes cfmin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .cfm{animation-duration:1ms;animation-delay:0s} }
@media (max-width:420px){ .cfm-acts{flex-direction:column-reverse} .cfm-acts .btn{width:100%} }
.go{margin-left:auto}
.egs{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.eg{font-size:11.5px;color:var(--txt-faint);border:1px dashed var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;background:none}
.eg:hover{color:var(--txt-dim);border-color:var(--accent-line)}
.avisobar{max-width:700px;margin:16px auto 0;font-size:12px;line-height:1.6;border-radius:10px;
  padding:10px 12px;background:var(--warn-soft);color:var(--warn-txt);border:1px solid var(--warn-soft);text-align:left}

/* --------------------------------------------------------------- corrida */
.split{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.stream{padding:18px 20px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;
  border-right:1px solid var(--line-soft);min-width:0}
/* Filho de coluna flex encolhe por padrão. Sem isto os cartões eram ESPREMIDOS
   quando a conversa passava da altura da coluna, em vez de a coluna rolar — o
   "O que eu entendi" aparecia cortado no meio da última linha, e a faixa de
   atividade virava um risco fino. */
.stream > *{flex:0 0 auto}
.side{padding:16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;background:var(--surface-2);min-width:0}
.composer-wrap{padding:0 20px 16px;border-right:1px solid var(--line-soft)}

.msg{max-width:70ch}
.msg .who{font-family:var(--font-num);font-size:9.5px;letter-spacing:.06em;color:var(--txt-faint);margin-bottom:6px}
.msg.me{margin-left:auto;text-align:right}
.msg.me .body{display:inline-block;text-align:left;background:var(--raised);border:1px solid var(--line);
  border-radius:12px 12px 4px 12px;padding:10px 13px;font-size:13px;line-height:1.6;color:var(--txt);white-space:pre-wrap}
/* Sem barra colorida na lateral. Quem fala já está dito no rótulo "TESTER" logo
   acima, e a fala do sistema já se distingue da sua por não ter balão. Uma
   listra de acento aqui seria decoração pagando por informação que já existe. */
.msg.sys .body{font-size:13px;line-height:1.68;color:var(--txt-dim);white-space:pre-wrap}

.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden;max-width:70ch}
.card .ch{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line-soft);
  font-family:var(--font-num);font-size:9.5px;letter-spacing:.06em;color:var(--txt-faint);flex-wrap:wrap}
.card .ch .ix{color:var(--accent-txt)}
.row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;padding:9px 13px;
  border-bottom:1px solid var(--line-soft);align-items:start}
.row:last-child{border-bottom:none}
.row .k{font-family:var(--font-num);font-size:10px;color:var(--txt-faint);padding-top:2px}
.row .v{font-size:12.5px;color:var(--txt);line-height:1.5;word-break:break-word}
.row .v.miss{color:var(--warn-txt)}
/* Suposição em vigor: mesma família de aviso do `.miss`, mas com etiqueta —
   "em aberto" e "decidido sem você" não podem se ler igual. */
.row .v.sup{color:var(--warn-txt)}
.tagsup{font-family:var(--font-num);font-size:8.5px;letter-spacing:.06em;vertical-align:1px;
  border:1px solid var(--warn-soft);background:var(--warn-soft);border-radius:5px;
  padding:2px 5px;margin-right:7px;white-space:nowrap}

.q{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:12px 13px;max-width:70ch}
.q .qt{font-size:12.8px;color:var(--txt);line-height:1.55;margin-bottom:4px}
.q .qw{font-size:11.5px;color:var(--txt-faint);line-height:1.5;margin-bottom:9px}
.q .opts{display:flex;gap:7px;flex-wrap:wrap}

.gate{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:12px;padding:13px 14px;max-width:70ch}
.gate .gt{font-size:12.8px;color:var(--txt);margin-bottom:3px;font-weight:600}
.gate .gd{font-size:11.5px;color:var(--txt-dim);line-height:1.55;margin-bottom:11px}
.gate .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate .cost{margin-left:auto;font-family:var(--font-num);font-size:9.5px;color:var(--txt-faint)}

.composer{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;
  display:flex;align-items:flex-end;gap:10px}
.composer textarea{flex:1;border:none;background:none;resize:none;font:inherit;font-size:12.5px;
  color:var(--txt);line-height:1.55;max-height:120px;outline:none;min-height:22px}
.composer textarea::placeholder{color:var(--txt-faint)}

/* ------------------------------------------------------------ o desenho */
.canvas{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-deep);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;position:relative;max-width:none}
.canvas svg{display:block;width:100%;height:320px;touch-action:none}
.canvas .corner{position:absolute;top:9px;left:12px;font-family:var(--font-num);font-size:10px;
  color:var(--txt-faint);letter-spacing:.05em;pointer-events:none}
.canvas-ctl{position:absolute;top:7px;right:9px}
.canvas-hint{position:absolute;bottom:8px;left:12px;font-family:var(--font-num);font-size:9.5px;
  color:var(--txt-faint);opacity:.75;pointer-events:none}
/* O nome do nó pode ser longo (`clickup_buscar_tarefas_abertas`). Aqui ele não é
   cortado: dá para aproximar e ler. Sem `paint-order` a borda do texto some
   contra o fio que passa por trás. */
.nd .nm{paint-order:stroke;stroke:var(--bg-deep);stroke-width:3px;stroke-linejoin:round}
.edge{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.edge.drawing{stroke:var(--accent);animation:draw .42s ease forwards}
.edge.done{stroke:var(--wire);stroke-dashoffset:0}
/* Aresta de IA: o modelo, a memória, o parser e as tools não estão no caminho da
   execução — são penduradas no agente. Tracejada e mais fina para dizer isso sem
   gastar cor (status é reservado, --accent é movimento). O tracejado tem que ser
   `dasharray` fixo, e não a animação de traço: `--len` é o comprimento do próprio
   path, então reaproveitá-lo aqui apagaria a linha inteira. */
.edge.ia{stroke-width:1.1;stroke-dasharray:3 3.5;stroke-dashoffset:0;opacity:.72}
.edge.ia.drawing{stroke:var(--accent);animation:none}
.nd{opacity:0;transform-box:fill-box;transform-origin:center}
.nd .face{fill:var(--node-face);stroke:var(--node-edge);stroke-width:1.2}
.nd .glyph{stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke:var(--txt-dim)}
.nd .nm{fill:var(--txt);font-family:var(--font);font-size:9.5px;font-weight:600;text-anchor:middle}
.nd .ty{fill:var(--txt-faint);font-family:var(--font-num);font-size:7.5px;text-anchor:middle}
.nd .port{fill:var(--node-face);stroke:var(--port);stroke-width:1.3}
.nd.writing{opacity:1;animation:popin .34s cubic-bezier(.2,.9,.25,1) both}
.nd.writing .face{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 4;animation:march .9s linear infinite}
.nd.writing .nm,.nd.writing .ty{opacity:0}
.nd.built{opacity:1}
.nd.built .face{stroke:var(--node-edge);transition:stroke .5s ease}
.nd.built .nm,.nd.built .ty{opacity:1;transition:opacity .35s ease .05s}
.nd .caret{fill:var(--accent);opacity:0}
.nd.writing .caret{opacity:1;animation:blink .7s steps(1,end) infinite}
@keyframes popin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes march{to{stroke-dashoffset:-18}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------------------------------------------------------- superfícies */
.surf{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:13px;max-width:70ch}
.surf .sh{font-family:var(--font-num);font-size:9.5px;letter-spacing:.06em;color:var(--txt-faint);margin-bottom:10px}
/* Mockups de destino. A superfície se lê pela FORMA e pelo RÓTULO, nunca por
   cor emprestada de marca alheia:
   - o roxo do Slack (#4A154B) seria cor solta, fora do sistema de tokens: no
     dia em que o tema mudar ela não muda junto;
   - o verde do WhatsApp seria `--ok`, que é COR DE STATUS. Este repo reserva
     ok/warn/risk para dizer se algo está bem ou mal — um balão verde ali
     sugeriria "deu certo", e nada aqui executou.
   O que faz o trabalho é a anatomia: o Slack tem avatar quadrado, nome em
   negrito e selo APP; o WhatsApp tem balão com rabinho sobre fundo de conversa;
   o e-mail tem cabeçalho De/Para/Assunto; a linha gravada é uma linha de
   tabela. Quem usa esses apps reconhece a forma sem precisar da cor. */
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.mock+.mock{margin-top:10px}
.mock-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-soft);
  font-family:var(--font-num);font-size:10.5px;color:var(--txt-dim);background:var(--surface-2);min-width:0}
.mock-top .dest{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mock-top .mk{margin-left:auto;flex:0 0 auto;font-size:8.5px;letter-spacing:.06em;color:var(--txt-faint)}
.mock-time{font-family:var(--font-num);font-size:9.5px;color:var(--txt-faint)}
/* Slack: avatar quadrado + nome + selo APP + hora, texto embaixo. */
.slack-msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px 14px}
.slack-av{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent-line);display:grid;place-items:center;
  color:var(--accent-txt);font-size:15px;font-weight:700}
.slack-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.slack-head strong{font-size:12.8px}
.badge-app{font-family:var(--font-num);font-size:8px;letter-spacing:.04em;color:var(--txt-faint);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.mock-text{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
/* WhatsApp/Telegram: balão com rabinho sobre fundo de conversa pontilhado. */
.wha-chat{padding:14px 14px 12px;background:var(--bg-deep);
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:14px 14px}
.wha-bubble{max-width:85%;width:fit-content;background:var(--surface);border:1px solid var(--line);
  border-radius:10px 10px 10px 3px;padding:8px 11px;box-shadow:var(--shadow)}
.wha-meta{display:block;text-align:right;font-family:var(--font-num);font-size:9px;color:var(--txt-faint);margin-top:4px}
/* E-mail: cabeçalho De/Para/Assunto + corpo. */
.mail-head{padding:10px 14px;border-bottom:1px solid var(--line-soft);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.3px}
.mail-head .k{font-family:var(--font-num);font-size:10px;color:var(--txt-faint);padding-top:1px}
.mail-head .sub{font-weight:650}
.mail-body{padding:12px 14px}
/* Linha gravada: uma linha de tabela, destacada como "nova". */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-family:var(--font-num);font-size:9.5px;letter-spacing:.04em;color:var(--txt-faint);
  text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;color:var(--txt);word-break:break-word;background:var(--accent-soft);min-width:90px}
/* Resposta de webhook: bloco mono, como um curl -i. */
.http-resp{font-family:var(--font-num);font-size:11.5px;padding:12px 14px;line-height:1.65;
  color:var(--txt-dim);white-space:pre-wrap;word-break:break-word}
/* NÃO usar `.st` aqui: é a classe das etapas do lado direito (um grid), e a
   colisão empilhava "HTTP 200" numa coluna de 20px. */
.http-resp .hst{color:var(--txt);font-weight:700}
/* Entrada: o mock chega como a mensagem chegaria — sobe e assenta, e o texto se
   revela da esquerda para a direita, uma vez só (gated por assinatura no JS;
   o prefers-reduced-motion global zera as durações). */
.mock.anim{animation:mockin .5s cubic-bezier(.2,.9,.3,1) both}
.mock.anim .mock-text,.mock.anim .tbl td,.mock.anim .http-resp{animation:typein .7s ease .28s both}
@keyframes mockin{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes typein{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 -2% 0 0)}}
.naosim{color:var(--warn-txt);background:var(--warn-soft);border-radius:5px;padding:0 4px;
  font-family:var(--font-num);font-size:11px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:12.3px}
.kv dt{font-family:var(--font-num);font-size:10.5px;color:var(--txt-faint)}
.kv dd{margin:0;color:var(--txt);word-break:break-word}
.selo{font-family:var(--font-num);font-size:10px;color:var(--warn-txt);background:var(--warn-soft);
  border:1px solid var(--warn-soft);border-radius:8px;padding:7px 10px;margin-top:11px;line-height:1.55}

/* ------------------------------------------------- opção como mensagem pronta
   Escolher entre "remetente e assunto" e "remetente, assunto e trecho do corpo"
   é escolher entre duas DESCRIÇÕES. Aqui a opção é desenhada como a mensagem que
   ela produz, na mesma anatomia de destino que o fantasma usa.
   O selo diz MODELO, nunca SIMULAÇÃO, e a diferença não é cosmética: o fantasma
   da etapa 06 é DERIVADO do fluxo por código, isto aqui é texto que o modelo
   escreveu para você comparar antes de existir fluxo nenhum. Um selo só para os
   dois apagaria a única coisa que dá valor ao fantasma.
   Vem tudo em `span` porque o cartão é um `<button>`, e `<div>` dentro de botão é
   markup inválido — daí a linha de `display` logo abaixo. */
.opts.tpl{display:grid;grid-template-columns:1fr;gap:9px}
.tpl-op{display:block;width:100%;text-align:left;cursor:pointer;padding:10px 11px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tpl-op:hover{border-color:var(--accent-line)}
.tpl-op.on{border-color:var(--accent-line);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent-line)}
.tpl-hd{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt);line-height:1.45}
.tpl-dot{width:14px;height:14px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);background:var(--bg)}
.tpl-op.on .tpl-dot{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 9px var(--accent)}
.tpl-mock{margin-top:9px;border-color:var(--line-soft);background:var(--bg-deep)}
.tpl-mock,.tpl-mock .wha-chat,.tpl-mock .wha-bubble,.tpl-mock .mail-body,
.tpl-mock .slack-av,.tpl-mock .mock-text,.tpl-mock .slack-col{display:block}
.tpl-mock .slack-av{display:grid}
.tpl-mock .mock-text{font-size:12.3px}
/* O campo dinâmico não é o valor: é o buraco onde o valor entra. Marcá-lo com
   `--accent` (movimento, nunca status) evita que a pessoa leia "{{ assunto }}"
   como se o fluxo fosse mandar literalmente esse texto. */
.ph{font-family:var(--font-num);font-size:11px;color:var(--accent-txt);
  background:var(--accent-soft);border-radius:5px;padding:0 4px}
.opts.tpl .chip.outro{justify-self:start}

pre.json{margin:0;font-family:var(--font-num);font-size:11px;line-height:1.55;color:var(--txt-dim);
  background:var(--bg-deep);border-radius:8px;padding:11px;overflow-x:auto;max-height:340px}
details.jsonbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:none}
details.jsonbox>summary{padding:11px 13px;cursor:pointer;font-size:12.5px;color:var(--txt-dim);list-style:none}
details.jsonbox>summary::-webkit-details-marker{display:none}
details.jsonbox>summary::before{content:"▸ ";color:var(--txt-faint)}
details.jsonbox[open]>summary::before{content:"▾ "}
details.jsonbox .inner{padding:0 13px 13px}

/* ----------------------------------------------------------- lado direito */
.sec{display:flex;flex-direction:column;gap:9px}
.sech{display:flex;align-items:baseline;gap:8px;font-family:var(--font-num);font-size:9.5px;
  letter-spacing:.06em;color:var(--txt-faint)}
.sech .ix{color:var(--brand-txt)}
.steps{display:flex;flex-direction:column;gap:1px}
.st{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:7px 8px;border-radius:8px}
.st .num{font-family:var(--font-num);font-size:9.5px;color:var(--txt-faint);text-align:right}
.st .nm{font-size:12px;color:var(--txt-faint)}
.st .tag{font-family:var(--font-num);font-size:8.5px;color:var(--txt-faint);text-align:right}
.st.feita .nm,.st.pulada .nm,.st.vazia .nm{color:var(--txt-dim)}
.st.feita .num{color:var(--ok-txt)}
.st.pulada .num,.st.vazia .num{color:var(--cold-txt)}
.st.falhou .num,.st.falhou .tag{color:var(--risk-txt)}
.st.pendente .num,.st.pendente .nm,.st.pendente .tag{opacity:.6}
.st.correndo,.st.espera{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.st.correndo .nm,.st.espera .nm{color:var(--txt);font-weight:600}
.st.correndo .num,.st.espera .num{color:var(--accent-txt)}
.st.espera .tag{color:var(--warn-txt)}
.st .nota{grid-column:2/4;font-size:10.5px;color:var(--txt-faint);line-height:1.45;margin-top:2px}

.i{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px}
.i .ih{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.i .kind{font-family:var(--font-num);font-size:8.5px;letter-spacing:.05em;padding:2px 6px;border-radius:5px}
.i.risco .kind{color:var(--risk-txt);background:var(--risk-soft)}
.i.falta .kind{color:var(--warn-txt);background:var(--warn-soft)}
.i.ideia .kind{color:var(--accent-txt);background:var(--accent-soft)}
.i .tx{font-size:11.8px;color:var(--txt-dim);line-height:1.5;word-break:break-word}
.i .src{font-family:var(--font-num);font-size:8.5px;color:var(--txt-faint);margin-top:5px}
.empty{font-size:11.5px;color:var(--txt-faint);line-height:1.5;border:1px dashed var(--line);
  border-radius:10px;padding:11px}

.band{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);font-size:11.5px;color:var(--txt-dim);line-height:1.5}
.band .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* Faixa de processamento. Duas linhas: o que está acontecendo agora (etapa) e o
   detalhe do que a sessão está fazendo neste segundo. O detalhe muda toda hora
   e por isso NÃO pode ser a linha principal — quem olha quer saber onde está,
   não qual arquivo foi tocado. */
.proc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--accent-line);
  border-radius:12px;background:var(--accent-soft);max-width:70ch}
.proc .spin{width:16px;height:16px;flex:0 0 auto;border-radius:50%;
  border:2px solid var(--accent-line);border-top-color:var(--accent);animation:girar .8s linear infinite}
.proc .col{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
/* `span` é inline: sem isto as duas linhas colavam uma na outra e o detalhe
   transbordava a caixa. Cada uma é um bloco, e a de baixo trunca. */
.proc .t1{display:block;font-size:12.8px;color:var(--txt);font-weight:600;line-height:1.4}
.proc .t2{display:block;font-family:var(--font-num);font-size:10.5px;color:var(--txt-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;line-height:1.4}
.proc .passo{font-family:var(--font-num);font-size:10px;color:var(--accent-txt);flex:0 0 auto}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.proc .spin{animation:none;border-top-color:var(--accent-line)}}
.band .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-num);font-size:11px}

/* rodapé: muda conforme o que REALMENTE aconteceu (PLAN.md §10) */
.foot{font-family:var(--font-num);font-size:10px;color:var(--txt-faint);padding:9px 18px;
  border-top:1px solid var(--line-soft);display:flex;gap:14px;flex-wrap:wrap;background:var(--surface);flex:0 0 auto}
.foot.escreveu{background:var(--warn-soft);color:var(--warn-txt)}
.foot.indeterminado{background:var(--risk-soft);color:var(--risk-txt)}

/* ------------------------------------------------------ salvar e projetos */
.acoes{display:flex;gap:8px;margin:11px 0;flex-wrap:wrap;align-items:center}
.salvar{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:10px;
  padding:11px 12px;margin-top:11px}
.salvar .lbl{display:block;font-size:12px;color:var(--txt-dim);margin-bottom:8px}
.salvar .linha{display:flex;gap:8px;flex-wrap:wrap}
.salvar .salvo{font-size:12.5px;color:var(--txt)}
.campo{flex:1 1 220px;min-width:0;font:inherit;font-size:12.5px;color:var(--txt);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none;min-height:34px}
.campo:focus{border-color:var(--accent-line)}

.projs{margin-top:34px;text-align:left}
.projs-h{display:flex;gap:8px;align-items:baseline;font-family:var(--font-num);font-size:9.5px;
  letter-spacing:.06em;color:var(--brand-txt);margin-bottom:10px}
.projs-h span{color:var(--txt-faint)}
.projs-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.proj{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;font:inherit;
  color:inherit;min-width:0}
.proj:hover{border-color:var(--accent-line)}
.proj .pt{font-size:13px;font-weight:650;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Renomear acontece NO LUGAR do título, do tamanho do título. Reusar `.campo`
   aqui era o defeito: ele é `flex:1 1 220px` e o card é uma coluna flex, então
   o basis virava ALTURA e o campo abria 220px de vão dentro do card. */
.pt-edit{width:100%;min-width:0;font:inherit;font-size:13px;font-weight:650;color:var(--txt);
  background:var(--bg-deep);border:1px solid var(--accent-line);border-radius:8px;
  padding:3px 7px;margin:-4px -7px;outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.proj .pi{font-size:11.5px;color:var(--txt-dim);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.proj .pm,.proj .pd{font-family:var(--font-num);font-size:9.5px;color:var(--txt-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj{position:relative}
.proj-menu{position:absolute;top:8px;right:8px}
/* Some até o mouse chegar, mas NUNCA some do teclado: `focus-within` mantém o
   botão visível para quem navega com Tab, senão o menu não existiria para ele. */
.dots{opacity:0;background:none;border:1px solid transparent;border-radius:7px;padding:1px 6px;
  font-size:15px;line-height:1.1;color:var(--txt-faint);cursor:pointer}
.proj:hover .dots,.proj:focus-within .dots,.dots:focus-visible{opacity:1}
.dots:hover{background:var(--surface-2);border-color:var(--line);color:var(--txt)}
.pop{position:absolute;top:26px;right:0;z-index:5;min-width:132px;background:var(--raised);
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:2px}
/* O atributo `hidden` só esconde porque o padrão dele é `display:none` — QUALQUER
   `display` declarado ganha dele. Sem esta linha o menu nascia aberto e não
   fechava com nada, porque o `display:flex` acima vencia o `hidden`. */
.pop[hidden]{display:none}
.outro-campo[hidden]{display:none}
.pop-i{text-align:left;background:none;border:none;border-radius:7px;padding:7px 9px;
  font-size:12px;color:var(--txt-dim);cursor:pointer}
.pop-i:hover{background:var(--surface-2);color:var(--txt)}
.pop-i.risco{color:var(--risk-txt)}
.pop-i.risco:hover{background:var(--risk-soft)}
.outro-campo{margin-top:9px;width:100%}

/* ---------------------------------------------------------------- lixeira
   Ela precisa se ler como um lugar, não como uma lista cinza de arrependimento.
   O que faz isso sem gastar cor de status: o glifo desenhado (mesmo viewBox e
   mesma espessura do resto), a data da exclusão como carimbo mono, e os cards
   ADORMECIDOS — dessaturados e mais escuros que um projeto vivo, para que a
   diferença se leia à distância. Sem isso a lixeira parece a lista de projetos,
   e alguém restaura achando que está abrindo. */
.projs-h{position:relative}
.lixbtn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--font-num);font-size:9.5px;letter-spacing:.05em;color:var(--txt-faint);
  background:none;border:1px solid transparent;border-radius:999px;padding:4px 10px 4px 8px;min-height:28px}
.lixbtn .gl{width:14px;height:14px;flex:0 0 auto}
.lixbtn:hover{color:var(--txt-dim);border-color:var(--line);background:var(--surface-2)}
.lixbtn.tem{color:var(--txt-dim)}
.lixbtn .lixn{font-weight:700;color:var(--txt)}
.lixbtn .lixn.vaz{font-weight:400;color:var(--txt-faint)}
.vazio-proj{font-size:12.5px;color:var(--txt-dim);border:1px dashed var(--line);border-radius:12px;padding:14px}

.lix-in{max-width:900px;text-align:left}
.lix-h{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.lix-h-l{flex:1 1 340px;min-width:0}
.lix-h-l .ix{font-family:var(--font-num);font-size:9.5px;letter-spacing:.07em;color:var(--brand-txt)}
.lix-h-l h1{font-size:clamp(21px,3vw,27px);font-weight:600;letter-spacing:-.02em;margin:7px 0 9px}
.lix-h-l .hint{margin:0;max-width:62ch;text-align:left}
.lix-h-r{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}

.lix-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.lixc{display:flex;flex-direction:column;gap:5px;background:var(--bg-deep);
  border:1px dashed var(--line);border-radius:14px;padding:13px 14px;min-width:0;
  filter:saturate(.72);transition:filter .16s,border-color .16s}
.lixc:hover,.lixc:focus-within{filter:none;border-color:var(--accent-line);border-style:solid}
.lixc-top{display:flex;align-items:center;gap:7px;color:var(--txt-faint);margin-bottom:2px}
.lixc-top .gl{width:14px;height:14px;flex:0 0 auto}
.lixc-em{font-family:var(--font-num);font-size:9px;letter-spacing:.05em}
.lixc-t{font-size:13.5px;font-weight:650;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lixc-i{font-size:11.5px;color:var(--txt-dim);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.lixc-m{font-family:var(--font-num);font-size:9.5px;color:var(--txt-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lixc-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.lixc-acts .btn{font-size:11.5px;padding:6px 11px;min-height:30px}

.lix-vazia{display:flex;gap:14px;align-items:center;border:1px dashed var(--line);border-radius:14px;
  padding:24px;color:var(--txt-dim);font-size:12.8px;line-height:1.6}
.lix-vazia .gl{width:30px;height:30px;flex:0 0 auto;color:var(--txt-faint)}
@media (prefers-reduced-motion:reduce){ .lixc{transition:none} }

/* ------------------------------------------------ checklist de credenciais
   Uma linha por nó que pede credencial, porque a unidade de trabalho no editor
   do n8n é o nó — a lista por tipo obrigava a traduzir de cabeça. "JÁ USA" e
   "NÃO ACHEI" usam ok/warn como TEXTO (tokens `-txt`), que é o par calibrado
   para contraste; a cor de status continua reservada e aqui ela está dizendo
   exatamente o que sempre disse: está resolvido, ou falta você fazer. */
.crlist{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-deep)}
.cr-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;
  padding:10px 12px;border-bottom:1px solid var(--line-soft);align-items:start}
.cr-row:last-child{border-bottom:none}
.cr-no{font-size:12.5px;color:var(--txt);word-break:break-word}
.cr-ty{font-family:var(--font-num);font-size:10px;color:var(--txt-faint)}
.cr-ops{display:flex;flex-direction:column;gap:6px;min-width:0}
.cr-op{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:12px;min-width:0}
.cr-op code{font-family:var(--font-num);font-size:11px;color:var(--txt);word-break:break-all}
.cr-tag{font-family:var(--font-num);font-size:8.5px;letter-spacing:.06em;border-radius:5px;
  padding:2px 5px;flex:0 0 auto}
.cr-op.tem .cr-tag{color:var(--ok-txt);background:var(--ok-soft);border:1px solid var(--ok-soft)}
.cr-op.nao .cr-tag{color:var(--warn-txt);background:var(--warn-soft);border:1px solid var(--warn-soft)}
.cr-campos{font-size:11px;color:var(--txt-faint);flex-basis:100%}
.cr-nota{font-size:11px;color:var(--txt-faint)}
.cr-nomes{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;margin-top:2px}
.cr-nome{display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--txt);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface)}
.cr-usos{font-family:var(--font-num);font-size:9px;color:var(--txt-faint)}
.cr-lig{font-family:var(--font-num);font-size:9.5px;color:var(--ok-txt)}
.cr-pick{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:3px}
.cr-esc{font-size:11px;padding:4px 10px;min-height:26px}
/* A faixa que diz o que foi ligado no JSON. Fica ENTRE os botões e o `<pre>`,
   porque é o que muda o conteúdo do que o botão de copiar leva. */
.expbar{margin:11px 0 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.expbar .cx{display:flex;align-items:center;gap:8px;font-size:12.3px;color:var(--txt);cursor:pointer}
.expbar .cx input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.expsub{font-size:11.5px;color:var(--txt-dim);line-height:1.55;margin-top:6px}
@media (max-width:640px){ .cr-row{grid-template-columns:1fr} }

/* ------------------------------------------- conversa sobre um fluxo salvo
   A faixa do topo existe porque a tela mostra o DESENHO do fluxo, e ver o fluxo
   na tela é fácil de confundir com o fluxo já ter mudado. Ela repete que nada
   foi gravado até o clique — a mesma razão pela qual o painel de fluxos mantém
   "nada disto está no n8n ainda" na tela inteira do handoff. */
.edhd{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--txt);max-width:70ch}
.edhd .ix{font-family:var(--font-num);font-size:9.5px;letter-spacing:.06em;color:var(--accent-txt);margin-right:6px}
.edhd-sub{font-size:11.5px;color:var(--txt-dim);line-height:1.55;margin-top:5px}

.prop{border:1px solid var(--accent-line);background:var(--surface);border-radius:12px;padding:13px;max-width:70ch}
.prop .sh{font-family:var(--font-num);font-size:9.5px;letter-spacing:.06em;color:var(--txt-faint);margin-bottom:10px}
.prop .sh .ix{color:var(--accent-txt)}
.prop-resumo{font-size:13.5px;line-height:1.55;color:var(--txt);font-weight:600}
.prop-porque{font-size:12.3px;line-height:1.6;color:var(--txt-dim);margin-top:7px}
/* Apagar nó é a única coisa que este caminho faz e o de produção não faz. Ela é
   dita em amarelo e por extenso, com os nomes — nunca escondida dentro do diff. */
.prop-warn{margin-top:10px;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.55;
  background:var(--warn-soft);color:var(--warn-txt);border:1px solid var(--warn-soft)}
.prop-gates{margin-top:9px;font-family:var(--font-num);font-size:10px;color:var(--ok-txt)}

/* O diff mora num `<details>`: num fluxo de 65 nós ele empurraria o botão de
   aplicar para fora da tela, e um botão que exige rolagem é um botão clicado
   sem leitura. */
.ddet{margin-top:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg-deep)}
.ddet summary{cursor:pointer;padding:9px 12px;font-size:12px;color:var(--txt-dim)}
.ddet summary:hover{color:var(--txt)}
.ddet[open] summary{border-bottom:1px solid var(--line-soft)}
.dnode{border-bottom:1px solid var(--line-soft);padding:10px 12px}
.dnode:last-child{border-bottom:none}
.dnh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px}
.dty{font-family:var(--font-num);font-size:10px;color:var(--txt-faint)}
.dk{font-family:var(--font-num);font-size:8.5px;letter-spacing:.06em;border-radius:5px;padding:2px 5px;
  border:1px solid var(--line);color:var(--txt-faint)}
.dk.added{color:var(--ok-txt);border-color:var(--ok-soft);background:var(--ok-soft)}
.dk.modified{color:var(--accent-txt);border-color:var(--accent-soft);background:var(--accent-soft)}
.dk.removed{color:var(--risk-txt);border-color:var(--risk-soft);background:var(--risk-soft)}
.dlines{margin:0;overflow-x:auto;font-family:var(--font-num);font-size:11px;line-height:1.6}
.dl{display:block;white-space:pre;padding:0 4px;border-radius:3px}
.dl.add{color:var(--ok-txt);background:var(--ok-soft)}
.dl.del{color:var(--risk-txt);background:var(--risk-soft)}
.dl.ctx{color:var(--txt-faint)}
.dl.skip{color:var(--txt-faint);opacity:.6;font-style:italic}
.dedges{padding:10px 12px;font-family:var(--font-num);font-size:11px;line-height:1.6}

/* Cada linha é uma versão inteira guardada dentro do arquivo do projeto. É o que
   faz "↺ Desfazer" ser verificável em vez de uma promessa escrita num botão. */
.vrow{display:grid;grid-template-columns:26px 92px minmax(0,1fr);gap:9px;padding:9px 12px;
  border-bottom:1px solid var(--line-soft);font-size:12px;align-items:start}
.vrow:last-child{border-bottom:none}
.vrow .vn,.vrow .vt{font-family:var(--font-num);font-size:10px;color:var(--txt-faint);padding-top:2px}
.vrow .vd{color:var(--txt-dim);line-height:1.5;word-break:break-word}

.erro{border:1px solid var(--risk-soft);background:var(--risk-soft);color:var(--risk-txt);
  border-radius:10px;padding:11px 13px;font-size:12.3px;line-height:1.55;max-width:70ch}
.gatefail{border:1px solid var(--risk-soft);background:var(--surface);border-radius:12px;padding:12px 13px;max-width:70ch}
.gatefail li{font-size:12px;color:var(--txt-dim);line-height:1.6}

@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .side{border-top:1px solid var(--line-soft);order:2}
  .stream{order:1;border-right:none}
  .composer-wrap{border-right:none;order:3}
  .chip,.btn{min-height:40px}
}
@media (prefers-reduced-motion:reduce){
  /* `animation-delay` também: com fill `both`, um elemento atrasado fica preso
     no estado inicial (opacity 0) até o delay passar — zerar só a duração
     deixava os mockups escalonados invisíveis para quem pediu menos movimento. */
  *{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .nd{opacity:1}
  .edge{stroke-dashoffset:0}
}
</style>
</head>
<body>

<div class="appbar">
  <a class="mark" href="/">◈ COCKPIT</a>
  <!-- Volta para a abertura SEM matar a construção: a sessão mora no servidor
       e continua correndo; o card "em construção" na abertura é o caminho de
       volta. Escondido fora da corrida — na abertura não há para onde voltar. -->
  <button class="iconbtn" id="voltar" type="button" hidden aria-label="voltar para o início — a construção continua rodando">← início</button>
  <div class="tabs">
    <a class="tab" href="/">Fluxos</a>
    <a class="tab" href="/disco">Disco</a>
    <a class="tab on" href="/tester" aria-current="page">Tester</a>
  </div>
  <div class="right">
    <span id="cab"></span>
    <button class="iconbtn" id="tema" type="button" title="alternar tema">tema</button>
  </div>
</div>

<main id="app"></main>
<div class="foot" id="foot"><span>nada foi criado no n8n</span><span>·</span><span>nenhuma chamada feita</span></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   BLOCO DE JUÍZO — a única parte deste arquivo que DECIDE alguma coisa.
   O servidor emite fatos (etapa, portões, sandbox, simulação, custo). O que
   significa "pronto", "arriscado", "não posso afirmar" mora aqui.
   Espalhar isto pelas funções de render transforma cada ajuste numa caça ao if.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Estados de etapa e como cada um se lê. `pulada` NÃO é falha: pular a pesquisa
   porque não havia doc para ler é o caminho rápido funcionando. */
const ESTADO_TAG = {
  pendente: { tag: "",             ordem: 0 },
  espera:   { tag: "ESPERA VOCÊ",  ordem: 1 },
  correndo: { tag: "AGORA",        ordem: 1 },
  feita:    { tag: "✓",            ordem: 2 },
  pulada:   { tag: "PULADA",       ordem: 2 },
  vazia:    { tag: "SEM RESULTADO",ordem: 2 },
  falhou:   { tag: "FALHOU",       ordem: 3 }
};
/* Etapa que PARA e espera decisão. Só duas: confirmar a intenção antes de
   gastar, e o acordo sobre o resultado. Ver PLAN.md §4. */
const PARA_EM = new Set([1, 6]);

/* O rodapé é derivado do que aconteceu, nunca fixo. Um "nada foi criado no n8n"
   permanente vira mentira no instante em que a etapa 05 escreve a cópia — e
   seria esta feature cometendo exatamente o erro que o resto do cockpit gasta
   comentário evitando. */
function rodape(s) {
  const sb = s && s.sandbox;
  if (!sb || !sb.estado) return { classe: "", partes: ["nada foi criado no n8n", "nenhuma chamada feita"] };
  if (sb.estado === "desligado") return { classe: "", partes: ["nada foi criado no n8n", "a cópia de teste está desligada"] };
  if (sb.estado === "indeterminado") {
    // Escrita que falhou prova ausência de CONFIRMAÇÃO, não ausência de efeito.
    return { classe: "indeterminado", partes: ["não consegui confirmar se a cópia de teste foi criada", sb.motivo || ""] };
  }
  return { classe: "escreveu", partes: [
    "cópia de teste no n8n: " + (sb.nome || "?"), "inativa", "sem credenciais", "seu fluxo original intocado"
  ] };
}

/* O que a etapa 06 pode afirmar. Nunca "está funcionando": a simulação não
   chamou nada, não usou credencial e não viu limite de taxa. */
const SELO_FANTASMA =
  "Isto é uma simulação. Nada foi chamado, nenhuma credencial foi usada. O texto e o destino vêm do " +
  "seu fluxo; os dados dentro dele são de exemplo. Passar aqui não prova que o fluxo funciona — prova " +
  "que ele monta a mensagem certa com os campos que você apontou.";

const SELO_ENTREGA =
  "O JSON abaixo é exatamente o que foi testado na cópia de teste, com uma diferença: o nome, que na " +
  "cópia leva o prefixo [SANDBOX tester]. Ele não traz credenciais — depois de importar, escolha cada " +
  "credencial no editor do n8n.";

/* Recusar a simulação de um agente NÃO é o mesmo que recusar meio resultado, e o
   selo genérico manda o Kauan procurar um defeito de expressão que não existe.
   Aqui a recusa é estrutural e permanente: a resposta é escrita por um modelo na
   hora, e prever texto de modelo é a única coisa que este arquivo nunca vai
   fazer. O que sobra de conferível — canal, destinatário, número de bolhas — está
   no fluxo e nos portões, e a frase diz onde olhar. */
const SELO_RECUSA = {
  agente: "Isto não é uma limitação a contornar: prever o que um modelo vai dizer seria inventar o " +
          "resultado, e é exatamente o que o resto desta tela existe para não fazer. O que dá para " +
          "conferir sem executar está acima — as camadas, os portões e o JSON. O primeiro teste real " +
          "de um agente é a primeira conversa real.",
  "":     "Prefiro não desenhar meio resultado. Um quadro parcial apresentado como resultado é pior " +
          "que quadro nenhum — o fluxo e os portões continuam válidos, só a prévia não sai."
};

/* Cabeçalho da etapa 06. Um agente nunca vai ter prévia, então prometer "o que
   isto produziria" e entregar recusa é a tela contradizendo a si mesma. */
const TITULO_FANTASMA = f =>
  (f && f.classe === "agente") ? "[ 06 ] POR QUE NÃO HÁ PRÉVIA" : "[ 06 ] O QUE ISTO PRODUZIRIA";

/* Rótulo da origem de cada nó. `memoria` é a confissão de que ninguém confirmou. */
const ORIGEM_TXT = {
  instancia: n => "vem dos seus fluxos" + (n.nota ? " (" + n.nota + ")" : ""),
  web:       n => "veio da doc pesquisada" + (n.nota ? " de " + n.nota : ""),
  catalogo:  () => "veio do catálogo de nós",
  memoria:   () => "NINGUÉM CONFIRMOU — memória do modelo, confira este nó"
};

const NIVEIS = ["nunca mexi", "sei o básico", "sou técnico"];
const EXEMPLOS = [
  "avisar no Slack quando cair pedido novo",
  "todo dia às 9h, resumo das tarefas abertas do ClickUp no Slack",
  "quando entrar lead no Supabase, mandar mensagem no WhatsApp",
  // O quarto exemplo é de agente de propósito: sem ele nada na tela indica que
  // o Tester sabe construir um, e a entrevista de agente é a metade da feature
  // que ninguém descobre por acidente.
  "um agente que responde os leads no WhatsApp e tira dúvida sobre os eventos"
];

/* ════════════════════════════════════ fim do bloco de juízo ═══════════════ */

const $ = sel => document.querySelector(sel);
const app = $("#app"), foot = $("#foot");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Toda chamada passa por aqui. NUNCA `res.json()` direto: `JSON.parse("404")`
   é um número válido, então um 404 em texto puro vira um corpo "parseável" e a
   tela mostra um erro que não é o erro. Este bug já custou uma sessão inteira
   neste codebase — está documentado no CLAUDE.md. */
async function callApi(url, opts) {
  let res;
  try { res = await fetch(url, opts); }
  catch (e) { throw new Error("o cockpit não respondeu — ele está rodando? (" + (e && e.message) + ")"); }
  const txt = await res.text();
  let body = null;
  try { body = JSON.parse(txt); } catch { /* não é JSON */ }
  if (res.status === 404 && (body === null || typeof body !== "object")) {
    throw new Error("esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js. Reinicie o cockpit.");
  }
  if (!body || typeof body !== "object" || Array.isArray(body) && !res.ok) {
    if (!res.ok) throw new Error("o servidor respondeu " + res.status);
  }
  if (!res.ok) throw new Error((body && body.error) || ("o servidor respondeu " + res.status));
  return body;
}

/* Torna clicável um elemento que não é <button>, sem perder o layout. */
function clicavel(el, rotulo, fn) {
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  if (rotulo) el.setAttribute("aria-label", rotulo);
  el.style.cursor = "pointer";
  el.addEventListener("click", fn);
  el.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(ev); } });
  return el;
}

const S = { snap: null, es: null, nivel: "sei o básico", enviando: false, desenhado: null, capab: null, projetos: [],
  andamento: null, pollTimer: null,   // a construção viva vista da abertura + o poll que a atualiza
  // escolhas de chip, por TEXTO da pergunta; sobrevivem ao repaint do SSE
  respostas: {},
  // pan/zoom do grafo e assinatura do fantasma: sem eles cada evento do SSE
  // resetaria a câmera e re-animaria a chegada da mensagem
  cam: null, fantasmaVisto: null };

/* ---------------------------------------------------------------- abertura */

function telaAbertura(aviso) {
  app.innerHTML =
    '<section class="stage-open"><div class="open-in">' +
      '<h1>O que vamos construir?</h1>' +
      '<p class="hint">Escreve do seu jeito. Não precisa saber n8n — eu pergunto o que faltar.</p>' +
      '<div class="bigbox">' +
        '<textarea id="ideia" rows="2" placeholder="quero ver quantas vendas eu fiz no mercado livre" aria-label="descreva o fluxo que você quer"></textarea>' +
        '<div class="boxfoot">' +
          '<span class="lvl">SEU NÍVEL</span>' +
          NIVEIS.map(n => '<button type="button" class="chip' + (n === S.nivel ? " on" : "") + '" data-nivel="' + esc(n) + '" aria-pressed="' + (n === S.nivel) + '">' + esc(n) + '</button>').join("") +
          '<button type="button" class="btn prime go" id="comecar">Começar →</button>' +
        '</div>' +
      '</div>' +
      '<div class="egs">' + EXEMPLOS.map(e => '<button type="button" class="eg">' + esc(e) + '</button>').join("") + '</div>' +
      (aviso ? '<div class="avisobar">' + esc(aviso) + '</div>' : "") +
      cardsProjetos() +
    '</div></section>';

  const ta = $("#ideia");
  ta.focus();
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 220) + "px"; });
  ta.addEventListener("keydown", ev => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) comecar(); });
  app.querySelectorAll("[data-nivel]").forEach(b => b.addEventListener("click", () => {
    S.nivel = b.dataset.nivel;
    app.querySelectorAll("[data-nivel]").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); });
  }));
  app.querySelectorAll(".eg").forEach(b => b.addEventListener("click", () => { ta.value = b.textContent; ta.focus(); }));
  const vl = $("#ver-lixeira");
  if (vl) vl.addEventListener("click", telaLixeira);
  ligarEventosProjetos();
  pollAbertura();
  $("#comecar").addEventListener("click", comecar);
  pintarRodape(null);
  $("#cab").textContent = "";
  $("#voltar").hidden = true;
}

/* Os eventos do bloco de projetos, separados da tela: o poll da abertura troca
   o bloco inteiro quando o estado da construção muda, e precisa religar isto
   sem repintar a página — repintar comeria o que está digitado na ideia. */
function ligarEventosProjetos() {
  // O card fantasma volta para a corrida — mesmo ligar(id) de sempre, então o
  // SSE e o ?s= na URL continuam valendo.
  app.querySelectorAll(".proj.ghost").forEach(g =>
    clicavel(g, "voltar para a construção em andamento", () => ligar(g.dataset.sessao)));

  app.querySelectorAll(".proj").forEach(card => {
    const slug = card.dataset.slug;
    if (!slug) return;                            // o fantasma não tem menu nem slug
    const abrir = async () => {
      try { telaProjeto(await callApi("/api/tester/projeto/" + encodeURIComponent(slug))); }
      catch (e) { avisoAbertura(e.message); }
    };
    clicavel(card, "abrir projeto", ev => { if (!ev.target.closest(".proj-menu")) abrir(); });

    const dots = card.querySelector(".dots"), pop = card.querySelector(".pop");
    dots.addEventListener("click", ev => {
      ev.stopPropagation();
      const abrindo = pop.hasAttribute("hidden");
      // Um menu aberto por vez: dois abertos viram dois alvos para o mesmo Esc.
      app.querySelectorAll(".pop").forEach(x => x.setAttribute("hidden", ""));
      app.querySelectorAll(".dots").forEach(x => x.setAttribute("aria-expanded", "false"));
      if (abrindo) { pop.removeAttribute("hidden"); dots.setAttribute("aria-expanded", "true"); }
    });

    pop.querySelectorAll(".pop-i").forEach(item => item.addEventListener("click", async ev => {
      ev.stopPropagation();
      pop.setAttribute("hidden", "");
      dots.setAttribute("aria-expanded", "false");

      if (item.dataset.acao === "renomear") {
        // `.pt-edit`, nunca `.campo`: `.campo` é `flex: 1 1 220px`, e o card é
        // uma COLUNA flex — ali o basis vira ALTURA, e o campo abria o card com
        // 220px de vão. Este entra no lugar exato do título, do tamanho dele.
        const titulo = card.querySelector(".pt");
        const antes = titulo.textContent;
        const campo = document.createElement("input");
        campo.className = "pt-edit"; campo.value = antes; campo.maxLength = 120;
        campo.setAttribute("aria-label", "novo nome do projeto");
        titulo.replaceWith(campo);
        campo.focus(); campo.select();
        const salvar = async () => {
          const novo = campo.value.trim();
          if (!novo || novo === antes) { await inicio(); return; }
          try { await callApi("/api/tester/projeto/" + encodeURIComponent(slug) + "/renomear", corpo({ titulo: novo })); }
          catch (e) { avisoAbertura(e.message); }
          await inicio();
        };
        campo.addEventListener("keydown", e2 => {
          if (e2.key === "Enter") { e2.preventDefault(); salvar(); }
          if (e2.key === "Escape") inicio();
        });
        campo.addEventListener("blur", salvar);
        return;
      }

      /* Excluir MOVE para a lixeira. Continua pedindo confirmação — o card sai
         da tela e isso precisa ser uma decisão —, mas o texto não pode assustar
         com um dano que não vai acontecer: nada é apagado aqui. O alarme
         vermelho fica guardado para o "apagar de vez", que é onde ele é verdade. */
      const nome = card.querySelector(".pt").textContent;
      const ok = await confirmar({
        tag: "LIXEIRA", perigo: false, botao: "Mandar para a lixeira",
        titulo: "Mandar «" + nome + "» para a lixeira?",
        corpo: [
          "Ele sai da lista, mas não é apagado: fica na lixeira até você decidir. De lá dá para restaurar a qualquer momento.",
          "Nada é tocado no n8n. Se você já importou este fluxo lá, ele continua lá."
        ]
      });
      if (!ok) return;
      try { await callApi("/api/tester/projeto/" + encodeURIComponent(slug), { method: "DELETE" }); }
      catch (e) { avisoAbertura(e.message); }
      await inicio();
    }));
  });
}

/* Enquanto a abertura está na tela e existe (ou pode surgir) uma construção,
   o status é relido a cada 4s e SÓ o bloco de projetos é trocado — nunca a
   página, que tem um textarea com texto vivo. É o que mantém a porcentagem do
   card fantasma andando e o faz sumir sozinho quando a construção termina. */
function pollAbertura() {
  clearInterval(S.pollTimer);
  S.pollTimer = setInterval(async () => {
    const abertura = app.querySelector(".stage-open");
    if (!abertura) { clearInterval(S.pollTimer); return; }
    let st;
    try { st = await callApi("/api/tester/status"); } catch { return; }
    S.capab = st;
    const antes = JSON.stringify(S.andamento || null);
    S.andamento = st.andamento || null;
    if (antes === JSON.stringify(S.andamento)) return;
    // A construção acabou de sumir do status: ela terminou (ou falhou), e pode
    // ter virado um projeto salvo — a lista precisa ser relida junto.
    if (!S.andamento) await carregarProjetos();
    const bloco = abertura.querySelector(".projs");
    const novo = document.createElement("div");
    novo.innerHTML = cardsProjetos();
    const conteudo = novo.firstElementChild;
    if (bloco && conteudo) bloco.replaceWith(conteudo);
    else if (!bloco && conteudo) abertura.querySelector(".open-in").appendChild(conteudo);
    else if (bloco && !conteudo) bloco.remove();
    const vl = $("#ver-lixeira");
    if (vl) vl.addEventListener("click", telaLixeira);
    ligarEventosProjetos();
  }, 4000);
}

async function comecar() {
  const ideia = $("#ideia").value.trim();
  if (!ideia) { $("#ideia").focus(); return; }
  const btn = $("#comecar");
  btn.disabled = true; btn.textContent = "abrindo…";
  try {
    const r = await callApi("/api/tester/session", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ ideia, nivel: S.nivel })
    });
    ligar(r.id);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Começar →";
    const av = document.createElement("div");
    av.className = "avisobar"; av.textContent = e.message;
    $(".open-in").appendChild(av);
  }
}

/* ------------------------------------------------------------------- SSE */

/* `?static=1` congela a tela numa leitura só. O SSE mantém a conexão aberta
   para sempre, o que trava captura headless e qualquer embed simples — a mesma
   razão pela qual o flows.html já tem esta flag. */
const ESTATICO = new URLSearchParams(location.search).get("static") === "1";

function ligar(id) {
  if (S.es) { S.es.close(); S.es = null; }
  clearInterval(S.pollTimer);                     // a corrida tem SSE; o poll é da abertura
  if (ESTATICO) return;
  // A sessão vai para a URL. Uma construção leva minutos, e sem isto um F5 —
  // ou um clique no link errado — perdia a corrida inteira: ela continua viva
  // no servidor e a tela não tinha como voltar para ela.
  if (!ESTATICO && new URLSearchParams(location.search).get("s") !== id) {
    history.replaceState(null, "", "/tester?s=" + encodeURIComponent(id));
  }
  const es = new EventSource("/api/tester/session/" + encodeURIComponent(id) + "/stream");
  S.es = es;
  // O snapshot inteiro vem primeiro e vem de novo a cada reconexão, então o
  // cliente nunca depende de ter visto os deltas anteriores.
  es.addEventListener("snapshot", ev => { S.snap = JSON.parse(ev.data); pintar(); });
  for (const t of ["etapa", "entendi", "espera", "gates", "wf", "wfParcial", "sandbox", "fantasma", "custo", "ingredientes", "doc", "chat", "proposta", "fim", "log"]) {
    es.addEventListener(t, () => refrescar(id));
  }
  es.addEventListener("atividade", ev => {
    const d = JSON.parse(ev.data);
    if (S.snap) S.snap.atividade = d.atividade;
    const b = $("#atividade"); if (b) b.textContent = d.atividade || "";
  });
  es.onerror = () => { /* o browser reconecta sozinho; o snapshot reconstrói */ };
}

let refrescando = false;
async function refrescar(id) {
  if (refrescando) return;
  refrescando = true;
  try { S.snap = await callApi("/api/tester/session/" + encodeURIComponent(id)); pintar(); }
  catch { /* o SSE traz o próximo */ }
  finally { refrescando = false; }
}

/* -------------------------------------------------------------- a corrida */

function pintar() {
  const s = S.snap;
  if (!s) return;
  const antes = app.querySelector(".stream");
  const scroll = antes ? antes.scrollTop : 0;
  const noFim = antes ? (antes.scrollHeight - antes.scrollTop - antes.clientHeight < 80) : true;
  const digitado = capturarInputs();

  app.innerHTML =
    '<div class="split">' +
      '<div class="stream" id="stream">' + blocosStream(s) + '</div>' +
      '<aside class="side">' + ladoDireito(s) + '</aside>' +
    '</div>' +
    (s.status === "pronta" ? "" : '<div class="composer-wrap">' + composer(s) + '</div>');

  ligarEventos(s);
  desenharSeNovo(s);
  restaurarInputs(digitado);

  const st = $("#stream");
  if (st) st.scrollTop = noFim ? st.scrollHeight : scroll;
  pintarRodape(s);
  $("#cab").textContent = (s.ideia || "").slice(0, 44) + (s.ideia && s.ideia.length > 44 ? "…" : "") + " · " + s.nivel;
  $("#voltar").hidden = false;
}

/* O SSE repinta a tela inteira a cada evento — e uma construção emite eventos o
 * tempo todo. Sem isto, o que estava sendo DIGITADO no composer, no "Outro…" ou
 * no título do projeto sumia no meio da frase, junto com o foco. O texto de quem
 * usa nunca é descartável. */
function capturarInputs() {
  const foco = document.activeElement;
  const out = [];
  const ta = $("#resposta");
  if (ta && (ta.value || foco === ta)) out.push({ tipo: "resposta", v: ta.value, foco: foco === ta, a: ta.selectionStart, b: ta.selectionEnd });
  const ti = $("#titulo");
  if (ti && (foco === ti || ti.value !== ti.defaultValue)) out.push({ tipo: "titulo", v: ti.value, foco: foco === ti, a: ti.selectionStart, b: ti.selectionEnd });
  app.querySelectorAll(".outro-campo").forEach(c => {
    if (foco !== c) return;                       // valor já sobrevive via S.respostas
    const q = c.closest(".q");
    if (q) out.push({ tipo: "outro", q: q.dataset.q, v: c.value, foco: true, a: c.selectionStart, b: c.selectionEnd });
  });
  return out;
}
function restaurarInputs(lista) {
  for (const it of lista) {
    let el = null;
    if (it.tipo === "resposta") el = $("#resposta");
    else if (it.tipo === "titulo") el = $("#titulo");
    else {
      const q = [...app.querySelectorAll(".q")].find(x => x.dataset.q === it.q);
      el = q && q.querySelector(".outro-campo");
      if (el) el.removeAttribute("hidden");
    }
    if (!el) continue;
    el.value = it.v;
    if (it.foco) { el.focus(); try { el.setSelectionRange(it.a, it.b); } catch { /* textarea vs input */ } }
  }
}

/* A conversa como blocos de tela. Compartilhada entre a corrida e o projeto
   guardado — reabrir um projeto mostra a MESMA conversa que aconteceu, não um
   resumo dela. */
/* `dono` é a sessão ou o projeto salvo — os dois carregam `ehAgente`, e o cartão
   precisa dele para dizer que classificação foi feita. Um projeto salvo antes
   desta feature não tem o campo, e aí o cartão simplesmente não diz nada, que é
   melhor que afirmar "automação" sobre algo que nunca foi classificado. */
function blocosConversa(chat, dono) {
  return (chat || []).map(m => {
    if (m.quem === "voce") return '<div class="msg me"><div class="who">VOCÊ</div><div class="body">' + esc(m.texto) + "</div></div>";
    if (m.entendi) return cartaoEntendi(m.entendi, dono);
    /* Fala do Tester em texto. Numa construção isto nunca acontece — lá a fala
       dele É o cartão de entendimento, e `texto` vem nulo. Numa conversa sobre
       um fluxo salvo é o caso comum: a resposta a uma dúvida é uma frase, e sem
       esta linha ela era descartada e a pergunta ficava sem resposta na tela. */
    if (m.texto) return '<div class="msg sys"><div class="who">TESTER</div><div class="body">' + esc(m.texto) + "</div></div>";
    return "";
  }).join("");
}

function blocosStream(s) {
  // Conversa sobre um fluxo que já existe é outra tela: não tem entrevista, não
  // tem portão de sete etapas e não entrega JSON no fim — entrega um remendo
  // para você aprovar ou descartar.
  if (s.modo === "edicao") return blocosEdicao(s);

  const out = [];
  out.push(blocosConversa(s.chat, s));

  if (s.status === "correndo" && s.etapa === 1) out.push(faixaProc(s));

  for (const q of s.perguntas || []) out.push(pergunta(q));

  if (s.etapa === 1 && s.status === "aguardando") {
    if ((s.perguntas || []).length) {
      // Entrevista em aberto: responder alimenta a rodada seguinte; pular é
      // permitido, mas dito com o preço — o que ficar aberto vira suposição.
      out.push(acoesEntrevista(s));
    } else {
      out.push(portao(
        ((s.respostas || []).length ? "Entrevista completa — tenho o que preciso. " : "") +
        "Confere? Se estiver certo eu já sigo sozinho até o resultado.",
        "Daqui pra frente são cinco passos seguidos: pesquisar (se precisar), listar o que você precisa, " +
        "desenhar o fluxo, validar e simular. Só volto a te perguntar no final.",
        "É isso, pode seguir", s.custoTotal));
    }
  }

  // O desenho aparece assim que a sessão de construção ESCREVE o arquivo —
  // rascunho ainda sem validação — e é substituído pelo documento validado.
  if (s.wf || s.wfParcial) out.push(canvas(s));

  if (s.gates && !s.gates.passou) {
    out.push('<div class="gatefail"><div style="font-size:12.5px;font-weight:600;margin-bottom:7px">O validador reprovou a proposta</div><ul style="margin:0;padding-left:18px">' +
      s.gates.falhas.map(f => "<li>" + esc(f) + "</li>").join("") + "</ul></div>");
  }

  if (s.fantasma) out.push(fantasmaBloco(s));

  if (s.etapa === 6 && s.status === "aguardando") {
    out.push(portao("É isso que você queria ver?",
      "Se sim, eu fecho e te entrego o JSON pra importar no n8n. Se não, escreve embaixo o que mudar — " +
      "eu recomeço do ponto que interessa.", "É isso, pode fechar", s.custoTotal));
  }

  /* A checklist vem ANTES da entrega, não depois: ela é o que ele vai executar
     assim que colar o JSON no n8n, e um bloco de trabalho embaixo de um `<pre>`
     de 400 linhas é um bloco que ninguém encontra. */
  if (s.status === "pronta" && s.wf) out.push(checklistCred(s, true), entrega(s));

  if (s.status === "correndo" && s.etapa > 1) out.push(faixaProc(s));

  if (s.erro) out.push('<div class="erro"><strong>Parou aqui.</strong><br>' + esc(s.erro) + "</div>");
  return out.join("");
}

/* A faixa que diz onde a esteira está. A linha de cima é a ETAPA, que é o que
   responde "quanto falta"; a de baixo é o detalhe do segundo, que muda rápido
   demais para ser a informação principal.
   O total sai de `s.etapas`, nunca de um `07` escrito à mão: a conversa sobre um
   fluxo salvo tem cinco passos, e um "03 / 07" ali seria um contador prometendo
   duas etapas que não existem. */
function faixaProc(s) {
  const e = (s.etapas || []).find(x => x.n === s.etapa) || {};
  const total = (s.etapas || []).length || 7;
  const titulo = s.modo === "edicao"
    ? (e.nome ? "Trabalhando no seu pedido — " + e.nome : "Trabalhando no seu pedido…")
    : s.etapa === 1
      ? (s.entendi ? "Digerindo o que você respondeu…" : "Lendo a sua ideia…")
      : "Processando a próxima etapa — " + (e.nome || "");
  return '<div class="proc" role="status" aria-live="polite">' +
    '<span class="spin" aria-hidden="true"></span>' +
    '<span class="col"><span class="t1">' + esc(titulo) + "</span>" +
    '<span class="t2" id="atividade">' + esc(s.atividade || "começando…") + "</span></span>" +
    '<span class="passo">' + String(s.etapa).padStart(2, "0") + " / " + String(total).padStart(2, "0") + "</span></div>";
}

/* ----------------------------------------------- conversa sobre um fluxo salvo
 *
 * Três coisas podem sair de um pedido, e a tela tem que distinguir as três:
 * uma FRASE (era dúvida, nada mudou), um REMENDO esperando decisão, ou um erro.
 * O fluxo salvo não muda em nenhuma delas até o clique em aplicar — e a faixa
 * do topo diz isso o tempo todo, porque a tela mostra o desenho do fluxo e
 * "estou vendo o fluxo" é fácil de confundir com "o fluxo já mudou". */
function blocosEdicao(s) {
  const out = [];
  const nos = (s.wf && s.wf.nodes || []).length;
  out.push('<div class="edhd"><span class="ix">[ CONVERSA SOBRE O FLUXO ]</span> ' +
    esc(s.projetoTitulo || s.titulo || "projeto salvo") + " · " + nos + " nós" +
    '<div class="edhd-sub">Pergunte, peça mudança, peça coisa nova ou peça para tirar. ' +
    "Nada é gravado enquanto você não aprovar o remendo.</div></div>");

  out.push(blocosConversa(s.chat, s));

  if (s.status === "correndo") out.push(faixaProc(s));

  if (s.wf) out.push(canvas(s));

  if (s.gatesProposta && !s.gatesProposta.passou && !s.proposta) {
    out.push('<div class="gatefail"><div style="font-size:12.5px;font-weight:600;margin-bottom:7px">' +
      "O validador reprovou este remendo — vou tentar de novo</div><ul style=\"margin:0;padding-left:18px\">" +
      s.gatesProposta.falhas.map(f => "<li>" + esc(f) + "</li>").join("") + "</ul></div>");
  }

  if (s.proposta) out.push(propostaBloco(s));
  else if (s.fantasma) out.push(fantasmaBloco(s));

  /* Um remendo que acrescenta nó acrescenta credencial junto, e ela não aparece
     em lugar nenhum do diff — o patch tem `credentials` proibido justamente por
     isso. A checklist é o único lugar onde esse custo fica visível. */
  if (!s.proposta && s.wf) out.push(checklistCred(s, true));

  if (s.erro) out.push('<div class="erro"><strong>Parou aqui.</strong><br>' + esc(s.erro) + "</div>");
  return out.join("");
}

/* O remendo, antes de ser remendo. Resumo em português primeiro, porque é o que
   decide o clique; o diff embaixo é a prova, e vive num `<details>` para não
   empurrar o botão para fora da tela num fluxo grande. */
function propostaBloco(s) {
  const p = s.proposta;
  const d = p.diff || { nodes: [], connections: { added: [], removed: [] }, summary: {} };
  const sm = d.summary || {};
  const conta = [
    sm.added ? sm.added + " nó(s) novo(s)" : "",
    sm.modified ? sm.modified + " alterado(s)" : "",
    sm.removed ? sm.removed + " removido(s)" : "",
    sm.edgesAdded ? sm.edgesAdded + " ligação(ões) nova(s)" : "",
    sm.edgesRemoved ? sm.edgesRemoved + " ligação(ões) desfeita(s)" : ""
  ].filter(Boolean).join(" · ") || "nenhuma diferença medida";

  return '<div class="prop"><div class="sh"><span class="ix">[ REMENDO PROPOSTO ]</span> ' + esc(conta) + "</div>" +
    '<div class="prop-resumo">' + esc(p.resumo) + "</div>" +
    (p.porque ? '<div class="prop-porque">' + esc(p.porque) + "</div>" : "") +
    (p.removidos && p.removidos.length
      ? '<div class="prop-warn">Isto APAGA ' + p.removidos.length + " nó(s): " +
        esc(p.removidos.join(", ")) + ". A versão anterior fica guardada e o desfazer traz ela de volta.</div>"
      : "") +
    '<div class="prop-gates">✓ passou nos portões na rodada ' + (p.rodada || 1) +
      " · a cópia de teste no n8n só roda quando você aplicar</div>" +
    diffBloco(d) +
    (p.fantasma ? fantasmaBloco({ fantasma: p.fantasma, sementesOrigem: s.sementesOrigem }) : "") +
    '<div class="acoes"><button type="button" class="btn prime" id="aplicar">✓ Aplicar e salvar</button>' +
    '<button type="button" class="btn" id="descartar">Descartar este remendo</button>' +
    '<span class="cost">O FLUXO SALVO SÓ MUDA NO CLIQUE</span></div></div>';
}

function diffBloco(d) {
  const nos = (d.nodes || []).map(n => {
    const rot = { added: "NOVO", modified: "ALTERADO", removed: "REMOVIDO" }[n.kind] || "";
    return '<div class="dnode"><div class="dnh"><span class="dk ' + esc(n.kind) + '">' + rot + "</span>" +
      "<strong>" + esc(n.name) + "</strong><span class=\"dty\">" + esc(String(n.type).replace("n8n-nodes-base.", "")) + "</span></div>" +
      '<pre class="dlines">' + (n.lines || []).map(l =>
        '<span class="dl ' + (l.t === "+" ? "add" : l.t === "-" ? "del" : l.t === "~" ? "skip" : "ctx") + '">' +
        esc(l.t === "~" ? "  ⋯ " + l.s : l.t + " " + l.s) + "</span>").join("\n") + "</pre></div>";
  }).join("");

  const arestas = [
    ...(d.connections && d.connections.added || []).map(e => '<div class="dl add">+ ' + esc(e) + "</div>"),
    ...(d.connections && d.connections.removed || []).map(e => '<div class="dl del">- ' + esc(e) + "</div>")
  ].join("");

  if (!nos && !arestas) return '<div class="empty">o diff saiu vazio — isso não deveria acontecer com um remendo aprovado</div>';
  return "<details class=\"ddet\"><summary>Ver o diff, nó por nó</summary>" +
    nos + (arestas ? '<div class="dedges"><div class="dnh"><strong>ligações</strong></div>' + arestas + "</div>" : "") +
    "</details>";
}

/* Cada linha tem TRÊS estados, e a distância entre o segundo e o terceiro é a
   distância entre "ainda vou te perguntar" e "já decidi sem você":
     preenchido        — o que você disse;
     em aberto         — a entrevista continua, a pergunta ainda vem;
     suposição em vigor — ninguém mais vai perguntar e a construção segue com um
                          padrão, seja porque o modelo declarou a suposição
                          (prefixo "suposição:") ou porque a entrevista fechou
                          com o campo vazio.
   Enquanto os dois últimos diziam a mesma frase, o cartão cobrava resposta com a
   etapa 04 já desenhando — pedindo algo que não tinha mais onde ser respondido. */
function cartaoEntendi(e, dono) {
  const fechada = !!(dono && !(dono.perguntas || []).length && (dono.etapa || 1) > 1);
  const linha = (k, v) => {
    const t = String(v == null ? "" : v).trim();
    const sup = /^suposi[çc][ãa]o\s*:/i.test(t);
    const vazio = !t || /^n[ãa]o disse$/i.test(t);
    if (!sup && !vazio) return '<div class="row"><div class="k">' + esc(k) + '</div><div class="v">' + esc(t) + "</div></div>";
    if (vazio && !fechada) {
      return '<div class="row"><div class="k">' + esc(k) + '</div><div class="v miss">você ainda não disse</div></div>';
    }
    const txt = sup ? t.replace(/^suposi[çc][ãa]o\s*:\s*/i, "") : "vou usar o padrão mais comum e deixar marcado no fluxo";
    return '<div class="row"><div class="k">' + esc(k) + '</div><div class="v sup">' +
      '<span class="tagsup">SUPOSIÇÃO</span>' + esc(txt) + "</div></div>";
  };
  /* Só quando é agente. Dizer "automação" no cartão de todo fluxo normal seria
     ruído — a classificação só é notícia quando ela muda o que vem a seguir, e é
     isso que a segunda linha explica: a entrevista vai ser mais longa de
     propósito, e não porque travou. */
  const agente = dono && dono.ehAgente === true
    ? '<div class="row"><div class="k">tipo</div><div class="v">agente conversacional — vou perguntar mais que o normal ' +
      '(buffer, mídia, voz, memória, tools, escalonamento) porque cada uma dessas respostas muda os nós do fluxo</div></div>'
    : "";
  /* Uma suposição em vigor é uma decisão de construção tomada sem confirmação:
     o rodapé existe para dizer que ela ainda dá para desfazer, e como. Sem ele o
     cartão marca o campo de amarelo e não oferece saída nenhuma. */
