<style>
/* ==========================================================================
   PREVIEW ISOLADO. Nada aqui está no cockpit ainda.
   O objetivo é uma decisão visual: o palco deixa de ser retângulo com texto e
   passa a falar o mesmo vocabulário do editor do n8n — nó quadrado com ícone,
   rótulo embaixo, portas, curva com seta, e as sticky notes ao fundo dando o
   nome da seção. Os tokens são os MESMOS do flows.html, copiados sem alteração,
   porque a decisão precisa ser tomada sobre as cores reais do painel.
   ========================================================================== */
:root {
  --bg: #06060B; --bg-deep: #040408; --surface: #0E0F1A; --surface-2: #14162454; --raised: #171A2B;
  --line: rgba(255,255,255,.09); --line-soft: rgba(255,255,255,.05);
  --grid: rgba(255,255,255,.028); --grid-bold: rgba(255,255,255,.055);
  --txt: #E9EBF5; --txt-dim: #AAAFC2; --txt-faint: #777D92;
  --accent: #5865F5; --accent-soft: #5865F51f; --accent-line: #5865F55c; --brand: #FF5A1F;
  --ok: #2FD48F; --warn: #F5A524; --risk: #FF4F5E; --cold: #59617D;
  --ok-soft: #2FD48F1a; --warn-soft: #F5A5241a; --risk-soft: #FF4F5E1a; --cold-soft: #59617D1a;
  --ok-txt: #2FD48F; --warn-txt: #F5A524; --risk-txt: #FF4F5E; --cold-txt: #798096;
  --accent-txt: #606CF5; --brand-txt: #FF5A1F;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);
  --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  --font-num: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, monospace;
  --r: 12px;

  /* ---------------------------------------------------------------- NOVOS
     A cor do ícone é do serviço, não do estado. Elas convivem com os tokens de
     status porque nunca ocupam o mesmo lugar: estado mora na BORDA do nó, no
     badge e na linha; identidade mora no glifo, 22px, dentro da caixa. */
  --node-face:   #1B1D2E;
  --node-edge:   rgba(255,255,255,.14);
  --node-label:  var(--txt);
  --port:        #6E7590;
  --wire:        #6A7089;
}
:root[data-theme="light"] {
  --bg: #FAFAF9; --bg-deep: #F4F4F2; --surface: #FFFFFF; --surface-2: #00000005; --raised: #FFFFFF;
  --line: rgba(10,10,20,.11); --line-soft: rgba(10,10,20,.06);
  --grid: rgba(10,10,20,.045); --grid-bold: rgba(10,10,20,.08);
  --txt: #14151C; --txt-dim: #3F424D; --txt-faint: #666973;
  --accent: #3B48E0; --accent-soft: #3B48E014; --accent-line: #3B48E055;
  --ok: #0E9F6E; --warn: #B7791F; --risk: #DC2B3A; --cold: #8B90A0;
  --ok-soft: #0E9F6E14; --warn-soft: #B7791F14; --risk-soft: #DC2B3A14; --cold-soft: #8B90A014;
  --ok-txt: #0B8159; --warn-txt: #9A661A; --risk-txt: #D02937; --cold-txt: #6D717E;
  --accent-txt: #3B48E0; --brand-txt: #D04919;
  --node-face: #FFFFFF; --node-edge: rgba(10,10,20,.16); --node-label: #14151C;
  --port: #9AA0B4; --wire: #A8AEC0;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 15px;
  display: grid; grid-template-rows: auto 1fr auto; height: 100vh; -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------------ chrome */
.bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.bar .idx { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .16em; color: var(--brand-txt); }
.bar h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.bar .sub { font-family: var(--font-num); font-size: 11px; color: var(--txt-faint); }
.bar .spacer { flex: 1; }
.btn {
  font-family: inherit; font-size: 12.5px; color: var(--txt); cursor: pointer;
  padding: 7px 12px; border-radius: 9px; min-height: 34px;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--txt) 4%, var(--raised)), var(--raised)) padding-box,
    linear-gradient(180deg, color-mix(in srgb, var(--txt) 14%, transparent), var(--line)) border-box;
  border: 1px solid transparent;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--txt) 7%, transparent), 0 1px 2px rgba(0,0,0,.18);
  transition: background .16s, box-shadow .18s, transform .09s;
}
.btn:hover {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--raised)), var(--raised)) padding-box,
    linear-gradient(180deg, var(--accent-line), var(--line)) border-box;
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.on { background: var(--accent-soft) padding-box, linear-gradient(180deg, var(--accent-line), var(--line)) border-box; color: var(--accent-txt); }

/* ------------------------------------------------------------------- palco */
.stage {
  position: relative; overflow: hidden; background: var(--bg-deep);
  /* Malha de pontos do editor do n8n. Fixa em coordenadas de tela: seguir o
     zoom faria o fundo pulsar em cada animação de câmera. */
  background-image: radial-gradient(circle at 1px 1px, var(--grid-bold) 1px, transparent 0);
  background-size: 22px 22px;
  cursor: grab;
}
.stage.drag { cursor: grabbing; }
#svg { display: block; width: 100%; height: 100%; }
.corner {
  position: absolute; top: 12px; left: 14px; z-index: 2;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .12em; color: var(--txt-dim);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line-soft); border-radius: 6px; padding: 3px 8px;
}
.corner.br { top: auto; left: auto; bottom: 12px; right: 14px; }

/* ------------------------------------------------------------------- sticky
   A sticky note do n8n é conteúdo do fluxo: é onde está escrito o nome da
   etapa. Ela entra ATRÁS de tudo e continua fora do bounding box da câmera —
   a regra do cockpit (`isAnnotation`) não muda, ela só deixa de ser invisível. */
.sticky rect { rx: 8; }
.sticky .bg { fill: var(--sticky, #F5A524); fill-opacity: .10; stroke: var(--sticky, #F5A524); stroke-opacity: .38; stroke-width: 1; }
/* O título da nota é a cor dela puxada na direção do texto do tema: puro, o
   amarelo da sticky sobre o bege do tema claro fica em ~2,5:1 e deixa de ser
   legível. Misturar com `--txt` escurece no claro e clareia no escuro sem
   perder a identidade da cor. */
.sticky .ttl {
  fill: color-mix(in srgb, var(--sticky, #F5A524) 62%, var(--txt));
  font-family: var(--font); font-weight: 700; font-size: 11px; letter-spacing: .04em;
}
.sticky .bdy { fill: var(--txt-faint); font-family: var(--font); font-size: 8.5px; }

/* --------------------------------------------------------------------- fios
   Curva de Bézier horizontal com seta no destino, como no editor. A espessura
   é 1.6 porque em zoom afastado 1px some, e o fio é o que conta a história do
   caminho percorrido. */
.edge { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-linecap: round; }
.edge.aux { stroke-dasharray: 4 4; opacity: .7; }
.edge.ran { stroke: var(--ok); }
.edge.flowing { stroke: var(--accent); stroke-dasharray: 7 8; animation: drift 1.1s linear infinite; }
@keyframes drift { to { stroke-dashoffset: -30; } }
.edge.lit { stroke: var(--accent); stroke-width: 2.4; }
.tip { fill: var(--wire); }
.tip.ran { fill: var(--ok); }
.tip.lit { fill: var(--accent); }
.elabel {
  fill: var(--txt-faint); font-family: var(--font-num); font-size: 7.5px; text-anchor: middle;
  paint-order: stroke; stroke: var(--bg-deep); stroke-width: 3px; stroke-linejoin: round;
}
.elabel.ran { fill: var(--ok-txt); }

/* ----------------------------------------------------------------- os nós */
.nd { cursor: pointer; }
.nd .face { fill: var(--node-face); stroke: var(--node-edge); stroke-width: 1.2; }
.nd .glyph { stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.nd .nm {
  fill: var(--node-label); font-family: var(--font); font-size: 9.5px; font-weight: 600; text-anchor: middle;
}
.nd .ty { fill: var(--txt-faint); font-family: var(--font-num); font-size: 7.5px; text-anchor: middle; }
/* Tempo medido do nó, acima da caixa. Só aparece quando o nó rodou de fato —
   é o número que transforma o desenho em telemetria. */
.nd .ms {
  fill: var(--txt-faint); font-family: var(--font-num); font-size: 7.5px; text-anchor: middle;
  opacity: 0; transition: opacity .2s;
}
.nd.ran .ms, .nd.failed .ms, .nd.hot .ms { opacity: 1; }
.nd.ran .ms { fill: var(--ok-txt); }
.nd.failed .ms { fill: var(--risk-txt); }
.nd .port { fill: var(--node-face); stroke: var(--port); stroke-width: 1.3; }
.nd .plabel { fill: var(--txt-faint); font-family: var(--font-num); font-size: 7px; }

.nd.pending { opacity: .5; }
.nd.disabled .face { stroke-dasharray: 4 3; }
.nd.disabled .nm { fill: var(--txt-faint); }

/* Executado: o editor do n8n marca com a borda verde e o check embaixo. Aqui é
   igual, e o check é desenhado (não é glifo de fonte) para não depender de
   emoji nem de família instalada. */
.nd.ran .face { stroke: var(--ok); stroke-width: 1.6; }
.nd.ran .badge { opacity: 1; }
.nd.failed .face { stroke: var(--risk); stroke-width: 2.2; fill: color-mix(in srgb, var(--risk) 12%, var(--node-face)); }
.nd.failed .badge-bad { opacity: 1; }
.nd.failed { animation: alarm 1.6s ease-in-out infinite; }
@keyframes alarm { 50% { filter: drop-shadow(0 0 7px var(--risk)); } }
.nd.hot .face { stroke: var(--accent); stroke-width: 2.4; filter: drop-shadow(0 0 8px var(--accent)); }
.nd .badge, .nd .badge-bad { opacity: 0; transition: opacity .2s; }
.nd .badge circle { fill: var(--ok); }
.nd .badge path { stroke: var(--bg-deep); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.nd .badge-bad circle { fill: var(--risk); }
.nd .badge-bad path { stroke: var(--bg-deep); stroke-width: 2; fill: none; stroke-linecap: round; }

.legend {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  padding: 9px 16px; border-top: 1px solid var(--line); background: var(--surface);
  font-family: var(--font-num); font-size: 10.5px; color: var(--txt-faint);
}
.legend b { color: var(--txt-dim); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
  .edge.flowing { animation: none; }
  .nd.failed { animation: none; }
}
</style>

/* Tipo do n8n → glifo. É uma decisão de leitura, não um mapa completo: o que
   não casa cai num traço neutro em vez de inventar um ícone errado. */
function iconFor(type) {
  const t = String(type || "");
  const base = t.replace(/^@n8n\/n8n-nodes-langchain\./, "lc.").replace(/^n8n-nodes-base\./, "").replace(/^@[^/]+\/n8n-nodes-[^.]+\./, "x.");
  const map = [
    [/^lc\.agent/, "agent"], [/^lc\.lmChat|^lc\.openAi/, "llm"], [/^lc\.memory/, "memory"],
    [/^lc\.tool/, "tool"], [/^lc\.outputParser/, "parser"],
    [/^executeWorkflowTrigger|^executeWorkflow/, "subflow"],
    [/trigger$|^cron|^schedule/i, "trigger"], [/^webhook/, "webhook"],
    [/^code$|^function/, "code"], [/^if$|^filter/, "if"], [/^switch/, "switch"], [/^merge/, "merge"],
    [/^set$|^editFields/, "set"], [/^httpRequest/, "http"], [/^redis/, "redis"], [/^supabase|^postgres/, "supabase"],
    [/^wait/, "wait"], [/^noOp/, "noop"], [/^whatsApp/, "whatsapp"], [/^slack/, "slack"],
    [/^googleSheets/, "sheets"], [/elevenlabs/i, "audio"]
  ];
  for (const [re, k] of map) if (re.test(base)) return ICONS[k];
  return { c: "#8A90A6", d: ["M7 12h10"] };
}

const isTrigger = t => /trigger|webhook|cron|schedule/i.test(String(t));
const isAnnotation = t => /stickyNote/i.test(String(t));
const kindLabel = t => String(t).replace(/^@n8n\/n8n-nodes-langchain\./, "AI·").replace(/^n8n-nodes-base\./, "").replace(/^@[^/]+\/n8n-nodes-[^.]+\./, "").slice(0, 20);

/* Cor da sticky note: o n8n guarda um índice de 1 a 7. */
const STICKY = { 1: "#F5A524", 2: "#FF6B5E", 3: "#3ECF8E", 4: "#6FD1FF", 5: "#A78BFA", 6: "#FF7BC4", 7: "#7B819A" };

const NODE = 84;          // o nó do editor é quadrado; 84 mantém o rótulo legível no zoom padrão
const LABEL_GAP = 13;

const NS = "http://www.w3.org/2000/svg";
const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a || {}) n.setAttribute(k, a[k]); return n; };
const $ = s => document.querySelector(s);

const nodes = GRAPH.nodes.filter(n => !isAnnotation(n.type));
const stickies = GRAPH.nodes.filter(n => isAnnotation(n.type));
const byName = new Map(nodes.map(n => [n.name, n]));

/* As posições vêm do editor e podem estar em qualquer lugar (medido: x = −14480
   nesta instância). Normaliza pelo bounding box real dos nós executáveis — as
   sticky notes ficam de fora do cálculo, como já ficam no cockpit. */
const minX = Math.min(...nodes.map(n => n.x)), minY = Math.min(...nodes.map(n => n.y));
const maxX = Math.max(...nodes.map(n => n.x)), maxY = Math.max(...nodes.map(n => n.y));
const pos = n => ({ x: n.x - minX, y: n.y - minY });
const W = maxX - minX + NODE, H = maxY - minY + NODE;

const svg = $("#svg");
const gSticky = mk("g"), gEdges = mk("g"), gNodes = mk("g");
svg.append(gSticky, gEdges, gNodes);

/* ------------------------------------------------------------------ sticky */
for (const s of stickies) {
  const p = pos(s), info = s.sticky || {};
  const g = mk("g", { class: "sticky" });
  g.style.setProperty("--sticky", STICKY[info.color] || STICKY[7]);
  g.append(mk("rect", { class: "bg", x: p.x, y: p.y, width: info.w || 240, height: info.h || 160, rx: 8 }));
  const linhas = String(info.content || "").split("\n").filter(l => l.trim());
  const titulo = (linhas[0] || "").replace(/^#+\s*/, "").slice(0, 42);
  const corpo = (linhas.slice(1).join(" ") || "").replace(/[#*`]/g, "").slice(0, 74);
  if (titulo) g.append(Object.assign(mk("text", { class: "ttl", x: p.x + 12, y: p.y + 22 }), { textContent: titulo.toUpperCase() }));
  if (corpo) g.append(Object.assign(mk("text", { class: "bdy", x: p.x + 12, y: p.y + 38 }), { textContent: corpo }));
  gSticky.append(g);
}

/* ------------------------------------------------------------------- fios */
const edgeEls = [];
GRAPH.edges.forEach((e, i) => {
  const a = byName.get(e.from), b = byName.get(e.to);
  if (!a || !b) return;
  const pa = pos(a), pb = pos(b);
  const aux = e.port !== "main";
  // Porta principal sai pela direita e entra pela esquerda, na altura do meio.
  // As portas auxiliares do langchain (modelo, memória, ferramenta) penduram por
  // baixo, que é como o editor as desenha.
  const x1 = aux ? pa.x + NODE / 2 : pa.x + NODE, y1 = aux ? pa.y + NODE : pa.y + NODE / 2;
  const x2 = aux ? pb.x + NODE / 2 : pb.x,        y2 = aux ? pb.y + NODE : pb.y + NODE / 2;
  const dx = Math.max(30, Math.abs(x2 - x1) * 0.45);
  const d = aux
    ? `M${x1},${y1} C${x1},${y1 + 42} ${x2},${y2 + 42} ${x2},${y2}`
    : `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  const p = mk("path", { d, class: "edge" + (aux ? " aux" : "") });
  p.dataset.from = e.from; p.dataset.to = e.to;
  gEdges.append(p);

  // Seta no destino: sem ela, num grafo denso não dá para saber quem chama quem.
  if (!aux) {
    const tip = mk("path", { class: "tip", d: `M${x2 - 7},${y2 - 4} L${x2 - 1},${y2} L${x2 - 7},${y2 + 4} Z` });
    tip.dataset.to = e.to;
    gEdges.append(tip);
  }
  edgeEls.push({ el: p, to: e.to });
});

/* -------------------------------------------------------------------- nós */
for (const n of nodes) {
  const p = pos(n);
  const trg = isTrigger(n.type);
  const ic = iconFor(n.type);
  const g = mk("g", { class: "nd pending" + (trg ? " trg" : "") + (n.disabled ? " disabled" : ""), transform: `translate(${p.x},${p.y})` });
  g.dataset.name = n.name;

  // O gatilho do n8n tem o lado esquerdo em meia-lua. É a única pista de "por
  // onde isto começa" que o editor dá, e ela é lida antes de qualquer texto.
  const r = 10, R = NODE / 2;
  g.append(mk("path", {
    class: "face",
    d: trg
      ? `M${R},0 H${NODE - r} a${r},${r} 0 0 1 ${r},${r} V${NODE - r} a${r},${r} 0 0 1 -${r},${r} H${R} A${R},${R} 0 0 1 ${R},0 Z`
      : `M${r},0 H${NODE - r} a${r},${r} 0 0 1 ${r},${r} V${NODE - r} a${r},${r} 0 0 1 -${r},${r} H${r} a${r},${r} 0 0 1 -${r},-${r} V${r} a${r},${r} 0 0 1 ${r},-${r} Z`
  }));

  // Glifo centralizado: viewBox de 24 escalado para 34px de caixa óptica.
  const S = 34 / 24, ox = (NODE - 34) / 2 + (trg ? 6 : 0), oy = (NODE - 34) / 2;
  const gi = mk("g", { transform: `translate(${ox},${oy}) scale(${S})`, stroke: ic.c });
  for (const d of ic.d) gi.append(mk("path", { class: "glyph", d }));
  g.append(gi);

  // Portas. Entrada só existe se algo chega; saída só se algo sai — desenhar as
  // duas sempre encheria o canvas de pontos que não ligam a nada.
  const temEntrada = GRAPH.edges.some(e => e.to === n.name && e.port === "main");
  const temSaida = GRAPH.edges.some(e => e.from === n.name && e.port === "main");
  if (temEntrada && !trg) g.append(mk("circle", { class: "port", cx: 0, cy: NODE / 2, r: 3.4 }));
  if (temSaida) g.append(mk("circle", { class: "port", cx: NODE, cy: NODE / 2, r: 3.4 }));

  // Badges de estado, desenhados. Ficam invisíveis até a classe do nó mudar.
  const badge = mk("g", { class: "badge", transform: `translate(${NODE - 14},${NODE - 14})` });
  badge.append(mk("circle", { r: 8 }), mk("path", { d: "M-3.4,0 L-1,2.6 L3.6,-2.6" }));
  const bad = mk("g", { class: "badge-bad", transform: `translate(${NODE - 14},${NODE - 14})` });
  bad.append(mk("circle", { r: 8 }), mk("path", { d: "M0,-4 V1" }), mk("path", { d: "M0,3.4 V3.6" }));
  g.append(badge, bad);

  const nm = mk("text", { class: "nm", x: NODE / 2, y: NODE + LABEL_GAP });
  nm.textContent = n.name.length > 20 ? n.name.slice(0, 19) + "…" : n.name;
  // O editor escreve a OPERAÇÃO embaixo do nome ("update: row"), não o tipo do
  // nó — e é a operação que diz o que aquele passo faz. Quando o nó não declara
  // operação, cai no tipo, que é o que sobra de verdadeiro.
  const ty = mk("text", { class: "ty", x: NODE / 2, y: NODE + LABEL_GAP + 11 });
  ty.textContent = n.sub || kindLabel(n.type);
  g.append(nm, ty);

  // Tempo medido daquele nó na execução carregada. É dado real do replay: sem
  // execução, o número não existe e nada é desenhado.
  const rr = (GRAPH.runs || {})[n.name];
  if (rr && rr.ms != null) {
    const t = mk("text", { class: "ms", x: NODE / 2, y: -7 });
    t.textContent = rr.ms >= 1000 ? (rr.ms / 1000).toFixed(1).replace(".", ",") + "s" : rr.ms + "ms";
    g.append(t);
  }

  const t = mk("title"); t.textContent = n.name + "\n" + n.type + (n.disabled ? "\n(desativado)" : "");
  g.append(t);
  gNodes.append(g);
}

$("#meta").textContent = GRAPH.name + " · " + nodes.length + " nós · " + GRAPH.edges.length + " conexões";
$("#corner-tl").textContent = "[ " + nodes.length + " NÓS · " + GRAPH.edges.length + " CONEXÕES ]";
$("#corner-br").textContent = "[ " + (GRAPH.active ? "ATIVO" : "INATIVO") + " ]";

/* ------------------------------------------------------------------ câmera */
let box = { x: -60, y: -60, w: W + 120, h: H + 120 };
const put = () => svg.setAttribute("viewBox", `${box.x} ${box.y} ${box.w} ${box.h}`);
function fit(names) {
  const alvo = names && names.length ? nodes.filter(n => names.includes(n.name)) : nodes;
  if (!alvo.length) return;
  const xs = alvo.map(n => pos(n).x), ys = alvo.map(n => pos(n).y);
  const pad = 90;
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  const w = Math.max(420, Math.max(...xs) - x0 + NODE + pad), h = Math.max(260, Math.max(...ys) - y0 + NODE + pad + 26);
  const r = svg.getBoundingClientRect(), a = r.width / r.height;
  box = w / h < a ? { x: x0 - (h * a - w) / 2, y: y0, w: h * a, h } : { x: x0, y: y0 - (w / a - h) / 2, w, h: w / a };
  put();
}
/* Enquadrar SÓ o gatilho dá um zoom de retrato: um nó ocupando meia tela não
   informa nada sobre o fluxo. O enquadramento de entrada é o gatilho mais o
   começo do caminho que sai dele — é o que responde "por onde isto começa e
   para onde vai". */
function inicio(n = 9) {
  const ini = nodes.find(n2 => isTrigger(n2.type)) || nodes[0];
  const out = [ini.name]; let cur = ini.name;
  for (let i = 0; i < n; i++) {
    const e = GRAPH.edges.find(x => x.from === cur && x.port === "main");
    if (!e || out.includes(e.to)) break;
    out.push(e.to); cur = e.to;
  }
  return out;
}
put(); fit(inicio());

const stage = $("#stage");
let drag = null;
stage.addEventListener("pointerdown", ev => {
  drag = { x: ev.clientX, y: ev.clientY, box: { ...box } };
  stage.classList.add("drag"); stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener("pointermove", ev => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  box.x = drag.box.x - (ev.clientX - drag.x) * (box.w / r.width);
  box.y = drag.box.y - (ev.clientY - drag.y) * (box.h / r.height);
  put();
});
const soltar = () => { drag = null; stage.classList.remove("drag"); };
stage.addEventListener("pointerup", soltar);
stage.addEventListener("pointercancel", soltar);
stage.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const k = ev.deltaY > 0 ? 1.12 : 0.89;
  const mx = box.x + (ev.clientX - r.left) / r.width * box.w;
  const my = box.y + (ev.clientY - r.top) / r.height * box.h;
  box = { x: mx - (mx - box.x) * k, y: my - (my - box.y) * k, w: box.w * k, h: box.h * k };
  put();
}, { passive: false });

/* -------------------------------------------------------- estados de teste */
const ndEl = name => svg.querySelector('.nd[data-name="' + CSS.escape(name) + '"]');
function limpar() {
  svg.querySelectorAll(".nd").forEach(n => { n.classList.add("pending"); n.classList.remove("ran", "failed", "hot"); });
  svg.querySelectorAll(".edge").forEach(e => e.classList.remove("ran", "flowing", "lit"));
  svg.querySelectorAll(".tip").forEach(t => t.classList.remove("ran", "lit"));
}
/* O caminho do replay é a ORDEM REAL da execução carregada (`executionIndex`),
   não uma travessia inventada do grafo — é a diferença entre "por onde poderia
   passar" e "por onde passou". Sem execução, cai na travessia. */
function caminho() {
  const runs = GRAPH.runs || {};
  const reais = Object.entries(runs)
    .filter(([nome]) => byName.has(nome))
    .sort((a, b) => (a[1].i ?? 0) - (b[1].i ?? 0))
    .map(([nome]) => nome);
  if (reais.length > 2) return reais;

  const ini = nodes.find(n => isTrigger(n.type)) || nodes[0];
  const out = [ini.name]; let cur = ini.name;
  for (let i = 0; i < 13; i++) {
    const e = GRAPH.edges.find(x => x.from === cur && x.port === "main");
    if (!e || out.includes(e.to)) break;
    out.push(e.to); cur = e.to;
  }
  return out;
}
let timer = null;
function simular(comFalha) {
  clearInterval(timer); limpar();
  const cam = caminho(); let i = 0;
  fit(cam);
  timer = setInterval(() => {
    if (i >= cam.length) { clearInterval(timer); return; }
    const nome = cam[i], el = ndEl(nome);
    if (i > 0) {
      const ant = ndEl(cam[i - 1]);
      ant.classList.remove("hot"); ant.classList.add("ran"); ant.classList.remove("pending");
      svg.querySelectorAll('.edge[data-to="' + CSS.escape(nome) + '"]').forEach(p => { p.classList.remove("flowing"); p.classList.add("ran"); });
      svg.querySelectorAll('.tip[data-to="' + CSS.escape(nome) + '"]').forEach(p => p.classList.add("ran"));
    }
    el.classList.remove("pending");
    const ultimo = i === cam.length - 1;
    if (ultimo && comFalha) { el.classList.add("failed"); }
    else {
      el.classList.add("hot");
      svg.querySelectorAll('.edge[data-from="' + CSS.escape(nome) + '"]').forEach(p => p.classList.add("flowing"));
    }
    i++;
  }, 520);
}
$("#b-sim").onclick = () => simular(false);
$("#b-fail").onclick = () => simular(true);
$("#b-reset").onclick = () => { clearInterval(timer); limpar(); };
$("#b-fit").onclick = () => fit(null);
$("#b-sticky").onclick = ev => {
  const on = gSticky.style.display !== "none";
  gSticky.style.display = on ? "none" : "";
  ev.currentTarget.classList.toggle("on", on);
};
$("#b-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
/* Parâmetros de URL — existem para eu capturar estados sem depender de clique:
   ?theme=light  ?view=todo|inicio  ?sim=ok|fail  &passos=6
   Nada disto vai para o cockpit; é andaime de revisão. */
{
  const q = new URLSearchParams(location.search);
  if (q.get("theme")) document.documentElement.setAttribute("data-theme", q.get("theme"));
  if (q.get("view") === "todo") fit(null);
  const sim = q.get("sim");
  if (sim) {
    const passos = Math.max(2, Number(q.get("passos") || 7));
    const cam = caminho().slice(0, passos);
    limpar(); fit(cam);
    cam.forEach((nome, i) => {
      const el = ndEl(nome); if (!el) return;
      el.classList.remove("pending");
      const ultimo = i === cam.length - 1;
      if (i > 0) {
        svg.querySelectorAll('.edge[data-to="' + CSS.escape(nome) + '"]').forEach(p => p.classList.add("ran"));
        svg.querySelectorAll('.tip[data-to="' + CSS.escape(nome) + '"]').forEach(p => p.classList.add("ran"));
      }
      if (ultimo) el.classList.add(sim === "fail" ? "failed" : "hot");
      else el.classList.add("ran");
    });
  }
}

svg.addEventListener("click", ev => {
  const nd = ev.target.closest(".nd");
  if (!nd) return;
  svg.querySelectorAll(".nd.hot").forEach(n => n.classList.remove("hot"));
  svg.querySelectorAll(".edge.lit, .tip.lit").forEach(e => e.classList.remove("lit"));
  nd.classList.add("hot");
  const nome = nd.dataset.name;
  svg.querySelectorAll('.edge[data-from="' + CSS.escape(nome) + '"], .edge[data-to="' + CSS.escape(nome) + '"]').forEach(e => e.classList.add("lit"));
});
</script>
