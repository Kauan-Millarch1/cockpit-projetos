<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit / conta</title>
<script>
  /* Tema E modo gravação lidos ANTES da primeira pintura, com as MESMAS chaves
     das outras cinco páginas. Duas coisas foram consertadas aqui, e as duas eram
     divergência de um detalhe:

     · a chave era `cockpit-tema` e as outras cinco gravam `cockpit-theme`. Duas
       chaves para um fato, então o tema nunca cruzava: quem escolhia claro nas
       outras abas via a Conta abrir escura sozinha — sem casar a chave nada era
       lido e a página caía na `prefers-color-scheme` do sistema. O comentário
       que estava aqui já dizia "como nas outras páginas": a intenção estava
       certa e a chave a derrotava.

     · a gravação era lida perto do FIM do script, depois do primeiro paint. A
       tela pintava sem borrão e só então borrava. Nesta página o que pisca é o
       e-mail do dono, a fila de pedidos e a lista de quem está dentro — o exato
       dado que o modo existe para esconder de uma filmagem.

     `nav-sync-test.js` §10 afere as duas coisas em todas as páginas servidas,
     porque comentário nenhum fica vermelho e chave divergente não dói até
     alguém navegar. */
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var t = (q === "light" || q === "dark") ? q : localStorage.getItem("cockpit-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    if (localStorage.getItem("cockpit-rec") === "1") document.documentElement.setAttribute("data-rec", "1");
  } catch (e) {}
</script>
<style>

    --ok:#2FD48F; --warn:#F5A524; --risk:#FF4F5E; --cold:#59617D;
    --ok-soft:#2FD48F1a; --warn-soft:#F5A5241a; --risk-soft:#FF4F5E1a; --cold-soft:#59617D1a;

  --grid:rgba(255,255,255,.028); --grid-bold:rgba(255,255,255,.055);
  --txt:#E9EBF5; --txt-dim:#AAAFC2; --txt-faint:#777D92;
  --accent:#5865F5; --accent-soft:#5865F51f; --accent-line:#5865F55c;
  --ok:#2FD48F; --warn:#F5A524; --risk:#FF4F5E; --cold:#59617D;

/* TOKENS:FIM */

/* `.perigo` é o ÚNICO botão vermelho deste código-base. Recusar alguém é o que

.btn.perigo { color:#fff; border-color:transparent; font-weight:600;

.fld input { flex:1; min-width:0; border:0; background:transparent; outline:none;

.fld input::placeholder { color:var(--txt-faint); }
.fld .ic { color:var(--txt-faint); display:grid; place-items:center; flex:0 0 auto; }
/* `select` herda a fonte do sistema, não a da página, e sai destoando de todo o

.fld select { flex:1; min-width:0; border:0; background:transparent; outline:none;

.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);

.eyebrow { display:flex; align-items:center; gap:10px; font-family:var(--font-num);

/* etiqueta de estado. O texto usa o par `-txt` misturado com `--txt`, a receita

.tag { font-family:var(--font-num); font-size:10.5px; padding:2px 7px; border-radius:6px;
  white-space:nowrap; display:inline-block; }
.tag.ok   { color:color-mix(in srgb,var(--ok-txt) 72%,var(--txt));   background:var(--ok-soft); }
.tag.warn { color:color-mix(in srgb,var(--warn-txt) 72%,var(--txt)); background:var(--warn-soft); }
.tag.risk { color:color-mix(in srgb,var(--risk-txt) 72%,var(--txt)); background:var(--risk-soft); }
.tag.cold { color:color-mix(in srgb,var(--cold-txt) 72%,var(--txt)); background:var(--cold-soft); }

/* ══════════════════════════════════════════════════════ A TELA DE ENTRADA
   Composição própria, e não o cartão genérico que estava aqui. Três decisões:

   1. A CÁPSULA SOME quando não há sessão. Uma navegação com cinco portas que
      todas redirecionam de volta para cá é um menu que mente. Ela volta assim
      que a conta existe.
   2. O DESENHO À ESQUERDA é o vocabulário do próprio painel — nó quadrado,
      aresta curva, pulso viajando na ordem em que um fluxo executa. É a única
      prova honesta disponível: não existe usuário para depoimento, não existe
      número para estatística, e este repositório proíbe inventar os dois.
   3. TODA a animação é `transform` e `opacity`. É a regra medida da casa: uma
      animação permanente que toca propriedade de pintura custou 19% de CPU num
      ponto de 7px, e esta tela fica aberta esperando alguém digitar. */

.entrada { min-height:calc(100vh - 58px); display:grid; place-items:center; padding:40px 24px 64px; }
.entrada-cx { display:grid; grid-template-columns:minmax(0,1fr) 424px; gap:64px;
  max-width:1040px; width:100%; align-items:center; }
@media (max-width:940px) {
  .entrada-cx { grid-template-columns:minmax(0,1fr); max-width:440px; gap:32px; }
  .vitrine .desenho, .vitrine .provas { display:none; }
}

.vitrine h2 { font-size:34px; line-height:1.22; font-weight:600; letter-spacing:-.025em;
  margin:14px 0 0; max-width:15ch; }
.vitrine h2 em { font-style:normal; color:var(--accent-txt); }
.vitrine .sub { font-size:13.5px; line-height:1.65; color:var(--txt-dim); margin-top:14px; max-width:44ch; }

/* o desenho: quatro nós, três arestas, um pulso que percorre */
.desenho { margin:30px 0 26px; width:100%; max-width:400px; }
.desenho .no { fill:var(--surface); stroke:var(--line); stroke-width:1.4; }
.desenho .no.vivo { stroke:var(--accent-line); }
.desenho .ar { fill:none; stroke:var(--line); stroke-width:1.4; }
.desenho .gl { color:var(--txt-faint); }
.desenho .gl.c { color:var(--accent-txt); }
.desenho .pulso { fill:var(--accent); }
@keyframes correr { 0% { transform:translateX(0); opacity:0; }
  8% { opacity:1; } 92% { opacity:1; } 100% { transform:translateX(292px); opacity:0; } }
@keyframes acender { 0%,100% { opacity:.35; } 50% { opacity:1; } }
.desenho .pulso { animation:correr 3.4s cubic-bezier(.65,0,.35,1) infinite; }
.desenho .no.vivo { animation:acender 3.4s ease-in-out infinite; }
.desenho .no.vivo.b { animation-delay:.85s; }
.desenho .no.vivo.c { animation-delay:1.7s; }
.desenho .no.vivo.d { animation-delay:2.55s; }

.provas { display:flex; flex-direction:column; gap:13px; margin-top:4px; }
.prova { display:flex; align-items:flex-start; gap:11px; }
.prova .g { color:var(--txt-faint); flex:0 0 auto; margin-top:1px; }
.prova p { font-size:12.5px; line-height:1.55; color:var(--txt-dim); }
.prova b { color:var(--txt); font-weight:600; }

/* o cartão do formulário — mais respiro que um painel comum, porque é a única
   coisa na tela que pede uma ação */
.cartao { background:var(--surface); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:30px 30px 26px; position:relative; overflow:hidden; }
.cartao::before { content:""; position:absolute; inset:0 0 auto; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-line), transparent); }
.cartao h3 { font-size:18px; font-weight:600; letter-spacing:-.015em; }
.cartao .diz { font-size:12.5px; line-height:1.6; color:var(--txt-dim); margin-top:6px; }
.cartao .campo { display:flex; flex-direction:column; gap:7px; margin-top:22px; }
.cartao .fld { padding:10px 12px; border-radius:11px; }
.cartao .btn { height:38px; border-radius:11px; font-size:13.5px; }
.cartao .pe { margin-top:20px; padding-top:16px; border-top:1px solid var(--line-soft); }
.cartao .pe p { font-size:11.5px; line-height:1.6; color:var(--txt-faint); }

/* o estado "link enviado" */
.selo-ok { width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  background:var(--ok-soft); color:color-mix(in srgb, var(--ok-txt) 76%, var(--txt));
  border:1px solid color-mix(in srgb, var(--ok) 38%, transparent); }
.cartao .para { font-size:14px; font-weight:600; color:var(--txt); margin-top:4px;
  word-break:break-all; }
/* O bloco do "o que acontece depois" é um degrau de superfície, não uma segunda
   caixa: um cartão dentro do cartão dobraria a moldura por uma lista de três
   frases. */
.depois { margin-top:18px; padding:14px 15px; border-radius:11px;
  background:var(--surface-2); border:1px solid var(--line-soft); }
.depois .lbl { margin-bottom:8px; }
.depois p { font-size:12px; line-height:1.6; color:var(--txt-dim); }
.depois p + p { margin-top:7px; }

@media (prefers-reduced-motion: reduce) {
  .desenho .pulso, .desenho .no.vivo { animation:none; }
  .desenho .pulso { opacity:1; }
}

/* A cápsula não existe para quem não entrou: cinco portas que voltam todas para
   cá seriam um menu mentindo. */
:root[data-conta="deslogado"] .nvd,
:root[data-conta="conferindo"] .nvd { display:none; }
/* Sem sessão, a entrada ocupa a tela: o `.plate` deixa de ser um cartão no meio
   de uma folha e passa a ser a folha. */
:root[data-conta="deslogado"] .plate,
:root[data-conta="erro"] .plate { padding:0; max-width:none; }
:root[data-conta="deslogado"] .rodape,
:root[data-conta="conferindo"] .rodape { display:none; }

.plate { position:relative; z-index:1; max-width:1024px; margin:0 auto; padding:56px 24px 80px; }
.duas { display:grid; grid-template-columns:minmax(0,568px) minmax(0,352px); gap:64px;
  align-items:start; }
@media (max-width:900px) { .duas { grid-template-columns:minmax(0,1fr); gap:32px; } }

.linha { display:flex; align-items:center; gap:12px; padding:11px 14px;
  border:1px solid var(--line); border-radius:10px; background:var(--surface-2); min-width:0; }
.linha .quem { min-width:0; flex:1 1 auto; }
.linha .quem .em { font-size:13px; color:var(--txt); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.linha .quem .sub { font-size:11.5px; color:var(--txt-faint); margin-top:2px; }
.linha .acoes { display:flex; gap:8px; flex:0 0 auto; }

/* modo gravação: e-mail de terceiro é dado de outra pessoa, e esta tela vive
   aberta numa demonstração. Mesma regra do host do n8n e do nome de credencial. */
:root[data-rec="1"] .sens { filter:blur(7px); }

.vazio { padding:22px 14px; text-align:center; }

/* Os numerais são de instrumento: `--font-num` com `tabular-nums`, para a coluna
   alinhar quando o número muda de 9 para 10. */
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(112px, 1fr)); gap:10px;
  margin-top:4px; }
.kpi { padding:12px 14px; border:1px solid var(--line); border-radius:11px;
  background:var(--surface-2); }
.kpi .v { font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:26px;
  font-weight:600; letter-spacing:-.02em; line-height:1.05; }
.kpi .lbl { margin-top:5px; }

/* AVISOS — o vocabulário das outras páginas. Construído por DOM, nunca por
   innerHTML: a mensagem vem de erro de servidor e de e-mail digitado, ou seja,
   de fora. */
.avisos { position:fixed; right:18px; bottom:18px; z-index:60; display:flex;
  flex-direction:column; gap:9px; max-width:380px; }
.aviso { display:flex; align-items:flex-start; gap:9px; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow);
  font-size:12px; line-height:1.55; position:relative; overflow:hidden; }
.aviso .g { flex:0 0 auto; margin-top:1px; }
.aviso .tx { min-width:0; flex:1 1 auto; color:color-mix(in srgb, var(--txt-dim) 84%, var(--txt)); }
.aviso .x { cursor:pointer; background:none; border:0; color:var(--txt-faint); font-size:14px;
  line-height:1; padding:2px 4px; flex:0 0 auto; }
.aviso.erro   { border-color:color-mix(in srgb,var(--risk) 45%,transparent); background:var(--risk-soft); }
.aviso.erro   .g, .aviso.erro   .tx b { color:color-mix(in srgb,var(--risk-txt) 72%,var(--txt)); }
.aviso.alerta { border-color:color-mix(in srgb,var(--warn) 45%,transparent); background:var(--warn-soft); }
.aviso.alerta .g { color:color-mix(in srgb,var(--warn-txt) 72%,var(--txt)); }
.aviso.ok     { border-color:color-mix(in srgb,var(--ok) 45%,transparent); background:var(--ok-soft); }
.aviso.ok     .g { color:color-mix(in srgb,var(--ok-txt) 72%,var(--txt)); }
.aviso.info   .g { color:var(--accent-txt); }

.scrim { position:fixed; inset:0; z-index:70; background:color-mix(in srgb,var(--bg-deep) 72%,transparent);
  backdrop-filter:blur(9px); display:grid; place-items:center; padding:24px; }
.dlg { width:min(460px,100%); border-radius:16px; padding:18px 19px 16px; background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--shadow); }
.dlg h3 { font-size:15px; font-weight:600; margin-bottom:8px; }
.dlg .corpo { font-size:12.8px; line-height:1.6; color:var(--txt-dim); }
.dlg .pe { display:flex; justify-content:flex-end; gap:9px; margin-top:16px; }

.rodape { position:relative; z-index:1; max-width:1024px; margin:0 auto;
  padding:0 24px 34px; font-family:var(--font-num); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--txt-faint); }
/* ═══════════════════════════════════════════════════════ NAV — as cinco portas
   BLOCO COMPARTILHADO. Este CSS é IDÊNTICO em flows.html, tester.html,
   cockpit.html e upgrade.html — gerado por preview/aplicar-nav.js e travado por
   nav-sync-test.js. Ao mudar, rode o gerador de novo; NÃO edite uma página só,
   e nunca insira um segundo bloco (foi assim que o rabo de um bloco antigo
   ficou pendurado no flows.html e a página morreu com "Illegal return
   statement").

   A cápsula é ícone-primeiro: o rótulo existe na porta ativa, sob o cursor e no
   foco de teclado. O fundo do ativo NÃO é pintado por cada porta — é UM
   elemento que viaja, a .lente, movida por mola no JS. Enquanto cada porta
   pintava o próprio fundo não havia o que animar entre elas: o estado aparecia
   e desaparecia.

   Cor: corpo e aro da lente são --accent, que neste painel significa MOVIMENTO.
   Status (ok/warn/risk/cold) continua reservado e não entra na navegação. */
.nvd{position:relative;display:flex;align-items:center;gap:3px;padding:3px;
  border-radius:999px;flex:0 0 auto;background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line-soft)}
.nvd a{position:relative;z-index:1;display:flex;align-items:center;height:30px;
  padding:0 9px;border-radius:999px;color:var(--txt-faint);text-decoration:none;
  transition:color .22s ease}
.nvd a:hover{color:var(--txt-dim)}
.nvd a[aria-current="page"]{color:var(--txt)}
.nvd a[aria-current="page"] .ic{color:var(--accent-txt)}
.nvd a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nvd .ic{display:grid;transition:transform .3s cubic-bezier(.2,.9,.15,1)}
.nvd a[aria-current="page"] .ic{transform:translateY(-.5px)}
/* O rótulo abre por CSS e a lente NÃO é sincronizada com esta transição: ela
   persegue a geometria da porta ativa quadro a quadro, então o alvo se move
   enquanto o rótulo abre e a chegada fica arrastada. É de onde vem a sensação
   de líquido — não há keyframe de viagem em nenhum lugar.
   Abre também no foco de teclado: navegando por Tab, um ícone sozinho não diz
   para onde se vai. */
.nvd .lb{display:flex;align-items:center;gap:7px;max-width:0;overflow:hidden;
  opacity:0;white-space:nowrap;font-size:12.5px;font-weight:500;
  transition:max-width .34s cubic-bezier(.2,.9,.15,1),opacity .24s ease,
    margin-left .34s cubic-bezier(.2,.9,.15,1)}
.nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
  max-width:130px;opacity:1;margin-left:7px}
/* O atalho é anunciado no lugar onde é usado. O chip só se paga porque o atalho
   EXISTE (alt+1 a alt+5 navega): um rótulo prometendo tecla que não faz nada é pior
   que nenhum rótulo. */
.nvd kbd{font-family:var(--font-num);font-size:9px;letter-spacing:.02em;
  color:color-mix(in srgb,var(--txt-faint) 58%,var(--txt));
  padding:1px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);
  line-height:1.5}
/* ─────────────────────────────────────────────────────────── a lente de vidro
   Cinco camadas, cada uma respondendo por uma coisa que vidro faz:
     1. corpo tingido translúcido;
     2. backdrop-filter — o que está ATRÁS aparece desfocado. Por isso a lente
        fica ABAIXO das portas (z-index 0): acima, desfocaria o próprio ícone e
        o rótulo, que é o contrário do que vidro faz com o objeto que carrega;
     3. realce especular no topo, que dá volume;
     4. o aro: linha clara em cima, escura embaixo. Sombra externa NEUTRA — a
        regra da casa não abre exceção de halo colorido para vidro;
     5. refração de borda (::before): um anel de 3px onde o backdrop é mais
        desfocado, recortado com a mesma máscara xor que o .beam já usa aqui.
   --x/--w/--sx/--sy vêm da mola. A largura é animada como LARGURA mesmo: a
   lente é out-of-flow, então mudar a largura dela não reflui nada, e fazer isso
   com scaleX transformaria a cápsula numa elipse (o raio de 999px viraria oval).
   A afinação do tema claro é a base e a do escuro sobrescreve: atrás do claro o
   fundo é quase branco e chapado, onde blur não produz efeito e brightness
   pioraria — ali o vidro se lê por contrast, aro nítido e sombra interna. */
.nvd .lente{position:absolute;top:3px;left:0;height:30px;width:var(--w,30px);opacity:0;
  transform:translateX(var(--x,0)) scale(var(--sx,1),var(--sy,1));
  transform-origin:var(--org,center);
  border-radius:999px;pointer-events:none;z-index:0;
  background:
    radial-gradient(130% 170% at 28% -12%,
      color-mix(in srgb,#fff 62%,transparent), transparent 58%),
    color-mix(in srgb,var(--accent) 12%,transparent);
  backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  -webkit-backdrop-filter:blur(9px) saturate(1.5) contrast(1.06);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),
    inset 0 1.5px 0 color-mix(in srgb,#fff 90%,transparent),
    inset 0 -3px 5px -2px rgba(10,10,20,.13),
    0 3px 10px -7px rgba(10,10,20,.40)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .nvd .lente{
    background:
      radial-gradient(130% 170% at 28% -10%,
        color-mix(in srgb,#fff 17%,transparent), transparent 62%),
      color-mix(in srgb,var(--accent) 22%,transparent);
    backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
    box-shadow:
      inset 0 0 0 1px var(--accent-line),
      inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
      inset 0 -2px 3px -1px rgba(0,0,0,.22),
      0 2px 9px -6px rgba(0,0,0,.55)}
}
:root[data-theme="dark"] .nvd .lente{
  background:
    radial-gradient(130% 170% at 28% -10%,
      color-mix(in srgb,#fff 17%,transparent), transparent 62%),
    color-mix(in srgb,var(--accent) 22%,transparent);
  backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  box-shadow:
    inset 0 0 0 1px var(--accent-line),
    inset 0 1px 0 color-mix(in srgb,#fff 34%,transparent),
    inset 0 -2px 3px -1px rgba(0,0,0,.22),
    0 2px 9px -6px rgba(0,0,0,.55)}
.nvd .lente.pronta{opacity:1}
.nvd .lente::before{content:"";position:absolute;inset:0;border-radius:inherit;
  padding:3px;pointer-events:none;
  backdrop-filter:blur(2px) saturate(2.4);
  -webkit-backdrop-filter:blur(2px) saturate(2.4);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* O brilho que corre na chegada. Nasce em opacity 0 e é disparado por classe:
   um realce varrendo sozinho seria movimento sem informação atrás. */
.nvd .lente::after{content:"";position:absolute;inset:0;border-radius:inherit;
  opacity:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 34%,
    color-mix(in srgb,#fff 55%,transparent) 47%,transparent 60%)}
.nvd .lente.varre::after{animation:navvarrer .62s cubic-bezier(.2,.75,.2,1) 1}
@keyframes navvarrer{
  0%{opacity:0;transform:translateX(-40%)}
  22%{opacity:.9}
  100%{opacity:0;transform:translateX(40%)}}
/* Em tela estreita o rótulo sai de cena, inclusive o do ativo: o sufixo do
   wordmark ao lado já diz em que tela você está, e três rótulos abertos
   estouravam a barra em 390px. */
@media (max-width:620px){
  .nvd a:hover .lb,.nvd a:focus-visible .lb,.nvd a[aria-current="page"] .lb{
    max-width:0;opacity:0;margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  /* O estado fica e o vidro fica — blur parado não é movimento. Somem a viagem,
     o esticão e a varredura. A mola é desligada no JS pela mesma consulta. */
  .nvd .lb,.nvd .ic,.nvd a{transition:none}
  .nvd .lente.varre::after{animation:none}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════ NAV — a lente de vidro
   BLOCO COMPARTILHADO. Idêntico em flows.html, tester.html, cockpit.html, upgrade.html e entrar.html,
   gerado por preview/aplicar-nav.js e travado por nav-sync-test.js.

   As cinco portas são navegação DE VERDADE: clicar recarrega a página. Então a
   lente nunca seria vista viajando — cada página nasceria com ela parada no
   lugar. Ela parte da porta DE ONDE VOCÊ VEIO, guardada em sessionStorage, e
   voa até a atual no carregamento. Mesma disciplina do resto do painel: só
   anima quando há informação nova atrás (você trocou de tela); F5 na mesma
   porta não anima nada, e uma aba nova também não, porque ali você não veio de
   lugar algum.

   Nada aqui julga: a navegação não tem estado de saúde, não lê fato nenhum e
   não faz uma única chamada. */
(function () {
  "use strict";
  var nav = document.querySelector(".nvd");
  if (!nav) return;
  var lente = nav.querySelector(".lente");
  if (!lente) return;

  var CHAVE = "cockpit.nav.v1";
  var reduzir = function () {
    return matchMedia("(prefers-reduced-motion: reduce)").matches;
  };

  /* Mesmo integrador do springNumber() — passo fixo de 16ms, porque com a aba em
     segundo plano o dt real explode e a mola diverge em vez de assentar. A
     afinação é OUTRA de propósito: lá a razão de amortecimento é ~0,97, porque
     um contador que passa do valor e volta lê como dado errado; aqui é ~0,54,
     porque passar e voltar é o que faz parecer líquido. */
  var K = 170, C = 14, M = 1;
  /* Quanto a velocidade vira deformação. Medido: em 0,055 o esticão grudava no
     teto e deformação constante lê como escala fixa, não como física. */
  var ESTICA = 0.022, TETO = 0.16;

  var x = 0, vx = 0, w = 30, vw = 0, vivo = false;

  function alvo() {
    var a = nav.querySelector('[aria-current="page"]');
    if (!a) return null;
    /* Lido A CADA QUADRO: o rótulo abre por CSS, então o destino se move. */
    var ax = a.offsetLeft, aw = a.offsetWidth;
    /* Ímã: com o cursor sobre uma porta inativa a lente se inclina para ela.
       4px lê como intenção e é pouco para não parecer erro. */
    var h = nav.querySelector("a:hover");
    /* `ax` JÁ é `a.offsetLeft`: ler de novo aqui era uma quarta leitura de
       geometria por quadro, e cada uma força layout do documento inteiro. */
    if (h && h !== a) ax += (h.offsetLeft > ax ? 1 : -1) * 4;
    return { x: ax, w: aw };
  }

  /* A deformação SAI da velocidade da própria mola: estica no eixo do movimento
     e comprime no outro, volume preservado. É o que separa vidro líquido de
     pastilha com easing. A origem segue o sentido do movimento — com origem no
     centro a lente esticava para os dois lados e vazava para fora do leito. */
  function pintar(v) {
    var d = Math.min(TETO, Math.abs(v) * ESTICA / 100);
    lente.style.setProperty("--x", x.toFixed(2) + "px");
    lente.style.setProperty("--w", w.toFixed(2) + "px");
    lente.style.setProperty("--sx", (1 + d).toFixed(3));
    lente.style.setProperty("--sy", (1 - d * 0.72).toFixed(3));
    if (Math.abs(v) > 12) {
      lente.style.setProperty("--org", v > 0 ? "left center" : "right center");
    }
  }

  function assentar() {
    var t = alvo();
    if (!t) return;
    x = t.x; w = t.w; vx = 0; vw = 0;
    lente.style.setProperty("--org", "center");
    pintar(0);
  }

  function passo() {
    var t = alvo();
    if (!t) { vivo = false; return; }
    if (reduzir()) { assentar(); vivo = false; return; }
    var i, dt = 0.016;
    for (i = 0; i < 2; i++) {
      vx += ((-K * (x - t.x) - C * vx) / M) * dt; x += vx * dt;
      vw += ((-K * (w - t.w) - C * vw) / M) * dt; w += vw * dt;
    }
    pintar(vx);
    if (Math.abs(t.x - x) < 0.35 && Math.abs(vx) < 3 &&
        Math.abs(t.w - w) < 0.35 && Math.abs(vw) < 3) {
      x = t.x; w = t.w; vx = 0; vw = 0; pintar(0); vivo = false; return;
    }
    requestAnimationFrame(passo);
  }

  function acordar() { if (!vivo) { vivo = true; requestAnimationFrame(passo); } }

  var aqui = (nav.querySelector('[aria-current="page"]') || {}).dataset;
  aqui = aqui ? aqui.porta : null;

  /* A partida. Se a porta anterior desta aba não é esta, a lente nasce lá e voa
     para cá. Só então a varredura de brilho se paga: ela marca uma chegada. */
  var de = null;
  try { de = sessionStorage.getItem(CHAVE); } catch (e) { de = null; }
  var origem = de && de !== aqui ? nav.querySelector('[data-porta="' + de + '"]') : null;

  /* A PARTIDA RODA DEPOIS DA PRIMEIRA PINTURA, e isto é medição, não gosto.
     Ler `offsetLeft` durante a execução do script ANTECIPA o primeiro layout do
     documento e o torna síncrono: 209 ms de thread bloqueada no `/disco` e 126 ms
     no `/tester` (as duas funções nº 1 de JS no boot dessas telas). O `/upgrade`,
     com o dobro do CSS, custa 0 ms no mesmo ponto — a diferença é só QUANDO o
     script corre em relação ao layout já estar limpo.
     Dois quadros: o primeiro deixa o navegador fazer o layout dele, o segundo lê
     uma árvore que já existe. A lente fica invisível (`opacity:0`) até estar
     posicionada, então o adiamento não vira flash no lugar errado. */
  function partir() {
    if (origem && !reduzir()) {
      x = origem.offsetLeft; w = origem.offsetWidth; vx = 0; vw = 0;
      pintar(0);
      lente.classList.add("varre");
      acordar();
    } else {
      assentar();
    }
    lente.classList.add("pronta");
  }
  requestAnimationFrame(function () { requestAnimationFrame(partir); });
  try { if (aqui) sessionStorage.setItem(CHAVE, aqui); } catch (e) {}

  nav.addEventListener("pointerover", acordar);
  nav.addEventListener("pointerout", acordar);
  addEventListener("resize", assentar);

  /* O atalho que o chip promete. Navega de verdade; alt+dígito não digita nada
     em campo de texto, então não precisa de guarda contra o compositor. */
  addEventListener("keydown", function (ev) {
    if (!ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var i = "12345".indexOf(ev.key);
    if (i < 0) return;
    var a = nav.querySelectorAll("a")[i];
    if (!a || a.getAttribute("aria-current") === "page") return;
    ev.preventDefault();
    location.href = a.getAttribute("href");
  });
}());
</script>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   BLOCO DE JUÍZO — e nada fora daqui julga.

   `perfil.js` emite fato: tem sessão, o e-mail é este, o status gravado é
   `pendente`, o Supabase respondeu 401. A cor, o nome do estado, a frase e o
   que para em consequência são decisão desta página. Mesmo motivo de
   `BANDS`/`diagnose` no flows.html e `podeConversar` no upgrade.html: a
   definição de "pode entrar" é a parte que mais muda, e espalhá-la pelo
   servidor faz cada ajuste exigir reinício.
   ══════════════════════════════════════════════════════════════════════════ */

/* Os CINCO estados. Nenhum par pode ler igual — ver CONTRATO-PERFIL.md §2. */
function estadoConta(f) {
  /* AUSENTE NUNCA CAI NO RAMO NEGATIVO. Este repositório já pagou seis vezes por
     isso. Aqui o erro seria piscar a tela de login em toda abertura para quem já
     está logado, e o segundo pisco é o que lê como defeito. */
  if (!f || typeof f !== "object") return "conferindo";
  if (f.erro) return "erro";
  if (!f.sessao) return "deslogado";
  if (!f.perfil || typeof f.perfil.status !== "string") return "conferindo";
  if (f.perfil.status === "aprovado") return "aprovado";
  if (f.perfil.status === "recusado") return "recusado";
  if (f.perfil.status === "pendente") return "pendente";
  /* Um sexto status que ninguém previu não pode liberar por não estar na lista. */
  return "conferindo";
}

/* Seis frases distintas. `entrar-test.js` afere que são distintas, pelo mesmo
   motivo das quatro frases da banda do dossiê: uma frase repetida em dois
   estados ensina a ignorar os dois. */
const FRASE_ESTADO = {
  conferindo: "Conferindo quem está conectado…",
  deslogado:  "Ninguém conectado. Entre pelo e-mail ou pela conta Google.",
  pendente:   "Seu acesso está esperando aprovação. Nada foi recusado — ninguém decidiu ainda.",
  aprovado:   "Você está dentro.",
  recusado:   "Seu acesso foi recusado.",
  erro:       "Não consegui conferir sua conta agora. Isso é problema deste painel, não da sua conta."
};

/* O verdadeiro, num lugar só. Quem consulta NUNCA recalcula — mesma disciplina
   do rodapé do /upgrade, que lê `podeAplicar` e `aplicavel` sem redefinir
   nenhum dos dois. Duas definições divergem na primeira correção feita num lado. */
function podeEntrar(f) { return estadoConta(f) === "aprovado"; }

/* Só quem o BANCO diz que é. A tela esconder o painel é conveniência; a rota e a
   RLS recusarem são a regra. As três camadas existem de verdade. */
function ehSuperAdmin(f) {
  return Boolean(f && f.perfil && f.perfil.super_admin === true);
}

/* Admin de verdade: cargo `admin`, APROVADO e com organização. A mesma condição
   que `private.eh_admin()` cobra no banco — duas leituras divergiriam na
   primeira correção feita num lado só, e o lado divergente aqui mostraria um
   painel de equipe que a rota recusa. */
function ehAdmin(f) {
  if (ehSuperAdmin(f)) return true;
  const p = f && f.perfil;
  return Boolean(p && p.papel === "admin" && p.status === "aprovado" && p.organizacao_id);
}

function ehOperador(f) {
  return Boolean(f && f.perfil && f.perfil.papel === "operador");
}

/* O CARGO NA TELA, e `null` é um cargo — o do super admin e o de quem entrou sem
   convite de empresa. "Sem cargo" e "cargo que eu não reconheço" não podem ler
   igual, então o desconhecido diz que é desconhecido em vez de virar operador. */
const CARGO_NOME = { admin:"ADMIN", operador:"OPERADOR" };
function cargoDe(f) {
  const p = f && f.perfil;
  if (!p) return null;
  if (p.super_admin) return "SUPER ADMIN";
  if (p.papel == null) return null;
  return CARGO_NOME[p.papel] || ("CARGO DESCONHECIDO: " + p.papel);
}

/* QUEM MEXE EM INTEGRAÇÃO E CHAVE. Decisão do Kauan: admin sim, operador não.
   O TETO desta regra está logo abaixo em `INTEGRA_TETO` e a tela tem que dizê-lo,
   porque numa máquina que é da própria pessoa esconder a aba não impede nada. */
function podeIntegrar(f) { return ehAdmin(f); }

const INTEGRA_TETO =
  "Esconder esta aba impede o acidente, não o determinado: num cockpit que roda " +
  "na máquina da própria pessoa, quem tem o computador alcança a chave por fora " +
  "do navegador. O que separa de verdade é o banco (a RLS recusa) e a porta " +
  "hospedada, que ainda não existe.";

/* AS VAGAS. Decisão do Kauan, 25/08/2026, contra a minha recomendação: o teto é
   de 3 PARA SEMPRE. `vagas_usadas` sobe no convite e nunca desce — tirar alguém
   da equipe não devolve vaga, e apagar um convite não usado também não.

   Por isso a frase abaixo fala em vagas USADAS e não em pessoas ativas: são dois
   números diferentes, e mostrar "2 de 3 pessoas" quando 3 vagas já foram
   gastas faria o admin clicar num botão que o banco recusa. */
function vagas(org) {
  if (!org || typeof org.teto_operadores !== "number" || typeof org.vagas_usadas !== "number") {
    return null;   /* ausente é "não sei", nunca "zero" */
  }
  const restam = Math.max(0, org.teto_operadores - org.vagas_usadas);
  return { teto: org.teto_operadores, usadas: org.vagas_usadas, restam };
}

function FRASE_VAGAS(v) {
  if (!v) return "Não consegui ler as vagas desta organização.";
  if (v.restam === 0) return "Nenhuma vaga disponível — as " + v.teto + " já foram usadas.";
  if (v.restam === 1) return "1 vaga disponível de " + v.teto + ".";
  return v.restam + " vagas disponíveis de " + v.teto + ".";
}

/* ── QUEM ESTÁ USANDO, e por que não é o mesmo que "quem está aprovado" ──────
   Aprovado é quem PODE entrar. Usando é quem entrou. As duas levam a decisões
   opostas: 12 aprovados com 2 vistos na semana é um produto que ninguém abre, e
   um painel que dissesse "12 usuários" mostraria isso com cara de sucesso.
   `visto_em` só passou a ser escrito em 25/08/2026 — então quem entrou ANTES
   disso aparece como nunca visto, e a tela diz isso em vez de contar como
   inativo. Medição que começou ontem não pode acusar o passado. */
const PRESENCA_DIAS = 7;

function contarPessoas(todos, agora) {
  const l = Array.isArray(todos) ? todos : [];
  const corte = agora - PRESENCA_DIAS * 86400000;
  const aprovados = l.filter(p => p && p.status === "aprovado");
  const vistos = aprovados.filter(p => p.visto_em && Date.parse(p.visto_em) >= corte);
  return {
    total: l.length,
    aprovados: aprovados.length,
    pendentes: l.filter(p => p && p.status === "pendente").length,
    recusados: l.filter(p => p && p.status === "recusado").length,
    ativos: vistos.length,
    nuncaVistos: aprovados.filter(p => !p.visto_em).length
  };
}

function FRASE_ATIVOS(c) {
  if (!c.aprovados) return "Ninguém aprovado ainda.";
  const base = c.ativos === 1
    ? "1 pessoa abriu o cockpit nos últimos " + PRESENCA_DIAS + " dias"
    : c.ativos + " pessoas abriram o cockpit nos últimos " + PRESENCA_DIAS + " dias";
  /* Nunca-visto é um terceiro estado e não pode ser somado a "inativo": pode
     ser quem foi aprovado e ainda não voltou, e pode ser quem entrou antes de
     este número existir. A frase não escolhe entre os dois. */
  if (!c.nuncaVistos) return base + ".";
  /* Singular e plural escritos por extenso, nunca derivados com um "s" no fim.
     O `CLAUDE.md` já registra essa armadilha: o português não flexiona só o
     último termo, e "2 nunca foi vista" foi exatamente o que saiu na primeira
     medição desta frase. */
  const n = c.nuncaVistos;
  return base + " — " + (n === 1
    ? "1 nunca foi vista por aqui"
    : n + " nunca foram vistas por aqui") +
    " (ou entrou antes de o cockpit começar a anotar).";
}

/* A frase que aparece ANTES do clique, não depois do erro. O teto é para sempre,
   então um e-mail digitado errado queima a vaga em definitivo — e quem vai

const S = {

const $ = s => document.querySelector(s);

  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ─────────────────────────────────────────────────────────────────── avisos */
const VIDA = { ok:4500, info:6000 };
const GLIFO = { ok:"✓", info:"i", alerta:"!", erro:"⨯" };

function avisar(tipo, texto) {
  const cx = $("#avisos");
  while (cx.children.length >= 4) cx.removeChild(cx.firstChild);
  const el = document.createElement("div");
  el.className = "aviso " + tipo;
  el.setAttribute("role", tipo === "erro" ? "alert" : "status");
  el.setAttribute("aria-live", tipo === "erro" ? "assertive" : "polite");
  const g = document.createElement("span");
  g.className = "g"; g.setAttribute("aria-hidden", "true"); g.textContent = GLIFO[tipo] || "i";
  const tx = document.createElement("div");
  tx.className = "tx"; tx.textContent = texto;      /* textContent, nunca innerHTML */
  const x = document.createElement("button");
  x.className = "x"; x.type = "button"; x.setAttribute("aria-label", "fechar");
  x.textContent = "⨯"; x.onclick = () => el.remove();
  el.append(g, tx, x);
  cx.appendChild(el);
  /* `erro` e `alerta` NUNCA somem sozinhos: quem precisa ler não pode perder a
     frase. `ok` e `info` saem. */
  if (VIDA[tipo]) setTimeout(() => el.remove(), VIDA[tipo]);
}

/* ─────────────────────────────────────────── diálogo nosso, nunca do browser */
function confirmar({ titulo, corpo, acao, perigo }) {
  return new Promise(resolve => {
    const anterior = document.activeElement;
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    const dlg = document.createElement("div");
    dlg.className = "dlg";
    dlg.setAttribute("role", "dialog");
    dlg.setAttribute("aria-modal", "true");
    const h = document.createElement("h3"); h.id = "dlgt"; h.textContent = titulo;
    dlg.setAttribute("aria-labelledby", "dlgt");
    const c = document.createElement("div"); c.className = "corpo"; c.textContent = corpo;
    const pe = document.createElement("div"); pe.className = "pe";
    const cancelar = document.createElement("button");
    cancelar.className = "btn ghost"; cancelar.type = "button"; cancelar.textContent = "Cancelar";
    const ok = document.createElement("button");
    ok.className = "btn " + (perigo ? "perigo" : "prime"); ok.type = "button"; ok.textContent = acao;
    pe.append(cancelar, ok);
    dlg.append(h, c, pe);
    scrim.appendChild(dlg);

    /* `inert` no resto do body: sem isso o Tab caminha por trás do scrim, defeito
       já consertado uma vez no flows.html. */
    const outros = [...document.body.children];
    outros.forEach(n => n.setAttribute("inert", ""));
    document.body.appendChild(scrim);

    function fim(v) {
      outros.forEach(n => n.removeAttribute("inert"));
      scrim.remove();
      document.removeEventListener("keydown", tecla, true);
      if (anterior && anterior.focus) anterior.focus();
      resolve(v);
    }
    function tecla(e) {
      if (e.key === "Escape") { e.preventDefault(); fim(false); }
      if (e.key === "Tab") {
        const alvos = [cancelar, ok];
        const i = alvos.indexOf(document.activeElement);
        e.preventDefault();
        alvos[(i + (e.shiftKey ? alvos.length - 1 : 1)) % alvos.length].focus();
      }
    }
    document.addEventListener("keydown", tecla, true);
    cancelar.onclick = () => fim(false);
    ok.onclick = () => fim(true);
    scrim.onclick = e => { if (e.target === scrim) fim(false); };
    /* Destrutivo abre no Cancelar: Enter sem ler não pode recusar ninguém. */
    (perigo ? cancelar : ok).focus();
  });
}

/* ────────────────────────────────────────────────────────────────────── rede */
async function api(caminho, opcoes) {
  const r = await fetch(caminho, Object.assign({ headers: { "content-type": "application/json" } }, opcoes));
  const txt = await r.text();
  let corpo = null;
  try { corpo = txt ? JSON.parse(txt) : null; } catch (e) { corpo = null; }
  /* Um 404 responde o texto "404", e `JSON.parse("404")` DÁ CERTO — é um número
     válido. Sem esta checagem o número viraria o objeto de estado e a tela
     acusaria a conta da pessoa por um processo velho. Defeito já pago aqui. */
  /* O corpo do erro viaja junto com o `Error`, porque a tela precisa de mais que
     a frase: o `codigo` decide qual saída oferecer. Mesma ideia do `categoria`
     que o `anexos.js` já carrega para agrupar recusa de arquivo. */
  if (!corpo || typeof corpo !== "object" || Array.isArray(corpo)) {
    if (r.status === 404) {
      throw new Error("esta rota não existe no servidor que está rodando — ele subiu antes desta versão do server.js");
    }
    throw new Error("resposta inesperada do cockpit (HTTP " + r.status + ")");
  }
  if (!r.ok) {
    const e = new Error(corpo.erro || ("HTTP " + r.status));
    e.codigo = corpo.codigo || null;
    e.usarGoogle = corpo.usarGoogle === true;
    throw e;
  }
  return corpo;
}

async function carregar() {
  S.carregando = true;
  try {
    S.fato = await api("/api/perfil/eu");
  } catch (e) {
    S.fato = { sessao:false, perfil:null, erro:String(e.message || e) };
  }
  S.carregando = false;
  /* A equipe vem para o admin QUE NÃO É super admin também — é o painel dele. O
     super admin puxa os dois, porque ele enxerga a fila global e as organizações. */
  if (ehAdmin(S.fato) && S.fato.perfil && S.fato.perfil.organizacao_id) await carregarEquipe();
  if (ehSuperAdmin(S.fato)) await carregarAdmin();
  render();
}

async function carregarEquipe() {
  try {
    const r = await api("/api/perfil/equipe");
    S.equipe = r.linhas || [];
    S.org = r.org || null;
    S.convEquipe = r.convites || [];
  } catch (e) {
    S.equipe = []; S.convEquipe = [];
    avisar("alerta", "não consegui ler a sua equipe: " + e.message);
  }
}

async function carregarAdmin() {
  try {
    const r = await api("/api/perfil/pedidos");
    S.fila = r.linhas || [];
    S.convites = r.convites || [];
    S.orgs = r.organizacoes || [];
    S.todos = r.todos || [];
  } catch (e) {
    S.fila = []; S.convites = []; S.orgs = []; S.todos = [];
    avisar("alerta", "não consegui ler a fila de aprovação: " + e.message);
  }
}

function render() {
  const f = S.fato;
  const est = estadoConta(f);
  const tag = ESTADO_TAG[est];

  /* O estado da conta vira atributo da raiz. É o que faz a cápsula sumir para
     quem não entrou, sem que nenhum bloco de navegação precise saber de conta. */
  document.documentElement.setAttribute("data-conta", est);

  /* `?volta=` é para onde o portão do servidor mandou a pessoa. Devolvido só
     depois de APROVADO, e só para caminho interno: um `volta=https://…` seria
     redirecionamento aberto, e a tela de login é exatamente onde isso é
     explorado. A checagem é lista de permissão, não filtro de proibição. */
  if (est === "aprovado" && !S.voltou) {
    const alvo = new URLSearchParams(location.search).get("volta");
    if (alvo && /^\/(disco|tester|upgrade|integracoes)?$/.test(alvo)) {
      S.voltou = true;
      location.replace(alvo);
      return;
    }
  }

  $("#quem").textContent = (f && f.perfil && f.perfil.email)
    ? f.perfil.email
    : (est === "conferindo" ? "conferindo…" : "ninguém conectado");
  $("#quem").className = "lbl meta" + (f && f.perfil && f.perfil.email ? " sens" : "");

  const app = $("#app");
  app.innerHTML = "";
  app.appendChild(
    est === "deslogado" || est === "erro" ? telaEntrar(est)
    : est === "conferindo" ? telaConferindo()
    : est === "pendente"   ? telaEspera(f)
    : est === "recusado"   ? telaRecusado(f)
    : telaDentro(f)
  );

  $("#rodape").textContent =
    "[ COCKPIT · 127.0.0.1:4317 · NODE 22 · ZERO DEPENDÊNCIA · " + tag.txt + " ]";
}

/* O desenho: quatro nós na ordem em que um fluxo executa, e um pulso que os

function desenhoFluxo() {

  const G = {

function telaEntrar(est) {
  const cx = document.createElement("div");
  cx.className = "entrada";

  /* ── esquerda: o que este painel é ─────────────────────────────────────── */

  h.innerHTML = "Seus fluxos do n8n, <em>vistos por dentro</em>.";

  sub.className = "sub";
  sub.textContent = "O painel diz qual fluxo quebrou e em que nó, escreve a correção com uma sessão de IA na sua máquina, e só escreve no n8n depois que você aprovar o diff na tela.";
  vit.appendChild(sub);

  vit.appendChild(desenhoFluxo());

  const provas = document.createElement("div");
  provas.className = "provas";
  const LINHAS = [
    [ICO.olho,   "Lê as execuções e agrupa as falhas por assinatura — o mesmo erro em dois fluxos é um defeito só."],
    [ICO.chave,  "A chave do n8n fica na sua máquina. A sessão de IA roda sem rede e nunca vê credencial."],
    [ICO.escudo, "Nada é escrito no n8n sem um clique seu, e o backup fica para desfazer."]
  ];
  for (const [g, txt] of LINHAS) {
    const l = document.createElement("div");
    l.className = "prova";
    const gi = document.createElement("span");
    gi.className = "g"; gi.setAttribute("aria-hidden", "true"); gi.innerHTML = g;
    const p = document.createElement("p");
    p.textContent = txt;                      /* textContent: nada aqui vem de fora, mas o hábito é o hábito */
    l.append(gi, p);
    provas.appendChild(l);
  }
  vit.appendChild(provas);
  grade.appendChild(vit);

  /* ── direita: a única coisa que pede ação ──────────────────────────────── */
  /* Depois de pedir o link, o CARTÃO INTEIRO troca. Antes disto o único sinal
     era um aviso no canto da tela, e um aviso que some em 4,5s não responde a
     pergunta que a pessoa está fazendo — "foi?". A tela tem que continuar
     dizendo que foi, e dizer o que vem depois. */
  if (S.enviadoPara) { grade.appendChild(cartaoEnviado()); cx.appendChild(grade); return cx; }

  const card = document.createElement("section");
  card.className = "cartao";

  const t = document.createElement("h3");
  t.textContent = "Entrar";
  card.appendChild(t);

  const d = document.createElement("p");
  d.className = "diz";
  d.textContent = "Sem senha. Você recebe um link que serve uma vez só.";
  card.appendChild(d);

  if (est === "erro") {
    const a = document.createElement("p");
    a.className = "diz";
    a.style.color = "color-mix(in srgb, var(--warn-txt) 72%, var(--txt))";
    a.textContent = FRASE_ESTADO.erro + " (" + (S.fato && S.fato.erro ? S.fato.erro : "sem detalhe") + ")";
    card.appendChild(a);
  }

  /* Aviso ANCORADO, não no canto: o problema pertence a este campo, e a regra
     desta casa é que erro com lugar fica no lugar. E ele NÃO some sozinho —
     `alerta` nunca tem contagem, porque quem precisa ler não pode perder a
     frase enquanto procura o outro botão. */
  if (S.emailNoTeto) {
    const av = document.createElement("div");
    av.className = "aviso alerta";
    av.style.marginTop = "14px";
    const g = document.createElement("span");
    g.className = "g"; g.setAttribute("aria-hidden", "true"); g.textContent = "!";
    const tx = document.createElement("div");
    tx.className = "tx";
    tx.textContent = "O envio de e-mail está no teto da hora. Esse limite é do serviço embutido do Supabase e vale para o projeto inteiro — esperar não adianta se outra pessoa já gastou os envios. Entre pelo Google abaixo.";
    av.append(g, tx);
    card.appendChild(av);
  }

  const campo = document.createElement("div");
  campo.className = "campo";
  campo.innerHTML =
    '<label class="lbl" for="mail">Seu e-mail</label>' +
    '<div class="fld"><span class="ic" aria-hidden="true">' + ICO.mail + '</span>' +
    '<input id="mail" type="email" autocomplete="email" placeholder="voce@empresa.com"></div>';
  card.appendChild(campo);

  const bLink = document.createElement("button");
  bLink.className = "btn prime wide"; bLink.type = "button"; bLink.id = "blink";
  bLink.style.marginTop = "12px";
  bLink.textContent = "Enviar link de entrada";
  bLink.onclick = enviarLink;
  card.appendChild(bLink);

  const ou = document.createElement("div");
  ou.className = "ou";
  ou.innerHTML = '<i></i><span>ou</span><i></i>';
  card.appendChild(ou);

  const bG = document.createElement("button");
  bG.className = "btn wide"; bG.type = "button";
  bG.innerHTML = '<span aria-hidden="true" style="display:grid; place-items:center; color:var(--txt-dim);">' +
    ICO.google + '</span>Continuar com Google';
  bG.onclick = entrarGoogle;
  card.appendChild(bG);

  const pe = document.createElement("div");
  pe.className = "pe";
  const p1 = document.createElement("p");
  /* Duas verdades que a pessoa precisa ANTES de clicar, não depois do erro:
     que entrar não é o mesmo que ser aprovado, e que o botão do Google hoje só
     serve para quem está na lista de teste. Esconder a segunda faria ela culpar
     a própria conta Google por uma configuração nossa. */
  p1.textContent = "Se ninguém liberou o seu e-mail ainda, você entra do mesmo jeito e cai numa tela de espera — quem decide é o super admin. O botão do Google ainda só funciona para quem está na lista de teste do app; o link por e-mail funciona para qualquer endereço.";
  pe.appendChild(p1);
  card.appendChild(pe);

  grade.appendChild(card);
  cx.appendChild(grade);
  return cx;
}

/* O estado depois do envio. Ele responde três perguntas, nesta ordem, porque é
   a ordem em que elas aparecem na cabeça de quem acabou de clicar:
   foi? · e agora? · e depois que eu clicar no link? */
function cartaoEnviado() {
  const card = document.createElement("section");
  card.className = "cartao";

  const selo = document.createElement("div");
  selo.className = "selo-ok";
  selo.setAttribute("aria-hidden", "true");
  selo.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.4 4.4L19 7.4"/></svg>';
  card.appendChild(selo);

  const t = document.createElement("h3");
  t.style.marginTop = "14px";
  t.textContent = "Link enviado";
  card.appendChild(t);

  const para = document.createElement("p");
  para.className = "para sens";
  /* `textContent`: é um endereço digitado por quem está na tela, ou seja, texto
     de fora. E `sens` porque esta tela vive aberta numa demonstração. */
  para.textContent = S.enviadoPara;
  card.appendChild(para);

  const d = document.createElement("p");
  d.className = "diz";
  d.textContent = "Abra o e-mail e clique no link. Ele serve uma vez só. Se não chegar em um minuto, olhe o spam — o remetente é o Supabase, não o cockpit.";
  card.appendChild(d);

  /* A pergunta que o Kauan fez olhando esta tela: "e quando é aceito, a pessoa
     entra como?". A resposta tem que estar aqui, antes de a pessoa clicar no
     link — não depois, na tela de espera, quando já não há o que fazer. */
  const dep = document.createElement("div");
  dep.className = "depois";
  const dt = document.createElement("div");
  dt.className = "lbl";
  dt.textContent = "o que acontece depois";
  dep.appendChild(dt);
  for (const linha of [
    "Clicando no link, você entra. Se alguém já tinha liberado o seu e-mail, você entra direto.",
    "Se não, você cai numa tela de espera e o seu pedido vai para a fila do super admin.",
    "É ele quem decide, na hora de aprovar, se você entra como admin de uma equipe, como operador, ou sem cargo nenhum. Sem cargo você usa o painel e não gerencia ninguém."
  ]) {
    const p = document.createElement("p");
    p.textContent = linha;
    dep.appendChild(p);
  }
  card.appendChild(dep);

  const pe = document.createElement("div");
  pe.style.cssText = "display:flex; gap:9px; margin-top:18px;";
  const dn = document.createElement("button");
  dn.className = "btn"; dn.type = "button"; dn.textContent = "Enviar de novo";
  dn.onclick = () => { const e = S.enviadoPara; S.enviadoPara = null; render(); const c = $("#mail"); if (c) c.value = e; enviarLink(); };
  const outro = document.createElement("button");
  outro.className = "btn ghost"; outro.type = "button"; outro.textContent = "Usar outro e-mail";
  outro.onclick = () => { S.enviadoPara = null; render(); const c = $("#mail"); if (c) c.focus(); };
  pe.append(dn, outro);
  card.appendChild(pe);

  return card;
}

  if (f.org) {

  } else {
    p.textContent = f.perfil.super_admin
      ? "Você é o super admin: aprova admin, cria organização e enxerga todas as equipes. Você não pertence a nenhuma organização, de propósito."

  /* O operador tem que saber por que NÃO vê a aba de integrações. Some sem
     explicação, ele conclui que o painel está quebrado e pede ajuda pelo motivo
     errado. */
  if (!podeIntegrar(f)) {
    const semInt = document.createElement("p");

    semInt.textContent = "A aba de integrações não aparece para você: chave de API e conexão com o n8n são do admin da sua equipe.";
    card.appendChild(semInt);
  }

  frag.appendChild(card);

  if (ehAdmin(f) && f.perfil.organizacao_id) frag.appendChild(painelEquipe(f));
  if (ehSuperAdmin(f)) frag.appendChild(painelAdmin(f));
  return frag;
}

function painelEquipe(f) {
  const frag = document.createDocumentFragment();
  const v = vagas(S.org);

  const sec = document.createElement("section");
  sec.className = "panel";
  sec.style.cssText = "padding:26px 30px 24px; margin-top:20px;";
  sec.append(bloco("02", "Sua equipe", v ? v.usadas + " / " + v.teto + " VAGAS" : "VAGAS: NÃO SEI"));

  /* A contagem de vagas em destaque, porque é o número que decide o clique. */
  const chip = document.createElement("span");
  chip.className = "tag " + (!v ? "cold" : v.restam === 0 ? "risk" : v.restam === 1 ? "warn" : "ok");
  chip.textContent = FRASE_VAGAS(v);
  sec.appendChild(chip);

  const explic = document.createElement("p");
  explic.className = "say"; explic.style.marginTop = "12px";
  explic.textContent = VAGA_AVISO;
  sec.appendChild(explic);

  /* quem já está */
  const pessoas = (S.equipe || []).filter(x => x.id !== f.perfil.id);
  const lista = document.createElement("div");
  lista.style.cssText = "display:flex; flex-direction:column; gap:9px; margin-top:16px;";
  if (!pessoas.length && !(S.convEquipe || []).length) {
    const vz = document.createElement("div");
    vz.className = "vazio say";
    vz.textContent = "Ninguém na equipe ainda. Convide pelo e-mail abaixo — quem você convidar entra direto, sem passar por aprovação de mais ninguém.";
    lista.appendChild(vz);
  }
  for (const x of pessoas) lista.appendChild(linhaEquipe(x, f));
  for (const c of (S.convEquipe || [])) lista.appendChild(linhaConvitePendente(c));
  sec.appendChild(lista);

  /* convidar */
  const conv = document.createElement("div");
  conv.style.cssText = "display:flex; gap:9px; margin-top:16px; align-items:center;";
  conv.innerHTML =
    '<div class="fld" style="flex:1 1 auto;"><span class="ic" aria-hidden="true">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.4" width="18" height="13.2" rx="2.2"/><path d="M3.7 7.3 12 13l8.3-5.7"/></svg>' +
    '</span><input id="eqmail" type="email" autocomplete="off" placeholder="pessoa@suaempresa.com"></div>';
  const b = document.createElement("button");
  b.className = "btn prime"; b.type = "button";
  b.textContent = "Convidar operador";
  /* Sem vaga o botão fica desabilitado E a frase acima diz por quê. Um botão
     habilitado que o banco recusa ensina a desconfiar da tela. */
  if (v && v.restam === 0) { b.disabled = true; b.title = "as vagas acabaram"; }
  b.onclick = () => convidarOperador(v);
  conv.appendChild(b);
  sec.appendChild(conv);

  frag.appendChild(sec);
  return frag;
}

function linhaEquipe(x, f) {
  const l = document.createElement("div");
  l.className = "linha";
  const q = document.createElement("div");
  q.className = "quem";
  const e1 = document.createElement("div");
  e1.className = "em sens";
  e1.textContent = x.email + (x.nome ? " · " + x.nome : "");
  const e2 = document.createElement("div");
  e2.className = "sub";
  e2.textContent = (CARGO_NOME[x.papel] || "SEM CARGO").toLowerCase() + " · " + x.status;
  q.append(e1, e2);
  l.appendChild(q);

  const acoes = document.createElement("div");
  acoes.className = "acoes";
  /* Admin não decide sobre admin nem sobre o super admin — o banco recusa, e
     mostrar o botão faria a tela prometer o que a RLS nega. */
  if (!x.super_admin && x.papel !== "admin") {
    const tirar = document.createElement("button");
    tirar.className = "btn ghost"; tirar.type = "button";
    tirar.textContent = x.status === "recusado" ? "Devolver acesso" : "Tirar do painel";
    tirar.onclick = () => decidir(x, x.status === "recusado");
    acoes.appendChild(tirar);
  }
  l.appendChild(acoes);
  return l;

function linhaConvitePendente(c) {
  const l = document.createElement("div");
  l.className = "linha";
  l.style.borderStyle = "dashed";
  const q = document.createElement("div");
  q.className = "quem";
  const e1 = document.createElement("div");
  e1.className = "em sens"; e1.textContent = c.email;
  const e2 = document.createElement("div");
  e2.className = "sub";
  /* A vaga JÁ FOI consumida aqui, mesmo sem ninguém ter entrado. Dizer isso é o
     que evita a pergunta "por que só tenho 1 vaga se só tem 1 pessoa". */
  e2.textContent = "convidado, ainda não entrou — a vaga já está reservada";
  q.append(e1, e2);
  l.appendChild(q);
  return l;
}

async function convidarOperador(v) {
  const campo = $("#eqmail");
  const email = (campo && campo.value || "").trim();
  if (!email) { avisar("alerta", "escreva o e-mail de quem você quer convidar."); return; }

  const ok = await confirmar({
    titulo: "Convidar " + email + "?",
    corpo: "Esta pessoa entra direto na sua equipe como operador, sem passar por mais ninguém. " +
      (v ? "Isso consome 1 das " + v.restam + " vaga(s) que restam, e " : "Isso consome uma vaga, e ") +
      "a vaga NÃO volta — nem se você tirar essa pessoa depois, nem se o e-mail estiver errado. Confira o endereço.",
    acao: "Convidar",
    perigo: false
  });
  if (!ok) return;

  try {
    await api("/api/perfil/equipe/convidar", { method:"POST", body: JSON.stringify({ email }) });
    avisar("ok", "convidado. Quando entrar, já entra como operador da sua equipe.");
    campo.value = "";
    await carregarEquipe();
    render();
  } catch (e) {
    avisar("erro", "não consegui convidar: " + e.message);
  }
}

function quando(iso) {
  if (!iso) return "em data desconhecida";
  const d = new Date(iso);
  if (isNaN(d)) return "em data desconhecida";
  const s = Math.round((Date.now() - d.getTime()) / 1000);
  if (s < 60) return "agora";
  if (s < 3600) return "há " + Math.round(s / 60) + " min";
  if (s < 86400) return "há " + Math.round(s / 3600) + " h";
  return "há " + Math.round(s / 86400) + " d";
}

async function enviarLink() {
  const campo = $("#mail");
  const email = (campo && campo.value || "").trim();
  if (!email) { avisar("alerta", "escreva o seu e-mail antes."); return; }
  if (S.enviando) return;
  S.enviando = true;
  const b = $("#blink");
  if (b) { b.disabled = true; b.textContent = "Enviando…"; }
  try {
    await api("/api/perfil/entrar/email", { method:"POST", body: JSON.stringify({ email }) });
    /* A MESMA tela para e-mail conhecido e desconhecido. Telas diferentes
       transformariam esta em um oráculo de "esta pessoa tem conta aqui", que é
       vazamento sobre terceiro e não sobre quem perguntou — e é por isso que o
       texto diz "abra o e-mail" e nunca "sua conta existe". */
    S.enviadoPara = email;
    render();
  } catch (e) {
    avisar("erro", e.message);
    /* Com o e-mail no teto do projeto, insistir no botão do e-mail é insistir no
       que não vai funcionar nesta hora. A tela passa a apontar a outra porta —
       e diz por que, em vez de só empurrar. */
    if (e.usarGoogle) S.emailNoTeto = true;
    render();
  } finally {
    S.enviando = false;
    if (b) { b.disabled = false; b.textContent = "Enviar link de entrada"; }
  }
}

    window.location.href = r.url;   /* navegação, e só depois de ter a URL */

async function decidir(p, aprovar) {
  let extra = null;

  /* APROVAR É O MOMENTO DE DECIDIR QUEM A PESSOA É. Antes disto, aprovar só
     mexia no `status` e a pessoa entrava sem cargo e sem empresa, sem que nada
     na tela dissesse isso — foi a pergunta do Kauan olhando o login: "e quando
     é aceito, a pessoa entra como?". Duas decisões separadas para um ato só é
     como se esquece a segunda. Só o super admin escolhe cargo; um admin
     devolvendo acesso a alguém da equipe dele não mexe em cargo nenhum. */
  if (aprovar && ehSuperAdmin(S.fato)) {
    extra = await pedirCargo(p.email);
    if (!extra) return;
  } else {
    const ok = await confirmar({
      titulo: aprovar ? "Devolver o acesso?" : "Tirar do painel?",
      corpo: aprovar
        ? p.email + " volta a entrar. Nada é apagado e você pode tirar de novo."
        : p.email + " deixa de entrar e vê uma tela dizendo que foi recusado. A conta não é apagada, e a vaga NÃO volta — o teto é para sempre.",
      acao: aprovar ? "Devolver" : "Tirar",
      perigo: !aprovar
    });
    if (!ok) return;
  }

  let motivo = null;
  if (!aprovar) motivo = await pedirMotivo(p.email);

  const corpo = { id: p.id, aprovar, motivo };
  if (extra) { corpo.papel = extra.papel; corpo.organizacao_id = extra.orgId; }

  try {
    await api("/api/perfil/decidir", { method:"POST", body: JSON.stringify(corpo) });
    avisar("ok", aprovar ? "aprovado." : "recusado.");
    if (ehSuperAdmin(S.fato)) await carregarAdmin();
    if (S.fato.perfil && S.fato.perfil.organizacao_id) await carregarEquipe();
    render();
  } catch (e) {
    avisar("erro", "não consegui gravar a decisão: " + e.message);
  }
}

/* O diálogo que responde "entra como?". Devolve `{papel, orgId}` ou `null` se
   cancelou. `papel: null` é uma escolha legítima e está rotulada — sem cargo é
   um estado real, não a ausência de uma decisão. */
function pedirCargo(email) {
  return new Promise(resolve => {
    const anterior = document.activeElement;
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    const dlg = document.createElement("div");
    dlg.className = "dlg";
    dlg.setAttribute("role", "dialog");
    dlg.setAttribute("aria-modal", "true");
    dlg.setAttribute("aria-labelledby", "cgt");

    const h = document.createElement("h3");
    h.id = "cgt"; h.textContent = "Aprovar — e entrar como o quê?";
    const c = document.createElement("div");
    c.className = "corpo";
    c.textContent = email + " passa a entrar no painel. Escolha agora o que essa pessoa é, porque é isso que decide o que ela vê.";

    const linha = document.createElement("div");
    linha.style.cssText = "display:flex; gap:9px; margin-top:14px;";
    const fp = document.createElement("div");
    fp.className = "fld"; fp.style.flex = "1 1 0";
    const sp = document.createElement("select");
    sp.setAttribute("aria-label", "Cargo");
    for (const [v, txt] of [["", "sem cargo"], ["admin", "admin"], ["operador", "operador"]]) {
      const o = document.createElement("option"); o.value = v; o.textContent = txt; sp.appendChild(o);
    }
    fp.appendChild(sp);
    const fo = document.createElement("div");
    fo.className = "fld"; fo.style.flex = "1 1 0";
    const so = document.createElement("select");
    so.setAttribute("aria-label", "Organização");
    const vazia = document.createElement("option");
    vazia.value = ""; vazia.textContent = "sem organização";
    so.appendChild(vazia);
    for (const o of (S.orgs || [])) {
      const op = document.createElement("option");
      op.value = o.id;
      op.textContent = o.nome + " (" + o.vagas_usadas + "/" + o.teto_operadores + ")";
      so.appendChild(op);
    }
    fo.appendChild(so);
    linha.append(fp, fo);

    /* A frase muda com a escolha, porque é ela que carrega a consequência —
       principalmente a vaga, que não volta. */
    const nota = document.createElement("p");
    nota.className = "corpo";
    nota.style.marginTop = "12px";
    function repintar() {
      const o = (S.orgs || []).find(x => x.id === so.value);
      const v = vagas(o);
      if (sp.value === "admin") {
        nota.textContent = "Admin gerencia a equipe da organização escolhida, convida operadores e é o único que mexe em chave e integração. Não consome vaga.";
      } else if (sp.value === "operador") {
        nota.textContent = "Operador usa o painel para trabalhar e não vê chave nem integração. " +
          (v ? "Consome 1 das " + v.restam + " vaga(s) de " + o.nome + ", e a vaga não volta." : "Escolha a organização.");
      } else {
        nota.textContent = "Sem cargo: entra, usa o painel, não gerencia ninguém e não vê integrações. Você pode dar um cargo depois.";
      }
      okb.disabled = Boolean(sp.value) && !so.value;
      okb.title = okb.disabled ? "cargo exige organização" : "";
    }
    sp.onchange = repintar; so.onchange = repintar;

    const pe = document.createElement("div"); pe.className = "pe";
    const cancelar = document.createElement("button");
    cancelar.className = "btn ghost"; cancelar.type = "button"; cancelar.textContent = "Cancelar";
    const okb = document.createElement("button");
    okb.className = "btn prime"; okb.type = "button"; okb.textContent = "Aprovar";
    pe.append(cancelar, okb);

    dlg.append(h, c, linha, nota, pe);
    scrim.appendChild(dlg);
    const outros = [...document.body.children];
    outros.forEach(n => n.setAttribute("inert", ""));
    document.body.appendChild(scrim);
    repintar();

    function fim(v) {
      outros.forEach(n => n.removeAttribute("inert"));
      scrim.remove();
      document.removeEventListener("keydown", tecla, true);
      if (anterior && anterior.focus) anterior.focus();
      resolve(v);
    }
    function tecla(e) { if (e.key === "Escape") { e.preventDefault(); fim(null); } }
    document.addEventListener("keydown", tecla, true);
    cancelar.onclick = () => fim(null);
    okb.onclick = () => fim({ papel: sp.value || null, orgId: so.value || null });
    scrim.onclick = e => { if (e.target === scrim) fim(null); };
    sp.focus();
  });
}

/* O motivo é opcional de propósito: fricção obrigatória mata o hábito. Mas ele é
   pedido ANTES de gravar, enquanto a pessoa ainda está no contexto — mesma
   decisão do bilhete de correção no quadro de erros. */

    const gravar = document.createElement("button");
    gravar.className = "btn prime"; gravar.type = "button"; gravar.textContent = "Gravar";
    pe.append(pular, gravar);
    dlg.append(h, c, f, pe);
    scrim.appendChild(dlg);
    const outros = [...document.body.children];
    outros.forEach(n => n.setAttribute("inert", ""));
    document.body.appendChild(scrim);
    function fim(v) {
      outros.forEach(n => n.removeAttribute("inert"));
      scrim.remove();
      document.removeEventListener("keydown", tecla, true);
      if (anterior && anterior.focus) anterior.focus();
      resolve(v);
    }
    function tecla(e) { if (e.key === "Escape") { e.preventDefault(); fim(null); } }
    document.addEventListener("keydown", tecla, true);
    pular.onclick = () => fim(null);
    gravar.onclick = () => fim(i.value.trim() || null);
    scrim.onclick = e => { if (e.target === scrim) fim(null); };
    i.focus();
  });
}

async function liberarEmail() {
  const campo = $("#conv");
  const email = (campo && campo.value || "").trim();
  const papel = ($("#convpapel") && $("#convpapel").value) || null;
  const org = ($("#convorg") && $("#convorg").value) || null;
  if (!email) { avisar("alerta", "escreva o e-mail que você quer liberar."); return; }
  /* Recusa antes de gastar a viagem, e nomeia o que falta — a rota cobra o mesmo,
     e as duas frases dizem a mesma coisa de propósito. */
  if (papel && !org) { avisar("alerta", "escolha a organização deste cargo."); return; }

  if (papel === "operador") {
    const o = (S.orgs || []).find(x => x.id === org);
    const v = vagas(o);
    const ok = await confirmar({
      titulo: "Liberar " + email + " como operador?",
      corpo: (v ? "Isso consome 1 das " + v.restam + " vaga(s) que restam em " + o.nome + ". " : "") +
        "A vaga não volta — nem tirando a pessoa depois, nem se o e-mail estiver errado.",
      acao: "Liberar", perigo: false
    });
    if (!ok) return;
  }

  try {
    await api("/api/perfil/convite", {
      method:"POST",
      body: JSON.stringify({ email, papel: papel || null, organizacao_id: org || null })
    });
    avisar("ok", "liberado. Quando essa pessoa entrar, ela já entra aprovada" +
      (papel ? " como " + papel + "." : "."));
    campo.value = "";
    await carregarAdmin();
    render();
  } catch (e) {
    avisar("erro", "não consegui liberar: " + e.message);
  }
}

async function criarOrg() {
  const campo = $("#orgnome");
  const nome = (campo && campo.value || "").trim();
  if (!nome) { avisar("alerta", "dê um nome à organização."); return; }
  try {
    await api("/api/perfil/organizacoes", { method:"POST", body: JSON.stringify({ nome }) });
    avisar("ok", "organização criada com 3 vagas de operador.");
    campo.value = "";
    await carregarAdmin();
    render();
  } catch (e) {
    avisar("erro", "não consegui criar: " + e.message);
  }
}

/* ─────────────────────────────────────────────────────────── chrome da página */

$("#tema").onclick = () => {
  const r = document.documentElement;
  const escuro = getComputedStyle(r).getPropertyValue("--bg").trim().toLowerCase().startsWith("#06");
  const novo = escuro ? "light" : "dark";
  r.setAttribute("data-theme", novo);
  try { localStorage.setItem("cockpit-theme", novo); } catch (e) {}
};

/* Modo gravação: o estado é do produto, compartilhado com as outras páginas pela
   mesma chave. A LEITURA subiu para o <head> — aqui ela chegava depois do
   primeiro paint e a tela piscava o dado sem borrão. Só o botão fica. */
$("#rec").onclick = () => {
  const r = document.documentElement;
  const ligado = r.getAttribute("data-rec") === "1";
  if (ligado) r.removeAttribute("data-rec"); else r.setAttribute("data-rec", "1");
  try { localStorage.setItem("cockpit-rec", ligado ? "0" : "1"); } catch (e) {}
};

/* Um `?erro=` na volta do callback vira aviso, e o callback nunca imprime o
   token na barra de endereços — quem trocou o código foi o servidor. */
(function () {
  const q = new URLSearchParams(location.search);
  const err = q.get("erro");
  if (err) {
    avisar("erro", err);
    history.replaceState(null, "", location.pathname);
  } else if (q.get("ok") === "1") {
    history.replaceState(null, "", location.pathname);
  }
})();

render();
carregar();
</script>
